<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô phỏng – Lớp 6 Bài 7: Lựa chọn sử dụng AI phù hợp</title>
<style>
:root{--o:#ff8a2b;--od:#d35400;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#fff7ec}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#ffe9cc,transparent 40%),radial-gradient(circle at 100% 20%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,#ff8a2b,#ff6a3d);color:#fff;box-shadow:0 3px 10px #0002}

.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1000px;margin:0 auto;align-items:center}
.node{flex:1;text-align:center;font-size:12px;cursor:pointer;position:relative}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1000px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:330px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}

.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:130px;height:130px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin-bottom:10px}

.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px}
.m1 i{background:var(--g)}.m2 i{background:var(--r)}.m3 i{background:#4aa3ff}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:760px){.board{grid-template-columns:1fr}}
.zone{min-height:200px;border-radius:16px;padding:10px;border:3px dashed;transition:.2s}.zone h4{margin:0 0 8px;text-align:center}.z0{border-color:var(--g);background:#eefcf3}.z1{border-color:var(--y);background:#fff9e6}.z2{border-color:var(--r);background:#fff0ef}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #ff8a2b55}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:10px;background:#f1f5f9;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #ff8a2b66}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);animation:shake .4s}
.zone .tcard{margin-bottom:6px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px}textarea{min-height:60px}
.cmt{background:linear-gradient(135deg,#fff8e1,#ffe0b2);border:3px solid var(--o);border-radius:18px;padding:16px;max-width:520px;margin:12px auto;text-align:center}
.badge{display:inline-block;font-size:34px;margin:4px;filter:grayscale(1);opacity:.4;transition:.5s}.badge.on{filter:none;opacity:1;transform:scale(1.15)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px">🧭</div><div><h1>Bài 7. Lựa chọn sử dụng AI phù hợp – Lớp 6</h1><small>Phần mềm mô phỏng • Giáo dục AI • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu</small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>

<script>

  {t:'Tự viết hoàn toàn, không dùng AI',ch:[30,0,15],ai:null,v:'good',fb:'Rất tốt cho việc luyện viết. Không dùng AI cũng là một lựa chọn.'}]},
 {n:'Lan',c:'#f06292',task:'Luyện phát âm “thirteen” / “thirty”',opts:[
  {t:'Dùng ứng dụng AI nghe đọc, chỉ chỗ nhấn sai; Lan tự đọc lại đến khi đúng',ch:[25,0,15],ai:['Lan đọc: “thirty”…','Chú ý nhấn âm đầu ở “thirty”, nhấn âm sau ở “thirteen”. Thử lại nhé!'],v:'good',fb:'AI chỉ ra lỗi, Lan vẫn tự luyện – hợp lí.'},
  {t:'Nhờ AI đọc hộ rồi nộp bản ghi âm của AI như của mình',ch:[-25,50,-35],ai:['Đọc giúp mình rồi mình nộp.','Đã tạo bản ghi âm giọng chuẩn.'],v:'bad',fb:'Lan không luyện được và nộp sản phẩm không phải của mình.'}]},
 {n:'Tuấn',c:'#66bb6a',task:'Luyện tính nhẩm theo bài cô giao',opts:[
  {t:'Hỏi chatbot “25 × 4 bằng mấy?” rồi chép đáp số',ch:[-25,40,-20],ai:['25 × 4 bằng mấy?','Bằng 100.'],v:'bad',fb:'Mục đích là luyện tính nhẩm nên Tuấn cần tự làm.'},
  {t:'Tự nhẩm, sau đó nhờ chatbot kiểm tra lại đáp số',ch:[20,5,10],ai:['Mình nhẩm ra 100, đúng không?','Đúng rồi! 25 × 4 = 100.'],v:'good',fb:'Tự làm trước, AI chỉ kiểm tra – hợp lí.'}]}];
const SIT=[{t:'Hà luyện phát âm tiếng Anh với ứng dụng AI 10 phút mỗi tối.',g:0,why:'AI chỉ ra lỗi, Hà vẫn tự luyện nói.'},
{t:'Gia đình Khôi lần đầu đến nhà văn hoá mới; bố dùng tính năng gợi ý lộ trình theo giao thông trên ứng dụng bản đồ.',g:0,why:'Người lớn quan sát biển báo và quyết định lối đi; AI chỉ gợi ý.'},
{t:'Phương nhờ AI làm hộ 10 bài toán về nhà rồi chép vào vở.',g:2,why:'Bài tập về nhà để em tự luyện; AI làm hộ khiến em mất cơ hội luyện tập, bài sai không phát hiện, thầy cô hiểu sai về khả năng của em.'},
{t:'Quân hỏi trợ lí AI “Hôm nay thứ mấy?” trong khi tờ lịch treo ngay trên tường.',g:2,why:'Nhìn tờ lịch đơn giản và an toàn hơn.'}];
const CARDS=[{t:'Nhờ trợ lí AI giải hộ 10 bài toán về nhà rồi chép vào vở để nộp.',g:[2],why:'Bài tập để em tự luyện. Cách thay thế: tự làm, hỏi thầy cô/bạn khi chưa hiểu, làm xong có thể kiểm tra lại.'},
{t:'Lần đầu đi cùng bố mẹ đến bảo tàng, bố mẹ dùng tính năng gợi ý lộ trình theo giao thông trên ứng dụng bản đồ.',g:[0],why:'AI hỗ trợ, người lớn quyết định.'},
{t:'Nhờ trợ lí AI chọn giúp nên mua đôi giày nào bằng tiền mừng tuổi.',g:[1],why:'Tiêu tiền là việc quan trọng, cần hỏi bố mẹ cùng quyết định; AI chỉ gợi ý để tham khảo.'},
{t:'Tự viết xong bài văn, sau đó nhờ AI chỉ ra lỗi chính tả rồi tự sửa.',g:[0],why:'Em vẫn tự làm, AI chỉ hỗ trợ kiểm tra.'},
{t:'Nhờ ứng dụng AI đọc mẫu một đoạn thơ, sau đó em tự đọc theo.',g:[0],why:'AI hỗ trợ luyện đọc, em vẫn tự luyện.'},
{t:'Nhờ AI gợi ý 5 ý tưởng trang trí góc lớp, sau đó cả lớp bàn bạc và chọn.',g:[1,0],why:'Tuỳ mục đích: nếu nhiệm vụ rèn ý tưởng của lớp thì cả lớp tự nêu ý tưởng trước rồi mới tham khảo. Chấp nhận “Nên dùng” nếu cả lớp vẫn quyết định.'},
{t:'Nhờ AI gợi ý dàn ý cho bài văn, sau đó em tự viết bài.',g:[1,0],why:'Nếu bài nhằm luyện lập dàn ý thì em tự làm; nếu thầy cô cho phép thì em tự viết và nói rõ phần AI gợi ý.'}];
const P2=[{t:'Em tự làm xong bài toán rồi nhờ trợ lí AI kiểm tra lại đáp số.',g:[0],why:'Em tự làm trước, AI chỉ kiểm tra; kết quả khác nhau thì hỏi thầy cô.'},
{t:'Em nhờ trợ lí AI viết hộ đoạn văn giới thiệu về quê em rồi chép vào vở để nộp.',g:[2],why:'Em mất cơ hội luyện viết, bài sai không phát hiện, người đọc hiểu sai về khả năng của em.'},
{t:'Nhóm em nhờ AI gợi ý ba ý tưởng cho bài thuyết trình, cả nhóm chọn và tự viết.',g:[0,1],why:'Được dùng nếu thầy cô cho phép, nhóm tự chọn, tự viết và nói rõ phần AI gợi ý.'}];
let S,step=0,MUTE=false;const NAMES=['Ba bạn, ba cách','Ba câu hỏi','Xếp thẻ','Em tự chọn','Kết quả'];
function fresh(){S={pts:0,done:[0,0,0,0,0],kid:0,pick:{},m:[50,20,50],h2:0,q:SIT.map(()=>[null,null,null]),h2ok:SIT.map(()=>null),b:{},rs:{},sel:null,chk3:0,p2:P2.map(()=>({g:null,r:''}))}}
fresh();
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function add(p){S.pts+=p;$('#score').textContent='⭐ '+S.pts}
let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{beep(660);setTimeout(()=>beep(880),90)},bad=()=>beep(180,.25,'sawtooth');
$('#snd').onclick=()=>{MUTE=!MUTE;$('#snd').textContent=MUTE?'🔇':'🔊'};
function confetti(){const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,s:5+Math.random()*7,c:['#ff8a2b','#2ecc71','#4aa3ff','#f6c744','#ef5350'][Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

function h1(m){const k=KIDS[S.kid],c=E('div','card');
 c.innerHTML=`<h2>Hoạt động 1 – Ba bạn, ba cách dùng AI</h2><p class="lead">Chọn cách làm cho từng bạn rồi xem chuyện gì xảy ra với <b>kĩ năng tự luyện</b>, <b>nguy cơ bài sai</b> và <b>sự tin tưởng của thầy cô</b>.</p><p class="lead"><b>Câu hỏi then chốt (1):</b> Bạn nào dùng AI hợp lí, bạn nào không nên? Vì sao? <i>Gợi ý nếu lúng túng: “Sau khi dùng AI, bạn ấy giỏi thêm điều gì?” – Lan đọc đúng hơn; Minh, Tuấn không giỏi thêm kĩ năng nào. Hỏi thêm: “Bằng chứng nào khiến em tin?”</i></p>`;
 const tabs=E('div');tabs.style.cssText='display:flex;gap:8px;margin-bottom:10px';KIDS.forEach((x,i)=>{const b=E('button','btn '+(i==S.kid?'':'w'),x.n+(S.rs['k'+i]?' ✓':''));b.onclick=()=>{S.kid=i;S.m=[50,20,50];go(0)};tabs.appendChild(b)});c.appendChild(tabs);
 const st=E('div','stage'),L=E('div');L.innerHTML=`<div class="char">${av(k.c,k.n)}</div><div class="bubble"><b>${k.n}</b> đang làm: <b>${k.task}</b>. ${k.n} nên làm thế nào?</div>`;
 const ch=E('div','choices');k.opts.forEach((o,i)=>{const b=E('button','choice'+(S.pick[S.kid]===i?' sel':''),o.t);b.onclick=()=>{S.pick[S.kid]=i;S.anim=1;go(0)};ch.appendChild(b)});L.appendChild(ch);
