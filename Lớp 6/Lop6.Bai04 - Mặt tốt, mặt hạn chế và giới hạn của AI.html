<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 4. Mặt tốt, mặt hạn chế và giới hạn của AI – Lớp 6</title>
<style>
:root{--o:#8e44ad;--od:#6a3381;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>
<div class="map" id="map"></div><main id="main"></main><canvas id="confetti"></canvas>
<script>
const SPEC={"icon": "🧭", "ainote": "Tình huống, nhật kí, trang dữ liệu và ba tính năng đều là giả định, không nêu ứng dụng có thật. Không hỏi HS về lịch sử xem hay tài khoản của chính các em; cài đặt quyền riêng tư, thời gian màn hình trên thiết bị gia đình do người lớn quản lí, em chỉ đề xuất. Không phát âm thanh mẫu hay thử công cụ tạo giọng nói; gặp cuộc gọi lạ xin tiền thì báo ngay người lớn. Không ghi địa chỉ, số điện thoại, số tiền, chuyện riêng của gia đình; khi buồn thì tìm người tin cậy.", "takeaways": ["Tính năng gợi ý thu thập dữ liệu về việc em xem để gợi ý “trúng” hơn. Mặt tích cực: tiện, nhanh, đúng sở thích. Hạn chế: dễ kéo dài thời gian xem, thu hẹp nội dung, ảnh hưởng quyền riêng tư.", "AI tác động tới bản thân và gia đình theo hai chiều. Dùng có mục đích để được lợi; giảm rủi ro bằng cách kiểm tra lại, giới hạn thời gian màn hình, tắt tự động phát và nhắc nhau trong gia đình.", "AI làm nhanh việc lặp lại, nhiều dữ liệu nhưng không có trải nghiệm cảm xúc thật, không có kỉ niệm riêng, không nắm hết hoàn cảnh, không chịu trách nhiệm. Việc cần thấu hiểu cảm xúc, sáng tạo, quyết định phức tạp thì con người phù hợp hơn.", "Tính năng AI nào cũng có hai mặt; tính năng càng thu thập nhiều dữ liệu thì gợi ý càng sát nhưng quyền riêng tư càng cần được bảo vệ. Con người vẫn giữ những quyết định quan trọng."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Ứng dụng đoán gì?", "nav": "Ứng dụng đoán gì?", "icon": "🐱", "badge": "Nhà dự đoán", "intro": "Tình huống giả định, không nêu tên ứng dụng có thật. Tối thứ Hai, bạn Linh xem hết ba video về mèo trên máy tính bảng của gia đình; tối thứ Ba, Linh mở ứng dụng để tìm video bài giảng tiếng Anh. Hãy dự đoán rồi trả lời. Dự đoán chỉ dùng để chẩn đoán; chưa nêu được lí do thì sẽ được làm rõ ở HĐ 2.1.", "qs": [{"q": "Câu hỏi (1). Tối thứ Ba, trang đầu của ứng dụng nhiều khả năng gợi ý video gì?", "opts": ["Video bài giảng tiếng Anh vì Linh đang cần", "Thêm video về mèo", "Video hoàn toàn ngẫu nhiên, không liên quan gì tới việc Linh đã xem"], "a": 1, "why": "Trang đầu nhiều khả năng gợi ý thêm video về mèo, vì ứng dụng ghi lại việc Linh đã xem hết ba video mèo tối thứ Hai. Ví dụ dự đoán của HS: “Ứng dụng gợi ý thêm video mèo, vì nó ghi lại Linh đã xem hết 3 video mèo.”"}, {"q": "Vì sao ứng dụng “đoán” được điều Linh có thể thích?", "opts": ["Vì ứng dụng đọc được suy nghĩ của Linh", "Vì ứng dụng thu thập dữ liệu về những gì Linh đã xem rồi tìm điểm giống", "Vì ứng dụng hỏi ý kiến bố mẹ Linh"], "a": 1, "why": "Dữ liệu em để lại (video đã xem, xem hết hay bỏ dở, giờ xem) → hệ thống AI tìm điểm giống với những gì em thích."}, {"q": "Câu hỏi (2). Gợi ý như vậy tốt, chưa tốt hay vừa tốt vừa chưa tốt?", "opts": ["Chỉ có thể là tốt", "Chỉ có thể là chưa tốt", "Chấp nhận cả ba lựa chọn nếu có lí do"], "a": 2, "why": "Chấp nhận cả ba lựa chọn nếu có lí do. Ví dụ: “Tốt vì Linh thích mèo; chưa tốt vì Linh cần tìm bài tiếng Anh mà lại bị cuốn vào video mèo.” Vấn đề học tập: một tính năng AI mang lại gì và lấy đi gì của chúng ta; việc nào AI làm tốt, việc nào con người làm phù hợp hơn."}]}, {"type": "flag", "tag": "HĐ2.1 • Hai mặt của gợi ý video", "title": "Đọc nhật kí bảy ngày của Linh", "nav": "Nhật kí của Linh", "icon": "📊", "badge": "Thám tử dữ liệu", "intro": "Nhật kí xem video của bạn Linh (giả định; mỗi video khoảng 5 phút; mô phỏng, không phản ánh một ứng dụng có thật). <b>Trang dữ liệu tài khoản của Linh (mô phỏng):</b> Lịch sử xem: 77 video. Video xem hết: 61. Chủ đề quan tâm nhiều nhất: trò chơi điện tử. Giờ xem thường xuyên: 20:30–22:30. Thiết bị: máy tính bảng. Vị trí gần đúng: đang bật. Dữ liệu dùng để: cá nhân hoá gợi ý và quảng cáo.<br>Câu 1: Ứng dụng đã thu thập những dữ liệu nào? Câu 2: Thời gian xem ngày 7 gấp mấy lần ngày 1? Số chủ đề, số video học tập thay đổi thế nào? Câu 3: Tính năng gợi ý giúp Linh điều gì, gây hạn chế gì? Câu 4: Nếu tuần sau vẫn như vậy, điều gì có thể xảy ra? Bằng chứng nào trong nhật kí khiến em tin như vậy? Hãy bấm vào các dòng cho thấy dấu hiệu bị cuốn theo gợi ý (một bạn tính, một bạn kiểm tra lại phép tính), rồi bấm kiểm tra.", "cols": ["Ngày", "Thời gian xem (phút)", "Số video", "Video từ mục gợi ý", "Số chủ đề", "Video học tập", "Giờ tắt máy"], "flagWhat": "có dấu hiệu bị cuốn theo gợi ý", "rows": [{"c": ["1", "30", "6", "2", "4", "3", "21:00"], "bad": false}, {"c": ["2", "35", "7", "3", "4", "3", "21:05"], "bad": false}, {"c": ["3", "45", "9", "5", "3", "2", "21:20"], "bad": false}, {"c": ["4", "50", "10", "7", "3", "1", "21:30"], "bad": false}, {"c": ["5", "60", "12", "9", "2", "1", "21:45"], "bad": false}, {"c": ["6", "75", "15", "12", "2", "0", "22:10"], "bad": true, "why": "Ngày 6: xem 75 phút, 12/15 video từ mục gợi ý, số chủ đề còn 2, video học tập 0, tắt máy 22:10. Mức tăng thời gian xem lớn nhất là ở ngày 6 và ngày 7."}, {"c": ["7", "90", "18", "15", "1", "0", "22:30"], "bad": true, "why": "Ngày 7: thời gian xem gấp 90 : 30 = 3 lần ngày 1. Video từ mục gợi ý: ngày 1 là 2 trong 6 video (2/6 = 1/3), ngày 7 là 15 trong 18 video (15/18 = 5/6). Số chủ đề giảm từ 4 xuống 1; video học tập giảm từ 3 xuống 0; giờ tắt máy muộn dần từ 21 giờ đến 22 giờ 30."}, {"c": ["Cả tuần", "385", "77", "53", "", "10", ""], "bad": false}], "after": "Câu 1. Dữ liệu thu thập gồm video đã xem, video xem hết hay bỏ dở, giờ xem, loại thiết bị, vị trí gần đúng (nếu được bật); từ đó ứng dụng suy ra chủ đề quan tâm, giờ hay xem (dẫn chứng: “Video xem hết: 61”, “Giờ xem thường xuyên”, “Vị trí gần đúng: đang bật”). Câu 2. Cả tuần xem 385 phút (6 giờ 25 phút), trung bình 55 phút mỗi ngày; các cột thời gian xem cao dần từ 30 phút lên 90 phút, ngày nào cũng xem lâu hơn ngày trước. Câu 3, lợi ích: gợi ý đúng sở thích, không mất thời gian tìm kiếm; có thể giúp tìm nhanh video học tập nếu người xem chủ động chọn đúng. Câu 3, hạn chế: thời gian xem tăng, ngủ muộn; nội dung bị thu hẹp vào một chủ đề, ít gặp nội dung mới và nội dung học tập. Ứng dụng biết nhiều về thói quen của người dùng nên ảnh hưởng quyền riêng tư; dữ liệu có thể được dùng để hiển thị quảng cáo (trang dữ liệu ghi “cá nhân hoá gợi ý và quảng cáo”). Câu 4: dự đoán hợp lí là thời gian xem tiếp tục tăng, gần như chỉ còn một loại nội dung, Linh bỏ bớt việc học, ngủ muộn hơn. Bằng chứng: thời gian xem và số video từ mục gợi ý tăng mỗi ngày, số chủ đề và video học tập giảm, giờ tắt máy muộn dần. Mức đạt Phiếu học tập số 1: đọc đúng số liệu (thời gian xem gấp 3 lần; phần video từ mục gợi ý tăng từ 1/3 lên 5/6; số chủ đề giảm từ 4 còn 1); nêu được lợi ích, hạn chế có dẫn chứng, trong đó có hạn chế về quyền riêng tư."}, {"type": "order", "tag": "HĐ2.1 • Sơ đồ vòng gợi ý", "title": "Vòng gợi ý: vì sao càng xem càng bị cuốn?", "nav": "Vòng gợi ý", "icon": "🔄", "badge": "Người vẽ vòng gợi ý", "intro": "Sơ đồ vòng gợi ý (mô phỏng). Sắp xếp các bước theo đúng thứ tự của vòng, rồi nghĩ: điều gì có thể làm dự đoán ở Câu 4 (tuần sau Linh xem lâu hơn, ít chủ đề hơn) thay đổi?", "items": ["Dữ liệu em để lại (video đã xem, xem hết hay bỏ dở, giờ xem)", "Hệ thống AI tìm điểm giống với những gì em thích", "Gợi ý, tự động phát video tiếp theo", "Em xem thêm", "Thêm dữ liệu (quay lại bước đầu)"], "why": "Điều gì có thể làm dự đoán thay đổi? Linh chủ động tự tìm nội dung mình cần thay vì xem theo gợi ý; cùng người lớn đặt giới hạn thời gian màn hình, tắt tự động phát; cùng người lớn xem lại quyền truy cập dữ liệu (ví dụ tắt vị trí). Kiến thức chốt: tính năng gợi ý thu thập dữ liệu về việc em xem để gợi ý “trúng” hơn. Mặt tích cực: tiện, nhanh, đúng sở thích. Hạn chế: dễ kéo dài thời gian xem, thu hẹp nội dung, ảnh hưởng quyền riêng tư."}, {"type": "sort", "tag": "HĐ2.2 • Bản đồ tác động", "title": "Bản đồ tác động của AI trong nhà Khoa", "nav": "AI trong nhà Khoa", "icon": "🏠", "badge": "Người vẽ bản đồ", "intro": "Sáu việc dùng AI trong gia đình bạn Khoa (giả định). Kéo mỗi việc vào cột: tác động tích cực (+), tiêu cực (–) hoặc vừa (+) vừa (–). Chấp nhận cách xếp khác nếu có lí do. Sau mỗi thẻ, đọc đề xuất dùng tốt hơn hoặc giảm rủi ro. Việc thay đổi cài đặt trên thiết bị gia đình do người lớn thực hiện hoặc đồng ý.", "cats": ["Tích cực (+)", "Tiêu cực (–)", "Vừa (+) vừa (–)"], "cards": [{"t": "Việc 1 (Bố): Bố giao hàng, dùng ứng dụng bản đồ gợi ý đường tránh tắc, mỗi ngày bớt khoảng 40 phút đi lại; có một lần ứng dụng chỉ vào đoạn đường đang ngập", "g": [2, 0, 1], "why": "Việc 1: bố bớt khoảng 40 phút đi lại mỗi ngày (+); bố suýt đi vào đường ngập (–). Bản đồ có ích nhưng vẫn có lúc sai nên cần quan sát đường thật. Nhánh bản thân (Khoa): việc 5 (+); có thể xếp thêm việc 3 (giọng nói của Khoa bị giả để lừa bà); nhánh gia đình gồm các việc còn lại. Đề xuất: bố quan sát biển báo, mặt đường trước khi rẽ theo gợi ý."}, {"t": "Việc 2 (Mẹ): Mẹ định mua hai món đồ trên trang mua sắm trực tuyến; theo mục “gợi ý cho bạn”, cuối tháng mẹ đã mua bảy món, năm món trong đó từ gợi ý", "g": [2, 1], "why": "Mẹ mua thêm năm món ngoài dự định (–); gợi ý giúp tìm đồ nhanh nhưng dễ mua quá mức. Đề xuất: mẹ lập danh sách cần mua trước, chỉ mua món trong danh sách."}, {"t": "Việc 3 (Bà): Bà nhận cuộc gọi có giọng nói giống hệt Khoa, nói đang gặp chuyện và xin chuyển tiền gấp; bà gọi lại cho mẹ Khoa nên không bị lừa", "g": [1], "why": "Bà suýt bị lừa bởi giọng nói giả (–). Đề xuất: cả nhà thống nhất “mật khẩu gia đình” và luôn gọi lại số quen khi có cuộc gọi xin tiền. Gặp cuộc gọi lạ xin tiền thì báo ngay người lớn."}, {"t": "Việc 4 (Em gái): Em gái 5 tuổi xem video tự động phát nối tiếp trên máy tính bảng, có tối xem gần 2 giờ", "g": [1], "why": "Em gái xem gần 2 giờ, dễ ảnh hưởng mắt, giấc ngủ (–). Đề xuất: người lớn tắt chế độ tự động phát video, đặt giới hạn thời gian màn hình cho em gái (hẹn giờ tắt); cả nhà thống nhất không dùng thiết bị trước giờ ngủ."}, {"t": "Việc 5 (Khoa): Khoa luyện nghe tiếng Anh với ứng dụng AI 15 phút mỗi ngày; sau 4 tuần, điểm bài nghe tăng từ 6 lên 8", "g": [0], "why": "Khoa tiến bộ môn nghe, điểm từ 6 lên 8 (+). Đề xuất: Khoa duy trì 15 phút luyện nghe mỗi ngày và vẫn tự làm bài nghe trên lớp."}, {"t": "Việc 6 (Ông): Ông mắt kém, dùng tính năng chuyển giọng nói thành chữ để nhắn tin cho con cháu", "g": [0], "why": "Ông nhắn tin được dù mắt kém (+)."}], "pass": 0.6}, {"type": "decide", "tag": "HĐ2.3 • Tranh biện", "title": "AI hay con người phù hợp hơn?", "nav": "AI hay con người?", "icon": "⚖️", "badge": "Nhà tranh biện", "intro": "Luật tranh biện: mỗi nhóm nhận hai thẻ. Với mỗi thẻ, một cặp bảo vệ “AI phù hợp hơn”, một cặp bảo vệ “Con người phù hợp hơn”. Mỗi phe nói 45 giây, phản biện 15 giây; lí lẽ phải chỉ vào chi tiết trong thẻ. Sau đó chọn một trong ba lựa chọn: AI; Con người; AI gợi ý, con người quyết định. Lựa chọn khác vẫn được chấp nhận nếu có lí lẽ. Căn cứ: việc lặp lại, nhiều dữ liệu; cần thấu hiểu cảm xúc; cần sáng tạo; cần ra quyết định trong tình huống phức tạp. Ba câu hỏi gợi ý bên dưới giúp nhóm gặp khó. Hợp tác và trình bày: mức Khá, tranh biện có lí lẽ, lắng nghe phe khác; trình bày rõ. Mức Tốt, điều hành tranh biện hiệu quả, phản biện có căn cứ, sẵn sàng đổi lựa chọn khi có lí lẽ thuyết phục.", "questions": ["Việc này có lặp lại nhiều lần không?", "Có cần hiểu cảm xúc của ai không?", "Có nhiều hoàn cảnh phải cân nhắc không?"], "verdicts": ["AI", "AI gợi ý, con người quyết định", "Con người"], "rules": [{"when": [null, 1, null], "v": 2}, {"when": [null, null, 1], "v": 2}, {"when": [1, 0, 0], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "Thẻ 1. Kiểm tra lỗi chính tả cho bản tin 8 trang của lớp trước khi in.", "v": [0, 1], "why": "Căn cứ: việc lặp lại, nhiều chữ, làm nhanh. Con người vẫn phải đọc lại tên riêng, nội dung và quyết định in. Chấp nhận lựa chọn khác nếu có lí lẽ, ví dụ chọn “AI gợi ý, con người quyết định”; bản tin có nhiều tên riêng, từ địa phương thì càng nên chọn như vậy."}, {"t": "Thẻ 2. Bạn Mai rất buồn vì chú mèo nuôi 5 năm bị lạc; Mai cần một người lắng nghe và an ủi.", "v": 2, "why": "Căn cứ: cần thấu hiểu cảm xúc. Hệ thống AI có thể tạo ra câu an ủi nhưng không có trải nghiệm buồn, thương thật. Một người bạn ngồi cạnh và cùng đi tìm mèo mới thật sự chia sẻ với Mai. Con người vẫn phải lắng nghe, an ủi Mai và giúp Mai tìm mèo. Chi tiết: “rất buồn”, “cần một người lắng nghe và an ủi”. Khi buồn, hãy tìm người tin cậy (bố mẹ, thầy cô, bạn bè); AI tạo được câu an ủi nhưng không thay được những người này."}, {"t": "Thẻ 3. Viết lời chúc và vẽ thiệp tặng cô chủ nhiệm ngày 20/11, có những kỉ niệm riêng của lớp.", "v": 2, "why": "Căn cứ: cần sáng tạo gắn với trải nghiệm riêng. AI tạo ra nội dung dựa trên những gì học được từ dữ liệu, không có kỉ niệm của lớp. AI có thể gợi ý bố cục, nhưng lời chúc, hình vẽ là của lớp. Chi tiết: “có những kỉ niệm riêng của lớp”."}, {"t": "Thẻ 4. Dịch nhanh thực đơn viết bằng tiếng nước ngoài khi gia đình đi du lịch.", "v": [0, 1], "why": "Căn cứ: dịch nhanh, nhiều ngôn ngữ. Người lớn hỏi lại nhân viên khi món ăn chưa rõ."}, {"t": "Thẻ 5. Tổ trưởng phân công trực nhật tuần tới: bạn Hùng đang đau tay, bạn Yến nhà xa phải đi xe buýt sớm, hai bạn Tú và Đạt vừa giận nhau.", "v": 2, "why": "Căn cứ: cần ra quyết định trong tình huống phức tạp: biết hoàn cảnh từng bạn, cảm xúc giữa các bạn và có người chịu trách nhiệm; AI không nắm hết hoàn cảnh. Tổ trưởng cân nhắc, trao đổi với các bạn rồi quyết định. Chi tiết: Hùng “đang đau tay”, Yến “nhà xa phải đi xe buýt sớm”, Tú và Đạt “vừa giận nhau”. AI có thể gợi ý bảng phân công nháp nhưng con người vẫn là người quyết định."}, {"t": "Thẻ 6. Đọc chữ viết tay trên 180 phiếu bình chọn món ăn cho buổi liên hoan của khối và tổng hợp kết quả.", "v": 1, "why": "Căn cứ: AI đọc nhanh chữ viết tay nhưng có thể đọc sai chữ khó. Ban cán sự kiểm tra các phiếu khó đọc rồi mới công bố. Phiếu bình chọn viết rõ, ít chữ khó thì có thể giao phần lớn cho AI, con người vẫn kiểm tra kết quả."}]}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Soi hai mặt ba tính năng AI", "nav": "Soi hai mặt tính năng", "icon": "🔍", "badge": "Người soi hai mặt", "intro": "Ba tính năng AI (mô phỏng, không mô tả sản phẩm có thật). <b>Tính năng A.</b> Bàn phím điện thoại gợi ý từ tiếp theo. Gõ “Chiều nay mình đi”, bàn phím gợi ý “học”, “đá bóng”, “nhà bà”; những từ này được chọn vì người dùng đã gõ nhiều lần. Có lần gõ “Mẹ ơi con về muộn” bị gợi ý thành “Mẹ ơi con về muốn”. <b>Tính năng B.</b> Ứng dụng bản đồ lưu lịch sử vị trí. Mỗi chiều 17 giờ, bản đồ tự hiện thông báo “Về nhà: 12 phút, đường thông thoáng”, vì ứng dụng đã ghi lại nơi thiết bị thường ở vào ban đêm và giờ đi lại. <b>Tính năng C.</b> Loa thông minh chờ từ khoá để nhận lệnh bằng giọng nói. Loa bật đèn sáng khi nghe một câu nói gần giống từ khoá trong lúc cả nhà đang nói chuyện; lịch sử lệnh ghi “không nhận ra lệnh, đã lưu đoạn âm thanh”.<br>Kéo từng ô nội dung vào đúng dòng của Phiếu học tập số 4 (lợi ích, hạn chế, dữ liệu bị thu thập, cách giảm rủi ro, việc con người vẫn phải làm). Chấp nhận ý khác nếu giải thích được.", "cats": ["Lợi ích", "Hạn chế", "Dữ liệu bị thu thập", "Cách giảm rủi ro", "Việc con người vẫn phải làm"], "cards": [{"t": "A. Gõ nhanh, ít lỗi chính tả.", "g": [0], "why": "Lợi ích của bàn phím gợi ý từ."}, {"t": "A. Lưu lại cách gõ, tên riêng; có lúc gợi ý sai từ khiến gửi nhầm ý; dễ dựa dẫm, kém nhớ chính tả.", "g": [1], "why": "Hạn chế của bàn phím gợi ý từ."}, {"t": "A. Các từ, câu đã gõ.", "g": [2], "why": "Câu hỏi (1): bàn phím cần biết những từ, câu em hay gõ."}, {"t": "A. Đọc lại trước khi gửi; nhờ người lớn xoá dữ liệu bàn phím đã học khi cần.", "g": [3], "why": "Cách giảm rủi ro của bàn phím gợi ý từ."}, {"t": "A. Quyết định gửi nội dung gì, giữ lời lẽ tôn trọng.", "g": [4], "why": "Việc con người vẫn phải làm với bàn phím gợi ý từ."}, {"t": "B. Tìm đường nhanh, tránh tắc.", "g": [0], "why": "Lợi ích của bản đồ lưu lịch sử vị trí."}, {"t": "B. Lộ nơi ở, trường học, giờ đi lại; có lúc gợi ý đường ngập, đường cấm.", "g": [1], "why": "Hạn chế của bản đồ lưu lịch sử vị trí."}, {"t": "B. Vị trí, thời gian di chuyển.", "g": [2], "why": "Câu hỏi (1): bản đồ cần biết nơi thiết bị thường ở vào ban đêm, giờ đi lại."}, {"t": "B. Người lớn tắt lịch sử vị trí khi không cần; không chia sẻ vị trí với người lạ.", "g": [3], "why": "Cách giảm rủi ro của bản đồ lưu lịch sử vị trí."}, {"t": "B. Quan sát biển báo, mặt đường và quyết định đường đi.", "g": [4], "why": "Việc con người vẫn phải làm với bản đồ."}, {"t": "C. Bật nhạc, hẹn giờ, nhắc lịch cho ông bà không quen điện thoại.", "g": [0], "why": "Lợi ích của loa thông minh."}, {"t": "C. Có thể ghi âm nhầm cuộc trò chuyện trong nhà; trẻ nhỏ có thể ra lệnh đặt mua đồ; trả lời sai câu hỏi quan trọng.", "g": [1], "why": "Hạn chế của loa thông minh."}, {"t": "C. Giọng nói, lệnh, giờ sử dụng.", "g": [2], "why": "Câu hỏi (1): loa cần giọng nói, câu lệnh; loa phải luôn chờ nghe từ khoá."}, {"t": "C. Tắt micro khi không dùng; đặt mật khẩu cho mua hàng; không nói thông tin riêng gần loa.", "g": [3], "why": "Cách giảm rủi ro của loa thông minh."}, {"t": "C. Kiểm tra lại câu trả lời về sức khoẻ, tiền bạc; quyết định việc quan trọng của gia đình.", "g": [4], "why": "Việc con người vẫn phải làm với loa thông minh (Câu hỏi (2)). Tính năng nào thu thập dữ liệu nhạy cảm hơn: chấp nhận câu trả lời có lí do, ví dụ loa thông minh vì có thể lưu cả đoạn trò chuyện riêng trong nhà; bản đồ vì cho biết nơi ở, giờ đi lại của cả gia đình."}], "pass": 0.6}, {"type": "lab", "tag": "HĐ3 • Luyện tập", "title": "Phòng thí nghiệm: dữ liệu càng nhiều, gợi ý càng sát?", "nav": "Dữ liệu và riêng tư", "icon": "🎛️", "badge": "Người cân bằng dữ liệu", "intro": "Tính năng AI mô phỏng (bàn phím gợi ý từ, bản đồ lưu lịch sử vị trí hoặc loa thông minh). Kéo thanh trượt để xem: tính năng càng thu thập nhiều dữ liệu thì gợi ý càng sát nhưng quyền riêng tư càng cần được bảo vệ. Chỉ là mô hình đơn giản, không phải số liệu thật.", "sliders": [{"id": "data", "n": "Lượng dữ liệu về em mà tính năng thu thập", "min": 0, "max": 100, "val": 30, "unit": "%"}, {"id": "ctl", "n": "Mức em và gia đình chủ động giới hạn (hẹn giờ, tắt quyền không cần, tắt tự động phát)", "min": 0, "max": 100
