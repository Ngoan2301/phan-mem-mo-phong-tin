<style>
:root{--o:#c0392b;--od:#902a20;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}

.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}

.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}

.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}

.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}

<script>
const SPEC={"icon": "👂", "title": "Bài 5. AI “đọc”, “nghe” và “nhìn” như thế nào – Lớp 8", "ainote": "Chữ máy “nghe” ra, tên đồ vật máy “nhìn” ra đều có thể sai nên con người phải kiểm tra trước khi dùng. Ảnh, giọng nói của mỗi người là dữ liệu cá nhân: không tự ý đưa vào ứng dụng AI, không ghi âm, chụp ảnh bạn bè.", "takeaways": ["Máy không có tai, có mắt: micro, camera chỉ thu tín hiệu; máy tính toán trên các con số, vì vậy “đọc”, “nghe”, “nhìn” được viết trong ngoặc kép.", "Sơ đồ chung: ĐẦU VÀO (chữ, âm thanh, ảnh) → XỬ LÍ (đổi thành số → tìm đặc điểm → so với dữ liệu đã học) → ĐẦU RA.", "AI “nghe” là chuyển giọng nói thành chữ rồi “đọc” chữ đó; AI “nhìn” cho kết quả kèm mức độ tự tin do hệ thống ước tính.", "Lỗi ở một bước (thu âm, lọc ồn, chuyển thành chữ) truyền sang các bước sau; máy không hiểu nghĩa và không hỏi lại như người nên kết quả cần được kiểm tra.", "Mức Khá của nhóm: xếp hợp lí ba chuỗi, giải thích được vị trí thẻ 3; lập đủ ba sơ đồ, nêu được một điểm khác với con người; dự đoán có lí do, chỉ ra từ máy ghi sai và thẻ có thể gây lỗi."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Máy có tai, có mắt không?", "nav": "Tai và mắt của máy", "icon": "🤔", "badge": "Nhà thám tử", "intro": "GV đọc thành tiếng ba việc giả định, không nêu tên ứng dụng có thật. Việc 1. Bà của Minh nói vào điện thoại: “Gọi cho con Hằng.”, điện thoại gọi đúng số của cô Hằng; Việc 2. Chị Lan hướng camera điện thoại vào tờ thực đơn tiếng Anh, màn hình hiện bản dịch tiếng Việt; Việc 3. Hộp thư điện tử tự chuyển thư “Bạn đã trúng thưởng 100 triệu đồng, bấm vào đây để nhận” vào mục thư rác. Gợi ý khi lúng túng: “Máy nhận vào cái gì: chữ, tiếng hay hình?”. Hãy trả lời các câu hỏi dưới đây (HĐ 1 chấp nhận mọi dự đoán).", "qs": [{"q": "Ở việc 1 (gọi điện bằng lời nói), máy làm những chức năng nào?", "opts": ["Chỉ “nhìn”", "“Nghe”, rồi “đọc” lời nói đã chuyển thành chữ", "Chỉ “đọc” thư điện tử"], "a": 1, "why": "Việc 1: “nghe” rồi “đọc” lời nói đã chuyển thành chữ."}, {"q": "Ở việc 2 (dịch thực đơn bằng camera), máy làm những chức năng nào?", "opts": ["“Nhìn” chữ trong ảnh rồi “đọc” để dịch", "Chỉ “nghe”", "Không làm chức năng nào"], "a": 0, "why": "Việc 2: “nhìn” chữ trong ảnh rồi “đọc” để dịch."}, {"q": "Ở việc 3 (lọc thư rác), máy chủ yếu làm gì?", "opts": ["“Nghe” nội dung thư", "“Nhìn” khuôn mặt người gửi", "“Đọc” nội dung thư để phân loại"], "a": 2, "why": "Việc 3: “đọc” nội dung thư."}, {"q": "Máy có tai, có mắt thật không?", "opts": ["Có, micro là tai, camera là mắt", "Không: micro, camera chỉ thu tín hiệu; máy tính toán trên các con số", "Có, nhưng chỉ khi kết nối mạng"], "a": 1, "why": "Không. Micro, camera chỉ thu tín hiệu; máy tính toán trên các con số."}, {"q": "Bên trong máy diễn ra những bước nào? (Câu hỏi 3)", "opts": ["Máy nghe bằng tai, nhìn bằng mắt rồi hiểu nghĩa như người", "Nhận dữ liệu, đổi thành số và so với dữ liệu đã học, đưa ra kết quả", "Máy tự đoán, không có bước nào cả"], "a": 1, "why": "Ở HĐ 1 chấp nhận mọi dự đoán; câu trả lời đầy đủ (nhận dữ liệu, đổi thành số và so với dữ liệu đã học, đưa ra kết quả) được hình thành ở HĐ 2.1."}]}, {"type": "sort", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Xếp thẻ vào đúng chuỗi quy trình", "nav": "Xếp thẻ quy trình", "icon": "🧩", "badge": "Kĩ sư quy trình", "intro": "PHIẾU HỌC TẬP SỐ 1. THẺ QUY TRÌNH VÀ SƠ ĐỒ “ĐỌC”, “NGHE”, “NHÌN”. Phần A. Thẻ quy trình (HĐ 2.1): em cùng nhóm ghi số thẻ lên 12 mẩu giấy, chia các thẻ theo loại dữ liệu máy nhận vào (chữ, âm thanh, hình ảnh). Kéo mỗi thẻ vào chuỗi đúng. Gợi ý: “Thẻ nào có chữ micro, camera hoặc nhận văn bản? Đó là thẻ đầu. Thẻ nào có chữ đưa ra kết quả? Đó là thẻ cuối.”", "cats": ["“Đọc” (văn bản)", "“Nghe” (âm thanh)", "“Nhìn” (hình ảnh)"], "cards": [{"t": "Tách văn bản thành từng từ và chuyển mỗi từ thành một dãy số để máy tính xử lí.", "g": [0], "why": "Thẻ 1 thuộc chuỗi “đọc” (4 → 1 → 10 → 7): văn bản được đổi thành số để máy tính xử lí."}, {"t": "Camera chụp ảnh; ảnh là một lưới rất nhiều điểm ảnh, mỗi điểm là các con số chỉ màu.", "g": [2], "why": "Thẻ 2 là thẻ đầu của chuỗi “nhìn” (2 → 8 → 5 → 11): ảnh do camera chụp."}, {"t": "Phân tích dòng chữ vừa có để xác định nội dung, yêu cầu của người nói.", "g": [1, 0], "why": "Lí do đặt thẻ 3: thẻ 3 phân tích “dòng chữ vừa có”, tức chữ vừa được tạo ra từ giọng nói ở thẻ 9, nên thẻ 3 thuộc chuỗi “nghe”. AI “nghe” là chuyển giọng nói thành chữ rồi “đọc” chữ đó. Xếp thẻ 3 vào chuỗi “đọc” là nhầm thường gặp; hãy đối chiếu đầu vào của thẻ 3 với thẻ 4."}, {"t": "Nhận văn bản đầu vào (chữ được gõ vào, tin nhắn, bài viết).", "g": [0], "why": "Thẻ 4 là thẻ đầu của chuỗi “đọc”: văn bản (chữ gõ vào, tin nhắn, bài viết)."}, {"t": "So sánh các đặc điểm tìm được với dữ liệu đã học từ rất nhiều ảnh có gắn nhãn.", "g": [2], "why": "Thẻ 5 thuộc chuỗi “nhìn”: máy chỉ so khớp với dữ liệu ảnh đã gắn nhãn."}, {"t": "Micro thu âm thanh, lọc bớt tiếng ồn, chia âm thanh thành các đoạn rất ngắn.", "g": [1], "why": "Thẻ 6 là thẻ đầu của chuỗi “nghe”: âm thanh giọng nói do micro thu."}, {"t": "Đưa ra kết quả: tóm tắt, phân loại tin nhắn, bản dịch hoặc gợi ý câu trả lời.", "g": [0], "why": "Thẻ 7 là thẻ cuối của chuỗi “đọc”: tóm tắt, phân loại tin nhắn, bản dịch, gợi ý câu trả lời."}, {"t": "Tìm các đặc điểm nhỏ (đường viền, mảng màu) rồi ghép thành đặc điểm lớn hơn (tai nhọn, ria, mắt tròn).", "g": [2], "why": "Thẻ 8 thuộc chuỗi “nhìn”: bước tìm đặc điểm."}, {"t": "So sánh từng đoạn âm với mẫu đã học để chuyển giọng nói thành chữ.", "g": [1], "why": "Thẻ 9 thuộc chuỗi “nghe”: chuyển giọng nói thành chữ."}, {"t": "So sánh với các mẫu đã học từ rất nhiều văn bản để xác định chủ đề, ý chính hoặc yêu cầu.", "g": [0], "why": "Thẻ 10 thuộc chuỗi “đọc”: so với dữ liệu đã học."}, {"t": "Đưa ra kết quả kèm mức độ tự tin do hệ thống ước tính, ví dụ: Mèo 92%, Cáo 6%, Chó 2%.", "g": [2], "why": "Thẻ 11 là thẻ cuối của chuỗi “nhìn”: kết quả kèm mức độ tự tin do hệ thống ước tính."}, {"t": "Đưa ra kết quả: hiện chữ trên màn hình, thực hiện lệnh hoặc trả lời bằng giọng máy.", "g": [1], "why": "Thẻ 12 là thẻ cuối của chuỗi “nghe”: chữ trên màn hình, lệnh được thực hiện, câu trả lời bằng giọng máy."}], "pass": 0.7}, {"type": "order", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Xếp chuỗi “nghe” đúng thứ tự", "nav": "Chuỗi “nghe”", "icon": "🔢", "badge": "Người xếp chuỗi", "intro": "Bảng xếp thẻ: mỗi chuỗi đi từ lúc máy nhận dữ liệu đến lúc đưa ra kết quả. Hãy xếp bốn thẻ của chuỗi “nghe” (6 → 9 → 3 → 12) theo đúng thứ tự. Thẻ đầu là thẻ máy nhận dữ liệu, thẻ cuối là thẻ đưa ra kết quả.", "items": ["Micro thu âm thanh, lọc bớt tiếng ồn, chia âm thanh thành các đoạn rất ngắn.", "So sánh từng đoạn âm với mẫu đã học để chuyển giọng nói thành chữ.", "Phân tích dòng chữ vừa có để xác định nội dung, yêu cầu của người nói.", "Đưa ra kết quả: hiện chữ trên màn hình, thực hiện lệnh hoặc trả lời bằng giọng máy."], "why": "Đáp án: “Đọc” 4 → 1 → 10 → 7 (đầu vào thẻ 4: văn bản; đầu ra thẻ 7: tóm tắt, phân loại tin nhắn, bản dịch, gợi ý câu trả lời). “Nghe” 6 → 9 → 3 → 12 (đầu vào thẻ 6: âm thanh giọng nói do micro thu; đầu ra thẻ 12: chữ trên màn hình, lệnh được thực hiện, câu trả lời bằng giọng máy). “Nhìn” 2 → 8 → 5 → 11 (đầu vào thẻ 2: ảnh do camera chụp; đầu ra thẻ 11: kết quả kèm mức độ tự tin do hệ thống ước tính). Thẻ đầu là thẻ máy nhận dữ liệu (thẻ 4, 6, 2); thẻ cuối là thẻ đưa ra kết quả (thẻ 7, 12, 11). Thẻ 3, vì sau khi giọng nói đã thành chữ, máy phân tích dòng chữ đó giống như khi “đọc” một văn bản. Các chữ “Micro thu âm thanh”, “Camera chụp ảnh”, “Nhận văn bản đầu vào” cho biết đó là thẻ đầu. Ví dụ thẻ nhóm xong sớm viết thêm cho chuỗi “nhìn”: “Vẽ khung quanh con vật trên ảnh.” Thẻ này đặt sau thẻ 5, trước hoặc cùng lúc với thẻ 11. Sơ đồ chung: ĐẦU VÀO (chữ, âm thanh, ảnh) → XỬ LÍ (đổi thành số → tìm đặc điểm → so với dữ liệu đã học) → ĐẦU RA."}, {"type": "flag", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Máy “nghe” sai ở bước nào?", "nav": "Máy “nghe” sai", "icon": "🎧", "badge": "Thợ săn lỗi", "intro": "Phần B. Thử nghiệm máy “nghe” (HĐ 2.2). Kết quả mô phỏng (giả định): nhóm ghi dự đoán trước khi nghe kết quả và không sửa lại. Hãy gắn cờ câu hoặc từ máy ghi sai, rồi đặt chuỗi thẻ “nghe” (6, 9, 3, 12) cạnh câu sai để tìm thẻ gây lỗi. Gợi ý: “Tiếng sai xuất hiện từ thẻ nào?”", "cols": ["Câu hoặc từ gốc (người đọc)", "Điều kiện", "Máy ghi được"], "flagWhat": "bị máy ghi sai", "rows": [{"c": ["1. “Chiều thứ Sáu, lớp 8A tổng vệ sinh sân trường.”", "Yên tĩnh, đọc rõ", "Chiều thứ Sáu, lớp 8A tổng vệ sinh sân trường."], "bad": false}, {"c": ["2. “Em mua hai quyển vở và một cây bút chì.”", "Có tiếng mưa", "Em mua hai quyển vợ và một cây bút chì."], "bad": true, "why": "Từ máy ghi sai: “vở” thành “vợ”. Thẻ 6: tiếng mưa lẫn vào âm thanh, lọc ồn không hết; vì vậy ở thẻ 9 máy so đoạn âm lẫn tiếng mưa với mẫu đã học và chọn nhầm. Chấp nhận nhóm ghi thẻ 6 hoặc thẻ 9 nếu nêu được lí do tiếng mưa."}, {"c": ["3. “Nhóm em trồng cây sấu và cây bàng ở góc vườn trường.”", "Đọc nhanh, có từ dễ nhầm", "Nhóm em trồng cây sâu và cây bằng ở góc vườn trường."], "bad": true, "why": "Từ máy ghi sai: “sấu” thành “sâu”, “bàng” thành “bằng”. Thẻ 9: đọc nhanh, âm gần giống, máy chọn từ gặp nhiều hơn trong dữ liệu đã học. Thẻ 3 phân tích trên dòng chữ đã sai nên câu thành vô nghĩa."}, {"c": ["Câu 1: không có từ nào sai", "Yên tĩnh, đọc rõ", "Không có"], "bad": false}, {"c": ["Câu 2: “vở”", "Có tiếng mưa", "vợ"], "bad": true, "why": "Thẻ 6 (lọc ồn không hết) dẫn tới chọn nhầm ở thẻ 9. Lỗi ở bước trước truyền sang bước sau."}, {"c": ["Câu 3: “sấu”", "Đọc nhanh, có từ dễ nhầm", "sâu"], "bad": true, "why": "Thẻ 9: âm gần giống, máy chọn từ gặp nhiều hơn trong dữ liệu đã học."}, {"c": ["Câu 3: “bàng”", "Đọc nhanh, có từ dễ nhầm", "bằng"], "bad": true, "why": "Thẻ 9 chọn nhầm; thẻ 3 phân tích trên dòng chữ đã sai nên câu thành vô nghĩa."}, {"c": ["Câu 2: “một cây bút chì”", "Có tiếng mưa", "một cây bút chì"], "bad": false}], "after": "Người nghe chọn đúng từ nhờ hiểu nghĩa của cả câu (“mua vở” hợp với “bút chì”; “cây sấu”, “cây bàng” là tên cây trồng ở vườn trường), kinh nghiệm và hỏi lại khi không chắc. Máy chỉ chọn kết quả khớp nhất với dữ liệu đã học, không hiểu nghĩa và không hỏi lại. Cột dự đoán: không chấm đúng, sai; dự đoán có lí do (ví dụ “câu 2 sai vì có tiếng mưa”) là dấu hiệu tốt của tư duy phản biện, kể cả khi đoán sai từ. Cách giảm lỗi: đọc chậm, rõ; tránh chỗ ồn; đọc lại và sửa tay chữ máy ghi được trước khi dùng. Khi trình diễn bằng công cụ thật thay cho kết quả mô phỏng, kết quả có thể khác; hãy đối chiếu đúng chữ công cụ ghi được, vẫn hỏi lỗi xuất hiện ở thẻ nào."}, {"type": "lab", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Thử đọc chậm, rõ ở phòng yên tĩnh", "nav": "Phòng thử “nghe”", "icon": "🎚️", "badge": "Kĩ thuật viên âm thanh", "intro": "Nếu đọc câu 3 chậm và rõ trong phòng yên tĩnh, kết quả có thể thay đổi ở thẻ nào? Kéo các thanh trượt (mô hình giả định, đơn giản hoá) để xem thẻ 6 (thu âm, lọc ồn), thẻ 9 (chuyển giọng nói thành chữ) và thẻ 3 (phân tích chữ) thay đổi ra sao.", "sliders": [{"id": "noise", "n": "Tiếng ồn xung quanh (mưa, ồn)", "min": 0, "max": 100, "val": 50, "unit": "%"}, {"id": "speed", "n": "Tốc độ đọc (nhanh)", "min": 0, "max": 100, "val": 70, "unit": "%"}, {"id": "conf", "n": "Mức dễ nhầm của từ (âm gần giống)", "min": 0, "max": 100, "val": 60, "unit": "%"}], "outputs": [{"n": "Thẻ 6: âm thanh sạch sau lọc ồn", "base": 50, "w": {"noise": -0.7, "speed": -0.1}, "c": 0}, {"n": "Thẻ 9: chuyển giọng nói thành chữ đúng", "base": 50, "w": {"noise": -0.4, "speed": -0.4, "conf": -0.3}, "c": 1}, {"n": "Thẻ 3: phân tích đúng nội dung câu", "base": 50, "w": {"noise": -0.3, "speed": -0.3, "conf": -0.3}, "c": 2}], "insights": [{"id": "noise", "op": "<=", "val": 10, "txt": "Phòng yên tĩnh: tiếng mưa không còn lẫn vào âm thanh, thẻ 6 lọc ồn tốt hơn nên thẻ 9 ít chọn nhầm."}, {"id": "speed", "op": "<=", "val": 20, "txt": "Đọc chậm, rõ: các đoạn âm rõ hơn nên máy ít chọn nhầm “sấu” thành “sâu”, “bàng” thành “bằng”; khi đó thẻ 3 phân tích trên dòng chữ đúng. Máy vẫn có thể sai ở chỗ khác, vì vậy cần đọc lại chữ máy ghi được."}, {"id": "conf", "op": ">=", "val": 80, "txt": "Từ dễ nhầm làm thẻ 9 chọn từ gặp nhiều hơn trong dữ liệu đã học; lỗi này truyền sang thẻ 3."}]}, {"type": "match", "tag": "HĐ3 • Luyện tập", "title": "Phần C: xử lí và đầu ra của ba sơ đồ", "nav": "Sơ đồ: xử lí, đầu ra", "icon": "🔗", "badge": "Họa sĩ sơ đồ", "intro": "Phần C. Sơ đồ đầu vào, xử lí, đầu ra (HĐ 3). Cả nhóm dùng lại ba chuỗi thẻ ở phần A và góp ý cho nhau. Ghép mỗi chức năng và cột (Xử lí, Đầu ra) với nội dung đúng.", "pairs": [["“Đọc” – Xử lí (hai, ba bước)", "Tách từ → đổi thành số → so với mẫu đã học"], ["“Nghe” – Xử lí (hai, ba bước)", "Thu âm, lọc ồn → chuyển giọng nói thành chữ → phân tích chữ"], ["“Nhìn” – Xử lí (hai, ba bước)", "Lưới điểm ảnh → tìm đặc điểm → so với dữ liệu ảnh đã học"], ["“Đọc” – Đầu ra", "Tóm tắt, phân loại, bản dịch, gợi ý trả lời"], ["“Nghe” – Đầu ra", "Chữ trên màn hình, lệnh được thực hiện"], ["“Nhìn” – Đầu ra", "Tên đối tượng kèm mức độ tự tin do hệ thống ước tính"]], "why": "Mức đạt của phần C: mỗi hàng có đầu vào, đầu ra đúng loại dữ liệu; phần xử lí có bước so sánh với dữ liệu đã học. Hàng còn sai: người ghi của hàng đó tự sửa bằng bút khác màu."}, {"type": "match", "tag": "HĐ3 • Luyện tập", "title": "Phần C: đầu vào và con người làm thế nào", "nav": "Đầu vào & con người", "icon": "🧑‍🤝‍🧑", "badge": "Nhà so sánh", "intro": "Ghép đầu vào của AI hoặc cách con người làm với chức năng tương ứng. Sau đó nghĩ: con người đọc, nghe, nhìn khác AI ở điểm nào? Mỗi nhóm nêu được một điểm khác có lí do là đạt.", "pairs": [["“Đọc” – Đầu vào", "Văn bản: tin nhắn, bài viết, chữ lấy ra từ ảnh"], ["“Nghe” – Đầu vào", "Âm thanh giọng nói"], ["“Nhìn” – Đầu vào", "Ảnh, video"], ["Con người “đọc”", "Đọc bằng mắt, hiểu nghĩa của câu, dùng hiểu biết và ngữ cảnh"], ["Con người “nghe”", "Nghe bằng tai, hiểu nghĩa, cảm nhận giọng điệu, hỏi lại khi không rõ"], ["Con người “nhìn”", "Nhìn bằng mắt, nhận ra đồ vật sau vài lần thấy"]], "why": "Con người hiểu nghĩa, cảm nhận giọng điệu, hỏi lại khi không rõ và nhận ra đồ vật sau vài lần thấy. AI tính toán trên con số, cần rất nhiều dữ liệu đã gắn nhãn và vẫn đưa ra kết quả khớp nhất kể cả khi sai. Điểm giống (không bắt buộc): cả hai đều nhận tín hiệu, tìm đặc điểm, rồi đối chiếu với điều đã biết."}, {"type": "quiz", "tag": "HĐ4 • Vận dụng", "title": "Gợi ý cho bốn thẻ ứng dụng", "nav": "Bốn thẻ ứng dụng", "icon": "📱", "badge": "Nhà phân tích ứng dụng", "intro": "PHIẾU HỌC TẬP SỐ 2. GIẢI THÍCH MỘT ỨNG DỤNG QUEN THUỘC. Em trao đổi với nhóm về thẻ nhóm được giao, rồi tự viết thuyết minh của mình. Bốn thẻ ứng dụng là mô tả chung, không nêu tên sản phẩm có thật. Chọn chức năng cho mỗi thẻ và đọc gợi ý.", "qs": [{"q": "Thẻ A. Loa thông minh bật bài hát khi được yêu cầu bằng lời. Ứng dụng này dùng chức năng nào? (chọn nhiều)", "opts": ["“đọc”", "“nghe”", "“nhìn”"], "a": [0, 1], "why": "Dòng chọn chức năng: thẻ A “nghe” và “đọc”; thẻ B “nhìn”; thẻ C “đọc”; thẻ D “nhìn” và “đọc”. Đầu vào: Âm thanh lời yêu cầu. Xử lí chính: “Nghe”: thu âm, lọc ồn, so đoạn âm với mẫu đã học để chuyển thành chữ; rồi “đọc”: phân tích chữ, so với mẫu đã học để xác định bài hát được yêu cầu. Đầu ra: Bài hát được phát. Có thể sai khi, cách kiểm tra lại: Phòng ồn, người nói đọc vội, tên bài hát gần âm với bài khác; nghe lại, nói lại chậm và rõ hơn."}, {"q": "Thẻ B. Ứng dụng chụp ảnh lá cây và cho biết tên cây. Ứng dụng này dùng chức năng nào? (chọn nhiều)", "opts": ["“đọc”", "“nghe”", "“nhìn”"], "a": [2], "why": "Dòng chọn chức năng: thẻ A “nghe” và “đọc”; thẻ B “nhìn”; thẻ C “đọc”; thẻ D “nhìn” và “đọc”. Đầu vào: Ảnh chiếc lá do người dùng chụp. Xử lí chính: “Nhìn”: chuyển ảnh thành lưới điểm ảnh, tìm đặc điểm như hình dạng, mép, gân, màu lá rồi so sánh với rất nhiều ảnh lá đã học. Đầu ra: Tên cây kèm mức độ tự tin do hệ thống ước tính. Có thể sai khi, cách kiểm tra lại: Ảnh mờ, lá bị sâu ăn, loài cây ít có trong dữ liệu đã học; hỏi thầy cô hoặc tra sách."}, {"q": "Thẻ C. Hộp thư tự chuyển thư lừa đảo vào mục thư rác. Ứng dụng này dùng chức năng nào? (chọn nhiều)", "opts": ["“đọc”", "“nghe”", "“nhìn”"], "a": [0], "why": "Dòng chọn chức năng: thẻ A “nghe” và “đọc”; thẻ B “nhìn”; thẻ C “đọc”; thẻ D “nhìn” và “đọc”. Đầu vào: Nội dung thư: tiêu đề, lời trong thư, địa chỉ gửi. Xử lí chính: Tách chữ, đổi thành số, so với mẫu thư lừa đảo và thư thường đã học. Đầu ra: Thư được chuyển vào mục thư rác hoặc giữ ở hộp thư chính. Có thể sai khi, cách kiểm tra lại: Thư thật bị chuyển nhầm vào thư rác, thư lừa đảo kiểu mới lọt vào hộp thư chính; xem lại mục thư rác, không bấm đường dẫn lạ."}, {"q": "Thẻ D. Camera điện thoại dịch biển chỉ dẫn tiếng nước ngoài. Ứng dụng này dùng chức năng nào? (chọn nhiều)", "opts": ["“đọc”", "“nghe”", "“nhìn”"], "a": [2, 0], "why": "Dòng chọn chức năng: thẻ A “nghe” và “đọc”; thẻ B “nhìn”; thẻ C “đọc”; thẻ D “nhìn” và “đọc”. Đầu vào: Ảnh biển chỉ dẫn do camera chụp. Xử lí chính: “Nhìn”: tìm vùng có chữ trong ảnh, so hình chữ với mẫu chữ đã học để nhận ra chữ; rồi “đọc”: phân tích và dịch. Đầu ra: Bản dịch hiện trên màn hình. Có thể sai khi, cách kiểm tra lại: Ảnh mờ, chữ nghiêng, chữ bị che; hỏi người biết tiếng đó, đối chiếu với hình vẽ, biểu tượng trên biển."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Thuyết minh một ứng dụng quen thuộc", "nav": "Thuyết minh ứng dụng", "icon": "📝", "badge": "Người thuyết minh", "intro": "Thẻ nhóm em được giao: ……  Ứng dụng này dùng chức năng: □ “đọc” □ “nghe” □ “nhìn” (có thể chọn nhiều ô). Em tự viết thuyết minh bốn ý (đầu vào, xử lí có bước so sánh với dữ liệu đã học, đầu ra, có thể sai khi nào và kiểm tra lại bằng cách nào). Không ghi tên tài khoản, không dán ảnh thật của em.", "fields": [{"id": "app", "label": "Em chọn thẻ ứng dụng", "opts": ["A. Loa thông minh", "B. Chụp lá cây cho biết tên cây", "C. Hộp thư lọc thư rác", "D. Camera dịch biển chỉ dẫn"]}, {"id": "fn", "label": "Ứng dụng dùng chức năng", "opts": ["“Đọc”", "“Nghe”", "“Nhìn”", "Nhiều chức năng (ghi rõ ở ý 2)"]}, {"id": "in", "label": "1. Đầu vào là", "ph": "Máy nhận vào chữ, âm thanh hay ảnh?", "long": false}, {"id": "proc", "label": "2. AI xử lí bằng cách", "hint": "Có bước so sánh với dữ liệu đã học", "ph": "đổi thành con số → tìm đặc điểm → so với dữ liệu đã học"}, {"id": "out", "label": "3. Đầu ra là", "ph": "Kết quả máy đưa ra (kèm mức độ tự tin nếu có)", "long": false}, {"id": "risk", "label": "4. Ứng dụng có thể sai khi ..., em kiểm tra lại bằng cách ...", "hint": "Nêu một tình huống sai và cách kiểm tra"}], "checks": ["Chọn đúng chức năng chính ứng dụng dùng (thẻ A phải có ô “nghe”, thẻ D phải có ô “nhìn”; thẻ A, D thiếu ô “đọc” vẫn ghi Có); nêu đúng loại dữ liệu đầu vào", "Nêu bước xử lí chính, có bước so sánh với dữ liệu đã học; nêu đúng đầu ra", "Nêu một trường hợp ứng dụng có thể sai và cách kiểm tra lại (tiêu chí “An toàn, đạo đức, trách nhiệm”; phẩm chất Trách nhiệm)", "Mức Khá: thuyết minh đủ ba bước bằng lời của mình; bước xử lí nêu đúng loại đặc điểm máy tìm (chữ, đoạn âm, hình dạng, màu) và việc so với dữ liệu đã học", "Mức Tốt: thuyết minh mạch lạc từ đầu vào tới đầu ra; với thẻ A, D chỉ ra được chỗ ứng dụng chuyển từ “nghe” hoặc “nhìn” sang “đọc”; cách kiểm tra lại gắn đúng với nguyên nhân có thể gây sai; nêu được người dùng là người quyết định có dùng kết quả hay không"], "sample": "Thuyết minh mẫu (ứng dụng không có trong bốn thẻ): bàn phím điện thoại gợi ý từ tiếp theo khi em gõ tin nhắn. Chức năng: “đọc”. Đầu vào là những chữ em vừa gõ. AI tách câu thành từ, đổi từ thành con số rồi so sánh với dữ liệu đã học từ rất nhiều câu để tìm những từ hay đi tiếp. Đầu ra là vài từ gợi ý hiện phía trên bàn phím. Gợi ý có thể sai ý em, nhất là khi em viết tắt hoặc dùng từ ít gặp, nên em đọc lại tin nhắn trước khi gửi. Mẫu nhận xét: “Em đã nêu được đầu vào và đầu ra của ứng dụng. Phần xử lí còn thiếu bước so sánh với dữ liệu đã học. Em đọc lại hàng Nhìn ở phần C rồi bổ sung bước đó.” Mức Tốt của nhóm: mô tả từng bước bằng lời của nhóm, chỉ ra “nghe” dùng lại cách “đọc”; so sánh rõ điểm giống, điểm khác giữa AI và con người; giải thích lỗi truyền từ bước trước sang bước sau, đề xuất cách giảm lỗi."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 8 • Môn đảm nhiệm: Khoa học tự nhiên • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
