<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 2. Nhận diện nguy cơ AI theo dõi và thao túng người dùng – Lớp 8</title>
<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🕵️", "title": "Bài 2. Nhận diện nguy cơ AI theo dõi và thao túng người dùng – Lớp 8", "ainote": "Mọi dữ liệu trong bài là giả lập. Không kể ứng dụng hay dữ liệu thật của mình hoặc của bạn; tên ứng dụng là giả định, không gán hành vi vi phạm cho ứng dụng có thật. Điều hệ thống suy ra về tâm trạng có thể sai nên không dùng để kết luận về một người. Gặp dấu hiệu bị kiểm soát thì dừng lại, hỏi cha mẹ, thầy cô; ứng dụng tốt phải cho em quyền từ chối và xoá dữ liệu.", "takeaways": ["Chuỗi bốn bước: thu thập, phân tích, sử dụng, tác động. Bước phân tích là nơi hệ thống AI suy ra điều em chưa hề nói ra, có thể sai nhưng vẫn được dùng để chọn nội dung.", "Năm loại dữ liệu cá nhân hay bị ghi lại: vị trí, thói quen, hình ảnh, giọng nói, sở thích.", "Bốn hiện tượng AI kiểm soát người dùng: bị theo dõi mà không biết; bị đề xuất một chiều; bị thao túng suy nghĩ hoặc hành động; bị mất quyền kiểm soát dữ liệu. Thu thập minh bạch và có lựa chọn thì không phải hiện tượng này.", "Lưu ý khi đọc phiếu: đồng hồ đếm ngược, nút to nút nhỏ, không có chỗ xoá là thiết kế giao diện của ứng dụng; phần của AI là chọn đúng người, đúng lúc để đưa thông báo, ưu đãi. Gạch chân riêng các chi tiết giao diện thì chưa đủ là dấu hiệu của hiện tượng sử dụng AI; dấu hiệu phải cho thấy AI đoán, chọn điều gì hoặc dùng dữ liệu nào (ở tình huống C: AI học giờ Tú hay mở máy để chọn giờ gửi thông báo).", "Giữ quyền tự chủ: dừng lại, tìm nội dung khác chiều, hỏi cha mẹ, thầy cô, kiểm tra quyền của ứng dụng, báo khi cần."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Đoán xem chị K đang thế nào?", "nav": "Dấu vết của chị K", "icon": "🔮", "badge": "Nhà dự đoán", "intro": "Bốn dấu vết dùng ứng dụng trong một tuần của nhân vật giả định chị K, lớp 9: tìm “đề thi vào lớp 10 môn Toán”; mở ứng dụng video lúc 23 giờ 30, năm đêm liền; nghe danh sách “nhạc tập trung”; xem hết sáu video “học 10 tiếng một ngày”. Vấn đề học tập: không ai nói với ứng dụng rằng chị K lo thi, thức khuya; hệ thống AI của ứng dụng biết bằng cách nào và làm gì với điều đó? Các cặp tự đoán; thầy cô giữ các ý đoán ở góc bảng tới HĐ 4. Mọi đáp án dưới đây là đáp án tham khảo, chấp nhận phương án khác có lí do.", "qs": [{"q": "(1) Chị K đang thế nào?", "opts": ["Chị K sắp thi vào lớp 10, đang áp lực, thường thức khuya", "Chị K đang nghỉ hè, không có việc gì phải lo", "Chị K chỉ đang tìm video để cười"], "a": 0, "why": "Câu hỏi (1). Chị K đang thế nào? Ý đoán chấp nhận được: chị K sắp thi vào lớp 10, đang áp lực, thường thức khuya. Chấp nhận mọi ý đoán có lí do dựa vào dấu vết."}, {"q": "(2) Nếu em là ứng dụng muốn chị K ở lại lâu và mua hàng, em đưa gì cho chị, lúc mấy giờ?", "opts": ["Khoá luyện thi giảm giá, video “học xuyên đêm”, quảng cáo đèn học, đưa vào khoảng 23 giờ", "Quảng cáo đồ ăn sáng, đưa lúc 6 giờ sáng", "Không đưa gì vì ứng dụng không biết chị K"], "a": 0, "why": "Câu hỏi (2). Nếu em là ứng dụng muốn chị K ở lại lâu và mua hàng, em đưa gì cho chị, lúc mấy giờ? Ví dụ: khoá luyện thi giảm giá, video “học xuyên đêm”, quảng cáo đèn học, đưa vào khoảng 23 giờ."}, {"q": "Bằng chứng nào khiến em tin? Điều gì có thể làm ý đoán thay đổi? (chọn nhiều đáp án)", "opts": ["Bằng chứng là dấu vết cụ thể: mở ứng dụng lúc 23 giờ 30 năm đêm liền, lượt tìm đề thi", "Ý đoán có thể đổi nếu biết thêm, ví dụ chị K thức khuya vì phải trông em, tìm đề thi giúp bạn", "Chắc chắn là điện thoại đang nghe lén chị K", "Ý đoán không bao giờ thay đổi vì ứng dụng luôn đúng"], "a": [0, 1], "why": "Câu hỏi gợi mở ở B3, “Bằng chứng nào khiến em tin? Điều gì có thể làm ý đoán thay đổi?”: bằng chứng là dấu vết cụ thể (mở ứng dụng lúc 23 giờ 30 năm đêm liền, lượt tìm đề thi). Ý đoán có thể đổi nếu biết thêm, ví dụ chị K thức khuya vì phải trông em, tìm đề thi giúp bạn."}, {"q": "(3) Câu hỏi lớn của bài: Vì sao có lúc ta bị theo dõi mà không biết; có lúc biết rồi mà vẫn không dừng được? (chọn nhiều đáp án)", "opts": ["Ứng dụng ghi lại dấu vết dừng, lướt, giờ mở, vị trí mà không nói dùng để làm gì, rồi AI suy ra những điều ta không hề nói ra", "AI chọn đúng thứ, đúng giờ ta dễ bị cuốn; giao diện thúc giục; có dịch vụ không cho lựa chọn tắt hay xoá", "Vì người dùng luôn tự quyết định mọi thứ mình thấy", "Vì ứng dụng chỉ hiện nội dung ngẫu nhiên"], "a": [0, 1], "why": "Câu hỏi (3), câu hỏi lớn của bài, chưa trả lời ở HĐ 1; GV giữ các ý đoán ở góc bảng tới HĐ 4. HS nêu “điện thoại nghe lén” thì GV ghi ý đó kèm dấu hỏi, chưa khẳng định, chưa bác bỏ. Ý trả lời mong đợi (GV kết luận ở B4 HĐ 4): - Bị theo dõi mà không biết: ứng dụng ghi lại dấu vết dừng, lướt, giờ mở, vị trí mà không nói dùng để làm gì, rồi hệ thống AI của ứng dụng suy ra những điều ta không hề nói ra; - Biết rồi mà vẫn không dừng được: AI chọn đúng thứ, đúng giờ ta dễ bị cuốn; giao diện thúc giục; có dịch vụ không cho lựa chọn tắt hay xoá. Quyền tự chủ bị bào mòn dù không ai quyết định thay ta."}]}, {"type": "order", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Luật chơi “Hai người dùng, một hệ thống”", "nav": "Luật và hồ sơ suy ra", "icon": "📜", "badge": "Người giữ luật", "intro": "Nhóm chơi đóng vai: một bạn giữ vai Hệ thống, hai bạn là Người dùng, quan sát viên đếm số lần Dừng. Hãy sắp xếp 5 điều luật của Sổ ghi trò chơi theo đúng thứ tự. Hướng dẫn đánh giá: bộ thẻ không dùng để đánh giá. Kết quả chơi ghi ở Sổ ghi trò chơi (PL8.2.2); ván mẫu ở PL8.2.6, mục 2. Mọi thẻ là dữ liệu giả lập; Người dùng nói “Dừng” hay “Lướt” theo thẻ vai, không theo sở thích thật. Thẻ luật: THẺ VAI B. Em dừng ở mọi thẻ Nấu ăn. Em dừng ở video Ca nhạc nhưng lướt qua quảng cáo tai nghe. Các thẻ khác: lướt.", "items": ["1. Mỗi Người dùng rút 1 thẻ vai bí mật khác nhau, không cho ai xem. Hệ thống giữ chồng thẻ nội dung và ghi sổ.", "2. Mọi nhóm chơi 2 lượt: lượt 1 lúc 7 giờ sáng; lượt 2 lúc 20 giờ. Nhóm xong sớm chơi thêm lượt 3 (22 giờ), lượt 4 (23 giờ).", "3. Lượt 1 là bảng tin chung: Hệ thống đặt 6 thẻ, mỗi chủ đề 1 thẻ. Hai Người dùng lần lượt nói “Dừng” hoặc “Lướt” với từng thẻ, đúng theo thẻ vai.", "4. Từ lượt 2 là bảng tin riêng: Hệ thống đặt cho mỗi Người dùng 3 thẻ, tự chọn dựa vào sổ. Mục tiêu duy nhất: cả hai nói “Dừng” càng nhiều càng tốt. Ở lượt 2, mỗi bảng tin riêng có ít nhất 1 thẻ thuộc chủ đề người đó đã Lướt ở lượt 1 (để thử). Thẻ dùng xong trả lại chồng.", "5. Quan sát viên đếm, với Người dùng mình theo dõi (nhóm chỉ có một quan sát viên thì theo dõi cả hai), mỗi lượt có mấy lần “Dừng”; ở lượt cuối, mấy thẻ thuộc chủ đề người đó đã Dừng ở lượt trước. Quan sát viên thứ ba (nếu có) đếm chủ đề hai bảng tin còn trùng. Số lần Dừng ghi vào bảng; hai số còn lại ghi ở phần So sánh."], "why": "Bạn giữ vai Hệ thống giữ chồng thẻ nội dung và ghi sổ. Sổ ghi trò chơi gồm bảng: Lượt (giờ) | Người dùng 1: thẻ đã đưa (chủ đề), Dừng (D) hay Lướt (L) | Số lần Dừng | Người dùng 2: thẻ đã đưa (chủ đề), Dừng (D) hay Lướt (L) | Số lần Dừng; các dòng Lượt 1, 7 giờ; Lượt 2, 20 giờ; Lượt 3, 22 giờ (nếu xong sớm); Lượt 4, 23 giờ (nếu xong sớm). Hồ sơ suy ra: viết trước khi lật thẻ vai. Hồ sơ có đúng thẻ vai không? Đúng ở ……; sai ở …… (sửa bằng bút khác màu, không tẩy) So sánh 1. Lượt cuối, trong 3 thẻ của mỗi Người dùng, mấy thẻ thuộc chủ đề người đó đã Dừng ở lượt trước (lượt 2 nhiều nhất là 2, vì có 1 thẻ thử)? Người dùng 1: …… thẻ. Người dùng 2: …… thẻ. So sánh 2. Lượt cuối nhóm chơi được, hai bảng tin còn chung chủ đề nào? …… Sau trò chơi, nhóm trả lời: Câu hỏi (1). Hồ sơ nhóm đoán đúng thẻ vai ở đâu, sai ở đâu? Bằng chứng nào khiến nhóm tin? Nhóm đối chiếu hồ sơ với thẻ vai vừa lật; chỗ sai sửa bằng bút khác màu. Bằng chứng là các lần Dừng ghi trong sổ, theo từng giờ. Câu hỏi (2). Hệ thống chỉ thấy lượt dừng, lướt thì bỏ sót điều gì? Ai có thể bị đoán sai? Hệ thống không biết vì sao người dùng dừng: người dừng vì tò mò, vì bạn đưa máy cho xem, vì dùng chung máy với anh chị cũng bị đoán là thích. Số lần Dừng đo việc dừng lại, không đo người đó có thích thật hay việc xem có lợi hay không. Thẻ và ván chơi là giả lập, không phải bằng chứng về một ứng dụng cụ thể. Câu hỏi (3). Trong ứng dụng video thật, cái gì làm việc đoán và chọn của bạn Hệ thống? Nó khác bạn Hệ thống ở điểm nào? Hệ thống AI của ứng dụng (chấp nhận “AI của ứng dụng”). Khác ở chỗ làm tự động, rất nhanh, với rất nhiều người cùng lúc. Kiến thức chốt: Dữ liệu cá nhân là thông tin xác định hoặc giúp xác định một con người cụ thể; các lần dừng, lướt gắn với tài khoản, điện thoại của em cũng là dữ liệu cá nhân. Hệ thống ghi lại (thu thập), đoán em thích gì, giờ nào dễ bị cuốn (phân tích), chọn thứ em thấy tiếp (sử dụng); em dừng nhiều hơn mà chỉ còn thấy vài chủ đề (tác động)."}, {"type": "flag", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "18 thẻ nội dung và thẻ vai bí mật", "nav": "Bộ thẻ và thẻ vai", "icon": "🃏", "badge": "Người giữ thẻ", "intro": "Bộ thẻ gồm 18 thẻ nội dung (6 chủ đề, mỗi chủ đề 3 thẻ). Thẻ vai bí mật và thẻ luật: <br>• THẺ VAI A. Em dừng ở mọi thẻ Bóng đá. Từ lượt 2 (buổi tối) em dừng thêm ở mọi thẻ Tin giật gân. Các thẻ khác: lướt. <br>• THẺ VAI B. Em dừng ở mọi thẻ Nấu ăn. Em dừng ở video Ca nhạc nhưng lướt qua quảng cáo tai nghe. Các thẻ khác: lướt. <br>• THẺ VAI C. Em dừng ở mọi thẻ Trò chơi điện tử. Từ lượt 2 (buổi tối, sắp thi) em dừng thêm ở mọi thẻ Mẹo học. Các thẻ khác: lướt. <br>• THẺ LUẬT CHO NGƯỜI DÙNG. Giữ kín thẻ vai đến khi được lật. Với mỗi thẻ: nói “Dừng” hoặc “Lướt” đúng theo thẻ vai, không theo ý thích của em.<br>Em đóng vai Hệ thống: với Người dùng vai A ở lượt 2 (buổi tối), hãy gắn cờ những thẻ mà bạn ấy sẽ nói “Dừng”. Hướng dẫn đánh giá: bộ thẻ không dùng để đánh giá. Kết quả chơi ghi ở Sổ ghi trò chơi (PL8.2.2); ván mẫu ở PL8.2.6, mục 2. Mọi thẻ là dữ liệu giả lập; Người dùng nói “Dừng” hay “Lướt” theo thẻ vai, không theo sở thích thật.", "cols": ["Chủ đề", "Loại thẻ", "Nội dung thẻ"], "flagWhat": "mà vai A sẽ Dừng ở lượt 2", "rows": [{"c": ["BÓNG ĐÁ", "Video", "BÓNG ĐÁ. Video: 10 bàn thắng đẹp nhất tuần"], "bad": true, "why": "Thẻ vai A: dừng ở mọi thẻ Bóng đá; từ lượt 2 (buổi tối) dừng thêm ở mọi thẻ Tin giật gân."}, {"c": ["BÓNG ĐÁ", "Video", "BÓNG ĐÁ. Video: Cách sút phạt cong"], "bad": true, "why": "Thẻ vai A: dừng ở mọi thẻ Bóng đá; từ lượt 2 (buổi tối) dừng thêm ở mọi thẻ Tin giật gân."}, {"c": ["BÓNG ĐÁ", "Quảng cáo", "BÓNG ĐÁ. Quảng cáo: Giày đá bóng giảm 30%, chỉ hôm nay"], "bad": true, "why": "Thẻ vai A: dừng ở mọi thẻ Bóng đá; từ lượt 2 (buổi tối) dừng thêm ở mọi thẻ Tin giật gân."}, {"c": ["CA NHẠC", "Video", "CA NHẠC. Video: Hậu trường buổi diễn của ban nhạc"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["CA NHẠC", "Video", "CA NHẠC. Video: Học đệm ghi-ta một bài hát quen thuộc"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["CA NHẠC", "Quảng cáo", "CA NHẠC. Quảng cáo: Tai nghe không dây giá sốc"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["MẸO HỌC", "Video", "MẸO HỌC. Video: Mẹo nhớ công thức hình học"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["MẸO HỌC", "Video", "MẸO HỌC. Video: Lập thời gian biểu ôn thi"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["MẸO HỌC", "Quảng cáo", "MẸO HỌC. Quảng cáo: Khoá luyện thi trực tuyến giảm 50%"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["TRÒ CHƠI ĐIỆN TỬ", "Video", "TRÒ CHƠI ĐIỆN TỬ. Video: Mẹo qua màn khó"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["TRÒ CHƠI ĐIỆN TỬ", "Video", "TRÒ CHƠI ĐIỆN TỬ. Video: Bình luận trận đấu thể thao điện tử"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["TRÒ CHƠI ĐIỆN TỬ", "Quảng cáo", "TRÒ CHƠI ĐIỆN TỬ. Quảng cáo: Gói vật phẩm, ưu đãi chỉ còn 2 giờ"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["NẤU ĂN", "Video", "NẤU ĂN. Video: Làm trà sữa tại nhà"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["NẤU ĂN", "Video", "NẤU ĂN. Video: Món ăn sáng 5 phút"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["NẤU ĂN", "Quảng cáo", "NẤU ĂN. Quảng cáo: Đồ ăn vặt mua 1 tặng 1"], "bad": false, "why": "Thẻ vai A: các thẻ khác, lướt."}, {"c": ["TIN GIẬT GÂN", "Video", "TIN GIẬT GÂN. Video: Chuyện lạ trong ngôi nhà bỏ hoang"], "bad": true, "why": "Thẻ vai A: dừng ở mọi thẻ Bóng đá; từ lượt 2 (buổi tối) dừng thêm ở mọi thẻ Tin giật gân."}, {"c": ["TIN GIẬT GÂN", "Video", "TIN GIẬT GÂN. Video: 5 điều đáng sợ về đáy biển"], "bad": true, "why": "Thẻ vai A: dừng ở mọi thẻ Bóng đá; từ lượt 2 (buổi tối) dừng thêm ở mọi thẻ Tin giật gân."}, {"c": ["TIN GIẬT GÂN", "Quảng cáo", "TIN GIẬT GÂN. Quảng cáo: Trò chơi kinh dị mới ra mắt"], "bad": true, "why": "Thẻ vai A: dừng ở mọi thẻ Bóng đá; từ lượt 2 (buổi tối) dừng thêm ở mọi thẻ Tin giật gân."}], "after": "Với vai A, lượt 2 có 6 thẻ Dừng: mọi thẻ Bóng đá và mọi thẻ Tin giật gân; thẻ vai B dừng ở mọi thẻ Nấu ăn và video Ca nhạc (lướt quảng cáo tai nghe); thẻ vai C dừng ở mọi thẻ Trò chơi điện tử và từ lượt 2 thêm mọi thẻ Mẹo học. Mọi thẻ là dữ liệu giả lập; Người dùng nói “Dừng” hay “Lướt” theo thẻ vai, không theo sở thích thật."}, {"type": "lab", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Hệ thống đoán và chọn: ván mẫu", "nav": "Hệ thống đoán và chọn", "icon": "🎛️", "badge": "Người hiểu hệ thống", "intro": "Ván mẫu (vai A là Người dùng 1, vai C là Người dùng 2; mọi nhóm chơi lượt 1, lượt 2; lượt 3 chỉ dành cho nhóm xong sớm):<br>• Lượt: 1 (7 giờ), bảng tin chung / Bóng đá D; Ca nhạc, Mẹo học, Trò chơi điện tử, Nấu ăn, Tin giật gân L / Trò chơi điện tử D; Bóng đá, Ca nhạc, Mẹo học, Nấu ăn, Tin giật gân L / không tính / 1; 1<br>• Lượt: 2 (20 giờ) / Bóng đá 2 thẻ (có quảng cáo giày), Tin giật gân: D, D, D / Trò chơi điện tử 2 thẻ (có quảng cáo gói vật phẩm), Mẹo học: D, D, D / 2; 2 / 3; 3<br>• Lượt: 3 (22 giờ) / Bóng đá, Tin giật gân 2 thẻ (có quảng cáo trò chơi kinh dị): D, D, D / Trò chơi điện tử, Mẹo học 2 thẻ (có quảng cáo khoá luyện thi): D, D, D / 3; 3 / 3; 3<br>Mỗi Người dùng dừng 7 lần trên 12 thẻ. Ở lượt 2, thẻ thử của vai A là Tin giật gân, của vai C là Mẹo học.<br>Em kéo thanh trượt để xem tỉ lệ Dừng và độ giống nhau của hai bảng tin thay đổi khi bảng tin chuyển từ chung sang riêng.", "sliders": [{"id": "cn", "n": "Mức bảng tin riêng hoá (lượt 1 = 0%: bảng tin chung)", "min": 0, "max": 100, "val": 0, "unit": "%"}, {"id": "lt", "n": "Số lượt đã chơi (lượt 1, 2, 3)", "min": 1, "max": 3, "val": 1, "unit": ""}], "outputs": [{"n": "Tỉ lệ thẻ Người dùng nói “Dừng”", "base": 17, "w": {"cn": 0.7, "lt": 8}, "c": 0}, {"n": "Mức hai bảng tin còn chung chủ đề", "base": 100, "w": {"cn": -0.5, "lt": -15}, "c": 2}], "insights": [{"id": "cn", "op": "<=", "val": 0, "txt": "Lượt 1 là bảng tin chung: 6 chủ đề do luật định, không dùng để so. Mỗi Người dùng chỉ dừng 1 trên 6 thẻ (ván mẫu: 1; 1)."}, {"id": "cn", "op": ">=", "val": 60, "txt": "Hồ sơ suy ra mẫu: Người dùng 1 “thích bóng đá; buổi tối dễ dừng ở tin giật gân”; Người dùng 2 “mê trò chơi điện tử; buổi tối quan tâm mẹo học, có thể sắp thi”. Kết quả mỗi nhóm có thể khác; điều cần thấy khi nhóm chơi 2 lượt là: ở lượt 2, 2 trong 3 thẻ thuộc chủ đề người đó đã Dừng ở lượt 1 (thẻ còn lại là thẻ thử theo luật 4); tỉ lệ Dừng tăng (lượt 1: 1 trên 6 thẻ; lượt 2: 2–3 trên 3 thẻ); hai chủ đề chính (2 thẻ) của hai bảng tin đã khác nhau. Thẻ thử có thể rơi vào chủ đề của người kia nên ở lượt 2 hai bảng tin có thể còn chung một chủ đề; nhóm chơi tới lượt 3 thì thường không còn chủ đề chung. Lượt 3 không còn thẻ thử bắt buộc nên cả 3 thẻ có thể dồn vào chủ đề đã Dừng (ván mẫu: 3 trên 3). Lượt 1 có 6 chủ đề do luật định, không dùng để so."}, {"id": "lt", "op": ">=", "val": 3, "txt": "Lượt 3 không còn thẻ thử bắt buộc nên cả 3 thẻ có thể dồn vào chủ đề đã Dừng (ván mẫu: 3 trên 3); nhóm chơi tới lượt 3 thì thường không còn chủ đề chung."}, {"id": "cn", "op": ">=", "val": 100, "txt": "Hai dòng so sánh ở phần So sánh của sổ ghi (theo ván mẫu, chơi 2 lượt): ở lượt 2, mỗi Người dùng có 2 trong 3 thẻ thuộc chủ đề đã Dừng ở lượt 1; hai bảng tin không còn chủ đề chung. Nhóm ghi “còn chung một chủ đề” vì thẻ thử ở lượt 2 thì vẫn chấp nhận. Nhóm chơi tới lượt 3 thì ghi theo lượt 3 (ván mẫu: 3 trong 3 thẻ)."}]}, {"type": "match", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Sơ đồ dấu vết dữ liệu của Khang", "nav": "Dấu vết của Khang", "icon": "🧵", "badge": "Lần theo dấu vết", "intro": "Mỗi thẻ in kèm phần “Cách làm” dưới đây. Em kẻ sơ đồ bốn ô vào vở, chọn một cách: viết bốn ô hoặc vẽ bốn khung tranh, mỗi khung một dòng chú thích. Ô 1. THU THẬP: dữ liệu gì bị ghi, từ việc gì? Ô 2. PHÂN TÍCH: hệ thống suy ra được gì về Khang? Ô 3. SỬ DỤNG: hệ thống làm gì với điều đó? Ô 4. TÁC ĐỘNG: tới hành vi, suy nghĩ hoặc quyết định của Khang? Mẫu câu cho ô Phân tích: “Từ việc …, hệ thống đoán được Khang …”. Em ghép từng thẻ dữ liệu giả định của Khang với chuỗi bốn ô đúng.", "pairs": [["Thẻ ① Vị trí (giả định). Khang, lớp 8, bật định vị cho ứng dụng bản đồ. Ngày nào ứng dụng cũng ghi: 6 giờ 45 rời một địa chỉ, 7 giờ 5 phút tới trường, 17 giờ 30 tới một nhà khác, chiều thứ Bảy tới sân bóng.", "Thu thập: Vị trí theo giờ mỗi ngày. Phân tích (suy ra): Nhà Khang ở đâu, học trường nào, giờ tan học, nơi học thêm, cuối tuần hay đá bóng. Sử dụng: Hiện quảng cáo quán ăn gần trường lúc 17 giờ, cửa hàng đồ thể thao gần sân bóng chiều thứ Bảy. Tác động: Khang ghé quán, mua đồ theo gợi ý dù không định."], ["Thẻ ② Thói quen (giả định). Ứng dụng video ghi: Khang, lớp 8, mở ứng dụng nhiều nhất từ 21 giờ đến 23 giờ; phần lớn video bị lướt qua sau 3 giây, riêng video hài và video bóng đá được xem hết.", "Thu thập: Giờ mở ứng dụng, video nào xem hết, video nào lướt. Phân tích (suy ra): Khang dễ bị cuốn vào buổi tối; thích hài, bóng đá. Sử dụng: Gửi thông báo lúc 21 giờ; tự phát tiếp video hài, bóng đá. Tác động: Khang thức khuya hơn dự định, khó dừng (tác động tới hành vi)."], ["Thẻ ③ Hình ảnh (giả định). Trong tháng, Khang, lớp 8, đăng 20 ảnh: nhiều ảnh mặc áo một đội bóng, chụp ở quán trà sữa gần trường; ba ảnh chụp chiếc xe đạp cũ kèm dòng “muốn đổi xe quá”.", "Thu thập: Ảnh Khang đăng: áo đội bóng, nơi chụp, chiếc xe, dòng chú thích. Phân tích (suy ra): Đội bóng Khang thích, nơi Khang hay đến, Khang đang muốn đổi xe. Sử dụng: Hiện quảng cáo áo đấu; quảng cáo xe đạp mới “trả góp 0 đồng” của cửa hàng gần trường. Tác động: Khang bị cuốn vào việc mua xe, xin tiền cha mẹ dù xe cũ còn đi được (tác động tới quyết định)."], ["Thẻ ④ Giọng nói (giả định). Khang (lớp 8) hay nói với trợ lí giọng nói trên điện thoại: “Tìm giày đá bóng cỡ 41”, “Đặt báo thức 6 giờ”, “Mở bài hát buồn”.", "Thu thập: Câu Khang nói với trợ lí (chuyển thành chữ). Phân tích (suy ra): Khang cần giày cỡ 41; dậy lúc 6 giờ; có lúc đang buồn. Sử dụng: Hiện quảng cáo giày cỡ 41; đề xuất thêm nhiều bài hát buồn. Tác động: Khang thấy toàn nhạc buồn, tâm trạng buồn kéo dài; bị thúc mua giày (tác động tới suy nghĩ, cảm xúc)."], ["Thẻ ⑤ Sở thích (giả định). Khang, lớp 8, bấm thích 15 bài về trò chơi “Rồng Vàng”, theo dõi 3 kênh chơi trò này, tìm “mẹo qua màn 20”.", "Thu thập: Lượt thích, kênh theo dõi, từ khoá tìm kiếm. Phân tích (suy ra): Khang mê “Rồng Vàng”, đang kẹt ở màn 20. Sử dụng: Hiện quảng cáo “gói vật phẩm qua màn ngay, chỉ còn 2 giờ”. Tác động: Khang nạp tiền vội vì sợ hết ưu đãi (tác động tới quyết định)."]], "why": "Đáp án mẫu năm thẻ (chấp nhận cách diễn đạt khác đúng ý; HS vẽ khung tranh thì đọc theo dòng chú thích): Tiêu chí kiểm tra ô Phân tích: ô này là điều hệ thống suy ra, không chép lại dữ liệu trên thẻ. Ví dụ: ghi “Khang xem video lúc 22 giờ” là chép lại; ghi “Khang dễ bị cuốn vào video buổi tối” là điều suy ra. Ô Tác động phải nối được với ô Sử dụng (thấy quảng cáo nào thì làm gì, nghĩ gì). Gợi ý chọn hai HS đọc chuỗi ở B3 (hai thẻ có tác động khác loại): thẻ ② (tới hành vi: thức khuya), thẻ ④ (tới suy nghĩ, cảm xúc: nhạc buồn), thẻ ⑤ hoặc thẻ ③ (tới quyết định: nạp tiền vội, đòi mua xe). Câu hỏi (1). Bằng chứng nào khiến em tin hệ thống đoán như vậy? Điều gì có thể làm kết luận thay đổi? Bằng chứng là dữ liệu trên thẻ. Điều hệ thống suy ra có thể sai: dòng “muốn đổi xe quá” có thể chỉ là câu đùa; câu “Mở bài hát buồn” có thể chỉ vì thích giai điệu; nhà khác lúc 17 giờ 30 có thể là nhà ông bà chứ không phải lớp học thêm. Hệ thống vẫn dùng điều đoán được để chọn nội dung. Ví dụ cho HS xong sớm (ghép hai thẻ): thẻ ② và thẻ ⑤ cho biết Khang mở ứng dụng từ 21 giờ đến 23 giờ và đang kẹt màn 20, nên quảng cáo gói vật phẩm có thể đến đúng 22 giờ. Thẻ ① và thẻ ③ cho biết nơi Khang hay đến và Khang muốn đổi xe, nên quảng cáo cửa hàng xe gần quán trà sữa có thể hiện ra. Kiến thức chốt: Dữ liệu đi qua chuỗi thu thập, phân tích, sử dụng, tác động. Bước phân tích là nơi hệ thống AI suy ra những điều người dùng không hề nói ra; điều suy ra có thể sai nhưng vẫn được dùng để chọn nội dung. Đồng ý cho ứng dụng lấy một dữ liệu là đồng ý cho một việc em được biết trước; ứng dụng lấy thêm hay dùng vào việc khác mà không nói thì không còn là điều em đã đồng ý."}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Thám tử dấu hiệu (Phiếu học tập số 1)", "nav": "Thám tử dấu hiệu", "icon": "🔍", "badge": "Thám tử dấu hiệu", "intro": "Số hiện tượng: 1. Bị theo dõi mà không biết (dùng AI không minh bạch hoặc sai mục đích); 2. Bị đề xuất một chiều; 3. Bị thao túng suy nghĩ hoặc hành động; 4. Bị mất quyền kiểm soát dữ liệu; 5. Có thu thập nhưng minh bạch, có lựa chọn. Mỗi tình huống có dòng: Hiện tượng số …… Người phụ trách ……; Người dùng nhận ra lúc nào ……. Với mỗi tình huống giả định A–E: ghi số hiện tượng, tìm chữ cho thấy AI đang đoán, chọn điều gì hoặc dùng dữ liệu nào; điều nhóm tự suy ra thì viết ra lề, mở đầu bằng “Suy ra:”; viết dòng “Người dùng nhận ra lúc nào”. Ba câu hỏi tự kiểm (em tự hỏi mỗi khi dùng một ứng dụng): Ai đang biết gì về em? (biết); Em còn lựa chọn không, có từ chối được không? (chọn); Ý này, việc này là của em hay của hệ thống? (quyết định).", "cats": ["1. Bị theo dõi mà không biết (dùng AI không minh bạch hoặc sai mục đích)", "2. Bị đề xuất một chiều", "3. Bị thao túng suy nghĩ hoặc hành động", "4. Bị mất quyền kiểm soát dữ liệu", "5. Có thu thập nhưng minh bạch, có lựa chọn"], "cards": [{"t": "Tình huống A (giả định). Minh dùng ứng dụng xe đưa đón “Xe Đón Ong Vàng” để cha mẹ biết xe tới đâu. Ứng dụng vẫn ghi vị trí cả buổi tối và Chủ nhật. Mục “Những nơi em hay đến” do AI của ứng dụng tự tổng hợp, liệt kê nhà bạn Hùng, quán net, lớp học thêm. Không dòng nào nói vị trí ngoài giờ đi xe dùng để làm gì.", "g": [0], "why": "Hiện tượng: 1. Bị theo dõi mà không biết (AI dùng sai mục đích, không minh bạch). Dấu hiệu nhìn thấy được: AI tự tổng hợp “Những nơi em hay đến” từ vị trí ghi cả buổi tối, Chủ nhật, ngoài mục đích theo dõi xe đưa đón; không nói dùng để làm gì. Người dùng nhận ra lúc nào? Khi thấy mục “Những nơi em hay đến” có cả nơi ngoài giờ đi xe."}, {"t": "Tình huống B (giả định). Hà xem 3 video chê một ca sĩ. Từ hôm đó, mục video AI gợi ý cho Hà: lướt 10 video thì 8 video cùng một ý “ca sĩ ấy hát dở”. Hà bắt đầu nghĩ “ai cũng ghét ca sĩ ấy”. Mai cùng lớp mở cùng ứng dụng thì thấy toàn video khen ca sĩ đó.", "g": [1], "why": "Hiện tượng: 2. Bị đề xuất một chiều. Dấu hiệu nhìn thấy được: 8 trong 10 video AI gợi ý cùng một ý; bạn mở cùng ứng dụng thấy ý ngược lại. Người dùng nhận ra lúc nào? Khi lướt thấy gần như video nào cũng nói một ý; khi so màn hình với bạn."}, {"t": "Tình huống C (giả định). Tú hay chơi “Rồng Vàng” khoảng 22 giờ. Hệ thống AI của trò chơi học giờ Tú hay mở máy nên tối nào đúng 22 giờ cũng gửi: “Bạn sắp mất phần thưởng chuỗi 15 ngày!”. Trong cửa hàng có đồng hồ “Ưu đãi kết thúc sau 04:59”, nút “MUA NGAY” to màu đỏ, nút “Để sau” chữ nhỏ màu xám.", "g": [2], "why": "Hiện tượng: 3. Bị thao túng suy nghĩ hoặc hành động. Dấu hiệu nhìn thấy được: AI học giờ Tú hay mở máy để gửi thông báo đúng 22 giờ doạ mất phần thưởng; kèm đồng hồ đếm ngược, nút mua to, nút từ chối nhỏ và mờ. Người dùng nhận ra lúc nào? Khi thông báo đến đúng giờ mình hay chơi; khi thấy đồng hồ đếm ngược."}, {"t": "Tình huống D (giả định). Để nhận 50 xu miễn phí, Quân cho ứng dụng “Đố Vui Cùng Bạn” quyền đọc danh bạ. Ứng dụng dùng AI đoán xem bạn nào trong danh bạ dễ cài theo nhất rồi tự gửi tin mời chơi dưới tên Quân. Quân muốn xoá dữ liệu đã cho nhưng tìm khắp phần cài đặt không thấy chỗ xoá.", "g": [3, 0], "why": "Hiện tượng: 4. Bị mất quyền kiểm soát dữ liệu (kèm: danh bạ là dữ liệu của bạn bè, họ chưa đồng ý). Dấu hiệu nhìn thấy được: AI dùng danh bạ để chọn người, gửi tin dưới tên Quân; không tìm thấy chỗ xoá. Người dùng nhận ra lúc nào? Khi bạn bè báo nhận tin mời; khi tìm chỗ xoá mà không có."}, {"t": "Tình huống E (giả định). Ứng dụng thư viện trường dùng AI gợi ý sách. Màn hình đầu tiên ghi: “Ứng dụng dùng lịch sử mượn sách của em để gợi ý sách. Em có thể tắt gợi ý hoặc xoá lịch sử bất cứ lúc nào.” Trong ứng dụng có nút “Tắt gợi ý” và nút “Xoá lịch sử mượn”.", "g": [4], "why": "Hiện tượng: 5. Có thu thập nhưng minh bạch, có lựa chọn (không phải hiện tượng kiểm soát). Dấu hiệu nhìn thấy được: AI gợi ý sách nhưng nói rõ dùng lịch sử mượn sách để gợi ý; có nút “Tắt gợi ý”, “Xoá lịch sử mượn”. Người dùng nhận ra lúc nào? Ngay màn hình đầu tiên."}], "pass": 0.8}, {"type": "flag", "tag": "HĐ4 • Vận dụng", "title": "Tình huống của Linh với “Tiếng Anh Hạt Đậu” (câu 1)", "nav": "Phiếu cuối giờ", "icon": "📱", "badge": "Giữ quyền tự chủ", "intro": "Tình huống giả định. Linh cài ứng dụng miễn phí “Tiếng Anh Hạt Đậu”. Khi cài, ứng dụng xin quyền vị trí và danh bạ, không ghi dùng để làm gì. Ứng dụng ghi rõ: “Micro chỉ dùng để chấm phát âm khi em bấm nút thu âm”, có nút tắt micro. Linh thường học lúc 21 giờ 30 và đã bấm xem hai khoá luyện thi. Sau hai tuần, Linh thấy: Câu 1. Gắn cờ những chi tiết là dấu hiệu AI kiểm soát người dùng; chi tiết minh bạch, có lựa chọn thì ghi số 5, không gắn cờ. Số hiện tượng: 1. Bị theo dõi mà không biết; 2. Bị đề xuất một chiều; 3. Bị thao túng suy nghĩ hoặc hành động; 4. Bị mất quyền kiểm soát dữ liệu; 5. Có thu thập nhưng minh bạch, có lựa chọn (không phải hiện tượng kiểm soát).", "cols": ["Chi tiết trong tình huống", "Mục / tình tiết"], "flagWhat": "là dấu hiệu AI kiểm soát người dùng", "rows": [{"c": ["Khi cài, ứng dụng xin quyền vị trí và danh bạ, không ghi dùng để làm gì", "Xin quyền không ghi mục đích"], "bad": false, "why": "Chi tiết giao diện xin quyền, không ghi mục đích: gạch riêng cụm xin quyền thì xử lí như chi tiết giao diện, chỉ chấp nhận khi đi kèm cụm “Bạn thường ở nhà sau 21 giờ” hoặc điều suy ra (“ứng dụng dùng vị trí để đoán giờ Linh ở nhà”)."}, {"c": ["Ứng dụng ghi rõ: “Micro chỉ dùng để chấm phát âm khi em bấm nút thu âm”, có nút tắt micro", "Micro"], "bad": false, "why": "Chi tiết micro (“chỉ dùng để chấm phát âm khi em bấm nút thu âm”, có nút tắt) là minh bạch, có lựa chọn: ghi số 5, không phải hiện tượng. Ô “Không có hiện tượng nào” không được đánh dấu. Ứng dụng nói rõ micro dùng làm gì, chỉ dùng khi em bấm nút và có nút tắt, nên người dùng biết và còn lựa chọn."}, {"c": ["Mục “Gợi ý cho bạn” do AI của ứng dụng chọn chỉ còn các khoá luyện thi trả phí của chính ứng dụng", "Gợi ý cho bạn"], "bad": true, "why": "Hiện tượng 2, đề xuất một chiều: “Gợi ý cho bạn” do AI của ứng dụng chọn chỉ còn các khoá luyện thi trả phí của chính ứng dụng."}, {"c": ["Mục “Giờ học hợp với bạn” ghi “Bạn thường ở nhà sau 21 giờ”", "Giờ học hợp với bạn"], "bad": true, "why": "Hiện tượng 1, theo dõi không minh bạch: “Bạn thường ở nhà sau 21 giờ” (ứng dụng dùng vị trí để đoán giờ Linh ở nhà; tình huống không ghi chữ “AI”, HS tự suy ra), trong khi quyền vị trí xin lúc cài không ghi dùng để làm gì. Dấu hiệu đạt là cụm “Bạn thường ở nhà sau 21 giờ” kèm số 1."}, {"c": ["Tối nào Linh chưa mở ứng dụng thì đúng 21 giờ 30, giờ Linh hay học, ứng dụng gửi thông báo “Bạn sắp mất chuỗi 14 ngày học!”. Kèm theo là trang “Chỉ còn 2 suất giá ưu đãi”, nút “Đăng kí ngay” rất to, nút “Không, cảm ơn” nhỏ và mờ", "Thông báo doạ mất chuỗi"], "bad": true, "why": "Hiện tượng 3, thao túng: hệ thống đã học giờ học của Linh để chọn giờ gửi (HS tự suy ra); kèm “Chỉ còn 2 suất”, nút đăng kí to, nút từ chối nhỏ và mờ."}, {"c": ["Mục “Mời bạn” ghi “AI đã chọn 5 bạn trong danh bạ dễ cài ứng dụng nhất” và tự gửi tin mời dưới tên Linh", "Mục “Mời bạn”"], "bad": true, "why": "Hiện tượng 4, mất quyền kiểm soát dữ liệu: “AI đã chọn 5 bạn trong danh bạ dễ cài ứng dụng nhất” để tự gửi tin mời dưới tên Linh (danh bạ là dữ liệu của bạn bè, họ chưa đồng ý)."}, {"c": ["Linh tìm không thấy chỗ xoá tài khoản", "Xoá tài khoản"], "bad": true, "why": "Hiện tượng 4: không tìm thấy chỗ xoá tài khoản là mất quyền kiểm soát dữ liệu."}], "after": "Cách đọc câu 1 (8.A2.2): đạt khi đánh dấu đúng ít nhất một hiện tượng, kèm cụm gạch chân mang đúng số cho thấy ứng dụng đoán, chọn điều gì hoặc dùng dữ liệu nào. Ở hiện tượng 1 và 3, gạch chân đúng chi tiết và ghi đúng số là đủ; không đòi HS tìm thấy chữ “AI”. Gạch chân riêng chi tiết giao diện (“Chỉ còn 2 suất”, nút to, nút nhỏ, không thấy chỗ xoá, xin quyền không ghi mục đích) mà không có chi tiết nào cho thấy AI đoán, chọn hay dùng dữ liệu thì ghi “Chưa thấy minh chứng” (PLC.7). Trả lời câu hỏi lớn ở B4: xem mục 1."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Chuỗi bốn ô và hành động của em (câu 2, câu 3)", "nav": "Chuỗi bốn ô", "icon": "📝", "badge": "Người giữ quyền tự chủ", "intro": "Mức Đạt của từng mã là tiêu chí ở mục IV của KHBD Bài 2 lớp 8. Bảng dưới mô tả mức Khá, Tốt theo tiêu chí PLC.1 mà bài dùng. Khá, Tốt mô tả chất lượng lập luận và mức tự lực, không đếm số hiện tượng; mức Đạt có thể cần GV gợi ý mới hoàn thành. Câu 2 có chữ G (GV đã gợi ý ở B2 HĐ 4) thì cao nhất là mức Đạt, không xếp Khá, Tốt. Em tự làm, không ghi dữ liệu thật của mình hay của bạn. Câu 2: em chọn một dữ liệu ứng dụng thu được về Linh (nên khác loại với thẻ dữ liệu của Khang) rồi viết bốn ô. Gợi ý nếu cần: giờ Linh học mỗi tối; hai khoá luyện thi Linh bấm xem. Câu 3: Nếu là Linh, em chọn làm gì? Khi chọn, em nghĩ cả tới các bạn trong danh bạ của Linh. Dành cho em làm xong sớm: Vì sao chi tiết về micro không phải hiện tượng kiểm soát? (Ứng dụng nói rõ micro dùng làm gì, chỉ dùng khi em bấm nút và có nút tắt, nên người dùng biết và còn lựa chọn.)", "fields": [{"id": "dl", "label": "Dữ liệu em chọn", "ph": "ví dụ: giờ Linh học (khoảng 21 giờ 30)", "long": false}, {"id": "a1", "label": "1. Thu thập: ứng dụng ghi gì?", "hint": "ghi lại dữ liệu nào"}, {"id": "a2", "label": "2. Phân tích: AI suy ra gì về Linh?", "hint": "Từ việc …, hệ thống đoán được Linh …"}, {"id": "a3", "label": "3. Sử dụng: ứng dụng làm gì với điều đó?", "hint": "việc hệ thống làm với điều đã suy ra"}, {"id": "a4", "label": "4. Tác động: Linh làm gì, nghĩ gì?", "hint": "thay đổi ở hành vi, suy nghĩ hoặc quyết định"}, {"id": "hd", "label": "Câu 3. Nếu là Linh, em chọn làm gì?", "opts": ["a) Dừng lại, chưa bấm ngay", "b) Hỏi cha mẹ, thầy cô", "c) Tự tìm thêm nội dung khác chiều, so sánh với điều ứng dụng gợi ý", "d) Xem lại ứng dụng đang được quyền gì, tắt quyền không cần (cách làm em sẽ học ở Bài 4)", "e) Báo thầy cô nếu thấy dữ liệu bị dùng sai"]}, {"id": "cn", "label": "Một câu em sẽ nói với bạn hoặc cha mẹ", "hint": "khớp với hiện tượng em đã nhận ra", "long": false}], "checks": ["Khá (câu 1, 8.A2.2): Cụm gạch chân cho thấy rõ việc AI làm; có dòng “Suy ra:” ở hiện tượng 1 hoặc 3 (ví dụ “ứng dụng đoán giờ Linh ở nhà từ vị trí”); phân biệt được chi tiết micro (số 5) với hiện tượng. Tốt: Đạt mức Khá và có ít nhất một trong hai ý: dòng “Suy ra:” tách phần của ứng dụng (ghi, gửi, nút bấm) với phần của AI (đoán, chọn); chỉ ra một chi tiết có hơn một hiện tượng (ghi hai số), kèm lí do.", "Khá (câu 2, 8.A2.1): Câu 2 không có chữ G; mỗi ô nối được với ô trước; ô Phân tích là điều suy ra cụ thể, ô Tác động nêu rõ thay đổi ở hành vi, suy nghĩ hoặc quyết định. Tốt: Nêu được điều hệ thống suy ra khi ghép hai loại dữ liệu; hoặc chỉ ra điều suy ra có thể sai mà vẫn được dùng để chọn nội dung.", "Khá (kiểm chứng và tư duy phản biện): Chỉ ra hồ sơ suy ra đúng ở đâu, sai ở đâu so với thẻ vai; nêu được vì sao tình huống E không phải hiện tượng kiểm soát. Tốt: Phản biện có căn cứ khi nhóm khác giơ số khác; chỉ ra chi tiết nào chỉ là giao diện, chi tiết nào cho thấy AI đang đoán, chọn.", "Khá (an toàn, đạo đức, trách nhiệm): Hành động và câu nói khớp đúng hiện tượng em đã nhận ra. Tốt: Giải thích được vì sao hành động đó giúp giữ quyền tự chủ hoặc bảo vệ cả dữ liệu của người khác (ví dụ các bạn trong danh bạ).", "Khá (hợp tác và trình bày): Góp ý, duyệt phần của bạn; trình bày rõ khi được gọi. Tốt: Dẫn nhóm đối chiếu hồ sơ với thẻ vai hoặc nêu lí do thuyết phục khi nhóm mình giơ số khác các nhóm còn lại."], "sample": "Chuỗi ví dụ (dữ liệu | thu thập | phân tích | sử dụng | tác động): Thói quen | Giờ Linh học (khoảng 21 giờ 30), chuỗi ngày học | Linh muốn giữ chuỗi, học vào cuối buổi tối | Gửi thông báo doạ mất chuỗi lúc 21 giờ 30 những tối Linh chưa học, kèm khoá trả phí | Linh mở ứng dụng vì sợ mất chuỗi dù đang bận; có khi đăng kí khoá trả phí vội ;; Sở thích | Hai khoá luyện thi Linh bấm xem | Linh đang lo thi, quan tâm luyện thi | Chỉ gợi ý khoá luyện thi trả phí, kèm “Chỉ còn 2 suất” | Linh chỉ còn thấy khoá trả phí, đăng kí vội ;; Vị trí | Vị trí điện thoại theo giờ | Linh ở nhà sau 21 giờ, giờ đó rảnh để học | Chọn giờ gửi thông báo, mục “Giờ học hợp với bạn” | Linh bị kéo vào ứng dụng đúng giờ ở nhà Câu 2 Phiếu học tập số 2. Ô Phân tích là điều AI của ứng dụng suy ra mà tình huống không viết sẵn, ví dụ Linh đang lo thi, quan tâm luyện thi (từ hai khoá đã bấm xem); Linh muốn giữ chuỗi ngày học nên dễ bị thông báo doạ mất chuỗi kéo lại. HS chép “Bạn thường ở nhà sau 21 giờ” thì cần nêu thêm điều đó được suy ra từ dữ liệu vị trí. Chuỗi ví dụ: Câu 3 Phiếu học tập số 2. Mọi lựa chọn a–e đều chấp nhận. Hành động và câu nói nên khớp với hiện tượng HS đã nhận ra, ví dụ thấy đề xuất một chiều thì “tự tìm nội dung khác chiều”; thấy AI tự chọn bạn để gửi tin thì “nhắn bạn bè đừng mở tin mời đó”, “không cho ứng dụng quyền đọc danh bạ”; thấy thông báo đúng giờ thì “dừng lại, chưa bấm ngay”. Câu nói mẫu: “Con muốn cùng bố mẹ xem lại ứng dụng này đang được quyền gì.”"}, {"type": "quiz", "tag": "HĐ4 • Vận dụng", "title": "Quay lại chị K", "nav": "Quay lại chị K", "icon": "🔁", "badge": "Giải thích được chuỗi", "intro": "Quay lại ý đoán ở HĐ 1: theo chuỗi thu thập, phân tích, sử dụng, tác động, em giải thích lại ý đoán về chị K thế nào? Bằng chứng nào khiến em tin? Khi gặp dấu hiệu thì dừng lại, tìm nội dung khác chiều, hỏi cha mẹ, thầy cô.", "qs": [{"q": "Theo chuỗi thu thập, phân tích, sử dụng, tác động, ý nào giải thích đúng về chị K?", "opts": ["Thu thập: lượt tìm đề thi, giờ mở ứng dụng, danh sách nhạc đã nghe, video xem hết. Phân tích: chị K lo thi và hay thức khuya. Sử dụng: đưa khoá luyện thi, video học xuyên đêm vào khoảng 23 giờ. Tác động: chị K thức khuya hơn, mua khoá vội", "Thu thập: không có gì. Phân tích: không suy ra gì. Sử dụng: không làm gì. Tác động: không có", "Ứng dụng nghe lén chị K qua micro nên biết chị K lo thi"], "a": 0, "why": "Câu hỏi (1) HĐ 4. Theo chuỗi thu thập, phân tích, sử dụng, tác động, em giải thích lại ý đoán về chị K thế nào? Bằng chứng nào khiến em tin? Thu thập: lượt tìm đề thi, giờ mở ứng dụng, danh sách nhạc đã nghe, video xem hết. Phân tích: chị K lo thi và hay thức khuya. Sử dụng: đưa khoá luyện thi, video học xuyên đêm vào khoảng 23 giờ. Tác động: chị K thức khuya hơn, mua khoá vội. Đây vẫn là suy đoán từ bốn dấu vết; hệ thống thật cũng chỉ đoán, có thể sai (ví dụ chị K thức khuya vì việc nhà). Chuyện “điện thoại nghe lén” (nếu HĐ 1 có): trò chơi cho thấy chỉ cần lượt dừng, giờ giấc là đã đoán trúng nhiều điều; thêm lượt tìm kiếm, vị trí, bạn bè thì quảng cáo “đúng thứ vừa nói” có thể xuất hiện mà không cần nghe. GV không khẳng định chuyện nghe lén khi chưa có bằng chứng."}, {"q": "Hệ thống thật đoán về chị K thì chắc chắn đúng?", "opts": ["Không: đây vẫn là suy đoán từ bốn dấu vết; hệ thống thật cũng chỉ đoán, có thể sai (ví dụ chị K thức khuya vì việc nhà)", "Có, vì AI không bao giờ sai", "Có, vì chị K đã đồng ý với mọi thứ"], "a": 0, "why": "Đây vẫn là suy đoán từ bốn dấu vết; hệ thống thật cũng chỉ đoán, có thể sai."}, {"q": "Chọn nhận xét đúng về mẫu câu nhận xét của thầy cô (ba ý: điều làm được, điều cần cải thiện, gợi ý tiếp theo).", "opts": ["“Em chọn nhắn bạn bè đừng mở tin mời, đúng với hiện tượng danh bạ. Em có thể nói thêm vì sao việc đó bảo vệ cả dữ liệu của bạn. Em thử nghĩ: các bạn trong danh bạ đã đồng ý cho ứng dụng dùng số của mình chưa?”", "Em chỉ cần chép lại dữ liệu trên thẻ là đủ ô Phân tích", "Em không cần nghĩ tới dữ liệu của bạn bè"], "a": 0, "why": "“Em đã gạch đúng cụm ‘AI đã chọn 5 bạn trong danh bạ’ và ghi số 4. Cụm ‘Chỉ còn 2 suất’ em ghi số 3 nhưng chưa cho thấy AI làm gì. Lần sau, em tìm chữ cho thấy ứng dụng đoán hay chọn điều gì.” “Chuỗi bốn ô của em nối được với nhau. Ô Phân tích còn chép lại ‘Linh học lúc 21 giờ 30’. Em thử viết theo mẫu: Từ việc Linh học lúc 21 giờ 30, hệ thống đoán được Linh …” “Em chọn nhắn bạn bè đừng mở tin mời, đúng với hiện tượng danh bạ. Em có thể nói thêm vì sao việc đó bảo vệ cả dữ liệu của bạn. Em thử nghĩ: các bạn trong danh bạ đã đồng ý cho ứng dụng dùng số của mình chưa?” Ghi nhận đóng góp cá nhân (ví dụ, tên giả định): Ghi nhận đóng góp cá nhân trong sản phẩm nhóm (ví dụ, tên giả định) ở nhóm 4: An giữ vai Hệ thống, viết hồ sơ suy ra và tự sửa chỗ đoán sai sau khi lật thẻ vai. Bình là quan sát viên, đếm số lần Dừng từng lượt và số thẻ lượt cuối thuộc chủ đề đã Dừng, đọc ở B3. Chi phụ trách tình huống C trên Phiếu học tập số 1, chỉ ra cụm “học giờ Tú hay mở máy” và nêu lí do khi nhóm giơ số khác. GV ghi các đóng góp này vào phiếu quan sát nhóm (PLC.7)."}]}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 8 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

 md.fields.forEach(f=>{cm.appendChild(E('label','f',esc(f.label)+(f.hint?` <small class="h">(${esc(f.hint)})</small>`:'')));let el;if(f.opts){el=E('select');el.innerHTML='<option value="">– Chọn –</option>'+f.opts.map(o=>`<option ${s.f[f.id]===o?'selected':''}>${esc(o)}</option>`).join('');el.onchange=()=>s.f[f.id]=el.value}else{el=E(f.long===false?'input':'textarea');if(f.long===false)el.type='text';el.value=s.f[f.id]||'';el.placeholder=f.ph||'';el.oninput=()=>s.f[f.id]=el.value}cm.appendChild(el)});c.appendChild(cm);
 if(md.checks){c.appendChild(E('h3',null,'Tự kiểm tra bằng bảng kiểm'));md.checks.forEach((t,k)=>{const d=E('label','chk',`<input type="checkbox" ${s.c[k]?'checked':''}> <span>${esc(t)}</span>`);d.querySelector('input').onchange=e=>s.c[k]=e.target.checked;c.appendChild(d)})}
 const b=E('button','btn','Hoàn thành & chấm tự đánh giá');b.onclick=()=>{const filled=md.fields.filter(f=>(s.f[f.id]||'').trim().length>=4).length,chk=Object.values(s.c).filter(Boolean).length;if(!s.rs){s.rs=1;award(i,Math.round(6*(filled/md.fields.length*.6+(md.checks?chk/md.checks.length:1)*.4)))}good();ST.done[i]=1;go(i)};c.appendChild(b);
 const dl=E('button','btn w','⬇ Lưu thành ảnh PNG');dl.onclick=()=>{const cv=document.createElement('canvas');cv.width=1000;cv.height=720;const x=cv.getContext('2d');x.fillStyle='#fffdf3';x.fillRect(0,0,1000,720);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--o');x.lineWidth=10;x.strokeRect(8,8,984,704);x.fillStyle='#1f2d3d';x.font='bold 30px Arial';x.fillText(md.title.slice(0,50),36,64);let y=110;const w=(t,y0,fs)=>{x.font=fs;const ws=String(t).split(' ');let l='';let yy=y0;for(const a of ws){if(x.measureText(l+a).width>920){x.fillText(l,36,yy);yy+=28;l=''}l+=a+' '}x.fillText(l,36,yy);return yy+34};md.fields.forEach(f=>{x.fillStyle='#d35400';y=w(f.label,y,'bold 20px Arial');x.fillStyle='#1f2d3d';y=w(s.f[f.id]||'……',y,'20px Arial')});const a=document.createElement('a');a.href=cv.toDataURL();a.download='san-pham-cua-em.png';a.click()};c.appendChild(dl);
 if(ST.done[i]){c.appendChild(E('div','fb ok','✅ Đã lưu bài làm. '+(md.sample?'<br><b>Gợi ý mẫu:</b> '+esc(md.sample):'')));finish(c,i)}m.appendChild(c)};
/* ---- result ---- */
function result(m){const c=E('div','card');const mx=maxPts()||1,pc=Math.min(100,Math.round(ST.pts/mx*100));
 c.innerHTML=`<h2>🏁 Kết quả của em</h2><p class="lead">Tổng điểm: <b>${ST.pts}</b> / ${mx} (${pc}%)</p><div class="bar" style="height:18px"><i style="width:${pc}%"></i></div><div style="text-align:center;margin:14px 0">`+MODS.map((x,k)=>`<span class="badge ${ST.done[k]?'on':''}">${x.icon||'⭐'}<small>${esc(x.badge||x.nav||x.title).slice(0,28)}</small></span>`).join('')+`</div>
 <table><tr><th>Hoạt động</th><th>Điểm</th></tr>`+MODS.map((x,k)=>`<tr><td>${esc(x.title)}</td><td>${ST.got[k]}/${mp(x)}</td></tr>`).join('')+`</table>
 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}
$('#ttl').textContent=SPEC.title;$('#sub').textContent=SPEC.sub||'';$('#ico').textContent=SPEC.icon||'🧭';
go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
</script></body></html>
