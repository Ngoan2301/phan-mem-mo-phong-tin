<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 7. Xác định vấn đề thực tế có thể giải quyết bằng AI – Lớp 8</title>
<style>
:root{--o:#e67e22;--od:#ac5e19;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🎯", "title": "Bài 7. Xác định vấn đề thực tế có thể giải quyết bằng AI – Lớp 8", "ainote": "Quyết định dùng AI hay không do con người đưa ra; AI chỉ hỗ trợ, con người kiểm chứng kết quả và chịu trách nhiệm cuối cùng. Chỉ thu thập dữ liệu thật sự cần, đã được phép dùng và đúng mục đích; dữ liệu khuôn mặt cần bảo vệ đặc biệt.", "takeaways": ["Vấn đề phù hợp với AI thường cần nhận diện mẫu hoặc dự đoán từ dữ liệu; việc chỉ cần công thức, cách làm cố định (tính ngày quá hạn, điểm trung bình, hẹn giờ) thì không cần AI.", "Một vấn đề thực tế có thể giải quyết bằng AI khi có đối tượng, nhu cầu rõ, dữ liệu phù hợp được phép dùng và AI làm tốt hơn cách đơn giản khác.", "Chỉ thu thập dữ liệu cần cho đúng mục đích đã nêu; không dùng dữ liệu cho mục đích khác khi chưa được đồng ý.", "AI chỉ là công cụ hỗ trợ: con người kiểm chứng kết quả, có giải pháp dự phòng và chịu trách nhiệm cuối cùng."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Khâu nào của thư viện nên dùng AI?", "nav": "Thư viện và AI", "icon": "📚", "badge": "Nhà tư vấn", "intro": "Tình huống (giả định): Trong buổi họp thư viện trường, ban quản lí đang cân nhắc việc sử dụng AI để cải thiện hoạt động. Thư viện có hai khâu chính: Khâu 1 là tính số ngày mượn sách quá hạn theo công thức cố định; Khâu 2 là gợi ý sách phù hợp với sở thích đọc của từng bạn. Các em hãy dự đoán khâu nào nên sử dụng AI và tại sao? Ba phương án: Phương án 1: Khâu 1 nên dùng AI vì cần tự động hoá tính toán; Phương án 2: Khâu 2 nên dùng AI vì cần phân tích sở thích cá nhân; Phương án 3: Cả hai khâu đều không cần AI.", "qs": [{"q": "Khâu nào nên cân nhắc dùng AI?", "opts": ["Khâu 1, vì cần tự động hoá tính toán", "Khâu 2, vì cần tìm mẫu trong sở thích đọc của từng bạn", "Cả hai khâu đều không cần AI"], "a": 1, "why": "Khâu 2 nên sử dụng AI vì cần phân tích sở thích cá nhân để gợi ý sách phù hợp, trong khi Khâu 1 chỉ cần công thức cố định (phương án 2). Phương án 1 nhầm việc máy tự động tính toán theo công thức với AI. Chương trình chỉ tính theo công thức cài sẵn thì không phải AI. Phương án 3 chấp nhận được khi HS nêu được cách đơn giản hơn cho Khâu 2, ví dụ thư viện nhỏ chỉ cần xếp sách theo thể loại hoặc để bạn đọc giới thiệu sách cho nhau. GV chưa chốt ở HĐ 1; câu trả lời trên được cả lớp chốt ở B4 HĐ 4."}, {"q": "Chương trình chỉ tính theo công thức cài sẵn có phải là AI không?", "opts": ["Có, vì nó là máy tính", "Không, vì chỉ làm theo cách cố định, không nhận diện mẫu hay dự đoán", "Có, nếu chạy trên điện thoại"], "a": 1, "why": "Việc tính theo công thức, kết quả đúng mỗi lần, không cần AI."}, {"q": "Việc quyết định khâu nào dùng AI thuộc về ai?", "opts": ["Do AI tự quyết định", "Do con người (ban quản lí thư viện)", "Do cửa hàng sách"], "a": 1, "why": "Con người quyết định dùng AI hay không, AI chỉ là công cụ hỗ trợ."}]}, {"type": "sort", "tag": "HĐ2 • Hình thành kiến thức", "title": "Phù hợp với AI hay không cần AI?", "nav": "Phân loại bài toán", "icon": "⚖️", "badge": "Nhà phân loại", "intro": "PHẦN A. HỒ SƠ BỐI CẢNH VÀ BỘ THẺ BÀI TOÁN. Câu chuyện bối cảnh (giả định): Minh là học sinh lớp 8, đang tham gia một dự án khoa học tại trường. Minh và nhóm của mình được giao nhiệm vụ tìm hiểu các vấn đề trong trường học có thể giải quyết bằng AI. Minh nghĩ đến việc sử dụng AI để quản lí thời gian học tập của học sinh, gợi ý sách trong thư viện và nhận diện khuôn mặt để mở khoá thiết bị. Mỗi ý tưởng đều có tiềm năng, nhưng Minh cần xác định rõ vấn đề nào thực sự cần AI và vấn đề nào có thể giải quyết bằng cách khác. Phần B. Phân loại năm thẻ bài toán (HĐ 2): với mỗi thẻ, đánh dấu loại bài toán (chỉ cần công thức, cách làm cố định hay cần nhận diện mẫu, dự đoán từ dữ liệu), phù hợp với AI hay không cần AI kèm lí do.", "cats": ["Phù hợp với AI", "Không cần AI"], "cards": [{"t": "Thẻ 1. Quản lí thời gian học tập: Dùng AI để nhắc nhở lịch học hằng ngày.", "g": [1], "why": "Cách làm cố định: nhắc theo giờ đã đặt. Không cần AI: báo thức, ứng dụng lịch, thời khoá biểu dán ở bàn học làm được; không cần nhận diện mẫu hay dự đoán. Thẻ thường còn tranh luận vì trên thẻ có chữ “Dùng AI”: hãy hỏi việc cần làm là gì, có cần nhận diện mẫu hay dự đoán không. Chữ “AI” trên thẻ chỉ là ý tưởng của Minh."}, {"t": "Thẻ 2. Gợi ý sách: AI phân tích sở thích đọc sách để gợi ý sách mới.", "g": [0], "why": "Nhận diện mẫu, dự đoán từ dữ liệu: tìm mẫu trong sở thích đọc của từng bạn. Phù hợp với AI: mỗi bạn đọc khác nhau, cần tìm mẫu từ sách đã mượn và đánh giá để gợi ý."}, {"t": "Thẻ 3. Nhận diện khuôn mặt: Dùng AI để mở khoá thiết bị cá nhân.", "g": [0], "why": "Nhận diện mẫu: nhận ra khuôn mặt của người dùng. Phù hợp với AI: cần nhận ra một khuôn mặt trong ảnh chụp ở nhiều góc, nhiều điều kiện ánh sáng. Thẻ 3 có thể bị xếp “không cần AI” vì đã có mật khẩu; chấp nhận nếu nhóm nêu được lí do, nhưng việc nhận ra khuôn mặt vẫn là bài toán nhận diện mẫu."}, {"t": "Thẻ 4. Tính điểm trung bình: Tính điểm trung bình môn của mỗi bạn từ các bài kiểm tra.", "g": [1], "why": "Công thức cố định. Không cần AI: đã có công thức, máy tính bỏ túi hoặc bảng tính làm được."}, {"t": "Thẻ 5. Dự đoán thời tiết: AI phân tích dữ liệu thời tiết để dự đoán mưa.", "g": [0], "why": "Dự đoán từ dữ liệu thời tiết. Phù hợp với AI: cần tìm mẫu trong nhiều dữ liệu thời tiết đã có để dự đoán mưa."}], "pass": 0.7}, {"type": "match", "tag": "HĐ2 • Hình thành kiến thức", "title": "Điều kiện dữ liệu an toàn của từng thẻ", "nav": "Điều kiện dữ liệu an toàn", "icon": "🔐", "badge": "Người giữ dữ liệu", "intro": "Cột (3) của Phiếu học tập số 1: điều kiện dữ liệu an toàn cần có. Ghép mỗi thẻ bài toán với điều kiện dữ liệu an toàn phù hợp. Hai câu hỏi gợi mở: “Tại sao một số bài toán không cần AI?” và “Điều gì khiến một bài toán trở nên phù hợp với AI?”", "pairs": [["Thẻ 1 (nhắc lịch học)", "Không cần thu thập thời gian biểu cá nhân; lịch do HS tự ghi, không chia sẻ cho người khác."], ["Thẻ 2 (gợi ý sách)", "Dữ liệu sách đã mượn, đánh giá được bạn đọc đồng ý cung cấp; chỉ dùng để gợi ý sách, không dùng cho mục đích khác."], ["Thẻ 3 (nhận diện khuôn mặt)", "Ảnh khuôn mặt là dữ liệu sinh trắc học, cần được bảo vệ đặc biệt; chỉ chủ thiết bị tự đăng kí, dữ liệu được bảo mật, chỉ dùng để mở khoá thiết bị đó."], ["Thẻ 4 (tính điểm trung bình)", "Không cần thu thập thêm dữ liệu; bảng điểm chỉ người có trách nhiệm được xem."], ["Thẻ 5 (dự đoán thời tiết)", "Dữ liệu thời tiết không phải dữ liệu cá nhân; cần nguồn dữ liệu đáng tin cậy; dự đoán có thể sai nên người dùng đối chiếu bản tin thời tiết chính thức."]], "why": "“Tại sao một số bài toán không cần AI?” Vì đã có công thức hoặc cách làm cố định cho ra đúng kết quả mỗi lần, như tính số ngày quá hạn, tính điểm trung bình, hẹn giờ nhắc lịch. Dùng cách đơn giản thì nhanh, rẻ và an toàn hơn. “Điều gì khiến một bài toán trở nên phù hợp với AI?” Bài toán thường cần nhận diện mẫu hoặc dự đoán từ dữ liệu, kết quả thay đổi theo từng người, từng tình huống. Bài toán đó có dữ liệu phù hợp và được phép sử dụng. Cách làm đơn giản thay thế: Thẻ 1 dùng báo thức, ứng dụng lịch hoặc thời khoá biểu dán ở bàn học. Thẻ 4 dùng công thức trên máy tính bỏ túi hoặc bảng tính."}, {"type": "flag", "tag": "HĐ3 • Luyện tập", "title": "Chẩn đoán phát biểu bài toán", "nav": "Chẩn đoán bài toán", "icon": "🩺", "badge": "Bác sĩ dữ liệu", "intro": "Phần C. Thử thách luyện tập nhóm (HĐ 3). Ca thực hành 1: Quản lí thời gian học tập. Minh và nhóm quyết định sử dụng AI để nhắc nhở lịch học hằng ngày cho học sinh. Ca thực hành 2: Gợi ý sách. Nhóm Minh muốn sử dụng AI để gợi ý sách mới dựa trên sở thích đọc sách của học sinh. Hãy gắn cờ các chi tiết cho thấy: mục tiêu quá rộng, thu thập dữ liệu nhiều hơn cần thiết xâm phạm quyền riêng tư, hoặc dùng dữ liệu sai mục đích đã nêu. Câu hỏi gợi mở: “Đầu vào là gì? Đầu ra là gì? Dữ liệu nào thật sự cần?”", "cols": ["Ca", "Phát biểu bài toán ban đầu (chi tiết)"], "flagWhat": "có vấn đề về dữ liệu", "rows": [{"c": ["Ca 1. Quản lí thời gian học tập", "Phát biểu bài toán ban đầu của nhóm: AI thu thập toàn bộ thời gian biểu trong ngày của từng học sinh, kể cả giờ ở nhà và nơi học thêm, để nhắc lịch học."], "bad": true, "why": "Chẩn đoán: thu thập dữ liệu nhiều hơn cần thiết, xâm phạm quyền riêng tư; có thể kèm mục tiêu quá rộng, chưa rõ đầu vào, đầu ra. Bằng chứng: “Toàn bộ thời gian biểu trong ngày”, “giờ ở nhà và nơi học thêm” vượt quá việc nhắc lịch học; nhắc lịch học chỉ cần giờ học đã đặt. Cách khắc phục: chỉ dùng giờ học, không thu thời gian biểu và nơi học thêm."}, {"c": ["Ca 1", "Chỉ dùng giờ học do học sinh tự nhập trên thiết bị của mình, trả lại lời nhắc đúng giờ"], "bad": false}, {"c": ["Ca 1", "“Toàn bộ thời gian biểu trong ngày”"], "bad": true, "why": "Vượt quá việc nhắc lịch học."}, {"c": ["Ca 1", "“kể cả giờ ở nhà và nơi học thêm”"], "bad": true, "why": "Xâm phạm quyền riêng tư: giờ ở nhà và nơi học thêm vượt quá mục đích nhắc lịch học."}, {"c": ["Ca 2. Gợi ý sách", "Nhóm Minh muốn sử dụng AI để gợi ý sách mới dựa trên sở thích đọc sách của học sinh: học sinh đồng ý cho thư viện dùng danh sách sách đã mượn để AI gợi ý sách"], "bad": false}, {"c": ["Ca 2", "Thư viện còn gửi danh sách này cho một cửa hàng sách để quảng cáo sách mới tới từng bạn"], "bad": true, "why": "Chẩn đoán: dùng dữ liệu sai mục đích đã nêu. Bằng chứng: học sinh đồng ý cho dùng danh sách sách đã mượn “để AI gợi ý sách”, nhưng thư viện còn gửi danh sách cho cửa hàng sách “để quảng cáo”. Cách khắc phục: bỏ việc gửi dữ liệu cho cửa hàng sách; dữ liệu chỉ dùng để gợi ý sách."}, {"c": ["Ca 2", "AI nhận danh sách sách một bạn đã mượn (bạn đồng ý cung cấp), trả lại ba đến năm cuốn sách gợi ý"], "bad": false}], "after": "Đánh dấu ca 1: Không cần AI, vì nhắc theo giờ cố định. Phát biểu lại mẫu: ứng dụng nhận giờ học do HS tự nhập trên thiết bị của mình, trả lại lời nhắc đúng giờ; việc này dùng báo thức, ứng dụng lịch là đủ. Đánh dấu ca 2: Cần AI, vì phải tìm mẫu trong sở thích đọc của từng bạn. Phát biểu lại mẫu: AI nhận danh sách sách một bạn đã mượn (bạn đồng ý cung cấp), trả lại ba đến năm cuốn sách gợi ý; dữ liệu chỉ dùng để gợi ý sách. Nếu không có AI, nhóm có thể làm gì? Ca 1: dùng báo thức, ứng dụng lịch, thời khoá biểu dán ở bàn học. Ca 2: tổ chức các buổi thảo luận sách để học sinh chia sẻ sở thích và gợi ý sách cho nhau (đây cũng là đáp án câu hỏi mở rộng trên phiếu). Thư viện cũng có thể lập góc giới thiệu sách theo thể loại. Mức mong đợi của phần C: mỗi ca có ít nhất một chẩn đoán đúng, bằng chứng lấy từ câu chữ của ca và cách khắc phục giải quyết đúng chẩn đoán đã chọn. Ô cần AI hay không cần AI khớp với ca (ca 1 không cần AI, ca 2 cần AI). Câu phát biểu lại nêu được hệ thống nhận gì, trả lại gì."}, {"type": "lab", "tag": "HĐ3 • Luyện tập", "title": "Chỉ dùng dữ liệu thật sự cần", "nav": "Phòng thử dữ liệu", "icon": "🎚️", "badge": "Người tiết kiệm dữ liệu", "intro": "Phát biểu lại bài toán: hệ thống nhận gì, trả lại gì, chỉ dùng dữ liệu thật sự cần. Kéo các thanh trượt (mô hình giả định) để xem rủi ro thay đổi ra sao khi thu thêm dữ liệu hoặc chia sẻ dữ liệu.", "sliders": [{"id": "extra", "n": "Dữ liệu thu thêm ngoài việc cần làm (giờ ở nhà, nơi học thêm…)", "min": 0, "max": 100, "val": 80, "unit": "%"}, {"id": "share", "n": "Mức chia sẻ dữ liệu cho bên khác (ví dụ cửa hàng sách để quảng cáo)", "min": 0, "max": 100, "val": 60, "unit": "%"}, {"id": "cons", "n": "Mức học sinh được hỏi và đồng ý đúng mục đích", "min": 0, "max": 100, "val": 30, "unit": "%"}], "outputs": [{"n": "Nguy cơ xâm phạm quyền riêng tư", "base": 50, "w": {"extra": 0.5, "share": 0.4, "cons": -0.3}, "c": 0}, {"n": "Mức dữ liệu dùng đúng mục đích đã nêu", "base": 50, "w": {"extra": -0.3, "share": -0.5, "cons": 0.4}, "c": 1}, {"n": "Mức đủ để nhắc lịch học / gợi ý sách", "base": 80, "w": {"extra": 0, "share": 0, "cons": 0}, "c": 2}], "insights": [{"id": "extra", "op": "<=", "val": 10, "txt": "Nhắc lịch học chỉ cần giờ học đã đặt: không thu thời gian biểu và nơi học thêm; mức đủ dùng không giảm."}, {"id": "share", "op": "<=", "val": 5, "txt": "Bỏ việc gửi dữ liệu cho cửa hàng sách; dữ liệu chỉ dùng để gợi ý sách, đúng điều học sinh đã đồng ý."}, {"id": "cons", "op": ">=", "val": 80, "txt": "Bạn đọc đồng ý cung cấp đúng mục đích thì dữ liệu mới được dùng; ca 2 cần AI nhưng chỉ với danh sách sách đã mượn mà học sinh đồng ý."}]}, {"type": "match", "tag": "HĐ3 • Luyện tập", "title": "Bảng thẻ: đầu vào, xử lí, đầu ra, điểm kiểm tra", "nav": "Bảng thẻ mô phỏng", "icon": "🗃️", "badge": "Người lập bảng", "intro": "Bảng thẻ mô phỏng đầu vào, xử lí, đầu ra (dùng khi nhóm lúng túng ở B2 HĐ 3). Ghép tình huống và dữ liệu hệ thống dùng với đầu ra và điểm cần con người kiểm tra.", "pairs": [["Nhắc nhở lịch học: giờ học HS tự nhập", "Thông báo nhắc nhở hằng ngày; kiểm tra: bảo đảm không xâm phạm quyền riêng tư"], ["Gợi ý sách: danh sách sách đã mượn (bạn đọc đồng ý cung cấp)", "Danh sách sách gợi ý; kiểm tra: bảo đảm không lạm dụng dữ liệu cho mục đích khác"], ["Mở khoá thiết bị: dữ liệu khuôn mặt người dùng", "Mở khoá khi nhận diện đúng; kiểm tra: bảo đảm dữ liệu khuôn mặt được bảo mật"]], "why": "Dòng “Nhắc nhở lịch học”: nếu chỉ nhắc theo giờ đã đặt sẵn thì hệ thống làm theo cách cố định, không cần AI (báo thức, ứng dụng lịch). Hai dòng còn lại cần nhận diện mẫu từ dữ liệu. Gợi ý điều chỉnh theo vùng miền: ở vùng nông thôn hoặc trường không có thư viện, có thể thay ví dụ gợi ý sách bằng việc dùng AI để gợi ý các hoạt động ngoại khoá phù hợp với sở thích của học sinh; cách phân tích bài toán và điều kiện dữ liệu giữ nguyên."}, {"type": "decide", "tag": "HĐ3 • Luyện tập", "title": "Máy quét: có nên dùng AI?", "nav": "Máy quét dùng AI", "icon": "🚦", "badge": "Người ra quyết định", "intro": "Trả lời ba câu hỏi để máy quét bật đèn tín hiệu, rồi thử với các tình huống bên dưới. Câu hỏi gợi mở: “Việc cần làm là gì, có cần nhận diện mẫu hay dự đoán không?”", "questions": ["Việc cần làm có cần nhận diện mẫu hoặc dự đoán từ dữ liệu (không chỉ công thức cố định)?", "Có dữ liệu phù hợp và được phép sử dụng (đúng mục đích, được đồng ý)?", "Lợi ích của AI có rõ hơn so với
