<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 6. AI nhận diện cảm xúc dựa trên những dấu hiệu nào – Lớp 8</title>
<style>
:root{--o:#16a085;--od:#107863;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>

<script>
const SPEC={"icon": "🎭", "title": "Bài 6. AI nhận diện cảm xúc dựa trên những dấu hiệu nào – Lớp 8", "ainote": "Nhãn cảm xúc của AI chỉ là suy đoán từ dấu hiệu bên ngoài, có thể sai; con người kiểm tra và quyết định. Khuôn mặt, giọng nói là dữ liệu cá nhân: không tự bật camera, micro cho ứng dụng lạ, muốn bật thì hỏi cha mẹ trước.", "takeaways": ["Bốn nhóm dấu hiệu AI có thể dựa vào: nét mặt (camera), từ khoá trong văn bản và lời nói (bàn phím, micro), ngữ điệu (micro), cử chỉ (camera).", "Hệ thống so sánh dấu hiệu với mẫu đã học từ các ví dụ được gắn nhãn, rồi đưa ra nhãn dự kiến kèm mức độ tự tin do hệ thống ước tính.", "Kết hợp nhiều nhóm dấu hiệu thường cho nhãn sát hơn, nhưng nhãn vẫn chỉ là suy đoán, không phải cảm xúc thật; mức độ tự tin cao vẫn có thể sai.", "Muốn biết bạn cảm thấy thế nào thì hỏi bạn. Khuôn mặt, giọng nói là dữ liệu cá nhân cần được bảo vệ.", "Mức Khá, Tốt (an toàn, đạo đức, trách nhiệm): Khá nêu được khuôn mặt, giọng nói là dữ liệu cá nhân và cách xử lí an toàn; Tốt đề xuất được việc con người cần làm sau khi có nhãn cảm xúc (hỏi lại, chuyển cho người phụ trách) và nêu vấn đề quyền riêng tư khi dùng camera nơi công cộng.", "Mức Khá, Tốt (hợp tác): trao đổi tích cực, lắng nghe và điều chỉnh khi có lí do hợp lí; dẫn dắt nhóm thảo luận các cách khó (C, D), trình bày thuyết phục, có dẫn chứng."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "“Ừ, được thôi.” vui hay buồn?", "nav": "“Ừ, được thôi.”", "icon": "💬", "badge": "Người đoán ý", "intro": "Tổ trực nhật nhắn: “Chủ nhật này tổ mình trực nhật sân trường nhé!”. Hùng (tên giả định) trả lời: “Ừ, được thôi.” GV chưa nêu đáp án ở hoạt động này; em thử đoán nhé. Câu hỏi (1). Hùng vui hay không hài lòng? Câu hỏi (2). Em cần thêm dấu hiệu gì để đoán chắc hơn? Câu hỏi (3). Máy chỉ “đọc” chữ thì có đoán tốt hơn em không?", "qs": [{"q": "Chỉ từ dòng chữ “Ừ, được thôi.”, em có thể chắc chắn Hùng vui hay không hài lòng không?", "opts": ["Chắc chắn là vui", "Chắc chắn là không hài lòng", "Chưa đủ dấu hiệu để chắc chắn"], "a": 2, "why": "Dự đoán của HS khác nhau (vui, bình thường, không hài lòng). Chính sự khác nhau này cho thấy chỉ một dòng chữ ngắn là chưa đủ dấu hiệu để đoán."}, {"q": "Em cần thêm dấu hiệu nào để đoán chắc hơn? (chọn nhiều đáp án)", "opts": ["Nét mặt của Hùng lúc nhắn", "Giọng nói nếu Hùng nói trực tiếp", "Hùng gật đầu hay lắc đầu", "Số điện thoại của Hùng"], "a": [0, 1, 2], "why": "Ví dụ: nét mặt của Hùng lúc nhắn; giọng nói nếu Hùng nói trực tiếp; Hùng có gật đầu hay lắc đầu; tin nhắn có biểu tượng cảm xúc kèm theo không. Số điện thoại không liên quan và là thông tin cá nhân không cần thiết."}, {"q": "Máy chỉ “đọc” chữ thì có đoán cảm xúc tốt hơn em không?", "opts": ["Có, vì máy tính rất giỏi", "Không chắc tốt hơn: máy chỉ đọc chữ cũng thiếu các dấu hiệu như em", "Máy luôn đoán đúng"], "a": 1, "why": "Không chắc tốt hơn: máy chỉ đọc chữ cũng thiếu các dấu hiệu như em. Câu trả lời được làm rõ ở HĐ 2.2 (chỉ đọc chữ thì cả bốn cách đều ra nhãn Trung tính)."}]}, {"type": "sort", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Những nhóm dấu hiệu nào?", "nav": "Nhóm dấu hiệu", "icon": "🗂️", "badge": "Nhà phân loại", "intro": "PHIẾU HỌC TẬP SỐ 1. DẤU HIỆU VÀ DỰ ĐOÁN. Phần A. Bảng phân loại dấu hiệu: em cùng nhóm ghi số thẻ và cảm xúc gợi ý vào cột phù hợp, rồi ghi thiết bị thu. Thẻ nào hệ thống không thu được thì ghi vào cột cuối. Kéo 13 thẻ dấu hiệu vào đúng nhóm. Thẻ 6 nên xếp vào nhóm nào? Vì sao? Thẻ 13 có phải dấu hiệu hệ thống thu được không? Nhóm xong sớm thêm cho mỗi cột một dấu hiệu mới: chấp nhận dấu hiệu đúng nhóm, có thiết bị thu phù hợp.", "cats": ["Hình ảnh (nét mặt)", "Văn bản, lời nói (từ khoá)", "Âm thanh (ngữ điệu)", "Cử chỉ", "Hệ thống không thu được"], "cards": [{"t": "Thẻ 1. Khoé miệng cong lên, mắt híp lại.", "g": [0], "why": "Thẻ 1 (vui); thẻ 2 (bực bội hoặc lo lắng); thẻ 3 (buồn). Thiết bị thu: Camera, ảnh."}, {"t": "Thẻ 2. Lông mày nhíu lại, trán nhăn.", "g": [0], "why": "Thẻ 1 (vui); thẻ 2 (bực bội hoặc lo lắng); thẻ 3 (buồn). Thiết bị thu: Camera, ảnh."}, {"t": "Thẻ 3. Mắt đỏ, rơm rớm nước mắt.", "g": [0], "why": "Thẻ 1 (vui); thẻ 2 (bực bội hoặc lo lắng); thẻ 3 (buồn). Thiết bị thu: Camera, ảnh."}, {"t": "Thẻ 4. Tin nhắn có từ “tuyệt quá”, “vui ghê”.", "g": [1], "why": "Thẻ 4 (vui); thẻ 5 (chán nản); thẻ 6 (buồn hoặc bực). Thiết bị thu: Bàn phím, tin nhắn; với lời nói cần micro rồi chuyển thành chữ."}, {"t": "Thẻ 5. Câu nói có từ “chán”, “mệt”, “thôi kệ”.", "g": [1], "why": "Thẻ 4 (vui); thẻ 5 (chán nản); thẻ 6 (buồn hoặc bực). Thiết bị thu: Bàn phím, tin nhắn; với lời nói cần micro rồi chuyển thành chữ."}, {"t": "Thẻ 6. Tin nhắn có biểu tượng mặt mếu và nhiều dấu chấm than.", "g": [1], "why": "Xếp vào nhóm văn bản, lời nói: biểu tượng mặt mếu và dấu chấm than nằm trong tin nhắn, hệ thống đọc được qua bàn phím. Chấp nhận cách xếp khác nếu có lí do, ví dụ nhóm nói rõ thẻ 6 là dấu hiệu trong văn bản dù không phải từ ngữ. Thẻ 4 (vui); thẻ 5 (chán nản); thẻ 6 (buồn hoặc bực). Thiết bị thu: Bàn phím, tin nhắn; với lời nói cần micro rồi chuyển thành chữ."}, {"t": "Thẻ 7. Giọng cao, nhanh.", "g": [2], "why": "Thẻ 7 (phấn khích); thẻ 8 (buồn, mệt); thẻ 9 (tức giận). Thiết bị thu: Micro, bản ghi âm."}, {"t": "Thẻ 8. Giọng nhỏ, nói chậm, thở dài.", "g": [2], "why": "Thẻ 7 (phấn khích); thẻ 8 (buồn, mệt); thẻ 9 (tức giận). Thiết bị thu: Micro, bản ghi âm."}, {"t": "Thẻ 9. Nói to, gằn từng tiếng.", "g": [2], "why": "Thẻ 7 (phấn khích); thẻ 8 (buồn, mệt); thẻ 9 (tức giận). Thiết bị thu: Micro, bản ghi âm."}, {"t": "Thẻ 10. Gật đầu liên tục.", "g": [3], "why": "Thẻ 10 (đồng ý, vui vẻ); thẻ 11 (không đồng ý); thẻ 12 (không hài lòng). Thiết bị thu: Camera quay video."}, {"t": "Thẻ 11. Lắc đầu.", "g": [3], "why": "Thẻ 10 (đồng ý, vui vẻ); thẻ 11 (không đồng ý); thẻ 12 (không hài lòng). Thiết bị thu: Camera quay video."}, {"t": "Thẻ 12. Khoanh tay, quay mặt đi chỗ khác.", "g": [3], "why": "Thẻ 10 (đồng ý, vui vẻ); thẻ 11 (không đồng ý); thẻ 12 (không hài lòng). Thiết bị thu: Camera quay video."}, {"t": "Thẻ 13. Điều bạn ấy thật sự nghĩ trong lòng.", "g": [4], "why": "Không. “Điều bạn ấy thật sự nghĩ trong lòng” không nhìn thấy, không nghe được, không đọc được; AI chỉ dựa vào dấu hiệu bên ngoài. Thiết bị thu: Không có."}], "pass": 0.7}, {"type": "lab", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Kết hợp dấu hiệu: máy đoán thế nào?", "nav": "Phòng thử kết hợp", "icon": "🎛️", "badge": "Kĩ sư nhãn", "intro": "Cách hệ thống đưa ra nhãn (mức đơn giản): xét từng nhóm dấu hiệu, so sánh với các mẫu đã học từ nhiều ví dụ được con người gắn nhãn, rồi gộp lại để chọn nhãn giống nhất và ước tính mức độ tự tin. Kéo các thanh trượt (mô hình giả định) để xem điều gì làm kết luận thay đổi. Mọi con số là giả định.", "sliders": [{"id": "grp", "n": "Số nhóm dấu hiệu được kết hợp (25% = chỉ đọc chữ, 100% = cả bốn nhóm)", "min": 25, "max": 100, "val": 25, "unit": "%"}, {"id": "con", "n": "Mức mâu thuẫn giữa các dấu hiệu (như cách C: nhếch mép, nhấn chữ “thôi”, khoanh tay)", "min": 0, "max": 100, "val": 0, "unit": "%"}, {"id": "mask", "n": "Mức người nói cố che giấu cảm xúc (như cách D)", "min": 0, "max": 100, "val": 0, "unit": "%"}], "outputs": [{"n": "Mức độ tự tin do hệ thống ước tính", "base": 64, "w": {"grp": 0.32, "con": -0.4, "mask": 0}, "c": 0}, {"n": "Mức nhãn khớp cảm xúc thật (giả định)", "base": 45, "w": {"grp": 0.55, "con": -0.35, "mask": -0.6}, "c": 1}], "insights": [{"id": "grp", "op": ">=", "val": 75, "txt": "Chỉ đọc chữ, cả bốn cách đều ra nhãn Trung tính (64%); kết hợp thêm nét mặt, ngữ điệu, cử chỉ thì nhãn đổi (cách A thành Vui, cách B thành Buồn)."}, {"id": "con", "op": ">=", "val": 60, "txt": "Dấu hiệu mâu thuẫn nhau như ở cách C làm mức độ tự tin giảm (còn 51%): dấu hiệu cùng hướng thì mức độ tự tin thường cao, mâu thuẫn thì thường thấp."}, {"id": "mask", "op": ">=", "val": 60, "txt": "Cách D: Mai cố che giấu nên mọi dấu hiệu bên ngoài đều không cho thấy buồn; mức độ tự tin cao (80%) vẫn có thể sai, thêm dấu hiệu bên ngoài cũng khó thấy cảm xúc bên trong."}]}, {"type": "flag", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Một câu nói, nhiều cách đoán", "nav": "Một câu, nhiều cách đoán", "icon": "🔍", "badge": "Thám tử cảm xúc", "intro": "Phần B. Dự đoán và đối chiếu. Bốn thẻ tình huống giả định (tên nhân vật là giả định; không có kết quả của sản phẩm có thật). Nhóm ghi dự đoán trước, không sửa lại. Khi chỉ đọc chữ (câu “Ừ, được thôi.”; riêng cách D có thêm câu “Không sao đâu!”), cả bốn cách đều cho nhãn Trung tính, mức độ tự tin do hệ thống ước tính 64%. Bảng là kết quả mô phỏng khi kết hợp bốn nhóm dấu hiệu. Hãy gắn cờ những dòng mà nhãn của máy KHÔNG đúng với cảm xúc thật.", "cols": ["Thẻ tình huống (giả định)", "Nét mặt; từ khoá; ngữ điệu; cử chỉ", "Nhãn kết hợp (mức độ tự tin)", "Cảm xúc thật"], "flagWhat": "bị máy đoán sai", "rows": [{"c": ["Cách A (Lan): được bạn rủ đi xem văn nghệ; cười tươi, giọng cao và nhanh, gật đầu liên tục", "Cười tươi: vui; “được”: đồng ý; Cao, nhanh: vui; Gật đầu: đồng ý", "Vui (88%)", "Vui"], "bad": false, "why": "Đúng; các nhóm dấu hiệu cùng chỉ về một hướng (thường thuận lợi, nhưng không bảo đảm luôn đúng)."}, {"c": ["Cách B (Hùng): phải trực nhật Chủ nhật thay vì đi đá bóng; nói nhỏ, chậm, kéo dài, thở dài, nhìn xuống, gật nhẹ", "Nhìn xuống: buồn; “được”: đồng ý; Nhỏ, chậm, thở dài: buồn; Gật nhẹ: đồng ý", "Buồn (72%)", "Thất vọng"], "bad": false, "why": "Gần đúng; ngữ điệu (nhỏ, chậm, thở dài) và nét mặt (nhìn xuống) giúp hệ thống phân biệt với cách A."}, {"c": ["Cách C (Quân): bị giao thêm phần việc của bạn khác; nhếch một bên mép, nhấn mạnh chữ “thôi”, đảo mắt, khoanh tay", "Nhếch mép: cười; “được thôi”: trung tính; Nhấn chữ “thôi”: không rõ; Đảo mắt, khoanh tay: không hài lòng", "Vui (51%)", "Không hài lòng, mỉa mai"], "bad": true, "why": "Sai; hệ thống xếp cái nhếch mép vào mẫu “cười”; các dấu hiệu mâu thuẫn nhau nên mức độ tự tin thấp. Dấu hiệu giúp bớt nhầm: ngữ điệu nhấn chữ “thôi”; phân biệt nhếch một bên mép với cười tươi."}, {"c": ["Cách D (Mai): không được chọn vào đội văn nghệ; cười, nói “Ừ, được thôi. Không sao đâu!” giọng bình thường, gật đầu; tối về khóc", "Cười: vui; “không sao đâu”: yên tâm; Bình thường: trung tính; Gật đầu: đồng ý", "Vui (80%)", "Buồn, cố che giấu"], "bad": true, "why": "Sai; dấu hiệu bên ngoài (cười, “không sao đâu”, gật đầu) khác cảm xúc bên trong. Mai cố che giấu nên các dấu hiệu bên ngoài (cười, “không sao đâu”, giọng bình thường, gật đầu) đều không cho thấy buồn; thêm dấu hiệu bên ngoài cũng khó thấy cảm xúc bên trong."}], "after": "Chỉ đọc chữ, cả bốn cách ra cùng nhãn Trung tính: từ khoá “được” chỉ gợi ý đồng ý; câu “Không sao đâu!” của cách D chỉ gợi ý yên tâm; cả hai đều không cho biết vui hay buồn. Mức độ tự tin do hệ thống ước tính là con số hệ thống tự ước tính cho nhãn nó chọn; con số cao không bảo đảm nhãn đó đúng với cảm xúc thật. Mọi con số trong bảng là giả định. Mức độ tự tin cao vẫn có thể sai (cách D). Cột dự đoán của nhóm không có đáp án; phần B đạt khi nhóm ghi dự đoán trước khi xem kết quả và nhận ra được cách bị đoán sai (thường là C, D)."}, {"type": "quiz", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Bằng chứng nào khiến em tin?", "nav": "Bằng chứng và kiểm chứng", "icon": "🧐", "badge": "Người kiểm chứng", "intro": "Sau khi xem bảng kết quả mô phỏng, hãy trả lời các câu hỏi ở mục b).", "qs": [{"q": "Khi chỉ đọc chữ (“Ừ, được thôi.”), hệ thống cho nhãn gì với bốn cách A, B, C, D?", "opts": ["Cả bốn cách đều Trung tính (64%)", "A là Vui, B là Buồn, C là Mỉa mai, D là Buồn", "Cả bốn cách đều Vui"], "a": 0, "why": "Chỉ đọc chữ, cả bốn cách ra cùng nhãn Trung tính: từ khoá “được” chỉ gợi ý đồng ý; câu “Không sao đâu!” của cách D chỉ gợi ý yên tâm; cả hai đều không cho biết vui hay buồn."}, {"q": "Bằng chứng nào khiến em tin nhãn của cách A và cách B là hợp lí?", "opts": ["Cách A có cười tươi, giọng cao và nhanh; cách B có nhìn xuống, thở dài", "Vì máy là AI nên luôn đúng", "Vì tên bạn nghe quen"], "a": 0, "why": "HS dẫn dấu hiệu cụ thể trong thẻ, ví dụ: cách A có cười tươi, giọng cao và nhanh nên nhãn Vui hợp lí; cách B có nhìn xuống, thở dài nên nhãn Buồn hợp lí."}, {"q": "Điều gì có thể làm kết luận thay đổi? (chọn nhiều đáp án)", "opts": ["Thêm nhóm dấu hiệu khác (nét mặt, ngữ điệu, cử chỉ)", "Dấu hiệu mâu thuẫn nhau làm mức độ tự tin giảm", "Biết thêm cảm xúc thật, chắc nhất là hỏi chính người đó", "Máy tự đổi ý vì mệt"], "a": [0, 1, 2], "why": "Thêm nhóm dấu hiệu khác: chỉ đọc chữ thì cả bốn cách là Trung tính, kết hợp thêm nét mặt, ngữ điệu, cử chỉ thì nhãn đổi (cách A thành Vui, cách B thành Buồn); dấu hiệu mâu thuẫn như ở cách C làm mức độ tự tin giảm còn 51%; biết thêm cảm xúc thật của người đó, mà cách chắc nhất là hỏi chính người đó."}, {"q": "Mức độ tự tin 80% của cách D (nhãn Vui) có nghĩa là nhãn đúng không?", "opts": ["Đúng, vì con số cao", "Không chắc: mức độ tự tin cao vẫn có thể sai", "Chỉ sai khi dưới 50%"], "a": 1, "why": "Dấu hiệu cùng hướng thì mức độ tự tin thường cao, mâu thuẫn thì thường thấp; mức độ tự tin cao vẫn có thể sai (cách D)."}]}, {"type": "story", "tag": "HĐ3 • Luyện tập", "title": "Hệ thống nhận diện và phản hồi của con người", "nav": "Phản hồi tôn trọng", "icon": "🛠️", "badge": "Người phụ trách", "intro": "PHIẾU HỌC TẬP SỐ 2. SƠ ĐỒ NHẬN DIỆN CHO TÌNH HUỐNG MỚI. Các tình huống dưới đây là giả định. Em là người phụ trách: chọn cách phản hồi cho từng tình huống rồi xem các thanh chỉ số.", "app": "🤖 Hệ thống nhận diện cảm xúc (mô phỏng)", "hello": "Xin chào, tôi chỉ đưa ra NHÃN DỰ KIẾN từ dấu hiệu bên ngoài. Quyết định cách phản hồi thuộc về người phụ trách.", "meters": [{"n": "Tôn trọng người được nhận diện", "b": 50, "c": 0}, {"n": "Nguy cơ hiểu sai cảm xúc", "b": 40, "c": 1}, {"n": "Bảo vệ dữ liệu cá nhân", "b": 50, "c": 2}], "chars": [{"n": "Tình huống 1: bạn Nga gõ vào trang luyện toán", "color": "#4aa3ff", "task": "Bạn Nga gõ vào trang luyện toán trực tuyến: “Bài này khó quá, chán thật!” kèm biểu tượng mặt mếu. Dấu hiệu đầu vào: văn bản, từ khoá “khó”, “chán”, biểu tượng mặt mếu, thu qua bàn phím; so với mẫu câu chán nản đã học; nhãn dự kiến: Chán nản, mức độ tự tin cao (giả định khoảng 80%). Trang nên làm gì?", "opts": [{"t": "Tự đổi bài và báo thầy cô rằng Nga chán học, không hỏi Nga", "chat": ["Bài này khó quá, chán thật! ☹️", "Nhãn dự kiến: Chán nản (80%). Đã đổi bài và báo thầy cô."], "ch": [-25, 30, -10], "v": "bad", "fb": "Có thể sai khi Nga nói đùa hoặc chỉ hơi mệt. Tự kết luận cảm xúc của Nga là thiếu tôn trọng."}, {"t": "Chỉ gợi ý bài dễ hơn, không hỏi, không tự kết luận", "chat": ["Bài này khó quá, chán thật! ☹️", "Gợi ý: thử bài dễ hơn."], "ch": [5, 5, 0], "v": "mid", "fb": "Trang chỉ gợi ý bài dễ hơn, không tự kết luận là hợp lí, nhưng nên hỏi lại Nga để Nga tự quyết định."}, {"t": "Hỏi lại: “Bài này có vẻ khó với em. Em muốn thử bài dễ hơn hay xem gợi ý?”", "chat": ["Bài này khó quá, chán thật! ☹️", "Bài này có vẻ khó với em. Em muốn thử bài dễ hơn hay xem gợi ý?"], "ch": [30, -25, 10], "v": "good", "fb": "Có thể sai khi Nga nói đùa hoặc chỉ hơi mệt; thầy cô hoặc người phụ trách trang xem lại, hỏi trực tiếp Nga trước khi đổi bài; trang chỉ gợi ý bài dễ hơn, không tự kết luận. Ô (4) thể hiện cách phản hồi tôn trọng người được nhận diện: hỏi lại người đó, chuyển cho người phụ trách, không tự kết luận cảm xúc của họ."}]}, {"n": "Tình huống 2: khách nói với tổng đài tự động", "color": "#ff9f43", "task": "Khách hàng nói với tổng đài tự động: “Tôi đã chờ ba ngày rồi!” bằng giọng to, nhanh, gằn từng tiếng. Dấu hiệu đầu vào: lời nói, từ khoá “chờ ba ngày”, ngữ điệu to, nhanh, gằn từng tiếng, thu qua micro; so với mẫu giọng tức giận đã học; nhãn dự kiến: Bực bội, mức độ tự tin cao (giả định khoảng 85%). Tổng đài nên làm gì?", "opts": [{"t": "Ghi vào hồ sơ “khách hàng khó tính” và tiếp tục kịch bản cũ", "chat": ["Tôi đã chờ ba ngày rồi!", "Nhãn: Bực bội (85%). Đã ghi hồ sơ: khách hàng khó tính."], "ch": [-30, 40, -5], "v": "bad", "fb": "Có thể sai khi người khách vốn nói to hoặc đang ở nơi ồn; gắn nhãn cho người khách khi chưa kiểm chứng là thiếu tôn trọng."}, {"t": "Tự động xin lỗi rồi kết thúc cuộc gọi", "chat": ["Tôi đã chờ ba ngày rồi!", "Xin lỗi quý khách. Cuộc gọi kết thúc."], "ch": [-15, 20, 0], "v": "bad", "fb": "Máy tự xử lí khi người khách chưa được giải quyết vấn đề; nên chuyển cho nhân viên."}, {"t": "Nói: “Xin lỗi quý khách vì đã phải chờ lâu. Tôi chuyển cuộc gọi tới nhân viên hỗ trợ ngay.”", "chat": ["Tôi đã chờ ba ngày rồi!", "Xin lỗi quý khách vì đã phải chờ lâu. Tôi chuyển cuộc gọi tới nhân viên hỗ trợ ngay."], "ch": [30, -25, 5], "v": "good", "fb": "Tổng đài nên chuyển cho nhân viên xử lí, vì có thể sai khi người khách vốn nói to hoặc đang ở nơi ồn."}]}, {"n": "Tình huống 3 (làm thêm): robot chào khách ở nhà sách", "color": "#9b59b6", "task": "Robot chào khách ở nhà sách dùng camera quan sát nét mặt và cử chỉ của khách. Dấu hiệu đầu vào: hình ảnh nét mặt và cử chỉ, thu qua camera; so với mẫu nét mặt, cử chỉ đã học; nhãn dự kiến tuỳ dấu hiệu của từng khách. Em cân nhắc điều gì?", "opts": [{"t": "Lưu hình ảnh mọi khách để phân tích cảm xúc, không cần báo", "chat": ["(camera quan sát khách)", "Đã lưu hình ảnh và nhãn cảm xúc của mọi khách."], "ch": [-30, 20, -40], "v": "bad", "fb": "Cần nêu vấn đề quyền riêng tư: khách có biết mình bị quay không, hình ảnh có được lưu không, dùng vào việc gì."}, {"t": "Dùng nhãn để tự quyết định khách có muốn mua sách hay không", "chat": ["(camera quan sát khách)", "Khách này có vẻ chán, không chào nữa."], "ch": [-15, 35, -10], "v": "bad", "fb": "Có thể sai vì mỗi người biểu lộ khác nhau."}, {"t": "Hỏi lại khi cần, báo cho khách biết có camera và nêu rõ ảnh có lưu không, dùng vào việc gì", "chat": ["(camera quan sát khách)", "Xin chào! Em cần giúp gì không ạ? (Khu vực có camera, hình ảnh không được lưu.)"], "ch": [25, -20, 35], "v": "good", "fb": "Có thể sai vì mỗi người biểu lộ khác nhau; cần nêu vấn đề quyền riêng tư: khách có biết mình bị quay không, hình ảnh có được lưu không, dùng vào việc gì."}]}]}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Điền sơ đồ bốn ô cho tình huống mới", "nav": "Sơ đồ bốn ô", "icon": "🧩", "badge": "Họa sĩ sơ đồ", "intro": "Nhóm em chọn: □ Tình huống 1 □ Tình huống 2 □ Tình huống 3 (làm thêm). Em cùng nhóm điền lần lượt bốn ô của sơ đồ, từ ô (1) đến ô (4). Làm thêm: câu trả lời phù hợp mà trang luyện toán hoặc tổng đài nên nói với người đó.", "fields": [{"id": "t", "label": "Nhóm em chọn", "opts": ["Tình huống 1 (Nga)", "Tình huống 2 (tổng đài)", "Tình huống 3 (làm thêm)"]}, {"id": "o1", "label": "(1) Dấu hiệu đầu vào: nhóm dấu hiệu nào? Thu bằng thiết bị gì?", "ph": "nhóm dấu hiệu và thiết bị thu"}, {"id": "o2", "label": "(2) So sánh với mẫu đã học: hệ thống so dấu hiệu với mẫu nào đã học?", "ph": "mẫu đã học"}, {"id": "o3", "label": "(3) Nhãn dự kiến: nhãn là gì? Mức độ tự tin do hệ thống ước tính cao hay thấp?", "ph": "nhãn và mức độ tự tin"}, {"id": "o4", "label": "(4) Có thể sai khi nào; con người cần làm gì?", "hint": "Nêu trường hợp sai và việc người phụ trách cần làm", "ph": "..."}, {"id": "o5", "label": "Làm thêm: câu trả lời phù hợp", "ph": "một câu phản hồi tôn trọng", "long": false}], "checks": ["Ô (1) ghi đúng nhóm dấu hiệu và thiết bị", "Ô (3) có nhãn dự kiến", "Ô (4) nêu được trường hợp có thể sai và việc con người cần làm; với tình huống 3 có nêu vấn đề quyền riêng tư", "Mức Khá: sơ đồ đủ bốn ô; mức Tốt: ô (4) gắn trường hợp có thể sai với chính dấu hiệu của tình huống, mô tả rõ cách hệ thống kết hợp các dấu hiệu kèm mức độ tự tin do hệ thống ước tính"], "sample": "Tình huống 1: (1) Văn bản: từ khoá “khó”, “chán”, biểu tượng mặt mếu; thu qua bàn phím. (2) So với mẫu câu chán nản đã học. (3) Chán nản, mức độ tự tin cao (giả định khoảng 80%). (4) Có thể sai khi Nga nói đùa hoặc chỉ hơi mệt; thầy cô hoặc người phụ trách trang xem lại, hỏi trực tiếp Nga trước khi đổi bài. Câu trả lời phù hợp: “Bài này có vẻ khó với em. Em muốn thử bài dễ hơn hay xem gợi ý?”. Tổng đài: “Xin lỗi quý khách vì đã phải chờ lâu. Tôi chuyển cuộc gọi tới nhân viên hỗ trợ ngay.”"}, {"type":
