<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 6.3. Dữ liệu cá nhân, quyền riêng tư và an toàn AI – Lớp 6</title>
<style>
:root{--o:#27ae60;--od:#1d8248;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🛡️", "title": "Bài 6.3. Dữ liệu cá nhân, quyền riêng tư và an toàn AI – Lớp 6", "ainote": "Không tải ảnh thật của HS lên công cụ nào; hai ứng dụng trong bài là giả định, không đăng nhập, không nhập dữ liệu thật. Quyết định cuối cùng thuộc về con người; ứng dụng cho phép tải lên không có nghĩa là được quyền dùng dữ liệu của người khác. Khi có sự cố, HS dừng lại và báo người lớn tin cậy.", "takeaways": ["Thông tin giúp nhận ra một người là dữ liệu cá nhân và là tài sản của chính người đó; chỉ người đó (HS lớp 6 cùng cha mẹ hoặc người giám hộ) quyết định việc chia sẻ. Ảnh chụp chung cần mọi người trong ảnh đồng ý.", "Quyền riêng tư là quyền giữ cho riêng mình thông tin, hình ảnh, đời sống riêng và tự quyết định ai được biết, được dùng vào việc gì; giúp mỗi người an toàn, giữ danh dự và được tự do.", "Đồng ý phải đúng người, đúng mục đích, đúng phạm vi; đồng ý cho một việc không phải là đồng ý cho mọi việc.", "Khi có nguy cơ: DỪNG, BÁO, GIỮ, CHẶN. Cần tư vấn gọi 111; nguy hiểm tức thời gọi 113 hoặc báo ngay người lớn ở gần.", "Trước khi nhập dữ liệu vào AI, hỏi: thu gì, để làm gì, lưu bao lâu và chia sẻ cho ai, tắt hay xoá được không, có hợp tuổi không."], "modules": [{"type": "flag", "tag": "HĐ1 • Mở đầu", "title": "Một bức ảnh kể được gì?", "intro": "Tình huống (giả định): Minh chụp ảnh nhóm bạn trước cổng trường và định tải ảnh lên một ứng dụng AI để biến thành ảnh hoạt hình. Trong ảnh nhìn rõ khuôn mặt các bạn, tên trường, phù hiệu lớp và biển số xe máy của một phụ huynh đang đứng gần đó. Quy ước thẻ: Xanh là tải ảnh lên được ngay; Vàng là chưa tải, cần hỏi ý kiến và kiểm tra thêm; Đỏ là không tải ảnh lên. Hãy điều tra bức ảnh, gắn cờ chi tiết có thể làm lộ thông tin về một người cụ thể. Mọi đáp án trong bài là đáp án tham khảo, chấp nhận phương án khác có lí do.", "nav": "Một bức ảnh kể gì", "icon": "🖼️", "badge": "Thám tử bức ảnh", "cols": ["Chi tiết trong ảnh (giả định)", "Có thể cho biết"], "flagWhat": "chi tiết có thể làm lộ dữ liệu cá nhân", "rows": [{"c": ["Khuôn mặt các bạn nhìn rõ", "Hình ảnh của từng bạn"], "bad": true, "why": "Khuôn mặt là dữ liệu cá nhân của từng bạn; mỗi bạn (cùng cha mẹ hoặc người giám hộ) có quyền quyết định, Minh không quyết định thay được."}, {"c": ["Tên trường trên cổng", "Các bạn học ở đâu"], "bad": true, "why": "Tên trường ghép với khuôn mặt cho biết các bạn học ở đâu."}, {"c": ["Phù hiệu lớp trên áo", "Các bạn học lớp nào"], "bad": true, "why": "Phù hiệu lớp giúp xác định nhóm bạn cụ thể."}, {"c": ["Biển số xe máy của một phụ huynh đứng gần", "Thông tin giúp tìm ra phụ huynh"], "bad": true, "why": "Biển số xe có thể giúp xác định một người; phụ huynh đó cũng có quyền quyết định."}, {"c": ["Giờ tan học, chỗ các bạn thường đứng chờ", "Thói quen, nơi các bạn thường có mặt"], "bad": true, "why": "Có thể suy ra từ bối cảnh ảnh: người lạ biết được lúc nào, ở đâu có thể gặp các bạn."}, {"c": ["Bầu trời nhiều mây phía sau", "Thời tiết hôm chụp"], "bad": false, "why": "Không giúp nhận ra một người cụ thể."}, {"c": ["Cây xanh bên đường", "Cảnh vật chung"], "bad": false, "why": "Không giúp nhận ra một người cụ thể."}, {"c": ["Nụ cười của cả nhóm", "Tâm trạng vui vẻ"], "bad": false, "why": "Nụ cười không nói được ai là ai; tuy vậy nó vẫn đi cùng khuôn mặt nên khi khuôn mặt hiện rõ thì ảnh vẫn cần xin phép."}], "after": "Câu hỏi (1). Minh có nên tải ảnh lên ứng dụng AI ngay không? Lựa chọn hợp lí là Vàng hoặc Đỏ: Minh chưa nên tải ảnh lên ngay. HS chọn Xanh là dấu hiệu cần xử lí ngộ nhận ở HĐ 2.1. Lí do: ảnh có khuôn mặt của nhiều bạn; tên trường và phù hiệu lớp cho biết các bạn học ở đâu, lớp nào; biển số xe có thể giúp xác định phụ huynh; chưa biết ứng dụng sẽ làm gì với bức ảnh. Câu hỏi (2). Minh có quyền quyết định thay các bạn không? Không. Ảnh có khuôn mặt của nhiều người nên mỗi bạn trong ảnh (cùng cha mẹ hoặc người giám hộ) và phụ huynh có biển số xe đều có quyền quyết định; người chụp không quyết định thay được. Câu hỏi gợi mở: “Ngoài khuôn mặt, bức ảnh còn cho biết điều gì?” Tên trường, lớp của các bạn; biển số xe giúp tìm ra phụ huynh; nơi các bạn hay đứng. “Bằng chứng nào trong ảnh khiến em tin như vậy?” HS chỉ vào chi tiết cụ thể: khuôn mặt, bảng tên trường, phù hiệu, biển số xe. “Điều gì có thể làm kết luận thay đổi?” Ví dụ: các bạn và phụ huynh đều đồng ý, đã biết ứng dụng làm gì với ảnh, ảnh đã che biển số xe và tên trường. Gợi ý cho em xong sớm: thông tin có thể suy ra từ bối cảnh ảnh, như giờ tan học, chỗ các bạn thường đứng chờ. Vấn đề học tập: trước khi đưa dữ liệu vào AI cần nhận diện dữ liệu, hỏi đúng người có quyền quyết định và kiểm tra công cụ."}, {"type": "sort", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Dữ liệu này thuộc nhóm nào?", "intro": "PHIẾU HỌC TẬP SỐ 1. DỮ LIỆU NÀY THUỘC NHÓM NÀO? Nhiệm vụ: Em cùng nhóm ghi số của mỗi thẻ vào một trong ba cột (lớp đông hoặc thiếu thời gian thì chỉ xếp tám thẻ 1, 2, 4, 7, 9, 10, 11, 12). Mỗi quyết định cần có căn cứ. Với thẻ còn phân vân, em ghi rõ điều kiện, bối cảnh làm thay đổi quyết định. Câu hỏi gợi ý: Dữ liệu này có giúp nhận ra một người cụ thể không? Khi ghép với dữ liệu khác thì sao? Đáp án: Dữ liệu cá nhân (thẻ 1, 2, 3, 5, 6, 11): gắn với một người cụ thể hoặc giúp nhận ra người đó. Không phải dữ liệu cá nhân (thẻ 7, 8, 12): không nói về một người cụ thể; thẻ 12 không có người, không kèm vị trí. Phụ thuộc bối cảnh (thẻ 4, 9, 10): riêng lẻ chưa chỉ ra ai, nhưng trở thành dữ liệu cá nhân khi gắn với một người hoặc ghép với dữ liệu khác. Điều gì có thể làm thẻ đổi cột? Biệt danh gắn với tài khoản của một bạn cụ thể; tên trường, lớp ghép với ảnh khuôn mặt; màu yêu thích ghi cạnh họ tên một bạn. Ví dụ cho nhóm xong sớm: biệt danh, màu áo đồng phục, tên câu lạc bộ riêng lẻ thì chưa chỉ ra ai, nhưng ghép lại có thể nhận ra một bạn trong trường. Kết luận của nhóm: Trước khi chia sẻ dữ liệu của một người, cần xin phép chính người đó (và cha mẹ hoặc người giám hộ nếu là trẻ em), nói rõ sẽ dùng để làm gì. Áp vào tình huống của Minh: ảnh chụp chung cần mọi người trong ảnh đồng ý.", "nav": "Dữ liệu thuộc nhóm nào", "icon": "🗂️", "badge": "Người phân loại", "cats": ["Dữ liệu cá nhân", "Không phải dữ liệu cá nhân", "Phụ thuộc bối cảnh"], "cards": [{"t": "Họ và tên của một học sinh", "g": [0], "why": "Gắn với một người cụ thể."}, {"t": "Ảnh chụp khuôn mặt một người", "g": [0], "why": "Giúp nhận ra người đó."}, {"t": "Đoạn ghi âm giọng nói của một người", "g": [0], "why": "Giọng nói giúp nhận ra một người."}, {"t": "Tên một trường học và một lớp học (không kèm tên học sinh)", "g": [2], "why": "Riêng lẻ chưa chỉ ra ai, nhưng ghép với ảnh khuôn mặt hoặc tên thì thành dữ liệu cá nhân."}, {"t": "Kết quả học tập của một học sinh", "g": [0], "why": "Thông tin học tập gắn với một người cụ thể."}, {"t": "Lịch sử tìm kiếm trên mạng của một người", "g": [0], "why": "Cho biết thói quen sử dụng mạng của một người."}, {"t": "Bản tin thời tiết của thành phố", "g": [1], "why": "Không nói về một người cụ thể."}, {"t": "Công thức làm bánh chưng", "g": [1], "why": "Thông tin chung, không gắn với ai."}, {"t": "Màu yêu thích", "g": [2], "why": "Riêng lẻ chưa chỉ ra ai; nhưng ghi cạnh họ tên một bạn thì thành dữ liệu cá nhân."}, {"t": "Biệt danh trong trò chơi", "g": [2], "why": "Nếu biệt danh gắn với tài khoản của một bạn cụ thể thì trở thành dữ liệu cá nhân."}, {"t": "Địa chỉ nhà của một người", "g": [0], "why": "Cho biết nơi ở của một người."}, {"t": "Ảnh một con mèo (không có người, không kèm thông tin vị trí)", "g": [1], "why": "Không có người, không kèm vị trí nên không nhận ra ai."}], "pass": 0.75}, {"type": "flag", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Thông tin đi kèm tệp ảnh", "intro": "Tư liệu chiếu (giả định): thông tin đi kèm tệp ảnh. Lưu ý: ảnh chỉ kèm vị trí khi điện thoại bật định vị lúc chụp. Em gắn cờ thông tin có thể cho người lạ biết nơi em ở hoặc nơi em thường đến.", "nav": "Thông tin đi kèm ảnh", "icon": "📍", "badge": "Người đọc dữ liệu ảnh", "cols": ["Mục", "Thông tin đi kèm tệp ảnh (giả định)"], "flagWhat": "thông tin đi "chars": [{"n": "Lan", "color": "#4aa3ff", "task": "thấy ảnh của mình bị ghép chữ trêu chọc trong nhóm chat lớp. Việc đầu tiên Lan nên làm là gì?", "opts": [{"t": "Tranh cãi công khai trong nhóm chat", "chat": ["Lan: Xoá ảnh đi, đừng đùa nữa!", "(Nhiều bạn chia sẻ thêm.)"], "ch": [-10, -20, 30], "v": "bad", "fb": "Tranh cãi công khai khiến sự việc lan rộng và dễ làm Lan bị tổn thương thêm."}, {"t": "Dừng lại, không bình luận, báo ngay một người lớn tin cậy (cha mẹ, GV chủ nhiệm)", "chat": null, "ch": [30, 25, -35], "v": "good", "fb": "Đúng: DỪNG rồi BÁO. Việc đầu tiên là dừng lại: không trả lời, không tranh cãi, không chia sẻ thêm; báo ngay cho một người lớn cụ thể (cha mẹ, GV chủ nhiệm, thầy cô). Cần tư vấn có thể gọi Tổng đài quốc gia bảo vệ trẻ em 111; nguy hiểm tức thời gọi 113."}, {"t": "Đăng ảnh xấu của bạn kia để trả đũa", "chat": null, "ch": [-20, -30, 40], "v": "bad", "fb": "Trả đũa làm mọi chuyện tệ hơn và vi phạm quyền riêng tư của người khác."}]}, {"n": "Cha mẹ và Lan", "color": "#ff9f43", "task": "đã biết chuyện. Cần làm gì với bằng chứng về sự việc?", "opts": [{"t": "Người lớn ghi lại đường dẫn, tên tài khoản, thời điểm; Lan không tự chụp lại hay chuyển tiếp", "chat": null, "ch": [25, 15, -20], "v": "good", "fb": "Đúng: GIỮ cùng người lớn. Người lớn ghi lại đường dẫn, tên tài khoản, thời điểm; HS không tự chụp lại, không chuyển tiếp. Việc chuyển tiếp nội dung gây hại làm nó lan rộng thêm."}, {"t": "Lan gửi ảnh trêu chọc cho bạn bè để hỏi ý kiến", "chat": null, "ch": [-20, -25, 35], "v": "bad", "fb": "Chuyển tiếp làm ảnh bị chia sẻ thêm, gây hại thêm cho Lan."}]}, {"n": "Nền tảng và ứng dụng", "color": "#2ecc71", "task": "cần xử lí ảnh đã bị đăng và ảnh gốc mà ứng dụng đã lưu. Lan và người lớn nên làm gì?", "opts": [{"t": "Chặn, báo cáo, yêu cầu gỡ; đề nghị ứng dụng xoá ảnh gốc, đổi cài đặt quyền riêng tư", "chat": null, "ch": [30, 20, -30], "v": "good", "fb": "Đúng: CHẶN. Lan chỉ đồng ý cho việc tạo ảnh đại diện; lưu ảnh gốc, vị trí và dùng để huấn luyện AI mà không nói rõ là vượt mục đích. Lan (cùng cha mẹ) có quyền đề nghị xoá."}, {"t": "Im lặng vì ảnh đã đăng công khai thì ai dùng cũng được", "chat": null, "ch": [-25, -20, 20], "v": "bad", "fb": "Đặt ảnh công khai không có nghĩa là đồng ý cho người khác dùng tuỳ ý. Đồng ý một việc không phải là đồng ý mọi việc."}]}]}, {"type": "quiz", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Quyền riêng tư và ứng phó ban đầu", "intro": "Năm câu hỏi của Phiếu học tập số 2 và Phiếu học tập số 3 (phiếu cuối giờ; em tự làm, không trao đổi với bạn). Bạn Hà muốn đăng lên mạng một ảnh chụp chung với hai bạn cùng lớp, trong ảnh thấy rõ bảng tên trường.", "nav": "Quyền riêng tư", "icon": "🔐", "badge": "Người giữ riêng tư", "qs": [{"q": "1. Những dữ liệu cá nhân nào xuất hiện trong chuỗi của Lan? Ai có quyền quyết định về chúng?", "opts": ["Ảnh chân dung, thông tin vị trí trong tệp ảnh, ảnh hoạt hình; Lan cùng cha mẹ hoặc người giám hộ quyết định", "Chỉ ảnh hoạt hình; ứng dụng quyết định", "Không có dữ liệu cá nhân vì ảnh đã được biến đổi"], "a": 0, "why": "Dữ liệu cá nhân gồm ảnh chân dung, thông tin vị trí trong tệp ảnh, ảnh hoạt hình (đã biến đổi nhưng vẫn nhận ra và gắn với Lan). Người có quyền quyết định là Lan cùng cha mẹ hoặc người giám hộ của Lan. Đồng ý cho một việc có phải là đồng ý cho mọi việc không? Không. Lan chỉ đồng ý cho ứng dụng dùng ảnh để tạo ảnh đại diện; mọi việc khác cần hỏi lại và Lan có quyền từ chối."}, {"q": "2. Lan đã đồng ý cho mục đích nào? Việc nào vượt quá mục đích đó?", "opts": ["Chỉ đồng ý tạo ảnh đại diện; vượt mục đích: lưu ảnh gốc và vị trí không nói rõ, dùng ảnh gốc huấn luyện thêm AI, bạn tải ảnh về trêu chọc", "Đồng ý cho mọi việc vì đã đặt ảnh công khai", "Việc nào cũng đúng mục đích"], "a": 0, "why": "Lan chỉ đồng ý cho việc tạo ảnh đại diện. Vượt mục đích: ứng dụng lưu ảnh gốc và vị trí mà không nói rõ; ứng dụng dùng ảnh gốc để huấn luyện thêm AI mà Lan không biết; bạn tải ảnh về để trêu chọc và chia sẻ lại. Đặt ảnh công khai không có nghĩa là đồng ý cho người khác dùng tuỳ ý. Nếu ứng dụng nói rõ và Lan (cùng cha mẹ hoặc người giám hộ) đồng ý lưu ảnh thì phần đó không còn vượt mục đích; phần ứng dụng không nói rõ vẫn vượt mục đích. Việc bạn tải ảnh về để trêu chọc vẫn là dùng sai mục đích vì Lan không đồng ý việc đó."}, {"q": "3. Lan (hoặc em) có thể gặp tác hại nào về an toàn, danh dự hoặc tự do? Nếu ảnh của em bị dùng sai mục đích, em có thể gặp hai tác hại nào?", "opts": ["An toàn: lộ nơi ở hoặc nơi thường đến, bị theo dõi, làm phiền; danh dự: bị chế giễu, xấu hổ; tự do: mất quyền tự quyết định hình ảnh", "Không có tác hại vì chỉ là ảnh hoạt hình", "Chỉ cảm thấy buồn, không gắn với việc dữ liệu bị dùng sai"], "a": 0, "why": "An toàn: lộ nơi ở hoặc nơi thường đến, có thể bị theo dõi, làm phiền. Danh dự: bị chế giễu, xấu hổ trước bạn bè. Tự do: mất quyền tự quyết định hình ảnh của mình được dùng thế nào, ngại tham gia hoạt động trên mạng. Ngoài ra Lan bị lo lắng, căng thẳng. Cần nêu được ít nhất hai tác hại, mỗi tác hại thuộc một trong ba mặt. Chưa thấy minh chứng nếu chỉ nêu cảm xúc chung (“buồn”) mà không gắn với việc dữ liệu bị dùng sai."}, {"q": "4. Nếu thấy ảnh của mình bị dùng để trêu chọc trong nhóm lớp, việc đầu tiên em làm là gì? Em sẽ báo cho ai? Đánh số các việc nên làm.", "opts": ["Dừng chia sẻ, không bình luận; báo người lớn tin cậy; cùng người lớn giữ thông tin; báo cáo, chặn hoặc yêu cầu gỡ. Gạch bỏ: tranh cãi công khai, đăng ảnh trả đũa", "Tranh cãi công khai trong nhóm rồi mới báo", "Đăng ảnh xấu của bạn kia để trả đũa"], "a": 0, "why": "(1) Dừng chia sẻ, không bình luận. (2) Báo người lớn tin cậy (cha mẹ, GV chủ nhiệm, thầy cô). (3) Cùng người lớn giữ thông tin về sự việc; người lớn ghi lại đường dẫn, tên tài khoản, thời điểm; HS không tự chụp lại, không chuyển tiếp. (4) Báo cáo, chặn hoặc yêu cầu gỡ trên nền tảng, đề nghị ứng dụng xoá ảnh gốc. Gạch bỏ: tranh cãi công khai; đăng ảnh trả đũa. Chưa thấy minh chứng nếu chỉ nêu việc cãi lại hay tự xử lí, không nêu được người cần báo."}, {"q": "5. Quyền riêng tư là gì? (Em viết một câu bằng lời của nhóm: “Quyền riêng tư là quyền được … và được tự quyết định …”)", "opts": ["Quyền của mỗi người được giữ cho riêng mình thông tin, hình ảnh, đời sống riêng và được tự quyết định ai được biết, được dùng chúng vào việc gì", "Quyền của người chụp ảnh được đăng mọi ảnh", "Quyền của ứng dụng được giữ dữ liệu của người dùng"], "a": 0, "why": "Quyền riêng tư là quyền của mỗi người được giữ cho riêng mình những thông tin, hình ảnh, đời sống riêng và được tự quyết định ai được biết, được dùng chúng vào việc gì. Chấp nhận cách diễn đạt của HS nếu có ý được biết, được kiểm soát, được quyết định. Quyền của em với dữ liệu của mình (mức lớp 6): em có quyền được biết dữ liệu nào của mình bị thu, để làm gì, lưu bao lâu. Em được đồng ý hoặc không đồng ý, được rút lại sự đồng ý và đề nghị xoá dữ liệu. Với HS lớp 6, cha mẹ hoặc người giám hộ cùng em thực hiện các quyền này."}, {"q": "6. Bạn Hà muốn đăng ảnh chụp chung với hai bạn, thấy rõ bảng tên trường. Trong ảnh có những dữ liệu cá nhân nào, của ai? Hà có được tự quyết định đăng không?", "opts": ["Khuôn mặt hai bạn và bảng tên trường; Hà không được tự quyết định, cần hỏi hai bạn (và cha mẹ hoặc người giám hộ)", "Chỉ khuôn mặt của Hà; Hà được tự đăng", "Không có dữ liệu cá nhân"], "a": 0, "why": "Dữ liệu cá nhân trong ảnh là khuôn mặt hai bạn (của hai bạn) và bảng tên trường (cho biết các bạn học ở đâu). Hà không được tự quyết định vì đó là dữ liệu của hai bạn; cần hỏi ý kiến hai bạn (và cha mẹ hoặc người giám hộ của các bạn) trước khi đăng. Mức Khá: nêu đủ dữ liệu cá nhân và người có quyền quyết định; nêu cụ thể việc dừng (không trả lời, không chia sẻ thêm) và người lớn cụ thể sẽ báo; nêu hai tác hại ở hai mặt khác nhau, gắn với ảnh bị dùng sai. Mức Tốt: lập luận chặt từ dữ liệu trong ảnh tới người có quyền quyết định, nêu việc Hà cần làm trước khi đăng; diễn đạt quyền riêng tư bằng lời của mình, có ví dụ gắn với tình huống giả định (như ảnh của Lan, của Hà); nêu thêm việc không làm (không trả đũa, không chuyển tiếp nội dung); mỗi tác hại gắn với một việc dữ liệu bị dùng sai cụ thể. Bảng kiểm: không quy lỗi cho Lan; không đề xuất phát tán thêm hình ảnh; giải thích quyền riêng tư có ý được biết, kiểm soát, quyết định."}]}, {"type": "decide", "tag": "HĐ3 • Luyện tập", "title": "Kiểm tra ứng dụng AI trước khi dùng", "intro": "PHIẾU HỌC TẬP SỐ 4. KIỂM TRA ỨNG DỤNG AI TRƯỚC KHI DÙNG. Thẻ ứng dụng (giả định). Trợ lí học tập Mây (nhóm số lẻ): Ứng dụng đề nghị nhập họ tên, ngày sinh, trường, lớp, ảnh chân dung và giọng nói để AI của ứng dụng gợi ý bài luyện tập “cá nhân hoá việc học”. Ứng dụng cho biết dữ liệu “có thể được dùng để cải thiện dịch vụ” nhưng không nêu rõ lưu bao lâu, chia sẻ cho ai và cách xoá. Từ điển ảnh Sao (nhóm số chẵn): Chụp ảnh đồ vật để AI nhận diện và cho biết từ tiếng Anh tương ứng. Chỉ cần biệt danh, không yêu cầu ảnh chân dung hay giọng nói. Ảnh được xoá ngay sau khi nhận diện; lịch sử tra từ lưu 30 ngày rồi tự xoá, không chia sẻ cho bên khác; có nút tắt lưu lịch sử. Dành cho người dùng từ 10 tuổi, cần cha mẹ hoặc người giám hộ xác nhận khi cài đặt. Hai ứng dụng là giả định (em không đăng nhập, không nhập dữ liệu thật). Em gạch chân điều thẻ đã nói rõ, khoanh tròn câu nói còn mập mờ (ví dụ “cải thiện dịch vụ”); điều thẻ không nói thì ghi “còn thiếu”. Trả lời các câu hỏi kiểm tra để xem đèn Xanh, Vàng hay Đỏ.", "nav": "Kiểm tra ứng dụng AI", "icon": "🚦", "badge": "Người kiểm tra ứng dụng", "questions": ["Ứng dụng xin nhiều dữ liệu hơn mức cần thiết cho mục đích của nó (ví dụ ảnh chân dung, giọng nói, vị trí luôn cho phép)?", "Thẻ ứng dụng nói còn mập mờ hoặc thiếu (mục đích chung chung, không nói lưu bao lâu, chia sẻ cho ai)?", "Người dùng có thể từ chối, tắt hoặc xoá dữ liệu dễ dàng?"], "verdicts": ["Xanh: dùng được nếu làm đúng điều kiện", "Vàng: hỏi người lớn, bớt dữ liệu, kiểm tra thêm", "Đỏ: không dùng"], "rules": [{"when": [1, 1, 0], "v": 2}, {"when": [1, null, 0], "v": 2}, {"when": [0, 0, 1], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "Trợ lí học tập Mây: đề nghị nhập họ tên, ngày sinh, trường, lớp, ảnh chân dung và giọng nói để AI gợi ý bài luyện tập “cá nhân hoá việc học”; dữ liệu “có thể được dùng để cải thiện dịch vụ” nhưng không nêu rõ lưu bao lâu, chia sẻ cho ai và cách xoá.", "v": [1, 2], "why": "Nhận xét mong đợi: Vàng hoặc Đỏ, không chấp nhận Xanh. Ứng dụng yêu cầu nhiều dữ liệu vượt nhu cầu học tập (ảnh chân dung, giọng nói, ngày sinh). Ứng dụng chưa nói rõ thời gian lưu, bên được chia sẻ, cách xoá, độ tuổi sử dụng. Cụm từ “cải thiện dịch vụ” chưa rõ, có thể gồm cả việc dùng dữ liệu để huấn luyện AI. Nhóm chọn Vàng phải nêu điều kiện: chưa nhập dữ liệu cho tới khi làm rõ các điểm còn thiếu, có cha mẹ hoặc người giám hộ đồng ý, chỉ cung cấp dữ liệu tối thiểu. Lợi ích có tương xứng không? Gợi ý bài luyện tập không cần ảnh chân dung, giọng nói, ngày sinh, nên dữ liệu phải đưa vượt quá lợi ích. Gợi ý cho nhóm xong sớm (dùng “Mây” với ít dữ liệu hơn): chỉ nhập biệt danh, không bật ảnh chân dung, giọng nói; chưa dùng cho tới khi ứng dụng nói rõ thời gian lưu, cách xoá và có cha mẹ hoặc người giám hộ đồng ý."}, {"t": "Từ điển ảnh Sao: chụp ảnh đồ vật để AI nhận diện và cho biết từ tiếng Anh; chỉ cần biệt danh, không yêu cầu ảnh chân dung hay giọng nói; ảnh được xoá ngay sau khi nhận diện; lịch sử tra từ lưu 30 ngày rồi tự xoá, không chia sẻ cho bên khác; có nút tắt lưu lịch sử; dành cho người dùng từ 10 tuổi, cần cha mẹ hoặc người giám hộ xác nhận.", "v": 0, "why": "Nhận xét mong đợi: Xanh. Ứng dụng chỉ thu dữ liệu tối thiểu, nêu rõ thời gian lưu, không chia sẻ, cho phép tắt lưu lịch sử, có điều kiện độ tuổi và bước cha mẹ hoặc người giám hộ xác nhận. Điều kiện dùng: HS làm đúng các bước đó và không chụp khuôn mặt người khác. Chấp nhận Vàng nếu nhóm chỉ ra được một điểm còn thiếu cụ thể, ví dụ chưa rõ cách xoá lịch sử trước 30 ngày. Lợi ích tương xứng: tra từ bằng ảnh đồ vật chỉ cần biệt danh và ảnh được xoá ngay. Thẻ không nhắc tới một loại dữ liệu thì có phải ứng dụng không thu loại dữ liệu đó không? Không. Điều thẻ không nói là điều còn thiếu thông tin, cần hỏi thêm hoặc chọn Vàng."}, {"t": "Bản đồ Đường Xanh (thẻ in sẵn, giả định): ứng dụng dùng AI gợi ý đường đi nhanh nhất; xin quyền truy cập vị trí “luôn cho phép”, kể cả khi không mở ứng dụng, nhưng người dùng có thể chọn “chỉ khi đang dùng”; lưu lịch sử di chuyển và có mục xoá lịch sử; không nêu độ tuổi sử dụng.", "v": 1, "why": "Nhận xét mong đợi là Vàng. Điều kiện: chọn quyền vị trí “chỉ khi đang dùng”; định kì xoá lịch sử di chuyển; cha mẹ hoặc người chăm sóc cùng quyết định vì ứng dụng không nêu độ tuổi sử dụng. GV nhận xét theo căn cứ HS ghi, không theo màu quyết định."}, {"t": "Một chatbot làm quen trong trò chơi trực tuyến hỏi tên trường, địa chỉ nhà và xin ảnh của em.", "v": 2, "why": "Đỏ: không cung cấp; Dừng, Báo người lớn, Chặn. Những thông tin này không cần cho trò chơi."}]}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Phiếu kiểm tra và tự đánh giá ứng dụng", "intro": "Ứng dụng nhóm kiểm tra: Trợ lí học tập Mây (nhóm số lẻ) hoặc Từ điển ảnh Sao (nhóm số chẵn). Mỗi bạn góp ít nhất một câu hỏi hoặc một ý và ghi tên ở cột “Người viết”. Bộ năm câu hỏi: (1) Ứng dụng thu thập những dữ liệu nào, xin những quyền gì (camera, micro, vị trí, danh bạ)? Có dữ liệu hay quyền nào không cần cho tính năng chính không? (2) Dữ liệu được dùng để làm gì? Giải thích có rõ, dễ hiểu không? (3) Dữ liệu được lưu bao lâu và có chia sẻ cho ai khác không? (4) Em có thể từ chối, tắt tính năng hoặc xoá dữ liệu không? (5) Ứng dụng dành cho lứa tuổi nào? Có cần cha mẹ hoặc người giám hộ đồng ý không? Sau đó mỗi em tự làm Phiếu học tập số 5 (phiếu tự đánh giá), không trao đổi với bạn.", "nav": "Phiếu kiểm tra ứng dụng", "icon": "📋", "badge": "Người kiểm tra", "fields": [{"id": "app", "label": "Ứng dụng nhóm kiểm tra", "opts": ["Trợ lí học tập Mây (nhóm số lẻ)", "Từ điển ảnh Sao (nhóm số chẵn)"]}, {"id": "q", "label": "Câu hỏi của nhóm theo năm nhóm: dữ liệu được thu thập, quyền ứng dụng xin; mục đích và sự cần thiết; lưu trữ và chia sẻ; quyền kiểm soát của người dùng (từ chối, tắt, xoá); phù hợp lứa tuổi và sự đồng ý của cha mẹ hoặc người giám hộ", "hint": "mỗi nhóm một câu, ghi tên người viết", "ph": "1. Ứng dụng thu những dữ liệu nào, xin quyền gì? (An) 4. Em có thể từ chối, tắt hoặc xoá dữ liệu không? (Bình)"}, {"id": "info", "label": "Thông tin đã có hoặc còn thiếu", "hint": "gạch chân điều đã rõ; điều không nói thì ghi “còn thiếu: …”", "ph": "Còn thiếu: lưu bao lâu, chia sẻ cho ai, cách xoá."}, {"id": "benefit", "label": "Lợi ích nhóm nhận được khi dùng ứng dụng. Lợi ích đó có tương xứng với dữ liệu phải cung cấp không? Vì sao?", "hint": "nêu căn cứ từ thẻ", "ph": "Gợi ý bài luyện tập; nhưng không cần ảnh chân dung..."}, {"id": "dec", "label": "Quyết định của nhóm", "opts": ["Xanh: thẻ nói rõ các điều cần biết; dùng được nếu làm đúng điều kiện ứng dụng nêu", "Vàng: còn thiếu thông tin quan trọng hoặc phải bớt dữ liệu; hỏi người lớn trong gia đình, thầy cô trước khi quyết định", "Đỏ: không dùng"]}, {"id": "why", "label": "Nhóm em chọn … vì …; điều kiện cần bổ sung; ứng dụng của nhóm khác ứng dụng còn lại ở điểm", "hint": "dẫn một thông tin trên thẻ", "ph": "Vàng vì thẻ không nêu rõ lưu bao lâu..."}, {"id": "fb", "label": "Sau khi nghe các nhóm khác phản hồi", "opts": ["Giữ nguyên", "Thay đổi, vì …"]}, {"id": "self", "label": "Nhóm tự đánh giá (theo mô tả mức GV đọc)", "opts": ["Đạt", "Khá", "Tốt"]}, {"id": "p5", "label": "Phiếu 5: Em viết hai câu hỏi sẽ hỏi trước khi dùng một ứng dụng AI; nêu một điểm khác nhau về dữ liệu giữa “Mây” và “Sao”", "hint": "một câu về dữ liệu thu thập, một câu về quyền tắt, xoá", "ph": "1. ... 2. ... Điểm khác: “Sao” chỉ cần biệt danh, “Mây” đòi ảnh chân dung và giọng nói."}], "checks": ["Điều em tự kiểm: Em chỉ ra được dữ liệu cá nhân và người có quyền quyết định việc chia sẻ. (Đã làm được / Cần luyện thêm)", "Em nêu được cách ứng phó khi có nguy cơ mất an toàn dữ liệu cá nhân; em đặt được câu hỏi để kiểm tra một ứng dụng AI trước khi dùng.", "Mức đạt của Phiếu 4: có ít nhất hai câu hỏi phù hợp, gồm câu về dữ liệu được thu thập và câu về quyền kiểm soát; câu trả lời lấy từ thẻ ứng dụng và quyết định có căn cứ; nêu được trên phiếu một điểm khác với ứng dụng còn lại. Mức đạt của Phiếu 5: hai câu hỏi phù hợp; dòng quyết định dẫn được ít nhất một thông tin trên thẻ ứng dụng (ví dụ “Mây” Vàng hoặc Đỏ vì không nêu lưu bao lâu; “Sao” Xanh vì ảnh được xoá ngay sau khi nhận diện); nêu được một điểm khác giữa “Mây” và “Sao”. Chưa thấy minh chứng: câu hỏi chung chung (“Ứng dụng có tốt không?”), quyết định không dẫn thông tin nào trên thẻ ứng dụng.", "Mức Khá: mỗi dòng trong năm nhóm có câu hỏi riêng, rõ, áp đúng vào thẻ ứng dụng của nhóm; ít nhất một câu hỏi nhắm đúng điều thẻ còn thiếu (“Mây”: lưu bao lâu, chia sẻ cho ai, cách xoá; “Sao”: cách xoá lịch sử trước 30 ngày); phân biệt được thông tin đã rõ và còn thiếu; chỉ ra dữ liệu vượt nhu cầu, giải thích được vì sao cần xin phép, cần cha mẹ hoặc người giám hộ đồng ý. Mức Tốt: đạt mức Khá, ưu tiên đúng vấn đề; có thêm câu hỏi về cách xử lí sự cố hoặc phương án ít dữ liệu hơn; nêu giới hạn của thông tin (thẻ là lời ứng dụng tự giới thiệu nên chưa chắc đủ); giữ hoặc điều chỉnh quyết định sau phản biện có căn cứ; đề xuất cách dùng an toàn hơn (dữ liệu tối thiểu, tắt tính năng); giải thích vì sao một ứng dụng an toàn, phù hợp hơn với HS lớp 6.", "Ghi nhận đóng góp cá nhân qua cột “Người viết”: mỗi HS góp ít nhất một câu hỏi hoặc một ý; HS chưa viết được câu hỏi vẫn được ghi nhận khi tìm đúng thông tin trên thẻ ứng dụng hoặc phản biện. Hợp tác và trình bày: Đạt - hoàn thành phần việc theo vai trò; Khá - phối hợp, phản hồi theo mẫu câu; Tốt - tiếp thu phản biện, trình bày thuyết phục, nêu rõ thông tin nào khiến nhóm giữ hoặc thay đổi quyết định."], "sample": "Ví dụ nhóm 3. An viết câu 1 và câu 4. Bình chưa viết câu hỏi nhưng tìm ra trên thẻ ứng dụng chỗ “không nêu rõ lưu bao lâu”. Chi hỏi lại nhóm “cải thiện dịch vụ là làm gì?” khiến nhóm đổi từ Xanh sang Vàng. Nếu “Mây” chỉ cần biệt danh, nói rõ lưu 30 ngày rồi tự xoá, không chia sẻ cho bên khác, có nút xoá, nêu độ tuổi sử dụng và cần cha mẹ hoặc người giám hộ xác nhận thì nhóm đã chọn Đỏ có thể chuyển sang Vàng, nhóm đã chọn Vàng có thể cân nhắc Xanh. Mẫu câu nhận xét: “Hai câu hỏi của em đúng trọng tâm dữ liệu và quyền xoá. Điểm khác giữa ‘Mây’ và ‘Sao’ em nêu còn chung. Em đọc lại hai thẻ và chỉ ra một dữ liệu ‘Mây’ đòi mà ‘Sao’ không cần.”"}, {"type": "order", "tag": "HĐ4 • Vận dụng (1)", "title": "Quy tắc ứng phó bốn bước", "intro": "PHIẾU HỌC TẬP SỐ 6. QUY TẮC ỨNG PHÓ BỐN BƯỚC. Khi có nguy cơ mất an toàn dữ liệu cá nhân, em làm theo thứ tự nào? Sắp xếp bốn bước DỪNG, BÁO, GIỮ (cùng người lớn), CHẶN (dùng chức năng bảo vệ).", "nav": "Dừng - Báo - Giữ - Chặn", "icon": "🛑", "badge": "Người ứng phó", "items": ["DỪNG: dừng nhập, chia sẻ, bình luận hoặc tương tác có nguy cơ; không trả đũa. Câu nói mẫu: “Mình sẽ không chia sẻ thêm.”", "BÁO: em sẽ tìm ai (ghi rõ vai, không ghi tên riêng); đầu mối của nhà trường; cần tư vấn, hỗ trợ: Tổng đài quốc gia bảo vệ trẻ em 111 (miễn phí, 24 giờ trong ngày, 7 ngày trong tuần); nguy hiểm tức thời: gọi 113", "GIỮ (cùng người lớn): người lớn ghi lại đường dẫn, tên tài khoản, thời điểm; em không tự chụp lại, không chuyển tiếp nội dung gây hại. Cùng người lớn trả lời: Dữ liệu gì bị yêu cầu hoặc bị lộ? Ai bị ảnh hưởng? Nguy cơ nào có thể xảy ra?", "CHẶN (dùng chức năng bảo vệ): chặn, báo cáo, yêu cầu gỡ hoặc xoá, đổi cài đặt quyền riêng tư"], "why": "Khi nào phải đổi thứ tự các bước? Khi có nguy hiểm tức thời (có người lạ hẹn gặp, có nguy cơ bị xâm hại ngay), em gọi 113 hoặc báo ngay người lớn ở gần trước, các bước khác làm sau. Gợi ý: gọi 111 khi cần tư vấn, hỗ trợ (bị bắt nạt, bị đe doạ trên mạng, lo lắng không biết làm gì); gọi 113 khi có nguy hiểm tức thời. Bằng chứng nào cho thấy một bạn lớp 6 làm theo được áp phích? Áp phích dùng động từ hành động, ghi rõ vai người hoặc kênh hỗ trợ cụ thể; ít chữ, đọc một lần là làm theo được."}, {"type": "build", "tag": "HĐ4 • Vận dụng (2)", "title": "Áp phích Dừng, Báo, Giữ, Chặn", "intro": "Em cùng nhóm khoanh một tình huống (giả định) để làm ví dụ cho áp phích. Áp phích cần đúng, dễ làm theo với một bạn lớp 6 và không đổ lỗi cho người gặp sự cố; có thể viết chữ hoặc vẽ sơ đồ. Có hai câu hỏi cần hỏi trước khi nhập dữ liệu vào AI và thông điệp của nhóm về xin phép trước khi chia sẻ dữ liệu của người khác. Cẩm nang mini và Phiếu học tập số 7 (làm cùng cha mẹ hoặc người chăm sóc, không bắt buộc): chỉ đọc phần giới thiệu, cài đặt quyền riêng tư và quyền truy cập (camera, micro, vị trí); không cài ứng dụng mới, không tạo tài khoản, không nhập thêm dữ liệu; không ghi tên tài khoản, địa chỉ, không dán ảnh màn hình có thông tin cá nhân; nếu làm, nộp cho thầy cô trong tuần sau.", "nav": "Áp phích 4 bước", "icon": "📣", "badge": "Họa sĩ an toàn", "fields": [{"id": "sit", "label": "Tình huống nhóm chọn", "opts": ["Tình huống 1: Một phần mềm hội thoại tự động (chatbot) làm quen trong trò chơi trực tuyến hỏi tên trường, địa chỉ nhà và xin ảnh của em", "Tình huống 2: Một ứng dụng AI tạo ảnh hoạt hình đòi quyền xem toàn bộ thư viện ảnh và danh bạ mới cho dùng", "Tình huống 3: Một bạn đưa ảnh cả nhóm có em vào ứng dụng AI biến thành ảnh hoạt hình rồi đăng lên nhóm chat chung mà chưa hỏi ý em", "Tình huống 4: Em đã xoá tài khoản ứng dụng học tiếng Anh có AI chấm phát âm, nhưng ứng dụng vẫn giữ các đoạn ghi âm giọng em"]}, {"id": "stop", "label": "1. DỪNG: câu nói của em", "hint": "một câu", "ph": "Mình dừng lại, không gửi thêm gì."}, {"id": "tell", "label": "2. BÁO: em sẽ tìm ai (ghi vai, không ghi tên riêng)", "hint": "kèm 111 / 113", "ph": "Cha mẹ, GV chủ nhiệm; cần tư vấn gọi 111; nguy hiểm tức thời gọi 113."}, {"id": "keep", "label": "3. GIỮ và 4. CHẶN: việc cần làm cùng người lớn", "hint": "ít nhất 2 việc", "ph": "Người lớn lưu đường dẫn, thời điểm; chặn, báo cáo, yêu cầu gỡ."}, {"id": "q", "label": "Hai câu hỏi trước khi nhập dữ liệu vào AI", "hint": "chọn từ năm câu hỏi đã học", "ph": "1. Ứng dụng thu dữ liệu gì, để làm gì? 2. Có tắt, xoá được không?"}, {"id": "ask", "label": "Thông điệp xin phép trước khi chia sẻ dữ liệu của người khác", "hint": "một câu", "ph": "Hỏi bạn trước khi đăng ảnh có bạn. Được xem không có nghĩa là được dùng."}, {"id": "p7", "label": "Phiếu 7: tên ứng dụng (hoặc “thẻ in sẵn”); quyết định Xanh/Vàng/Đỏ và lí do; mức dùng AI", "hint": "không ghi tên tài khoản, địa chỉ", "ph": "Bản đồ Đường Xanh (thẻ in sẵn): Vàng, vì xin quyền vị trí “luôn cho phép” và không nêu độ tuổi. Mức dùng AI: không dùng AI.", "long": true}], "checks": ["Nêu đủ bốn bước: dừng; báo người lớn tin cậy; cùng người lớn giữ thông tin về sự việc; chặn, báo cáo, yêu cầu gỡ trên nền tảng.", "Có hai câu hỏi kiểm tra trước khi nhập dữ liệu vào AI, về dữ liệu thu thập hoặc quyền tắt, xoá.", "Thể hiện yêu cầu xin phép trước khi chia sẻ dữ liệu của người khác.", "Không đổ lỗi cho người gặp sự cố; ghi rõ người, kênh hỗ trợ (nhà trường, Tổng đài 111; 113 khi có nguy hiểm tức thời).", "Không chứa dữ liệu cá nhân thật; thông điệp rõ, HS lớp 6 làm theo được. Các nhóm góp ý cho nhau theo ba tiêu chí đúng, dễ làm theo, không đổ lỗi."], "sample": "Áp dụng bốn bước. Tình huống 1: dừng trò chuyện, không gửi ảnh, địa chỉ; báo cha mẹ hoặc người lớn tin cậy; người lớn ghi lại tên tài khoản, thời điểm; chặn và báo cáo tài khoản trong trò chơi. Tình huống 2: dừng cài; hỏi người lớn trong gia đình trước khi cho ứng dụng xem ảnh, danh bạ; người lớn ghi lại ứng dụng đòi những quyền gì; tạo ảnh hoạt hình không cần danh bạ nên cùng người lớn chọn ứng dụng khác. Tình huống 3: không bình luận, không chia sẻ thêm; báo GV chủ nhiệm hoặc cha mẹ; người lớn ghi lại đường dẫn; đề nghị bạn gỡ ảnh, báo cáo hoặc yêu cầu gỡ trên nhóm chat. Tình huống 4: không đăng kí lại, không gửi thêm ghi âm; báo cha mẹ hoặc người lớn tin cậy; cùng người lớn ghi lại ngày xoá tài khoản và điều cho thấy ứng dụng còn giữ ghi âm; gửi yêu cầu xoá dữ liệu qua chức năng của ứng dụng hoặc nhờ người lớn liên hệ bên cung cấp. Thông điệp: “Hỏi bạn trước khi đăng ảnh có bạn. Được xem không có nghĩa là được dùng.” Cẩm nang mini: DỪNG, BÁO, GIỮ, CHẶN; trước khi nhập dữ liệu vào AI, em hỏi: thu gì? để làm gì? lưu bao lâu, chia sẻ cho ai? tắt, xoá được không? hợp tuổi em không? Mẫu câu nhận xét: “Em đã chỉ ra đúng khuôn mặt hai bạn và bảng tên trường là dữ liệu cần hỏi trước khi đăng. Em cần nói rõ hơn ai có quyền quyết định. Lần sau, em thử hỏi: dữ liệu này là của ai?” — “Em đã dừng lại và báo cô chủ nhiệm, đúng thứ tự. Em cần nêu thêm việc không nên làm, như không trả đũa, không chuyển tiếp. Em thử nghĩ: nếu em tự trả lời bạn trêu, chuyện có thể thành thế nào?”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 6 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

let ST,step=0,MUTE=false;const MODS=SPEC.modules;
function fresh(){ST={pts:0,done:MODS.map(()=>0),got:MODS.map(()=>0),m:MODS.map(()=>({}))}}
fresh();
function maxPts(){return MODS.reduce((a,m,i)=>a+(mp(m)),0)}
function mp(m){switch(m.type){case'story':return m.chars.length*5;case'sort':return m.cards.length*3;case'quiz':return m.qs.length*4;case'order':return 10;case'decide':return m.cases.length*5;case'flag':return 10;case'lab':return 6;case'match':return m.pairs.length*2;case'build':return 6;default:return 0}}
function award(i,p){ST.got[i]+=p;ST.pts+=p;$('#score').textContent='⭐ '+ST.pts}
let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{beep(660);setTimeout(()=>beep(880),90)},bad=()=>beep(180,.25,'sawtooth');
$('#snd').onclick=()=>{MUTE=!MUTE;$('#snd').textContent=MUTE?'🔇':'🔊'};
function confetti(){const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,s:5+Math.random()*7,c:['#ff8a2b','#2ecc71','#4aa3ff','#f6c744','#ef5350'][Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<140)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
const av=(c,n)=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="38" r="22" fill="#ffd9b3"/><path d="M28 36q4-24 22-22t22 22q-10-12-44 0z" fill="#3b2a20"/><rect x="26" y="62" width="48" height="34" rx="16" fill="${c||'#4aa3ff'}"/><circle cx="42" cy="40" r="3" fill="#222"/><circle cx="58" cy="40" r="3" fill="#222"/><path d="M42 50q8 7 16 0" stroke="#b5533c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="50" y="86" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">${esc((n||'').slice(0,8))}</text></svg>`;
const head=(m,extra)=>E('div','card',`<span class="tag">${esc(m.tag||'')}</span><h2>${esc(m.title)}</h2><p class="lead">${m.intro||''}</p>`+(extra||''));
function nav(){const mp_=$('#map');mp_.innerHTML='';MODS.forEach((m,i)=>{const d=E('div','node'+(i==step?' on':'')+(ST.done[i]?' done':''),`<i>${ST.done[i]?'✓':(m.icon||i+1)}</i>${esc(m.nav||m.title).slice(0,26)}`);d.onclick=()=>go(i);mp_.appendChild(d)});const d=E('div','node'+(step==MODS.length?' on':''),`<i>🏁</i>Kết quả`);d.onclick=()=>go(MODS.length);mp_.appendChild(d)}
function go(i){step=i;nav();const m=$('#main');m.innerHTML='';if(i>=MODS.length)result(m);else{const md=MODS[i];(R[md.type]||R.unknown)(m,md,i)}if(i<MODS.length)ainote(m)}
function ainote(m){m.appendChild(E('div','note','<b>Điểm kiểm soát AI & an toàn dữ liệu:</b> '+esc(SPEC.ainote||'Con người quyết định cuối cùng; kiểm chứng kết quả AI; khai báo trung thực khi dùng AI; không nhập dữ liệu cá nhân. Mọi tình huống là giả định, phần mềm không kết nối AI thật và không thu thập dữ liệu.')))}
function finish(card,i,lab){ST.done[i]=1;nav();const b=E('button','btn g',lab||(i<MODS.length-1?'Tiếp tục ▶':'Xem kết quả ▶'));b.onclick=()=>{go(i+1);scrollTo({top:0})};card.appendChild(b)}

 const c=head(md);const tabs=E('div');tabs.style.cssText='display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap';md.chars.forEach((x,j)=>{const b=E('button','btn '+(j==s.k?'':'w'),esc(x.n)+(s.res[j]?' ✓':''));b.onclick=()=>{s.k=j;go(i)};tabs.appendChild(b)});c.appendChild(tabs);
 const st=E('div','stage'),L=E('div');L.innerHTML=`<div class="char">${av(ch.color,ch.n)}</div><div class="bubble"><b>${esc(ch.n)}</b>: ${ch.task}</div>`;
