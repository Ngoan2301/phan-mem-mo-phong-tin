<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 6. Nhận diện ứng dụng và công nghệ AI quanh em – Lớp 6</title>
<style>
:root{--o:#16a085;--od:#107863;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🔎", "ainote": "Ví dụ và hai ca thực hành là giả định, không thử nhận diện khuôn mặt hay chụp ảnh bạn. Con người quyết định có dùng công cụ AI hay không và luôn kiểm tra lại đầu ra trước khi dùng. Không thử mở khoá khuôn mặt trên điện thoại của GV hay HS; người dùng quyết định có bật tính năng nhận diện khuôn mặt hay không.", "takeaways": ["Công cụ có AI thường tự nhận biết lời nói, hình ảnh, chữ viết, xử lí dữ liệu rồi đưa ra gợi ý hoặc phản hồi hợp với từng tình huống. Công cụ không có AI chỉ làm đúng một việc cố định, không nhận biết hay suy luận gì, như máy tính bỏ túi, đèn giao thông đổi màu theo thời gian cài sẵn.", "Mỗi công cụ AI có chức năng chính riêng và dùng công nghệ AI để làm chức năng đó: nhận dạng hình ảnh; xử lí giọng nói, văn bản; gợi ý thông minh.", "Đầu ra của công cụ AI có thể sai do đầu vào chưa rõ hoặc do giới hạn của công cụ. Con người kiểm tra lại đầu ra trước khi dùng và quyết định có dùng hay không.", "AI có thể hỗ trợ con người nhưng cần kiểm chứng và sử dụng có trách nhiệm."], "modules": [{"type": "decide", "tag": "HĐ1 • Mở đầu", "title": "Máy quét: thiết bị nào có AI?", "nav": "Thiết bị nào có AI?", "icon": "🚦", "badge": "Máy quét AI", "intro": "Ba phương án: Phương án 1, cửa kính siêu thị tự mở khi có người bước tới. Phương án 2, tính năng mở khoá khuôn mặt nhận ra chủ máy kể cả khi đeo kính. Phương án 3, đèn giao thông chuyển màu theo thời gian định sẵn. Câu hỏi (1): Thiết bị nào trong ba thiết bị có AI? Câu hỏi (2): Vì sao em nghĩ thiết bị đó có AI? Trả lời 3 câu hỏi Có/Không để máy quét cho biết rồi chọn tình huống kiểm tra suy đoán (đèn xanh = có AI, đèn đỏ = không có AI). Câu hỏi được giải ở cuối bài.", "questions": ["Thiết bị có tự nhận biết (nghe, nhìn, hiểu lời nói, chữ viết) không?", "Thiết bị có suy luận từ dữ liệu để gợi ý, phản hồi khác nhau tuỳ từng người, từng tình huống không?", "Thiết bị chỉ làm đúng một việc cài sẵn (theo giờ, theo công thức, theo chương trình)?"], "verdicts": ["Có AI", "Không có AI"], "rules": [{"when": [null, null, 1], "v": 1}, {"when": [1, null, 0], "v": 0}, {"when": [null, 1, 0], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "Phương án 1. Cửa kính siêu thị tự mở khi có người bước tới.", "v": 1, "why": "Phương án 1 chỉ mở khi cảm biến thấy có vật chuyển động tới gần, không nhận ra đó là ai. HS chọn phương án 1 hoặc 3 vì “tự động” là ngộ nhận cần xử lí ở HĐ 2."}, {"t": "Phương án 2. Tính năng mở khoá khuôn mặt nhận ra chủ máy kể cả khi đeo kính.", "v": 0, "why": "Lựa chọn hợp lí là phương án 2: tính năng này nhận biết hình ảnh khuôn mặt rồi tự quyết định có mở khoá hay không, kể cả khi khuôn mặt thay đổi (đeo kính). Lí do mong đợi: thiết bị “nhìn” và nhận ra một người cụ thể. Người dùng quyết định có bật tính năng nhận diện khuôn mặt hay không."}, {"t": "Phương án 3. Đèn giao thông chuyển màu theo thời gian định sẵn.", "v": 1, "why": "Phương án 3 chỉ đổi màu theo thời gian định sẵn, không nhận biết xe, người."}]}, {"type": "sort", "tag": "HĐ2 • Nhận diện công cụ AI (1)", "title": "Công cụ nào có AI? (tám thẻ)", "nav": "Tám thẻ công cụ", "icon": "🗂️", "badge": "Người phân loại AI", "intro": "Câu chuyện (giả định): Trong giờ sinh hoạt lớp, các bạn kể về công cụ mình dùng hằng ngày. Minh hay dùng trợ lí ảo để nhắc lịch học và hỏi các bạn còn công cụ nào có AI. Cả nhóm cùng xếp xem công cụ nào có AI, công cụ nào không. Câu hỏi gợi ý: Công cụ có tự nhận biết (nghe, nhìn, hiểu lời nói, chữ viết) hoặc suy luận để gợi ý không hay chỉ làm một việc cài sẵn? Hãy kéo từng thẻ vào cột và đọc dấu hiệu.", "cats": ["Có AI", "Không có AI"], "cards": [{"t": "Thẻ 1. Trợ lí ảo trên điện thoại", "g": [0], "why": "Có AI. Dấu hiệu: nghe hiểu lời nói rồi trả lời, đặt lời nhắc theo yêu cầu (tự nhận biết và phản hồi khác nhau với từng người, từng yêu cầu)."}, {"t": "Thẻ 2. Máy tính bỏ túi", "g": [1], "why": "Không có AI. Chỉ tính theo công thức, không nhận biết hay suy luận gì."}, {"t": "Thẻ 3. Ứng dụng bản đồ", "g": [0], "why": "Có AI. Dấu hiệu: tự gợi ý đường đi hợp với điểm đến, tình hình đường lúc đó (suy luận từ vị trí, điểm đến, tình hình đường để gợi ý lộ trình hợp với từng chuyến đi)."}, {"t": "Thẻ 4. Cửa kính tự mở nhờ cảm biến", "g": [1, 0], "why": "Không có AI. Cảm biến thấy có vật tới gần thì mở; không nhận ra là ai, chỉ làm một việc cài sẵn. Nhiệm vụ cho nhóm xong sớm: cảm biến chỉ báo “có vật tới gần” và cửa luôn làm đúng một việc là mở; cửa không nhận ra người đó là ai, không suy luận hay chọn cách phản hồi khác nhau."}, {"t": "Thẻ 5. Công cụ dịch thuật trực tuyến", "g": [0], "why": "Có AI. Dấu hiệu: đọc hiểu câu của người dùng rồi viết lại bằng ngôn ngữ khác."}, {"t": "Thẻ 6. Đèn giao thông đổi màu theo giờ cài sẵn", "g": [1, 0], "why": "Không có AI. Đổi màu theo thời gian cài sẵn, không nhận biết xe, người."}, {"t": "Thẻ 7. Phần mềm nhận diện khuôn mặt", "g": [0], "why": "Có AI. Dấu hiệu: nhìn ảnh khuôn mặt và nhận ra một người cụ thể."}, {"t": "Thẻ 8. Máy giặt chạy chương trình cài sẵn", "g": [1, 0], "why": "Không có AI. Giặt theo chương trình người dùng chọn, không tự nhận biết. Lưu ý khi chấm thẻ 4, 6, 8: hiện có một số loại máy giặt, đèn giao thông được giới thiệu là có AI (tự nhận biết lượng đồ giặt, lượng xe để điều chỉnh). Tên thẻ đã ghi rõ cách chạy nên đáp án là không có AI; nhóm nêu được ví dụ tự nhận biết rồi điều chỉnh và xếp vào “Có AI” kèm dấu hiệu đó thì ghi nhận lập luận đúng. Thẻ 2, 4, 6, 8: chỉ làm đúng một việc đã cài sẵn."}], "pass": 0.7}, {"type": "match", "tag": "HĐ2 • Nhận diện công cụ AI (2)", "title": "Ghép công cụ AI với chức năng chính và công nghệ AI", "nav": "Chức năng và công nghệ", "icon": "🔗", "badge": "Người ghép công nghệ AI", "intro": "Phần B. Với công cụ có AI, ghi thêm chức năng chính và công nghệ AI (nhận dạng hình ảnh; xử lí giọng nói, văn bản; gợi ý thông minh). Câu hỏi (2): Công cụ có AI này dùng công nghệ AI nào để làm được chức năng chính? Ghép mỗi công cụ với chức năng chính và công nghệ AI.", "pairs": [["Thẻ 1. Trợ lí ảo trên điện thoại", "Chức năng: trả lời câu hỏi, nhắc lịch theo lời nói. Công nghệ: xử lí giọng nói (nhận dạng giọng nói, chuyển giọng nói thành chữ); có thể đọc câu trả lời thành tiếng (chuyển văn bản thành giọng nói)"], ["Thẻ 3. Ứng dụng bản đồ", "Chức năng: tìm đường, gợi ý lộ trình. Công nghệ: gợi ý thông minh (gợi ý lộ trình)"], ["Thẻ 5. Công cụ dịch thuật trực tuyến", "Chức năng: dịch văn bản, lời nói sang ngôn ngữ khác. Công nghệ: xử lí văn bản (xử lí ngôn ngữ)"], ["Thẻ 7. Phần mềm nhận diện khuôn mặt", "Chức năng: xác nhận đúng người (mở khoá, điểm danh). Công nghệ: nhận dạng hình ảnh"]], "why": "Mỗi công cụ AI có chức năng chính riêng và dùng công nghệ AI để làm chức năng đó. Công cụ có AI thường tự nhận biết lời nói, hình ảnh, chữ viết, xử lí dữ liệu rồi đưa ra gợi ý hoặc phản hồi hợp với từng tình huống. Chấp nhận cách xếp khác nếu nhóm nêu được dấu hiệu hợp lí."}, {"type": "match", "tag": "HĐ2 • Đầu vào, đầu ra", "title": "Bảng Đầu vào, Đầu ra của bốn công cụ AI", "nav": "Đầu vào – Đầu ra", "icon": "📥", "badge": "Người kiểm tra đầu ra", "intro": "Ghép mỗi công cụ và việc người dùng yêu cầu (kèm dữ liệu đầu vào và đầu ra) với điểm con người cần kiểm tra. Ở vùng nông thôn có thể đổi thành ví dụ hỏi trợ lí ảo bằng giọng nói về thời tiết trước khi ra đồng; đây vẫn là trợ lí ảo.", "pairs": [["Trợ lí ảo nhắc lịch học. Dữ liệu đầu vào: giọng nói của người dùng. Đầu ra: lời nhắc lịch học", "Giờ và nội dung lời nhắc đã lưu có đúng không"], ["Ứng dụng bản đồ tìm đường. Dữ liệu đầu vào: vị trí hiện tại (GPS), điểm cần đến. Đầu ra: lộ trình di chuyển", "Lộ trình có đi được, có an toàn thực tế không"], ["Công cụ dịch thuật trực tuyến. Dữ liệu đầu vào: văn bản cần dịch. Đầu ra: bản dịch sang ngôn ngữ khác", "Bản dịch có đúng ngữ cảnh của câu gốc không"], ["Phần mềm nhận diện khuôn mặt. Dữ liệu đầu vào: hình ảnh khuôn mặt. Đầu ra: xác nhận đúng người hay không", "Ánh sáng, góc chụp; người dùng quyết định có bật tính năng hay không"]], "why": "Con người luôn kiểm tra lại đầu ra trước khi dùng và quyết định có dùng hay không."}, {"type": "story", "tag": "HĐ3 • Luyện tập", "title": "Hai ca thực hành với công cụ AI", "nav": "Hai ca thực hành", "icon": "🧪", "badge": "Người kiểm chứng", "intro": "Phần C. Hai ca thực hành (giả định). Giải thích ngắn ba khâu. Lỗi đầu vào: người dùng đưa vào chưa rõ, chưa đủ. Lỗi dữ liệu huấn luyện: dữ liệu dùng để dạy công cụ còn thiếu, ít ví dụ giống trường hợp đang gặp. Lỗi thuật toán, quy tắc xử lí: cách công cụ được lập trình để xử lí chưa phù hợp. Ca thực hành 1: Minh dùng trợ lí ảo để nhắc lịch học. Minh hay nói vội khi lớp ồn; đôi khi lời nhắc trợ lí ảo lưu lại bị sai giờ. Ca thực hành 2: Lan dùng công cụ dịch thuật để dịch bài tập tiếng Anh. Lan chỉ gõ riêng từng từ, từng cụm ngắn, tách khỏi câu; đôi khi bản dịch không đúng ngữ cảnh. Hãy giúp Minh và Lan chọn cách làm tốt nhất, rồi xem hậu quả. Câu gợi mở: Người dùng đã đưa gì vào công cụ? Nếu đưa vào rõ hơn thì đầu ra có thể đúng hơn không?", "app": "🤖 Công cụ AI (mô phỏng)", "hello": "Xin chào! Mình là công cụ AI mô phỏng. Mình có thể nhầm khi đầu vào chưa rõ, nên em hãy kiểm tra lại kết quả nhé.", "meters": [{"n": "Độ đúng của kết quả", "b": 40, "c": 0}, {"n": "Nguy cơ sai sót", "b": 50, "c": 2}, {"n": "Em chủ động kiểm soát", "b": 40, "c": 3}], "chars": [{"n": "Minh", "color": "#4aa3ff", "task": "dùng trợ lí ảo để nhắc lịch học. Minh hay nói vội khi lớp ồn; đôi khi lời nhắc lưu lại bị sai giờ. Minh nên làm thế nào?", "opts": [{"t": "Cứ nói vội trong lớp ồn và tin lời nhắc đã lưu", "chat": ["Nhắc em học bài lúc 7 giờ tối nha (nói nhanh, lẫn tiếng ồn)", "Đã đặt lời nhắc: Học bài lúc 7 giờ sáng."], "ch": [-25, 35, -20], "v": "bad", "fb": "Lỗi đầu vào: lời nói vội và lẫn tiếng ồn nên chưa rõ, lời nhắc bị sai giờ mà không ai kiểm tra. Con người cần kiểm tra lại đầu ra."}, {"t": "Nói rõ, chậm ở chỗ yên tĩnh; đọc lại lời nhắc trên màn hình và sửa giờ nếu sai", "chat": ["Nhắc em học bài lúc 7 giờ tối (nói rõ, chậm, nơi yên tĩnh)", "Đã đặt lời nhắc: Học bài lúc 7 giờ tối. Bạn xem  gì để giải quyết vấn đề? HS có thể tự ghi lịch học vào sổ hoặc nhờ người lớn nhắc; tra từ điển, hỏi thầy cô để dịch bài tập.", "cats": ["Lỗi đầu vào", "Lỗi dữ liệu huấn luyện", "Lỗi thuật toán, quy tắc xử lí"], "cards": [{"t": "Ca 1. Minh “hay nói vội khi lớp ồn” nên lời nói đưa vào chưa rõ; lời nhắc lưu lại “bị sai giờ”", "g": [0, 1], "why": "Chức năng chính của công cụ: trợ lí ảo nghe lời nói của người dùng để đặt lời nhắc lịch học. Chẩn đoán: lỗi đầu vào là chính. Chấp nhận nhóm chọn thêm “lỗi dữ liệu huấn luyện” nếu giải thích được bằng chi tiết trong ca. Cách “huấn luyện lại giọng nói” HS không tự làm được nên không là cách khắc phục mong đợi."}, {"t": "Ca 1. Cách khắc phục: nói rõ, chậm, ở chỗ yên tĩnh; đọc lại lời nhắc đã lưu trên màn hình, sửa giờ nếu sai trước khi dùng", "g": [0], "why": "Cách khắc phục người dùng tự làm được: cải thiện đầu vào và kiểm tra lại đầu ra."}, {"t": "Ca 2. Lan “chỉ gõ riêng từng từ, từng cụm ngắn, tách khỏi câu” nên công cụ thiếu ngữ cảnh và “bản dịch không đúng ngữ cảnh”", "g": [0, 1], "why": "Chức năng chính của công cụ: dịch văn bản tiếng Anh sang tiếng Việt. Chẩn đoán: lỗi đầu vào là chính. Chấp nhận nhóm chọn thêm lỗi dữ liệu huấn luyện nếu giải thích được bằng chi tiết trong ca."}, {"t": "Ca 2. Cách khắc phục: gõ cả câu, viết câu gốc rõ, đủ ý; đối chiếu nghĩa với từ điển, sách giáo khoa; hỏi thầy cô khi còn phân vân", "g": [0], "why": "Cách khắc phục người dùng tự làm được."}, {"t": "Dữ liệu dùng để dạy công cụ còn thiếu, ít ví dụ giống trường hợp đang gặp", "g": [1], "why": "Đó là định nghĩa lỗi dữ liệu huấn luyện."}, {"t": "Cách công cụ được lập trình để xử lí chưa phù hợp", "g": [2], "why": "Hai ca không có chi tiết nào về cách công cụ xử lí, nên “lỗi thuật toán, quy tắc xử lí” không phải đáp án mong đợi. Nhóm chọn ô này mà dẫn được chi tiết trong ca và lập luận hợp lí thì ghi nhận; nếu không, hỏi lại câu hỏi (1)."}], "pass": 0.7}, {"type": "quiz", "tag": "HĐ4 • Vận dụng", "title": "Dấu hiệu, chức năng, công nghệ và câu đúng người). Chưa thấy minh chứng nếu chỉ kể tên mà không nêu chức năng. Câu 4b: thêm một công nghệ khác, ví dụ nhận dạng hình ảnh."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu số 2 (1): Phân biệt, chức năng, công nghệ", "nav": "Phiếu 2 – câu 1 đến 4", "icon": "📝", "badge": "Người nhận diện AI", "intro": "Phiếu học tập số 2. Phiếu cuối giờ: AI quanh em. Em tự làm phiếu này. Em không ghi họ tên thật của người khác, số điện thoại hay thông tin riêng của bản thân và gia đình.", "fields": [{"id": "c1", "label": "1. Em đánh dấu một tình huống gần gũi (hoặc tự ghi một tình huống tương tự)", "opts": ["A. Dùng trợ lí ảo để nhắc lịch học", "B. Dùng ứng dụng bản đồ để tìm đường đi học", "C. Dùng công cụ dịch thuật để dịch bài tập tiếng Anh", "Tình huống em tự chọn"]}, {"id": "a", "label": "2a. Công cụ, tính năng có AI", "ph": "Ví dụ: Trợ lí ảo trên điện thoại."}, {"id": "b", "label": "2b. Một công cụ, tính năng không có AI em cũng dùng trong tình huống này", "ph": "Ví dụ: Đồng hồ báo thức cài sẵn giờ."}, {"id": "c", "label": "2c. Dấu hiệu giúp em nhận ra công cụ ở câu 2a có AI", "ph": "Ví dụ: Trợ lí ảo nghe hiểu lời em nói rồi đặt lời nhắc đúng việc em cần; đồng hồ báo thức chỉ kêu đúng giờ đã cài."}, {"id": "d", "label": "3. Chức năng chính của công cụ có AI ở câu 2a, và một công cụ AI khác em biết kèm chức năng chính", "ph": "Ví dụ: Nghe lời nói để đặt lời nhắc lịch học, trả lời câu hỏi. Công cụ dịch thuật: dịch câu tiếng Anh sang tiếng Việt."}, {"id": "e", "label": "4. Công nghệ AI của công cụ ở câu 2a, và một công nghệ AI quen thuộc khác", "ph": "Ví dụ: Nhận dạng giọng nói (chuyển giọng nói thành chữ). Nhận dạng hình ảnh."}], "checks": ["Câu 2 (6.C2.1): đúng công cụ có AI với tình huống và nêu dấu hiệu tự nhận biết hoặc suy luận (không chỉ “tự động”)", "Câu 3 (6.C2.2): nêu chức năng chính của công cụ, và một công cụ AI khác kèm chức năng", "Câu 4 (6.C3.1): nêu công nghệ AI đúng với công cụ đã chọn, và thêm một công nghệ khác", "Mức Khá: chọn đúng công cụ có AI và không có AI; dấu hiệu nói được việc công cụ tự nhận biết hoặc suy luận để gợi ý; chức năng chính, công nghệ AI ghép đúng, diễn đạt bằng lời của mình. Mức Tốt: dấu hiệu chỉ ra được điểm khác giữa hai công cụ trong cùng tình huống; giải thích được vì sao công nghệ AI giúp công cụ làm được chức năng chính; tự lấy được ví dụ ngoài ba tình huống gợi ý"], "sample": "Bài làm mẫu (tình huống A). 1: Đánh dấu A. Dùng trợ lí ảo để nhắc lịch học. 2: a) Trợ lí ảo trên điện thoại. b) Đồng hồ báo thức cài sẵn giờ. c) Trợ lí ảo nghe hiểu lời em nói rồi đặt lời nhắc đúng việc em cần; đồng hồ báo thức chỉ kêu đúng giờ đã cài. 3: a) Nghe lời nói để đặt lời nhắc lịch học, trả lời câu hỏi. b) Công cụ dịch thuật: dịch câu tiếng Anh sang tiếng Việt. 4: a) Nhận dạng giọng nói (chuyển giọng nói thành chữ). b) Nhận dạng hình ảnh."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu số 2 (2): Điểm con người cần kiểm tra lại", "nav": "Phiếu 2 – câu 5, góp ý", "icon": "🤝", "badge": "Người kiểm tra lại đầu ra", "intro": "Câu 5. Điểm con người cần kiểm tra lại: Nếu con người không kiểm tra khâu …… thì có nguy cơ …… Sau đó đổi phiếu với bạn cùng bàn, tự sửa bằng bút khác màu và đánh dấu bảng “Bạn góp ý”. Người dùng quyết định có tin, có dùng đầu ra của công cụ AI hay không sau khi kiểm tra lại.", "fields": [{"id": "k", "label": "5. Nếu con người không kiểm tra khâu … thì có nguy cơ …", "ph": "Ví dụ: Nếu con người không kiểm tra khâu giờ nhắc đã lưu thì có nguy cơ bị nhắc sai giờ, đi học muộn."}, {"id": "c", "label": "Cách em kiểm tra lại hoặc xử lí an toàn", "ph": "Ví dụ: đọc lại lời nhắc đã lưu trên màn hình, sửa nếu sai trước khi dùng."}, {"id": "p1", "label": "Bạn góp ý. Câu 2–4: phân biệt có AI, không có AI kèm dấu hiệu; kể đủ công cụ, chức năng, công nghệ", "opts": ["Đã rõ", "Cần bổ sung"]}, {"id": "p2", "label": "Bạn góp ý. Câu 5: rủi ro và cách kiểm tra lại", "opts": ["Đã rõ", "Cần bổ sung"]}, {"id": "g", "label": "Một góp ý cụ thể giúp bài bạn rõ hơn", "ph": "Ví dụ: Em thử nói xem trợ lí ảo nhận biết được gì mà đồng hồ báo thức không làm được."}], "checks": ["Nêu đúng khâu cần kiểm tra và nguy cơ gắn với tình huống; cách kiểm tra lại cụ thể, tự làm được (mức Khá)", "Chỉ ra được bằng chứng khiến đầu ra có thể sai; nêu được điều gì làm kết luận thay đổi và người dùng quyết định có dùng đầu ra hay không (mức Tốt)", "Hợp tác và trình bày: làm đúng vai được giao; trình bày rõ dấu hiệu nhóm dùng để xếp thẻ (Khá); tiếp thu nhận xét của nhóm bạn, điều chỉnh có căn cứ bằng bút khác màu; nói rõ thẻ còn chưa chắc và lí do (Tốt)"], "sample": "Nếu con người không kiểm tra khâu giờ nhắc đã lưu thì có nguy cơ đi học muộn. Cách kiểm tra: đọc lại lời nhắc đã lưu trên màn hình, sửa giờ nếu sai trước khi dùng. Mẫu nhận xét: “Em đã chọn đúng trợ lí ảo là công cụ có AI và đồng hồ báo thức là công cụ không có AI. Dấu hiệu em ghi còn chung là ‘tự động’. Em thử nói xem trợ lí ảo nhận biết được gì mà đồng hồ báo thức không làm được.” Hay: “Em kể được hai công cụ AI và chức năng chính của từng công cụ. Công nghệ AI ở câu 4a chưa khớp với công cụ em chọn. Em xem lại bảng phần B: trợ lí ảo dùng công nghệ nào để hiểu lời em nói?” Hay: “Em nêu đúng khâu giờ nhắc cần kiểm tra lại và cách đọc lại lời nhắc đã lưu, sửa trước khi dùng. Em có thể nói thêm khi nào em sẽ không dùng lời nhắc đó. Lần sau, em thử hỏi: bằng chứng nào cho thấy đầu ra có thể sai?”"}], "title": "Bài 6. Nhận diện ứng dụng và công nghệ AI quanh em – Lớp 6", "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 6 • Môn đảm nhiệm: Công nghệ • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

 const st=E('div','stage'),L=E('div'),Rr=E('div');
 md.sliders.forEach(x=>{const d=E('div','slrow',`<div>${esc(x.n)}: <b id="sv_${x.id}">${s.v[x.id]}</b>${esc(x.unit||'')}</div>`);const inp=E('input');inp.type='range';inp.min=x.min;inp.max=x.max;inp.step=x.step||1;inp.value=s.v[x.id];inp.oninput=()=>{s.v[x.id]=+inp.value;$('#sv_'+x.id).textContent=inp.value;upd()};d.appendChild(inp);L.appendChild(d)});
 const outs=E('div');md.outputs.forEach((o,k)=>outs.appendChild(E('div','meter mc'+(o.c!=null?o.c:k%4),`${esc(o.n)}: <b id="ov${k}"></b><div class="bar"><i id="ob${k}" style="width:0"></i></div>`)));Rr.appendChild(outs);const ins=E('div','fb info','');ins.id='ins';Rr.appendChild(ins);st.append(L,Rr);c.appendChild(st);
 function upd(){md.outputs.forEach((o,k)=>{let v=o.base||0;Object.keys(o.w||{}).forEach(id=>{v+=o.w[id]*(s.v[id]-(md.sliders.find(z=>z.id==id).val))});v=Math.max(0,Math.min(100,Math.round(v)));$('#ov'+k).textContent=v+(o.unit||'%');$('#ob'+k).style.width=v+'%';o._v=v});
  const hits=(md.insights||[]).filter(r=>{const val=s.v[r.id]!=null?s.v[r.id]:(md.outputs[r.out]||{})._v;return r.op=='>='?val>=r.val:val<=r.val});$('#ins').innerHTML='<b>Nhận xét:</b> '+(hits.length?hits.map(h=>esc(h.txt)).join('<br>'):'Hãy kéo các thanh trượt và quan sát.');s.moved=(s.moved||0)+1;if(s.moved>=6&&!s.rs){s.rs=1;award(i,6);good();ST.done[i]=1;nav();if(!$('.btn.g'))finish(c,i)}}
 m.appendChild(c);upd();s.moved=Math.max(0,(s.moved||1)-1);if(ST.done[i])finish(c,i)};
/* ---- match ---- */
R.match=(m,md,i)=>{const s=ST.m[i];s.d=s.d||{};s.l=s.l==null?null:s.l;if(!s.ro){s.ro=md.pairs.map((p,k)=>k).sort(()=>Math.random()-.5)}const c=head(md);const g=E('div','mt');const A=E('div'),B=E('div');
 md.pairs.forEach((p,k)=>{const d=E('div','it'+(s.d[k]?' done':'')+(s.l===k?' sel':''),esc(p[0]));d.style.marginBottom='8px';d.onclick=()=>{if(!s.d[k]){s.l=k;go(i)}};A.appendChild(d)});
 s.ro.forEach(k=>{const d=E('div','it'+(s.d[k]?' done':''),esc(md.pairs[k][1]));d.style.marginBottom='8px';d.onclick=()=>{if(s.d[k]||s.l==null)return;if(s.l===k){s.d[k]=1;award(i,2);good();s.l=null;if(Object.keys(s.d).length==md.pairs.length){ST.done[i]=1;confetti()}go(i)}else{bad();d.classList.add('bad');s.l=null;setTimeout(()=>go(i),400)}};B.appendChild(d)});g.append(A,B);c.appendChild(g);
 if(Object.keys(s.d).length==md.pairs.length){c.appendChild(E('div','fb ok','✅ Đã ghép đúng tất cả! '+esc(md.why||'')));finish(c,i)}m.appendChild(c)};
/* ---- build ---- */
R.build=(m,md,i)=>{const s=ST.m[i];s.f=s.f||{};s.c=s.c||{};const c=head(md);const cm=E('div','cmt');
 md.fields.forEach(f=>{cm.appendChild(E('label','f',esc(f.label)+(f.hint?` <small class="h">(${esc(f.hint)})</small>`:'')));let el;if(f.opts){el=E('select');el.innerHTML='<option value="">– Chọn –</option>'+f.opts.map(o=>`<option ${s.f[f.id]===o?'selected':''}>${esc(o)}</option>`).join('');el.onchange=()=>s.f[f.id]=el.value}else{el=E(f.long===false?'input':'textarea');if(f.long===false)el.type='text';el.value=s.f[f.id]||'';el.placeholder=f.ph||'';el.oninput=()=>s.f[f.id]=el.value}cm.appendChild(el)});c.appendChild(cm);
 if(md.checks){c.appendChild(E('h3',null,'Tự kiểm tra bằng bảng kiểm'));md.checks.forEach((t,k)=>{const d=E('label','chk',`<input type="checkbox" ${s.c[k]?'checked':''}> <span>${esc(t)}</span>`);d.querySelector('input').onchange=e=>s.c[k]=e.target.checked;c.appendChild(d)})}
 const b=E('button','btn','Hoàn thành & chấm tự đánh giá');b.onclick=()=>{const filled=md.fields.filter(f=>(s.f[f.id]||'').trim().length>=4).length,chk=Object.values(s.c).filter(Boolean).length;if(!s.rs){s.rs=1;award(i,Math.round(6*(filled/md.fields.length*.6+(md.checks?chk/md.checks.length:1)*.4)))}good();ST.done[i]=1;go(i)};c.appendChild(b);
 const dl=E('button','btn w','⬇ Lưu thành ảnh PNG');dl.onclick=()=>{const cv=document.createElement('canvas');cv.width=1000;cv.height=720;const x=cv.getContext('2d');x.fillStyle='#fffdf3';x.fillRect(0,0,1000,720);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--o');x.lineWidth=10;x.strokeRect(8,8,984,704);x.fillStyle='#1f2d3d';x.font='bold 30px Arial';x.fillText(md.title.slice(0,50),36,64);let y=110;const w=(t,y0,fs)=>{x.font=fs;const ws=String(t).split(' ');let l='';let yy=y0;for(const a of ws){if(x.measureText(l+a).width>920){x.fillText(l,36,yy);yy+=28;l=''}l+=a+' '}x.fillText(l,36,yy);return yy+34};md.fields.forEach(f=>{x.fillStyle='#d35400';y=w(f.label,y,'bold 20px Arial');x.fillStyle='#1f2d3d';y=w(s.f[f.id]||'……',y,'20px Arial')});const a=document.createElement('a');a.href=cv.toDataURL();a.download='san-pham-cua-em.png';a.click()};c.appendChild(dl);
 if(ST.done[i]){c.appendChild(E('div','fb ok','✅ Đã lưu bài làm. '+(md.sample?'<br><b>Gợi ý mẫu:</b> '+esc(md.sample):'')));finish(c,i)}m.appendChild(c)};
/* ---- result ---- */
function result(m){const c=E('div','card');const mx=maxPts()||1,pc=Math.min(100,Math.round(ST.pts/mx*100));
 c.innerHTML=`<h2>🏁 Kết quả của em</h2><p class="lead">Tổng điểm: <b>${ST.pts}</b> / ${mx} (${pc}%)</p><div class="bar" style="height:18px"><i style="width:${pc}%"></i></div><div style="text-align:center;margin:14px 0">`+MODS.map((x,k)=>`<span class="badge ${ST.done[k]?'on':''}">${x.icon||'⭐'}<small>${esc(x.badge||x.nav||x.title).slice(0,28)}</small></span>`).join('')+`</div>
 <table><tr><th>Hoạt động</th><th>Điểm</th></tr>`+MODS.map((x,k)=>`<tr><td>${esc(x.title)}</td><td>${ST.got[k]}/${mp(x)}</td></tr>`).join('')+`</table>
 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}
$('#ttl').textContent=SPEC.title;$('#sub').textContent=SPEC.sub||'';$('#ico').textContent=SPEC.icon||'🧭';
go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
</script></body></html>
