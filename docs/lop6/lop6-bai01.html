<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 6.1. AI do con người tạo ra và điều khiển – Lớp 6</title>
<style>
:root{--o:#e67e22;--od:#ac5e19;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>

<script>
const SPEC={"icon": "🤖", "title": "Bài 6.1. AI do con người tạo ra và điều khiển – Lớp 6", "ainote": "Không nêu tên, địa chỉ, thông tin gia đình khi kể ví dụ; không chụp khuôn mặt để thử mở khoá. Quyết định cuối cùng và trách nhiệm luôn thuộc về con người; HS không bắt buộc dùng AI, nếu dùng thì có người lớn đi cùng và ghi rõ AI đã giúp phần nào.", "takeaways": ["AI là sản phẩm do con người thiết kế, lập trình hoặc huấn luyện để làm việc cụ thể; AI không tự sinh ra và không hoạt động độc lập.", "Năm khâu có con người: xác định nhiệm vụ, chuẩn bị dữ liệu, lập trình hoặc huấn luyện, kiểm tra và sửa lỗi, người dùng ra lệnh và kiểm soát.", "AI chỉ là công cụ hỗ trợ: có thể trả lời nhanh nhưng vẫn có thể sai hoặc chưa hợp hoàn cảnh.", "Con người đưa ra quyết định cuối cùng và chịu trách nhiệm, kể cả khi AI làm tốt."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Loa thông minh trả lời được là nhờ đâu?", "intro": "Minh hỏi loa thông minh ở nhà: “Hôm nay trời có mưa không?”. Loa trả lời ngay bằng giọng nói. Minh thắc mắc: loa tự biết hay có ai đã dạy cho loa? Em hãy chọn câu trả lời theo suy nghĩ của mình. Mọi đáp án trong bài là đáp án tham khảo, chấp nhận phương án khác có lí do.", "nav": "Loa trả lời nhờ đâu", "icon": "🔊", "badge": "Nhà thám tử AI", "qs": [{"q": "Theo em, loa trả lời được là nhờ đâu?", "opts": ["Loa tự suy nghĩ, tự học và không cần ai.", "Có người thiết kế và cài đặt cho loa.", "Em chưa biết."], "a": 1, "why": "Lựa chọn mong đợi là B: có người thiết kế và cài đặt cho loa. HS chọn A hoặc C là quan niệm ban đầu, chưa nhận xét đúng sai; HS đối chiếu lại ở HĐ 4. Phương án A sai ở chỗ “không cần ai”. Kiến thức nền: loa thông minh trả lời được câu hỏi về thời tiết vì được con người lập trình để nhận câu hỏi bằng giọng nói. Sau đó loa lấy thông tin dự báo thời tiết do con người thu thập, cập nhật. Loa không tự biết trời có mưa hay không."}, {"q": "Thiết bị hoặc ứng dụng nào dưới đây cũng biết gợi ý hoặc trả lời như loa thông minh?", "opts": ["Gợi ý video, dịch tự động, bản đồ chỉ đường", "Quạt điện bấm nút số 1, 2, 3", "Cuốn vở ghi bài"], "a": 0, "why": "Ví dụ: trợ lí ảo trên điện thoại, gợi ý video, dịch tự động, bản đồ chỉ đường. Quạt điện bấm nút và cuốn vở không tự đưa ra gợi ý hay câu trả lời."}, {"q": "Ai đã tạo ra và điều khiển những công cụ AI như vậy?", "opts": ["Con người: kĩ sư, người chuẩn bị dữ liệu, người kiểm tra; khi dùng thì người dùng bật và ra lệnh", "Chính chiếc loa tự tạo ra mình", "Không ai cả, chúng tự xuất hiện trong máy tính"], "a": 0, "why": "Câu hỏi nêu vấn đề của bài, chưa cần trả lời đúng ngay. Câu trả lời mong đợi sau HĐ 2.1: con người (kĩ sư, những người chuẩn bị dữ liệu, kiểm tra) tạo ra công cụ; người dùng bật, ra lệnh và điều khiển công cụ khi sử dụng."}]}, {"type": "match", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Bộ thẻ công cụ AI: con người đã làm gì?", "intro": "PHIẾU HỌC TẬP SỐ 1. CON NGƯỜI ĐÃ LÀM GÌ ĐỂ TẠO RA CÔNG CỤ AI? Nhiệm vụ: Em cùng nhóm đọc hai thẻ được giao và hoàn thành bảng. Nhóm phân công bốn vai: đọc, ghi, kiểm tra đủ ý, báo cáo; sang thẻ thứ hai thì đổi vai. Ở bảng này, em ghép mỗi thẻ (công cụ làm việc gì?) với việc con người đã làm để tạo ra công cụ.", "nav": "Thẻ công cụ AI", "icon": "🧩", "badge": "Người tạo ra AI", "pairs": [["Thẻ 1. Trợ lí ảo, loa thông minh. Công cụ làm việc gì? Nhận lệnh bằng giọng nói, trả lời câu hỏi, phát nhạc.", "Kĩ sư xác định nhiệm vụ của công cụ. Kĩ sư thu thập nhiều mẫu giọng nói và câu hỏi. Kĩ sư viết chương trình và huấn luyện. Kĩ sư kiểm tra và cập nhật."], ["Thẻ 2. Gợi ý video. Công cụ làm việc gì? Gợi ý video có thể hợp sở thích người xem.", "Nhóm kĩ sư đặt mục tiêu gợi ý. Kĩ sư dùng dữ liệu lượt xem, gắn nhãn cho các video. Kĩ sư viết chương trình. Kĩ sư kiểm tra và điều chỉnh."], ["Thẻ 3. Dịch tự động. Công cụ làm việc gì? Chuyển một đoạn văn sang ngôn ngữ khác.", "Người biết hai ngôn ngữ viết nhiều cặp câu mẫu. Kĩ sư viết chương trình. Người kiểm tra sửa lỗi."], ["Thẻ 4. Mở khoá điện thoại bằng khuôn mặt. Công cụ làm việc gì? Nhận ra chủ máy để mở khoá điện thoại.", "Kĩ sư thiết kế công cụ. Kĩ sư thu thập nhiều ảnh khuôn mặt để huấn luyện và kiểm tra. Kĩ sư lập trình thuật toán đối chiếu khuôn mặt. Kĩ sư kiểm tra độ chính xác và an toàn."], ["Thẻ 5. Bản đồ chỉ đường. Công cụ làm việc gì? Gợi ý đường đi tới nơi cần đến.", "Kĩ sư xây dựng bản đồ. Kĩ sư thu thập dữ liệu giao thông. Kĩ sư viết chương trình tính đường đi phù hợp. Kĩ sư cập nhật liên tục."], ["Thẻ 6. Chatbot. Công cụ làm việc gì? Trả lời câu hỏi bằng văn bản.", "Kĩ sư xác định nhiệm vụ. Kĩ sư chuẩn bị dữ liệu văn bản. Kĩ sư huấn luyện. Kĩ sư kiểm tra an toàn, cập nhật."]], "why": "Câu hỏi chung trên phiếu: Nếu thiếu con người ở khâu nào thì công cụ không làm việc được? Không có người viết chương trình và cung cấp dữ liệu thì công cụ không tồn tại. Không có người bật và ra lệnh thì công cụ không hoạt động. Không có người kiểm tra và cập nhật thì công cụ dễ sai và không được cải tiến. Gợi ý ở B2 “Nếu kĩ sư không chuẩn bị dữ liệu thì công cụ này có làm được việc không?”: Không. Ví dụ trợ lí ảo không có mẫu giọng nói để học thì không nhận ra lệnh; dịch tự động học từ cặp câu mẫu, thiếu cặp câu mẫu thì dịch kém hoặc không dịch được. Với Thẻ 4: thiếu ảnh khuôn mặt để huấn luyện và kiểm tra thì công cụ không nhận ra chủ máy chính xác. Lưu ý: em không đăng kí hay chụp khuôn mặt của mình hoặc của bạn để thử mở khoá."}, {"type": "match", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Khi sử dụng, con người điều khiển ở khâu nào?", "intro": "Cột cuối của Phiếu học tập số 1: Khi sử dụng, con người điều khiển công cụ ở khâu nào? Em ghép mỗi công cụ với việc người dùng làm khi sử dụng. Bạn kiểm tra đủ ý đánh dấu các ô sau trước khi nộp: mỗi công cụ có ít nhất hai việc con người đã làm; chỉ ra khâu con người điều khiển khi sử dụng; giải thích được vì sao AI không hoạt động độc lập.", "nav": "Điều khiển khi dùng", "icon": "🎛️", "badge": "Người điều khiển", "pairs": [["Trợ lí ảo, loa thông minh", "Bật loa, đặt câu hỏi, bật hoặc tắt micro, chọn cài đặt."], ["Thẻ 2. Gợi ý video", "Chọn xem hoặc bỏ qua, tắt tự phát, đặt giới hạn thời gian."], ["Thẻ 3. Dịch tự động", "Nhập văn bản, chọn ngôn ngữ, đọc lại và sửa bản dịch."], ["Thẻ 4. Mở khoá điện thoại bằng khuôn mặt", "Chủ máy đăng kí khuôn mặt, bật hoặc tắt tính năng, đặt cách mở khoá dự phòng."], ["Thẻ 5. Bản đồ chỉ đường", "Nhập điểm đến, chọn tuyến, quyết định đi theo gợi ý hay không."], ["Thẻ 6. Chatbot", "Đặt câu hỏi, đọc kết quả, kiểm tra và quyết định có dùng hay không."]], "why": "Câu hỏi (1) ở mục b). Có công cụ AI nào tự sinh ra và tự làm việc mà không cần ai bật, ai cung cấp dữ liệu, ai sửa lỗi không? Không. Mọi công cụ trên thẻ đều do con người tạo ra, có người viết chương trình hoặc huấn luyện, có người kiểm tra, sửa lỗi hoặc cập nhật; khi dùng phải có người bật, ra lệnh, chọn cài đặt. Chiếc loa ở tình huống mở đầu cũng vậy. Gợi ý cho nhóm làm thêm thẻ thứ ba (so sánh hai công cụ): ở cả hai công cụ, con người đều làm nhiều khâu để tạo ra công cụ (sơ đồ năm khâu). Khi dùng, người dùng đều bật, ra lệnh và quyết định có dùng kết quả hay không. Khác nhau ở loại dữ liệu (giọng nói, lượt xem, cặp câu mẫu, dữ liệu giao thông…)."}, {"type": "order", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Sơ đồ năm khâu của công cụ AI", "intro": "Sơ đồ năm khâu GV vẽ ở B4 (HS chép vào vở): hãy sắp xếp năm khâu có sự tham gia của con người, từ lúc tạo ra công cụ AI đến lúc sử dụng.", "nav": "Sơ đồ năm khâu", "icon": "🔗", "badge": "Kiến trúc sư sơ đồ", "items": ["Xác định nhiệm vụ cho công cụ", "Chuẩn bị dữ liệu", "Lập trình hoặc huấn luyện", "Kiểm tra và sửa lỗi", "Người dùng ra lệnh và kiểm soát"], "why": "GV vẽ năm ô nối bằng mũi tên. Bốn khâu đầu là việc con người làm để tạo ra công cụ; khâu 5 là việc con người làm để điều khiển khi sử dụng. Mũi tên từ khâu 4 có thể quay lại khâu 2, 3 vì công cụ được sửa lỗi, cập nhật nhiều lần. Bảng kiểm ba ý để phản hồi Phiếu học tập số 1 tại chỗ (không quy thành mức, không chấm điểm): mỗi công cụ có ít nhất hai việc con người đã làm để tạo ra công cụ; chỉ ra khâu con người điều khiển khi sử dụng; giải thích được vì sao AI không hoạt động độc lập."}, {"type": "story", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Ai quyết định, ai chịu trách nhiệm?", "intro": "PHIẾU HỌC TẬP SỐ 2. AI QUYẾT ĐỊNH, AI CHỊU TRÁCH NHIỆM? Em đọc tình huống được giao (Lan, An, Bình là tên giả định) và lần lượt trả lời bốn câu hỏi: AI đã hỗ trợ việc gì; kết quả của AI có thể chưa đúng hoặc chưa phù hợp ở chỗ nào; ai là người quyết định cuối cùng; người đó cần làm gì trước khi quyết định và ai chịu trách nhiệm.", "nav": "Ai quyết định?", "icon": "⚖️", "badge": "Người quyết định cuối cùng", "app": "📱 Ứng dụng có AI (mô phỏng)", "hello": "Xin chào! Tôi chỉ là công cụ gợi ý. Bạn xem tình huống rồi chọn cách làm nhé.", "meters": [{"n": "An toàn", "b": 60, "c": 0}, {"n": "Nguy cơ sai", "b": 20, "c": 2}, {"n": "Trách nhiệm của người quyết định", "b": 40, "c": 1}], "chars": [{"n": "Bố của Lan", "color": "#4aa3ff", "task": "– Tình huống 1. Bản đồ và biển báo cấm (giả định): Ứng dụng bản đồ gợi ý cho bố của Lan đi theo đường ngắn nhất, nhưng phía trước có biển báo cấm ô tô. Bố của Lan nên làm gì?", "opts": [{"t": "Cứ đi theo gợi ý vì ứng dụng chỉ đường chắc đúng", "chat": ["Bản đồ: Đi thẳng 500 m, đây là đường ngắn nhất.", "(Phía trước có biển báo cấm ô tô, nhưng bản đồ không hiển thị.)"], "ch": [-30, 40, -10], "v": "bad", "fb": "AI hỗ trợ: gợi ý đường ngắn nhất. Chỗ chưa phù hợp: ứng dụng có thể chưa cập nhật biển báo hoặc không biết tình hình thực tế. Người quyết định cuối cùng là người trực tiếp lái xe (bố của Lan); nếu đi vào đường cấm, bố của Lan phải giải thích với cơ quan chức năng."}, {"t": "Quan sát biển báo, chọn đường phù hợp luật giao thông", "chat": null, "ch": [30, -15, 25], "v": "good", "fb": "Đúng. Cần quan sát biển báo, chọn đường phù hợp luật giao thông; người lái xe chịu trách nhiệm. AI không chịu trách nhiệm thay con người vì AI chỉ gợi ý, người dùng mới là người quyết định."}]}, {"n": "An", "color": "#ff9f43", "task": "– Tình huống 2. Chatbot và năm sinh danh nhân (giả định): An hỏi chatbot năm sinh của nhà văn Tô Hoài để làm bài. Chatbot đưa ra một năm và An chép luôn vào bài mà không kiểm tra, trong khi năm sinh đúng là 1920. An nên làm gì?", "opts": [{"t": "Chép luôn vào bài vì chatbot trả lời rất chắc chắn", "chat": ["An: Nhà văn Tô Hoài sinh năm nào?", "Chatbot: Nhà văn Tô Hoài sinh năm 1930. Thông tin này hoàn toàn chính xác. (Đoạn hội thoại mô phỏng, không phải kết quả thật của công cụ nào.)"], "ch": [0, 45, -30], "v": "bad", "fb": "AI hỗ trợ: đưa ra đáp án cho câu hỏi. Câu trả lời có thể sai hoặc không nêu nguồn. So với năm sinh đúng 1920: chatbot trả lời rất chắc chắn nhưng vẫn có thể sai; lời trả lời chắc chắn không có nghĩa là đúng. An giải thích với thầy cô về bài làm sai."}, {"t": "Không chép ngay; cân nhắc, kiểm tra lại trước khi dùng", "chat": null, "ch": [10, -20, 30], "v": "good", "fb": "Đúng. Không chép ngay; cân nhắc, kiểm tra lại trước khi dùng (cách kiểm tra cụ thể học ở Bài 2); học sinh (An) quyết định và chịu trách nhiệm về bài làm của mình."}, {"t": "Nhờ chatbot làm cả bài rồi nộp", "chat": ["An: Làm hộ mình cả bài.", "Chatbot: (đưa ra bài làm hoàn chỉnh)"], "ch": [0, 30, -40], "v": "bad", "fb": "AI làm hộ thì An không tự học được gì, và nộp như bài của mình là không trung thực. Người nộp bài vẫn là người chịu trách nhiệm."}]}, {"n": "Bình", "color": "#2ecc71", "task": "– Tình huống 3. Video tự động phát (giả định): Ứng dụng xem video tự động phát video tiếp theo. Bình xem liên tục hơn hai giờ và quên làm bài tập. Bình nên làm gì?", "opts": [{"t": "Cứ xem tiếp vì ứng dụng chọn video cho mình, không phải lỗi của mình", "chat": null, "ch": [-20, 25, -30], "v": "bad", "fb": "AI hỗ trợ: gợi ý và phát video tiếp theo. Chỗ chưa phù hợp: ứng dụng không biết học sinh còn bài tập phải làm. Bình chịu trách nhiệm về việc chưa làm bài tập."}, {"t": "Tắt tự phát, đặt giờ xem, làm bài tập trước (có bố mẹ hỗ trợ)", "chat": ười thiết kế, lập trình và cần con người bật, cấp dữ liệu, sửa lỗi. (Mã 6.A1.1: chọn S, lời sửa nêu được AI do con người tạo ra và cần con người điều khiển, tức không hoạt động độc lập.)"}, {"t": "Trợ lí ảo trả lời được vì kĩ sư đã lập trình và cung cấp dữ liệu cho nó.", "g": [0], "why": "Đúng. Trợ lí ảo trả lời được nhờ con người lập trình, cung cấp dữ liệu, huấn luyện và cập nhật. (Mã 6.A1.1.)"}, {"t": "Nếu AI gợi ý đáp án bài tập thì em có thể chép ngay vì AI không sai.", "g": [1], "why": "Sai. AI có thể sai; em không chép ngay mà phải xem lại, tự quyết định và tự chịu trách nhiệm về bài làm (cách kiểm tra học ở Bài 2). (Mã 6.A1.2.)"}, {"t": "Bác sĩ dùng phần mềm AI để xem ảnh X-quang, bác sĩ vẫn là người kết luận và chịu trách nhiệm.", "g": [0], "why": "Đúng. Phần mềm hỗ trợ, bác sĩ quyết định cuối cùng. Bác sĩ không được bỏ qua việc kiểm tra: AI có thể sai ở trường hợp mới, dù đã đúng ở hàng nghìn lần trước đó; người chịu trách nhiệm với người bệnh là bác sĩ. (Mã 6.A1.2.)"}, {"t": "Ứng dụng gợi ý video chọn video cho em nên em không phải chịu trách nhiệm về thời gian xem.", "g": [1], "why": "Sai. Ứng dụng chỉ gợi ý, em là người quyết định xem hay dừng nên em chịu trách nhiệm về thời gian của mình. (Mã 6.A1.2.)"}, {"t": "Khi được thầy cô cho phép, em dùng AI dịch một đoạn văn, tự đọc lại, sửa chỗ chưa hợp lí và ghi rõ phần AI đã giúp trước khi nộp.", "g": [0], "why": "Đúng. Đây là cách dùng AI có trách nhiệm vì được thầy cô cho phép, người dùng kiểm tra, sửa kết quả và ghi rõ phần AI đã giúp. Bạn nộp bài phải chịu trách nhiệm; nếu bài đó không phải do bạn làm mà vẫn nộp như của mình thì là không trung thực. (Mã 6.A1.2.)"}], "pass": 0.8}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "AI quanh em (Phiếu số 3, phần B)", "intro": "B. AI quanh em. Em chọn hai công cụ AI em đã gặp, ghi ở dòng 1; dòng 2 và dòng 3 em làm với một trong hai công cụ đó. Khi kể ví dụ, em không ghi tên, địa chỉ của người thân và gia đình.", "nav": "AI quanh em", "icon": "🔍", "badge":
