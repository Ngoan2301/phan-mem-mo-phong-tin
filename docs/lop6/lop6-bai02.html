<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}

.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}

.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}

select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}

.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}

.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

trực thuộc trung ương?” Chatbot: “Việt Nam có 63 tỉnh, thành phố trực thuộc trung ương.”", "opts": ["Đúng", "Sai", "Thông tin đã cũ"], "a": 2, "why": "Thông tin đã cũ. Theo Nghị quyết số 202/2025/QH15 ngày 12/6/2025 của Quốc hội, sau khi sắp xếp, cả nước có 34 đơn vị hành chính cấp tỉnh (28 tỉnh và 6 thành phố); chính quyền địa phương ở các tỉnh, thành phố mới chính thức hoạt động từ ngày 01/7/2025. Con số 63 là số tỉnh, thành phố trước khi sắp xếp. Nguồn đối chiếu của câu này là thông tin chính thức mới nhất, không phải sách giáo khoa."}, {"q": "Em có đồng ý để Minh chép ngay cả ba câu trả lời không? Em dựa vào đâu?", "opts": ["Đồng ý, vì chatbot trả lời rất chắc chắn", "Không đồng ý, vì AI có thể sai hoặc dùng thông tin cũ; cần đối chiếu sách giáo khoa, nguồn chính thức hoặc hỏi thầy cô", "Đồng ý, vì ba câu nghe đều có vẻ hợp lí"], "a": 1, "why": "Không đồng ý: AI có thể sai (câu 2) hoặc dùng thông tin đã cũ (câu 3); kể cả câu 1 đúng, Minh chỉ biết là đúng sau khi đã đối chiếu. Em dựa vào đâu để khẳng định? Nêu một nguồn cụ thể: sách giáo khoa môn tương ứng, hỏi thầy cô, cha mẹ, trang thông tin chính thức của cơ quan nhà nước. Chấp nhận “em nhớ đã học trong sách Toán” nếu em nói được sẽ mở sách nào để kiểm tra. Vì sao AI đưa thông tin cũ ở câu 3: dữ liệu AI dùng để trả lời có thể có từ trước khi thông tin thay đổi, nên AI vẫn trả lời con số cũ một cách rất chắc chắn. Có chép câu trả lời vào vở hay không là do Minh quyết định, không phải do AI. Nội dung bài học: cách kiểm tra lại kết quả của AI; cách ra quyết định khi có gợi ý của AI; cách dùng AI để học tốt hơn."}]}, {"type": "flag", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Kiểm tra lại kết quả do AI đưa ra", "intro": "BỘ THẺ A–D (mỗi bạn tra một thẻ). Nhiệm vụ: Em cùng nhóm đọc kĩ câu trả lời của AI trên mỗi thẻ, tìm nguồn để đối chiếu (sách giáo khoa, sách tham khảo, hỏi thầy cô), ghi kết quả so sánh (khớp, sai, thiếu) và đánh dấu quyết định: dùng được, sửa rồi mới dùng hay không dùng. Câu trả lời trên thẻ do GV biên soạn lại để luyện tập. Thẻ D dành cho nhóm làm xong sớm. Không dùng một chatbot khác để kiểm tra. Em gắn cờ những câu cần sửa hoặc không dùng ngay.", "nav": "Kiểm tra lại kết quả", "icon": "🚩", "badge": "Người kiểm chứng", "cols": ["Môn", "Câu hỏi", "Câu trả lời của AI"], "flagWhat": "câu trả lời của AI sai hoặc đã cũ, cần sửa trước khi dùng", "rows": [{"c": ["Toán", "Số nguyên tố nhỏ nhất là số nào?", "Là số 1, vì 1 chỉ chia hết cho chính nó."], "bad": true, "why": "Sai. Sách giáo khoa Toán 6: số nguyên tố là số tự nhiên lớn hơn 1, chỉ có hai ước là 1 và chính nó; số nguyên tố nhỏ nhất là 2. Quyết định: sửa rồi mới dùng (sửa thành 2); chấp nhận “Không dùng” nếu nhóm nêu lí do."}, {"c": ["Khoa học tự nhiên", "Theo thang Celsius, nước đá đang tan và nước đang sôi ở bao nhiêu độ?", "Nước đá đang tan ở 0 °C, nước đang sôi ở 100 °C."], "bad": false, "why": "Khớp với sách giáo khoa: theo thang Celsius, nước đá đang tan ở 0 °C, nước đang sôi ở 100 °C. Quyết định: dùng được."}, {"c": ["Lịch sử và Địa lí", "Trái Đất tự quay một vòng quanh trục hết bao lâu?", "Quay từ tây sang đông, mỗi vòng hết 12 giờ."], "bad": true, "why": "Sai. Sách giáo khoa: Trái Đất tự quay quanh trục theo hướng từ tây sang đông, hết một vòng trong 24 giờ. Quyết định: sửa rồi mới dùng."}, {"c": ["Ngữ văn", "Truyện Thánh Gióng thuộc thể loại nào?", "Là truyện cổ tích kể về người anh hùng đánh giặc Ân."], "bad": true, "why": "Sai. Sách giáo khoa Ngữ văn 6 xếp Thánh Gióng vào thể loại truyền thuyết. Truyền thuyết và truyện cổ tích đều là truyện dân gian, có yếu tố kì ảo; AI có thể gộp hai thể loại. Quyết định: sửa rồi mới dùng."}, {"c": ["Địa lí", "Trái Đất có dạng hình gì?", "Trái Đất có dạng hình cầu."], "bad": false, "why": "Khớp sách giáo khoa Lịch sử và Địa lí 6."}, {"c": ["Toán", "Số 0 có phải là số tự nhiên không?", "Không, số tự nhiên bắt đầu từ 1."], "bad": true, "why": "Sai theo sách giáo khoa Toán 6: tập hợp số tự nhiên gồm 0; 1; 2; 3; …"}, {"c": ["Địa lí", "Nước ta có bao nhiêu tỉnh, thành phố trực thuộc trung ương?", "Việt Nam có 63 tỉnh, thành phố trực thuộc trung ương."], "bad": true, "why": "Thông tin đã cũ: cần xem thông tin chính thức mới nhất (Nghị quyết số 202/2025/QH15: 34 đơn vị hành chính cấp tỉnh)."}], "after": "Câu hỏi cuối phiếu: Nhóm em đã làm những việc gì, theo thứ tự nào? Bốn việc theo thứ tự: đọc kĩ, gạch chân thông tin cần kiểm tra; tìm nguồn đối chiếu; so sánh xem khớp, sai hay thiếu; quyết định dùng, sửa hay bỏ và ghi lại nguồn. Câu hỏi (1): nếu sách giáo khoa và AI nói khác nhau, em tin nguồn nào, vì sao? Tin sách giáo khoa hoặc nguồn chính thức, vì sách được biên soạn theo chương trình của Việt Nam, có người chịu trách nhiệm về nội dung; còn câu trả lời của AI có thể sai. Với thông tin thay đổi theo thời gian (như câu 3 ở HĐ 1), cần xem thông tin chính thức mới nhất. Còn phân vân thì hỏi thầy cô. Vì sao AI có thể trả lời rất chắc chắn mà vẫn sai: AI tạo câu trả lời dựa trên dữ liệu đã học và không bảo đảm câu trả lời luôn đúng. AI có thể trả lời rất chắc chắn cả khi sai, dùng thông tin cũ hoặc cách hiểu của nước khác. Vì vậy AI đưa ra kết quả, người dùng kiểm tra và quyết định cuối cùng. Mức Khá (kiểm chứng): kết luận đúng cả ba thẻ A, B, C, nêu được chỗ sai cụ thể; ở Phiếu học tập số 5 chỉ ra được phần khớp, phần cần sửa. Mức Tốt: sửa chính xác chỗ sai; kiểm tra với hơn một nguồn; giải thích được vì sao AI có thể sai."}, {"type": "order", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Sơ đồ bốn bước kiểm tra", "intro": "Sơ đồ bốn bước để GV vẽ lên bảng ở B4. Em sắp xếp bốn bước kiểm tra lại một câu trả lời của AI theo đúng thứ tự.", "nav": "Bốn bước kiểm tra", "icon": "🔗", "badge": "Thợ kiểm tra", "items": ["(1) Đọc kĩ: gạch chân số liệu, tên gọi, khái niệm", "(2) Tìm nguồn đối chiếu: sách giáo khoa, sách tham khảo, trang thông tin chính thức của cơ quan nhà nước, nhà trường; hỏi thầy cô, cha mẹ", "(3) So sánh: khớp, sai hay còn thiếu?", "(4) Tự quyết định, ghi lại nguồn: dùng, sửa rồi mới dùng hoặc không dùng"], "why": "Đọc kĩ, gạch chân thông tin cần kiểm tra; tìm nguồn đối chiếu; so sánh xem khớp, sai hay thiếu; quyết định dùng, sửa hay bỏ và ghi lại nguồn. Mức Khá về hợp tác và trình bày (Phiếu 1, phần nói lại): phối hợp và phản hồi phù hợp; trình bày rõ quá trình và kết quả. Mức Tốt: phân công hiệu quả, tiếp thu góp ý; trình bày thuyết phục và nói rõ quá trình dùng AI."}, {"type": "decide", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "AI gợi ý, con người quyết định", "intro": "Với mỗi tình huống, hãy trả lời ba câu hỏi của máy quét rồi xem đèn tín hiệu. Sau đó chọn kết luận đúng cho các tình huống ở phần dưới.", "nav": "AI gợi ý, ta quyết định", "icon": "🚦", "badge": "Người cân nhắc", "questions": ["AI có thể chưa biết hết hoàn cảnh thực tế của người dùng (sức khoẻ, thời tiết, đường xá...)?", "Nếu gợi ý sai thì hậu quả có thể ảnh hưởng đến an toàn hoặc sức khoẻ?", "Có thông tin cần kiểm tra thêm hoặc người cần hỏi (bác sĩ, thầy cô, cha mẹ)?"], "verdicts": ["Có thể làm theo, vẫn tự quyết định", "Điều chỉnh gợi ý, kiểm tra thêm", "Không làm theo ngay"], "rules": [{"when": [1, 1, null], "v": 2}, {"when": [null, 1, 1], "v": 2}, {"when": [0, 0, 0], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "Ứng dụng bản đồ gợi ý đường tắt nhanh hơn 4 phút cho em đi xe đạp, nhưng đó là quốc lộ nhiều xe tải, không có làn xe đạp riêng.", "v": 2, "why": "Đường nhanh hơn 4 phút nhưng nguy hiểm. Em nên chọn đường quen thuộc qua khu dân cư có đèn tín hiệu. Nếu quốc lộ có làn xe đạp riêng thì lựa chọn có thể thay đổi."}, {"t": "Chatbot gợi ý lịch ôn Toán: mỗi tối 2 giờ trong 5 ngày; em còn bài các môn khác, tối thứ Tư có lớp bơi và hay buồn ngủ sau 21 giờ.", "v": 1, "why": "Em không bỏ gợi ý nhưng điều chỉnh: chia nhỏ thời gian, tránh tối thứ Tư, hỏi thầy cô hoặc cha mẹ. Người chịu trách nhiệm về lịch học là em."}, {"t": "Đồng hồ thông minh gợi ý: “Hôm nay mới đi 3 000 bước, hãy chạy bộ thêm 30 phút.” Em đang bị cảm, hơi sốt.", "v": 2, "why": "Khi đang ốm, sức khoẻ là ưu tiên: nghỉ ngơi, báo cha mẹ. Nếu đã khỏi thì có thể vận động nhẹ. Ứng dụng không biết em đang bị cảm."}, {"t": "Ứng dụng học tiếng Anh gợi ý bạn Hoa luyện nghe 30 phút mỗi ngày vì phần nghe còn yếu.", "v": [0, 1], "why": "Gợi ý hợp lí; Hoa cùng bố mẹ cân nhắc thời gian biểu, sức khoẻ, bài tập các môn và có thể điều chỉnh số phút."}, {"t": "Phần mềm AI đọc ảnh X-quang gợi ý có dấu hiệu viêm phổi.", "v": 2, "why": "Chỉ là gợi ý. Bác sĩ khám trực tiếp, hỏi triệu chứng, xem thêm xét nghiệm rồi mới quyết định phương án điều trị và chịu trách nhiệm."}]}, {"type": "match", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "AI gợi ý, con người quyết định", "intro": "PHIẾU HỌC TẬP SỐ 2. AI GỢI Ý, CON NGƯỜI QUYẾT ĐỊNH. Nhiệm vụ: Em cùng nhóm đọc các tình huống và hoàn thành bảng. Nhóm số lẻ phân tích kĩ tình huống 1, 2; nhóm số chẵn phân tích kĩ tình huống 3, 4. Cả nhóm tìm thêm một ví dụ và ghi vào dòng cuối theo mẫu “AI gợi ý …, người quyết định là …”. Ghép mỗi tình huống với người quyết định và điều cần cân nhắc thêm.", "nav": "Ai quyết định?", "icon": "🧩", "badge": "Người quyết định", "pairs": [["1. Y tế: Phần mềm AI đọc ảnh chụp X-quang phổi của bệnh nhân và gợi ý có dấu hiệu viêm phổi.", "Bác sĩ quyết định; cần khám trực tiếp, hỏi triệu chứng, xem thêm kết quả xét nghiệm rồi mới quyết định phương án điều trị."], ["2. Giao thông: Ứng dụng bản đồ gợi ý cho bác lái xe một con đường nhanh hơn 10 phút, nhưng bác vừa nghe đài báo đoạn đường đó đang ngập nước.", "Bác lái xe quyết định; cân nhắc đường đang ngập, an toàn của xe và hành khách; có thể chọn đường khác dù chậm hơn."], ["3. Học tập: Ứng dụng học tiếng Anh gợi ý bạn Hoa luyện nghe mỗi ngày 30 phút vì phần nghe của Hoa còn yếu.", "Hoa cùng bố mẹ quyết định; cân nhắc thời gian biểu, sức khoẻ, bài tập các môn khác; có thể điều chỉnh thời gian luyện."], ["4. Nông nghiệp: Ứng dụng dự báo thời tiết có AI báo chiều nay khả năng mưa 80% và gợi ý bác nông dân chưa nên phun thuốc cho lúa.", "Bác nông dân quyết định; quan sát thêm tình trạng sâu bệnh, bầu trời thực tế; có thể hỏi cán bộ khuyến nông."], ["5. Ví dụ của nhóm em: ứng dụng xem video gợi ý video tiếp theo", "em quyết định có xem hay không"], ["5. Ví dụ của nhóm em: bàn phím điện thoại gợi ý từ tiếp theo", "người viết quyết định có chọn hay không"], ["5. Ví dụ của nhóm em: ứng dụng mua sắm gợi ý sản phẩm", "bố mẹ quyết định có mua hay không"]], "why": "Đáp án: 1. Y tế: AI gợi ý có dấu hiệu viêm phổi (gợi ý chẩn đoán). 2. Giao thông: đi con đường nhanh hơn 10 phút. 3. Học tập: luyện nghe 30 phút mỗi ngày. 4. Nông nghiệp: chưa phun thuốc cho lúa chiều nay. Câu hỏi (1): nếu làm theo AI ngay mà không xem xét thì điều gì có thể xảy ra? Ai sẽ chịu hậu quả? Ví dụ: bác sĩ điều trị sai nếu AI nhầm, bệnh nhân chịu hậu quả và bác sĩ chịu trách nhiệm; bác lái xe đi vào đường ngập, xe và hành khách gặp nguy hiểm. Người quyết định chịu trách nhiệm về quyết định của mình, không phải AI. Phần A Phiếu học tập số 4 (ví dụ của em): ví dụ khác bốn tình huống trên Phiếu học tập số 2; nêu đúng AI gợi ý gì, ai là người quyết định và ít nhất một điều người đó cần cân nhắc thêm. Chưa thấy minh chứng nếu chép lại một trong bốn tình huống hoặc ghi người quyết định là AI."}, {"type": "sort", "tag": "HĐ2.3 • Hình thành kiến thức", "title": "Dùng AI thế nào để học tốt hơn?", "intro": "Đọc cách dùng AI của sáu bạn (tên giả định) và xếp vào cột Đúng cách hoặc Chưa đúng cách. Hãy tự hỏi: bạn ấy có tự học được điều gì không? Có kiểm tra lại câu trả lời không? Bảng ghi: Thẻ | Cách dùng AI của bạn | Đánh giá | AI giúp bạn điều gì? Hoặc vì sao chưa đúng? Câu hỏi (1): AI có thể sai, vậy có nên dùng AI để học không? Có thể dùng khi dùng đúng cách: biết rõ mình muốn học gì, tự suy nghĩ và tự làm bài, kiểm tra lại câu trả lời, dùng công cụ phù hợp lứa tuổi và có thầy cô, cha mẹ hướng dẫn. Câu hỏi (2) giúp tách thẻ 2, thẻ 5 (không tự học, không kiểm tra) khỏi thẻ 1, thẻ 3, thẻ 6 (tự làm bài, so với sách, đọc thêm). Gợi ý cho em xong sớm (sửa thẻ 2, thẻ 5 thành cách dùng đúng): Nam tự viết đoạn văn, nhờ AI góp ý cách dùng từ rồi tự sửa và nói rõ với cô phần có sự hỗ trợ của AI. Bình tự làm bài, chỉ hỏi AI giải thích lại bài chưa hiểu rồi tự giải lại và so với sách.", "nav": "Dùng AI để học tốt", "icon": "📚", "badge": "Học cùng AI", "cats": ["Đúng cách", "Chưa đúng cách"], "cards": [{"t": "Lan chưa hiểu phân số bằng nhau, nhờ AI giải thích lại bằng ví dụ chia bánh, rồi tự làm bài tập trong sách giáo khoa.", "g": [0], "why": "Đúng cách. Học hỏi: hiểu lại bài chưa rõ, rồi tự làm bài tập."}, {"t": "Nam nhờ AI viết đoạn văn kể về một kỉ niệm đáng nhớ và chép nguyên văn để nộp cho cô.", "g": [1], "why": "Chưa đúng cách: AI làm thay, Nam không tự học được gì; chép nguyên văn để nộp là không trung thực."}, {"t": "Mai nhờ AI tạo 5 câu hỏi trắc nghiệm về Trái Đất để tự ôn, rồi so đáp án với sách giáo khoa.", "g": [0], "why": "Đúng cách. Rèn luyện kĩ năng tự ôn tập; Mai có kiểm tra lại với sách."}, {"t": "Tuấn luyện phát âm tiếng Anh với ứng dụng có AI nhận xét từng từ; ứng dụng phù hợp lứa tuổi và có cha mẹ hướng dẫn.", "g": [0], "why": "Đúng cách. Rèn luyện kĩ năng phát âm; đúng cách vì ứng dụng phù hợp lứa tuổi và có cha mẹ hướng dẫn."}, {"t": "Bình hỏi AI đáp án tất cả bài tập Toán về nhà rồi chép vào vở mà không đọc lời giải.", "g": [1], "why": "Chưa đúng cách. AI làm thay, Bình không đọc lời giải nên không tự học được gì, không kiểm tra lại; chép đáp án vào vở là không trung thực."}, {"t": "Hà xem phim hoạt hình về chim di cư, hỏi AI vì sao chim bay về phương nam vào mùa đông, rồi tìm đọc thêm sách ở thư viện.", "g": [0], "why": "Đúng cách. Mở rộng hiểu biết: tìm hiểu điều mới, tìm đọc thêm sách."}], "pass": 0.8}, {"type": "story", "tag": "HĐ3 • Luyện tập", "title": "Em ra quyết định", "intro": "Em ra quyết định (ghi ở tiết 2). Tình huống của nhóm em: A, B hoặc C. Hãy nêu lại gợi ý của AI, cân nhắc và chọn cách làm của em. Lựa chọn có thể giống, khác hoặc điều chỉnh gợi ý, miễn có lí do và em chịu trách nhiệm (chấp nhận lựa chọn khác nếu lí ơn 4 phút."}, {"id": "b2a", "label": "Bước 2. Cân nhắc: Làm theo gợi ý có lợi gì?", "hint": "ít nhất một điều", "ph": "Nhanh hơn 4 phút."}, {"id": "b2b", "label": "Có điều gì đáng lo ngại?", "hint": "ít nhất một điều", "ph": "Quốc lộ nhiều xe tải, không có làn xe đạp."}, {"id": "b2c", "label": "Thông tin nào cần kiểm tra thêm? Cần hỏi ai?", "hint": "nêu người cần hỏi", "ph": "Hỏi bố mẹ về đường đi."}, {"id": "b3", "label": "Bước 3. Lựa chọn của em (làm theo, không làm theo hay điều chỉnh) và lí do", "hint": "có lí do", "ph": "Đi đường quen thuộc vì..."}, {"id": "who", "label": "Ai chịu trách nhiệm về lựa chọn này?", "hint": "em hoặc em cùng cha mẹ", "ph": "Em cùng cha mẹ"}], "checks": ["Nêu lại đúng gợi ý của AI; có ít nhất hai điều cân nhắc (lợi, điều đáng lo); lựa chọn có lí do.", "Dòng “Thông tin nào cần kiểm tra thêm? Cần hỏi ai?” có người để hỏi (A hỏi bố mẹ về đường đi; B hỏi thầy cô phần cần ôn; C báo bố mẹ về tình trạng sức khoẻ). Dòng “Ai chịu trách nhiệm về lựa chọn này?”: chấp nhận “em” hoặc “em cùng cha mẹ”.", "Mức Khá (6.A3.1): cân nhắc được cả điều có lợi lẫn điều đáng lo; lựa chọn có lí do phù hợp với hoàn cảnh trong tình huống.", "Mức Tốt (6.A3.1): cân nhắc được lợi, hại và thông tin cần kiểm tra thêm; biết điều chỉnh gợi ý của AI cho phù hợp; chỉ ra được người chịu trách nhiệm."], "sample": "Tình huống B: Gợi ý của AI: học Toán 2 giờ mỗi tối trong 5 ngày. Cân nhắc: tối thứ Tư học bơi; còn bài các môn khác; học quá khuya sẽ mệt và kém hiệu quả. Lựa chọn: điều chỉnh lịch, mỗi tối học Toán khoảng 45 phút đến 1 giờ, tối thứ Tư ôn ngắn, ưu tiên phần còn yếu; có thể nhờ thầy cô góp ý. Ở cả ba tình huống, người chịu trách nhiệm về lựa chọn là bản thân em (cùng cha mẹ khi việc liên quan tới an toàn, sức khoẻ)."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Nhật kí học cùng AI", "intro": "PHIẾU HỌC TẬP SỐ 5. NHẬT KÍ HỌC CÙNG AI. Nhiệm vụ: Em ghi lại một lần dùng công cụ AI để hỗ trợ một nhiệm vụ học tập đơn giản (ở lớp: qua máy của thầy cô; ở nhà, nếu em tự nguyện: cùng cha mẹ hoặc người thân). Em kiểm tra lại câu trả lời rồi ghi theo bảng. Em không ghi họ tên, tên trường, địa chỉ, số điện thoại, ảnh của em vào câu hỏi gửi AI.", "nav": "Nhật kí học cùng AI", "icon": "📓", "badge": "Học trò cẩn trọng", "fields": [{"id": "want", "label": "1. Em muốn học thêm điều gì? Vì sao?", "hint": "một, hai câu", "ph": "Ví dụ: Vì sao có ngày và đêm?"}, {"id": "q", "label": "2. Câu hỏi gửi cho AI (câu hỏi chung của lớp; ghi thêm câu hỏi đề xuất của nhóm em nếu khác)", "hint": "không có thông tin cá nhân", "ph": "Vì sao có ngày và đêm?"}, {"id": "tool", "label": "3. Tên công cụ AI, ngày sử dụng, người hướng dẫn", "hint": "ở lớp: người hướng dẫn là GV", "ph": "Tên công cụ GV ghi trên bảng; ngày sử dụng; người hướng dẫn là GV", "long": false}, {"id": "ans", "label": "4. Ý chính trong câu trả lời của AI", "hint": "viết bằng lời của em", "ph": "AI trả lời rằng..."}, {"id": "src", "label": "5. Em kiểm tra lại bằng nguồn nào? Kết quả ra sao?", "hint": "nêu tên sách, bài hoặc người được hỏi", "ph": "Em đối chiếu với sách Lịch sử và Địa lí 6, thấy khớp..."}, {"id": "dec", "label": "6. Em có dùng câu trả lời không? Dùng phần nào, sửa phần nào?", "hint": "tách phần lấy từ AI, phần em đã sửa, nguồn đã đối chiếu", "ph": "Em dùng phần giải thích, ghi rõ trong vở là có sự hỗ trợ của AI và đã đối chiếu với sách."}, {"id": "level", "label": "Mức dùng AI", "opts": ["Không dùng AI", "GV trình diễn", "Em dùng công cụ", "Nhóm dùng công cụ", "Công cụ tạo một phần sản phẩm"]}, {"id": "learn", "label": "7. Điều em học thêm được (viết bằng lời của em, 2 đến 3 câu)", "hint": "nói lại bằng lời của em", "ph": "Em đã học thêm được..."}, {"id": "par", "label": "Xác nhận của cha mẹ hoặc người thân (chỉ với bản làm ở nhà)", "hint": "không bắt buộc", "ph": "……", "long": false}], "checks": ["Mức đạt 6.A3.2: mục 1 nêu được điều muốn học thêm và lí do; mục 2 ghi câu hỏi chung của lớp và câu hỏi nhóm đề xuất (nếu có), câu hỏi rõ mục đích, không chứa thông tin cá nhân; mục 7 viết bằng lời của HS, không chép lại câu trả lời của AI.", "Mức đạt 6.A1.3: mục 4 ghi được ý chính của câu trả lời; mục 5 có nguồn đối chiếu cụ thể (tên sách, tên bài hoặc người được hỏi) và kết quả so sánh; mục 6 nêu quyết định dùng, sửa hay bỏ phần nào.", "Chưa thấy minh chứng nếu: câu hỏi chứa họ tên, tên trường; mục 5 chỉ ghi “đúng” mà không có nguồn; mục 7 chép nguyên câu trả lời của AI. Dòng mức dùng AI: bản làm ở lớp khoanh “GV trình diễn”; bản làm ở nhà (người lớn thao tác, em đề xuất câu hỏi và cùng kiểm tra) khoanh “GV trình diễn” và ghi thêm “người lớn thao tác” cạnh ô đó.", "Mức Khá (6.A3.2): xếp đúng cả 6 thẻ, ghi đúng loại lợi ích ở mọi thẻ đúng cách; câu hỏi gửi AI có giới hạn phạm vi (ví dụ yêu cầu giải thích ngắn gọn, kèm ví dụ); nói lại điều học thêm kèm một ví dụ của mình. Mức Tốt: giải thích được vì sao thẻ chưa đúng cách và sửa được thành cách dùng đúng; biết đặt thêm câu hỏi để hiểu sâu; nói lại mạch lạc, liên hệ được với bài đã học.", "An toàn, đạo đức, trách nhiệm - mức Khá: câu hỏi ở mục 2 chỉ chứa nội dung bài học, không có chi tiết riêng nào về bản thân, gia đình; mục 3 ghi đủ công cụ, ngày dùng, người hướng dẫn và dòng mức dùng AI khoanh đúng. Mức Tốt: đạt mức Khá; mục 6 tách rõ phần lấy từ câu trả lời của AI, phần em đã sửa và nguồn đã đối chiếu."], "sample": "Ví dụ sản phẩm. 1. Điều muốn học thêm: Vì sao trên Trái Đất có ngày và đêm? Vì em muốn hiểu rõ hơn bài về chuyển động tự quay quanh trục của Trái Đất. 2. Câu hỏi gửi AI: Hãy giải thích ngắn gọn, dễ hiểu cho học sinh lớp 6 vì sao trên Trái Đất có ngày và đêm, kèm một thí nghiệm đơn giản có thể tự làm. 4. Ý chính AI trả lời: Trái Đất có dạng hình cầu nên Mặt Trời chỉ chiếu sáng được một nửa: nửa được chiếu sáng là ngày, nửa kia là đêm; Trái Đất tự quay quanh trục nên mọi nơi lần lượt có ngày và đêm. Thí nghiệm: dùng đèn pin chiếu vào quả bóng trong phòng tối và xoay quả bóng. 5. Kiểm tra lại: Đối chiếu với sách giáo khoa Lịch sử và Địa lí 6, bài về chuyển động tự quay quanh trục của Trái Đất: khớp. 6. Quyết định: Dùng phần giải thích, ghi rõ trong vở là có sự hỗ trợ của AI và đã đối chiếu với sách. 7. Điều học thêm được: Có thể tự làm thí nghiệm với đèn pin và quả bóng: khi xoay quả bóng, chỗ em đánh dấu lần lượt được chiếu sáng rồi chìm vào bóng tối, giống ngày và đêm ở một nơi trên Trái Đất. Ví dụ câu hỏi khác HS có thể chọn: Làm thế nào nhận biết nhanh một số chia hết cho 3? Vì sao lá cây có màu xanh? Khung nói lại: Em muốn biết …… AI trả lời …… Em đã kiểm tra bằng …… Điều em học thêm được là …… Mẫu câu nhận xét: “Em đã chỉ ra đúng câu trả lời của AI ở thẻ C là sai. Em cần ghi rõ tên bài trong sách đã dùng để đối chiếu. Lần sau, em thử tìm thêm một nguồn thứ hai.” — “Em đã nêu được hai điều cần cân nhắc ở tình huống C. Lí do lựa chọn của em còn chung. Em thử nói rõ: vì sao ứng dụng không biết em đang ốm?” — “Câu hỏi em gửi AI rõ mục đích và không có thông tin cá nhân. Mục 7 còn giống câu trả lời của AI. Em thử viết lại bằng một ví dụ của chính em.”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 6 • Môn đảm nhiệm: Khoa học tự nhiên • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
