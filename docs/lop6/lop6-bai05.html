<title>Bài 5. Bên trong một công cụ AI – Lớp 6</title>
<style>
:root{--o:#c0392b;--od:#902a20;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}

.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}

select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}

<script>
const SPEC={"icon": "⚙️", "ainote": "Tình huống giọng nói, hai ca lỗi và ba tính năng đều là giả định, không dùng tên ứng dụng có thật; không ghi âm, không dùng giọng nói thật của HS. Kết quả máy đoán phải được con người kiểm tra; quyết định sửa lỗi thuộc về con người. Không ghi thông tin thật của bản thân, gia đình; với nhận diện khuôn mặt chỉ mô tả cách hoạt động, không vẽ, dán ảnh khuôn mặt thật, không ghi mật khẩu.", "takeaways": ["Dữ liệu là các ví dụ cho máy học (văn bản, hình ảnh…); thuật toán là cách máy học, tìm ra quy luật từ dữ liệu. Máy chỉ xếp được vào những nhóm có trong dữ liệu đã học.", "Trợ lí ảo hoạt động theo bốn bước nối tiếp: bước 1 nhận câu hỏi bằng giọng nói (đầu vào); bước 2 chuyển giọng nói thành văn bản, bước 3 xử lí để hiểu yêu cầu (xử lí); bước 4 tìm và đưa ra câu trả lời (đầu ra). Bước trước sai thì các bước sau dễ sai theo.", "Dữ liệu thiếu hoặc cách xử lí chưa phù hợp có thể làm công cụ AI đưa ra đầu ra sai; con người cần kiểm tra và điều chỉnh.", "AI hoạt động dựa trên dữ liệu và thuật toán do con người thiết kế và kiểm soát; con người kiểm tra để phát hiện và sửa sai sót."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Trợ lí giọng nói nghe nhầm", "nav": "Trợ lí nghe nhầm", "icon": "🎤", "badge": "Người nghe kĩ", "intro": "Tình huống (giả định): Trong một buổi sáng, bạn Minh (chẳng hạn) đứng ở sân trường ồn, đang thử dùng trợ lí giọng nói trên điện thoại. Minh nói: “Bật bài hát Mùa xuân nho nhỏ”, nhưng ứng dụng lại hiện lên “Mua xoài nho nhỏ”. Hãy chọn phương án theo em (như giơ một, hai hoặc ba ngón tay). Câu hỏi được để ngỏ, đến cuối bài ta sẽ quay lại.", "qs": [{"q": "Câu hỏi (1). Theo em, nguyên nhân nào có thể làm ứng dụng nhận nhầm câu nói? (chọn các nguyên nhân em cho là có thể)", "opts": ["Phương án 1 (một ngón tay): Do âm thanh môi trường quá ồn ào", "Phương án 2 (hai ngón tay): Do dữ liệu huấn luyện chưa đủ đa dạng", "Phương án 3 (ba ngón tay): Do thuật toán xử lí không chính xác"], "a": [0, 1], "why": "Nguyên nhân có thể do môi trường âm thanh quá ồn ào hoặc do dữ liệu huấn luyện chưa đủ đa dạng, khiến ứng dụng nhận diện sai. Chấp nhận cả ba phương án nếu nêu được lí do. Chưa kết luận ở HĐ 1; câu hỏi để ngỏ ở góc bảng."}, {"q": "Lớp ở nông thôn: dùng ứng dụng nhận diện giọng nói để trò chuyện với khách du lịch ở một lễ hội của địa phương. Nơi đông người, ồn ào thì nên làm gì để ứng dụng dễ nhận đúng hơn?", "opts": ["Nói to hơn nữa và giữ nguyên chỗ đứng", "Tìm chỗ yên tĩnh hơn", "Tin ngay kết quả đầu tiên"], "a": 1, "why": "Nơi đông người, ồn ào thì ứng dụng dễ nghe nhầm, nên cần chỗ yên tĩnh hơn để ứng dụng dễ nhận đúng hơn. Lớp ở thành phố: HS dùng ứng dụng nhận diện giọng nói để luyện nói tiếng Anh; khi sân chơi có tiếng ồn, ứng dụng thường nhận diện sai. Con người nhận ra ứng dụng nghe nhầm và quyết định có dùng kết quả đó hay không."}]}, {"type": "sort", "tag": "HĐ2.1 • Dữ liệu và thuật toán", "title": "Dạy máy phân loại quả (Phần A bộ thẻ)", "nav": "Dạy máy phân loại quả", "icon": "🍎", "badge": "Người dạy máy", "intro": "Câu chuyện bối cảnh (giả định): Bạn An (chẳng hạn) là một học sinh lớp 6, đang tham gia vào một dự án khoa học nhỏ tại trường. Nhiệm vụ của An là huấn luyện một công cụ AI để phân loại các loại quả trong vườn trường. An được cung cấp một bộ dữ liệu gồm các hình ảnh của táo đỏ, táo xanh và một quy tắc phân loại đơn giản. Tuy nhiên, khi An thử nghiệm với một quả xoài chín vàng, công cụ lại đoán nhầm. An cần tìm hiểu nguyên nhân và cách khắc phục để cải thiện độ chính xác của công cụ.<br><b>Thẻ quy tắc. QUY TẮC CỦA MÁY.</b> Máy so màu của quả mới với màu các ảnh đã học; quả giống màu nhóm nào thì máy xếp vào nhóm đó.<br>Ví dụ mẫu: thẻ 1 xếp vào nhóm Táo đỏ. Xếp sáu thẻ dữ liệu (máy đã học) thành hai nhóm; thẻ 7 là thẻ kiểm thử (máy chưa từng học) nên xếp vào cột thứ ba.", "cats": ["Nhóm táo đỏ", "Nhóm táo xanh", "Thẻ kiểm thử (máy chưa từng học)"], "cards": [{"t": "Thẻ 1. Hình ảnh: Táo đỏ", "g": [0], "why": "Nhóm táo đỏ: thẻ 1, 3, 5. Thẻ 1–6 là thẻ dữ liệu: các ví dụ cho máy học, mỗi thẻ đã ghi sẵn tên quả."}, {"t": "Thẻ 2. Hình ảnh: Táo xanh", "g": [1], "why": "Nhóm táo xanh: thẻ 2, 4, 6."}, {"t": "Thẻ 3. Hình ảnh: Táo đỏ", "g": [0], "why": "Nhóm táo đỏ: thẻ 1, 3, 5."}, {"t": "Thẻ 4. Hình ảnh: Táo xanh", "g": [1], "why": "Nhóm táo xanh: thẻ 2, 4, 6."}, {"t": "Thẻ 5. Hình ảnh: Táo đỏ", "g": [0], "why": "Nhóm táo đỏ: thẻ 1, 3, 5. Máy học theo thẻ quy tắc: so màu quả mới với màu các ảnh đã học (thuật toán)."}, {"t": "Thẻ 6. Hình ảnh: Táo xanh", "g": [1], "why": "Nhóm táo xanh: thẻ 2, 4, 6. Thẻ dữ liệu là các ví dụ cho máy học; thẻ quy tắc cho biết máy học bằng cách nào (thuật toán)."}, {"t": "Thẻ 7. Hình ảnh: Xoài chín vàng", "g": [2], "why": "Thẻ 7 là thẻ kiểm thử, máy chưa từng học. Máy đoán xoài là táo đỏ hoặc táo xanh (chấp nhận cả hai nếu giải thích theo màu: vàng ngả cam thì gần đỏ, vàng ngả xanh thì gần xanh). Máy đoán sai, vì dữ liệu học không có ảnh xoài nên máy chỉ biết hai nhóm táo, buộc phải xếp xoài vào một trong hai nhóm đó. Đây là lỗi ở dữ liệu; cách khắc phục là thêm ảnh xoài vào dữ liệu để máy có thêm nhóm xoài. Con người phát hiện cái sai khi đối chiếu đầu ra với quả thật. Kết luận: Dữ liệu là các ví dụ cho máy học (văn bản, hình ảnh…); thuật toán là cách máy học, tìm ra quy luật từ dữ liệu."}], "pass": 0.7}, {"type": "lab", "tag": "HĐ2.1 • Dữ liệu và thuật toán", "title": "Phòng thí nghiệm: máy chỉ biết những nhóm đã học", "nav": "Phòng thí nghiệm dữ liệu", "icon": "🧪", "badge": "Nhà thí nghiệm dữ liệu", "intro": "Mô hình đơn giản của công cụ phân loại quả ở trên. Kéo thanh trượt để xem dữ liệu thiếu hoặc kém đa dạng ảnh hưởng thế nào, và con người kiểm tra giúp gì. Chỉ là mô hình để suy nghĩ, không phải số liệu thật. Gợi hỏi: “Dữ liệu nào chưa đủ đa dạng trong bộ thẻ?” Trong sáu thẻ máy đã học không có thẻ nào là quả xoài, chỉ có táo.", "sliders": [{"id": "xoai", "n": "Số ảnh xoài trong dữ liệu học", "min": 0, "max": 6, "val": 0, "unit": " ảnh"}, {"id": "div", "n": "Độ đa dạng của dữ liệu (nhiều loại quả, nhiều góc chụp)", "min": 0, "max": 100, "val": 20, "unit": "%"}, {"id": "chk", "n": "Mức con người đối chiếu đầu ra với quả thật", "min": 0, "max": 100, "val": 0, "unit": "%"}], "outputs": [{"n": "Khả năng máy xếp đúng quả xoài", "base": 4, "w": {"xoai": 12, "div": 0.2, "chk": 0}, "c": 0}, {"n": "Khả năng máy xếp xoài vào nhóm táo (sai)", "base": 96, "w": {"xoai": -12, "div": -0.2, "chk": 0}, "c": 2}, {"n": "Khả năng sai sót được con người phát hiện", "base": 15, "w": {"xoai": 0, "div": 0, "chk": 0.8}, "c": 1}], "insights": [{"id": "xoai", "op": "<=", "val": 0, "txt": "Dữ liệu không có ảnh xoài, chỉ có hai nhóm táo đỏ, táo xanh: máy chỉ biết hai nhóm có trong dữ liệu nên buộc phải xếp xoài vào một trong hai nhóm đó. Quả cà chua đỏ máy xếp vào nhóm táo đỏ vì cùng màu đỏ; quả chanh xanh máy xếp vào nhóm táo xanh. Máy sai vì chỉ biết hai nhóm đã học và chỉ dựa vào màu."}, {"id": "xoai", "op": ">=", "val": 3, "txt": "Thêm ảnh xoài vào dữ liệu để máy có thêm nhóm xoài. Nhưng máy vẫn có thể sai và con người vẫn phải kiểm tra."}, {"id": "chk", "op": ">=", "val": 60, "txt": "Con người phát hiện cái sai khi đối chiếu đầu ra với quả thật; kết quả máy đoán phải được con người kiểm tra."}]}, {"type": "order", "tag": "HĐ2.2 • Các bước của trợ lí ảo", "title": "Xếp các bước của trợ lí ảo", "nav": "Các bước trợ lí ảo", "icon": "🧩", "badge": "Người xếp quy trình", "intro": "Phần B. Bốn thẻ quy trình của trợ lí ảo (thẻ A. Chuyển giọng nói thành văn bản; thẻ B. Tìm và đưa ra câu trả lời; thẻ C. Nhận câu hỏi từ người dùng; thẻ D. Xử lí để hiểu yêu cầu). Xếp theo đúng thứ tự (C, A, D, B). Ví dụ mẫu: bước 1 là Nhận câu hỏi từ người dùng.", "items": ["Nhận câu hỏi từ người dùng (thẻ C) – Đầu vào: trợ lí ảo cần có câu nói của người dùng trước tiên.", "Chuyển giọng nói thành văn bản (thẻ A) – Xử lí: máy đổi âm thanh thành chữ để làm tiếp.", "Xử lí để hiểu yêu cầu (thẻ D) – Xử lí: từ chữ, máy hiểu người dùng muốn gì, dựa trên dữ liệu và thuật toán đã học.", "Tìm và đưa ra câu trả lời (thẻ B) – Đầu ra: đây là kết quả người dùng nhận được."], "why": "Nhận câu hỏi từ người dùng là đầu vào; chuyển giọng nói thành văn bản và xử lí để hiểu yêu cầu là xử lí; tìm và đưa ra câu trả lời là đầu ra. Khâu gây sự cố trong tình huống của Minh: bước 2, chuyển giọng nói thành văn bản. Ở sân trường ồn, giọng nói lẫn tiếng ồn nên máy chuyển “Mùa xuân” thành “Mua xoài”; bước 3, bước 4 làm tiếp theo chữ đã sai. Chấp nhận bước 1 nếu nhóm nêu lí do câu nói nhận vào đã lẫn tiếng ồn. Tại sao việc sắp xếp đúng thứ tự các bước lại quan trọng? Bước sau dùng kết quả của bước trước; chưa có chữ thì máy chưa hiểu được yêu cầu. Chữ sai thành “Mua xoài nho nhỏ” thì máy tìm theo yêu cầu sai và đưa ra câu trả lời không đúng ý Minh. Bước 1 là đầu vào; bước 2, bước 3 là xử lí; bước 4 là đầu ra. Con người kiểm tra để phát hiện và sửa sai sót; kiểm tra không làm công cụ luôn đúng."}, {"type": "match", "tag": "HĐ3 • Luyện tập", "title": "Đầu vào, dữ liệu, đầu ra và điểm cần kiểm tra", "nav": "Bảng mô phỏng", "icon": "📋", "badge": "Người kiểm chứng", "intro": "Bảng mô phỏng đầu vào, xử lí, đầu ra. Ghép mỗi tình huống, yêu cầu đầu vào (kèm dữ liệu, quy tắc hệ thống dùng và đầu ra) với điểm cần con người kiểm tra.", "pairs": [["Nhận diện giọng nói (đầu vào: câu nói thu ở sân trường ồn). Dữ liệu đã học: nhiều đoạn ghi âm giọng nói kèm chữ viết tương ứng. Đầu ra: văn bản chuyển đổi từ giọng nói", "Kiểm tra chất lượng âm thanh đầu vào"], ["Phân loại quả. Dữ liệu: hình ảnh quả táo đỏ và táo xanh. Đầu ra: phân loại quả theo màu sắc", "Kiểm tra dữ liệu mẫu đã đủ đa dạng chưa"], ["Gợi ý sách thư viện. Dữ liệu: lịch sử mượn sách của học sinh. Đầu ra: gợi ý sách dựa trên lịch sử mượn", "Kiểm tra quy tắc gợi ý có cứng nhắc không"]], "why": "Khâu nào cũng cần con người kiểm tra: âm thanh đầu vào, độ đa dạng của dữ liệu mẫu, và quy tắc xử lí."}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Lỗi nằm ở đâu?", "nav": "Tìm lỗi AI", "icon": "🔎", "badge": "Thám tử lỗi AI", "intro": "Hai ca thực hành (giả định, không mô tả ứng dụng có thật). Ca 1: Ứng dụng nhận diện cây trong vườn trường nhầm lá lốt thành trầu không do bộ ảnh mẫu thiếu góc chụp. Ca 2: Ứng dụng gợi ý sách thư viện chỉ gợi ý truyện tranh cho mọi học sinh do quy tắc lọc cứng nhắc. Kéo mỗi mảnh bằng chứng, cách khắc phục vào ô chẩn đoán lỗi đúng. Quyết định sửa lỗi thuộc về con người. Câu hỏi mở rộng (dành cho nhóm xong sớm): Nếu có thêm dữ liệu đa dạng hơn, điều gì có thể thay đổi trong kết quả? Máy có thêm ví dụ để so nên có thể nhận đúng hơn ở Ca 1; nhưng máy vẫn có thể sai và con người vẫn phải kiểm tra. Ở Ca 2, thêm dữ liệu mà quy tắc vẫn cứng nhắc thì gợi ý chưa chắc thay đổi.", "cats": ["Lỗi đầu vào", "Lỗi dữ liệu huấn luyện", "Lỗi thuật toán, quy tắc xử lí"], "cards": [{"t": "Ca 1 – bằng chứng: “bộ ảnh mẫu thiếu góc chụp”", "g": [1], "why": "Cụm “bộ ảnh mẫu thiếu góc chụp” nói về ảnh máy đã học, tức dữ liệu: ảnh máy đã học chưa đủ (lá lốt và trầu không nhìn khá giống nhau nên càng cần ảnh từ nhiều góc)."}, {"t": "Ca 1 – cách khắc phục: bổ sung ảnh mẫu lá lốt, lá trầu không chụp từ nhiều góc khác nhau; thử lại với ảnh mới và con người kiểm tra kết quả", "g": [1], "why": "Lỗi dữ liệu huấn luyện thì khắc phục bằng bổ sung dữ liệu. Gợi hỏi: “Máy đã học từ những ảnh nào? Nếu thiếu ảnh chụp từ góc khác thì máy sẽ so với gì?”"}, {"t": "Ca 2 – bằng chứng: “quy tắc lọc cứng nhắc”", "g": [2], "why": "Cụm “quy tắc lọc cứng nhắc” nói về cách máy xử lí."}, {"t": "Ca 2 – bằng chứng: “mọi học sinh” đều chỉ được gợi ý truyện tranh", "g": [2], "why": "Các bạn thường mượn sách khác nhau nên gợi ý giống hệt nhau là dấu hiệu cách xử lí có vấn đề."}, {"t": "Ca 2 – cách khắc phục: điều chỉnh quy tắc gợi ý theo sách từng bạn đã mượn, đa dạng hoá thể loại sách; thủ thư kiểm tra danh sách gợi ý", "g": [2], "why": "Lỗi thuật toán, quy tắc xử lí thì điều chỉnh quy tắc. “Lỗi đầu vào” không phải đáp án của hai ca; chi tiết nào trong ca nói về ảnh, câu hỏi nhận vào lúc dùng? Vẫn nhấn mạnh bằng chứng có trong ca."}, {"t": "Câu nói thu ở sân trường ồn nên máy nghe nhầm (nhận diện giọng nói)", "g": [0], "why": "Lỗi ở đầu vào: kiểm tra chất lượng âm thanh đầu vào. Trường hợp A là lỗi ở dữ liệu (như thẻ xoài, Ca 1); trường hợp B là lỗi ở quy tắc xử lí (như Ca 2)."}], "pass": 0.7}, {"type": "quiz", "tag": "HĐ4 • Vận dụng", "title": "Dữ liệu, thuật toán và các bước của ba công cụ", "nav": "Ba công cụ gợi ý", "icon": "🛠️", "badge": "Người hiểu công cụ AI", "intro": "Ba gợi ý của Phiếu học tập số 3: A. Dùng trợ lí ảo để đặt báo thức; B. Dùng ứng dụng dịch giọng nói để giao tiếp với người nước ngoài; C. Dùng phần mềm nhận diện khuôn mặt để mở khoá điện thoại. Chọn đáp án đúng, rồi quay lại câu hỏi còn để ngỏ ở HĐ 1.", "qs": [{"q": "Sau bài học, em trả lời thế nào cho câu hỏi còn để ngỏ ở HĐ 1 (Minh nói “Mùa xuân” nhưng ứng dụng hiện “Mua xoài”)?", "opts": ["Ứng dụng nhận câu nói lẫn tiếng ồn (bước 1) nên chuyển sai thành chữ (bước 2); các bước sau làm theo chữ sai", "Do máy tự quyết định nghe sai, không có nguyên nhân", "Do bước 4 tìm câu trả lời bị hỏng, còn bước 1 và 2 luôn đúng"], "a": 0, "why": "Ứng dụng nhận câu nói lẫn tiếng ồn (bước 1) nên chuyển sai thành chữ (bước 2); các bước sau làm theo chữ sai. Dữ liệu học thiếu giọng nói ở nơi ồn hoặc cách xử lí chưa phù hợp cũng có thể là nguyên nhân. Con người nhận ra ứng dụng nghe nhầm và nói lại ở nơi yên tĩnh hơn."}, {"q": "A. Trợ lí ảo đặt báo thức: dữ liệu, thuật toán và các bước là gì?", "opts": ["Dữ liệu: rất nhiều đoạn ghi âm giọng nói kèm chữ viết tương ứng, các câu yêu cầu mẫu như “đặt báo thức”. Thuật toán: cách máy học từ các đoạn ghi âm đó để nhận ra tiếng nói thành chữ và hiểu yêu cầu", "Dữ liệu: rất nhiều cặp câu tiếng Việt và câu đã dịch sang tiếng nước ngoài. Thuật toán: cách đặt giờ", "Dữ liệu: điện thoại. Thuật toán: kết quả đặt báo thức"], "a": 0, "why": "Các bước: nhận câu nói “Đặt báo thức 6 giờ sáng” (đầu vào). Chuyển giọng nói thành văn bản, hiểu đây là yêu cầu đặt báo thức lúc 6 giờ (xử lí). Đặt báo thức và báo lại giờ đã đặt (đầu ra). Câu 4 (ví dụ): khâu nghe giọng nói; nguy cơ đặt sai giờ; xem lại giờ hiện trên màn hình."}, {"q": "B. Dịch giọng nói: dữ liệu, thuật toán và các bước là gì?", "opts": ["Dữ liệu: rất nhiều ảnh khuôn mặt. Thuật toán: cách so khuôn mặt", "Dữ liệu: rất nhiều cặp câu tiếng Việt và câu đã dịch sang tiếng nước ngoài, kèm giọng nói. Thuật toán: cách máy học từ rất nhiều cặp câu đã dịch để tìm ra cách dịch câu mới", "Dữ liệu: mạng Internet. Thuật toán: kết quả dịch"], "a": 1, "why": "Các bước: nhận câu nói tiếng Việt (đầu vào); chuyển thành chữ, dịch sang tiếng nước ngoài (xử lí); hiện hoặc đọc câu đã dịch (đầu ra). Câu 4 (ví dụ): khâu dịch; nguy cơ sai nghĩa; so với từ điển, nhờ thầy cô kiểm tra."}, {"q": "C. Nhận diện khuôn mặt để mở khoá: dữ liệu, thuật toán và các bước là gì?", "opts": ["Dữ liệu: rất nhiều đoạn ghi âm. Thuật toán: cách nghe giọng nói", "Dữ liệu: điện thoại. Thuật toán: mở khoá được hay không", "Dữ liệu: rất nhiều ảnh khuôn mặt để máy học cách nhận ra khuôn mặt; ảnh khuôn mặt chủ máy đã đăng kí. Thuật toán: cách máy học từ các ảnh đó để tìm ra đặc điểm riêng của mỗi khuôn mặt"], "a": 2, "why": "Các bước: camera chụp khuôn mặt người cầm máy (đầu vào); so đặc điểm với khuôn mặt đã đăng kí (xử lí); mở khoá hoặc không mở (đầu ra). Câu 4 (ví dụ): khâu so khuôn mặt; nguy cơ người có khuôn mặt giống mở được máy; người lớn cài thêm cách khoá khác. Chỉ mô tả cách công cụ hoạt động, không vẽ, không dán ảnh khuôn mặt thật, không ghi mật khẩu."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu số 3: Bên trong một công cụ AI em chọn", "nav": "Phiếu 3 – Công cụ AI", "icon": "📝", "badge": "Người mô tả công cụ AI", "intro": "Lưu ý an toàn: Em dùng tình huống giả lập hoặc công cụ quen thuộc, không ghi họ tên thật của người khác, số điện thoại hay thông tin riêng tư của bản thân và gia đình. Nếu chọn gợi ý C, em chỉ mô tả cách công cụ hoạt động, không vẽ, không dán ảnh khuôn mặt thật, không ghi mật khẩu. Em tự làm phiếu này. Em viết các bước hoạt động chính theo đúng thứ tự; nếu công cụ có nhiều bước hơn, em viết thêm.", "fields": [{"id": "c1", "label": "1. Em đánh dấu một gợi ý hoặc tự ghi một công cụ AI quen thuộc", "opts": ["Gợi ý A: Dùng trợ lí ảo để đặt báo thức", "Gợi ý B: Dùng ứng dụng dịch giọng nói để giao tiếp với người nước ngoài", "Gợi ý C: Dùng phần mềm nhận diện khuôn mặt để mở khoá điện thoại", "Em tự chọn"]}, {"id": "d", "label": "2. Dữ liệu (Công cụ này đã học từ những dữ liệu nào?)", "ph": "Ví dụ: các mẫu câu tiếng Anh và tiếng Việt."}, {"id": "t", "label": "2. Thuật toán (Máy dùng cách nào để học từ các dữ liệu đó?)", "ph": "Ví dụ: cách máy học từ rất nhiều cặp câu đã dịch để tìm ra cách dịch câu mới."}, {"id": "b1", "label": "3. Bước nhận đầu vào", "ph": "Ví dụ: ứng dụng nghe câu em nói bằng tiếng Việt."}, {"id": "b2", "label": "3. Bước xử lí", "ph": "Ví dụ: chuyển giọng nói thành chữ, dịch câu sang tiếng Anh."}, {"id": "b3", "label": "3. Bước đưa ra đầu ra", "ph": "Ví dụ: hiện chữ và đọc câu tiếng Anh đã dịch."}], "checks": ["Dữ liệu là các ví dụ cụ thể mà công cụ đó học (đúng loại với công cụ: âm thanh, chữ, ảnh); thuật toán là cách máy học từ chính dữ liệu đó", "Các bước đúng thứ tự từ nhận đầu vào, xử lí đến đưa ra đầu ra và đúng với công cụ em chọn", "Chưa thấy minh chứng: ghi dữ liệu là “điện thoại”, “mạng Internet”; ghi thuật toán là kết quả của công cụ; các bước đảo thứ tự hoặc chỉ có một bước", "Mức Khá: dữ liệu nêu được cả ví dụ lẫn kết quả đúng đi kèm (ví dụ đoạn ghi âm kèm chữ tương ứng); tách được bước xử lí thành các việc công cụ làm. Mức Tốt: giải thích được mối liên hệ máy học từ dữ liệu nào thì làm tốt việc gì; các bước đúng thứ tự, chỉ ra bước nào dùng điều máy đã học; tự liên hệ được với một tình huống mới"], "sample": "Bài làm mẫu (tên giả định): Họ và tên: Nguyễn Văn A. Lớp: 6A. Nhóm: 1. Câu 1: ☒ Gợi ý B: Dùng ứng dụng dịch giọng nói để giao tiếp với người nước ngoài. Câu 2: Dữ liệu: các mẫu câu tiếng Anh và tiếng Việt. Thuật toán: cách máy học từ rất nhiều cặp câu đã dịch để tìm ra cách dịch câu mới. Câu 3: Bước nhận đầu vào: ứng dụng nghe câu em nói bằng tiếng Việt. Bước xử lí: chuyển giọng nói thành chữ, dịch câu sang tiếng Anh. Bước đưa ra đầu ra: hiện chữ và đọc câu tiếng Anh đã dịch."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu số 3, câu 4 và bảng kiểm đồng đẳng", "nav": "Câu 4 và góp ý bạn", "icon": "🤝", "badge": "Người kiểm chứng và góp ý", "intro": "Câu 4: Nếu con người không kiểm tra khâu …… thì có nguy cơ …… Sau đó đổi phiếu với bạn cùng bàn và đánh dấu bảng kiểm đồng đẳng. Câu 4 mong đợi một khâu cụ thể trong các bước đã viết, một nguy cơ gắn với khâu đó và một cách kiểm tra em làm được (xem lại, đối chiếu, hỏi người lớn).", "fields": [{"id": "k", "label": "4. Nếu con người không kiểm tra khâu … thì có nguy cơ …", "ph": "Ví dụ: Nếu con người không kiểm tra khâu dịch thuật thì có nguy cơ sai nghĩa."}, {"id": "c", "label": "Cách em kiểm tra hoặc xử lí an toàn", "ph": "Ví dụ: so sánh với từ điển và nhờ thầy cô kiểm tra."}, {"id": "p1", "label": "Bảng kiểm đồng đẳng 1. Dữ liệu, thuật toán ghi rõ ràng; các bước đúng thứ tự từ đầu vào đến đầu ra", "opts": ["Đã rõ", "Cần bổ sung"]}, {"id": "p2", "label": "Bảng kiểm đồng đẳng 2. Rủi ro và cách kiểm tra ghi rõ ràng", "opts": ["Đã rõ", "Cần bổ sung"]}, {"id": "g", "label": "Một góp ý cụ thể giúp bài bạn rõ hơn", "ph": "Ví dụ: Em thử tách bước xử lí thành hai việc máy làm."}], "checks": ["Chỉ ra một khâu cụ thể trong các bước và nguy cơ gắn với khâu đó (mức Khá)", "Nêu được cách kiểm tra lại đầu ra làm được ngay và giải thích vì sao lỗi ở khâu đó làm sai các bước sau (mức Tốt)", "Không ghi thông tin cá nhân thật; nêu được một rủi ro về dữ liệu của công cụ đã chọn (ví dụ ảnh khuôn mặt, giọng nói); mức Tốt: giải thích cách dùng công cụ có trách nhiệm (ví dụ không chia sẻ ảnh khuôn mặt, không nói thông tin riêng với trợ lí ảo)", "Hợp tác: phối hợp hoàn thành phiếu theo vai; góp ý cho bạn cụ thể; tự sửa bài bằng bút khác màu sau góp ý (Khá); trình bày rõ lí do, dẫn bằng chứng từ thẻ hoặc từ ca, tiếp thu góp ý và giải thích được điều đã sửa (Tốt)"], "sample": "Nếu con người không kiểm tra khâu dịch thuật thì có nguy cơ sai nghĩa. Cách kiểm tra: so sánh với từ điển và nhờ thầy cô kiểm tra. Mẫu nhận xét: “Em chỉ ra được khâu nghe giọng nói dễ sai và cách xem lại giờ báo thức. Em có thể giải thích thêm vì sao nghe sai thì các bước sau cũng sai.” Hay: “Em viết đúng ba bước từ nghe câu nói tới đọc câu đã dịch. Bước xử lí còn chung. Em thử tách bước xử lí thành hai việc máy làm.” Hay: “Em đã nêu được dữ liệu của ứng dụng dịch là các câu tiếng Việt, tiếng Anh. Phần thuật toán em ghi còn giống kết quả. Em thử trả lời: máy làm cách nào để học từ các câu đó?”"}], "title": "Bài 5. Bên trong một công cụ AI – Lớp 6", "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 6 • Môn đảm nhiệm: Tin học • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

function mp(m){switch(m.type){case'story':return m.chars.length*5;case'sort':return m.cards.length*3;case'quiz':return m.qs.length*4;case'order':return 10;case'decide':return m.cases.length*5;case'flag':return 10;case'lab':return 6;case'match':return m.pairs.length*2;case'build':return 6;default:return 0}}
function award(i,p){ST.got[i]+=p;ST.pts+=p;$('#score').textContent='⭐ '+ST.pts}
let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{beep(660);setTimeout(()=>beep(880),90)},bad=()=>beep(180,.25,'sawtooth');
