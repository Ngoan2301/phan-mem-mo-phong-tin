<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 7. Phát hiện ý tưởng dự án AI từ thực tiễn – Lớp 7</title>
<style>
:root{--o:#e67e22;--od:#ac5e19;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "💡", "title": "Bài 7. Phát hiện ý tưởng dự án AI từ thực tiễn – Lớp 7", "ainote": "Con người quyết định có dùng AI cho một việc hay không, dữ liệu nào được thu và kiểm tra kết quả. Tối thiểu hoá dữ liệu: không đưa ảnh khuôn mặt, giọng nói, địa chỉ, số điện thoại, thông tin sức khoẻ, kết quả học tập của HS vào ý tưởng.", "takeaways": ["Ý tưởng AI có giá trị xuất phát từ vấn đề cụ thể, không từ mong muốn dùng AI cho “hiện đại”.", "Không dùng AI khi đã có cách đơn giản hơn (bảng nội quy, đồng hồ hẹn giờ); chỉ dùng AI khi việc cần máy nhận ra, phân loại hoặc hiểu điều gì.", "Ý tưởng AI rõ ràng nêu đủ bốn khâu: vấn đề, dữ liệu, việc AI hỗ trợ, người kiểm tra và quyết định.", "Mô tả vấn đề cần có đối tượng, bối cảnh, biểu hiện và phạm vi.", "Tối thiểu hoá dữ liệu: chỉ dùng dữ liệu thật sự cần thiết, không thu dữ liệu nhận ra từng người nếu không cần."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Việc nào đáng dùng AI hơn?", "icon": "🥁", "nav": "Việc nào cần AI?", "badge": "Người chọn việc", "intro": "Phương án 1: dùng AI đánh trống trường đúng 7 giờ sáng. Phương án 2: dùng AI nhận diện rác nhựa và giấy qua ảnh tại thùng rác sân trường. Câu hỏi then chốt: (1) Theo em, phương án nào đáng dùng AI hơn? Vì sao? (Đầu giờ chỉ ghi nhận lựa chọn và lí do, chưa chốt đúng, sai; chọn “ba ngón” – chưa quyết định – cũng được chấp nhận.)", "qs": [{"q": "Theo em, phương án nào đáng dùng AI hơn?", "opts": ["Phương án 1: dùng AI đánh trống trường đúng 7 giờ sáng", "Phương án 2: dùng AI nhận diện rác nhựa và giấy qua ảnh tại thùng rác sân trường", "Ba ngón: chưa quyết định, cả hai đều tự động"], "a": 1, "why": "Phương án 2 đáng dùng AI hơn vì cần nhận ra loại rác qua ảnh, việc người làm dễ nhầm, tốn thời gian; con người vẫn kiểm tra lại khi AI gợi ý sai. Phương án 1 chỉ cần chuông hẹn giờ theo thời gian biểu, không cần AI. Ở đầu giờ, GV chỉ ghi nhận lựa chọn và lí do, chưa chốt đúng, sai."}, {"q": "Bạn chọn Phương án 1 vì “AI làm đúng giờ, không quên”. Nhận xét nào đúng?", "opts": ["Đúng, AI giỏi nhất ở việc làm đúng giờ", "Làm đúng giờ là việc của chuông hẹn giờ, không cần AI", "Chỉ đúng khi trường có nhiều lớp"], "a": 1, "why": "GV ghi lại lí do này và giữ để đối chiếu cuối bài: làm đúng giờ là việc của chuông hẹn giờ, không cần AI."}, {"q": "Bạn chọn Phương án 2 vì “phải nhìn ảnh mới biết rác loại gì”. Lí do này thế nào?", "opts": ["Đúng hướng: việc này cần máy nhận ra loại rác qua ảnh", "Sai vì máy không nhìn được ảnh", "Không liên quan tới AI"], "a": 0, "why": "Lí do đúng hướng, GV ghi lại."}, {"q": "Bạn chọn ba ngón vì “cả hai đều tự động”. Đây là nhầm lẫn nào?", "opts": ["“Cứ tự động là AI”", "“AI luôn đúng”", "“AI chỉ dùng cho máy tính bảng”"], "a": 0, "why": "GV ghi lại; đây là nhầm lẫn “cứ tự động là AI”, sẽ được giải đáp cuối bài."}]}, {"type": "match", "tag": "HĐ1 • Mở đầu (giải đáp)", "title": "Bảng so sánh ba tình huống", "icon": "⚖️", "nav": "Bảng so sánh", "badge": "Người so sánh tình huống", "intro": "Bảng so sánh GV dùng khi giải đáp. Ghép từng tình huống với: dữ liệu/quy tắc hệ thống dùng, có cần AI không, và điểm con người cần kiểm tra.", "pairs": [["Đánh trống trường đúng giờ", "Dữ liệu, quy tắc: thời gian biểu của trường. Đầu ra: chuông, trống kêu vào giờ quy định. Có cần AI không? Không: chuông hẹn giờ theo thời gian biểu là đủ. Con người kiểm tra: kiểm tra đồng hồ của hệ thống chạy đúng giờ, thời gian biểu đã cập nhật."], ["Nhận diện rác nhựa và giấy", "Dữ liệu, quy tắc: ảnh chụp rác ở thùng rác. Đầu ra: gợi ý vật đó là rác nhựa hay giấy. Có cần AI không? Có: phải nhận ra loại rác qua ảnh, mỗi vật một hình dạng, màu sắc khác nhau. Con người kiểm tra: bảo đảm camera hoạt động, hình ảnh rõ nét; kiểm tra lại khi AI gợi ý sai."], ["Chatbot thư viện (Thẻ 1)", "Dữ liệu, quy tắc: danh mục sách, tình trạng sách, nội quy thư viện. Đầu ra: câu trả lời cho câu hỏi của HS. Có cần AI không? Có: câu hỏi của HS viết theo nhiều cách, cần hiểu câu hỏi. Con người kiểm tra: cán bộ thư viện cập nhật danh mục, kiểm tra câu trả lời."]], "why": "Bảng so sánh dùng khi giải đáp ở B4 HĐ 4 hoặc khi nhóm cần ví dụ ở HĐ 2. Đánh trống đúng giờ chỉ làm theo thời gian biểu nên không cần AI; hai tình huống còn lại cần máy nhận ra hoặc hiểu."}, {"type": "decide", "tag": "HĐ2 • Hình thành kiến thức", "title": "Thẻ nào đáng dùng AI? (Phiếu 1, nhiệm vụ A)", "icon": "🚦", "nav": "Ba câu hỏi lọc", "badge": "Người lọc ý tưởng", "intro": "Hồ sơ bối cảnh (giả định): Bạn An (tên giả định) là học sinh lớp 7 ở một trường trung học cơ sở. An thấy ở thư viện trường, nhiều bạn hỏi đi hỏi lại cán bộ thư viện những câu giống nhau: sách nào còn, sách nào đã được mượn hết, hạn trả là ngày nào, thư viện mở cửa giờ nào. Vào giờ ra chơi, cán bộ thư viện không trả lời kịp. An nghĩ có thể dùng AI để trả lời những câu hỏi đó. An cũng thấy cây trong vườn trường có lúc bị héo vì không được tưới kịp thời nên đề xuất dùng AI để nhận ra cây cần tưới nước. Cuối cùng, An quan tâm tới việc giữ sức khoẻ cho các bạn trong trường và nghĩ tới việc dùng AI phát hiện học sinh không đeo khẩu trang trong khuôn viên trường. Hãy dùng ba câu hỏi lọc để xét từng thẻ; mỗi quyết định chọn hay không chọn đều cần lí do. Đáp án là tham khảo, chấp nhận quyết định khác nếu có lí do hợp lí.", "questions": ["(1) Việc này có cần máy nhận ra, phân loại hoặc hiểu điều gì (hình ảnh, lời nói, câu chữ) không? Hay việc này chỉ làm theo giờ, theo quy tắc cố định?", "(2) Có cách nào đơn giản hơn, không cần AI, mà vẫn giải quyết được không?", "(3) Có phải thu dữ liệu nhận ra từng người (khuôn mặt, giọng nói, tên) không?"], "verdicts": ["Chọn (đáng dùng AI)", "Cần sửa lại trước khi chọn", "Không chọn"], "rules": [{"when": [0, null, null], "v": 2}, {"when": [null, 1, null], "v": 2}, {"when": [null, null, 1], "v": 1}, {"when": [null, null, null], "v": 0}], "cases": [{"t": "Thẻ 1 – Thư viện: Dùng chatbot AI trả lời câu hỏi của học sinh về sách còn hay đã được mượn hết, hạn trả sách, nội quy thư viện.", "v": 0, "why": "Câu hỏi của HS viết theo nhiều cách, cần AI hiểu câu hỏi (1); bảng nội quy không trả lời được câu “sách này còn không” (2); không cần tên, ảnh của bạn hỏi (3). (Ví dụ mẫu trên phiếu: cán bộ thư viện kiểm tra câu trả lời.)"}, {"t": "Thẻ 2 – Tưới cây: AI nhận diện cây xanh cần tưới nước dựa trên ảnh chụp lá cây (lá héo).", "v": 0, "why": "AI nhận ra lá héo qua ảnh chụp (1); không cần dữ liệu nhận ra người (3). Nhóm nêu “đồng hồ hẹn giờ tưới cũng được” (Thẻ 4) thì GV hỏi lại: tưới theo giờ có biết cây nào thật sự thiếu nước không?"}, {"t": "Thẻ 3 – Khẩu trang: AI phát hiện học sinh không đeo khẩu trang trong khuôn viên trường.", "v": 2, "why": "Ở dạng đang mô tả, camera quay HS hằng ngày là thu hình ảnh của HS, rủi ro như Thẻ 6 (3); việc nhắc đeo khẩu trang làm được bằng Thẻ 5 (2). Nhóm chọn Thẻ 3 phải nêu được cách sửa để không lưu ảnh, không nhận ra từng người."}, {"t": "Thẻ 4 – Đồng hồ hẹn giờ: Đặt giờ tưới nước tự động cho cây xanh.", "v": 2, "why": "Không cần AI: tưới theo giờ cố định là làm theo quy tắc, đồng hồ hẹn giờ làm được (1), (2)."}, {"t": "Thẻ 5 – Bảng nội quy: Dán bảng nhắc nhở học sinh đeo khẩu trang.", "v": 2, "why": "Không cần AI: bảng nội quy là cách đơn giản, không cần máy nhận ra gì (1), (2)."}, {"t": "Thẻ 6 – Thu thập dữ liệu nhạy cảm: AI yêu cầu ảnh khuôn mặt để nhận diện học sinh.", "v": 2, "why": "Thẻ không nêu nhận diện HS để giải quyết vấn đề gì, nên không xét được (1), (2); ảnh khuôn mặt là dữ liệu nhận ra từng người, thu khi không có mục đích rõ thì rủi ro lớn (3)."}]}, {"type": "match", "tag": "HĐ2 • Hình thành kiến thức", "title": "Sơ đồ bốn khâu (Phiếu 1, nhiệm vụ B)", "icon": "🧩", "nav": "Bốn khâu", "badge": "Người vẽ sơ đồ", "intro": "Ví dụ mẫu Thẻ 1: Vấn đề – Học sinh hỏi đi hỏi lại những câu giống nhau, cán bộ thư viện không trả lời kịp vào giờ ra chơi. Dữ liệu – Cần dùng: danh mục sách, tình trạng sách còn hay đã được mượn, nội quy thư viện; không cần thu: tên, ảnh của bạn hỏi. AI hỗ trợ – Hiểu câu hỏi và trả lời các câu hỏi thường gặp. Con người kiểm tra và quyết định – Cán bộ thư viện cập nhật danh mục, kiểm tra câu trả lời, trả lời câu hỏi chatbot không trả lời được. Bây giờ ghép bốn khâu cho Thẻ 2 (nhóm chọn một thẻ đã chọn, khác Thẻ 1).", "pairs": [["Vấn đề", "Cây trong vườn trường có lúc bị héo vì không được tưới kịp"], ["Dữ liệu", "Cần dùng ảnh chụp lá cây trong vườn trường; không cần thu ảnh người, tên HS trực nhật"], ["AI hỗ trợ", "Nhận ra cây có lá héo và gợi ý cây có thể thiếu nước"], ["Con người kiểm tra và quyết định", "HS trực nhật, GV phụ trách vườn trường xem lại cây AI gợi ý rồi quyết định tưới; lá héo do sâu bệnh hoặc do tưới quá nhiều thì không phải tưới thêm"]], "why": "Câu hỏi (1): với thẻ hai nhóm quyết định khác nhau, lí do của bên nào dựa vào câu hỏi lọc rõ hơn? Lí do rõ là lí do bám một câu hỏi lọc: việc cần máy nhận ra, hiểu điều gì; có cách đơn giản hơn; có phải thu dữ liệu nhận ra từng người. Lí do chung chung (“AI hiện đại hơn”) chưa rõ. Câu hỏi (2): dữ liệu nào trong sơ đồ của nhóm bạn có thể bỏ mà AI vẫn làm được việc? Ví dụ: chatbot thư viện chỉ cần danh mục sách, tình trạng sách, nội quy, bỏ được tên, ảnh của HS hỏi; AI tưới cây chỉ cần ảnh lá cây, bỏ được ảnh người. Câu gợi ý cho nhóm lúng túng: “Dữ liệu nào là cần thiết để AI hoạt động?” – chỉ những dữ liệu phục vụ đúng việc AI làm (danh mục sách cho chatbot, ảnh lá cây cho AI tưới cây). “Làm thế nào để dữ liệu của AI không vi phạm quyền riêng tư?” – không thu dữ liệu nhận ra từng người khi ý tưởng không cần; không lưu ảnh có khuôn mặt HS."}, {"type": "quiz", "tag": "HĐ2 • Hình thành kiến thức", "title": "Hỗ trợ nhóm gặp khó và sửa Thẻ 3", "icon": "🛠️", "nav": "Sửa Thẻ 3", "badge": "Người gỡ rối", "intro": "Gợi ý khi nhóm gặp khó: so sánh Thẻ 1 với Thẻ 4. Thẻ 4 làm theo giờ cố định, Thẻ 1 phải hiểu câu hỏi viết theo nhiều cách. Nhóm xong sớm: sửa Thẻ 3.", "qs": [{"q": "Câu hỏi lọc (2) – có cách nào đơn giản hơn, không cần AI – áp vào các thẻ thế nào?", "opts": ["Thẻ 4, Thẻ 5 có cách đơn giản (đồng hồ hẹn giờ, bảng nội quy) nên không cần AI", "Thẻ 1, Thẻ 2 có cách đơn giản nên không cần AI", "Mọi thẻ đều không có cách đơn giản hơn"], "a": 0, "why": "Với Thẻ 4, Thẻ 5: có (đồng hồ hẹn giờ, bảng nội quy), nên không cần AI. Với Thẻ 3: bảng nội quy hoặc lời nhắc của GV làm được, lại không phải quay hình HS. Với Thẻ 1, Thẻ 2: cách đơn giản (bảng nội quy, tưới theo giờ) không trả lời được câu hỏi về từng cuốn sách, không biết cây nào thật sự thiếu nước."}, {"q": "Nếu vẫn muốn dùng camera ở Thẻ 3, cách sửa nào hợp lí? (chọn nhiều đáp án)", "opts": ["Chỉ đếm số người chưa đeo khẩu trang để nhắc chung qua loa", "Không lưu ảnh, không nhận ra ai", "Nhà trường thông báo trước, HS và cha mẹ HS được biết và đồng ý", "Lưu ảnh khuôn mặt để nhận diện từng bạn"], "a": [0, 1, 2], "why": "Gợi ý cho nhóm xong sớm khi sửa Thẻ 3: dùng bảng nhắc và lời nhắc chung ở cổng trường. Nếu vẫn dùng camera thì chỉ đếm số người chưa đeo khẩu trang để nhắc chung qua loa, không lưu ảnh, không nhận ra ai; nhà trường thông báo trước, HS và cha mẹ HS được biết và đồng ý. Camera vẫn thu hình ảnh HS nên cách không dùng camera (Thẻ 5) vẫn được ưu tiên."}, {"q": "Nhóm nêu “đồng hồ hẹn giờ tưới cũng được” (Thẻ 4) cho vấn đề cây héo. GV nên hỏi lại gì?", "opts": ["Tưới theo giờ có biết cây nào thật sự thiếu nước không?", "Đồng hồ hẹn giờ giá bao nhiêu?", "Có nên bỏ vườn trường không?"], "a": 0, "why": "Tưới theo giờ cố định không biết cây nào thật sự thiếu nước; nhận ra lá héo qua ảnh là việc cần AI (Thẻ 2)."}]}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Soi hai ca: đánh dấu chỗ hở", "icon": "🔦", "nav": "Soi chỗ hở", "badge": "Người soi ý tưởng", "intro": "Ca thực hành 1: Chatbot thư viện. Bạn Minh muốn làm một chatbot AI cho thư viện trường. Bản phác thảo của Minh ghi: “Vấn đề: thư viện đông, các bạn hỏi nhiều. Ý tưởng: chatbot AI trả lời mọi câu hỏi của mọi người.” Minh chưa xác định rõ chatbot lấy thông tin về sách, hạn trả sách từ đâu và ai cập nhật thông tin đó. Ca thực hành 2: Nhận diện khẩu trang. Bạn Lan đề xuất dùng AI để phát hiện học sinh không đeo khẩu trang. Tuy nhiên, Lan chưa cân nhắc việc thu thập dữ liệu khuôn mặt có thể vi phạm quyền riêng tư. Lan cần tìm cách khắc phục để bảo đảm an toàn dữ liệu. Kéo mỗi bằng chứng vào đúng chỗ hở. Câu hỏi then chốt: (1) Chi tiết nào trong ca cho thấy bản phác thảo còn thiếu hoặc chưa phù hợp?", "cats": ["Chưa rõ vấn đề, phạm vi, người dùng", "Chưa rõ AI dùng dữ liệu gì, lấy từ đâu", "Thu dữ liệu không cần thiết, ảnh hưởng quyền riêng tư"], "cards": [{"t": "Ca 1: “Thư viện đông, các bạn hỏi nhiều”", "g": [0], "why": "Chỗ hở: chưa rõ vấn đề, phạm vi, người dùng. Cách khắc phục: chatbot dành cho HS của trường; chỉ trả lời câu hỏi về sách còn hay hết, hạn trả, giờ mở cửa, nội quy; câu hỏi khác thì đề nghị hỏi cán bộ thư viện."}, {"t": "Ca 1: “Chatbot AI trả lời mọi câu hỏi của mọi người”", "g": [0], "why": "Chỗ hở: chưa rõ vấn đề, phạm vi, người dùng. Cách khắc phục: chatbot dành cho HS của trường; chỉ trả lời câu hỏi về sách còn hay hết, hạn trả, giờ mở cửa, nội quy; câu hỏi khác thì đề nghị hỏi cán bộ thư viện."}, {"t": "Ca 1: “Minh chưa xác định rõ chatbot lấy thông tin về sách, hạn trả sách từ đâu và ai cập nhật”", "g": [1], "why": "Cách khắc phục: dữ liệu là danh mục sách, tình trạng sách và nội quy do cán bộ thư viện cập nhật; cán bộ thư viện kiểm tra câu trả lời."}, {"t": "Ca 2: “Lan chưa cân nhắc việc thu thập dữ liệu khuôn mặt”", "g": [2], "why": "Cách khắc phục: bỏ việc nhận diện từng người; dùng bảng nhắc chung (Thẻ 5); nếu vẫn cần thì chỉ đếm số người chưa đeo, không lưu ảnh, không nhận ra ai. Nhà trường thông báo trước, HS và cha mẹ HS được biết và đồng ý."}, {"t": "Ca 2: Lan đề xuất dùng AI phát hiện HS không đeo khẩu trang nhưng chưa nói AI phát hiện xong thì ai làm gì", "g": [0], "why": "Nhóm đánh dấu thêm ở ca 2 dòng “Chưa rõ vấn đề, phạm vi, người dùng” (ví dụ chưa nói AI phát hiện xong thì ai làm gì) thì được chấp nhận nếu có bằng chứng từ ca."}], "pass": 0.7}, {"type": "flag", "tag": "HĐ3 • Luyện tập", "title": "Soi bản phác thảo của Minh và Lan", "icon": "🕵️", "nav": "Gắn cờ phác thảo", "badge": "Người sửa ý tưởng", "intro": "Đọc từng câu trong hai ca và gắn cờ những chi tiết cho thấy bản phác thảo còn hở. Bằng chứng phải lấy đúng câu chữ trong ca; nêu chung chung (“ý tưởng chưa hay”) chưa được tính.", "cols": ["Ca", "Chi tiết trong ca"], "flagWhat": "chỗ hở của bản phác thảo", "rows": [{"c": ["Ca 1 – Minh", "Bạn Minh muốn làm một chatbot AI cho thư viện trường."], "bad": false}, {"c": ["Ca 1 – Minh", "Vấn đề: “thư viện đông, các bạn hỏi nhiều”."], "bad": true, "why": "Chưa rõ vấn đề, phạm vi, người dùng. Chatbot dành cho HS của trường; chỉ trả lời câu hỏi về sách còn hay hết, hạn trả, giờ mở cửa, nội quy; câu hỏi khác thì đề nghị hỏi cán bộ thư viện."}, {"c": ["Ca 1 – Minh", "Ý tưởng: “chatbot AI trả lời mọi câu hỏi của mọi người”."], "bad": true, "why": "“Mọi câu hỏi của mọi người” là quá rộng: chưa rõ phạm vi, người dùng."}, {"c": ["Ca 1 – Minh", "Minh chưa xác định rõ chatbot lấy thông tin về sách, hạn trả sách từ đâu và ai cập nhật thông tin đó."], "bad": true, "why": "Chưa rõ AI dùng dữ liệu gì, lấy từ đâu. Dữ liệu là danh mục sách, tình trạng sách và nội quy do cán bộ thư viện cập nhật; cán bộ thư viện kiểm tra câu trả lời."}, {"c": ["Ca 2 – Lan", "Bạn Lan đề xuất dùng AI để phát hiện học sinh không đeo khẩu trang."], "bad": false}, {"c": ["Ca 2 – Lan", "Lan chưa cân nhắc việc thu thập dữ liệu khuôn mặt có thể vi phạm quyền riêng tư."], "bad": true, "why": "Thu dữ liệu không cần thiết, ảnh hưởng quyền riêng tư. Bỏ việc nhận diện từng người; dùng bảng nhắc chung (Thẻ 5); nếu vẫn cần thì chỉ đếm số người chưa đeo, không lưu ảnh, không nhận ra ai. Nhà trường thông báo trước, HS và cha mẹ HS được biết và đồng ý."}, {"c": ["Ca 2 – Lan", "Lan cần tìm cách khắc phục để bảo đảm an toàn dữ liệu."], "bad": false}], "after": "Câu hỏi thêm (nhóm xong sớm): Nếu dữ liệu không đa dạng, điều gì có thể xảy ra? AI có thể đưa ra kết quả sai hoặc không chính xác với những trường hợp không giống dữ liệu đã dùng để huấn luyện, ví dụ ảnh chụp khi trời tối, khẩu trang có màu lạ. Đây là câu hỏi gợi mở, không chấm. Kiến thức chốt: một ý tưởng AI rõ ràng nêu được vấn đề và phạm vi cụ thể, người dùng, dữ liệu cần dùng; chỉ dùng dữ liệu thật sự cần thiết."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu học tập số 2: Ý tưởng AI của em", "icon": "🌱", "nav": "Ý tưởng của em", "badge": "Nhà sáng tạo ý tưởng AI", "intro": "Lưu ý an toàn: Em không ghi họ tên thật của người khác, số điện thoại hay thông tin riêng tư của bản thân và gia đình. Làm xong mục 1, 2, 3 thì đổi phiếu với bạn cùng bàn để góp ý, nhận lại phiếu và tự sửa bằng bút khác màu.", "fields": [{"id": "vd", "label": "1. Chọn một vấn đề gần gũi (đánh dấu một gợi ý hoặc tự ghi một vấn đề ở trường, ở nơi em sống)", "opts": ["Gợi ý A: Dùng AI trả lời câu hỏi thường gặp của học sinh ở thư viện trường.", "Gợi ý B: Dùng AI để nhận diện cây xanh cần tưới nước trong vườn trường.", "Gợi ý C: Dùng AI nhận dạng hình ảnh hỗ trợ phân loại rác tái chế ở điểm thu gom của thôn, khu phố.", "Tự chọn"]}, {"id": "dt", "label": "2. Đối tượng (ai gặp vấn đề, ai dùng) và bối cảnh (ở đâu, khi nào)", "hint": "Đối tượng, bối cảnh", "ph": "Đối tượng: học sinh hay mượn sách; cán bộ thư viện. Bối cảnh: thư viện trường, nhất là giờ ra chơi, khi nhiều bạn cùng đến."}, {"id": "bh", "label": "2. Biểu hiện (vấn đề thể hiện ra sao) và phạm vi (ý tưởng làm tới đâu, không làm việc gì)", "hint": "Biểu hiện, phạm vi", "ph": "Biểu hiện: nhiều bạn hỏi đi hỏi lại cùng một câu; cán bộ thư viện không trả lời kịp. Phạm vi: chỉ trả lời câu hỏi về sách, hạn trả, giờ mở cửa, nội quy; không cho mượn sách, không trả lời câu hỏi bài tập."}, {"id": "ai", "label": "2. AI hỗ trợ việc gì, dùng dữ liệu nào", "hint": "Nêu cả dữ liệu không cần thu", "ph": "Chatbot đọc câu hỏi và trả lời dựa trên danh mục sách, tình trạng sách, nội quy do cán bộ thư viện cập nhật; không cần tên, ảnh của bạn hỏi."}, {"id": "kt", "label": "3. Điểm con người cần kiểm tra: Nếu con người không kiểm tra khâu … thì có nguy cơ …", "hint": "Khâu, nguy cơ", "ph": "Nếu không kiểm tra khâu cập nhật danh mục sách thì có nguy cơ chatbot báo sách còn trong khi sách đã được mượn hết."}, {"id": "cx", "label": "3. Cách em kiểm tra hoặc xử lí an toàn", "hint": "Ai kiểm tra, bao lâu một lần", "ph": "Cán bộ thư viện cập nhật danh mục mỗi ngày và thỉnh thoảng hỏi thử chatbot vài câu để xem trả lời có đúng không."}, {"id": "gy", "label": "Góp ý của bạn cùng bàn (1. đã rõ/cần bổ sung đối tượng, bối cảnh, biểu hiện, phạm vi, việc AI làm; 2. khâu con người kiểm tra và cách kiểm tra hợp lí)", "hint": "Một góp ý cụ thể giúp bài bạn rõ hơn", "ph": "Bạn ghi thêm các bạn hỏi chatbot ở đâu, ví dụ máy tính đặt ở thư viện. / Bạn nói rõ khi chatbot trả lời sai thì ai sửa."}], "checks": ["Mô tả đủ đối tượng, bối cảnh, biểu hiện, phạm vi của cùng một vấn đề cụ thể; việc AI làm khớp với biểu hiện của vấn đề (mức Khá).", "Giải thích được vì sao vấn đề này cần AI hơn một cách đơn giản; phạm vi nêu rõ cả việc ý tưởng không làm (mức Tốt).", "Chỉ ra khâu con người kiểm tra gắn với một sai sót cụ thể AI có thể mắc; nêu điều khiến AI dễ sai (thông tin chưa cập nhật, ảnh mờ), ai quyết định cuối cùng.", "Không ghi thông tin cá nhân thật; dữ liệu nêu ở mục 2 chỉ gồm dữ liệu cần cho việc AI làm; chủ động nêu dữ liệu không cần thu (tên, ảnh khuôn mặt)."], "sample": "Bài làm minh hoạ. 1. Gợi ý A: Dùng AI trả lời câu hỏi thường gặp của học sinh ở thư viện trường. 2. Đối tượng: học sinh hay mượn sách; cán bộ thư viện. Bối cảnh: thư viện trường, nhất là giờ ra chơi, khi nhiều bạn cùng đến. Biểu hiện: nhiều bạn hỏi đi hỏi lại cùng một câu (sách còn không, hạn trả ngày nào); cán bộ thư viện không trả lời kịp, có bạn phải về lớp mà chưa mượn được sách. Phạm vi: chỉ trả lời câu hỏi về sách của thư viện trường, hạn trả, giờ mở cửa, nội quy; không làm thay việc cho mượn sách, không trả lời câu hỏi bài tập. AI hỗ trợ: chatbot đọc câu hỏi và trả lời dựa trên danh mục sách, tình trạng sách, nội quy do cán bộ thư viện cập nhật; không cần tên, ảnh của bạn hỏi. 3. Nếu con người không kiểm tra khâu cập nhật danh mục sách thì có nguy cơ chatbot báo sách còn trong khi sách đã được mượn hết. Cách em kiểm tra hoặc xử lí an toàn: cán bộ thư viện cập nhật danh mục mỗi ngày và thỉnh thoảng hỏi thử chatbot vài câu để xem trả lời có đúng không."}, {"type": "match", "tag": "HĐ4 • Vận dụng (tự đánh giá)", "title": "Mức Tốt của từng tiêu chí", "icon": "🏅", "nav": "Mức Khá, Tốt", "badge": "Người tự đánh giá", "intro": "Câu hỏi (1): Sau bài học, em trả lời lại câu hỏi ở HĐ 1 thế nào? Phương án 2 đáng dùng AI hơn vì cần nhận ra loại rác qua ảnh, việc người làm dễ nhầm, tốn thời gian; con người vẫn kiểm tra lại khi AI gợi ý sai. Phương án 1 chỉ cần chuông hẹn giờ theo thời gian biểu, không cần AI. HS đã chọn Phương án 1 hoặc ba ngón ở đầu giờ nêu được lí do đổi lựa chọn là dấu hiệu tiến bộ. Ghép tiêu chí với mô tả mức Tốt.", "pairs": [["Đáp ứng nhiệm vụ, yêu cầu cần đạt (7.D1.1; Phiếu 2, mục 1, 2). Khá: mô tả đủ đối tượng, bối cảnh, biểu hiện, phạm vi của cùng một vấn đề cụ thể; việc AI làm khớp với biểu hiện của vấn đề.", "Tốt: ở dòng “AI hỗ trợ việc gì”, giải thích được vì sao vấn đề này cần AI hơn một cách đơn giản; phạm vi nêu rõ cả việc ý tưởng không làm."], ["Kiểm chứng và tư duy phản biện (Phiếu 2, mục 3). Khá: chỉ ra khâu con người kiểm tra gắn với một sai sót cụ thể AI có thể mắc trong ý tưởng của mình; cách kiểm tra làm được.", "Tốt: nêu được điều gì khiến AI dễ sai (thông tin chưa cập nhật, ảnh mờ) và cách kiểm tra thường xuyên; nêu rõ ai quyết định cuối cùng; dùng góp ý của bạn để sửa bài có lí do."], ["An toàn, đạo đức, trách nhiệm (Phiếu 2). Khá: không ghi thông tin cá nhân thật; dữ liệu nêu ở mục 2 chỉ gồm dữ liệu cần cho việc AI làm.", "Tốt: chủ động nêu dữ liệu không cần thu (tên, ảnh khuôn mặt) và cách tránh thu; ý tưởng tôn trọng quyền riêng tư của người liên quan."], ["Hợp tác và trình bày (Phiếu 1, nhóm; phiếu quan sát nhóm PLC.7). Khá: làm đúng vai được gi
