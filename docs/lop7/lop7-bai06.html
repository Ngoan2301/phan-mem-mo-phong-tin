<style>
:root{--o:#16a085;--od:#107863;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}

body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}

.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}

.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}

ắng, đục; máy được dạy bằng ảnh và nhận ra tốt những gì giống ảnh đã học. Nếu chưa bao giờ được xem ảnh chai sữa, máy dễ không nhận ra, vì trong những gì máy đã học không có chai nhựa nào giống chai sữa; máy cần được xem thêm ảnh chai nhựa màu trắng, chai nhựa màu đục. Lúc này chưa có bằng chứng, dự đoán mới là giả thuyết; kết luận sẽ thay đổi khi cả lớp tự dạy máy ở HĐ 2.1 và thấy máy sai với loại dữ liệu nào. Vấn đề học tập: máy học qua những bước nào, theo những cách nào, dữ liệu có thể gây ra vấn đề gì. Hai ngộ nhận cần xử lí: “máy tự biết”, “máy được lập trình sẵn mọi thứ”."}, {"type": "sort", "tag": "HĐ2.1 • Gán nhãn dữ liệu", "title": "Phiếu số 1, phần B: gán nhãn dữ liệu huấn luyện", "nav": "Gán nhãn dữ liệu", "icon": "🏷️", "badge": "Người gán nhãn", "intro": "Phiếu học tập số 1: nhóm có bốn vai: người gán nhãn, “máy”, người kiểm tra, thư kí. Đây là dữ liệu huấn luyện (ảnh đội đã chụp ở căng tin). Người gán nhãn đọc cột Tên đồ vật và ghi nhãn N (Nhựa), K (Kim loại), G (Giấy); “máy” chỉ nhìn ba cột đặc điểm (Độ trong, Bề mặt, Hình dạng) và cột Nhãn. Dòng 13, 14 là dữ liệu bổ sung ở bước điều chỉnh. Kéo từng dòng vào đúng nhãn. Người gán nhãn được ghi nhận khi gán đúng và giải thích được một nhãn.", "cats": ["N (Nhựa)", "K (Kim loại)", "G (Giấy)"], "cards": [{"t": "Dòng 1: Chai nước suối 500 ml | Trong suốt | Không ánh kim | Dáng chai", "g": [0], "why": "Dòng 1: Chai nước suối 500 ml (Trong suốt, Không ánh kim, Dáng chai). Nhãn đúng: N (Nhựa)."}, {"t": "Dòng 2: Vỏ lon nước ngọt | Màu đục | Ánh kim | Hình trụ", "g": [1], "why": "Dòng 2: Vỏ lon nước ngọt (Màu đục, Ánh kim, Hình trụ). Nhãn đúng: K (Kim loại)."}, {"t": "Dòng 3: Tờ báo cũ | Màu đục | Không ánh kim | Phẳng hoặc hộp", "g": [2], "why": "Dòng 3: Tờ báo cũ (Màu đục, Không ánh kim, Phẳng hoặc hộp). Nhãn đúng: G (Giấy)."}, {"t": "Dòng 4: Chai nước suối 1,5 lít | Trong suốt | Không ánh kim | Dáng chai", "g": [0], "why": "Dòng 4: Chai nước suối 1,5 lít (Trong suốt, Không ánh kim, Dáng chai). Nhãn đúng: N (Nhựa)."}, {"t": "Dòng 5: Lon cà phê sữa | Màu đục | Ánh kim | Hình trụ", "g": [1], "why": "Dòng 5: Lon cà phê sữa (Màu đục, Ánh kim, Hình trụ). Nhãn đúng: K (Kim loại)."}, {"t": "Dòng 6: Hộp bánh bằng bìa | Màu đục | Không ánh kim | Phẳng hoặc hộp", "g": [2], "why": "Dòng 6: Hộp bánh bằng bìa (Màu đục, Không ánh kim, Phẳng hoặc hộp). Nhãn đúng: G (Giấy)."}, {"t": "Dòng 7: Chai trà xanh | Trong suốt | Không ánh kim | Dáng chai", "g": [0], "why": "Dòng 7: Chai trà xanh (Trong suốt, Không ánh kim, Dáng chai). Nhãn đúng: N (Nhựa)."}, {"t": "Dòng 8: Lon nước ép trái cây | Màu đục | Ánh kim | Hình trụ", "g": [1], "why": "Dòng 8: Lon nước ép trái cây (Màu đục, Ánh kim, Hình trụ). Nhãn đúng: K (Kim loại)."}, {"t": "Dòng 9: Vở cũ đã dùng hết | Màu đục | Không ánh kim | Phẳng hoặc hộp", "g": [2], "why": "Dòng 9: Vở cũ đã dùng hết (Màu đục, Không ánh kim, Phẳng hoặc hộp). Nhãn đúng: G (Giấy)."}, {"t": "Dòng 10: Chai nước lọc 350 ml | Trong suốt | Không ánh kim | Dáng chai", "g": [0], "why": "Dòng 10: Chai nước lọc 350 ml (Trong suốt, Không ánh kim, Dáng chai). Nhãn đúng: N (Nhựa)."}, {"t": "Dòng 11: Lon sữa đặc | Màu đục | Ánh kim | Hình trụ", "g": [1], "why": "Dòng 11: Lon sữa đặc (Màu đục, Ánh kim, Hình trụ). Nhãn đúng: K (Kim loại)."}, {"t": "Dòng 12: Túi giấy đựng bánh mì | Màu đục | Không ánh kim | Phẳng hoặc hộp", "g": [2], "why": "Dòng 12: Túi giấy đựng bánh mì (Màu đục, Không ánh kim, Phẳng hoặc hộp). Nhãn đúng: G (Giấy)."}, {"t": "Dòng 13: Chai sữa chua uống bằng nhựa màu trắng | Màu đục | Không ánh kim | Dáng chai", "g": [0], "why": "Dòng 13: Chai sữa chua uống bằng nhựa màu trắng (Màu đục, Không ánh kim, Dáng chai). Nhãn đúng: N (Nhựa) (dữ liệu bổ sung, thêm ở bước điều chỉnh)."}, {"t": "Dòng 14: Chai dầu gội bằng nhựa màu | Màu đục | Không ánh kim | Dáng chai", "g": [0], "why": "Dòng 14: Chai dầu gội bằng nhựa màu (Màu đục, Không ánh kim, Dáng chai). Nhãn đúng: N (Nhựa) (dữ liệu bổ sung, thêm ở bước điều chỉnh)."}], "pass": 0.8}, {"type": "lab", "tag": "HĐ2.1 • Dạy máy", "title": "Phòng thí nghiệm: dữ liệu và quy tắc của máy", "nav": "Phòng thí nghiệm dữ liệu", "icon": "⚗️", "badge": "Kĩ sư dữ liệu", "intro": "Máy lập quy tắc “Nếu thấy … thì là …” từ chính dữ liệu đã học. Vòng 1 (12 dòng): Nhựa là “Trong suốt”; Kim loại là “Ánh kim”; Giấy là “Phẳng hoặc hộp”. Vòng 2 (thêm dòng 13, 14 là chai nhựa màu đục): Nhựa là “Dáng chai”. Thử thay đổi dữ liệu và quan sát kết quả trên T1–T8 và thẻ bất ngờ B1 (số liệu mô phỏng theo phụ lục).", "sliders": [{"id": "opaque", "n": "Số dòng chai nhựa màu đục thêm vào dữ liệu học (dòng 13, 14)", "min": 0, "max": 2, "val": 0, "unit": " dòng"}, {"id": "wrong", "n": "Số dòng chai nhựa bị gán nhầm nhãn (ví dụ dòng 7 bị gán là Giấy)", "min": 0, "max": 3, "val": 0, "unit": " dòng"}, {"id": "newtest", "n": "Số câu kiểm tra là dữ liệu mới (chưa dùng khi học), trong 8 câu", "min": 0, "max": 8, "val": 0, "unit": " câu"}], "outputs": [{"n": "Tỉ lệ đúng trên T1–T8", "base": 75, "w": {"opaque": 12.5, "wrong": -45}, "c": 0}, {"n": "Đúng với thẻ bất ngờ B1 (cốc nhựa trong đựng nước mía)", "base": 100, "w": {"opaque": -50, "wrong": -30}, "c": 1}, {"n": "Khả năng phát hiện lỗi của máy khi kiểm tra", "base": 10, "w": {"newtest": 11}, "c": 2}], "insights": [{"id": "opaque", "op": "<=", "val": 0, "txt": "Mọi chai nhựa trong dữ liệu đều trong suốt nên máy học rằng “nhựa là trong suốt”: T4 (chai sữa tươi nhựa màu trắng) và T7 (chai nước rửa tay nhựa màu xanh) bị “Không nhận ra”, đúng 6 trong 8. Đây cũng là lí do thùng rác ở HĐ 1 không nhận ra chai sữa."}, {"id": "opaque", "op": ">=", "val": 2, "txt": "Sau khi thêm dòng 13, 14, quy tắc Nhựa đổi thành “Dáng chai”, đúng 8 trong 8. Nhưng thẻ bất ngờ B1 (cốc nhựa trong, hình trụ) lại bị “Không nhận ra”: sửa được lỗi này có thể sinh lỗi khác; muốn máy nhận được cốc nhựa thì phải bổ sung dữ liệu cốc nhựa."}, {"id": "wrong", "op": ">=", "val": 1, "txt": "Gán nhầm nhãn thì máy học sai theo đúng nhãn đó. Ví dụ dòng 7 bị gán là Giấy: không còn đặc điểm chung nào cho Nhựa lẫn Giấy, máy chỉ lập được quy tắc Kim loại là “Ánh kim”, nên mọi đồ nhựa, đồ giấy đều bị “Không nhận ra”. Con người phải kiểm tra nhãn."}, {"id": "newtest", "op": ">=", "val": 6, "txt": "Chỉ dữ liệu mới, chưa dùng khi học, cho biết máy dùng được hay chưa. Bằng chứng máy học tốt là số câu đúng trên dữ liệu mới (6 trong 8, rồi 8 trong 8); kết luận có thể thay đổi khi máy gặp loại đồ vật chưa có trong dữ liệu."}, {"id": "newtest", "op": "<=", "val": 0, "txt": "Máy lập quy tắc từ chính 12 dòng đó nên kiểm tra lại bằng chúng thì kết quả thường có vẻ tốt; giống kiểm tra HS bằng đúng bài đã chữa, khó phát hiện lỗi."}]}, {"type": "flag", "tag": "HĐ2.1 • Kiểm tra trên dữ liệu mới", "title": "Kết quả kiểm tra T1–T8 và thẻ bất ngờ", "nav": "Kết quả kiểm tra", "icon": "🧪", "badge": "Người kiểm tra", "intro": "Người kiểm tra đọc từng dòng; “máy” trả lời N, K, G hoặc “Không nhận ra”. Trước khi chạy, nhóm dự đoán máy đúng bao nhiêu trong tám câu. Gắn cờ những chỗ máy trả lời sai. Người kiểm tra được ghi nhận khi đọc đúng T1–T8 và phát hiện máy trả lời khác đáp án; thư kí khi ghi dự đoán trước khi chạy và ghi trung thực kết quả.", "cols": ["Mã", "Đặc điểm (Độ trong, Bề mặt, Hình dạng) và tên thật", "Đáp án", "Máy trả lời vòng 1", "Máy trả lời vòng 2"], "flagWhat": "máy trả lời sai", "rows": [{"c": ["T1", "Chai nước suối bị bóp bẹp (Trong suốt, Không ánh kim, Dáng chai)", "N", "N (đúng)", "N (đúng)"], "bad": false}, {"c": ["T2", "Lon nước ngọt bị móp (Màu đục, Ánh kim, Hình trụ)", "K", "K (đúng)", "K (đúng)"], "bad": false}, {"c": ["T3", "Hộp giày bằng bìa (Màu đục, Không ánh kim, Phẳng hoặc hộp)", "G", "G (đúng)", "G (đúng)"], "bad": false}, {"c": ["T4", "Chai sữa tươi bằng nhựa màu trắng (Màu đục, Không ánh kim, Dáng chai)", "N", "Không nhận ra (sai)", "N (đúng)"], "bad": true, "why": "T4 và T7 đều là chai nhựa màu đục, dáng chai, không ánh kim; trong 12 dữ liệu đã học không có chai nhựa màu đục nào. Máy dễ nhận sai loại dữ liệu chưa có trong dữ liệu đã học; đây cũng là lí do thùng rác ở HĐ 1 không nhận ra chai sữa."}, {"c": ["T5", "Lon sữa bột bằng sắt tây (Màu đục, Ánh kim, Hình trụ)", "K", "K (đúng)", "K (đúng)"], "bad": false}, {"c": ["T6", "Tờ lịch cũ (Màu đục, Không ánh kim, Phẳng hoặc hộp)", "G", "G (đúng)", "G (đúng)"], "bad": false}, {"c": ["T7", "Chai nước rửa tay bằng nhựa màu xanh (Màu đục, Không ánh kim, Dáng chai)", "N", "Không nhận ra (sai)", "N (đúng)"], "bad": true, "why": "Vì mọi chai nhựa trong dữ liệu đều trong suốt nên máy học rằng “nhựa là trong suốt”."}, {"c": ["T8", "Phong bì thư cũ (Màu đục, Không ánh kim, Phẳng hoặc hộp)", "G", "G (đúng)", "G (đúng)"], "bad": false}, {"c": ["Số đúng", "", "", "6 trong 8", "8 trong 8"], "bad": false}, {"c": ["B1", "Cốc nhựa trong đựng nước mía (Trong suốt, Không ánh kim, Hình trụ)", "N", "N (đúng)", "Không nhận ra (sai)"], "bad": true, "why": "B1 ở vòng 2 bị “Không nhận ra”, trong khi vòng 1 lại đúng, vì quy tắc Nhựa đã đổi từ “Trong suốt” thành “Dáng chai”. Sửa được lỗi này có thể sinh lỗi khác; điều chỉnh xong vẫn phải kiểm tra bằng dữ liệu mới."}, {"c": ["B2", "Lon nước ngọt loại khác (Màu đục, Ánh kim, Hình trụ)", "K", "K (đúng)", "K (đúng)"], "bad": false}], "after": "Quy tắc vòng 1: Nhựa là “Trong suốt”; Kim loại là “Ánh kim”; Giấy là “Phẳng hoặc hộp”. Với Giấy, cột Độ trong và cột Bề mặt đều trùng với nhãn khác (Màu đục có ở Kim loại, Không ánh kim có ở Nhựa) nên máy phải chọn cột Hình dạng. Quy tắc vòng 2 (sau khi thêm dòng 13, 14, đều Màu đục, Không ánh kim, Dáng chai, nhãn N): Nhựa là “Dáng chai”; Kim loại là “Ánh kim”; Giấy là “Phẳng hoặc hộp”. Vì sao phải kiểm tra bằng T1–T8 mà không kiểm tra lại bằng 12 dòng đã học? Máy lập quy tắc từ chính 12 dòng đó nên kiểm tra lại bằng chúng thì kết quả thường có vẻ tốt; chỉ dữ liệu mới, chưa dùng khi học, cho biết máy dùng được hay chưa. Thẻ bất ngờ B1 cho em biết: sửa được lỗi này có thể sinh lỗi khác; điều chỉnh xong vẫn phải kiểm tra bằng dữ liệu mới; muốn máy nhận được cốc nhựa thì phải bổ sung dữ liệu cốc nhựa. Sơ đồ quy trình: thu thập dữ liệu, gán nhãn, cho máy học, kiểm tra trên dữ liệu mới, điều chỉnh; mũi tên quay lại từ bước 5 về bước 3, vì sau khi thêm dữ liệu máy phải học lại rồi kiểm tra lại (chấp nhận mũi tên về bước 1 hoặc bước 2 nếu HS giải thích được là thu thêm dữ liệu, gán nhãn dữ liệu mới). Nếu gán nhầm nhãn thì máy học sai theo đúng nhãn đó. Gặp chai thuỷ tinh (Trong suốt, Không ánh kim, Dáng chai), máy vòng 1 và vòng 2 đều trả lời Nhựa: máy chỉ biết ba nhãn đã học; con người phải nhận ra và bỏ chai thuỷ tinh đúng chỗ; muốn máy nhận được thì phải thêm nhãn và dữ liệu thuỷ tinh. “Máy” được ghi nhận khi làm đúng thuật toán, nói được vì sao chọn đặc điểm đó."}, {"type": "story", "tag": "HĐ2.2 • Robot tìm ổ sạc", "title": "Trò chơi Robot tìm ổ sạc", "nav": "Robot tìm ổ sạc", "icon": "🤖", "badge": "Người huấn luyện robot", "intro": "Robot xuất phát ở ô A1, cần tìm về ổ sạc nhưng không có bản đồ. Mỗi lượt đi tối đa tám bước. Môi trường báo điểm sau mỗi bước: ô thường −1 (tốn pin); ô có bậc cầu thang −10 (robot rơi, hết lượt); ổ sạc +10 (hết lượt). Chơi ba lượt; robot chỉ được xem Sổ kinh nghiệm. Bản đồ ẩn do GV (đóng vai Môi trường) giữ: ổ sạc ở D4, cầu thang ở C3 và B2. Đường ngắn nhất đi qua năm ô thường rồi tới ổ sạc, tổng điểm +5; có bốn đường như vậy.", "app": "🤖 Robot và Sổ kinh nghiệm (mô phỏng)", "hello": "Robot ở ô A1. Chưa có bản đồ. Điểm: 0.", "meters": [{"n": "Điểm của robot", "b": 30, "c": 0}, {"n": "Robot biết tránh ô nguy hiểm", "b": 10, "c": 1}, {"n": "Hành vi đúng ý con người", "b": 40, "c": 2}], "chars": [{"n": "Robot ở lượt 1", "color": "#4aa3ff", "task": "Có ai chỉ đường cho robot không? Robot học bằng gì?", "opts": [{"t": "Chờ con người chỉ đường rồi mới đi", "chat": null, "ch": [-10, -5, -10], "v": "bad", "fb": "Không ai chỉ đường; robot học từ điểm thưởng, điểm phạt."}, {"t": "Thử đi, ghi điểm vào Sổ kinh nghiệm, đánh dấu ✕ ô nguy hiểm", "chat": null, "ch": [10, 25, 25], "v": "good", "fb": "Không ai chỉ đường; robot học từ điểm thưởng, điểm phạt. Lượt 1 robot thường đi vào ô cầu thang hoặc đi lòng vòng (điểm âm)."}]}, {"n": "Robot ở lượt 2 và lượt 3", "color": "#3fbf8f", "task": "Điểm thay đổi thế nào qua ba lượt? Lượt sau robot dựa vào đâu để chọn đường?", "opts": [{"t": "Đi ngẫu nhiên lại từ đầu như lượt 1", "chat": null, "ch": [-10, -15, -10], "v": "bad", "fb": "Robot đã có Sổ kinh nghiệm nên không cần đi ngẫu nhiên."}, {"t": "Dựa vào Sổ kinh nghiệm: tránh các ô ✕ đã ghi", "chat": null, "ch": [30, 35, 25], "v": "good", "fb": "Lượt 2, lượt 3 robot tránh các ô ✕ đã ghi, điểm tăng dần, tốt nhất là +5. Dựa vào Sổ kinh nghiệm, tức điểm thưởng, điểm phạt đã ghi ở các lượt trước. Nếu sau ba lượt robot chưa tới đích, robot vẫn đã học được cách tránh ô nguy hiểm."}]}, {"n": "Đổi luật: mỗi bước đi được +1 điểm, không giới hạn số bước", "color": "#ff9f43", "task": "Ai đặt ra luật thưởng, phạt điểm? Với luật mới, robot có thể học cách đi thế nào?", "opts": [{"t": "Robot sẽ luôn đi thẳng về ổ sạc", "chat": null, "ch": [-5, 0, -25], "v": "bad", "fb": "Luật do con người đặt. Đi càng nhiều bước càng được nhiều điểm nên robot không có lí do về ổ sạc."}, {"t": "Robot có thể học cách đi lòng vòng mãi, không về ổ sạc", "chat": null, "ch": [20, 10, 15], "v": "good", "fb": "Luật do con người đặt. Với luật mới, đi càng nhiều bước càng được nhiều điểm, nên robot có thể học cách đi lòng vòng mãi, không về ổ sạc. Nếu vẫn giữ giới hạn tám bước thì thưởng nhỏ như +1 không đổi được cách đi: về ổ sạc được ít nhất 5 × 1 + 10 = 15 (đi vòng thêm hai ô rồi về được 17), đi lòng vòng tám bước chỉ được 8."}]}, {"n": "Đổi luật: mỗi bước −3 (gợi ý cho nhóm xong sớm)", "color": "#c084fc", "task": "Đi thẳng về ổ sạc được 5 × (−3) + 10 = −5. Đi lòng vòng đủ tám bước được 8 × (−3) = −24. Lao ngay vào ô cầu thang (A1, B1, B2) chỉ được −3 − 10 = −13. Robot chưa biết đường sẽ “học” cách nào?", "opts": [{"t": "Luôn đi thẳng về ổ sạc", "chat": null, "ch": [0, 0, -20], "v": "bad", "fb": "Robot chưa biết đường nên chưa thể đi thẳng về ổ sạc."}, {"t": "Lao vào cầu thang cho nhanh hết lượt (−13 có lợi hơn −24)", "chat": null, "ch": [-10, -20, 30], "v": "good", "fb": "Luật thưởng, phạt đặt không khéo khiến máy học hành vi không mong muốn: lao vào ô cầu thang (−13) cao hơn đi lòng vòng (−24) dù thấp hơn −5."}]}]}, {"type": "quiz", "tag": "HĐ2.1–2.2 • Phiếu cuối giờ và ba cách học", "title": "Phiếu số 2, phiếu số 3 và bảng ba cách máy học", "nav": "Ba cách máy học", "icon": "🧠", "badge": "Nhà phân loại cách học", "intro": "Phiếu học tập số 2 (cá nhân, tình huống giả định): một nhóm bạn muốn dạy máy phân biệt ảnh chó và ảnh mèo. Phiếu học tập số 3, phần A: trò chơi “Tự tìm nhóm” với 12 đồ vật V1–V12 không có tên và không có nhãn (Độ trong, Bề mặt, Hình dạng, Kích cỡ); chia ba nhóm sao cho đồ vật trong cùng một nhóm giống nhau nhiều nhất, không có một đáp án đúng duy nhất. Phần C: bảng tổng hợp ba cách máy học.", "qs": [{"q": "Năm bước nhóm bạn cần làm để dạy máy phân biệt ảnh chó và ảnh mèo (mỗi bước một việc cụ thể) là?", "opts": ["(1) Thu thập nhiều ảnh chó, ảnh mèo đa dạng về giống, màu lông, tư thế, nền, ánh sáng; (2) gán nhãn “chó”, “mèo” cho từng ảnh; (3) cho máy học từ các ảnh đã gán nhãn; (4) kiểm tra bằng ảnh mới chưa dùng khi học, đếm số đúng, số sai; (5) điều chỉnh: bổ sung, sửa ảnh hoặc nhãn, cho máy học lại, kiểm tra lại", "(1) Cho máy học; (2) kiểm tra bằng chính ảnh đã học; (3) thu thập ảnh; (4) gán nhãn; (5) nộp bài", "Chỉ chép tên năm thẻ bước mà không có việc cụ thể"], "a": 0, "why": "Đạt khi có ít nhất bốn bước đúng thứ tự, mỗi bước một việc cụ thể, trong đó có bước kiểm tra trên ảnh chưa dùng khi học và bước điều chỉnh khi chưa tốt. Chưa thấy minh chứng nếu chỉ chép tên năm thẻ bước, thiếu bước kiểm tra trên ảnh mới hoặc thiếu bước điều chỉnh. Mức Khá: đủ năm bước đúng thứ tự, mỗi bước là việc cụ thể với ảnh chó, mèo (ví dụ bước thu thập nêu ảnh đa dạng về giống, màu lông, nền)."}, {"q": "Máy gắn nhãn “chó” cho ảnh một con mèo đen nằm trên bãi cỏ. Trong dữ liệu, ảnh mèo đều là mèo lông sáng chụp trong nhà, ảnh chó đều chụp ngoài sân cỏ. Vì sao máy nhầm và nhóm bạn nên làm gì tiếp theo?", "opts": ["Máy có thể đã dựa vào màu lông và nền cỏ thay vì con vật; cần bổ sung ảnh mèo lông tối, mèo ngoài sân cỏ, chó trong nhà (gán nhãn đúng), cho máy học lại và kiểm tra bằng ảnh mới", "Máy bị hỏng, cần thay máy", "Máy cố ý gắn nhãn sai"], "a": 0, "why": "Câu 2 nêu được việc bổ sung dữ liệu đa dạng là dấu hiệu của mức Khá: chỉ ra máy dựa vào màu lông, nền cỏ và nêu được dữ liệu đa dạng cần bổ sung. Mức Tốt: đề xuất bổ sung dữ liệu gắn đúng chỗ máy nhầm (mèo lông tối, mèo trên cỏ, chó trong nhà) và nêu được phải cho máy học lại, kiểm tra lại bằng ảnh mới."}, {"q": "Trò chơi “Tự tìm nhóm”: máy có biết tên các nhóm không? Ai đặt tên? Cách chia nào hợp lí?", "opts": ["Máy không biết tên nhóm; con người đặt tên. Có ít nhất hai cách chia hợp lí: theo hình dạng {V1, V2, V7, V8, V12}, {V3, V4, V9, V10}, {V5, V6, V11} hoặc theo độ trong, bề mặt {V1, V2, V9, V12}, {V3, V4, V10}, {V5, V6, V7, V8, V11}", "Máy biết tên nhóm vì đã học sẵn", "Chỉ có một cách chia đúng duy nhất"], "a": 0, "why": "Chấp nhận cách chia khác nếu nhóm nêu được đặc điểm chung của mỗi nhóm (ví dụ chia theo kích cỡ kết hợp một đặc điểm khác). Tên thật: V1 chai nước suối 1,5 lít; V2 chai nước suối 350 ml; V3 lon cà phê sữa nhỏ; V4 lon nước ngọt cỡ lớn; V5 thùng bìa đựng hàng; V6 tờ rơi quảng cáo; V7 chai dầu ăn bằng nhựa màu; V8 chai sữa chua uống bằng nhựa màu trắng; V9 cốc nhựa trong; V10 lon sữa bột bằng sắt tây; V11 tập báo cũ; V12 chai trà xanh nhỏ. Nhựa là V1, V2, V7, V8, V9, V12; kim loại là V3, V4, V10; giấy là V5, V6, V11. Cách chia theo hình dạng xếp nhầm V9, cách chia theo độ trong, bề mặt xếp nhầm V7, V8. Kết luận: máy tự tìm được nhóm theo điểm giống nhau nhưng không biết tên nhóm; nhóm máy tìm chưa chắc trùng với nhóm con người cần, nên con người phải đặt tên và kiểm tra."}, {"q": "Cách 1 – học từ dữ liệu đã gán nhãn (Dạy máy phân loại rác): máy nhận được gì, học bằng cách nào, con người làm gì, ví dụ đời sống?", "opts": ["Nhận dữ liệu kèm nhãn đúng; tìm quy luật nối đặc điểm với nhãn; con người thu thập, gán nhãn, kiểm tra; ví dụ nhận biết chữ viết tay từ ảnh chữ đã ghi sẵn chữ đúng", "Nhận dữ liệu chưa có nhãn; gom những dữ liệu giống nhau; con người đặt tên nhóm", "Nhận điểm thưởng, điểm phạt; thử nhiều lần; con người đặt luật thưởng, phạt"], "a": 0, "why": "Đáp án phần C, dòng 1."}, {"q": "Cách 2 – tự tìm quy luật, tự gom nhóm từ dữ liệu chưa gán nhãn (Tự tìm nhóm): máy nhận được gì, học bằng cách nào, con người làm gì, ví dụ đời sống?", "opts": ["Nhận dữ liệu kèm nhãn đúng; tìm quy luật nối đặc điểm với nhãn; con người gán nhãn", "Nhận dữ liệu chưa có nhãn; gom những dữ liệu giống nhau; con người đặt tên nhóm, đánh giá nhóm có dùng được không; ví dụ cửa hàng gom khách hàng có thói quen mua giống nhau thành nhóm", "Nhận điểm thưởng, điểm phạt; thử nhiều lần"], "a": 1, "why": "Đáp án phần C, dòng 2."}, {"q": "Cách 3 – học qua thử nghiệm, rút kinh nghiệm từ điểm thưởng, điểm phạt (Robot tìm ổ sạc): máy nhận được gì, học bằng cách nào, con người làm gì, ví dụ đời sống?", "opts": ["Nhận dữ liệu chưa có nhãn; gom nhóm", "Nhận dữ liệu kèm nhãn đúng; tìm quy luật", "Nhận điểm thưởng, điểm phạt sau mỗi hành động; thử nhiều lần, nhớ hành động tốt, tránh hành động xấu; con người đặt luật thưởng, phạt, giám sát; ví dụ xe tự lái trong phần mềm mô phỏng học tránh vật cản"], "a": 2, "why": "Đáp án phần C, dòng 3."}, {"q": "Khi xếp một ví dụ vào một cách học, bằng chứng nào khiến em tin? Điều gì có thể làm kết luận thay đổi?", "opts": ["Bằng chứng là điều máy nhận được: dữ liệu có nhãn, dữ liệu chưa có nhãn hay điểm thưởng, điểm phạt; kết luận có thể thay đổi khi biết thêm hệ thống đó dùng loại dữ liệu nào, vì nhiều hệ thống thật kết hợp nhiều cách học", "Bằng chứng là tên ứng dụng", "Kết luận không bao giờ thay đổi"], "a": 0, "why": "Từ gợi ý cho bảng: nhãn đúng; quy tắc; điểm giống nhau; đặt tên nhóm; điểm thưởng, điểm phạt; sổ kinh nghiệm; luật thưởng, phạt."}]}, {"type": "flag", "tag": "HĐ2.3 • Dữ liệu huấn luyện và vấn đề đạo đức", "title": "Phiếu số 4: điều tra kế hoạch A và kế hoạch B", "nav": "Kế hoạch thu thập ảnh", "icon": "🕵️", "badge": "Nhà điều tra dữ liệu", "intro": "Trường THCS M (giả định) muốn thử cổng điểm danh bằng nhận diện khuôn mặt; cần ảnh khuôn mặt học sinh để dạy máy. Có hai kế hoạch thu thập ảnh (tình huống và số liệu giả định). Gạch chân dấu hiệu thiếu đa dạng bằng một màu, dấu hiệu xâm phạm quyền riêng tư bằng màu khác; gắn cờ các dấu hiệu có vấn đề của kế hoạch A. Khung gợi ý ba cột: Dấu hiệu trong kế hoạch A | Ai bị ảnh hưởng? | Hậu quả. Câu hỏi cho các nhóm: Với đồ vật, hậu quả chỉ là phân loại lại bằng tay; còn dữ liệu là ảnh con người thì sao?", "cols": ["Kế hoạch", "Chi tiết", "Vấn đề"], "flagWhat": "vấn đề về đa dạng hoặc quyền riêng tư", "rows": [{"c": ["A (nhanh và rẻ)", "Tải ảnh học sinh từ trang mạng xã hội của các lớp và ảnh phụ huynh đã đăng công khai.", "Quyền riêng tư"], "bad": true, "why": "Tải ảnh từ mạng không xin phép: đăng công khai không có nghĩa là được dùng để dạy máy; muốn dùng phải nói rõ mục đích và xin phép người trong ảnh."}, {"c": ["A", "Chụp thêm ở sân trường giờ ra chơi, không báo trước.", "Quyền riêng tư"], "bad": true, "why": "Chụp không báo trước; không nói rõ mục đích."}, {"c": ["A", "Phần lớn ảnh là học sinh khối 9 (nhiều ảnh kỉ yếu), chụp ban ngày, ngoài trời; rất ít ảnh bạn đeo kính, đeo khẩu trang.", "Thiếu đa dạng"], "bad": true, "why": "Bị ảnh hưởng: HS khối 6, 7, 8 (ảnh chủ yếu là khối 9); bạn đeo kính, đeo khẩu trang; khi trời tối, trời mưa, đứng ở cổng (ảnh chỉ chụp ban ngày ngoài sân)."}, {"c": ["A", "Ảnh lưu trên máy tính cá nhân của một thành viên nhóm kĩ thuật, chưa định khi nào xoá.", "Quyền riêng tư"], "bad": true, "why": "Ảnh lưu trên máy cá nhân, không định xoá, dễ bị lộ hoặc bị dùng vào việc khác."}, {"c": ["A", "Kết quả chạy thử trong một tuần (số liệu giả định): nhận đúng 97% học sinh khối 9 không đeo kính, nhưng chỉ 70% học sinh đeo kính.", "Thiếu đa dạng"], "bad": true, "why": "Bằng chứng: 97% so với 70%; máy nhận sai nhiều hơn với bạn đeo kính vì dữ liệu thiếu ảnh các bạn này."}, {"c": ["A", "Những sáng trời mưa, tối, khoảng một phần ba học sinh khối 6 bị ghi “đi muộn” dù đến đúng giờ.", "Thiếu đa dạng"], "bad": true, "why": "Hậu quả: bị ghi đi muộn, vắng oan; phụ huynh nhận thông báo sai; bị nhắc nhở, phải xếp hàng chờ, cảm thấy bị đối xử khác. Không công bằng; bất công có thể đến từ dữ liệu thiếu chứ không do ai cố ý."}, {"c": ["A", "Danh sách được gửi thẳng cho phụ huynh.", "Thiếu người kiểm tra"], "bad": true, "why": "Cần GV chủ nhiệm xác nhận danh sách đi muộn, vắng trước khi gửi phụ huynh; con người kiểm tra kết quả trước khi dùng, không để máy tự quyết."}, {"c": ["B (nhà trường điều chỉnh)", "Thông báo rõ mục đích; chỉ chụp học sinh có sự đồng ý của học sinh và cha mẹ; bạn không đồng ý điểm danh bằng thẻ, không bị ảnh hưởng gì.", "Khắc phục sự đồng ý, mục đích"], "bad": false}, {"c": ["B", "Chụp ở cổng trường, đủ các khối 6–9, nhiều thời điểm: sáng, chiều tối, trời mưa; có ảnh đeo kính, đeo khẩu trang, đội mũ.", "Khắc phục độ đa dạng"], "bad": false}, {"c": ["B", "Ảnh chỉ dùng để điểm danh; lưu trên máy của nhà trường, có người chịu trách nhiệm; xoá khi học sinh chuyển trường hoặc ra trường.", "Khắc phục cách lưu giữ, thời hạn xoá"], "bad": false}], "after": "Câu 4: kế hoạch B khắc phục sự đồng ý, mục đích, độ đa dạng, cách lưu giữ và thời hạn xoá. Đề xuất hợp lí: kiểm tra độ chính xác với từng khối, từng nhóm (đeo kính, đeo khẩu trang) trước khi dùng chính thức; GV chủ nhiệm xác nhận danh sách trước khi gửi phụ huynh; HS được biết cổng có ghi hình và được phản hồi khi bị ghi sai, có người tiếp nhận; cho phép rút lại sự đồng ý; không dùng danh sách “đi muộn” do máy ghi để kết luận HS lười hay thiếu chăm chỉ. Chấp nhận “chưa cần dùng nhận diện khuôn mặt, tiếp tục điểm danh bằng thẻ” nếu nhóm giải thích được. Câu 5: dữ liệu huấn luyện có thể gây ra hai vấn đề đạo đức: (1) dữ liệu thiếu đa dạng có thể dẫn tới đối xử không công bằng, phân biệt đối xử; (2) quyền riêng tư bị xâm phạm. Câu 6: số liệu chưa đủ để kết luận: chỉ từ một tuần chạy thử; khối 7, khối 8, bạn đeo khẩu trang chưa được kiểm tra riêng. Mức Tốt thêm: con số 97%, 70% cho thấy máy nhận sai với bạn đeo kính nhiều hơn nhưng chưa cho biết mỗi nhóm được thử bao nhiêu lần; camera, ánh sáng lúc trời mưa, trời tối cũng có thể làm máy sai; người ghi giờ đến thật ghi nhầm thì con số cũng sai. Bất công đến từ dữ liệu huấn luyện thiếu ảnh HS khối 6, thiếu ảnh lúc trời mưa, trời tối. Nếu chỉ khoảng một phần ba HS khối 6 đồng ý chụp ảnh thì dữ liệu lại thiếu đa dạng: không ép HS đồng ý; bạn không đồng ý vẫn điểm danh bằng thẻ và không bị thiệt; kiểm tra riêng độ chính xác với HS khối 6 trước khi dùng. Hai ý kết luận: (1) người thu thập dữ liệu có trách nhiệm bảo đảm dữ liệu đủ đa dạng, dùng đúng mục đích, lưu giữ an toàn, cho biết dữ liệu lưu đến khi nào, có phương án thay thế cho người không đồng ý; (2) con người kiểm tra kết quả trước khi dùng, không để máy tự quyết. Rubric nhóm: Đạt: nêu được máy sai với những bạn nào và dựa vào số liệu chạy thử; Khá: tự dùng số liệu làm bằng chứng, chỉ rõ nhóm chịu thiệt, nói được con số 97%, 70% đo điều gì; nêu kế hoạch B khắc phục điểm nào và bổ sung một đề xuất hợp lí; Tốt: đề xuất cân bằng sự đa dạng và sự đồng ý, hoặc lập luận có căn cứ “chưa cần thu ảnh khuôn mặt”."}, {"type": "quiz", "tag": "HĐ3 • Luyện tập", "title": "Phiếu số 5: máy học kiểu nào? Dữ liệu có vấn đề gì?", "nav": "Phiếu luyện tập", "icon": "📝", "badge": "Người luyện tập", "intro": "Phần A: ghi số của cách học (1: học từ dữ liệu đã gán nhãn; 2: tự tìm quy luật, tự gom nhóm từ dữ liệu chưa gán nhãn; 3: học qua thử nghiệm, rút kinh nghiệm từ điểm thưởng, điểm phạt). Phần B: đọc tình huống (giả định), đánh dấu vấn đề, nêu hậu quả và cách làm đúng. Không ghi tên hay thông tin cá nhân; không lấy giọng nói của bạn nào làm ví dụ.", "qs": [{"q": "a) Ứng dụng nhận biết cây học từ hàng nghìn ảnh lá đã ghi tên loại cây.", "opts": ["1", "2", "3"], "a": 0, "why": "Máy nhận ảnh kèm nhãn (tên cây) nên là cách 1."}, {"q": "b) Phần mềm tự chơi cờ nhiều ván; thắng được thưởng, thua bị phạt.", "opts": ["1", "2", "3"], "a": 2, "why": "Có điểm thưởng, điểm phạt nên là cách 3."}, {"q": "c) Ứng dụng tin tức tự gom bài báo giống nhau thành nhóm chưa có tên.", "opts": ["1", "2", "3"], "a": 1, "why": "Dữ liệu chưa gán nhãn, máy tự gom nhóm nên là cách 2."}, {"q": "d) Hộp thư học lọc thư rác từ những thư người dùng đã đánh dấu “thư rác”.", "opts": ["1", "2", "3"], "a": 0, "why": "Người dùng đánh dấu là đã gán nhãn nên là cách 1."}, {"q": "e) Robot học giữ thăng bằng khi đi: ngã thì bị phạt, đi vững thì được thưởng.", "opts": ["1", "2", "3"], "a": 2, "why": "Có điểm thưởng, điểm phạt nên là cách 3. Đạt khi xếp đúng ít nhất bốn trong sáu ví dụ."}, {"q": "f) Máy tự chia hàng nghìn cuốn sách điện tử thành các nhóm có nội dung gần nhau, rồi thủ thư đặt tên cho từng nhóm.", "opts": ["1", "2", "3"], "a": 1, "why": "Ví dụ dễ nhầm: máy tự gom nhóm, con người đặt tên sau, vẫn là cách học 2. Mức Khá: xếp đúng ít nhất năm trong sáu ví dụ; mức Tốt: xếp đúng cả sáu ví dụ. Ví dụ của em (ghi rõ cách học số mấy, máy nhận được gì): chấp nhận mọi ví dụ hợp lí, như ứng dụng dịch học từ các câu đã dịch sẵn (cách 1); điện thoại tự gom ảnh giống nhau (cách 2); máy tự học qua màn trò chơi nhờ điểm thưởng (cách 3). Chưa thấy minh chứng nếu ví dụ không ghi cách học, ghi sai hoặc chép lại ví dụ ở phần A."}, {"q": "g) Một ứng dụng chấm phát âm tiếng Anh chỉ được huấn luyện bằng giọng đọc của người lớn ở một vài thành phố. Khi học sinh ở vùng khác dùng, ứng dụng thường đánh giá phát âm của các bạn là kém. Vấn đề là gì?", "opts": ["Thiếu đa dạng", "Xâm phạm quyền riêng tư"], "a": 0, "why": "Hậu quả: HS vùng khác bị đánh giá thấp, mất tự tin. Cách làm đúng: bổ sung giọng đọc nhiều vùng miền, lứa tuổi (có sự đồng ý của người đọc) rồi kiểm tra lại."}, {"q": "h) Để làm phần mềm hội thoại tự động (chatbot) “nói giống bạn bè”, một nhóm sao chép tin nhắn trong nhóm chat của lớp làm dữ liệu mà không hỏi ý kiến các bạn. Vấn đề là gì?", "opts": ["Thiếu đa dạng", "Xâm phạm quyền riêng tư"], "a": 1, "why": "Hậu quả: lộ tin nhắn riêng, các bạn mất tin tưởng. Cách làm đúng: hỏi ý kiến, chỉ dùng tin nhắn được đồng ý hoặc tự viết dữ liệu mẫu. Phần B đạt khi ở mỗi tình huống HS đánh dấu đúng vấn đề và nêu một hậu quả cụ thể gắn với người bị ảnh hưởng; chưa thấy minh chứng nếu hậu quả chỉ là cảm xúc chung (“không tốt”, “buồn”). Mức Khá: gọi đúng vấn đề ở cả hai tình huống, hậu quả gắn với người bị ảnh hưởng, cách làm đúng hợp lí. Mức Tốt: giải thích được vì sao dữ liệu thiếu (nguồn dữ liệu, nơi thu, ai không có trong dữ liệu), phân biệt rõ hai vấn đề; cách làm đúng giữ được cả sự đa dạng lẫn sự đồng ý."}, {"q": "Khi đổi phiếu: bằng chứng nào khiến em tin vào kết luận về tình huống? Điều gì có thể làm kết luận thay đổi?", "opts": ["Bằng chứng là chi tiết trong ví dụ: máy nhận được nhãn, dữ liệu chưa có nhãn hay điểm thưởng, điểm phạt; dữ liệu thiếu ai, dữ liệu lấy có xin phép không. Kết luận có thể thay đổi nếu tình huống cho biết thêm chi tiết khác, ví dụ ứng dụng đã có giọng nhiều vùng mà vẫn sai thì nguyên nhân có thể ở chỗ khác", "Bằng chứng là cảm nhận của em", "Kết luận không bao giờ thay đổi"], "a": 0, "why": "Khi chốt kiến thức, GV nhắc câu hỏi: máy nhận được gì, dữ liệu có nhãn, dữ liệu chưa có nhãn hay điểm thưởng, điểm phạt?"}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu số 6: kế hoạch dữ liệu của nhóm em", "nav": "Kế hoạch dữ liệu", "icon": "🗂️", "badge": "Nhà quy hoạch dữ liệu", "intro": "Chọn ý tưởng và viết kế hoạch dữ liệu của nhóm. Trên lớp, nhóm điền dòng 1 và dòng 3; dòng 2, dòng 4 làm thêm nếu còn thời gian. Dòng 1 – Máy cần nhận biết hoặc làm …; dùng cách học số … vì … Dòng 2 – Dữ liệu phải có ít nhất các trường hợp: …, …, … Dòng 3 – Dữ liệu về … phải được … đồng ý; người có dữ liệu được biết …; muốn rút lại thì …; dữ liệu lưu đến …; không thu … Dòng 4 – Kiểm tra bằng … chưa dùng khi học; nếu đúng dưới … thì …; … kiểm tra kết quả trước khi dùng. Không dùng ảnh, giọng nói của người thật.", "fields": [{"id": "yt", "label": "Ý tưởng (chọn một)", "opts": ["Thùng rác thông minh ở căng tin", "Nhận biết lá cây bị sâu ở vườn trường", "Gợi ý sách thư viện theo chủ đề", "Khác (thầy cô đồng ý, không dùng ảnh, giọng nói của người)"]}, {"id": "d1", "label": "1. Máy làm gì? Cách học nào?", "hint": "Máy cần nhận biết hoặc làm …; dùng cách học số … vì …", "ph": "VD: phân loại rác vào ba ngăn Nhựa, Kim loại, Giấy; cách học 1 (dữ liệu ảnh có gán nhãn)."}, {"id": "d2", "label": "2. Đủ đa dạng (làm thêm nếu còn thời gian)", "hint": "Ít nhất ba trường hợp cụ thể", "ph": "VD: chai nhựa trong và màu đục; chai bị bóp bẹp; cốc nhựa; lon bị móp; giấy bị ướt, nhàu; nhiều điều kiện ánh sáng."}, {"id": "d3", "label": "3. Được phép", "hint": "Ai đồng ý; người có dữ liệu được biết gì; rút lại thế nào; lưu đến khi nào; không thu gì", "ph": "VD: chỉ chụp đồ vật, không chụp người, không chụp tay hay đồng phục có tên; muốn chụp ở căng tin phải xin phép nhà trường; không lấy ảnh trên mạng khi chưa được phép; ảnh chỉ dùng cho dự án, xoá khi dự án kết thúc."}, {"id": "d4", "label": "4. Kiểm tra và điều chỉnh (làm thêm nếu còn thời gian)", "hint": "Kiểm tra bằng dữ liệu mới; khi nào điều chỉnh; ai kiểm tra", "ph": "VD: kiểm tra bằng ảnh rác mới chưa dùng khi học; nếu đúng dưới 9 trong 10 ảnh thì bổ sung dữ liệu loại hay sai rồi cho máy học lại; nhóm trực nhật kiểm tra ngăn rác cuối ngày."}, {"id": "muc", "label": "Mức dùng AI (đánh dấu một ô)", "opts": ["Không dùng AI", "GV trình diễn", "Em dùng công cụ", "Nhóm dùng công cụ", "Công cụ tạo một phần sản phẩm"]}], "checks": ["Nêu rõ máy cần làm gì và chọn cách học phù hợp, có lí do; nêu ít nhất ba trường hợp cụ thể cần có trong dữ liệu.", "Có ý xin phép với dữ liệu về con người; nêu dữ liệu không được thu. Nguyên tắc kiểm tra được khi nói rõ ai làm, làm khi nào hoặc đạt con số nào (“xoá ảnh khi dự án kết thúc”, “đúng dưới 9 trong 10 ảnh” kiểm tra được; “dữ liệu phải an toàn”, “máy phải chạy tốt” thì không).", "Kiểm tra bằng dữ liệu mới; nêu khi nào cần điều chỉnh và ai kiểm tra kết quả trước khi dùng; kế hoạch cụ thể, làm được, không đổ lỗi hay xúc phạm ai; có dòng mức dùng AI (không dùng AI thì đánh dấu “Không dùng AI”).", "Phiếu số 7 – em tự kiểm tra: em mô tả được năm bước dạy máy và giải thích được vì sao phải kiểm tra trên dữ liệu mới; em nêu được ví dụ cho ba cách máy học; em nêu được hai vấn đề đạo đức có thể nảy sinh từ dữ liệu huấn luyện. Phiếu số 8 (ở nhà, tuỳ chọn): hỏi người thân một lần máy nhận nhầm, đoán máy thiếu dữ liệu gì (ví dụ giọng nói người lớn tuổi, ảnh chụp lúc tối) và dữ liệu về con người cần chính người đó đồng ý (với trẻ em, cha mẹ là người đại diện)."], "sample": "Thùng rác thông minh: Dòng 1: phân loại rác vào ba ngăn Nhựa, Kim loại, Giấy; cách học 1 (dữ liệu ảnh có gán nhãn). Dòng 2: dữ liệu phải có chai nhựa trong và màu đục; chai bị bóp bẹp; cốc nhựa; lon bị móp; giấy bị ướt, nhàu; ảnh chụp ở nhiều điều kiện ánh sáng. Dòng 3: chỉ chụp đồ vật, không chụp người, không chụp tay hay đồng phục có tên; muốn chụp ở căng tin phải xin phép nhà trường. Không lấy ảnh trên mạng khi chưa được phép; ảnh chỉ dùng cho dự án, xoá khi dự án kết thúc. Dòng 4: kiểm tra bằng ảnh rác mới chưa dùng khi học. Nếu đúng dưới 9 trong 10 ảnh thì bổ sung dữ liệu loại hay sai rồi cho máy học lại; nhóm trực nhật kiểm tra ngăn rác cuối ngày. Gợi ý: lá cây bị sâu hợp với cách học 1 vì con người gán được nhãn cho từng ảnh; gợi ý sách theo chủ đề có thể dùng cách học 2 (máy gom sách gần nhau, thủ thư đặt tên nhóm)."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn đảm nhiệm: Toán • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

function confetti(){const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,s:5+Math.random()*7,c:['#ff8a2b','#2ecc71','#4aa3ff','#f6c744','#ef5350'][Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<140)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}

go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
