<style>
:root{--o:#c0392b;--od:#902a20;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}

ồn. (5) Nhóm tự làm: thêm 2 ý vào dàn ý, đếm chai nhựa ở căng tin trong 5 ngày, chụp ảnh thùng rác, viết 3 đề xuất và trình bày. Nhóm chịu trách nhiệm về toàn bộ nội dung.”", "g": [2], "why": "Đạt cả ba tiêu chí: đúng nhật kí, đủ năm ý, nêu phần đã kiểm tra, viết lại, bỏ đi và nhận trách nhiệm."}], "pass": 0.75}, {"type": "flag", "tag": "HĐ2 • Nhật kí làm bài", "title": "Đối chiếu mẫu C với nhật kí của nhóm 3", "nav": "Đối chiếu nhật kí", "icon": "🔎", "badge": "Thám tử trung thực", "intro": "Mẫu C ghi: “Nhóm em chỉ dùng AI để sửa lỗi chính tả, còn lại nhóm tự làm toàn bộ.” Nghe nhật kí làm bài của nhóm 3 (điều thật sự đã diễn ra; giả định) rồi gắn cờ những việc AI đã làm mà mẫu C KHÔNG nói đến hoặc nói sai.", "cols": ["Việc", "Ai làm", "Ghi chú"], "flagWhat": "việc AI làm mà mẫu C không nói đúng", "rows": [{"c": ["Gợi ý dàn ý", "Trợ lí AI trên máy của cô Lan (giáo viên Tin học), trong giờ Tin học; nhóm tự nhập yêu cầu, cô ngồi cùng hướng dẫn", "AI gợi ý 5 ý; nhóm giữ 3 ý, tự thêm 2 ý"], "bad": true, "why": "AI làm nhiều hơn việc sửa chính tả (AI gợi ý 5 ý) nên mẫu C nói chưa đúng sự thật."}, {"c": ["Đoạn “Tác hại của túi ni lông” (trang 3)", "AI viết nháp; nhóm viết lại", "Nhóm đối chiếu với tài liệu cô Lan cung cấp"], "bad": true, "why": "AI viết nháp cả một đoạn nhưng mẫu C không nhắc; người đọc tưởng đoạn này hoàn toàn do nhóm viết."}, {"c": ["Số liệu “mỗi người dùng 10 túi ni lông mỗi ngày”", "AI đưa ra", "Không tìm được nguồn nên nhóm bỏ"], "bad": true, "why": "Khai báo đầy đủ nên ghi cả việc nhóm kiểm chứng rồi bỏ số liệu không có nguồn: biểu hiện trách nhiệm với nội dung cuối cùng."}, {"c": ["Sửa lỗi chính tả toàn bài", "AI", "Nhóm đọc lại trước khi nộp"], "bad": false}, {"c": ["Đếm chai nhựa ở căng tin 5 ngày", "Nhóm tự làm", "68, 75, 70, 62, 75 chai; tổng 350 chai, trung bình 70 chai mỗi ngày"], "bad": false}, {"c": ["Ảnh thùng rác (không có người)", "Nhóm tự chụp", ""], "bad": false}, {"c": ["3 đề xuất giảm rác nhựa; trình bày", "Nhóm tự làm", ""], "bad": false}, {"c": ["Thông tin nhập vào trợ lí AI", "Nhóm", "Không nhập tên trường, tên các bạn, ảnh"], "bad": false}], "after": "Bằng chứng trong nhật kí: dòng “Gợi ý dàn ý” (AI gợi ý 5 ý) và dòng “Đoạn ‘Tác hại của túi ni lông’” (AI viết nháp) cho thấy AI làm nhiều hơn việc sửa chính tả, nên mẫu C nói chưa đúng sự thật. Mẫu D khớp với từng dòng của nhật kí, kể cả việc bỏ số liệu không có nguồn. Biểu hiện dùng AI có trách nhiệm của nhóm 3: chỉ dùng AI trên máy của cô Lan trong giờ Tin học, khi có cô hướng dẫn; không nhập tên trường, tên các bạn, ảnh vào trợ lí AI; đối chiếu đoạn AI viết với tài liệu và viết lại bằng lời của nhóm; bỏ số liệu không có nguồn. Nhóm tự khảo sát (68 + 75 + 70 + 62 + 75 = 350 chai trong 5 ngày, trung bình 70 chai mỗi ngày), tự chụp ảnh, tự viết đề xuất. Khai báo như mẫu D là cách nhóm thể hiện trách nhiệm đó."}, {"type": "quiz", "tag": "HĐ2 • Xếp hạng", "title": "Xếp hạng bốn cách khai báo", "nav": "Xếp hạng khai báo", "icon": "📊", "badge": "Người xếp hạng", "intro": "Phiếu học tập số 1: đối chiếu từng mẫu với nhật kí, ghi “Có” hoặc “Chưa” vào ba cột tiêu chí (trung thực; cụ thể đủ năm ý; có trách nhiệm với nội dung cuối cùng), rồi xếp hạng lại. Chấp nhận xếp hạng khác nếu nhóm nêu được lí do.", "qs": [{"q": "Bảng đối chiếu đúng (Trung thực? / Cụ thể? / Có trách nhiệm?) của bốn mẫu A, B, C, D là?", "opts": ["A: Chưa, Chưa, Chưa; B: Có, Chưa, Chưa; C: Chưa, Chưa, Chưa; D: Có, Có, Có", "A: Có, Chưa, Chưa; B: Có, Có, Chưa; C: Có, Có, Có; D: Có, Có, Có", "A: Chưa, Chưa, Chưa; B: Chưa, Chưa, Chưa; C: Có, Có, Chưa; D: Có, Có, Có"], "a": 0, "why": "Đáp án Phiếu học tập số 1: A Chưa-Chưa-Chưa (hạng 4); B Có-Chưa-Chưa (hạng 2); C Chưa-Chưa-Chưa (hạng 3); D Có-Có-Có (hạng 1)."}, {"q": "Xếp hạng sau đối chiếu từ tốt nhất đến kém nhất là?", "opts": ["D, B, C, A", "D, C, B, A", "B, D, C, A", "C, D, B, A"], "a": 0, "why": "Xếp hạng sau đối chiếu: D, B, C, A. Chấp nhận C và A cùng hạng cuối nếu nhóm giải thích được cả hai đều không trung thực."}, {"q": "Vì sao một khai báo nói sai sự thật đáng lo hơn một khai báo còn thiếu?", "opts": ["Vì mẫu C viết dài hơn mẫu B", "Khai báo còn thiếu (mẫu B) vẫn nói thật là có dùng AI, người đọc biết để hỏi thêm; khai báo nói sai (mẫu C) làm người đọc tin rằng phần AI làm là của nhóm, nên không biết cần xem lại phần nào", "Vì mẫu B không cần khai báo"], "a": 1, "why": "Đó là thiếu trung thực."}, {"q": "Nếu nhật kí cho thấy AI chỉ sửa lỗi chính tả thì thứ hạng của mẫu C có thay đổi không?", "opts": ["Không đổi, vẫn đứng thứ 3", "Có: khi đó mẫu C nói đúng sự thật và nêu được mục đích, phần AI hỗ trợ, phần tự làm nên lên hạng 2, trên mẫu B và mẫu A; vẫn chưa đủ năm ý (chưa nêu công cụ, cách kiểm chứng) nên sau mẫu D", "Lên hạng 1"], "a": 1, "why": "Thứ hạng phụ thuộc vào việc khai báo có khớp với điều đã diễn ra hay không, không phụ thuộc vào câu chữ nghe có vẻ cụ thể."}, {"q": "Năm ý của một khai báo (kèm dòng mức dùng AI và câu nhận trách nhiệm) là gì?", "opts": ["Tên em, lớp, ngày làm, tên cô, điểm", "(1) công cụ; (2) mục đích; (3) phần được AI hỗ trợ; (4) cách kiểm chứng, chỉnh sửa; (5) phần tự làm", "Chỉ cần ghi “có dùng AI”"], "a": 1, "why": "Mẫu năm ý HS ghi vở ở B4: (1) công cụ; (2) mục đích; (3) phần được AI hỗ trợ; (4) cách kiểm chứng, chỉnh sửa; (5) phần tự làm; kèm dòng mức dùng AI và câu nhận trách nhiệm."}, {"q": "Việc nào của nhóm 3 thể hiện dùng AI có trách nhiệm? (chọn nhiều đáp án)", "opts": ["Chỉ dùng AI trên máy của cô Lan trong giờ Tin học, khi có cô hướng dẫn", "Không nhập tên trường, tên các bạn, ảnh vào trợ lí AI", "Đối chiếu đoạn AI viết với tài liệu và viết lại bằng lời của nhóm; bỏ số liệu không có nguồn", "Chép nguyên đoạn AI viết cho nhanh"], "a": [0, 1, 2], "why": "Phiếu học tập số 1 đạt yêu cầu khi nhóm xếp hạng có dẫn chứng từ nhật kí, chỉ ra mẫu C nói chưa đúng sự thật và nêu được các biểu hiện dùng AI có trách nhiệm. Nhóm xong sớm viết lại mẫu B: đạt khi khai báo khớp nhật kí, đủ năm ý, có mức dùng AI và câu nhận trách nhiệm; mẫu D là một cách viết đạt."}, {"q": "Giải thích: tiêu chí “Hợp tác và trình bày” và “Kiểm chứng và tư duy phản biện” ở mức Khá, Tốt cho phần đối chiếu này là gì?", "opts": ["Khá: đối chiếu với nhật kí, phát hiện mẫu C không trung thực; góp ý đúng khai báo của bạn cùng thẻ. Tốt: giải thích được vì sao khai báo sai sự thật đáng lo hơn khai báo thiếu; chỉ ra chính xác ý còn thiếu hoặc sai. Hợp tác: trao đổi tích cực, góp ý cụ thể, tôn trọng; mức Tốt dẫn dắt nhóm tranh luận mẫu khó (mẫu C), tiếp thu góp ý và sửa khai báo có căn cứ", "Chỉ cần xếp hạng đúng là đủ", "Chỉ cần nhóm làm nhanh"], "a": 0, "why": "Tiêu chí “Kiểm chứng và tư duy phản biện” dùng cho việc đối chiếu khai báo với nhật kí, với thẻ, không phải kiểm chứng kết quả của một công cụ AI thật."}]}, {"type": "sort", "tag": "HĐ3 • Luyện tập (gạch chân thẻ)", "title": "Gạch chân trên thẻ tình huống", "nav": "Gạch chân thẻ", "icon": "🖍️", "badge": "Người đọc kĩ", "intro": "Nhóm gạch chân trên thẻ việc AI đã làm, việc đã kiểm chứng (sửa hoặc không dùng), việc tự làm. Hãy xếp từng chi tiết của ba thẻ tình huống (giả định) vào đúng cột; chi tiết có thể thuộc hai cột.", "cats": ["Việc AI đã làm", "Việc đã kiểm chứng, sửa hoặc không dùng", "Việc nhóm (em) tự làm"], "cards": [{"t": "Thẻ 1. Hoà tự viết đoạn văn 12 câu tả sân trường giờ ra chơi.", "g": [2], "why": "Em tự làm: viết toàn bộ 12 câu."}, {"t": "Thẻ 1. Có bố ngồi cùng, Hoà dùng một công cụ AI kiểm tra chính tả trên máy tính của bố; công cụ chỉ ra 6 chỗ nghi sai.", "g": [0], "why": "Phần được hỗ trợ: chỉ ra 6 chỗ nghi sai chính tả."}, {"t": "Thẻ 1. Hoà tra từ điển: 5 chỗ đúng là lỗi nên sửa; 1 chỗ công cụ đề nghị sửa “xào xạc” thành “sào sạc” là sai nên giữ nguyên.", "g": [1], "why": "Cách kiểm chứng: tra từ điển; sửa 5 lỗi, giữ nguyên ‘xào xạc’ vì công cụ đề nghị sai."}, {"t": "Thẻ 1. Công cụ còn đề nghị viết lại câu mở đầu “cho hay hơn”, Hoà không dùng.", "g": [0, 1], "why": "Khai báo trung thực ghi cả việc công cụ gợi ý viết lại câu mở đầu (dù không dùng). Câu mở đầu là phần Hoà cần tự viết."}, {"t": "Thẻ 2. Trợ lí AI đưa 5 khẩu hiệu tiết kiệm nước, nhóm Linh chọn 1.", "g": [0], "why": "Phần được hỗ trợ: gợi ý 5 khẩu hiệu."}, {"t": "Thẻ 2. Nhóm sửa khẩu hiệu thành “Khoá chặt vòi, giữ từng giọt nước”.", "g": [2], "why": "Nhóm tự làm: sửa khẩu hiệu."}, {"t": "Thẻ 2. Trợ lí AI còn nói “một vòi rò rỉ lãng phí 100 lít mỗi ngày”.", "g": [0], "why": "Khai báo trung thực ghi cả con số 100 lít trợ lí AI đưa ra (dù không dùng)."}, {"t": "Thẻ 2. Nhóm tự hứng một vòi rò rỉ ở trường trong 10 phút được 40 ml, tính ra khoảng 5,8 lít mỗi ngày, nên không dùng con số của trợ lí AI.", "g": [1, 2], "why": "Không dùng con số 100 lít vì không có nguồn và khác xa số đo của nhóm (40 ml trong 10 phút, 40 × 144 = 5 760 ml, khoảng 5,8 lít mỗi ngày)."}, {"t": "Thẻ 2. Hình vẽ do nhóm tự vẽ tay.", "g": [2], "why": "Nhóm tự làm: vẽ hình."}, {"t": "Thẻ 3. Cô dùng trợ lí AI trên máy của cô, tóm tắt quá trình quang hợp ở cây xanh thành 6 ý theo yêu cầu của nhóm Tùng.", "g": [0], "why": "Phần được hỗ trợ: tóm tắt quá trình quang hợp thành 6 ý."}, {"t": "Thẻ 3. Nhóm đối chiếu với sách giáo khoa Khoa học tự nhiên 7: giữ 4 ý; sửa 1 ý; bỏ 1 ý không có trong sách giáo khoa.", "g": [1], "why": "Cách kiểm chứng: giữ 4 ý, sửa ‘khí oxygen’ thành ‘khí carbon dioxide’, bỏ 1 ý không có trong sách giáo khoa."}, {"t": "Thẻ 3. Trợ lí AI ghi lá cây lấy khí oxygen để quang hợp trong khi sách giáo khoa ghi lá cây lấy khí carbon dioxide.", "g": [0, 1], "why": "Khai báo ghi cả ý trợ lí AI ghi sai loại khí và ý bị bỏ."}, {"t": "Thẻ 3. Nhóm tự vẽ sơ đồ quang hợp và tự viết phần “Vì sao trường em cần thêm cây xanh”.", "g": [2], "why": "Nhóm tự làm: vẽ sơ đồ quang hợp, viết phần ‘Vì sao trường em cần thêm cây xanh’, trình bày."}], "pass": 0.7}, {"type": "quiz", "tag": "HĐ3 • Luyện tập (khai báo mẫu)", "title": "Chọn khai báo đúng cho từng thẻ", "nav": "Khai báo mẫu 3 thẻ", "icon": "📝", "badge": "Người soát khai báo", "intro": "Bạn cùng thẻ góp ý bằng bảng kiểm: Trung thực (khai báo và dòng mức dùng AI có đúng với việc đã làm không? Có giấu hoặc nói giảm phần AI làm không?); Cụ thể (có đủ năm ý không?); Có trách nhiệm với nội dung cuối cùng (có nêu chỗ đã kiểm tra, sửa hoặc không dùng và câu nhận trách nhiệm không?). Hãy chọn khai báo mẫu đúng cho từng thẻ.", "qs": [{"q": "Khai báo đúng cho Thẻ 1 (đoạn văn của Hoà) là?", "opts": ["“Mức dùng AI: Em dùng công cụ (có bố ngồi cùng). (1) Công cụ: công cụ AI kiểm tra chính tả trên máy tính của bố. (2) Mục đích: soát lỗi chính tả. (3) Phần được hỗ trợ: chỉ ra 6 chỗ nghi sai chính tả, gợi ý viết lại câu mở đầu. (4) Cách kiểm chứng: tra từ điển; sửa 5 lỗi, giữ nguyên ‘xào xạc’ vì công cụ đề nghị sai; không dùng câu mở đầu công cụ gợi ý. (5) Em tự làm: viết toàn bộ 12 câu. Em chịu trách nhiệm về nội dung đoạn văn.”", "“Em chỉ dùng AI để sửa lỗi chính tả, còn lại em tự làm.”", "“Em có dùng AI.”"], "a": 0, "why": "Trung thực: Thẻ 1 ghi cả việc công cụ gợi ý viết lại câu mở đầu (dù không dùng). Có trách nhiệm: ý (4) nêu chỗ đã sửa hoặc không dùng (“xào xạc”) và có câu nhận trách nhiệm."}, {"q": "Khai báo đúng cho Thẻ 2 (áp phích nhóm Linh) là?", "opts": ["“Mức dùng AI: GV trình diễn (trợ lí AI trên máy của thầy, giờ Tin học). (1) Công cụ: trợ lí AI trên máy của thầy. (2) Mục đích: tìm ý cho khẩu hiệu tiết kiệm nước. (3) Phần được hỗ trợ: gợi ý 5 khẩu hiệu (nhóm chọn 1 và sửa lại); đưa con số 100 lít mỗi ngày. (4) Cách kiểm chứng: không dùng con số 100 lít vì không có nguồn và khác xa số đo của nhóm (40 ml trong 10 phút, 40 × 144 = 5 760 ml, khoảng 5,8 lít mỗi ngày). (5) Nhóm tự làm: sửa khẩu hiệu, đo lượng nước rò rỉ, tính toán, vẽ hình. Nhóm chịu trách nhiệm về nội dung áp phích.”", "“Nhóm em dùng AI để làm áp phích.”", "“Nhóm tự làm toàn bộ áp phích, không dùng AI.”"], "a": 0, "why": "Thẻ 2 ghi cả con số 100 lít trợ lí AI đưa ra (dù không dùng). Chấp nhận mức “Nhóm dùng công cụ” nếu HS giải thích được (nhóm nêu yêu cầu, thầy cô thao tác). Điều quan trọng là khai báo đúng việc đã xảy ra."}, {"q": "Khai báo đúng cho Thẻ 3 (bài trình bày nhóm Tùng) là?", "opts": ["“Mức dùng AI: GV trình diễn (trợ lí AI trên máy của cô). (1) Công cụ: trợ lí AI trên máy của cô giáo. (2) Mục đích: tóm tắt nhanh quá trình quang hợp để nhóm đối chiếu. (3) Phần được hỗ trợ: tóm tắt quá trình quang hợp thành 6 ý. (4) Cách kiểm chứng: đối chiếu sách giáo khoa Khoa học tự nhiên 7; giữ 4 ý, sửa ‘khí oxygen’ thành ‘khí carbon dioxide’, bỏ 1 ý không có trong sách giáo khoa. (5) Nhóm tự làm: vẽ sơ đồ quang hợp, viết phần ‘Vì sao trường em cần thêm cây xanh’, trình bày. Nhóm chịu trách nhiệm về nội dung bài trình bày.”", "“Nhóm em chép 6 ý của AI.”", "“Nhóm em có dùng AI.”"], "a": 0, "why": "Thẻ 3 ghi cả ý trợ lí AI ghi sai loại khí và ý bị bỏ. Phần A chưa thấy minh chứng khi khai báo chỉ ghi “có dùng AI” (như mẫu B), bỏ bớt phần AI đã làm (như mẫu C), sai thẻ hoặc thiếu câu nhận trách nhiệm."}, {"q": "Câu viết thêm của nhóm khá: vì sao không dùng nguyên kết quả AI? (chọn nhiều đáp án)", "opts": ["Thẻ 1: công cụ đề nghị sửa sai chữ “xào xạc”; câu mở đầu là phần Hoà cần tự viết", "Thẻ 2: con số 100 lít không có nguồn và khác xa số nhóm tự đo", "Thẻ 3: trợ lí AI ghi sai khí lá cây lấy vào khi quang hợp và có ý không có trong sách giáo khoa", "Vì AI luôn sai"], "a": [0, 1, 2], "why": "Đây là các câu viết thêm ví dụ của nhóm khá."}, {"q": "Dùng AI để gợi ý có phải là gian lận không? Khi nhiệm vụ không cho phép dùng AI, khai báo có làm việc dùng AI thành hợp lệ không?", "opts": ["Dùng AI để gợi ý không mặc nhiên là gian lận nếu nhiệm vụ cho phép và HS khai báo trung thực; khi nhiệm vụ không cho phép dùng AI thì khai báo không làm việc dùng AI thành hợp lệ", "Luôn là gian lận", "Khai báo là đủ để mọi việc hợp lệ"], "a": 0, "why": "Khai báo không làm sản phẩm “kém đi”; khai báo giúp thầy cô thấy rõ phần em tự làm và cách em kiểm chứng kết quả AI. Ý (4) “cách kiểm chứng” là chỗ thể hiện rõ nhất em có trách nhiệm với nội dung cuối cùng."}]}, {"type": "decide", "tag": "HĐ3 • Luyện tập (dùng AI có hợp lệ?)", "title": "Máy quét: dùng AI như vậy có hợp lệ không?", "nav": "Dùng AI có hợp lệ?", "icon": "🚦", "badge": "Người dùng AI trung thực", "intro": "Trả lời ba câu hỏi để xem một cách dùng AI có hợp lệ, cần cân nhắc hay không hợp lệ, rồi thử máy quét với các tình huống (giả định).", "questions": ["Nhiệm vụ này có cho phép dùng AI không?", "Em có khai báo trung thực, đủ năm ý (kể cả phần AI làm và phần đã bỏ)?", "Em có kiểm chứng kết quả AI và tự làm phần cần rèn luyện của chính mình?"], "verdicts": ["Hợp lệ", "Cần cân nhắc", "Không hợp lệ"], "rules": [{"when": [0, null, null], "v": 2}, {"when": [1, 0, null], "v": 2}, {"when": [1, 1, 1], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "Thẻ 1: Hoà tự viết đoạn văn, dùng công cụ AI kiểm tra chính tả có bố ngồi cùng, tra từ điển, giữ nguyên “xào xạc”, không dùng câu mở đầu công cụ gợi ý và khai báo đủ năm ý.", "v": 0, "why": "Nhiệm vụ cho phép, khai báo đúng việc đã xảy ra, có kiểm chứng và tự làm: dùng AI có trách nhiệm."}, {"t": "Thẻ 2: nhóm Linh nhờ trợ lí AI trên máy thầy gợi ý khẩu hiệu, không dùng con số 100 lít vì tự đo được 5,8 lít mỗi ngày, ghi cả con số đó vào khai báo.", "v": 0, "why": "Khai báo ghi cả con số trợ lí AI đưa ra (dù không dùng): trung thực, cụ thể, có trách nhiệm."}, {"t": "Nga: “Không cần nói đâu, cô đâu có biết.” Nhóm đã dùng AI gợi ý dàn ý nhưng không khai báo.", "v": 2, "why": "Giấu việc dùng AI là không trung thực. Việc “cô không biết” không làm việc giấu trở nên đúng."}, {"t": "Mẫu C: nhóm khai “chỉ dùng AI để sửa lỗi chính tả” trong khi AI còn gợi ý dàn ý và viết nháp một đoạn.", "v": 2, "why": "Nói sai sự thật đáng lo hơn khai báo còn thiếu."}, {"t": "Nhiệm vụ không cho phép dùng AI, em vẫn dùng AI viết bài rồi ghi một dòng khai báo đủ năm ý.", "v": 2, "why": "Khi nhiệm vụ không cho phép dùng AI thì khai báo không làm việc dùng AI thành hợp lệ."}, {"t": "Bảo chỉ nói “Nhóm em có dùng AI.” cho một bài nhiệm vụ cho phép dùng AI.", "v": 1, "why": "Trung thực nhưng chưa đầy đủ: người đọc không biết phần ột việc em sẽ tự làm", "hint": "Gắn với việc học của chính em", "ph": "Em sẽ tự viết bài văn và tự giải bài tập Toán."}, {"id": "kb", "label": "Khi có dùng AI, em sẽ khai báo đủ năm ý …", "hint": "Công cụ, mục đích, phần được hỗ trợ, cách kiểm chứng, phần em tự làm", "ph": "Khi sản phẩm có dùng AI, em sẽ khai báo đủ năm ý: công cụ, mục đích, phần được hỗ trợ, cách kiểm chứng và phần em tự làm.", "long": false}, {"id": "muc", "label": "Mức dùng AI khi em làm phiếu này", "opts": ["Không dùng AI", "GV trình diễn", "Em dùng công cụ", "Nhóm dùng công cụ", "Công cụ tạo một phần sản phẩm"]}], "checks": ["Mức đạt: nêu được việc sẽ làm để dùng AI có trách nhiệm và lời cam kết khai báo khi có dùng AI, dù còn chung; chấp nhận mọi hình thức đáp ứng các ý này.", "Chưa thấy minh chứng khi phần B chỉ có khẩu hiệu chung, không nêu việc em sẽ làm hoặc không có lời cam kết khai báo.", "Mức Khá: cam kết nêu các việc cụ thể, cam kết khai báo đủ năm ý, có một việc em tự làm; nêu ít nhất hai biểu hiện dùng AI có trách nhiệm (được phép mới dùng, không đưa thông tin cá nhân vào công cụ AI, kiểm chứng đầu ra).", "Mức Tốt: cam kết gắn với việc học cụ thể của bản thân, trình bày rõ ràng, thuyết phục; gắn các biểu hiện (trong đó có giữ thông tin cá nhân) với một việc học cụ thể."], "sample": "Em cam kết chỉ dùng AI khi được thầy cô hoặc bố mẹ cho phép và không đưa thông tin cá nhân vào công cụ AI. Em sẽ kiểm tra lại mọi thông tin AI đưa ra bằng sách giáo khoa hoặc hỏi thầy cô. Em sẽ tự viết bài văn và tự giải bài tập Toán. Khi sản phẩm có dùng AI, em sẽ khai báo đủ năm ý: công cụ, mục đích, phần được hỗ trợ, cách kiểm chứng và phần em tự làm. Khẩu hiệu áp phích: “AI gợi ý, em kiểm chứng, em khai báo, em chịu trách nhiệm.” Mẫu nhận xét mức Tốt: “Khai báo của em trung thực, rõ ràng, chỉ đúng chỗ AI sai và cách em xử lí; cam kết gắn với việc học của chính em. Em có thể giúp bạn cùng nhóm soát lại ý (4) trong khai báo của bạn.”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
