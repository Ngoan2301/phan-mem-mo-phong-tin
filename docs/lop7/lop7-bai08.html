ao sai việc. Xem lí do bên dưới để sửa."}, {"m": "perfect", "op": ">=", "v": 1, "e": "🎉", "t": "Đúng: AI chỉ xếp nhóm, người quyết định, không thu tên."}, {"m": "ok", "op": ">=", "v": 0, "e": "🤖", "t": "Chọn Làm, Bỏ qua hoặc Hỏi người cho từng việc rồi cho robot chạy."}]}, "hint": "AI chỉ làm việc lặp lại, có mẫu. Việc cần cân nhắc thì Hỏi người. Thu tên thì Bỏ qua.", "after": "Giao AI việc lặp lại có mẫu. Việc ảnh hưởng tới người khác do người quyết. Ví dụ: AI xếp câu hỏi, cô quyết định báo ai."}, {"type": "sim", "scene": "pipeline", "tag": "HĐ2.1 • Dữ liệu cho hộp câu hỏi", "title": "Hộp câu hỏi nên thu những gì?", "nav": "Thu gì cho hộp", "icon": "📥", "badge": "Người giữ dữ liệu an toàn", "story": {"e": "👦", "t": "Minh lo phần dữ liệu cho hộp câu hỏi lớp 7A. Bản X thu cả họ tên và lớp để AI trả lời riêng từng bạn. Bản Y thì không ghi tên."}, "steps": ["Bấm bật hoặc tắt từng loại dữ liệu", "Nhìn gói dữ liệu chạy tới AI và cô chủ nhiệm", "Giữ dữ liệu đủ dùng, ít lộ nhất"], "intro": "Chọn dữ liệu cho hộp câu hỏi: chỉ ghi loại dữ liệu, nơi lấy; không ghi tên, ảnh của bạn.", "missions": [{"t": "Giảm mức lộ thông tin bạn xuống 10 hoặc thấp hơn", "m": "risk", "op": "<=", "v": 10}, {"t": "AI vẫn xếp thử được từ 75 trở lên", "m": "use", "op": ">=", "v": 75}], "p": {"nodes": [{"n": "Học sinh", "e": "🧒"}, {"n": "Hộp câu hỏi", "e": "📥"}, {"n": "AI xếp nhóm", "e": "🤖"}, {"n": "Cô chủ nhiệm", "e": "👩‍🏫"}], "items": [{"id": "cq", "n": "Câu hỏi không ghi tên", "e": "❓", "risk": 0.5, "use": 6, "why": "Chỉ thu câu hỏi không tên: hộp câu hỏi không ghi tên.", "on": true}, {"id": "mau", "n": "30 câu mẫu lớp đã xếp vào ba nhóm", "e": "🗂️", "risk": 0.5, "use": 6, "why": "Có ví dụ mẫu thì AI mới có gì để học theo. 30 câu mẫu do Minh thu từ hộp câu hỏi, cả lớp xếp vào ba nhóm.", "on": true}, {"id": "ht", "n": "Họ tên người hỏi", "e": "🪪", "risk": 6, "use": 0.5, "why": "Thu họ tên là thu dữ liệu cá nhân không cần thiết, có nguy cơ lộ.", "on": true}, {"id": "lop", "n": "Lớp của người hỏi", "e": "🏫", "risk": 4, "use": 0.5, "why": "Thu lớp cũng là dữ liệu cá nhân không cần thiết.", "on": true}, {"id": "nb", "n": "Tên bạn khác bị nhắc trong câu hỏi", "e": "👥", "risk": 5, "use": 0.5, "why": "Câu hỏi có thể nhắc tên bạn khác: cô chủ nhiệm mở hộp, xoá tên người được nhắc tới rồi mới đưa câu cho nhóm.", "on": false}], "rl": "Mức lộ thông tin bạn", "ul": "AI xếp thử được", "states": [{"m": "risk", "op": ">=", "v": 40, "e": "🚨", "t": "Đang thu họ tên, lớp và cả tên bạn khác. Những thứ này AI không cần để xếp câu hỏi."}, {"m": "use", "op": ">=", "v": 75, "e": "✅", "t": "Dữ liệu vừa đủ: câu hỏi không tên và 30 câu mẫu. Người dùng chỉ cần loại dữ liệu và nơi lấy."}, {"m": "risk", "op": ">=", "v": 0, "e": "🤔", "t": "Tắt dữ liệu cá nhân, giữ câu hỏi và câu mẫu."}]}, "hint": "Tắt họ tên, lớp và tên bạn khác. Giữ câu hỏi không tên và 30 câu mẫu.", "after": "Mục 3: dữ liệu và nguồn dữ liệu chỉ ghi loại dữ liệu, nơi lấy; không ghi tên, ảnh của bạn trong lớp. Dữ liệu chỉ lấy từ một lớp nên có thể thiếu loại câu lớp khác hay hỏi; nhãn do người xếp cũng có thể sai."}, {"type": "match", "tag": "HĐ2.1 • Phiếu ý tưởng dự phòng", "title": "Sáu phiếu ý tưởng: dễ thành gì?", "nav": "Phiếu ý tưởng A–F", "icon": "🗒️", "badge": "Người thu hẹp ý tưởng", "intro": "Chỉ dùng khi nhóm chưa có ý tưởng. Mỗi phiếu có chỗ “Dễ thành…”. Nối phiếu với cách thu hẹp Mục 4.", "pairs": [["PHIẾU A. Trả lời thắc mắc thường gặp về lịch học và nội quy (phần mềm hội thoại tự động, chatbot; chỉ lập kế hoạch).", "Dễ thành “trợ lí AI tư vấn mọi thứ”. Hãy thu hẹp: AI xếp mỗi câu HS hỏi vào một trong ba chủ đề thường gặp (lịch học, nội quy, đồng phục) để chỉ tới câu trả lời GV đã duyệt; câu khác chủ đề chuyển cho GV."], ["PHIẾU B. Xếp câu hỏi ôn tập HS gửi vào đúng môn (Toán, Ngữ văn, Tiếng Anh) để GV bộ môn trả lời theo nhóm trước các bài kiểm tra.", "Dễ thành “AI giải bài, trả lời mọi câu ôn tập”. AI chỉ xếp câu hỏi vào môn, không tự trả lời; GV bộ môn trả lời; câu không thuộc ba môn chuyển cho GV chủ nhiệm."], ["PHIẾU C. Bớt món ăn thừa ở căng tin bán trú: AI xếp phiếu nhận xét món ăn của HS thành “thích / bình thường / không thích” để cô cấp dưỡng điều chỉnh.", "Dễ thành “AI tự lên thực đơn”. Cô cấp dưỡng mới là người quyết định thực đơn."], ["PHIẾU D. Nhận dạng rác tái chế bằng ảnh cho hoạt động thu gom của trường (chỉ lập kế hoạch).", "Dễ thành “AI tự phân loại mọi loại rác của cả xã”. Hãy thu hẹp vào ba loại rác ở căng tin trường."], ["PHIẾU E. Nhận xét bản nháp dàn ý trình bày ý tưởng của HS làm dự án môn học (không viết hộ).", "Dễ thành “AI viết hộ bài trình bày”. AI chỉ nhận xét bản nháp của HS còn thiếu phần nào trong bốn phần GV đã cho; HS tự sửa."], ["PHIẾU F. Nhận dạng 5 loại cây trong vườn trường qua ảnh lá để làm bảng tên cây.", "Dễ thành “AI nhận mọi loài cây”. Hãy thu hẹp vào 5 loại cây có trong vườn trường."]], "why": "Phiếu D: tổ trực nhật, đội thu gom phế liệu của trường gặp vấn đề; rác ở căng tin bị bỏ chung một túi; dữ liệu là ảnh chụp chai nhựa, lon, giấy ở căng tin, lớp tự chụp và gán nhãn. Nhóm nêu điểm thay đổi riêng (người dùng, nơi dùng hoặc sản phẩm) vào đầu Phiếu học tập số 2. Ví dụ Mục 4 đúng (phiếu D): “AI nhận ảnh rác ở căng tin là chai nhựa, lon hay giấy cho tổ trực nhật, dựa trên 60 ảnh mẫu lớp đã chụp và gán nhãn.” Phiếu F chỉ chụp lá, không chụp người."}, {"type": "sim", "scene": "plan", "tag": "HĐ2.2 • Ai làm gì, khi nào", "title": "Xếp kế hoạch 4 tuần cho hộp câu hỏi", "nav": "Xếp 4 tuần", "icon": "🗓️", "badge": "Người lập kế hoạch", "story": {"e": "👧", "t": "Lan cùng nhóm có 5 việc cho hộp câu hỏi. Mỗi tuần nhóm làm được tối đa 3 công. Việc nào phải làm trước việc nào thì phải đúng thứ tự."}, "steps": ["Kéo từng việc vào một tuần", "Mỗi tuần không quá 3 công (số ⏱ trên thẻ)", "Việc trước làm xong mới làm việc sau"], "intro": "Xếp 5 việc vào 4 tuần sao cho ổn.", "missions": [{"t": "Xếp xong, không tuần nào quá tải, không sai thứ tự", "m": "ok", "op": ">=", "v": 1}], "p": {"weeks": ["Tuần 1", "Tuần 2", "Tuần 3", "Tuần 4"], "cap": 3, "tasks": [{"id": "a", "n": "Xin phép cô chủ nhiệm đặt hộp câu hỏi không ghi tên (Lan)", "e": "🙋", "d": 1}, {"id": "b", "n": "Thu 30 câu mẫu, cả lớp xếp vào ba nhóm (Minh)", "e": "🗂️", "d": 2, "dep": ["a"]}, {"id": "e", "n": "Cô chủ nhiệm xoá tên trong 10 câu hỏi mới", "e": "✂️", "d": 1, "dep": ["a"]}, {"id": "c", "n": "Cô chủ nhiệm cho AI xếp thử 10 câu hỏi mới (Hà ghi kết quả; Minh kiểm tra)", "e": "🤖", "d": 2, "dep": ["b", "e"]}, {"id": "d", "n": "So kết quả với tiêu chí ở Mục 5, báo cáo lớp (Nam)", "e": "📣", "d": 2, "dep": ["c"]}], "states": [{"m": "viol", "op": ">=", "v": 1, "e": "⛔", "t": "Sai thứ tự: phải xin phép trước, có câu mẫu rồi AI mới xếp thử."}, {"m": "overload", "op": ">=", "v": 1, "e": "🔥", "t": "Có tuần quá nhiều việc. Chuyển bớt sang tuần khác."}, {"m": "ok", "op": ">=", "v": 1, "e": "✅", "t": "Kế hoạch làm được: việc nào cũng có người làm và có tuần xong."}, {"m": "placed", "op": ">=", "v": 0, "e": "🧩", "t": "Kéo từng việc vào tuần. Việc trước làm xong mới tới việc sau."}]}, "hint": "Việc “xin phép” xếp tuần 1. “AI xếp thử” xếp sau khi có câu mẫu và đã xoá tên.", "after": "Bảng Phần B mẫu: bước nào cũng có một người phụ trách; bước xin phép đứng trước bước thu dữ liệu; bước có AI có người kiểm tra kết quả; cô chủ nhiệm đọc mọi câu và giữ riêng câu không thuộc nhóm nào. Ví dụ: xin phép cô rồi mới đặt hộp. Mọi thành viên có tên ở ít nhất một bước; không bước nào ghi “cả nhóm”."}, {"type": "flag", "tag": "HĐ2.3 • Soi kết quả AI", "title": "AI xếp thử 10 câu hỏi: đúng hay sai?", "nav": "Soi AI xếp thử", "icon": "🧐", "badge": "Người kiểm tra AI", "intro": "Bảng giả lập: tuần 3, AI xếp mỗi câu vào nhóm học tập, nội quy hoặc hoạt động. Bấm cờ vào câu AI xếp sai. Tiêu chí: ít nhất 8 trong 10 câu xếp đúng.", "cols": ["Câu", "Câu hỏi (không ghi tên)", "AI xếp vào nhóm"], "flagWhat": "AI xếp sai nhóm", "rows": [{"c": ["1", "Bài kiểm tra Toán tuần sau gồm những phần nào?", "Học tập"], "bad": false, "why": "AI xếp đúng."}, {"c": ["2", "Có được mang điện thoại vào lớp không?", "Hoạt động"], "bad": true, "why": "Câu 2 thuộc nhóm nội quy."}, {"c": ["3", "Khi nào lớp đi tham quan?", "Hoạt động"], "bad": false, "why": "AI xếp đúng."}, {"c": ["4", "Đi học muộn 5 phút có bị ghi tên không?", "Nội quy"], "bad": false, "why": "AI xếp đúng."}, {"c": ["5", "Em chưa hiểu cách đổi đơn vị đo, hỏi ai?", "Học tập"], "bad": false, "why": "AI xếp đúng."}, {"c": ["6", "Lớp có tập văn nghệ cho ngày 20 tháng 11 không?", "Học tập"], "bad": true, "why": "Câu 6 thuộc nhóm hoạt động."}, {"c": ["7", "Có phải mặc đồng phục vào thứ Bảy không?", "Nội quy"], "bad": false, "why": "AI xếp đúng."}, {"c": ["8", "Câu lạc bộ cờ vua sinh hoạt hôm nào?", "Nội quy"], "bad": true, "why": "Câu 8 thuộc nhóm hoạt động."}, {"c": ["9", "Làm bài tập về nhà môn Ngữ văn ở vở nào?", "Học tập"], "bad": false, "why": "AI xếp đúng."}, {"c": ["10", "Có được ăn quà trong giờ học không?", "Học tập"], "bad": true, "why": "Câu 10 thuộc nhóm nội quy."}], "after": "AI xếp đúng 6 trong 10 câu (câu 1, 3, 4, 5, 7, 9); xếp sai 4 câu: câu 2 và câu 10 thuộc nhóm nội quy; câu 6 và câu 8 thuộc nhóm hoạt động. 6 trong 10 thấp hơn mức 8 trong 10 nên chưa đủ tiêu chí thành công. Người phát hiện là người kiểm tra ở bước 3 của Bảng Phần B mẫu: Minh đối chiếu, cô chủ nhiệm xác nhận. Không có người đối chiếu thì 4 câu sai sẽ không ai biết. Con số “6 trong 10” chỉ đếm số câu xếp đúng trong 10 câu đã thử; chỉ với 10 câu thì chưa kết luận được AI hay sai loại câu nào."}, {"type": "quiz", "tag": "HĐ3 • Kiểm tra nhanh", "title": "Sự cố “Tua nhanh bốn tuần” và rủi ro", "nav": "Quiz nhanh", "icon": "❓", "badge": "Người lập kế hoạch", "intro": "Nhóm số N nhận sự cố số N. Sự cố này làm hỏng bước nào? Kế hoạch đã có cách xử lí chưa?", "qs": [{"q": "Sự cố 1: Người cần xin phép chưa đồng ý. Cách xử lí mẫu?", "opts": ["Vẫn thu dữ liệu", "Xin phép sớm từ tuần 1; chưa được đồng ý thì không thu, đổi sang dữ liệu nhóm tự tạo", "Bỏ dự án"], "a": 1, "why": "Bước xin phép, kéo theo bước thu dữ liệu. Xin phép sớm từ tuần 1; chưa được đồng ý thì không thu, đổi sang dữ liệu nhóm tự tạo; người phụ trách bước 1 báo GV."}, {"q": "Sự cố 2: Bạn phụ trách một bước bị ốm cả tuần. Cách xử lí mẫu?", "opts": ["Bạn cùng bước hoặc người điều phối làm thay; lùi mốc, ghi lại trên Phần B", "Bỏ bước đó", "Không ai làm"], "a": 0, "why": "Bạn cùng bước (nếu có) hoặc người điều phối làm thay; lùi mốc, ghi lại trên Phần B."}, {"q": "Sự cố 3: Cho AI chạy thử, có những kết quả AI làm sai. Làm gì?", "opts": ["Dùng luôn", "Người kiểm tra đối chiếu từng kết quả; thêm dữ liệu mẫu, thử lại; chưa đủ tiêu chí ở Mục 5 thì không dùng"], "a": 1, "why": "Bước thử có AI (kết quả AI sai): người kiểm tra đối chiếu từng kết quả; thêm dữ liệu mẫu (câu, ảnh), thử lại; chưa đủ tiêu chí ở Mục 5 thì không dùng. Liên quan loại rủi ro 1, 3."}, {"q": "Sự cố 4: Ảnh hoặc câu hỏi thu về có lẫn mặt, tên của bạn khác. Làm gì?", "opts": ["Giữ nguyên", "Chỉ thu câu hỏi không tên, chỉ chụp đồ vật, không chụp người; GV xoá tên, bỏ ảnh có mặt người trước khi nhóm dùng"], "a": 1, "why": "Chỉ thu câu hỏi không tên, chỉ chụp đồ vật, không chụp người; GV xoá tên, bỏ ảnh có mặt người trước khi nhóm dùng. Liên quan loại rủi ro 2."}, {"q": "Sự cố 5: Người dùng thử tin ngay kết quả AI, không hỏi lại ai. Làm gì?", "opts": ["Ghi rõ trên sản phẩm phần nào do AI làm, ai kiểm tra lại; người dùng hỏi lại GV khi cần", "Không làm gì"], "a": 0, "why": "Ghi rõ trên sản phẩm phần nào do AI làm, ai kiểm tra lại; người dùng hỏi lại GV khi cần. Liên quan loại rủi ro 4, 5."}, {"q": "Sự cố 6: Dữ liệu mẫu có rất ít ảnh hoặc câu của một loại; gặp loại đó AI hay nhận sai. Làm gì?", "opts": ["Thu thêm dữ liệu cho loại còn ít; ghi rõ AI chỉ dùng cho các loại đã thử đủ; nêu ai chịu thiệt khi AI hay sai ở loại đó", "Bỏ qua"], "a": 0, "why": "Thu thêm dữ liệu cho loại còn ít; ghi rõ AI chỉ dùng cho các loại đã thử đủ; nêu ai chịu thiệt khi AI hay sai ở loại đó. Liên quan loại rủi ro 3, Mục 5."}, {"q": "Sự cố 7: Gặp câu hỏi hoặc ảnh không thuộc nhóm nào đã í khi một bước hỏng (dòng tua nhanh)."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu kế hoạch dự án của nhóm em", "nav": "Phiếu cuối giờ", "icon": "✅", "badge": "Thành viên có trách nhiệm", "intro": "Nhóm lập kế hoạch cho một ý tưởng. Ghi gọn, không ghi tên, ảnh của bạn. Em tự viết phiếu cuối giờ về kế hoạch của nhóm em.", "fields": [{"id": "a", "label": "1. Vấn đề cần giải quyết, ai gặp. 2. Người dùng và điều họ được lợi", "hint": "Mỗi mục tối đa hai dòng", "ph": "Rác ở căng tin bị bỏ chung một túi; tổ trực nhật và đội thu gom phế liệu gặp vấn đề."}, {"id": "b", "label": "3. Dữ liệu và nguồn dữ liệu (chỉ ghi loại dữ liệu, nơi lấy; không ghi tên, ảnh của bạn)", "hint": "Dữ liệu cần có; lấy từ đâu", "ph": "Ảnh chụp chai nhựa, lon, giấy ở căng tin, lớp tự chụp và gán nhãn."}, {"id": "c", "label": "4. Chức năng AI (đúng một việc): AI …… cho ……, dựa trên …… Vì sao nên để AI làm việc này", "hint": "Một động từ chính, có người dùng, có nguồn dữ liệu", "ph": "AI nhận ảnh rác ở căng tin là chai nhựa, lon hay giấy cho tổ trực nhật, dựa trên 60 ảnh mẫu lớp đã chụp và gán nhãn."}, {"id": "d", "label": "5. Tiêu chí thành công: đo bằng cách nào, ai đo (đếm kết quả AI đúng so với cách người làm; hỏi người dùng thử; so thời gian trước và sau)", "hint": "Đếm được, so sánh được hoặc hỏi được", "ph": "Hỏi cô cấp dưỡng: cô có muốn dùng tiếp tuần sau không? Có / Không."}, {"id": "e", "label": "6. Rủi ro và biện pháp (loại 1–5, ở bước nào, ai kiểm soát). Tua nhanh bốn tuần: Nếu …… thì bước …… hỏng; nhóm sẽ ……", "hint": "Biện pháp làm được, có tên người", "ph": "Ghi trên bảng kết quả: phần xếp loại rác do AI làm, tổ trực nhật kiểm tra lại. Nếu bạn phụ trách bước 2 ốm thì bước 2 hỏng; người điều phối làm thay, lùi mốc sang đầu tuần 3."}, {"id": "f", "label": "Em tự thấy phần mình làm ở mức", "opts": ["Đạt", "Khá", "Tốt"]}, {"id": "m", "label": "Mức dùng AI cho phiếu này", "opts": ["Không dùng AI", "GV trình diễn", "Em dùng công cụ", "Nhóm dùng công cụ", "Công cụ tạo một phần sản phẩm"]}], "checks": ["AI trong dự án chỉ làm đúng một việc? (nhìn Mục 4)", "Mọi quyết định ảnh hưởng tới người khác do con người quyết định, không để AI quyết định thay? (nhìn Mục 4, Phần B)", "Đã ghi xin phép ai, bằng cách nào; hình ảnh, văn bản dùng có nguồn và được phép dùng? (nhìn Mục 3, Phần B)", "Mỗi bước trong bốn tuần đã có một người phụ trách và mốc xong; bước có AI đã có người kiểm tra kết quả? (nhìn Phần B)", "Dòng “Vì sao nên để AI làm việc này” có lí do cho thấy dùng AI hợp lí hơn làm thủ công? (nhìn Mục 4)", "Ô 3: bước em phụ trách hoặc kiểm tra, bạn cùng bước, thứ cần chuẩn bị, xong khi nào"], "sample": "Nhóm em làm ra sản phẩm gì, cho ai dùng? Nó khác cách mọi người đang làm ở điểm nào? Ví dụ: hiện nay tổ trực nhật nhặt rác chung một túi; sản phẩm giúp chia ngay ba loại để bán phế liệu. Em ghi đúng bước 2 có tên em và mốc tuần 2, khớp Phần B của nhóm."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn phụ trách bài này (gợi ý): Công nghệ • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

/* ---------- 1. classifier: AI học từ dữ liệu huấn luyện (kNN) ---------- */

 pools(P){if(P._p)return P._p;const r=rng(P.seed||11),sd=P.sd||.10,cx=P.sep||.2,mk=(x,y,n)=>Array.from({length:n},()=>[cl(x+gau(r)*sd),cl(y+gau(r)*sd)]);

 space(P){const o=[];for(const n of[4,8,16,30,60,100,120])for(const ratio of[10,30,50,70,90])for(const noise of[0,10,20,30])o.push({n,ratio,noise});return o},

 const b=E('button','btn','Hoàn thành & chấm tự đánh giá');b.onclick=()=>{const filled=md.fields.filter(f=>(s.f[f.id]||'').trim().length>=4).length,chk=Object.values(s.c).filter(Boolean).length;if(!s.rs){s.rs=1;award(i,Math.round(6*(filled/md.fields.length*.6+(md.checks?chk/md.checks.length:1)*.4)))}good();ST.done[i]=1;go(i)};c.appendChild(b);
 const dl=E('button','btn w','⬇ Lưu thành ảnh PNG');dl.onclick=()=>{const cv=document.createElement('canvas');cv.width=1000;cv.height=720;const x=cv.getContext('2d');x.fillStyle='#fffdf3';x.fillRect(0,0,1000,720);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--o');x.lineWidth=10;x.strokeRect(8,8,984,704);x.fillStyle='#1f2d3d';x.font='bold 30px Arial';x.fillText(md.title.slice(0,50),36,64);let y=110;const w=(t,y0,fs)=>{x.font=fs;const ws=String(t).split(' ');let l='';let yy=y0;for(const a of ws){if(x.measureText(l+a).width>920){x.fillText(l,36,yy);yy+=28;l=''}l+=a+' '}x.fillText(l,36,yy);return yy+34};md.fields.forEach(f=>{x.fillStyle='#d35400';y=w(f.label,y,'bold 20px Arial');x.fillStyle='#1f2d3d';y=w(s.f[f.id]||'……',y,'20px Arial')});const a=document.createElement('a');a.href=cv.toDataURL();a.download='san-pham-cua-em.png';a.click()};c.appendChild(dl);

/* ---- sim ---- */
R.sim=(m,md,i)=>{const s=ST.m[i];s.ms=s.ms||{};s.st=s.st||{};const c=head(md),mis=md.missions||[];if(md.story)c.appendChild(E('div','sbub',`<span class="se2">${esc(md.story.e||'🧒')}</span><span>${md.story.t}</span>`));if(md.steps&&md.steps.length)c.appendChild(E('div','coach',md.steps.map((t,k)=>`<div class="cs"><i>${k+1}</i><span>${esc(t)}</span></div>`).join('')));if(md.hint){const hb=E('button','btn w hintb','💡 Gợi ý');const hx=E('div','fb info');hx.style.display='none';hx.innerHTML=esc(md.hint);hb.onclick=()=>{hx.style.display=hx.style.display=='none'?'':'none'};c.append(hb,hx)}const list=E('div','mis');c.appendChild(list);const host=E('div','simh');c.appendChild(host);const out=E('div');c.appendChild(out);
 const paint=()=>{list.innerHTML='<b>🎯 Nhiệm vụ của em:</b>'+mis.map((x,k)=>`<div class="mi ${s.ms[k]?'ok':''}">${s.ms[k]?'✅':'⬜'} ${esc(x.t)}</div>`).join('')};
 const fin=()=>{out.innerHTML='';if(md.after)out.appendChild(E('div','takeb','<b>🌟 Điều em rút ra:</b> '+md.after));finish(out,i)};
 paint();let live=0;const set=met=>{if(!live)return;let ch=0;mis.forEach((x,k)=>{if(!s.ms[k]&&met[x.m]!=null&&cmp(x.op,met[x.m],x.v)){s.ms[k]=1;award(i,3);ch=1}});if(ch){good();paint();if(mis.every((x,k)=>s.ms[k])&&!s.fin){s.fin=1;confetti();fin()}}};
 try{SIM[md.scene].mount(host,md.p||{},set,s.st)}catch(e){host.innerHTML='<i>Lỗi cảnh mô phỏng: '+esc(e.message)+'</i>'}
 live=1;if(s.fin)fin();m.appendChild(c)};

function result(m){const c=E('div','card');const mx=maxPts()||1,pc=Math.min(100,Math.round(ST.pts/mx*100));
 c.innerHTML=`<h2>🏁 Kết quả của em</h2><p class="lead">Tổng điểm: <b>${ST.pts}</b> / ${mx} (${pc}%)</p><div class="bar" style="height:18px"><i style="width:${pc}%"></i></div><div style="text-align:center;margin:14px 0">`+MODS.map((x,k)=>`<span class="badge ${ST.done[k]?'on':''}">${x.icon||'⭐'}<small>${esc(x.badge||x.nav||x.title).slice(0,28)}</small></span>`).join('')+`</div>
 <table><tr><th>Hoạt động</th><th>Điểm</th></tr>`+MODS.map((x,k)=>`<tr><td>${esc(x.title)}</td><td>${ST.got[k]}/${mp(x)}</td></tr>`).join('')+`</table>
 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}
$('#ttl').textContent=SPEC.title;$('#sub').textContent=SPEC.sub||'';$('#ico').textContent=SPEC.icon||'🧭';
go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
