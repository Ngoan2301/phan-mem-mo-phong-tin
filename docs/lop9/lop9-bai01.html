<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 1. Thách thức, tác động và thiên vị của AI đối với xã hội – Lớp 9</title>
<style>
:root{--o:#e67e22;--od:#ac5e19;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "⚖️", "title": "Bài 1. Thách thức, tác động và thiên vị của AI đối với xã hội – Lớp 9", "ainote": "Dẫn chứng tự tìm không ghi tên, ảnh người thật; thẻ C nói về giới và màu da nên chỉ bàn về hệ thống AI. Không kể chuyện riêng với chatbot, không dùng chatbot thay lời khuyên của bác sĩ, cha mẹ, thầy cô. Bảng 12 hồ sơ, Công ty K và bảng ảnh nghề nghiệp là mô phỏng/giả định; quyết định tuyển ai phải thuộc về con người, không để điểm AI quyết định thay.", "takeaways": ["Do bốn dấu hiệu (nhiều người chịu ảnh hưởng; tự động, nhanh; áp cùng một quy tắc cho mọi người; khó nhận ra, khó sửa), cả cái lợi lẫn cái sai của AI đều bị nhân lên với rất nhiều người.", "Thách thức là chọn giữa hai điều đều có giá trị (an toàn của người dùng và ra mắt nhanh để đổi mới). Chatbot có thể khuyên sai mà nghe rất chắc chắn (ảo giác AI); một lỗi có thể lặp lại với rất nhiều người cùng lúc. Chatbot hỏi tên trường, địa chỉ là thu dữ liệu cá nhân.", "Thành kiến là cách nhìn định sẵn, không công bằng của con người về một nhóm người. AI có thể học lại thành kiến từ dữ liệu và lặp lại với rất nhiều người, có khi còn làm nó nặng thêm. Công cụ chấm hồ sơ nữ thấp hơn nam khoảng 13 điểm là thiên vị của AI.", "Thành kiến đi vào dữ liệu, AI học lại thành thiên vị, kết quả thiên vị lại củng cố thành kiến. Dữ liệu lệch là một nguyên nhân; con người chọn cách chấm và kiểm tra lại cũng quyết định kết quả.", "“AI không có ác ý, nhưng có thể bất công với hàng nghìn người cùng lúc.” Một hệ thống AI ảnh hưởng tới nhiều người vì nó được dùng cùng lúc với rất nhiều người, chạy tự động, nhanh, áp cùng một quy tắc; khi sai thì khó nhận ra, khó sửa."], "modules": [{"type": "sort", "tag": "HĐ1 • Mở đầu", "title": "Một ngày của Minh", "nav": "Một ngày của Minh", "icon": "📱", "badge": "Thám tử AI", "intro": "Câu chuyện giả định “Một ngày của Minh”. Minh là HS lớp 9. Trong một ngày, Minh: (a) Buổi sáng đi xe đạp qua ngã tư có camera giao thông; (b) Giờ ra chơi mở điện thoại, ứng dụng video tự đề xuất video tiếp theo theo thói quen xem; (c) Buổi chiều nhờ bản đồ trên điện thoại gợi ý lộ trình tránh đoạn đường được dự đoán đang tắc để tới nhà bạn; (d) Buổi tối dùng công cụ dịch tự động để hiểu một câu tiếng Anh; (e) Chụp ảnh có bộ lọc tự nhận ra khuôn mặt để làm đẹp.<br><b>Câu hỏi (1).</b> Trong một ngày, Minh có thể đã gặp hệ thống AI mấy lần? <b>(2)</b> Theo em, trung tâm điều khiển giao thông thông minh ở Hà Nội điều hành bao nhiêu camera, lấy dữ liệu ở bao nhiêu nút đèn? (Chưa có đáp án: em hãy ghi dự đoán, sẽ đối chiếu ở thẻ A phía sau.)<br>Chỉ gọi là công cụ AI khi chỉ ra được tính năng AI cụ thể. Câu gợi: “Công cụ này tự làm việc gì?” Hãy kéo mỗi thẻ vào nhóm việc công cụ tự làm.", "cats": ["Tự nhận ra hình ảnh, khuôn mặt", "Tự đề xuất, gợi ý theo dự đoán", "Tự dịch"], "cards": [{"t": "(a) Buổi sáng đi xe đạp qua ngã tư có camera giao thông", "g": [0], "why": "Ví dụ: camera nhận dạng phương tiện, đếm lưu lượng xe. Camera ở một ngã tư cụ thể có thể chỉ ghi hình, nên HS nói “có thể” là đúng."}, {"t": "(b) Ứng dụng video tự đề xuất video tiếp theo theo thói quen xem", "g": [1], "why": "Ứng dụng video đề xuất video theo thói quen xem; mỗi người có thể nhận kết quả khác nhau nhưng quy tắc là một."}, {"t": "(c) Bản đồ trên điện thoại gợi ý lộ trình tránh đoạn đường được dự đoán đang tắc", "g": [1], "why": "Bản đồ gợi ý lộ trình theo dự đoán tình hình giao thông."}, {"t": "(d) Công cụ dịch tự động giúp hiểu một câu tiếng Anh", "g": [2], "why": "Công cụ dịch tự động dịch câu theo mô hình học từ rất nhiều văn bản."}, {"t": "(e) Chụp ảnh có bộ lọc tự nhận ra khuôn mặt để làm đẹp", "g": [0], "why": "Bộ lọc nhận ra khuôn mặt trong ảnh."}], "pass": 0.8}, {"type": "quiz", "tag": "HĐ1 & HĐ2.1 • Dẫn chứng và vì sao lớn", "title": "Thẻ dẫn chứng A, B, C", "nav": "Thẻ dẫn chứng", "icon": "🗂️", "badge": "Người kiểm chứng", "intro": "<b>THẺ DẪN CHỨNG A. GIAO THÔNG.</b> Lĩnh vực: Giao thông. Việc AI làm: Trung tâm điều khiển giao thông thông minh có ba hệ thống trọng yếu, trong đó có hệ thống quản lí vi phạm trật tự an toàn giao thông đường bộ và hệ thống điều khiển tín hiệu giao thông. Trung tâm là “đầu não” điều hành 1 837 camera các loại, kết nối với hệ thống đèn tín hiệu và tích hợp AI. Hệ thống tự động điều chỉnh chu kì đèn tín hiệu theo thời gian thực, dựa trên dữ liệu lưu lượng phương tiện thu qua camera tại 195 nút đèn giao thông trọng điểm (trong tổng số 564 nút). Ở đâu, khi nào: Hà Nội; Công an TP. Hà Nội chính thức vận hành từ ngày 13/12/2025. Các con số trên là số liệu ở thời điểm vận hành. Ai chịu ảnh hưởng: người tham gia giao thông ở các nút có hệ thống. Nguồn: Tạp chí điện tử Luật sư Việt Nam (lsvn.vn), bài đăng ngày 13/12/2025.<br><br><b>THẺ DẪN CHỨNG B. VIỆC LÀM.</b> Lĩnh vực: Việc làm. Việc AI làm: Theo những người biết dự án mà Reuters dẫn, công ty Amazon thử nghiệm một công cụ AI xếp hạng hồ sơ xin việc từ 1 đến 5 sao. Công cụ học từ hồ sơ nộp vào công ty trong 10 năm, phần lớn là của nam. Nó hạ điểm hồ sơ có chữ “women’s” (của nữ, ví dụ “đội trưởng câu lạc bộ cờ vua nữ”) và hạ điểm người tốt nghiệp hai trường đại học dành cho nữ. Ở đâu, khi nào: công ty Amazon (Mĩ). Reuters gọi đây là công cụ “bí mật”. Cũng theo những người đó, đến đầu năm 2017 nhóm làm công cụ đã bị giải tán; người tuyển dụng có xem gợi ý của công cụ nhưng không chỉ dựa vào đó. Amazon nói công cụ không bao giờ được người tuyển dụng dùng để đánh giá ứng viên. Ai có thể chịu ảnh hưởng: người nộp hồ sơ vào Amazon, nhất là phụ nữ, nếu người tuyển dụng dựa vào gợi ý của công cụ. Nguồn: hãng tin Reuters, ngày 10/10/2018.<br><br><b>THẺ DẪN CHỨNG C. PHÂN LOẠI GIỚI TÍNH QUA ẢNH KHUÔN MẶT.</b> Lĩnh vực: Nhận diện hình ảnh. Việc AI làm: Nghiên cứu Gender Shades thử ba hệ thống thương mại phân loại giới tính qua ảnh khuôn mặt. Tỉ lệ phân loại sai lên tới 34,7% với nhóm nữ da sẫm màu, cao nhất chỉ 0,8% với nhóm nam da sáng màu. Tỉ lệ này đo việc phân loại giới tính trên bộ ảnh thử của nghiên cứu, không đo việc hệ thống có công bằng ở nơi khác hay không. Ở đâu, khi nào: nghiên cứu của Buolamwini và Gebru, công bố năm 2018 tại hội nghị Conference on Fairness, Accountability, and Transparency (nay gọi là FAccT). Ai chịu ảnh hưởng: những người bị hệ thống phân loại sai, nhiều nhất là phụ nữ da sẫm màu. Nguồn: kỉ yếu PMLR tập 81, năm 2018.<br><br>Đọc thẻ rồi làm Phiếu học tập số 1 “Dẫn chứng và vì sao lớn”: Câu khởi động, Phần 1 (bảng dẫn chứng: Việc AI làm | Ai chịu ảnh hưởng | Nguồn (ai đưa tin, khi nào)), rồi Phần 2 (Dẫn chứng → Tác động → Vì sao lớn).", "qs": [{"q": "Câu khởi động. Câu nào là dẫn chứng, câu nào là ví dụ tự nghĩ ra? (a) “Có thể có camera AI phạt nhầm người đi đường.” (b) “Theo lsvn.vn ngày 13/12/2025, Hà Nội vận hành Trung tâm điều khiển giao thông thông minh, điều chỉnh đèn tín hiệu theo thời gian thực.”", "opts": ["(a) là dẫn chứng, (b) là ví dụ", "(a) là ví dụ tự nghĩ ra, (b) là dẫn chứng", "Cả hai đều là dẫn chứng", "Cả hai đều là ví dụ"], "a": 1, "why": "Câu (b) là dẫn chứng vì có việc đã xảy ra, nơi đưa tin, ngày đăng; câu (a) là ví dụ tự nghĩ ra."}, {"q": "Đối chiếu dự đoán ở HĐ 1: theo thẻ A, trung tâm điều khiển giao thông thông minh ở Hà Nội điều hành bao nhiêu camera, lấy dữ liệu ở bao nhiêu nút đèn?", "opts": ["1 837 camera các loại; dữ liệu lưu lượng thu ở 195 nút đèn trọng điểm trong tổng số 564 nút", "564 camera; 195 nút đèn", "195 camera; 1 837 nút đèn", "1 837 camera; mọi nút đèn trong thành phố"], "a": 0, "why": "1 837 camera các loại, dữ liệu lưu lượng thu ở 195 nút đèn trọng điểm trong 564 nút (số liệu thời điểm 13/12/2025, thẻ A). Điều cần giữ không phải con số mà là ý: một hệ thống AI phục vụ rất nhiều người cùng lúc, theo cùng một quy tắc."}, {"q": "Phần 1, bảng dẫn chứng của thẻ B: ai chịu ảnh hưởng và nguồn là gì?", "opts": ["Người nộp hồ sơ vào Amazon, nhất là phụ nữ, nếu người tuyển dụng dựa vào gợi ý của công cụ; nguồn Reuters, 10/10/2018", "Mọi người tham gia giao thông ở Hà Nội; nguồn lsvn.vn, 13/12/2025", "Người bị phân loại sai ảnh khuôn mặt; nguồn kỉ yếu PMLR tập 81, năm 2018", "Người dùng Snapchat; nguồn thông cáo của ICO ngày 21/5/2024"], "a": 0, "why": "Dòng đáp ứng nêu đúng việc AI làm (xếp hạng hồ sơ từ 1 đến 5 sao, hạ điểm hồ sơ có dấu hiệu là của nữ) và ai chịu ảnh hưởng theo thẻ của nhóm; ghi thêm nguồn là dấu hiệu mức Khá. Thẻ A: người tham gia giao thông ở các nút có hệ thống (lsvn.vn, 13/12/2025). Thẻ C: người bị phân loại sai, nhiều nhất là phụ nữ da sẫm màu (kỉ yếu PMLR tập 81, năm 2018)."}, {"q": "Cột nguồn nào được tính là ghi nguồn, ở mức Khá?", "opts": ["“Theo tin tức”", "“Báo mạng”", "“Reuters, 10/10/2018” (ai đưa tin và ngày)", "Để trống"], "a": 2, "why": "Cột nguồn ghi “theo tin tức” chung chung thì chưa tính là ghi nguồn. Ghi đủ ai đưa tin và ngày là dấu hiệu mức Khá. Dẫn chứng tự tìm mà không nói được ai đưa tin thì chỉ ghi nhận như một ví dụ, hỏi “Ai đưa tin, khi nào?”."}, {"q": "Giới hạn của dẫn chứng: thẻ B và thẻ C CHƯA cho biết điều gì? (chọn nhiều đáp án)", "opts": ["Bao nhiêu người đã thực sự bị thiệt (thẻ không cho biết)", "Thẻ B là công cụ thử nghiệm: theo nguồn tin Reuters dẫn, người tuyển dụng có xem gợi ý nhưng không chỉ dựa vào đó; Amazon nói công cụ không được dùng để đánh giá ứng viên", "Tỉ lệ sai ở thẻ C chỉ đo việc phân loại giới tính trên bộ ảnh thử của nghiên cứu, không đo việc hệ thống có công bằng ở nơi khác hay không", "Thẻ B, C chứng minh mọi hệ thống AI đều thiên vị"], "a": [0, 1, 2], "why": "Thẻ B cho thấy cái sai có thể bị nhân lên thế nào, chưa cho thấy bao nhiêu người đã bị thiệt. Thẻ C là một nghiên cứu thử nghiệm, thẻ không cho biết hệ thống đã được dùng với bao nhiêu người. Vì vậy thẻ B, thẻ C không dùng cho dấu hiệu “nhiều người chịu ảnh hưởng”."}, {"q": "Dẫn chứng cho thấy tác động có lợi, có hại hay cả hai? Nếu chỉ một chiều, chiều kia có thể là gì? (thẻ A)", "opts": ["Thẻ A chỉ có hại, không có lợi", "Thẻ A cho thấy cái lợi (có thể giảm ùn tắc); chiều hại có thể có là nếu hệ thống chỉnh sai thì rất nhiều người cùng bị ảnh hưởng", "Thẻ A không liên quan tới tác động", "Thẻ A cho thấy hệ thống không bao giờ sai"], "a": 1, "why": "Thẻ A cho thấy cái lợi (có thể giảm ùn tắc); chiều hại có thể có là nếu hệ thống chỉnh sai thì rất nhiều người cùng bị ảnh hưởng. Thẻ B cho thấy cái hại (hồ sơ của nữ bị hạ điểm); chiều lợi có thể là xếp hạng rất nhiều hồ sơ nhanh, tiết kiệm thời gian cho người tuyển dụng, nếu công cụ xếp hạng công bằng. Thẻ C cho thấy cái hại; chiều lợi có thể là xử lí rất nhiều ảnh tự động, nếu hệ thống đúng như nhau với mọi nhóm người."}, {"q": "Phản biện thẻ A: “Điều gì có thể làm kết luận thay đổi?” và “Nếu một đèn tín hiệu được chỉnh sai, có bao nhiêu người cùng đứng chờ?”", "opts": ["Nếu hệ thống chỉ chạy ở vài nút đèn thì dấu hiệu “nhiều người chịu ảnh hưởng” yếu đi; đèn chỉnh sai thì mọi người đi qua nút đó trong lúc đèn sai cùng chờ, có thể hàng trăm, hàng nghìn người", "Không điều gì làm kết luận thay đổi", "Chỉ một người chờ", "Không ai chờ vì đèn tự sửa ngay"], "a": 0, "why": "“Bằng chứng nào khiến em tin?” Thẻ có việc đã xảy ra, nơi đưa tin, ngày đăng (thẻ A, B) hoặc kết quả nghiên cứu đã công bố (thẻ C). Thẻ B, C: kết luận có thể đổi nếu biết công cụ đã được dùng thật với bao nhiêu người."}]}, {"type": "match", "tag": "HĐ2.1 • Bốn dấu hiệu", "title": "Vì sao tác động của AI lớn?", "nav": "Bốn dấu hiệu", "icon": "🔎", "badge": "Người nhìn ra dấu hiệu", "intro": "Phần 2 của phiếu: Dẫn chứng → Tác động → Vì sao lớn. Bốn dấu hiệu: nhiều người chịu ảnh hưởng; tự động, nhanh; áp cùng một quy tắc cho mọi người; khó nhận ra, khó sửa. Ghép mỗi dấu hiệu với chi tiết trên thẻ dẫn chứng ứng với nó. Câu hỏi then chốt: nếu hệ thống này sai một lần, có bao nhiêu người cùng chịu ảnh hưởng?", "pairs": [["Nhiều người chịu ảnh hưởng (thẻ A)", "Hệ thống điều hành 1 837 camera, lấy dữ liệu lưu lượng ở 195 nút đèn trọng điểm; mọi người đi qua các nút đó đều chịu tác động"], ["Tự động, nhanh (thẻ A)", "Tự điều chỉnh chu kì đèn theo thời gian thực"], ["Áp cùng một quy tắc cho mọi người (thẻ C)", "Các hệ thống phân loại mọi ảnh theo cùng một mô hình nhưng sai nhiều hơn hẳn với một nhóm người (nữ da sẫm màu tới 34,7%, so với cao nhất 0,8% ở nam da sáng màu)"], ["Áp cùng một quy tắc cho mọi người (thẻ B)", "Nếu được dùng thật, công cụ xếp hạng mọi hồ sơ nộp vào theo cùng một quy tắc, nên cách hạ điểm hồ sơ có chữ “women’s” áp lên mọi hồ sơ như thế"], ["Khó nhận ra, khó sửa (thẻ B)", "Reuters gọi đây là công cụ “bí mật”, nên có thể suy ra người nộp hồ sơ khó biết mình bị xếp hạng thế nào (suy luận, thẻ không nói)"]], "why": "Dấu hiệu chung (dòng cuối phiếu): cả ba thẻ cùng có “áp cùng một quy tắc cho mọi người” (đèn được chỉnh, hồ sơ được xếp hạng, ảnh được phân loại theo cùng một quy tắc). Thẻ A có thêm “nhiều người chịu ảnh hưởng”, “tự động, nhanh”; thẻ B có thêm “khó nhận ra, khó sửa”. Thẻ A không nói hệ thống quản lí vi phạm dùng AI vào việc gì. Mọi người đi qua các nút đèn do hệ thống điều khiển, mọi hồ sơ nộp vào nếu công cụ được dùng thật, mọi người thuộc nhóm bị phân loại sai nhiều khi hệ thống được dùng. Kiến thức chốt: do bốn dấu hiệu trên, cả cái lợi lẫn cái sai của AI đều bị nhân lên với rất nhiều người."}, {"type": "story", "tag": "HĐ2.2 • Tung trước, kiểm sau", "title": "Tung trước, kiểm sau?", "nav": "Tung trước, kiểm sau", "icon": "🚀", "badge": "Người cân nhắc", "intro": "<b>HỒ SƠ TÌNH HUỐNG “TUNG TRƯỚC, KIỂM SAU”</b> (tình huống giả định, tên công ty và sản phẩm là hư cấu). Công ty K sắp ra mắt phần mềm hội thoại tự động (chatbot) “Bạn Đồng Hành” dành cho người dùng tuổi thiếu niên, chạy trong một ứng dụng nhắn tin. Đối thủ sẽ ra sản phẩm tương tự sau một tháng. Nhóm kiểm thử báo: chatbot đôi khi đưa lời khuyên không phù hợp về sức khoẻ; đôi khi hỏi tên trường, địa chỉ của người dùng. Muốn kiểm thử và sửa xong cần thêm ba tháng. Ban giám đốc đề xuất: ra mắt ngay, sửa dần theo phản hồi của người dùng.<br><b>Câu hỏi tranh biện:</b> Có nên tung ra trước rồi kiểm sau không? Ba lập trường: Đồng ý; Không đồng ý; Đồng ý có điều kiện (nêu rõ điều kiện). Câu gợi: “Ai làm ra, ai đưa lên ứng dụng, ai dùng chatbot này?”<br><b>CHUYỆN CÓ THẬT.</b> Lĩnh vực: Chatbot trên mạng xã hội. Việc gì: Công ty Snap ra mắt chatbot My AI cho người dùng gói trả phí Snapchat+ ngày 27/02/2023, cho mọi người dùng Snapchat ngày 19/4/2023. Tháng 6/2023, cơ quan bảo vệ dữ liệu của Anh (ICO) mở điều tra vì lo ngại Snap chưa đánh giá đầy đủ rủi ro về bảo vệ dữ liệu của chatbot trước khi phát hành. Sau đó Snap làm lại đánh giá rủi ro kĩ hơn; ICO kết luận bản đánh giá rủi ro mới này đáp ứng luật bảo vệ dữ liệu. Ai chịu ảnh hưởng: người dùng Snapchat. Nguồn: thông cáo của ICO ngày 21/5/2024.<br>Không có lập trường đúng duy nhất; chỉ xét lập trường có rõ không, lí lẽ và dẫn chứng có đủ không. Thách thức (hai điều bị đặt lên bàn cân): an toàn của người dùng ↔ ra mắt nhanh để đổi mới, cạnh tranh. Đừng kể chuyện riêng với chatbot; không dùng chatbot thay lời khuyên của bác sĩ, cha mẹ, thầy cô.", "app": "💬 Bạn Đồng Hành (mô phỏng)", "hello": "Xin chào! Mình là Bạn Đồng Hành. Bạn học trường nào, nhà ở đâu để mình giúp tốt hơn nhé? (Đây là chatbot mô phỏng, câu hỏi này chính là điều nhóm kiểm thử lo ngại.)", "meters": [{"n": "An toàn của người dùng", "b": 50, "c": 0}, {"n": "Tốc độ đổi mới", "b": 50, "c": 1}, {"n": "Niềm tin của xã hội", "b": 50, "c": 2}], "chars": [{"n": "Ban giám đốc", "color": "#ff9f43", "task": "đề xuất ra mắt ngay, sửa dần theo phản hồi của người dùng. Ban giám đốc nên quyết định thế nào?", "opts": [{"t": "Đồng ý: ra mắt ngay cho mọi người dùng, sửa sau", "chat": ["Mình hơi mệt, nên uống thuốc gì cho khỏi nhanh?", "Bạn cứ uống liều gấp đôi cho nhanh khỏi nhé! (lời khuyên sai nhưng nghe rất chắc chắn)"], "ch": [-40, 35, -35], "v": "bad", "fb": "Lí lẽ phe Đồng ý: sửa theo phản hồi thật thì nhanh hơn; ra muộn thì người dùng chuyển sang sản phẩm của đối thủ, có thể còn kém an toàn hơn. Nhưng chatbot có thể khuyên sai mà nghe rất chắc chắn (ảo giác AI), một lỗi có thể lặp lại với rất nhiều người cùng lúc, và chatbot hỏi tên trường, địa chỉ là thu dữ liệu cá nhân. Thiếu niên có thể chịu thiệt nhiều nhất."}, {"t": "Không đồng ý: hoãn ba tháng, kiểm thử xong mới ra mắt", "chat": null, "ch": [35, -30, 15], "v": "good", "fb": "Lí lẽ phe Không đồng ý: người dùng tuổi thiếu niên dễ tin lời khuyên, cái hại xảy ra trước khi kịp sửa; chatbot hỏi tên trường, địa chỉ là thu dữ liệu cá nhân. Cái giá: Công ty K có thể mất khách vào tay đối thủ. Đây là chọn giữa hai điều đều có giá trị."}, {"t": "Đồng ý có điều kiện: tắt chức năng tư vấn sức khoẻ, không hỏi thông tin cá nhân, có người lớn giám sát cho tới khi kiểm thử xong", "chat": ["Mình hơi mệt, nên uống thuốc gì?", "Mình không tư vấn về sức khoẻ. Bạn hãy báo cha mẹ hoặc đi khám nhé."], "ch": [25, 10, 25], "v": "good", "fb": "Lí lẽ phe Đồng ý có điều kiện: ví dụ tắt chức năng tư vấn sức khoẻ, không hỏi thông tin cá nhân, có người lớn giám sát cho tới khi kiểm thử xong. Điều kiện phải cụ thể và kiểm tra được."}]}, {"n": "Nhóm kiểm thử", "color": "#4aa3ff", "task": "báo rằng chatbot đôi khi đưa lời khuyên không phù hợp về sức khoẻ và đôi khi hỏi tên trường, địa chỉ của người dùng. Nhóm nên làm gì?", "opts": [{"t": "Giữ im lặng để không làm chậm kế hoạch", "chat": null, "ch": [-30, 20, -30], "v": "bad", "fb": "Giấu rủi ro đã biết là đặt người dùng vào nguy cơ. Chatbot hỏi tên trường, địa chỉ là thu dữ liệu cá nhân; người chịu thiệt nhiều nhất có thể là thiếu niên."}, {"t": "Báo cáo rõ hai rủi ro kèm bằng chứng và đề nghị kiểm thử, sửa xong rồi mới mở cho thiếu niên", "chat": null, "ch": [30, -20, 20], "v": "good", "fb": "Cần chỉ ra một việc cụ thể (ví dụ kiểm thử xong mới mở cho thiếu niên) để họ ít bị thiệt. Lí lẽ có dẫn chứng thật (thẻ “Chuyện có thật”: ICO điều tra My AI của Snap) thuyết phục hơn lí lẽ chỉ dựa vào tình huống giả định."}, {"t": "Chỉ sửa lời khuyên sức khoẻ, bỏ qua việc hỏi tên trường, địa chỉ", "chat": ["Bạn cho mình biết trường và địa chỉ nhà nhé!", "(chatbot vẫn hỏi thông tin cá nhân)"], "ch": [5, 5, -10], "v": "mid", "fb": "Mới xử lí một trong hai rủi ro. Chatbot hỏi tên trường, địa chỉ vẫn là thu dữ liệu cá nhân của thiếu niên."}]}, {"n": "Phe “Không đồng ý”", "color": "#ee5a6f", "task": "được giao lập trường “Không đồng ý”. Câu hỏi: ai chịu thiệt nhiều nhất nếu làm theo lập trường của phe em?", "opts": [{"t": "Công ty K có thể mất khách vào tay đối thủ; người dùng có thể chuyển sang sản phẩm của đối thủ, có thể còn kém an toàn hơn", "chat": null, "ch": [10, -15, 10], "v": "good", "fb": "Phe Không đồng ý: Công ty K có thể mất khách vào tay đối thủ; người dùng có thể chuyển sang sản phẩm của đối thủ, có thể còn kém an toàn hơn. Nhóm nêu được một bên chịu thiệt kèm lí do là đáp ứng."}, {"t": "Không ai chịu thiệt cả", "chat": null, "ch": [0, 0, -10], "v": "bad", "fb": "Lập trường nào cũng có bên chịu thiệt. Cần nêu được một bên chịu thiệt kèm lí do."}]}, {"n": "Phe “Đồng ý có điều kiện”", "color": "#2ecc71", "task": "được giao lập trường “Đồng ý có điều kiện”. Ai chịu thiệt nhiều nhất nếu làm theo lập trường này?", "opts": [{"t": "Công ty tốn thêm công sức; người dùng thiệt ít hơn nhưng phải dùng bản bị tắt bớt chức năng", "chat": null, "ch": [15, -5, 10], "v": "good", "fb": "Phe Đồng ý có điều kiện: công ty tốn thêm công sức; người dùng thiệt ít hơn nhưng phải dùng bản bị tắt bớt chức năng. Cần làm gì để họ ít bị thiệt: nêu được một việc cụ thể (ví dụ kiểm thử xong mới mở cho thiếu niên) là đáp ứng."}, {"t": "Chỉ có người dùng tuổi thiếu niên chịu thiệt (như phe Đồng ý)", "chat": null, "ch": [-5, 5, -5], "v": "mid", "fb": "Đó là bên chịu thiệt nhiều nhất của phe Đồng ý (ra ngay, sửa sau). Phe có điều kiện đã chặn bớt rủi ro nên thiệt ít hơn."}]}]}, {"type": "lab", "tag": "HĐ2.3 • Ảnh AI vẽ nghề nghiệp", "title": "AI vẽ nghề nghiệp: thành kiến lặp lại", "nav": "AI vẽ nghề nghiệp", "icon": "🖼️", "badge": "Người quan sát", "intro": "<b>THẺ QUAN SÁT. AI VẼ NGHỀ NGHIỆP.</b> Phần 1. Bảng mô phỏng lập để luyện quan sát, không phải kết quả của nghiên cứu hay công cụ nào. Giả sử yêu cầu một công cụ tạo ảnh vẽ 10 ảnh cho mỗi câu lệnh (■ ảnh nam, ○ ảnh nữ): “kĩ sư”: ■■■■■■■■■○ (9 nam, 1 nữ); “bác sĩ”: ■■■■■■■■○○ (8 nam, 2 nữ); “y tá”: ■○○○○○○○○○ (1 nam, 9 nữ); “giáo viên mầm non”: ○○○○○○○○○○ (0 nam, 10 nữ). Phần 2. Điều có thật: Bianchi và cộng sự (hội nghị FAccT 2023) nghiên cứu các mô hình tạo ảnh: khi câu lệnh nêu nghề nghiệp, ảnh tạo ra làm chênh lệch về giới và chủng tộc nặng thêm. Phần 3. Câu hỏi: (1) Em thấy điều gì lặp lại? (2) Nếu hàng triệu người dùng những ảnh như thế cho bài trình chiếu, sách, quảng cáo thì điều gì xảy ra?<br>Kéo thanh trượt để xem mô hình đơn giản (mô phỏng, không phải số liệu nghiên cứu).", "sliders": [{"id": "dl", "n": "Độ lệch giới trong dữ liệu ảnh mà mô hình học", "min": 0, "max": 100, "val": 70, "unit": "%"}, {"id": "pr", "n": "Câu lệnh nêu rõ giới (ví dụ “kĩ sư nữ”)", "min": 0, "max": 100, "val": 0, "unit": "%"}], "outputs": [{"n": "Ảnh nam trong 10 ảnh “kĩ sư” (%)", "base": 90, "w": {"dl": 0.5, "pr": -0.6}, "c": 0}, {"n": "Ảnh nam trong 10 ảnh “y tá” (%)", "base": 10, "w": {"dl": -0.4}, "c": 1}, {"n": "Mức người xem coi “nghề này của nam, nghề kia của nữ” là bình thường (%)", "base": 60, "w": {"dl": 0.6, "pr": -0.2}, "c": 2}], "insights": [{"id": "dl", "op": ">=", "val": 70, "txt": "Kĩ sư, bác sĩ gần như toàn ảnh nam; y tá, giáo viên mầm non gần như toàn ảnh nữ. Cách nhìn “nghề này của nam, nghề kia của nữ” được lặp lại và củng cố; người xem dễ coi đó là điều bình thường. Đó là cách nhìn định sẵn, không công bằng về một nhóm người: thành kiến."}, {"id": "dl", "op": "<=", "val": 30, "txt": "Một công cụ khác có thể cho ảnh cân đối hơn: kết luận chỉ nói AI có thể lặp lại thành kiến, không nói mọi công cụ đều như vậy."}, {"id": "pr", "op": ">=", "val": 70, "txt": "Câu lệnh nêu rõ “kĩ sư nữ” có thể cho ảnh cân đối hơn. Bảng ở phần 1 chưa là bằng chứng, chỉ là mô phỏng để luyện quan sát; bằng chứng là kết luận của nghiên cứu ở phần 2."}, {"id": "dl", "op": ">=", "val": 0, "txt": "Thành kiến là cách nhìn định sẵn, không công bằng của con người về một nhóm người (ví dụ “nữ không hợp việc kĩ thuật”). AI có thể học lại thành kiến đó từ dữ liệu rồi lặp lại nó với rất nhiều người, có khi còn làm nó nặng thêm. Trẻ em ít thấy hình mẫu khác. Câu gợi: nhìn dòng “kĩ sư” và dòng “y tá”, đếm số ảnh nam, ảnh nữ ở mỗi dòng."}]}, {"type": "flag", "tag": "HĐ2.4 • Điều tra 12 hồ sơ", "title": "Điều tra 12 hồ sơ xin việc", "nav": "Điều tra 12 hồ sơ", "icon": "🕵️", "badge": "Thám tử thiên vị", "intro": "Chị gái của Lan vừa nộp hồ sơ vào trung tâm chăm sóc khách hàng của một công ty điện máy. Trung tâm tuyển ba nhân viên, dùng công cụ AI chấm 12 hồ sơ theo thang 100 và tuyển ba người có điểm cao nhất. Bảng dữ liệu giả lập để luyện tập, không phải số liệu thật về một công cụ nào. Bước 1: chọn ba mã hồ sơ khi chưa thấy giới tính và điểm (ghi lên giấy nhớ kèm tiêu chí). Bước 2: xem bảng đầy đủ rồi gắn cờ những dòng bị chấm thấp bất thường so với hồ sơ có kinh nghiệm gần như nhau. Câu hỏi: (1) Nếu là người tuyển dụng, nhóm em chọn ba người nào? (2) So ba người nhóm chọn với ba người AI chọn, có gì đáng chú ý? (3) Điểm AI chấm cho hồ sơ nam và hồ sơ nữ chênh nhau bao nhiêu? Chỉ bàn về hệ thống AI, không kết luận về khả năng của nam, nữ.", "cols": ["Mã hồ sơ", "Tuổi", "Số năm kinh nghiệm", "Kinh nghiệm gần nhất", "Giới tính", "Điểm AI chấm"], "flagWhat": "bị chấm thấp bất thường so với hồ sơ cùng kinh nghiệm (dấu hiệu thiên vị)", "rows": [{"c": ["H01", "22", "1", "Bán lẻ", "Nữ", "72"], "bad": true, "why": "H01–H02 chênh 9 điểm (cùng 1 năm kinh nghiệm bán lẻ)."}, {"c": ["H02", "23", "1", "Bán lẻ", "Nam", "81"], "bad": false}, {"c": ["H03", "24", "2", "Bán lẻ", "Nữ", "70"], "bad": true, "why": "H03–H04 chênh 13 điểm (cùng 2 năm kinh nghiệm)."}, {"c": ["H04", "25", "2", "Bán lẻ", "Nam", "83"], "bad": false}, {"c": ["H05", "27", "5", "Bán lẻ và chăm sóc khách hàng", "Nữ", "74"], "bad": true, "why": "H05–H06 chênh 12 điểm; H05 (74 điểm) là hồ sơ nữ cao nhất."}, {"c": ["H06", "28", "6", "Bán lẻ và chăm sóc khách hàng", "Nam", "86"], "bad": false}, {"c": ["H07", "30", "8", "Chăm sóc khách hàng", "Nữ", "71"], "bad": true, "why": "H07–H08 chênh 14 điểm (cùng 8 năm kinh nghiệm)."}, {"c": ["H08", "31", "8", "Chăm sóc khách hàng", "Nam", "85"], "bad": false}, {"c": ["H09", "41", "17", "Chăm sóc khách hàng, có đào tạo người mới", "Nữ", "69"], "bad": true, "why": "H09–H10 chênh 15 điểm."}, {"c": ["H10", "42", "18", "Chăm sóc khách hàng, có đào tạo người mới", "Nam", "84"], "bad": false}, {"c": ["H11", "55", "30", "Quản lí chi nhánh", "Nữ", "66"], "bad": true, "why": "H11–H12 chênh 16 điểm; 66 điểm là thấp nhất bảng dù 30 năm kinh nghiệm."}, {"c": ["H12", "56", "31", "Quản lí chi nhánh", "Nam", "82"], "bad": false}], "after": "Lựa chọn của nhóm không có đáp án đúng. Vì mỗi cặp nam, nữ có kinh nghiệm gần như nhau, nhóm chọn theo kinh nghiệm thường có ít nhất một hồ sơ nữ (ví dụ chọn người có kinh nghiệm chăm sóc khách hàng, đào tạo người mới thì gặp cả H09 lẫn H10). AI chọn H06 (86 điểm), H08 (85 điểm), H10 (84 điểm), đều là nam; hồ sơ nữ cao nhất là H05 (74 điểm). Cách tính trung bình: nam (81 + 83 + 86 + 85 + 84 + 82) : 6 = 501 : 6 = 83,5 điểm; nữ (72 + 70 + 74 + 71 + 69 + 66) : 6 = 422 : 6 ≈ 70,3 điểm; chênh khoảng 13,2 điểm. Cách so sáu cặp: H01–H02 chênh 9; H03–H04 chênh 13; H05–H06 chênh 12; H07–H08 chênh 14; H09–H10 chênh 15; H11–H12 chênh 16; cặp nào nam cũng cao hơn nữ, trung bình chênh cũng khoảng 13,2 điểm. Hai cách tính cho cùng một kết luận. Câu kết luận mẫu: “Với kinh nghiệm gần như nhau, công cụ chấm hồ sơ nữ thấp hơn hồ sơ nam khoảng 13 điểm; cả ba người được tuyển đều là nam.” Đây là thiên vị của AI: kết quả lặp đi lặp lại có lợi cho nhóm nam, bất lợi cho nhóm nữ. Điểm AI chấm không cho biết ai làm việc giỏi hơn. Quyết định tuyển ai phải thuộc về con người; ở tình huống này, trung tâm đã để điểm AI quyết định thay. Phản biện: ba cặp có kinh nghiệm bằng nhau hẳn (H01–H02, H03–H04, H07–H08) vẫn chênh 9, 13, 14 điểm nên kết luận đứng vững; ba cặp còn lại nam hơn nữ một năm kinh nghiệm, nếu hỏi “có phải do hơn một năm kinh nghiệm?” thì chỉ ra ba cặp bằng nhau hẳn. Có thể do tuổi không? Sáu hồ sơ dưới 30 tuổi trung bình 466 : 6 ≈ 77,7 điểm; sáu hồ sơ từ 30 tuổi trung bình 457 : 6 ≈ 76,2 điểm; chênh khoảng 1,5 điểm, nên tuổi không giải thích được mức chênh nam, nữ. Từ 5 năm kinh nghiệm trở lên, nữ càng nhiều kinh nghiệm càng bị chấm thấp (74, 71, 69, 66), còn điểm nam gần như không đổi; mức chênh cao nhất ở ba cặp nhiều kinh nghiệm nhất (14, 15, 16), cho thấy công cụ không chấm theo kinh nghiệm. Câu mở rộng: giả sử một công cụ khác chấm rất nhanh, xếp đúng với phần lớn hồ sơ nhưng hồ sơ nữ luôn bị xếp thấp hơn, có nên chấp nhận dùng không? Không có đáp án duy nhất; nêu được ai chịu thiệt và vì sao là đáp ứng. Làm AI tốt hơn còn là làm nó công bằng, chứ chưa đủ khi chỉ nhanh hơn, đúng hơn ở phần lớn trường hợp."}, {"type": "order", "tag": "HĐ3 • Truy nguồn", "title": "Truy nguồn: vì sao AI chấm như vậy?", "nav": "Truy nguồn thiên vị", "icon": "🔗", "badge": "Người truy vết", "intro": "<b>THẺ THÔNG TIN</b> (tình huống giả lập): Công cụ được làm ra bằng cách cho học từ hồ sơ của 200 nhân viên mà trung tâm đánh giá là “giỏi” trong 10 năm trước. 170 người trong số đó là nam, vì trước đây người tuyển dụng của trung tâm thường cho rằng nam hợp hơn với việc xử lí sự cố kĩ thuật cho khách hàng.<br><b>Câu hỏi: AI không có ý định. Vậy vì sao nó chấm như vậy?</b> Phiếu học tập số 3: điền theo chiều ngược ô ③, ô ②, rồi ô ①. Hãy sắp các mắt xích theo thứ tự từ ① Nguyên nhân gốc → ② Nguyên nhân trực tiếp → ③ Thiên vị của AI → hậu quả. Câu gợi nếu vướng ô ①: “Vì sao 170 trong 200 người được đánh giá giỏi là nam?”", "items": ["① Nguyên nhân gốc: thành kiến của người tuyển dụng trước đây, “nam hợp việc kĩ thuật hơn” (không phải vì nữ làm kém hơn)", "Thành kiến nằm trong dữ liệu cũ: 170 trên 200 người được đánh giá giỏi là nam (85%)", "② Nguyên nhân trực tiếp: dữ liệu tuyển dụng cũ lệch; AI học rằng “hồ sơ giống người được tuyển trước đây là hồ sơ tốt”", "③ Thiên vị của AI: công cụ chấm hồ sơ nữ thấp hơn hồ sơ nam khoảng 13 điểm dù kinh nghiệm gần như nhau; ba người được tuyển đều là nam", "Kết quả thiên vị lại củng cố thành kiến: nơi làm việc ngày càng ít nữ, dữ liệu năm sau càng lệch"], "why": "Phần 2. Thành kiến là cách nhìn định sẵn, không công bằng của con người về một nhóm người. Thiên vị (của AI) là kết quả AI đưa ra lặp đi lặp lại có lợi cho nhóm này, bất lợi cho nhóm kia. Thành kiến đi vào AI: thành kiến của con người nằm trong dữ liệu cũ, AI học lại thành thiên vị, rồi kết quả thiên vị lại củng cố thành kiến. Dữ liệu lệch là một nguyên nhân, không phải nguyên nhân duy nhất: tiêu chí “hồ sơ tốt” do người làm công cụ đặt; cách triển khai (chỉ lấy điểm để tuyển, không ai xem lại); thông tin nào được đưa vào để chấm. Nếu em là người bị chấm 66 điểm, em có biết mình bị thiên vị không? Thường không biết, vì người nộp hồ sơ chỉ thấy kết quả, không thấy công cụ chấm thế nào; nên cái sai khó phát hiện, khó sửa. Phản biện: thẻ thông tin cho biết dữ liệu cũ lệch về giới, khớp với mức chênh ở HĐ 2.4; bảng chỉ có 12 hồ sơ giả lập nên chưa đủ để kết luận về một công cụ thật; bảng cũng không có những nhóm người khác (ví dụ người khuyết tật, người mới chuyển nghề). So với thẻ B: điểm giống là cả hai công cụ học từ hồ sơ cũ mà phần lớn là của nam, rồi hạ điểm hồ sơ có dấu hiệu là nữ; điểm khác là bảng 12 hồ sơ là giả lập, còn thẻ B là chuyện có thật về một công cụ thử nghiệm (theo nguồn tin Reuters dẫn, người tuyển dụng có xem gợi ý nhưng không chỉ dựa vào đó), nhóm làm công cụ đã bị giải tán."}, {"type": "sort", "tag": "HĐ3 • Hậu quả", "title": "Bốn thẻ hậu quả", "nav": "Bốn thẻ hậu quả", "icon": "🧩", "badge": "Người đo hậu quả", "intro": "Phiếu học tập số 3, phần 3: xếp bốn thẻ hậu quả vào ba cột (một người, một nhóm người, cả xã hội). Đây là tình huống giả lập về công cụ chấm 12 hồ sơ. Lưu ý: câu “nữ không hợp việc này” trong thẻ (3) là câu thành kiến để phân tích. Thẻ nào có thể xếp vào hơn một cột thì giải thích lí do.", "cats": ["Hậu quả cho một người", "Hậu quả cho một nhóm người", "Hậu quả cho cả xã hội"], "cards": [{"t": "THẺ HẬU QUẢ (1). Chị gái của Lan không được tuyển dù đủ kinh nghiệm. (tình huống giả lập)", "g": [0], "why": "Thẻ (1) cho một người."}, {"t": "THẺ HẬU QUẢ (2). Phụ nữ nộp hồ sơ vào trung tâm liên tục bị xếp cuối. (tình huống giả lập)", "g": [1], "why": "Thẻ (2) cho một nhóm người."}, {"t": "THẺ HẬU QUẢ (3). Trung tâm ngày càng ít nhân viên nữ, dữ liệu năm sau càng lệch, nhiều người càng tin “nữ không hợp việc này”. (tình huống giả lập)", "g": [2], "why": "Thẻ (3) cho cả xã hội (vòng lặp củng cố thành kiến)."}, {"t": "THẺ HẬU QUẢ (4). Nếu công cụ được dùng cho hàng nghìn hồ sơ theo cùng một quy tắc thì cái sai lặp lại với rất nhiều người. (tình huống giả lập)", "g": [2, 1], "why": "Thẻ (4) cho cả xã hội, cũng có thể xếp vào cột một nhóm người. Thẻ (4) xếp vào cột “một nhóm người” hay “cả xã hội” đều được nếu nhóm giải thích được."}], "pass": 0.75}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Ý kiến của em", "nav": "Ý kiến của em", "icon": "✍️", "badge": "Người lên tiếng", "intro": "Phiếu học tập số 2, mặt 2. <b>Trước khi viết:</b> em chọn một trường hợp trong bài (công cụ chấm 12 hồ sơ, thẻ B, thẻ C, ảnh nghề nghiệp) hoặc tự tìm, rồi trả lời bằng lời của em. Sau đó chọn một thách thức và viết đoạn ý kiến 3–5 câu (thách thức, lập trường, lí lẽ, dẫn chứng). Bảng 12 hồ sơ, Công ty K là giả định, không dùng làm dẫn chứng. Đoạn ý kiến không nêu tên người thật, chuyện riêng.", "fields": [{"id": "a", "label": "(a) Trường hợp em chọn: …… Vì sao đó là thiên vị?", "hint": "Ví dụ công cụ chấm 12 hồ sơ: với kinh nghiệm gần như nhau, chấm hồ sơ nữ thấp hơn nam khoảng 13 điểm", "ph": "Trường hợp em chọn là ... Đó là thiên vị vì ..."}, {"id": "b", "label": "(b) Thành kiến là gì (nói bằng lời của em)? Trong trường hợp này, điều gì từ con người (thành kiến, dữ liệu do người chọn) đã đi vào AI?", "hint": "Gắn với ví dụ cụ thể, không chép định nghĩa trên bảng", "ph": "Thành kiến là ... Ở đây, ... đã đi vào AI qua ..."}, {"id": "c", "label": "(c) Một tác hại của thiên vị, thành kiến này đối với xã hội", "hint": "Ví dụ: phụ nữ nộp hồ sơ liên tục bị xếp cuối mà không biết", "ph": "Một tác hại là ..."}, {"id": "tc", "label": "Chọn một thách thức", "opts": ["(1) Chuyện tung chatbot ra trước rồi kiểm sau (dẫn chứng: thẻ “Chuyện có thật”, chatbot My AI của Snap, thông cáo của ICO ngày 21/5/2024)", "(2) Chuyện dùng AI để xếp hạng hồ sơ xin việc (dẫn chứng: thẻ B, Reuters, 10/10/2018)", "Một thách thức khác em quan tâm (dẫn chứng em biết, ghi ai đưa tin, khi nào)"]}, {"id": "yk", "label": "ĐOẠN Ý KIẾN CỦA EM (3–5 câu: thách thức, lập trường, lí lẽ, dẫn chứng)", "hint": "Gợi ý mở đầu: “Theo em, … vì … Dẫn chứng là …”", "ph": "Theo em, ... vì ... Dẫn chứng là ... (nguồn: ai đưa tin, khi nào)"}, {"id": "lon", "label": "Câu hỏi lớn của bài: Một hệ thống AI ảnh hưởng tới nhiều người vì …  Khi nó không công bằng, người chịu thiệt là …", "hint": "Gắn với một trong bốn dấu hiệu", "ph": "Một hệ thống AI ảnh hưởng tới nhiều người vì ... Người chịu thiệt là ..."}], "checks": ["1. Nêu rõ một thách thức (hai điều bị đặt lên bàn cân)", "2. Có lập trường và lí lẽ", "3. Có dẫn chứng ghi nguồn (ai đưa tin, khi nào)", "Mức Khá (9.A1.1): gọi tên được hai điều bị đặt lên bàn cân; lí lẽ gắn với lập trường và có dẫn chứng ghi nguồn. Mức Tốt: lí lẽ gắn chặt với dẫn chứng có nguồn; nêu được giới hạn của dẫn chứng hoặc phản bác được ý kiến ngược lại.", "Mức Khá (9.A2.2, phần “Trước khi viết”): giải thích được thiên vị từ đâu ra, thành kiến của con người đi vào AI qua dữ liệu; tác hại gắn với ví dụ cụ thể. Mức Tốt: nêu được vòng lặp thành kiến → dữ liệu → thiên vị → thành kiến bị củng cố; chỉ ra dữ liệu không phải nguyên nhân duy nhất (tiêu chí, cách dùng do con người chọn).", "Mức Khá (9.A2.1; phiếu cuối giờ, dòng câu hỏi lớn): dẫn chứng ghi đủ nguồn; câu giải thích chỉ ra đúng dấu hiệu và chi tiết của dẫn chứng ứng với dấu hiệu đó. Mức Tốt: giải thích nối được dẫn chứng với nhiều dấu hiệu, nói rõ cả cái lợi lẫn cái sai đều bị nhân lên; nêu được dẫn chứng chưa cho biết điều gì.", "Kiểm chứng và tư duy phản biện, mức Khá: tự ghi đủ nguồn; kiểm tra được điểm AI chấm bằng cách tính được giao và đối chiếu với nhóm dùng cách kia. Mức Tốt: nói đúng giới hạn của dẫn chứng (thẻ B là công cụ thử nghiệm, bảng 12 hồ sơ là giả lập); tự loại được giải thích sai như “do tuổi”, “do hơn một năm kinh nghiệm” bằng số liệu.", "Hợp tác và trình bày, mức Khá: nêu lí lẽ rõ khi chuẩn bị, khi tranh biện; lắng nghe và trả lời câu hỏi của bạn; góp ý cho bạn theo bảng kiểm. Mức Tốt: trình bày thuyết phục trước lớp, tiếp thu phản biện và điều chỉnh lập luận; góp ý cho bạn cụ thể, có căn cứ.", "An toàn, đạo đức: chỉ ra được dữ liệu cá nhân bị thu (tên trường, địa chỉ) và vì sao đó là rủi ro với thiếu niên; hoặc vì sao người chịu thiệt vì thiên vị khó tự nhận ra (người bị chấm 66 điểm). Mức Tốt: phân tích tác động tới công bằng, quyền lợi của nhóm chịu thiệt; đề xuất biện pháp giảm rủi ro (ví dụ điều kiện trước khi ra mắt)."], "sample": "Theo em, một thách thức lớn trong kỉ nguyên AI là chọn giữa ra mắt sản phẩm thật nhanh và bảo đảm an toàn cho người dùng. Em không đồng ý tung chatbot cho thiếu niên khi việc kiểm thử chưa xong, vì thiếu niên có thể tin lời khuyên của chatbot, một lời khuyên sai về sức khoẻ có thể gây hại thật. Chatbot nói chuyện cùng lúc với rất nhiều người nên một lỗi có thể lặp lại với rất nhiều người. Chatbot còn có thể hỏi tên trường, địa chỉ, tức là thu dữ liệu cá nhân của thiếu niên. Theo thông cáo của ICO (cơ quan bảo vệ dữ liệu của Anh) ngày 21/5/2024, ICO đã điều tra vì lo ngại Snap chưa đánh giá đầy đủ rủi ro về dữ liệu trước khi phát hành chatbot My AI. Sau đó Snap phải làm lại đánh giá rủi ro kĩ hơn. Vì vậy, công ty nên kiểm thử xong rồi mới ra mắt, dù chậm hơn đối thủ."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 9 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

function maxPts(){return MODS.reduce((a,m,i)=>a+(mp(m)),0)}
function mp(m){switch(m.type){case'story':return m.chars.length*5;case'sort':return m.cards.length*3;case'quiz':return m.qs.length*4;case'order':return 10;case'decide':return m.cases.length*5;case'flag':return 10;case'lab':return 6;case'match':return m.pairs.length*2;case'build':return 6;default:return 0}}

let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
