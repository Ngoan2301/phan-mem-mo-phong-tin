<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 8. Thiết kế kịch bản hội thoại có ứng dụng AI – Lớp 8</title>
<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>
<div class="map" id="map"></div><main id="main"></main><canvas id="confetti"></canvas>
<script>
const SPEC={"icon": "💬", "title": "Bài 8. Thiết kế kịch bản hội thoại có ứng dụng AI – Lớp 8", "ainote": "Thứ tự và nội dung từng lượt lời do người thiết kế quyết định; con người kiểm thử, cập nhật dữ liệu, thêm nhánh xử lí. Trợ lí không hỏi thông tin cá nhân không cần thiết và chuyển cho người phụ trách khi không chắc hoặc khi yêu cầu không được phép trả lời.", "takeaways": ["Luồng chính của kịch bản: lời chào → nhận diện ý định (nêu phạm vi hỗ trợ) → câu hỏi làm rõ → câu trả lời chính → kết thúc.", "Ngoài luồng chính cần có lượt lời cho lúc trợ lí chưa hiểu (hỏi lại) và nhánh xử lí ngoại lệ có điểm chuyển cho con người.", "Phản hồi ngoại lệ tốt: lịch sự, nói rõ việc không làm được, không hỏi thêm thông tin cá nhân, chỉ đúng người có thể giúp.", "Kịch bản cần được kiểm thử và điều chỉnh: lỗi thường gặp là thiếu dữ liệu hoặc dữ liệu cũ, thiếu nhánh xử lí, hiểu sai ý định."], "modules": [{"type": "quiz", "tag": "HĐ1 • Mở đầu", "title": "Vì sao trợ lí trả lời lệch?", "nav": "Trợ lí trả lời lệch", "icon": "🏸", "badge": "Người tìm lỗi", "intro": "Trong buổi sinh hoạt câu lạc bộ cầu lông, một bạn hỏi trợ lí ảo của trường về lịch tập luyện. Thay vì trả lời lịch tập, trợ lí kể về lịch sử môn cầu lông thế giới. Em dự đoán nhé!", "qs": [{"q": "Điều hợp lí nhất giải thích vì sao trợ lí trả lời lệch?", "opts": ["Kịch bản thiếu nhánh xử lí lúc trợ lí chưa hiểu rõ yêu cầu (đáng ra phải hỏi lại)", "Trợ lí cố tình trêu người hỏi", "Người hỏi nói quá nhỏ"], "a": 0, "why": "Phương án hợp lí nhất là phương án 1 (thiếu nhánh xử lí ngoại lệ). Trợ lí đã hiểu sai ý định người hỏi; gốc của lỗi là kịch bản không có nhánh cho lúc trợ lí chưa hiểu rõ yêu cầu. Lẽ ra trợ lí phải hỏi lại (như thẻ 5 ở HĐ 2.1) thay vì tự đoán rồi kể chuyện khác. Chấp nhận phương án 3 nếu HS giải thích được trợ lí đã hiểu sai ý định người hỏi (hỏi lịch tập, trợ lí hiểu thành hỏi về môn cầu lông). Phương án 2 cần HS giải thích thêm: nếu lịch tập không thuộc phạm vi hỗ trợ thì trợ lí phải nói rõ là không hỗ trợ việc đó, không kể chuyện khác. Trợ lí không nhận diện đúng ý định “hỏi lịch tập”, kịch bản cũng không có lượt lời hỏi lại khi chưa hiểu, nên trợ lí đưa ra câu trả lời không liên quan."}, {"q": "Kịch bản còn thiếu những gì? (chọn nhiều đáp án)", "opts": ["Bước nhận diện ý định và câu hỏi làm rõ, ví dụ “Bạn muốn biết lịch tập của câu lạc bộ nào, buổi nào?”", "Nhánh xử lí khi chưa hiểu hoặc khi câu hỏi ngoài phạm vi", "Chỗ chuyển cho thầy cô phụ trách khi trợ lí không trả lời được", "Thêm thật nhiều chuyện về lịch sử môn cầu lông"], "a": [0, 1, 2], "why": "Câu trả lời mong đợi gồm ba ý. Kịch bản thiếu bước nhận diện ý định và câu hỏi làm rõ (ví dụ “Bạn muốn biết lịch tập của câu lạc bộ nào, buổi nào?”). Kịch bản thiếu nhánh xử lí khi chưa hiểu hoặc khi câu hỏi ngoài phạm vi. Kịch bản thiếu chỗ chuyển cho người phụ trách (thầy cô phụ trách câu lạc bộ) khi trợ lí không có thông tin. GV giữ câu hỏi này tới B4 HĐ 4."}, {"q": "Ai chịu trách nhiệm nhìn ra chỗ kịch bản còn thiếu và sửa?", "opts": ["Chính trợ lí tự sửa", "Con người thiết kế và kiểm thử kịch bản", "Người dùng"], "a": 1, "why": "Nhìn ra chỗ thiếu và điều chỉnh kịch bản là việc của con người."}]}, {"type": "order", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Sắp luồng hội thoại của trợ lí thư viện", "nav": "Luồng hội thoại", "icon": "🧩", "badge": "Kiến trúc sư hội thoại", "intro": "Câu chuyện bối cảnh (giả định): Nhóm bạn của Minh gồm Minh, Lan và Nam được giao nhiệm vụ thiết kế một trợ lí ảo cho thư viện trường. Trợ lí này cần giúp học sinh tìm kiếm sách, đặt chỗ ngồi và thông báo các sự kiện sắp diễn ra tại thư viện. Tuy nhiên, trong quá trình thiết kế, nhóm gặp khó khăn khi trợ lí không nhận diện được các câu hỏi ngoài phạm vi hoặc các yêu cầu thông tin cá nhân không cần thiết. Minh đã nảy ra ý tưởng bổ sung các nhánh xử lí ngoại lệ để trợ lí trả lời an toàn hơn. Phần A. Ghép luồng hội thoại (HĐ 2.1): sắp thẻ lượt lời thành luồng hội thoại gồm lời chào, nhận diện ý định người hỏi, câu hỏi làm rõ, câu trả lời chính, kết thúc (thẻ 1, 2, 3, 4, 6). Hai thẻ dùng ngoài luồng chính: Thẻ 5 “Xin lỗi, tôi chưa hiểu rõ yêu cầu của bạn. Bạn có thể nói rõ hơn không?” (khi trợ lí chưa hiểu yêu cầu); Thẻ 7 “Xin lỗi, tôi không thể xử lí thông tin cá nhân. Vui lòng liên hệ nhân viên thư viện.” (khi gặp yêu cầu ngoại lệ).", "items": ["Lời chào: “Xin chào! Tôi là trợ lí ảo của thư viện. Tôi có thể giúp gì cho bạn hôm nay?”", "Nhận diện ý định: “Bạn muốn tìm sách, đặt chỗ ngồi hay biết thông tin sự kiện?”", "Câu hỏi làm rõ: “Sách bạn cần tìm là gì? Bạn có thể cho tôi biết tên sách hoặc tác giả không?”", "Câu trả lời chính: “Cuốn sách bạn tìm hiện còn ở giá số 3, khu Văn học. Bạn có muốn tìm thêm sách cùng thể loại không?”", "Kết thúc: “Cảm ơn bạn đã sử dụng dịch vụ của thư viện. Hẹn gặp lại!”"], "why": "Thẻ dùng ngoài luồng chính: thẻ 5 khi trợ lí chưa hiểu yêu cầu; thẻ 7 khi gặp yêu cầu ngoại lệ (thông tin cá nhân). Hai thẻ này có thể xuất hiện ở bất kì lượt nào, không có chỗ cố định trong luồng. Trợ lí đưa ra các lựa chọn rõ ràng trong phạm vi hỗ trợ (thẻ 2), hỏi làm rõ trước khi trả lời (thẻ 3); khi chưa hiểu thì hỏi lại (thẻ 5), không tự đoán. Thẻ nào hỏi người dùng muốn làm việc gì (thẻ 2), thẻ nào hỏi chi tiết của việc đó (thẻ 3)? Nhóm xong sớm viết câu hỏi làm rõ cho yêu cầu đặt chỗ ngồi, ví dụ: “Bạn muốn đặt chỗ vào buổi nào và cho mấy người?” Không chấp nhận câu hỏi đòi họ tên đầy đủ, số điện thoại, địa chỉ."}, {"type": "story", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Nhánh xử lí ngoại lệ: chọn phản hồi cho trợ lí", "nav": "Nhánh ngoại lệ", "icon": "🛡️", "badge": "Người gác cổng thông tin", "intro": "Phần B. Thiết kế nhánh xử lí ngoại lệ (HĐ 2.2). Em cùng nhóm viết phản hồi cho từng thẻ tình huống A–D: lịch sự, nói rõ việc trợ lí không làm được, không hỏi thêm thông tin cá nhân; ghi người phụ trách khi cần chuyển. Ví dụ mẫu: tình huống “Yêu cầu liên quan tới thông tin cá nhân” → “Xin lỗi, việc này cần đến thông tin cá nhân nên tôi không giúp được. Bạn hãy gặp nhân viên thư viện nhé.” Chuyển cho: nhân viên thư viện. Hãy chọn phản hồi cho từng tình huống.", "app": "💬 Trợ lí ảo thư viện (mô phỏng)", "hello": "Xin chào! Tôi là trợ lí ảo của thư viện. Tôi có thể giúp tìm sách, đặt chỗ ngồi hoặc xem sự kiện sắp diễn ra.", "meters": [{"n": "An toàn thông tin", "b": 50, "c": 0}, {"n": "Người dùng được giúp tiếp", "b": 40, "c": 0}, {"n": "Nguy cơ lộ dữ liệu", "b": 20, "c": 1}], "chars": [{"n": "Thẻ A", "color": "#4aa3ff", "task": "Tình huống: Người dùng hỏi về thông tin cá nhân của người khác. Trợ lí nên phản hồi thế nào?", "opts": [{"t": "Đưa luôn thông tin vì bạn hỏi rất lịch sự", "chat": ["Cho mình xin số điện thoại của bạn Lan lớp 8A nhé!", "Số của bạn Lan là ..."], "ch": [-45, 15, 50], "v": "bad", "fb": "Thông tin cá nhân của người khác thuộc về chính người đó; người hỏi lịch sự không có nghĩa là có quyền được biết. Trợ lí không thể tự kiểm tra người hỏi là ai, nên phải chuyển cho con người quyết định."}, {"t": "Hỏi lại: “Bạn cho tôi biết tên và lớp của bạn để tôi kiểm tra”", "chat": ["Cho mình xin số điện thoại của bạn Lan lớp 8A nhé!", "Bạn cho tôi biết tên và lớp của bạn để tôi kiểm tra."], "ch": [-25, 0, 30], "v": "bad", "fb": "Chưa đạt yêu cầu nếu phản hồi hỏi thêm thông tin cá nhân hoặc tiết lộ thông tin của người khác, thông tin bảo mật."}, {"t": "“Xin lỗi, tôi không thể cung cấp thông tin cá nhân của người khác. Nếu bạn cần liên hệ với ai, bạn hãy hỏi nhân viên thư viện hoặc thầy cô.”", "chat": ["Cho mình xin số điện thoại của bạn Lan lớp 8A nhé!", "Xin lỗi, tôi không thể cung cấp thông tin cá nhân của người khác. Nếu bạn cần liên hệ với ai, bạn hãy hỏi nhân viên thư viện hoặc thầy cô."], "ch": [40, 25, -30], "v": "good", "fb": "Chuyển cho nhân viên thư viện hoặc thầy cô (khi người dùng thật sự cần liên hệ). Vì sao thẻ A và thẻ D không được trả lời dù người hỏi lịch sự? Vì thông tin cá nhân của người khác thuộc về chính người đó, thông tin bảo mật thuộc quyền quản lí của thư viện; trợ lí không thể tự kiểm tra người hỏi là ai."}]}, {"n": "Thẻ B", "color": "#ff9f43", "task": "Tình huống: Người dùng yêu cầu dịch vụ ngoài phạm vi hỗ trợ. Trợ lí nên phản hồi thế nào?", "opts": [{"t": "“Không trả lời được.”", "chat": ["Bạn ơi, bạn giúp mình sửa xe đạp được không?", "Không trả lời được."], "ch": [5, -25, 0], "v": "mid", "fb": "Phản hồi chỉ ghi “Không trả lời được” cần bổ sung việc trợ lí làm được hoặc người có thể giúp."}, {"t": "“Xin lỗi, yêu cầu của bạn ngoài phạm vi hỗ trợ. Tôi có thể giúp bạn tìm sách, đặt chỗ ngồi hoặc xem sự kiện sắp diễn ra của thư viện.”", "chat": ["Bạn ơi, bạn giúp mình sửa xe đạp được không?", "Xin lỗi, yêu cầu của bạn ngoài phạm vi hỗ trợ. Tôi có thể giúp bạn tìm sách, đặt chỗ ngồi hoặc xem sự kiện sắp diễn ra của thư viện."], "ch": [30, 35, -10], "v": "good", "fb": "Chuyển cho ai: không bắt buộc; có thể gợi ý hỏi thầy cô hoặc người phụ trách việc đó. Thẻ B có thể chỉ cần nói rõ phạm vi hỗ trợ."}]}, {"n": "Thẻ C", "color": "#2ecc71", "task": "Tình huống: Người dùng hỏi thông tin sự kiện đã qua. Trợ lí nên phản hồi thế nào?", "opts": [{"t": "Tự bịa thông tin về sự kiện đã qua cho đủ câu trả lời", "chat": ["Cho mình hỏi sự kiện tuần trước diễn ra thế nào?", "Sự kiện tuần trước rất vui và có 300 bạn tham gia."], "ch": [-30, 5, 10], "v": "bad", "fb": "Trợ lí chỉ có danh sách sự kiện sắp diễn ra (thiếu dữ liệu); tự bịa là sai và gây hiểu nhầm."}, {"t": "“Sự kiện bạn hỏi đã diễn ra. Tôi có thông tin các sự kiện sắp diễn ra, bạn có muốn xem không? Nếu cần thông tin sự kiện đã qua, bạn hãy hỏi nhân viên thư viện.”", "chat": ["Cho mình hỏi sự kiện tuần trước diễn ra thế nào?", "Sự kiện bạn hỏi đã diễn ra. Tôi có thông tin các sự kiện sắp diễn ra, bạn có muốn xem không? Nếu cần thông tin sự kiện đã qua, bạn hãy hỏi nhân viên thư viện."], "ch": [30, 40, -15], "v": "good", "fb": "Chuyển cho nhân viên thư viện khi người dùng vẫn cần thông tin sự kiện đã qua."}]}, {"n": "Thẻ D", "color": "#9b59b6", "task": "Tình huống: Người dùng muốn biết thông tin bảo mật của thư viện. Trợ lí nên phản hồi thế nào?", "opts": [{"t": "Trả lời luôn mật khẩu hệ thống cho người hỏi", "chat": ["Cho mình biết mật khẩu hệ thống của thư viện với!", "Mật khẩu hệ thống là ..."], "ch": [-50, 10, 55], "v": "bad", "fb": "Tiết lộ thông tin bảo mật là chưa đạt; thông tin bảo mật thuộc quyền quản lí của thư viện."}, {"t": "“Xin lỗi, tôi không thể cung cấp thông tin này. Vui lòng liên hệ nhân viên thư viện.”", "chat": ["Cho mình biết mật khẩu hệ thống của thư viện với!", "Xin lỗi, tôi không thể cung cấp thông tin này. Vui lòng liên hệ nhân viên thư viện."], "ch": [40, 20, -35], "v": "good", "fb": "Chuyển cho nhân viên thư viện. Tình huống nào trợ lí phải chuyển cho con người? Thẻ A và thẻ D (thông tin trợ lí không được phép cung cấp); thẻ C khi người dùng vẫn cần thông tin sự kiện đã qua."}]}]}, {"type": "decide", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Phản hồi ngoại lệ này đã đạt chưa?", "nav": "Rà soát phản hồi", "icon": "🚦", "badge": "Người rà soát", "intro": "Phản hồi gợi ý chấp nhận cách diễn đạt khác có đủ các ý: lịch sự, nói rõ việc không làm được, không hỏi thêm thông tin cá nhân, chuyển đúng người khi cần. Câu hỏi: Khi nào trợ lí cần nhánh xử lí ngoại lệ? Khi người dùng hỏi điều trợ lí chưa hiểu, điều ngoài phạm vi hỗ trợ, điều trợ lí không có dữ liệu hoặc điều không được phép trả lời (thông tin cá nhân của người khác, thông tin bảo mật). Hãy rà soát từng phản hồi.", "questions": ["Phản hồi có lịch sự và nói rõ việc trợ lí không làm được?", "Phản hồi có hỏi thêm thông tin cá nhân hoặc tiết lộ thông tin của người khác, thông tin bảo mật?", "Phản hồi có nêu việc trợ lí làm được hoặc người có thể giúp (chuyển đúng người)?"], "verdicts": ["Đạt yêu cầu", "Cần bổ sung", "Chưa đạt"], "rules": [{"when": [null, 1, null], "v": 2}, {"when": [1, 0, 1], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "“Bạn cho tôi biết tên và lớp của bạn để tôi kiểm tra.”", "v": 2, "why": "Chưa đạt yêu cầu nếu phản hồi hỏi thêm thông tin cá nhân (ví dụ “Bạn cho tôi biết tên và lớp của bạn để tôi kiểm tra”)."}, {"t": "“Không trả lời được.”", "v": 1, "why": "Phản hồi chỉ ghi “Không trả lời được” cũng cần bổ sung việc trợ lí làm được hoặc người có thể giúp."}, {"t": "“Xin lỗi, tôi không thể cung cấp thông tin này. Vui lòng liên hệ nhân viên thư viện.”", "v": 0, "why": "Lịch sự, nói rõ việc không làm được, không hỏi thêm thông tin cá nhân và chuyển đúng người: nhân viên thư viện."}, {"t": "Chatbot đặt lịch khám hỏi: “Bạn bị bệnh gì, triệu chứng cụ thể ra sao?”", "v": 2, "why": "Với tình huống B, trợ lí chỉ hỏi ngày giờ muốn khám, chuyên khoa hoặc phòng khám; không hỏi, không ghi bệnh, triệu chứng cụ thể; câu hỏi về sức khoẻ chuyển cho nhân viên y tế."}]}, {"type": "lab", "tag": "HĐ3 • Luyện tập", "title": "Cải thiện phản hồi của trợ lí ảo", "nav": "Phòng cải thiện", "icon": "🎚️", "badge": "Người kiểm thử", "intro": "Làm thế nào để cải thiện phản hồi của trợ lí ảo trong các tình huống này? Kéo các thanh trượt (mô hình giả định) để xem việc bổ sung dữ liệu, thêm quy tắc cho ngoại lệ và thử lại kịch bản làm kết quả thay đổi ra sao.", "sliders": [{"id": "upd", "n": "Bổ sung, cập nhật dữ liệu thường xuyên (sách mới, sự kiện)", "min": 0, "max": 100, "val": 30, "unit": "%"}, {"id": "rule", "n": "Quy tắc rõ ràng cho các trường hợp ngoại lệ (nhánh xử lí)", "min": 0, "max": 100, "val": 25, "unit": "%"}, {"id": "hand", "n": "Chuyển cho người phụ trách khi trợ lí không chắc", "min": 0, "max": 100, "val": 20, "unit": "%"}, {"id": "test", "n": "Thử lại kịch bản sau mỗi lần sửa", "min": 0, "max": 100, "val": 20, "unit": "%"}], "outputs": [{"n": "Câu hỏi được trả lời phù hợp", "base": 40, "w": {"upd": 0.25, "rule": 0.25, "hand": 0.15, "test": 0.1}, "c": 0}, {"n": "Câu trả lời lệch, thiếu dữ liệu", "base": 55, "w": {"upd": -0.35, "rule": -0.2, "hand": -0.1, "test": -0.1}, "c": 1}, {"n": "Nguy cơ lộ thông tin cá nhân, bảo mật", "base": 50, "w": {"rule": -0.3, "hand": -0.3, "test": -0.1}, "c": 2}], "insights": [{"id": "upd", "op": ">=", "val": 70, "txt": "Bổ sung dữ liệu mới thường xuyên: trợ lí biết danh mục sách mới, sự kiện sắp tới. Con người quyết định cập nhật dữ liệu; trợ lí không tự biết mình thiếu dữ liệu."}, {"id": "rule", "op": ">=", "val": 70, "txt": "Thiết lập quy tắc rõ ràng cho các trường hợp ngoại lệ (thông tin cá nhân, ngoài phạm vi, sự kiện đã qua)."}, {"id": "hand", "op": ">=", "val": 70, "txt": "Khi trợ lí không chắc thì chuyển cho người phụ trách."}, {"id": "test", "op": ">=", "val": 70, "txt": "Thử lại kịch bản sau mỗi lần sửa để phát hiện lỗi mới."}]}, {"type": "flag", "tag": "HĐ3 • Luyện tập", "title": "Chẩn đoán lỗi kịch bản qua hai ca thử", "nav": "Chẩn đoán hai ca thử", "icon": "🩺", "badge": "Bác sĩ kịch bản", "intro": "PHIẾU HỌC TẬP SỐ 2. CHẨN ĐOÁN LỖI KỊCH BẢN. Ba loại lỗi thường gặp: Thiếu dữ liệu hoặc dữ liệu chưa cập nhật (trợ lí không có thông tin hoặc thông tin đã cũ); Kịch bản thiếu nhánh xử lí (quy tắc): không có lượt lời cho tình huống đó; Trợ lí hiểu sai ý định người dùng: hỏi một việc, trợ lí hiểu thành việc khác. Em cùng nhóm đọc từng ca, gắn cờ chi tiết làm bằng chứng cho lỗi (không chấp nhận bằng chứng tự thêm ngoài mô tả).", "cols": ["Ca thử (giả định)", "Chi tiết trong mô tả của ca"], "flagWhat": "là bằng chứng của một lỗi kịch bản", "rows": [{"c": ["Ca thử 1. Nhóm của Lan thử nghiệm kịch bản hội thoại với trợ lí ảo của thư viện.", "Trợ lí không nhận diện được câu hỏi về sách mới ra mắt"], "bad": true, "why": "Loại lỗi: thiếu dữ liệu hoặc dữ liệu chưa cập nhật; hoặc trợ lí hiểu sai ý định người dùng. Khắc phục: người phụ trách cập nhật danh mục sách mới cho trợ lí định kì; khi chưa có thông tin thì trợ lí nói rõ và chuyển cho nhân viên thư viện. Ở ca 1, hai cách xếp lỗi sách mới ngang nhau: xếp “thiếu dữ liệu” khi giải thích trợ lí chưa có danh mục sách mới; xếp “trợ lí hiểu sai ý định” khi giải thích trợ lí không nhận ra đây là câu hỏi tìm sách."}, {"c": ["Ca thử 1", "Phản hồi không phù hợp khi người dùng hỏi về thông tin cá nhân của tác giả"], "bad": true, "why": "Loại lỗi: kịch bản thiếu nhánh xử lí (quy tắc bảo mật). Khắc phục: thêm nhánh: trợ lí từ chối lịch sự, không cung cấp thông tin cá nhân của tác giả, gợi ý thông tin trợ lí có (tên sách, thể loại)."}, {"c": ["Ca thử 1", "Nhóm của Lan thử nghiệm kịch bản hội thoại với trợ lí ảo của thư viện"], "bad": false}, {"c": ["Ca thử 2. Nam thử nghiệm kịch bản với trợ lí ảo.", "Trợ lí không thể xử lí yêu cầu đặt chỗ ngồi khi thư viện đã kín chỗ"], "bad": true, "why": "Loại lỗi: kịch bản thiếu nhánh xử lí. Khắc phục: thêm nhánh: trợ lí báo hết chỗ và đề nghị thông báo khi có chỗ trống hoặc gợi ý buổi khác."}, {"c": ["Ca thử 2", "Không có phản hồi phù hợp khi người dùng hỏi về sự kiện đã qua"], "bad": true, "why": "Loại lỗi: kịch bản thiếu nhánh xử lí. Khắc phục: thêm nhánh: trợ lí báo sự kiện đã diễn ra, gợi ý sự kiện sắp tới, chuyển cho nhân viên thư viện nếu người dùng cần thông tin cũ. Ở ca 2, lỗi sự kiện đã qua có thể xếp vào “thiếu dữ liệu hoặc dữ liệu chưa cập nhật” nếu nhóm giải thích trợ lí chỉ có danh sách sự kiện sắp diễn ra."}, {"c": ["Ca thử 2", "Nam thử nghiệm kịch bản với trợ lí ảo."], "bad": false}], "after": "Chấp nhận phương án khác khi nhóm lập luận được từ chi tiết của ca. HS chỉ vào cụm chữ trong mô tả, như cột “Bằng chứng”; không chấp nhận bằng chứng tự thêm ngoài mô tả. Ai quyết định cập nhật dữ liệu hay thêm nhánh xử lí cho trợ lí? Con người: nhóm thiết kế kịch bản và người phụ trách thư viện. Trợ lí không tự biết mình thiếu dữ liệu hay thiếu nhánh; con người phát hiện qua kiểm thử rồi sửa kịch bản. Câu hỏi mở rộng: Làm thế nào để cải thiện phản hồi của trợ lí ảo trong các tình huống này? Gợi ý trả lời: bổ sung dữ liệu mới thường xuyên; thiết lập quy tắc rõ ràng cho các trường hợp ngoại lệ. Khi trợ lí không chắc thì chuyển cho người phụ trách. Thử lại kịch bản sau mỗi lần sửa."}, {"type": "match", "tag": "HĐ3 • Luyện tập", "title": "Chẩn đoán lỗi: bằng chứng và cách khắc phục", "nav": "Chẩn đoán lỗi", "icon": "🩺", "badge": "Người kiểm thử", "intro": "Ghép mỗi bằng
