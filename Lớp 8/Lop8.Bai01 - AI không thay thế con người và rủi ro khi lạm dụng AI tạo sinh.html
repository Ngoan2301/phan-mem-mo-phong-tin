<style>

 viết trơn tru, có câu khái quát; lời nhắn X viết theo giọng nói thường ngày của một cô giáo. Dấu hiệu HS hay nêu: chữ “thân mến”, câu trơn hơn, câu khái quát “Một bài chưa như ý không nói lên tất cả”. Những dấu hiệu ấy cũng có trong văn do người viết, nên không đủ để kết luận lời nhắn nào do AI viết."}, {"q": "Rút ra điều gì từ trò chơi đoán này?", "opts": ["Không thể chắc chắn nhận ra một đoạn văn do AI viết chỉ qua giọng văn", "Văn trơn tru chắc chắn là của AI", "AI viết hay hơn người nên không cần cô viết"], "a": 0, "why": "Kiến thức chốt: không thể chắc chắn nhận ra một đoạn văn do AI viết chỉ qua giọng văn. Câu hỏi của bài không phải “AI có viết được không” mà là “kể cả khi AI viết được, có nên giao không”. GV không kết luận AI viết hay hơn hay kém hơn người."}, {"q": "Câu hỏi (2): Kể cả khi AI viết được giống hệt, có nên để AI viết thay cô không?", "opts": ["Không nên: lời nhắn của cô có giá trị vì cô thật sự biết Minh, sẽ gặp Minh và chịu trách nhiệm theo sát Minh", "Nên, vì AI viết nhanh hơn", "Nên, vì Minh không phân biệt được"], "a": 0, "why": "Ý mong đợi: lời nhắn của cô có giá trị vì cô thật sự biết Minh, cô sẽ gặp Minh, cô chịu trách nhiệm theo sát Minh; nếu Minh phát hiện lời nhắn do AI viết thay, Minh có thể mất lòng tin. HS chọn “nên” vẫn được ghi nhận nếu nêu lí do; dòng “Lúc đầu em nghĩ … vì …” không chấm đúng sai. Câu hỏi lớn của bài: Kể cả khi AI làm được, việc nào không nên giao cho AI thay con người? Vì sao?"}, {"q": "AI tạo sinh là gì?", "opts": ["Loại AI có khả năng tạo ra nội dung mới như văn bản, hình ảnh, âm thanh, video, mã nguồn hoặc dữ liệu, dựa trên dữ liệu đã học", "Loại AI chỉ dùng để chấm bài", "Phần mềm không cần dữ liệu"], "a": 0, "why": "Định nghĩa dùng khi công bố cho lớp chưa học giáo dục AI ở lớp dưới (PLC.8): AI tạo sinh là loại AI có khả năng tạo ra nội dung mới như văn bản, hình ảnh, âm thanh, video, mã nguồn hoặc dữ liệu, dựa trên dữ liệu đã học."}, {"q": "Câu hỏi kiểm bằng chứng: điều gì có thể làm kết luận “lời nhắn đó do AI viết” thay đổi?", "opts": ["Biết người viết đã nhờ AI viết nháp rồi tự sửa lại", "Lời nhắn có chữ “thân mến”", "Lời nhắn dài hơn"], "a": 0, "why": "Câu hỏi: “Bằng chứng nào khiến em tin lời nhắn đó do AI viết?”; “Điều gì có thể làm kết luận thay đổi?” (ví dụ: nếu biết người viết đã nhờ AI viết nháp rồi tự sửa lại)."}]}, {"type": "sort", "tag": "HĐ2.1 • Tình huống ba lĩnh vực", "title": "Ba thẻ tình huống: việc nào AI hỗ trợ, việc nào không nên giao?", "icon": "🧩", "nav": "Ba lĩnh vực", "badge": "Giữ phần của con người", "intro": "Thẻ Giáo dục (giả định): Trường của Nam dùng một ứng dụng AI luyện đề: chấm bài ngay, giải thích lỗi rất rõ, trả lời cả lúc nửa đêm. Gần đây điểm của Nam tụt hẳn, Nam hay ngồi im trong giờ. Ứng dụng vẫn chấm đúng mọi bài và gợi ý “làm thêm 20 đề”. Có bạn nói: “Có ứng dụng rồi, cần gì cô chủ nhiệm nữa.” — Thẻ Y tế: Bà ngoại của Lan bị đau đầu kéo dài. Ở phòng khám, phần mềm AI đọc phim chụp đầu và gợi ý cho bác sĩ vài khả năng bệnh. Bà lo sợ, giấu bớt triệu chứng vì không muốn con cháu lo. Có người bảo: “Máy đọc phim nhanh lắm, cứ để máy kết luận rồi in đơn thuốc là xong.” — Thẻ Nghệ thuật: Trường của Hà tổ chức đêm văn nghệ mừng 50 năm thành lập. Câu lạc bộ thơ của các ông bà hưu trí, những người từng dựng trường, định tự đọc thơ mình viết về những năm tháng ấy. Ban tổ chức thử nhờ AI viết thơ, thấy câu nào cũng trôi chảy, đúng vần, liền đề nghị: “Để AI viết hết, cho loa đọc là xong, các cụ đỡ phải tập.” Tìm câu đề nghị “giao hết cho AI”, rồi kéo từng việc vào cột đúng. Cột 2 ghi hành động cụ thể của một người cụ thể; lí do gắn với giá trị của con người, không phải lí do AI còn làm chưa tốt. Từ gợi ý: hỏi han, an ủi, động viên, lắng nghe, quyết định, chịu trách nhiệm, kể lại chuyện của mình, làm gương. Mẫu câu: “AI có thể … nhưng không nên để AI … vì …”.", "cats": ["1. AI có thể hỗ trợ việc gì?", "2. Việc không nên giao cho AI, dù AI làm được"], "cards": [{"t": "AI hỗ trợ (Giáo dục): Chấm bài luyện tập; giải thích lại một kiến thức; gợi ý bài luyện thêm.", "g": [0], "why": "Trường của Nam dùng ứng dụng AI luyện đề: chấm bài ngay, giải thích lỗi rõ. Việc này AI có thể hỗ trợ. Phân biệt: “giải thích lại một kiến thức” AI hỗ trợ được; “hướng dẫn một bạn cụ thể đang gặp khó khăn” thì không nên giao."}, {"t": "AI hỗ trợ (Y tế): Đọc phim chụp đầu, gợi ý vài khả năng bệnh cho bác sĩ xem.", "g": [0], "why": "AI gợi ý, con người quyết định. AI có thể hỗ trợ gợi ý chẩn đoán."}, {"t": "AI hỗ trợ (Nghệ thuật): Gợi ý vần, gợi ý cách sắp xếp chương trình, gõ và in bài thơ.", "g": [0], "why": "AI có thể hỗ trợ gợi ý vần thơ, sắp xếp chương trình; thơ của các ông bà vẫn do chính các cụ viết."}, {"t": "Giáo dục: Cô nhận ra Nam buồn, hỏi riêng Nam (hiểu tâm lí).", "g": [1], "why": "Cảm xúc và quan hệ tin cậy (1). Ví dụ đạt cho cột 2: “Cô hỏi riêng Nam vì sao dạo này hay im lặng.”"}, {"t": "Giáo dục: Động viên Nam đúng lúc (khích lệ).", "g": [1], "why": "Cảm xúc và quan hệ tin cậy (1)."}, {"t": "Giáo dục: Cùng Nam tìm hiểu vì sao dạo này điểm tụt, tìm cách học hợp với Nam (hướng dẫn một HS cụ thể).", "g": [1], "why": "Có người chịu trách nhiệm với sự tiến bộ của Nam (3). Nếu giao hết cho AI: Nam mất người hiểu và giúp mình; ứng dụng chỉ thấy điểm, không thấy lí do điểm tụt."}, {"t": "Giáo dục: Dạy Nam cách cư xử, sự trung thực bằng chính tấm gương của cô (dạy đạo đức).", "g": [1], "why": "Phán đoán đạo đức (2)."}, {"t": "Y tế: Bác sĩ hỏi han để bà nói thật triệu chứng; lắng nghe, động viên bà.", "g": [1], "why": "Cảm xúc và quan hệ tin cậy: lắng nghe, động viên để bà nói thật (1). Nếu giao hết cho AI: bà không được lắng nghe, có thể bị bỏ sót triệu chứng đã giấu."}, {"t": "Y tế: Quyết định chẩn đoán, kê đơn và chịu trách nhiệm.", "g": [1], "why": "Người quyết định và chịu trách nhiệm (3). Nếu giao hết cho AI: không ai chịu trách nhiệm nếu kết luận sai."}, {"t": "Y tế: Giải thích cho bà và gia đình.", "g": [1], "why": "Cảm xúc và quan hệ tin cậy (1); người chịu trách nhiệm (3)."}, {"t": "Nghệ thuật: Các ông bà tự viết thơ kể kỉ niệm dựng trường của chính mình (trải nghiệm riêng).", "g": [1], "why": "Trải nghiệm sống thật (4). Nếu giao hết cho AI: thơ trôi chảy nhưng không còn là chuyện thật."}, {"t": "Nghệ thuật: Tự đọc trước những người cùng thời và học trò cũ (cảm xúc, quan hệ người với người).", "g": [1], "why": "Cảm xúc và quan hệ tin cậy (1); phán đoán giá trị: đêm văn nghệ để tôn vinh chính những người đã dựng trường (2). Nếu giao hết cho AI: các ông bà mất dịp được lắng nghe; đêm văn nghệ mất ý nghĩa tôn vinh."}, {"t": "Nghệ thuật: Người viết đứng tên bài thơ.", "g": [1], "why": "Người đứng tên (3). Lời đề nghị “các cụ đỡ phải tập” bỏ qua việc các ông bà vẫn tự tập, tự đọc được."}], "pass": 0.75}, {"type": "quiz", "tag": "HĐ2.2–2.3 • Phản biện và chốt bốn tiêu chí", "title": "Phiếu chuyền vòng, phản biện và bốn tiêu chí", "icon": "⚖️", "nav": "Bốn tiêu chí", "badge": "Người phản biện", "intro": "Mỗi phiếu nhóm có thêm hai ý bổ sung bằng bút khác màu, một ý mỗi vòng, từ nhóm khác. Người phản biện hỏi từng ý ở cột 2: “AI có làm được việc này không? Nếu làm được thì sao vẫn không nên giao?”. Ví dụ đạt viết bằng lời của em: “Y tế: không nên để máy thay bác sĩ hỏi han bà, vì bà đang sợ, cần người thật lắng nghe thì mới dám nói thật.”", "qs": [{"q": "Câu hỏi (1): Có nên để AI nói câu “Bà ơi, bà đừng lo, cháu hiểu bà đang sợ.” thay bác sĩ không? Lí do nào gắn với giá trị của con người? (chọn nhiều đáp án)", "opts": ["AI không có cảm xúc thật", "AI không có trải nghiệm như bác sĩ", "AI không chịu trách nhiệm", "AI gợi ý, con người quyết định", "AI nói chưa hay", "AI còn sai"], "a": [0, 1, 2, 3], "why": "Lí do đúng, gắn với giá trị của con người: “AI không có cảm xúc thật”; “AI không có trải nghiệm như bác sĩ”; “AI không chịu trách nhiệm”; “AI gợi ý, con người quyết định”. Lí do chưa đúng hướng là lí do về chất lượng tạm thời của AI (“AI nói chưa hay”, “AI còn sai”), vì AI tốt hơn thì lí do đó mất; GV hỏi lại: “Nếu AI làm tốt hơn thì sao?”."}, {"q": "Câu hỏi (2): Vì sao người nói lại quan trọng?", "opts": ["Quan hệ tin cậy giữa người với người; phán đoán đạo đức, giá trị (việc ấy có ý nghĩa vì chính con người làm)", "Vì người nói nhanh hơn AI", "Vì AI không biết nói"], "a": 0, "why": "Ý thêm: quan hệ tin cậy giữa người với người; phán đoán đạo đức, giá trị (việc ấy có ý nghĩa vì chính con người làm). Câu hỏi kiểm bằng chứng: “Điều gì cho thấy bà cần người thật lắng nghe?”, “Điều gì có thể làm kết luận thay đổi?” Ví dụ: bà không biết người nói là AI thì sao; có bác sĩ đứng cạnh, đọc lại câu đó cho bà thì sao."}, {"q": "Kể cả khi AI làm được, không nên để AI thay con người khi việc đó cần gì? (chọn nhiều đáp án)", "opts": ["Cảm xúc và quan hệ tin cậy giữa người với người", "Phán đoán đạo đức, giá trị", "Một người đứng ra chịu trách nhiệm", "Trải nghiệm sống thật của chính người làm", "Việc lặp lại nhiều lần"], "a": [0, 1, 2, 3], "why": "Bốn tiêu chí: (1) cảm xúc và quan hệ tin cậy giữa người với người; (2) phán đoán đạo đức, giá trị; (3) một người đứng ra chịu trách nhiệm; (4) trải nghiệm sống thật của chính người làm. AI có thể hỗ trợ chấm bài, gợi ý chẩn đoán, gợi ý vần thơ. Còn hỏi han, động viên, quyết định, chịu trách nhiệm và kể chuyện của chính mình là của con người."}, {"q": "Thẻ Giáo dục: nếu giao hết cho AI thì ai mất gì?", "opts": ["Nam mất người hiểu và giúp mình; ứng dụng chỉ thấy điểm, không thấy lí do điểm tụt", "Cô giáo mất thời gian nghỉ", "Không ai mất gì"], "a": 0, "why": "Câu đề nghị “giao hết cho AI”: “Có ứng dụng rồi, cần gì cô chủ nhiệm nữa.”"}, {"q": "Thẻ Y tế: nếu giao hết cho AI thì ai mất gì?", "opts": ["Bà không được lắng nghe, có thể bị bỏ sót triệu chứng đã giấu; không ai chịu trách nhiệm nếu kết luận sai", "Bác sĩ mất việc", "Phần mềm mất dữ liệu"], "a": 0, "why": "Câu đề nghị “giao hết cho AI”: “Máy đọc phim nhanh lắm, cứ để máy kết luận rồi in đơn thuốc là xong.”"}, {"q": "Thẻ Nghệ thuật: nếu giao hết cho AI thì ai mất gì?", "opts": ["Thơ trôi chảy nhưng không còn là chuyện thật; các ông bà mất dịp được lắng nghe; đêm văn nghệ mất ý nghĩa tôn vinh", "Loa bị hỏng", "Ban tổ chức mất thơ"], "a": 0, "why": "Câu đề nghị “giao hết cho AI”: “Để AI viết hết, cho loa đọc là xong, các cụ đỡ phải tập.” bỏ qua việc các ông bà vẫn tự tập, tự đọc được."}, {"q": "Bạn khăng khăng “AI nói hay thì cứ để AI nói”. Nên hỏi lại gì?", "opts": ["“Nếu lời khuyên sai, ai chịu trách nhiệm? Khi em buồn, em muốn ai hỏi han?”", "“AI không làm được đâu.”", "“Cấm dùng AI.”"], "a": 0, "why": "GV không bác bằng “AI không làm được”, mà hỏi “Nếu lời khuyên sai, ai chịu trách nhiệm? Khi em buồn, em muốn ai hỏi han?”."}]}, {"type": "build", "tag": "HĐ3.1 • Luyện tập", "title": "Phiếu 1: Lĩnh vực của em", "icon": "🌍", "nav": "Lĩnh vực của em", "badge": "Người chọn lĩnh vực", "intro": "Lĩnh vực gợi ý (chọn hoặc tự đề xuất): xét xử ở toà án; chăm sóc ông bà và người già; tư vấn tâm lí; viết báo đưa tin; làm trọng tài thể thao; trông trẻ ở trường mầm non. Ghi ít nhất một việc không nên giao cho AI, vì sao và ứng với tiêu chí nào (1–4). Câu hỏi ở B3: “Nếu AI làm việc đó rất tốt, lí do của em có còn đúng không?”", "fields": [{"id": "dau", "label": "Kể cả khi AI viết được giống hệt, có nên để AI viết lời nhắn thay cô không? Lúc đầu em nghĩ … vì …", "hint": "không chấm đúng sai", "ph": "Em nghĩ không nên vì cô mới là người biết Minh.", "long": false}, {"id": "lv", "label": "Lĩnh vực của em", "opts": ["Xét xử ở toà án", "Chăm sóc ông bà và người già", "Tư vấn tâm lí", "Viết báo đưa tin", "Làm trọng tài thể thao", "Trông trẻ ở trường mầm non", "Tự đề xuất"]}, {"id": "viec", "label": "Việc không nên giao cho AI (cụ thể)", "hint": "Ai làm việc gì, với ai", "ph": "Cô hỏi riêng bạn vì sao dạo này hay im lặng."}, {"id": "vs", "label": "Vì sao (gắn với giá trị của con người) và ứng với tiêu chí (1–4)", "hint": "Lí do vẫn đúng kể cả khi AI làm tốt hơn", "ph": "Vì cần người đứng ra chịu trách nhiệm (tiêu chí 3)."}, {"id": "nay", "label": "Bây giờ em nghĩ (em giữ hay đổi ý, vì sao?)", "hint": "dựa vào bốn tiêu chí", "ph": "Em giữ ý vì tiêu chí 1."}], "checks": ["Dòng hợp lệ có một việc cụ thể kèm lí do gắn với giá trị của con người; lí do chỉ nói AI còn làm chưa tốt (viết chưa hay, còn sai) thì chưa tính.", "Khá: lí do gắn đúng giá trị của con người, viết bằng lời của mình; vận dụng được cho lĩnh vực tự đề xuất ở dòng “Lĩnh vực của em”.", "Tốt: tách được việc AI có thể hỗ trợ với việc không nên giao trong cùng một lĩnh vực; lập luận được “kể cả khi AI làm được vẫn không nên giao vì …”.", "Dòng “Bây giờ em nghĩ”: nói rõ giữ hay đổi ý lúc đầu và nêu lí do, tốt nhất dựa vào bốn tiêu chí."], "sample": "Ví dụ đạt: “Chăm sóc ông bà: không nên để robot thay hẳn việc trò chuyện, an ủi ông bà, vì ông bà cần tình cảm của người thân (tiêu chí 1).” “Xét xử: AI có thể tìm giúp hồ sơ vụ việc cũ, nhưng không nên để AI tuyên án, vì cần phán đoán đạo đức và một người chịu trách nhiệm về bản án (tiêu chí 2, 3).” “Trọng tài: hệ thống camera có AI có thể hỗ trợ phát hiện việt vị, nhưng quyết định cuối cùng và chịu trách nhiệm là của trọng tài (tiêu chí 3).” Ví dụ cần sửa: “Viết báo: không nên giao cho AI vì AI viết không hay.” Lí do chỉ nói AI còn viết chưa hay; AI viết tốt hơn thì lí do mất. Sửa thành: “… vì người viết phải kiểm tra sự thật và chịu trách nhiệm về bài báo (tiêu chí 3).”"}, {"type": "decide", "tag": "HĐ2.4 • Hợp lí hay lạm dụng?", "title": "Bốn ca dùng AI tạo sinh trong học tập", "icon": "🚦", "nav": "Hợp lí hay lạm dụng", "badge": "Người phân định", "intro": "GV đọc từng ca; sau mỗi ca, HS viết H (hợp lí) hoặc L (lạm dụng). Câu hỏi lớn của tiết 2: Cùng dùng AI, vì sao có bạn học được thêm, có bạn lại có nguy cơ mất dần khả năng tự nghĩ? Lạm dụng là để AI làm thay phần việc mà em cần tự làm để học, kể cả khi em không chép nguyên văn. Dùng AI không mặc nhiên là lạm dụng; dùng hợp lí khi có đủ hai dấu hiệu.", "questions": ["Em vẫn tự làm phần mình cần luyện (không để AI làm thay)?", "Em tự kiểm tra lại kết quả của AI trước khi dùng?"], "verdicts": ["H (hợp lí)", "L (lạm dụng)"], "rules": [{"when": [1, 1], "v": 0}, {"when": [0, null], "v": 1}, {"when": [null, 0], "v": 1}], "cases": [{"t": "Ca 1. Quân đọc lời giải AI đưa ra cho cả 10 bài tập ôn, thấy “hiểu rồi” nên không tự làm bài nào.", "v": 1, "why": "L. Quân không chép nhưng để AI làm thay phần luyện tập. Lâu ngày em mất cơ hội tự rèn luyện phần đó (đọc lời giải thay cho tự luyện)."}, {"t": "Ca 2. Thảo tự lập dàn ý bài nghị luận, rồi nhờ AI chỉ ra lập luận nào còn yếu và tự viết lại đoạn đó.", "v": 0, "why": "H. Thảo tự nghĩ trước, dùng AI để nhận góp ý rồi tự sửa. Nhờ AI gợi ý, góp ý, chỉ ra lỗi rồi em tự sửa có thể là cách dùng hợp lí khi thầy cô cho phép; nộp phần AI làm thay như bài của mình mà không ghi rõ mới là không trung thực."}, {"t": "Ca 3. Ngọc nhờ AI dịch cả bài đọc tiếng Anh sang tiếng Việt rồi trả lời câu hỏi đọc hiểu theo bản dịch, không đọc văn bản tiếng Anh.", "v": 1, "why": "L. Ngọc không chép đáp án nhưng để AI làm thay phần đọc hiểu tiếng Anh mà Ngọc cần tự luyện (đọc bản dịch thay cho tự đọc)."}, {"t": "Ca 4. Khoa nhờ AI tóm tắt ba bài báo để chuẩn bị thuyết trình, rồi mở lại từng bài báo kiểm tra những ý mình định dùng.", "v": 0, "why": "H. Tóm tắt chỉ giúp Khoa chọn ý; phần cần luyện là thuyết trình, Khoa tự làm; Khoa tự kiểm tra lại với bài báo gốc trước khi dùng. Lớp có thể tranh luận ca này; câu hỏi: “Nếu Khoa không mở lại bài báo thì em còn xếp là H không?” Dùng kết quả cho việc học mà không kiểm tra thì có nguy cơ thành lạm dụng."}]}, {"type": "flag", "tag": "HĐ2.4 • Hai bạn, hai cách làm", "title": "Phiếu 3: Hai bạn, hai cách làm", "icon": "🔎", "nav": "Cách làm của An", "badge": "Mắt tinh kiểm chứng", "intro": "Đề bài: Nhóm em chuẩn bị bài nói 2 phút: “Quỹ Bạn giúp bạn của trường mình”. Mỗi bạn viết đoạn mở đầu và một đoạn về tình hình ở trường. Bảng của đội tình nguyện (số liệu giả lập): số tiền cả trường góp vào quỹ Bạn giúp bạn trong Tuần lễ tiếp sức, đơn vị triệu đồng: Thứ Hai 3,2; Thứ Ba 2,5; Thứ Tư 2,9; Thứ Năm 2,1; Thứ Sáu 3,3. Ghi chú của đội tình nguyện: phần lớn tiền từ heo đất của các lớp; quỹ dùng mua sách vở, đồng phục cho các bạn có hoàn cảnh khó khăn trong trường. Cặp em trả lời: 1. Trước khi nộp, Bình đã tự hỏi lại điều gì về bài của AI? An có tự hỏi lại điều gì không? Nếu lần nào cũng không hỏi lại thì sao? 2. Bài nào có chỗ sai mà người viết không biết? Tìm chỗ đó. 3. Đọc ba câu mở đầu của An và hai bạn khác cũng dùng AI. Em thấy gì? Nếu cả lớp đều làm như An thì sao? Gắn cờ những dấu hiệu rủi ro. Tình huống và số liệu là giả lập; bài của An là đầu ra AI mô phỏng, con số “28 triệu đồng” là chỗ sai cố ý, không phải số liệu thật.", "cols": ["Nhân vật", "Chi tiết"], "flagWhat": "dấu hiệu rủi ro khi dùng AI tạo sinh", "rows": [{"c": ["An", "Cách làm của An: An dán đề và bảng số tiền góp quỹ vào AI, chép nguyên bài AI viết, nộp sau 2 phút."], "bad": true, "why": "Nguy cơ suy giảm tư duy phản biện. Dấu hiệu: nhận luôn kết quả, không tự hỏi lại “số này lấy ở đâu, có đúng không”. Nếu cứ làm như An lâu ngày: có nguy cơ quen tin ngay, ít tự đặt câu hỏi, ít tự nghĩ độc lập, ít tự đánh giá thông tin. Biện pháp hạn chế: tự suy nghĩ trước; kiểm tra nguồn: với mỗi ý quan trọng, hỏi “ở đâu ra, có đúng không, có ý khác không”. (Câu 1: Bình tự hỏi “số này lấy ở đâu, có đúng không” và cộng lại bảng; An không hỏi lại gì.)"}, {"c": ["An", "Bài của An: “Lá lành đùm lá rách là truyền thống tốt đẹp của dân tộc ta.”"], "bad": false}, {"c": ["An", "Bài của An: “Mỗi ngày trường em quyên góp được khoảng 28 triệu đồng cho quỹ Bạn giúp bạn, một con số rất đáng tự hào.”"], "bad": true, "why": "Nguy cơ sử dụng thông tin sai lệch. Tính lại: 3,2 + 2,5 + 2,9 + 2,1 + 3,3 = 14,0 triệu đồng trong 5 ngày; 14,0 : 5 = 2,8 triệu đồng mỗi ngày; 28 = 2,8 × 10, lệch 10 lần. Con số sai còn đổi luôn nhận định (“rất đáng tự hào”). An đã đưa bảng cho AI mà không so lại. Hệ quả nếu cứ làm vậy: có nguy cơ hiểu sai, nhớ sai, nói sai trước lớp, truyền thông tin sai cho người khác. Biện pháp: kiểm tra nguồn, so với số liệu gốc, sách giáo khoa, tài liệu thầy cô trước khi dùng. Gợi ý: 28 triệu đồng mỗi ngày còn lớn hơn cả 14 triệu đồng của 5 ngày trong bài của Bình."}, {"c": ["An", "Bài của An: “Chúng ta cùng chung tay để không bạn nào phải bỏ học.”"], "bad": false}, {"c": ["Hai bạn khác", "Hai bạn khác trong lớp cũng chép từ AI, mở đầu: “Lá lành đùm lá rách là truyền thống quý báu của dân tộc Việt Nam…”; “Lá lành đùm lá rách luôn là truyền thống tốt đẹp…”"], "bad": true, "why": "Nguy cơ suy giảm kĩ năng sáng tạo. Ba câu cùng mở bằng “Lá lành đùm lá rách…”, na ná nhau, không có chi tiết riêng của trường mình; nếu cả lớp làm như An thì bài của nhiều người giống nhau. Hệ quả: có nguy cơ ít tự tìm ý, mất dịp tự rèn cách tìm ý riêng. Biện pháp: tự suy nghĩ: ghi ý riêng trước khi hỏi AI; chỉnh sửa: thêm chi tiết thật của mình, chỉ lấy AI làm gợi ý."}, {"c": ["Bình", "Bình ghi ra giấy ba ý của mình trước: số liệu của đội tình nguyện, heo đất của lớp mình, dán bảng công khai số tiền mỗi ngày."], "bad": false}, {"c": ["Bình", "Bình gửi đề và bảng số tiền cho AI, nhờ gợi ý cách mở đầu và một câu kêu gọi cho bài nói của HS lớp 8."], "bad": false}, {"c": ["Bình", "Đọc bản AI, Bình thấy một con số chưa khớp, liền mở bảng của đội tình nguyện ra cộng lại rồi sửa con số đó."], "bad": false}, {"c": ["Bình", "Bình giữ câu kêu gọi AI gợi ý, thêm chuyện heo đất của lớp mình. Cuối bài ghi: “Câu kêu gọi có tham khảo gợi ý của AI; số liệu lấy từ bảng của đội tình nguyện.”"], "bad": false}, {"c": ["Bình", "Bài của Bình: “Tuần lễ tiếp sức vừa rồi, cả trường mình góp được 14 triệu đồng trong 5 ngày. Phần lớn số tiền đến từ những chú heo đất như heo đất của lớp mình.”"], "bad": false}], "after": "Sau khi em nêu bằng lời của mình, đặt tên ba nguy cơ: suy giảm tư duy phản biện (câu 1); sử dụng thông tin sai lệch (câu 2); suy giảm kĩ năng sáng tạo (câu 3). Chỗ Bình làm khác An: Bình ghi ý riêng trước khi hỏi AI; Bình cộng lại bảng để kiểm con số; Bình thêm chuyện heo đất của lớp mình; Bình ghi một dòng cho biết phần nào tham khảo AI. Mức đạt của bảng rủi ro: đủ ba nguy cơ, mỗi nguy cơ nêu một dấu hiệu có thật trong cách làm của An và một hệ quả tương ứng; dấu hiệu chung chung (“An lười”) chưa đạt. Mẫu câu: “Nếu em cứ … thì lâu dần em sẽ …”. Câu hỏi kiểm bằng chứng: “Chỗ nào trên phiếu khiến em tin bài của An sai?”; “Điều gì có thể làm kết luận thay đổi?” (nếu An đã cộng lại bảng trước khi nộp)."}, {"type": "order", "tag": "HĐ2.5 • Xây dựng quy trình", "title": "Quy trình năm bước dựa trên cách làm của Bình", "icon": "🪜", "nav": "Quy trình 5 bước", "badge": "Người dùng AI có trách nhiệm", "intro": "Nhóm có bộ sáu thẻ: KIỂM TRA NGUỒN, TỰ SUY NGHĨ, CHÉP NGUYÊN KẾT QUẢ CHO NHANH, CHỊU TRÁCH NHIỆM, ĐẶT CÂU LỆNH, CHỈNH SỬA (một thẻ nhiễu). Dựng lại dãy năm bước theo cách làm của Bình; thẻ nhiễu “Chép nguyên kết quả cho nhanh” là cách làm của An nên loại ra.", "items": ["1. Tự suy nghĩ: Bình ghi ra giấy ba ý của mình trước.", "2. Đặt câu lệnh: Bình gửi đề và bảng số tiền cho AI, nhờ gợi ý cách mở đầu và câu kêu gọi.", "3. Kiểm tra nguồn: Bình thấy một con số chưa khớp, mở bảng của đội tình nguyện ra cộng lại.", "4. Chỉnh sửa: Bình sửa con số, giữ câu kêu gọi, thêm chuyện heo đất của lớp mình.", "5. Chịu trách nhiệm: Bình ghi một dòng cho biết phần nào tham khảo AI, số liệu lấy ở đâu."], "why": "Chặn nguy cơ nào: bước 1 chặn suy giảm tư duy phản biện và suy giảm kĩ năng sáng tạo; bước 2 không chặn trực tiếp, AI chỉ tham gia ở bước này (trả lời câu lệnh); bước 3 chặn sử dụng thông tin sai lệch, đồng thời rèn tư duy phản biện; bước 4 chặn suy giảm kĩ năng sáng tạo và sử dụng thông tin sai lệch; bước 5: con người quyết định và chịu trách nhiệm. Nếu Bình bỏ bước Kiểm tra nguồn thì bài của Bình giữ nguyên con số chưa khớp mà AI đưa ra, giống An đã nộp con số “28 triệu đồng mỗi ngày”, sai 10 lần so với bảng. Biện pháp hạn chế chấp nhận khi có tên bước kèm một việc cụ thể, ví dụ “Kiểm tra nguồn: so con số với bảng của đội tình nguyện”. Kiến thức chốt: cả năm bước đều do em làm, AI chỉ trả lời câu lệnh em đặt ở bước 2; em tự suy nghĩ trước, tự kiểm tra nguồn, tự chỉnh sửa và chịu trách nhiệm về bài; bước kiểm tra nguồn chặn thông tin sai lệch."}, {"type": "story", "tag": "HĐ3.2 • Luyện tập", "title": "Tự làm trước, đối chiếu sau (bộ năm phiếu nhiệm vụ)", "icon": "🧪", "nav": "Kiểm chứng đầu ra AI", "badge": "Kiểm chứng đến cùng", "intro": "Mặt trước: em tự làm trước vào ô ① của phiếu năm bước, chưa lật mặt sau. Mặt sau: đầu ra mô phỏng kiểu công cụ AI tạo sinh, để luyện kiểm chứng. Nhiệm vụ 1, 5 dễ hơn (nguồn đối chiếu là trải nghiệm của chính em hoặc thông báo in kèm); nhiệm vụ 2, 3, 4 khó hơn (đối chiếu số liệu, tìm ý ngược lại, tìm chỗ không có nguồn). Ô ④: quyết định tốt là sửa đúng chỗ sai và nêu lí do; ở nhiệm vụ 1 là giữ bài tự viết. Câu hỏi mẫu khi chia sẻ với bạn cùng cặp: “Em kiểm chứng bằng cách nào? Nguồn nào? Em có tin nguồn đó không?”; “Nếu nguồn đó sai thì em còn giữ quyết định không?”. Kiến thức chốt: AI tạo sinh tạo nội dung dựa trên dữ liệu đã học, mỗi lần có thể khác và có thể sai mà nghe hợp lí, nên phải kiểm chứng.", "app": "💬 AI tạo sinh (mô phỏng)", "hello": "Đầu ra dưới đây là mô phỏng, có chỗ sai cài sẵn để luyện kiểm chứng, không phải của một công cụ cụ thể.", "meters": [{"n": "Kĩ năng tự làm", "b": 50, "c": 0}, {"n": "Nguy cơ thông tin sai", "b": 30, "c": 1}, {"n": "Trách nhiệm với bài của mình", "b": 50, "c": 2}], "chars": [{"n": "Nhiệm vụ 1", "color": "#4aa3ff", "task": "Yêu cầu: Viết ba câu tả con đường em đi học mỗi ngày (không ghi tên đường, số nhà). Em tự làm trước vào ô ① của phiếu năm bước, chưa lật mặt sau. Đầu ra AI (mô phỏng), lần 1: Con đường em đi học rợp bóng cây xanh. Mỗi sáng, nắng nhẹ len qua kẽ lá, tiếng chim hót líu lo. Em yêu con đường ấy biết bao. Lần 2: Con đường đến trường của em hai bên là hàng cây xanh mát. Buổi sáng, ánh nắng dịu dàng chiếu xuống mặt đường. Đó là con đường gắn bó với tuổi thơ em. Lần 3: Mỗi sáng em đi trên con đường quen thuộc rợp bóng cây. Gió nhẹ thổi, chim hót vang. Con đường như người bạn thân thiết của em. Gợi ý kiểm chứng: Chi tiết nào trong ba bản có thật trên con đường của em? Ba bản giống nhau ở đâu?", "opts": [{"t": "Giữ bài tự viết, thêm chi tiết thật của mình (quán ăn sáng đầu ngõ, cây cầu, tiếng còi xe…)", "chat": null, "ch": [25, -15, 20], "v": "good", "fb": "Nguy cơ được luyện: suy giảm kĩ năng sáng tạo. Nguồn đối chiếu là trải nghiệm của chính em. Ba bản đều đẹp nhưng chung chung, giống nhau (cây xanh, nắng, chim hót), không có chi tiết riêng. Quyết định tốt: giữ bài tự viết, có thể mượn một cách so sánh nếu thích, thêm chi tiết thật. Hai lần khác câu chữ nhưng cùng các chi tiết chung chung."}, {"t": "Chép bản lần 1 của AI cho nhanh", "chat": ["Viết ba câu tả con đường em đi học mỗi ngày.", "Con đường em đi học rợp bóng cây xanh. Mỗi sáng, nắng nhẹ len qua kẽ lá, tiếng chim hót líu lo. Em yêu con đường ấy biết bao."], "ch": [-25, 10, -25], "v": "bad", "fb": "Bài giống nhiều bạn, không có chi tiết riêng của em; lâu ngày em mất dịp tự rèn cách tìm ý riêng."}]}, {"n": "Nhiệm vụ 2", "color": "#27ae60", "task": "Yêu cầu: Tóm tắt trong hai câu nhật kí thí nghiệm của nhóm 3. Tài liệu kèm (số liệu giả lập): Nhóm đun 200 ml nước từ 25 °C. Sau 2 phút, nước đạt 45 °C; sau 4 phút đạt 65 °C; sau 6 phút đạt 85 °C. Nhóm nhận xét: cứ 2 phút nhiệt độ tăng khoảng 20 °C. Đầu ra AI (mô phỏng): Nhóm 3 đun 200 ml nước từ 25 °C và sau 6 phút nước đạt 95 °C. Kết quả cho thấy cứ 2 phút nhiệt độ tăng khoảng 20 °C. Gợi ý kiểm chứng: So từng con số với nhật kí của nhóm 3.", "opts": [{"t": "So từng con số với nhật kí, phát hiện 95 °C và sửa thành 85 °C", "chat": null, "ch": [10, -25, 20], "v": "good", "fb": "Nguy cơ được luyện: sử dụng thông tin sai lệch. Sai “95 °C”, đúng là 85 °C (25 + 3 × 20 = 85). Câu văn trôi chảy, đúng thuật ngữ nhưng có một con số lệch. Quyết định tốt: sửa thành 85 °C."}, {"t": "Giữ nguyên vì câu văn trôi chảy, đúng thuật ngữ", "chat": ["Tóm tắt nhật kí thí nghiệm nhóm 3 trong hai câu.", "Nhóm 3 đun 200 ml nước từ 25 °C và sau 6 phút nước đạt 95 °C. Kết quả cho thấy cứ 2 phút nhiệt độ tăng khoảng 20 °C."], "ch": [-10, 40, -20], "v": "bad", "fb": "Câu văn trôi chảy nhưng có một con số lệch (95 °C thay vì 85 °C); nộp luôn thì truyền thông tin sai."}]}, {"n": "Nhiệm vụ 3", "color": "#e67e22", "task": "Yêu cầu: Nêu hai ý kiến khác nhau về việc HS THCS mang điện thoại đến trường, mỗi ý kèm một lí do. Đầu ra AI (mô phỏng): Ý kiến 1: Không nên cho HS THCS mang điện thoại đến trường vì dễ mất tập trung trong giờ học. Ý kiến 2: HS THCS không nên mang điện thoại vì có thể mải chơi trò chơi trong giờ ra chơi thay vì vận động. Gợi ý kiểm chứng: Hai ý này có thật sự khác nhau không? Ý ngược lại có thể là gì? Em đồng ý với ý nào, vì sao?", "opts": [{"t": "Nhận ra hai ý cùng một hướng, bổ sung ý đối lập và nêu mình đồng ý với ý nào, vì sao", "chat": null, "ch": [15, -10, 20], "v": "good", "fb": "Nguy cơ được luyện: suy giảm tư duy phản biện. Hai ý cùng một hướng (không nên mang), chỉ khác lí do; thiếu ý đối lập. Ý đối lập ví dụ: nên cho mang để liên lạc với gia đình khi tan học muộn, nhưng gửi điện thoại cho lớp trưởng hoặc tắt máy trong giờ học. Quyết định tốt: bổ sung ý đối lập; nêu mình đồng ý với ý nào, vì sao. Đầu ra nhiệm vụ 3 là đầu ra mô phỏng, công cụ thật có lúc đưa đủ hai phía, điều cần học là tự kiểm xem đã thật sự có hai phía chưa."}, {"t": "Dùng luôn hai ý của AI làm đáp án", "chat": ["Nêu hai ý kiến khác nhau về việc HS THCS mang điện thoại đến trường.", "Ý kiến 1: Không nên cho HS THCS mang điện thoại đến trường vì dễ mất tập trung. Ý kiến 2: HS THCS không nên mang điện thoại vì có thể mải chơi trò chơi trong giờ ra chơi."], "ch": [-20, 15, -15], "v": "bad", "fb": "Hai ý chỉ khác lí do, không thật sự khác nhau; em ít tự đặt câu hỏi, quen tin ngay."}]}, {"n": "Nhiệm vụ 4", "color": "#8e44ad", "task": "Yêu cầu: Viết một câu kết cho đoạn văn của bạn Mai. Tài liệu kèm (giả định): Em thích đọc sách vào buổi tối. Sách đưa em tới những nơi em chưa từng đến. Đọc truyện, em hiểu cảm xúc của các nhân vật hơn. Đầu ra AI (mô phỏng): Như các nhà khoa  <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}

go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
