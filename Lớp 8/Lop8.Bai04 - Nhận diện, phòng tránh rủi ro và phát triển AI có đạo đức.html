const SPEC={"icon": "🛡️", "title": "Bài 4. Nhận diện, phòng tránh rủi ro và phát triển AI có đạo đức – Lớp 8", "ainote": "Mọi tình huống và dữ liệu là giả định. Em không nhập dữ liệu thật vào công cụ AI và không đưa khuôn mặt của ai vào hệ thống nào. Khi bị nhờ chuyển tiền gấp: dừng lại, xác minh bằng kênh thứ hai, báo người lớn. Em không bắt buộc dùng AI.", "takeaways": ["Ba nhóm rủi ro: lộ dữ liệu cá nhân; AI thiên vị hoặc kết luận sai; lừa đảo bằng nội dung giả do AI tạo.", "Nhập ít dữ liệu, dùng dữ liệu đã ẩn danh hoặc giả định, nhập khi được phép. Ảnh khuôn mặt, mã OTP, mật khẩu thì không bao giờ nhập.", "Gặp nội dung đáng ngờ: Dừng, Hỏi, Kiểm. Mặt và giọng quen thuộc chưa chắc là thật.", "Làm AI có đạo đức: bảo mật, công bằng, không xúc phạm người khác, cho người dùng quyền từ chối. Người quyết định triển khai chịu trách nhiệm."], "modules": [{"type": "sim", "scene": "dialog", "tag": "HĐ1 • Cuộc gọi video từ anh họ", "title": "Anh họ xin tiền gấp", "icon": "📞", "nav": "Anh họ xin tiền", "badge": "Người phòng tránh giả mạo", "story": {"e": "🧑", "t": "Đang làm bài, em nhận cuộc gọi video từ “anh họ”: mặt giống, giọng giống. Anh nói đang gấp và xin chuyển tiền."}, "intro": "Em nhận cuộc gọi video xin tiền gấp. Ở mỗi bước, chọn việc em làm. Thứ tự đúng là Dừng, Hỏi, Kiểm.", "steps": ["Đọc lời của “anh họ”", "Chọn một việc em làm", "Xem thanh chỉ số và đọc giải thích"], "hint": "Thấy mặt, nghe giọng chưa đủ để tin. Xác minh qua kênh thứ hai.", "missions": [{"t": "Đi hết tình huống đến lúc em xử lí xong", "m": "end", "op": ">=", "v": 1}, {"t": "Đưa thanh “Không bị lừa” lên 80 trở lên", "m": "an", "op": ">=", "v": 80}], "p": {"states": [{"m": "an", "op": ">=", "v": 80, "e": "🛡️", "t": "Em dừng, hỏi, kiểm: kẻ gian không lấy được tiền."}, {"m": "an", "op": "<=", "v": 25, "e": "🚨", "t": "Em bị cuốn theo lời giục: nguy cơ mất tiền và dữ liệu."}, {"m": "an", "op": ">=", "v": 0, "e": "📞", "t": "Chọn từng bước và xem các thanh thay đổi."}], "start": "a", "meters": [{"k": "an", "n": "Không bị lừa", "b": 40, "bad": 25}, {"k": "dl", "n": "Dữ liệu được giữ kín", "b": 40, "bad": 25}], "nodes": {"a": {"bot": "Anh họ (video call): “Em ơi, anh đang gấp lắm! Chuyển giúp anh 5 triệu NGAY. Đừng nói với ai nhé.”", "choices": [{"t": "Chuyển tiền ngay cho anh đỡ gấp", "next": "x1", "d": [-35, -10], "fb": "Thấy mặt, nghe giọng chưa đủ để tin vì hình ảnh, giọng nói có thể bị làm giả."}, {"t": "DỪNG. Chưa chuyển tiền, chưa đọc mã OTP.", "next": "b", "d": [25, 10], "fb": "Không chuyển tiền trong lúc đang bị giục."}]}, "b": {"bot": "“Anh họ”: “Nhanh lên! Em đọc mã OTP vừa nhận cho anh nhé.” Em làm gì tiếp?", "choices": [{"t": "Đọc mã OTP cho anh nhanh", "next": "x2", "d": [-30, -35], "fb": "Mã OTP không bao giờ được đưa cho người khác: ai có mã này là làm được nhiều việc với tài khoản của em."}, {"t": "HỎI. Gọi lại bằng số điện thoại quen thuộc hoặc hỏi một người thân thứ hai; đặt câu hỏi chỉ hai người biết.", "next": "c", "d": [25, 10], "fb": "Xác minh bằng kênh khác như gọi điện thoại thường theo số quen hoặc hỏi người nhà."}]}, "c": {"bot": "Số quen báo anh họ không gọi gì cả. Em nhớ lại: hình giật, khẩu hình lệch với lời nói, giọng đều, yêu cầu quá gấp, đòi chuyển vào tài khoản lạ.", "choices": [{"t": "Bỏ qua, im lặng", "next": "x3", "d": [-5, 0], "fb": "Dấu hiệu bất thường cần báo để người khác không bị lừa."}, {"t": "KIỂM. Cân nhắc dấu hiệu bất thường; báo cho người lớn, nhà trường hoặc cơ quan công an.", "next": "g", "d": [25, 20], "fb": "Dấu hiệu nhìn bằng mắt không đáng tin tuyệt đối vì công nghệ ngày càng tinh vi, nên xác minh qua kênh thứ hai quan trọng hơn."}]}, "x1": {"bot": "Tiền đã chuyển.", "end": true, "v": "bad", "verdict": "Không chuyển ngay. Thấy mặt, nghe giọng chưa đủ để tin vì hình ảnh, giọng nói có thể bị làm giả."}, "x2": {"bot": "Mã OTP đã đọc.", "end": true, "v": "bad", "verdict": "Kẻ gian cần ảnh, video, giọng nói và quyền đăng nhập tài khoản: đó là dữ liệu cá nhân có thể bị lấy và lạm dụng."}, "x3": {"bot": "Em không báo ai.", "end": true, "v": "bad", "verdict": "Chưa chuyển tiền là tốt, nhưng thiếu bước KIỂM: báo người lớn để người thân khác khỏi bị lừa."}, "g": {"bot": "Em nhắn: “Em sẽ gọi lại cho anh bằng số cũ để xác nhận trước khi chuyển tiền.”", "end": true, "v": "good", "verdict": "Thứ tự đúng là Dừng, Hỏi, Kiểm. Câu từ chối mẫu: “Em sẽ gọi lại cho anh bằng số cũ để xác nhận trước khi chuyển tiền.” Chấp nhận câu khác nếu lịch sự, không chuyển tiền ngay và nêu cách xác minh."}}}, "after": "AI có thể tạo ảnh, giọng nói giống thật nên dễ bị lợi dụng để giả mạo. Ví dụ: có người xin tiền gấp thì gọi lại bằng số quen trước khi chuyển."}, {"type": "quiz", "tag": "HĐ2 • Đúng hay sai? Sáu nhận định", "title": "Sáu nhận định về AI", "icon": "❓", "nav": "Sáu nhận định", "badge": "Người tỉnh táo", "intro": "Với mỗi nhận định, chọn Đúng hay Sai và nhóm rủi ro: (A) dữ liệu và quyền riêng tư; (B) thuật toán thiên vị hoặc kết luận sai; (C) lừa đảo bằng nội dung giả mạo.", "qs": [{"q": "1. Chỉ cần xoá họ tên khỏi dữ liệu là không ai biết đó là em.", "opts": ["Sai, nhóm (A) Dữ liệu và quyền riêng tư", "Sai, nhóm (B) Thuật toán thiên vị hoặc kết luận sai", "Sai, nhóm (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra", "Đúng, nhóm (A) Dữ liệu và quyền riêng tư"], "a": 0, "why": "Sai (A). Thông tin gián tiếp (lớp, khu phố, ngày sinh, thói quen) ghép lại vẫn xác định được một người. Dấu hiệu: bảng dữ liệu đã xoá tên vẫn còn lớp, ngày sinh, ảnh hoặc thói quen giúp nhận ra người; công cụ đòi thông tin không cần cho việc đang làm. Nhận định này đúng một phần: xoá họ tên giảm bớt rủi ro nhưng chưa đủ."}, {"q": "2. AI là máy móc nên không thể thiên vị.", "opts": ["Sai, nhóm (A) Dữ liệu và quyền riêng tư", "Sai, nhóm (B) Thuật toán thiên vị hoặc kết luận sai", "Sai, nhóm (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra", "Đúng, nhóm (A) Dữ liệu và quyền riêng tư"], "a": 1, "why": "Sai (B). AI học từ dữ liệu do con người tạo ra; dữ liệu lệch hoặc thiếu nhóm nào thì kết quả có thể bất công với nhóm đó. Dấu hiệu: kết quả khác nhau giữa các nhóm dù điều kiện giống nhau."}, {"q": "3. Chatbot trả lời trôi chảy, tự tin thì câu trả lời là đúng.", "opts": ["Sai, nhóm (A) Dữ liệu và quyền riêng tư", "Sai, nhóm (B) Thuật toán thiên vị hoặc kết luận sai", "Sai, nhóm (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra", "Đúng, nhóm (A) Dữ liệu và quyền riêng tư"], "a": 1, "why": "Sai (B). Chatbot dự đoán từ phù hợp tiếp theo, không kiểm tra sự thật nên có thể sai, bịa nguồn. Dấu hiệu: tự tin nhưng không có nguồn hoặc nguồn không tra được. Tin nhận định 3 thì dùng câu trả lời sai trong bài làm."}, {"q": "4. Nhìn thấy mặt và nghe đúng giọng người thân thì chắc chắn là thật.", "opts": ["Sai, nhóm (A) Dữ liệu và quyền riêng tư", "Sai, nhóm (B) Thuật toán thiên vị hoặc kết luận sai", "Sai, nhóm (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra", "Đúng, nhóm (A) Dữ liệu và quyền riêng tư"], "a": 2, "why": "Sai (C). AI học từ nhiều mẫu thật rồi tạo ảnh, giọng giống thật. Dấu hiệu: thúc giục gấp, đòi tiền hoặc mã OTP; cần xác minh qua kênh thứ hai. Tin nhận định 4 thì có thể bị lừa chuyển tiền."}, {"q": "5. Chỉ cần nhìn kĩ là luôn nhận ra ảnh, video do AI tạo.", "opts": ["Sai, nhóm (A) Dữ liệu và quyền riêng tư", "Sai, nhóm (B) Thuật toán thiên vị hoặc kết luận sai", "Sai, nhóm (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra", "Đúng, nhóm (A) Dữ liệu và quyền riêng tư"], "a": 2, "why": "Sai (C). Công nghệ ngày càng tinh vi nên dấu hiệu bằng mắt (ngón tay, chữ méo, khẩu hình) không tuyệt đối; phải kiểm chứng nguồn. Một số ảnh, video do AI tạo vẫn có dấu hiệu nhìn thấy được, nhưng không phải lúc nào cũng nhận ra."}, {"q": "6. Dữ liệu khuôn mặt bị lộ khó khắc phục hơn mật khẩu bị lộ vì không thể thay đổi.", "opts": ["Sai, nhóm (A) Dữ liệu và quyền riêng tư", "Sai, nhóm (B) Thuật toán thiên vị hoặc kết luận sai", "Sai, nhóm (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra", "Đúng, nhóm (A) Dữ liệu và quyền riêng tư"], "a": 3, "why": "Đúng (A). Dữ liệu sinh trắc học gắn với đặc điểm ổn định của một người, lộ rồi không đổi được. Mật khẩu bị lộ cũng nguy hiểm nhưng đổi được ngay. Dấu hiệu: ứng dụng, trang lạ hoặc người lạ đòi ảnh, quét khuôn mặt mà không nói rõ dùng để làm gì, lưu bao lâu."}, {"q": "Vì sao AI lại như vậy?", "opts": ["AI học từ dữ liệu; dữ liệu lệch hoặc thiếu thì đầu ra có thể sai, thiên lệch", "AI tạo được hình ảnh, giọng nói giống thật nên có thể bị con người lợi dụng để giả mạo", "Dữ liệu bị lộ khi người dùng nhập vào công cụ hoặc khi bị đánh cắp", "AI có ý thức"], "a": [0, 1, 2], "why": "Nhận định 2, 3: dữ liệu lệch hoặc thiếu. Nhận định 4, 5: AI tạo hình ảnh, giọng nói giống thật nên bị lợi dụng để giả mạo. Nhận định 1, 6: dữ liệu bị lộ khi người dùng nhập vào công cụ hoặc khi bị đánh cắp. Vấn đề học tập: có những nhóm rủi ro nào khi dùng AI và cần làm gì để phòng tránh?"}]}, {"type": "sort", "tag": "HĐ2 • Trạm 1: Dữ liệu cá nhân", "title": "Trạm 1: 12 thẻ vào ba hộp", "icon": "📦", "nav": "Trạm 1: 12 thẻ", "badge": "Người giữ dữ liệu", "intro": "Xếp 12 thẻ thông tin (giả lập) vào ba hộp: được nhập, chỉ nhập sau khi ẩn danh hoặc xin phép, không bao giờ nhập.", "cats": ["ĐƯỢC NHẬP vào công cụ AI", "CHỈ NHẬP sau khi ẩn danh hoặc xin phép", "KHÔNG BAO GIỜ NHẬP"], "pass": 0.8, "cards": [{"t": "Đề bài Toán", "g": [0], "why": "Được nhập: đề bài Toán, ý tưởng bài thuyết trình, sở thích âm nhạc."}, {"t": "Ý tưởng bài thuyết trình", "g": [0], "why": "Được nhập."}, {"t": "Sở thích âm nhạc", "g": [0], "why": "Được nhập. Nhóm xếp vào hộp 2 vì ghép với họ tên thì nói về một người cụ thể: chấp nhận."}, {"t": "Họ tên đầy đủ", "g": [1], "why": "Chỉ nhập sau khi ẩn danh hoặc xin phép: họ tên đầy đủ, điểm kiểm tra, lịch học thêm."}, {"t": "Điểm kiểm tra", "g": [1], "why": "Chỉ nhập sau khi ẩn danh hoặc xin phép."}, {"t": "Lịch học thêm", "g": [1], "why": "Chỉ nhập sau khi ẩn danh hoặc xin phép."}, {"t": "Số căn cước", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại."}, {"t": "Mã OTP", "g": [2], "why": "Không bao giờ nhập. Ai có mã này thì làm được gì với tài khoản của em?"}, {"t": "Mật khẩu", "g": [2], "why": "Không bao giờ nhập."}, {"t": "Ảnh khuôn mặt", "g": [2], "why": "Không bao giờ nhập: khuôn mặt lộ thì không đổi được như mật khẩu."}, {"t": "Địa chỉ nhà", "g": [2], "why": "Không bao giờ nhập."}, {"t": "Số điện thoại", "g": [2], "why": "Không bao giờ nhập."}]}, {"type": "quiz", "tag": "HĐ2 • Trạm 2: Bản quyền và thông tin thực tế", "title": "Trạm 2: Bản quyền và việc làm cụ thể", "icon": "©️", "nav": "Trạm 2: Bản quyền", "badge": "Người tôn trọng bản quyền", "intro": "Đọc tình huống của Minh và Lan, rồi trả lời. Có thêm hai thông tin thực tế và gợi ý việc làm cụ thể.", "qs": [{"q": "Tình huống (giả định): Minh dùng công cụ AI tạo ảnh để làm poster và nộp nguyên đoạn văn do chatbot viết cho bài tập. Lan lấy ảnh của một hoạ sĩ trên mạng đưa vào poster mà không ghi nguồn. Hành vi nào chưa phù hợp?", "opts": ["Minh nộp nguyên đoạn văn của chatbot mà không ghi nhận việc dùng AI; Lan dùng ảnh của hoạ sĩ khi chưa xin phép, chưa ghi nguồn", "Minh dùng công cụ AI tạo ảnh cho poster", "Cả hai đều làm đúng"], "a": 0, "why": "Việc Minh dùng công cụ AI tạo ảnh cho poster không phải là sai nếu Minh ghi nhận việc dùng AI. Điều em nên làm: dùng ảnh, bài viết của người khác thì ghi nguồn và tìm hiểu tác giả cho phép dùng lại theo điều kiện nào."}, {"q": "Năm 2023, một công ty ảnh đã khởi kiện một công ty AI tại Anh, cho rằng ảnh của họ bị dùng để huấn luyện AI mà không xin phép. Năm 2025, toà án ở Anh đã ra phán quyết về vụ này. Điều này nhắc em điều gì?", "opts": ["Ảnh, bài viết của người khác thì ghi nguồn và tìm hiểu tác giả cho phép dùng lại theo điều kiện nào", "Ảnh trên mạng ai cũng dùng tự do", "AI không bao giờ bị kiện"], "a": 0, "why": "Thông tin thêm ở Trạm 2. Ghi nguồn tác giả và xin phép khi dùng sản phẩm của người khác; ghi nhận công cụ AI đã dùng; đọc kĩ và diễn đạt lại bằng ý của mình thay vì nộp nguyên đầu ra."}, {"q": "Mẫu ghi nhận việc dùng AI thay cho bạn Minh : "opt", "n": "Quyền chọn của học sinh", "base": 20, "w": {"opt": 0.7}}], "states": [{"m": "leak", "op": ">=", "v": 50, "e": "🚨", "t": "Lưu ảnh mặt lâu mà ít bảo vệ: lộ rồi thì không đổi được như mật khẩu."}, {"m": "miss", "op": ">=", "v": 30, "e": "⚠️", "t": "AI học ít kiểu gương mặt nên dễ nhận sai một số bạn."}, {"m": "opt", "op": "<=", "v": 30, "e": "🤔", "t": "Học sinh chưa có quyền từ chối. Điều này chưa công bằng."}, {"m": "leak", "op": ">=", "v": 0, "e": "✅", "t": "Rủi ro đã giảm. Hội đồng có thể cho triển khai kèm điều kiện."}]}, "after": "Một dự án AI tốt phải bảo mật, công bằng, minh bạch và cho người dùng quyền từ chối. Ví dụ: có cách điểm danh khác cho bạn không muốn quét mặt."}, {"type": "quiz", "tag": "HĐ3 • Hội đồng thẩm định camera điểm danh", "title": "Hội đồng thẩm định và sự việc có thật", "icon": "🏛️", "nav": "Hội đồng thẩm định", "badge": "Thành viên Hội đồng", "intro": "Em là thành viên Hội đồng xét dự án camera điểm danh. Trả lời các câu, rồi đối chiếu với hai sự việc có thật.", "qs": [{"q": "Tình huống (giả định): Một trường dự định lắp camera nhận diện khuôn mặt ở cửa lớp để điểm danh học sinh tự động, thay cho việc gọi tên. Nhóm em là Hội đồng thẩm định dự án này. Rủi ro nào của dự án thuộc nhóm nào?", "opts": ["Dữ liệu khuôn mặt là dữ liệu sinh trắc học nhạy cảm, không thể đổi như mật khẩu (nhóm A)", "Hệ thống nhận diện sai hoặc kém chính xác với một số nhóm HS (nhóm B)", "Dữ liệu bị lộ hoặc bị kẻ gian dùng để tạo nội dung giả (nhóm A, có thể dẫn tới nhóm C)", "Camera làm trường đẹp hơn"], "a": [0, 1, 2], "why": "Rủi ro thứ ba chấp nhận HS xếp vào nhóm A hoặc nhóm C nếu có lí do. Mỗi biện pháp giảm thiểu gắn với một rủi ro đã nêu."}, {"q": "Biện pháp giảm thiểu nào hợp lí?", "opts": ["Dùng cách điểm danh ít xâm phạm hơn (gọi tên, thẻ, ứng dụng không dùng khuôn mặt)", "Nếu thử nghiệm thì thu thập tối thiểu, lưu ngắn hạn, mã hoá, cho phép từ chối mà không bị thiệt, có người kiểm tra lại kết quả", "Lưu ảnh mặt thật lâu để dùng sau", "Bắt mọi học sinh không được từ chối"], "a": [0, 1], "why": "Quyết định: chấp nhận “Không triển khai” hoặc “Triển khai có điều kiện” nếu Hội đồng nêu được căn cứ từ rủi ro và lợi ích đã bàn; với “Triển khai có điều kiện”, Hội đồng nêu điều kiện cụ thể; “Triển khai ngay” chưa phù hợp vì chưa xử lí rủi ro nào."}, {"q": "Vấn đề đạo đức nào làm căn cứ cho quyết định của Hội đồng?", "opts": ["Bảo mật thông tin: dữ liệu khuôn mặt phải được bảo vệ, không dùng sai mục đích", "Không cung cấp thông tin sai lệch: nhận diện sai làm sai bảng điểm danh", "Không xúc phạm người khác: không công khai danh sách HS bị máy ghi vắng hay đi muộn để chê bai", "Công bằng, không phân biệt đối xử: hệ thống kém chính xác với một số nhóm HS"], "a": [0, 1, 2, 3], "why": "Ba vấn đề bảo mật thông tin, không cung cấp thông tin sai lệch, không xúc phạm người khác; HS có thể nêu thêm công bằng, không phân biệt đối xử. Vấn đề đạo đức phải gắn với một điểm cụ thể của dự án, ví dụ bảo mật thông tin gắn với chỗ lưu ảnh khuôn mặt của HS."}, {"q": "Cán bộ bảo vệ dữ liệu hỏi: “Vì sao dữ liệu khuôn mặt cần được bảo vệ chặt hơn mật khẩu?” Đáp án nào đúng?", "opts": ["Vì khuôn mặt lộ rồi không đổi được như mật khẩu", "Vì khuôn mặt đẹp hơn mật khẩu", "Vì mật khẩu không cần bảo vệ"], "a": 0, "why": "Dữ liệu sinh trắc học gắn với đặc điểm ổn định của một người, lộ rồi không đổi được. Các câu hỏi khác: Ai được xem, ai được lấy dữ liệu, việc truy cập có được ghi lại không? Dữ liệu lưu bao lâu và xoá như thế nào khi không cần nữa? Nếu dữ liệu bị lộ, ai chịu trách nhiệm và phải báo cho ai?"}, {"q": "Người phản biện hỏi: “Lợi ích của việc điểm danh tự động có đáng với dữ liệu khuôn mặt phải thu thập không?” Nếu hệ thống nhận diện sai, ai bị thiệt và ai phải sửa sai?", "opts": ["HS bị ghi vắng hoặc ghi nhầm bị thiệt; nhà trường, người quyết định dùng hệ thống, phải có người kiểm tra lại, tiếp nhận phản ánh và sửa", "Máy tự sửa, không cần ai", "Không ai bị thiệt"], "a": 0, "why": "Lợi ích chính là tiết kiệm thời gian gọi tên. H
