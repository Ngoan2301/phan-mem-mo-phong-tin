<style>
:root{--o:#8e44ad;--od:#6a3381;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}

.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}

select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}

.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}

<script>
const SPEC={"icon": "🛡️", "title": "Bài 4. Nhận diện, phòng tránh rủi ro và phát triển AI có đạo đức – Lớp 8", "ainote": "Mọi tình huống và dữ liệu là giả lập; không ai nhập dữ liệu thật vào công cụ AI, không chụp ảnh hay đưa khuôn mặt của ai vào hệ thống nào. Con người kiểm chứng và quyết định: không chuyển tiền ngay, xác minh qua kênh thứ hai; quyết định triển khai dự án thuộc về con người và có người chịu trách nhiệm. Không bắt buộc dùng AI; nếu dùng thì dùng tài khoản của người lớn, có người lớn cùng xem, kiểm chứng và ghi nhận.", "takeaways": ["Ba nhóm rủi ro: dữ liệu và quyền riêng tư; thuật toán thiên vị hoặc kết luận sai; lừa đảo bằng nội dung giả mạo do AI tạo ra. Nhiều rủi ro bắt nguồn từ dữ liệu AI học và từ việc con người dùng AI sai mục đích.", "Ba nguyên tắc phòng tránh: nhập ít, nhập dữ liệu giả lập hoặc đã ẩn danh, nhập khi được phép; ghi nguồn và ghi nhận việc dùng AI; Dừng, Hỏi, Kiểm trước khi tin, chia sẻ hay chuyển tiền.", "Dữ liệu khuôn mặt (sinh trắc học) bị lộ khó khắc phục hơn mật khẩu vì không thể thay đổi.", "Khi phát triển AI cần lưu ý bảo mật thông tin, không cung cấp thông tin sai lệch, không xúc phạm người khác và bảo đảm công bằng; quyết định triển khai thuộc về con người. Sản phẩm tốt có nội dung chính xác, làm theo được ngay, có ví dụ thực có nguồn (với phương án A), không vi phạm bản quyền."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Cuộc gọi video từ anh họ", "nav": "Cuộc gọi từ anh họ", "icon": "📞", "badge": "Dừng – Hỏi – Kiểm", "intro": "Tình huống giả định (chỉ mô tả bằng lời): Tối muộn, em nhận cuộc gọi video từ tài khoản của anh họ, đúng mặt, đúng giọng; anh nhờ chuyển gấp 3 triệu đồng vào một số tài khoản lạ, hứa mai trả. Câu hỏi then chốt: (1) Em có chuyển tiền ngay không? Vì sao? (2) Nếu đây là cuộc gọi giả, kẻ gian cần những dữ liệu nào của anh họ em? (3) Ngoài lừa đảo, AI còn có thể gây hại theo cách nào khác? Em muốn biết điều gì về rủi ro của AI? Vấn đề học tập: Có những nhóm rủi ro nào khi dùng AI và cần làm gì để phòng tránh?", "app": "📞 Cuộc gọi video (mô phỏng bằng lời)", "hello": "Anh đây, anh đang cần gấp 3 triệu, em chuyển vào số tài khoản này giúp anh, mai anh trả nhé!", "meters": [{"n": "An toàn tiền bạc", "b": 50, "c": 0}, {"n": "Nguy cơ lộ dữ liệu", "b": 30, "c": 1}, {"n": "Kiểm chứng đã làm", "b": 20, "c": 0}], "chars": [{"n": "Em", "color": "#4aa3ff", "task": "nhận cuộc gọi video từ tài khoản của anh họ. Em làm gì?", "opts": [{"t": "Chuyển tiền ngay vì thấy mặt, nghe đúng giọng anh", "chat": ["Em chuyển rồi nhé.", "(Số tài khoản lạ nhận tiền. Cuộc gọi là giả.)"], "ch": [-45, 35, -15], "v": "bad", "fb": "Câu hỏi (1). Em có chuyển tiền ngay không? Vì sao? Không chuyển ngay. Thấy mặt, nghe giọng chưa đủ để tin vì hình ảnh, giọng nói có thể bị làm giả; cần xác minh bằng kênh khác như gọi điện thoại thường theo số quen hoặc hỏi người nhà. Câu hỏi (2). Nếu đây là cuộc gọi giả, kẻ gian cần những dữ liệu nào của anh họ em? Ảnh, video, giọng nói và quyền đăng nhập tài khoản của anh họ, tức là dữ liệu cá nhân có thể bị lấy và lạm dụng."}, {"t": "Chưa chuyển: gọi lại bằng số điện thoại quen, hỏi bố mẹ hoặc một người thân khác, hỏi một điều chỉ hai người biết", "chat": null, "ch": [30, -20, 45], "v": "good", "fb": "Câu hỏi hỗ trợ ở B2 “Làm sao biết người đang gọi đúng là anh họ?”: gọi lại bằng số điện thoại quen; hỏi bố mẹ hoặc một người thân khác; hỏi một điều chỉ hai người biết; không chuyển tiền trong lúc đang bị giục."}, {"t": "Nhìn kĩ xem có dấu hiệu giả không, nếu thấy giống thật thì chuyển", "chat": null, "ch": [-15, 5, 10], "v": "mid", "fb": "Câu hỏi cho cặp học nhanh (cách phân biệt người thật với cuộc gọi giả): dấu hiệu bất thường như hình giật, khẩu hình lệch với lời nói, giọng đều, yêu cầu quá gấp, đòi chuyển vào tài khoản lạ. GV nhấn mạnh dấu hiệu bằng mắt không tuyệt đối; xác minh qua kênh thứ hai mới chắc chắn."}]}]}, {"type": "sort", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Sáu nhận định về AI, ba nhóm rủi ro", "nav": "Sáu nhận định", "icon": "🧐", "badge": "Phân loại rủi ro", "intro": "Với mỗi nhận định, em ghi Đúng hoặc Sai, xếp vào một trong ba nhóm rủi ro và giải thích vì sao (nguyên nhân, dấu hiệu nhận biết); mỗi nhóm A, B, C có ít nhất một dấu hiệu nhận biết. Em ghi cột Em chọn và cột Nhóm rủi ro ngay khi nghe nhận định, trước khi thầy cô chốt nhóm rủi ro; cột Vì sao em hoàn thiện sau khi trao đổi với bạn cùng cặp. Khi nghe thầy cô kết luận, em sửa bằng bút khác màu, không xoá câu trả lời ban đầu. Ba nhóm rủi ro: (A) Dữ liệu và quyền riêng tư; (B) Thuật toán thiên vị hoặc kết luận sai; (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra. Câu hỏi then chốt: (1) Nếu nhận định này sai thì rủi ro nào có thể xảy ra? (2) Vì sao AI lại như vậy? Em xếp từng nhận định vào nhóm rủi ro.", "cats": ["(A) Dữ liệu và quyền riêng tư", "(B) Thuật toán thiên vị hoặc kết luận sai", "(C) Lừa đảo bằng nội dung giả mạo do AI tạo ra"], "cards": [{"t": "1. Chỉ cần xoá họ tên khỏi dữ liệu là không ai biết đó là em.", "g": [0], "why": "Sai. (A) Dữ liệu và quyền riêng tư. Thông tin gián tiếp (lớp, khu phố, ngày sinh, thói quen) ghép lại vẫn xác định được một người. Dấu hiệu: bảng dữ liệu đã xoá tên vẫn còn lớp, ngày sinh, ảnh hoặc thói quen giúp nhận ra người; công cụ đòi thông tin không cần cho việc đang làm. Câu hỏi (1) ở mục b). Nếu nhận định này sai thì rủi ro nào có thể xảy ra? Ví dụ: tin nhận định 1 thì dễ đưa bảng dữ liệu chỉ xoá tên vào công cụ AI và làm lộ thông tin của bạn; tin nhận định 3 thì dùng câu trả lời sai trong bài làm; tin nhận định 4 thì có thể bị lừa chuyển tiền. Câu hỏi cho HS khá “Nhận định nào đúng một phần?”: nhận định 1 (xoá họ tên giảm bớt rủi ro nhưng chưa đủ nếu còn thông tin khác giúp nhận ra người đó); nhận định 5 (một số ảnh, video do AI tạo vẫn có dấu hiệu nhìn thấy được, nhưng không phải lúc nào cũng nhận ra). Chấp nhận nhận định khác nếu HS nêu được phần đúng và phần sai."}, {"t": "2. AI là máy móc nên không thể thiên vị.", "g": [1], "why": "Sai. (B) Thuật toán thiên vị hoặc kết luận sai. AI học từ dữ liệu do con người tạo ra; dữ liệu lệch hoặc thiếu nhóm nào thì kết quả có thể bất công với nhóm đó. Dấu hiệu: kết quả khác nhau giữa các nhóm dù điều kiện giống nhau."}, {"t": "3. Chatbot trả lời trôi chảy, tự tin thì câu trả lời là đúng.", "g": [1], "why": "Sai. (B) Thuật toán thiên vị hoặc kết luận sai. Chatbot dự đoán từ phù hợp tiếp theo, không kiểm tra sự thật nên có thể sai, bịa nguồn. Dấu hiệu: tự tin nhưng không có nguồn hoặc nguồn không tra được."}, {"t": "4. Nhìn thấy mặt và nghe đúng giọng người thân thì chắc chắn là thật.", "g": [2], "why": "Sai. (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra. AI học từ nhiều mẫu thật rồi tạo ảnh, giọng giống thật. Dấu hiệu: thúc giục gấp, đòi tiền hoặc mã OTP; cần xác minh qua kênh thứ hai."}, {"t": "5. Chỉ cần nhìn kĩ là luôn nhận ra ảnh, video do AI tạo.", "g": [2], "why": "Sai. (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra. Công nghệ ngày càng tinh vi nên dấu hiệu bằng mắt (ngón tay, chữ méo, khẩu hình) không tuyệt đối; phải kiểm chứng nguồn. Câu hỏi (2) ở mục b). Vì sao AI lại như vậy? AI học từ dữ liệu; dữ liệu lệch hoặc thiếu thì đầu ra có thể sai, thiên lệch (nhận định 2, 3). AI tạo được hình ảnh, giọng nói giống thật nên có thể bị con người lợi dụng để giả mạo (nhận định 4, 5). Dữ liệu bị lộ khi người dùng nhập vào công cụ hoặc khi bị đánh cắp (nhận định 1, 6)."}, {"t": "6. Dữ liệu khuôn mặt bị lộ khó khắc phục hơn mật khẩu bị lộ vì không thể thay đổi.", "g": [0], "why": "Đúng. (A) Dữ liệu và quyền riêng tư. Dữ liệu sinh trắc học gắn với đặc điểm ổn định của một người, lộ rồi không đổi được. Mật khẩu bị lộ cũng nguy hiểm nhưng đổi được ngay. Dấu hiệu: ứng dụng, trang lạ hoặc người lạ đòi ảnh, quét khuôn mặt mà không nói rõ dùng để làm gì, lưu bao lâu. Mức đạt: cột “Nhóm rủi ro” đúng ít nhất 5 trong 6 nhận định; cột “Vì sao” có ít nhất một dấu hiệu nhận biết đúng cho mỗi nhóm A, B, C (mỗi nhóm có hai nhận định). Chưa thấy minh chứng: cột “Vì sao” chỉ chép lại nhận định hoặc ghi “vì sai”."}], "pass": 0.8}, {"type": "sort", "tag": "HĐ2.2 • Học theo trạm", "title": "Trạm 1. Dữ liệu cá nhân: được nhập vào công cụ AI không?", "nav": "Trạm 1: Dữ liệu", "icon": "🗄️", "badge": "Giữ kín dữ liệu", "intro": "Nhiệm vụ: Em cùng nhóm xếp 12 thẻ thông tin (giả lập) vào ba hộp. Sau đó mỗi em ghi ít nhất hai việc làm bảo vệ dữ liệu cá nhân vào ô Trạm 1, phần A Phiếu học tập số 2. Thông tin thực tế: Năm 2023, sau khi một số kĩ sư của Samsung đưa mã nguồn và dữ liệu nội bộ vào một chatbot AI để nhờ sửa lỗi, công ty đã tạm cấm nhân viên dùng các công cụ AI tạo sinh trên thiết bị của công ty. Ở Việt Nam, Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 có hiệu lực từ ngày 01/01/2026. Các thẻ là dữ liệu giả lập; không nhập dữ liệu thật vào công cụ nào.", "cats": ["ĐƯỢC NHẬP vào công cụ AI", "CHỈ NHẬP sau khi ẩn danh hoặc xin phép", "KHÔNG BAO GIỜ NHẬP"], "cards": [{"t": "Họ tên đầy đủ", "g": [1], "why": "Chỉ nhập sau khi ẩn danh hoặc xin phép: họ tên đầy đủ, điểm kiểm tra, lịch học thêm."}, {"t": "Số căn cước", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại."}, {"t": "Ảnh khuôn mặt", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại."}, {"t": "Địa chỉ nhà", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại."}, {"t": "Số điện thoại", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại."}, {"t": "Mã OTP", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại. Nhóm xếp mã OTP, mật khẩu vào hộp 1 hoặc hộp 2: chưa đạt, GV hỏi lại “Ai có mã này thì làm được gì với tài khoản của em?”."}, {"t": "Mật khẩu", "g": [2], "why": "Không bao giờ nhập: số căn cước, mã OTP, mật khẩu, ảnh khuôn mặt, địa chỉ nhà, số điện thoại. Nhóm xếp mã OTP, mật khẩu vào hộp 1 hoặc hộp 2: chưa đạt, GV hỏi lại “Ai có mã này thì làm được gì với tài khoản của em?”."}, {"t": "Điểm kiểm tra", "g": [1], "why": "Chỉ nhập sau khi ẩn danh hoặc xin phép: họ tên đầy đủ, điểm kiểm tra, lịch học thêm."}, {"t": "Lịch học thêm", "g": [1], "why": "Chỉ nhập sau khi ẩn danh hoặc xin phép: họ tên đầy đủ, điểm kiểm tra, lịch học thêm."}, {"t": "Đề bài Toán", "g": [0], "why": "Được nhập: đề bài Toán, ý tưởng bài thuyết trình, sở thích âm nhạc."}, {"t": "Ý tưởng bài thuyết trình", "g": [0], "why": "Được nhập: đề bài Toán, ý tưởng bài thuyết trình, sở thích âm nhạc."}, {"t": "Sở thích âm nhạc", "g": [0, 1], "why": "Được nhập: đề bài Toán, ý tưởng bài thuyết trình, sở thích âm nhạc. Nhóm xếp “sở thích âm nhạc” vào hộp 2 vì ghép với họ tên thì nói về một người cụ thể: chấp nhận."}], "pass": 0.75}, {"type": "flag", "tag": "HĐ2.2 • Học theo trạm", "title": "Trạm 2. Bản quyền", "nav": "Trạm 2: Bản quyền", "icon": "©️", "badge": "Tôn trọng bản quyền", "intro": "Nhiệm vụ: Em cùng nhóm đọc tình huống (giả định), gạch chân hành vi chưa phù hợp của từng bạn và nêu lí do. Sau đó mỗi em ghi ít nhất hai việc làm tôn trọng bản quyền vào ô Trạm 2, phần A Phiếu học tập số 2 (mẫu ghi nhận cho bạn Minh em làm ở tiết 2). Tình huống (giả định): Minh dùng công cụ AI tạo ảnh để làm poster và nộp nguyên đoạn văn do chatbot viết cho bài tập. Lan lấy ảnh của một hoạ sĩ trên mạng đưa vào poster mà không ghi nguồn.", "cols": ["Bạn", "Chi tiết trong tình huống"], "flagWhat": "là hành vi chưa phù hợp", "rows": [{"c": ["Minh", "Minh dùng công cụ AI tạo ảnh để làm poster"], "bad": false, "why": "Việc Minh dùng công cụ AI tạo ảnh cho poster không phải là sai nếu Minh ghi nhận việc dùng AI."}, {"c": ["Minh", "nộp nguyên đoạn văn do chatbot viết cho bài tập"], "bad": true, "why": "Hành vi chưa phù hợp là Minh nộp nguyên đoạn văn của chatbot mà không ghi nhận việc dùng AI, không diễn đạt lại bằng ý của mình."}, {"c": ["Lan", "Lan lấy ảnh của một hoạ sĩ trên mạng đưa vào poster"], "bad": true, "why": "Lan dùng ảnh của hoạ sĩ khi chưa xin phép."}, {"c": ["Lan", "mà không ghi nguồn"], "bad": true, "why": "Lan chưa ghi nguồn."}, {"c": ["Thông tin thêm", "Năm 2023, một công ty ảnh đã khởi kiện một công ty AI tại Anh, cho rằng ảnh của họ bị dùng để huấn luyện AI mà không xin phép. Năm 2025, toà án ở Anh đã ra phán quyết về vụ này."], "bad": false, "why": "Đây là thông tin thêm về bản quyền, không phải hành vi của hai bạn."}, {"c": ["Điều em nên làm", "Dùng ảnh, bài viết của người khác thì ghi nguồn và tìm hiểu tác giả cho phép dùng lại theo điều kiện nào."], "bad": false, "why": "Đây là việc làm tôn trọng bản quyền."}], "after": "Mẫu ghi nhận việc dùng AI mong đợi thay cho Minh (bản rút gọn bốn ý của mẫu khai báo năm ý ở PLC.6): - Công cụ AI đã dùng: một công cụ tạo ảnh và một chatbot (ghi tên công cụ); - Dùng để làm gì: tạo ảnh minh hoạ cho poster, gợi ý đoạn văn; - Phần do em tự làm: bố cục poster, chọn ảnh, viết lại đoạn văn bằng lời của mình; - Em đã kiểm chứng đầu ra bằng cách: đối chiếu nội dung đoạn văn với sách giáo khoa hoặc nguồn chính thống. Mức đạt: đủ bốn ý, ý “phần do em tự làm” khác với phần AI làm. - Bản quyền: ghi nguồn tác giả và xin phép khi dùng sản phẩm của người khác; ghi nhận công cụ AI đã dùng; đọc kĩ và diễn đạt lại bằng ý của mình thay vì nộp nguyên đầu ra; Dùng ảnh, bài viết của người khác thì ghi nguồn và tìm hiểu tác giả cho phép dùng lại theo điều kiện nào."}, {"type": "order", "tag": "HĐ2.2 • Học theo trạm", "title": "Trạm 3. Phòng tránh giả mạo: Dừng, Hỏi, Kiểm", "nav": "Trạm 3: Dừng-Hỏi-Kiểm", "icon": "🛑", "badge": "Dừng – Hỏi – Kiểm", "intro": "Nhiệm vụ: Em cùng nhóm xếp ba thẻ rời theo đúng thứ tự cần làm khi một người quen nhắn tin hoặc gọi video xin tiền gấp (như tình huống anh họ ở đầu giờ). Mỗi em ghi ít nhất hai việc làm phòng tránh giả mạo vào ô Trạm 3, phần A Phiếu học tập số 2.", "items": ["DỪNG. Chưa chuyển tiền, chưa đọc mã OTP.", "HỎI. Gọi lại bằng số điện thoại quen thuộc hoặc hỏi một người thân thứ hai; đặt câu hỏi chỉ hai người biết.", "KIỂM. Cân nhắc dấu hiệu bất thường (hình giật, khẩu hình lệch, giọng đều, yêu cầu quá gấp); báo cho người lớn, nhà trường hoặc cơ quan công an. Dấu hiệu nhìn bằng mắt không đáng tin tuyệt đối vì công nghệ ngày càng tinh vi, nên xác minh qua kênh thứ hai quan trọng hơn."], "why": "Trạm 3: thứ tự đúng là Dừng, Hỏi, Kiểm. Câu từ chối mẫu: “Em sẽ gọi lại cho anh bằng số cũ để xác nhận trước khi chuyển tiền.” Chấp nhận câu khác nếu lịch sự, không chuyển tiền ngay và nêu cách xác minh. - Phòng tránh giả mạo: thực hiện Dừng, Hỏi, Kiểm; không chia sẻ nội dung chưa xác thực; báo người lớn. Câu hỏi cho HS khá ở B2 HĐ 2.2. Khi nào buộc phải cung cấp ảnh khuôn mặt cho một dịch vụ và em giảm rủi ro bằng cách nào? Ví dụ: khi làm giấy tờ hoặc xác nhận tài khoản với cơ quan, tổ chức chính thức. Cách giảm rủi ro: chỉ làm cùng cha mẹ; chỉ cung cấp qua ứng dụng, trang chính thức của cơ quan, tổ chức đó, không qua đường dẫn lạ hay tin nhắn; hỏi rõ ảnh dùng để làm gì, lưu bao lâu; không gửi ảnh khuôn mặt cho người lạ trên mạng."}, {"type": "build", "tag": "HĐ2.3 • Ba nguyên tắc phòng tránh", "title": "Phiếu học tập số 2, phần A: việc làm phòng tránh rủi ro", "nav": "Việc làm của em", "icon": "✅", "badge": "Việc làm cụ thể", "intro": "Ở mỗi trạm, em ghi ít nhất hai việc làm cụ thể mà em làm được ngay. Ngoài dòng họ tên, không ghi số điện thoại, địa chỉ, ảnh thật của mình và người khác. Mẫu ghi nhận việc dùng AI (tình huống bạn Minh ở Trạm 2, em làm ở tiết 2): Minh dùng công cụ AI tạo ảnh để làm poster và nộp nguyên đoạn văn do chatbot viết cho bài tập. Em ghi thay cho bạn Minh như Minh nên ghi khi nộp bài: Câu hỏi (1) ở mục b) HĐ 2.3. Việc làm này có cụ thể và làm được ngay không? Việc làm cụ thể nêu rõ làm gì, lúc nào (ví dụ “bật xác thực hai lớp cho tài khoản thư điện tử cùng bố mẹ”, “khi có người xin tiền qua mạng, gọi lại bằng số quen trước khi chuyển tiền”). Việc làm còn chung chung như “cẩn thận hơn” thì GV đề nghị nhóm nói rõ cẩn thận bằng việc gì.", "fields": [{"id": "t1", "label": "Trạm 1. Dữ liệu cá nhân: việc làm cụ thể em sẽ thực hiện (ít nhất 2)", "hint": "1. … 2. …"}, {"id": "t2", "label": "Trạm 2. Bản quyền: việc làm cụ thể (ít nhất 2)", "hint": "1. … 2. …"}, {"id": "t3", "label": "Trạm 3. Phòng tránh giả mạo: việc làm cụ thể (ít nhất 2)", "hint": "1. … 2. …"}, {"id": "gn", "label": "Mẫu ghi nhận việc dùng AI thay cho Minh (công cụ AI đã dùng; dùng để làm gì; phần do em tự làm; em đã kiểm chứng đầu ra bằng cách)", "hint": "đủ bốn ý"}, {"id": "tc", "label": "Câu từ chối của em (tình huống cuộc gọi của anh họ)", "long": false, "ph": "lịch sự, không chuyển tiền ngay, nêu cách xác minh"}, {"id": "kh", "label": "Việc làm em khoanh tròn sẽ thực hiện trong tuần", "long": false}], "checks": ["Mức đạt phần A: mỗi ô có ít nhất hai việc làm cụ thể, làm được ngay; không có việc làm nào nhập dữ liệu nhạy cảm (mật khẩu, mã OTP, ảnh khuôn mặt, số căn cước) vào công cụ AI; mẫu ghi nhận đủ bốn ý. Chưa thấy minh chứng: việc làm chung chung (“cẩn thận khi dùng AI”, “bảo vệ dữ liệu”).", "Đáp ứng nhiệm vụ, yêu cầu cần đạt (8.B1.1; Phiếu học tập số 1, phần B câu 1 Phiếu học tập số 2) — Khá: Phân loại đúng cả ba nhóm; giải thích được nguyên nhân của phần lớn nhận định, dấu hiệu nhận biết cụ thể; rủi ro của dự án nêu đúng nhóm và có lí do. | Tốt: Phân tích được rủi ro thuộc nhiều nhóm (ví dụ dữ liệu khuôn mặt bị lộ dẫn tới giả mạo); phân biệt được rủi ro do dữ liệu và rủi ro do con người lợi dụng AI.", "Đáp ứng nhiệm vụ, yêu cầu cần đạt (8.B2.1; phần A, phần B câu 1 Phiếu học tập số 2) — Khá: Việc làm cụ thể, làm được ngay; mẫu ghi nhận tách rõ phần AI làm và phần tự làm; biện pháp giảm thiểu khớp với rủi ro. | Tốt: Việc làm giải thích được vì sao giảm rủi ro; biện pháp khả thi trong trường học, có người kiểm tra lại kết quả; nêu được cách vẫn đạt mục đích mà ít dữ liệu hơn.", "Đáp ứng nhiệm vụ, yêu cầu cần đạt (8.B3.1; phần B câu 2 Phiếu học tập số 2) — Khá: Vấn đề đạo đức gắn đúng với điểm cụ thể của dự án; quyết định có căn cứ. | Tốt: Lập luận nối được vấn đề đạo đức với quyết định và điều kiện triển khai; nêu được tác động tới công bằng, quyền lợi của HS; điều chỉnh có căn cứ sau khi nghe sự việc có thật."], "sample": "Gợi ý ba ô phần A Phiếu học tập số 2: - Dữ liệu cá nhân: không nhập họ tên, ảnh, giọng nói, số giấy tờ, mật khẩu, mã OTP vào công cụ AI; dùng dữ liệu giả lập; kiểm tra cài đặt riêng tư; bật xác thực hai lớp; - Bản quyền: ghi nguồn tác giả và xin phép khi dùng sản phẩm của người khác; ghi nhận công cụ AI đã dùng; đọc kĩ và diễn đạt lại bằng ý của mình thay vì nộp nguyên đầu ra; - Phòng tránh giả mạo: thực hiện Dừng, Hỏi, Kiểm; không chia sẻ nội dung chưa xác thực; báo người lớn. Câu từ chối mẫu: “Em sẽ gọi lại cho anh bằng số cũ để xác nhận trước khi chuyển tiền.” Chấp nhận câu khác nếu lịch sự, không chuyển tiền ngay và nêu cách xác minh. Câu hỏi cho HS khá ở B2 HĐ 2.2. Khi nào buộc phải cung cấp ảnh khuôn mặt cho một dịch vụ và em giảm rủi ro bằng cách nào? Ví dụ: khi làm giấy tờ hoặc xác nhận tài khoản với cơ quan, tổ chức chính thức. Cách giảm rủi ro: chỉ làm cùng cha mẹ; chỉ cung cấp qua ứng dụng, trang chính thức của cơ quan, tổ chức đó, không qua đường dẫn lạ hay tin nhắn; hỏi rõ ảnh dùng để làm gì, lưu bao lâu; không gửi ảnh khuôn mặt cho người lạ trên mạng."}, {"type": "story", "tag": "HĐ3 • Luyện tập", "title": "Hội đồng thẩm định dự án camera điểm danh", "nav": "Hội đồng thẩm định", "icon": "🏫", "badge": "Thành viên Hội đồng", "intro": "Tình huống (giả định): Một trường dự định lắp camera nhận diện khuôn mặt ở cửa lớp để điểm danh học sinh tự động, thay cho việc gọi tên. Nhóm em là Hội đồng thẩm định dự án này. Ba nhóm rủi ro: (A) Dữ liệu và quyền riêng tư; (B) Thuật toán thiên vị hoặc kết luận sai; (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra. Em cùng nhóm phân vai, ghi tên bạn đảm nhận từng vai. Mỗi vai nêu ít nhất một mối quan tâm của mình. Nhóm 8 bạn: hai bạn chung một vai; nhóm 6 bạn: bỏ vai Người phản biện. Chưa biết nói gì, em dùng câu hỏi gợi ý ở cuối phiếu. Phiếu học tập số 3 gồm bảng Vai | Bạn đảm nhận (Nhà phát triển, Đại diện học sinh, Đại diện phụ huynh, Cán bộ bảo vệ dữ liệu, Người phản biện, Thư kí, Chủ toạ) và bảng Nội dung | Ý kiến của Hội đồng: 1. Ít nhất hai rủi ro và nhóm rủi ro tương ứng; 2. Hai biện pháp giảm thiểu; 3. Quyết định: Triển khai ngay, Triển khai có điều kiện, Không triển khai, điều kiện (nếu có); 4. Vấn đề đạo đức làm căn cứ cho quyết định. Câu hỏi then chốt: (1) Lợi ích của việc điểm danh tự động có đáng với dữ liệu khuôn mặt phải thu thập không? (2) Nếu hệ thống nhận diện sai, ai bị thiệt và ai phải sửa sai? Câu hỏi gợi ý cho từng vai. Vai nào chưa biết nêu gì thì chọn một câu hỏi dưới đây để nêu ý kiến của mình; Thư kí, Chủ toạ dùng câu hỏi của mình để rà lại việc của Hội đồng.", "app": "🏫 Phiên họp Hội đồng (mô phỏng)", "hello": "Hội đồng thẩm định xin chào. Mỗi vai nêu ít nhất một mối quan tâm của mình về dự án camera nhận diện khuôn mặt điểm danh.", "meters": [{"n": "Bảo vệ dữ liệu khuôn mặt", "b": 40, "c": 0}, {"n": "Rủi ro không công bằng", "b": 50, "c": 1}, {"n": "Độ tin cậy của quyết định", "b": 30, "c": 0}], "chars": [{"n": "Nhà phát triển", "color": "#4aa3ff", "task": "đóng vai Nhà phát triển của Hội đồng thẩm định dự án camera nhận diện khuôn mặt điểm danh. Em nêu ý kiến thế nào?", "opts": [{"t": "Nêu ý kiến theo câu hỏi gợi ý: (1) Hệ thống thu thập những dữ liệu nào, lưu ở đâu và trong bao lâu? (2) Hệ thống có thể nhận sai trong trường hợp nào (thiếu sáng, bạn đeo khẩu trang, hai bạn giống nhau)? (3) Có cách điểm danh nào đạt cùng mục đích mà ít dữ liệu hơn không?", "chat": null, "ch": [20, 15, 20], "v": "good", "fb": "Ý trả lời hợp lí nằm trong gợi ý Rủi ro, Biện pháp giảm thiểu, Quyết định, Vấn đề đạo đức. - Biện pháp giảm thiểu: dùng cách điểm danh ít xâm phạm hơn (gọi tên, thẻ, ứng dụng không dùng khuôn mặt); nếu thử nghiệm thì thu thập tối thiểu, lưu ngắn hạn, mã hoá, cho phép từ chối mà không bị thiệt, có người kiểm tra lại kết quả; mỗi biện pháp gắn với một rủi ro đã nêu;"}, {"t": "Chỉ nêu câu hỏi đầu tiên: Hệ thống thu thập những dữ liệu nào, lưu ở đâu và trong bao lâu?", "chat": null, "ch": [8, 5, 8], "v": "mid", "fb": "Mới nêu một mối quan tâm. Vai nào chưa biết nêu gì thì chọn một câu hỏi để nêu ý kiến; Thư kí, Chủ toạ dùng câu hỏi của mình để rà lại việc của Hội đồng. - Biện pháp giảm thiểu: dùng cách điểm danh ít xâm phạm hơn (gọi tên, thẻ, ứng dụng không dùng khuôn mặt); nếu thử nghiệm thì thu thập tối thiểu, lưu ngắn hạn, mã hoá, cho phép từ chối mà không bị thiệt, có người kiểm tra lại kết quả; mỗi biện pháp gắn với một rủi ro đã nêu;"}, {"t": "Bỏ qua câu hỏi, nói “dự án này tiện nên triển khai ngay”", "chat": null, "ch": [-30, -25, -25], "v": "bad", "fb": "“Triển khai ngay” chưa phù hợp vì chưa xử lí rủi ro nào. - Quyết định: chấp nhận “Không triển khai” hoặc “Triển khai có điều kiện” nếu Hội đồng nêu được căn cứ từ rủi ro và lợi ích đã bàn; với “Triển khai có điều kiện”, Hội đồng nêu điều kiện cụ thể; “Triển khai ngay” chưa phù hợp vì chưa xử lí rủi ro nào;"}]}, {"n": "Đại diện học sinh", "color": "#4aa3ff", "task": "đóng vai Đại diện học sinh của Hội đồng thẩm định dự án camera nhận diện khuôn mặt điểm danh. Em nêu ý kiến thế nào?", "opts": [{"t": "Nêu ý kiến theo câu hỏi gợi ý: (1) Em có thoải mái khi khuôn mặt của mình bị ghi lại mỗi ngày không? (2) Nếu máy ghi nhầm em vắng, em phản ánh với ai và bằng cách nào? (3) Em có được từ chối mà không bị thiệt không?", "chat": null, "ch": [20, 15, 20], "v": "good", "fb": "Ý trả lời hợp lí nằm trong gợi ý Rủi ro, Biện pháp giảm thiểu, Quyết định, Vấn đề đạo đức. Câu hỏi (2) ở mục b). Nếu hệ thống nhận diện sai, ai bị thiệt và ai phải sửa sai? HS bị ghi vắng hoặc ghi nhầm là người bị thiệt. Nhà trường, người quyết định dùng hệ thống, phải có người kiểm tra lại kết quả, tiếp nhận phản ánh và sửa; không để máy tự quyết."}, {"t": "Chỉ nêu câu hỏi đầu tiên: Em có thoải mái khi khuôn mặt của mình bị ghi lại mỗi ngày không?", "chat": null, "ch": [8, 5, 8], "v": "mid", "fb": "Mới nêu một mối quan tâm. Vai nào chưa biết nêu gì t  gọn không?", "chat": null, "ch": [8, 5, 8], "v": "mid", "fb": "Mới nêu một mối quan tâm. Vai nào chưa biết nêu gì thì chọn một câu hỏi để nêu ý kiến; Thư kí, Chủ toạ dùng câu hỏi của mình để rà lại việc của Hội đồng. Câu GV kết luận ở B4: kiến thức chốt ở mục c) HĐ 3 của KHBD Bài 4 lớp 8. Liên hệ: Khuyến nghị về đạo đức AI của UNESCO được thông qua năm 2021 với sự đồng thuận của 193 quốc gia thành viên, trong đó có nguyên tắc duy trì công bằng, không phân biệt đối xử và sự giám sát của con người đối với hệ thống AI (PL8.4.8, mục 3)."}, {"t": "Bỏ qua câu hỏi, nói “dự án này tiện nên triển khai ngay”", "chat": null, "ch": [-30, -25, -25], "v": "bad", "fb": "“Triển khai ngay” chưa phù hợp vì chưa xử lí rủi ro nào. - Quyết định: chấp nhận “Không triển khai” hoặc “Triển khai có điều kiện” nếu Hội đồng nêu được căn cứ từ rủi ro và lợi ích đã bàn; với “Triển khai có điều kiện”, Hội đồng nêu điều kiện cụ thể; “Triển khai ngay” chưa phù hợp vì chưa xử lí rủi ro nào;"}]}]}, {"type": "quiz", "tag": "HĐ3 • Luyện tập", "title": "Phiếu học tập số 2, phần B và sự việc có thật", "nav": "Ý kiến Hội đồng", "icon": "📑", "badge": "Thẩm định có căn cứ", "intro": "Tình huống (giả định): Trường lắp camera nhận diện khuôn mặt ở cửa lớp để điểm danh tự động. Ba nhóm rủi ro: (A) Dữ liệu và quyền riêng tư; (B) Thuật toán thiên vị hoặc kết luận sai; (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra. Ba nhóm rủi ro: (A) Dữ liệu và quyền riêng tư; (B) Thuật toán thiên vị hoặc kết luận sai; (C) Lừa đảo bằng nội dung giả mạo do AI tạo ra. Sau phiên họp, em ghi hai rủi ro quan trọng nhất kèm nhóm rủi ro và biện pháp giảm thiểu, quyết định của Hội đồng và ít nhất hai vấn đề đạo đức kèm một điểm của dự án; sau khi nghe sự việc có thật, em tự đánh giá điều đã làm được và điều cần điều chỉnh. Tình huống là giả định, không chụp ảnh, không đưa khuôn mặt của ai vào hệ thống nào.", "qs": [{"q": "1. Rủi ro của dự án camera điểm danh: chọn các rủi ro hợp lí (mỗi rủi ro thuộc một nhóm).", "opts": ["Dữ liệu khuôn mặt là dữ liệu sinh trắc học nhạy cảm, không thể đổi như mật khẩu (nhóm A)", "Hệ thống nhận diện sai hoặc kém chính xác với một số nhóm HS (nhóm B)", "Dữ liệu bị lộ hoặc bị kẻ gian dùng để tạo nội dung giả (nhóm A, có thể dẫn tới rủi ro nhóm C)", "Camera làm lớp học đẹp hơn"], "a": [0, 1, 2], "why": "- Rủi ro: dữ liệu khuôn mặt là dữ liệu sinh trắc học nhạy cảm, không thể đổi như mật khẩu (nhóm A); hệ thống nhận diện sai hoặc kém chính xác với một số nhóm HS (nhóm B); dữ liệu bị lộ hoặc bị kẻ gian dùng để tạo nội dung giả (nhóm A, có thể dẫn tới rủi ro nhóm C). Rủi ro thứ ba chấp nhận HS xếp vào nhóm A hoặc nhóm C nếu có lí do; Mức đạt phần B Phiếu học tập số 2, câu 1: có hai rủi ro của dự án, mỗi rủi ro xếp vào một nhóm có lí và có một biện pháp giảm thiểu tương ứng."}, {"q": "2. Biện pháp giảm thiểu nào hợp lí? (mỗi biện pháp gắn với một rủi ro đã nêu)", "opts": ["Dùng cách điểm danh ít xâm phạm hơn (gọi tên, thẻ, ứng dụng không dùng khuôn mặt)", "Nếu thử nghiệm: thu thập tối thiểu, lưu ngắn hạn, mã hoá, cho phép từ chối mà không bị thiệt, có người kiểm tra lại kết quả", "Thu thêm thật nhiều ảnh khuôn mặt để máy nhận diện tốt hơn", "Để máy tự quyết, không cần người kiểm tra"], "a": [0, 1], "why": "- Biện pháp giảm thiểu: dùng cách điểm danh ít xâm phạm hơn (gọi tên, thẻ, ứng dụng không dùng khuôn mặt); nếu thử nghiệm thì thu thập tối thiểu, lưu ngắn hạn, mã hoá, cho phép từ chối mà không bị thiệt, có người kiểm tra lại kết quả; mỗi biện pháp gắn với một rủi ro đã nêu;"}, {"q": "3. Quyết định của Hội đồng nào được chấp nhận?", "opts": ["Triển khai ngay", "Triển khai có điều kiện (nêu điều kiện cụ thể)", "Không triển khai"], "a": [1, 2], "why": "- Quyết định: chấp nhận “Không triển khai” hoặc “Triển khai có điều kiện” nếu Hội đồng nêu được căn cứ từ rủi ro và lợi ích đã bàn; với “Triển khai có điều kiện”, Hội đồng nêu điều kiện cụ thể; “Triển khai ngay” chưa phù hợp vì chưa xử lí rủi ro nào;"}, {"q": "4. Vấn đề đạo đức làm căn cứ: chọn các vấn đề gắn với dự án.", "opts": ["Bảo mật thông tin (dữ liệu khuôn mặt phải được bảo vệ, không dùng sai mục đích)", "Không cung cấp thông tin sai lệch (nhận diện sai làm sai bảng điểm danh)", "Không xúc phạm người khác (ví dụ không công khai danh sách HS bị máy ghi vắng hay đi muộn để chê bai)", "Không cần quan tâm vì dự án chỉ giả định"], "a": [0, 1, 2], "why": "- Vấn đề đạo đức làm căn cứ: bảo mật thông tin (dữ liệu khuôn mặt phải được bảo vệ, không dùng sai mục đích); không cung cấp thông tin sai lệch (nhận diện sai làm sai bảng điểm danh); không xúc phạm người khác (ví dụ không công khai danh sách HS bị máy ghi vắng hay đi muộn để chê bai). HS có thể nêu thêm vấn đề công bằng, không phân biệt đối xử (hệ thống kém chính xác với một số nhóm HS); chấp nhận như một vấn đề đạo đức gắn với dự án. Mức đạt câu 2: có ít nhất hai vấn đề đạo đức, mỗi vấn đề gắn với một điểm cụ thể của dự án (ví dụ bảo mật thông tin gắn với chỗ lưu ảnh khuôn mặt của HS, người được xem). Phần bổ sung bằng bút khác màu sau kết luận của GV (đủ ba vấn đề bảo mật thông tin, không cung cấp thông tin sai lệch, không xúc phạm người khác) không tính vào mức Đạt, GV dùng để phản hồi quá trình. Chưa thấy minh chứng: vấn đề đạo đức chỉ ghi tên, không gắn với điểm nào của dự án. Câu 3 phần B: không có đáp án đúng sai; GV đọc để phản hồi, ví dụ HS ghi “đã nêu được rủi ro lộ dữ liệu” và “cần điều chỉnh: chưa nghĩ tới việc HS không dám từ chối”."}, {"q": "5. Sự việc ở Thuỵ Điển (2019): vì sao nhà trường bị phạt khi thử dùng nhận diện khuôn mặt để điểm danh?", "opts": ["Dữ liệu sinh trắc học nhạy cảm được xử lí trái quy định, không đánh giá tác động đầy đủ; sự đồng ý của học sinh không hợp lệ vì chênh lệch vị thế", "Vì camera bị hỏng", "Vì học sinh không thích điểm danh"], "a": 0, "why": "Năm 2019, cơ quan bảo vệ dữ liệu của Thuỵ Điển phạt chính quyền địa phương quản lí một trường học 200 000 krona (khoảng 20 000 euro) vì nhà trường thử dùng nhận diện khuôn mặt để điểm danh học sinh một lớp trong một thời gian ngắn. Lí do: dữ liệu sinh trắc học nhạy cảm được xử lí trái quy định, nhà trường không đánh giá tác động đầy đủ; sự đồng ý của học sinh không được coi là hợp lệ vì giữa học sinh và nhà trường có sự chênh lệch vị thế rõ rệt. Câu GV dùng để HS đối chiếu câu 1, câu 2 phần B Phiếu học tập số 2 với tư liệu: “Quyết định của Hội đồng em đã tính tới những điều này chưa?”"}, {"q": "6. Nghiên cứu Gender Shades (2018) cho thấy điều gì?", "opts": ["Hệ thống xử lí ảnh khuôn mặt có thể sai khác nhau giữa các nhóm người (tỉ lệ sai 34,7% với nhóm nữ da sẫm màu, cao nhất chỉ 0,8% với nhóm nam da sáng màu); một nguyên nhân có thể là dữ liệu thiếu đa dạng", "Mọi hệ thống nhận diện đều chính xác như nhau với mọi người", "Nghiên cứu này thử hệ thống điểm danh ở trường"], "a": 0, "why": "Năm 2018, nghiên cứu Gender Shades thử ba hệ thống thương mại phân loại giới tính qua ảnh khuôn mặt. Tỉ lệ phân loại sai lên tới 34,7% với nhóm nữ da sẫm màu, trong khi cao nhất chỉ 0,8% với nhóm nam da sáng màu. Nghiên cứu này không thử hệ thống điểm danh; nó cho thấy hệ thống xử lí ảnh khuôn mặt có thể sai khác nhau giữa các nhóm người, một nguyên nhân có thể là dữ liệu thiếu đa dạng. Câu hỏi (2) ở mục b). Nếu hệ thống nhận diện sai, ai bị thiệt và ai phải sửa sai? HS bị ghi vắng hoặc ghi nhầm là người bị thiệt. Nhà trường, người quyết định dùng hệ thống, phải có người kiểm tra lại kết quả, tiếp nhận phản ánh và sửa; không để máy tự quyết. Câu GV kết luận ở B4: kiến thức chốt ở mục c) HĐ 3 của KHBD Bài 4 lớp 8. Liên hệ: Khuyến nghị về đạo đức AI của UNESCO được thông qua năm 2021 với sự đồng thuận của 193 quốc gia thành viên, trong đó có nguyên tắc duy trì công bằng, không phân biệt đối xử và sự giám sát của con người đối với hệ thống AI (PL8.4.8, mục 3)."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Thẻ nhiệm vụ dự án nhỏ", "nav": "Dự án nhỏ", "icon": "🎯", "badge": "Dự án phòng tránh", "intro": "Em làm cá nhân hoặc theo cặp, ở nhà, trong một tuần. Hạn nộp: …… Em chọn một trong hai phương án: - Phương án A: Áp phích hoặc kịch bản video không quá 60 giây giúp người thân lớn tuổi nhận ra và tránh cuộc gọi video giả mạo, có ba bước Dừng, Hỏi, Kiểm và một vụ việc thật có dẫn nguồn (nguồn có thể là bản tin truyền hình, báo giấy hoặc cảnh báo của nhà trường); - Phương án B: Quy ước năm điều về dùng AI cho nhóm dự án hoặc lớp em, gồm bảo mật thông tin (dữ liệu được nhập), không cung cấp thông tin sai lệch (kiểm chứng đầu ra), không xúc phạm người khác (lời lẽ, hình ảnh, không thiên vị), ghi nhận việc dùng AI và bản quyền, người chịu trách nhiệm. Hình thức: □ Vẽ tay □ Ảnh chụp □ Video ngắn □ Văn bản. Em làm trên giấy hoặc trên máy đều được. Bốn tiêu chí sản phẩm: 1. Nội dung chính xác; 2. Người xem làm theo được ngay; 3. Có ví dụ thực, có nguồn (chỉ áp dụng cho phương án A); 4. Không vi phạm bản quyền. Lưu ý an toàn: Em không bắt buộc dùng công cụ AI. Nếu dùng, em chỉ dùng thiết bị, tài khoản của người lớn và có người lớn cùng xem; không nhập thông tin cá nhân của gia đình; không dùng ảnh, giọng nói của người khác khi chưa được phép; kiểm chứng đầu ra với nguồn chính thống; ghi kèm sản phẩm công cụ đã dùng và phần việc AI hỗ trợ.", "fields": [{"id": "pa", "label": "Em chọn phương án", "opts": ["A. Áp phích / kịch bản video không quá 60 giây giúp người thân lớn tuổi tránh cuộc gọi video giả mạo", "B. Quy ước năm điều về dùng AI cho nhóm dự án hoặc lớp"]}, {"id": "nd", "label": "Nội dung chính (phương án A: ba bước Dừng, Hỏi, Kiểm; phương án B: năm điều)", "hint": "dùng động từ hành động, ít chữ"}, {"id": "vd", "label": "Ví dụ thực và nguồn (phương án A)", "hint": "tên nguồn và ngày đăng hoặc phát", "long": false}, {"id": "ai", "label": "Ghi nhận việc dùng AI (nếu có)", "hint": "công cụ đã dùng và phần việc AI hỗ trợ", "long": false}], "checks": ["Nội dung chính xác", "Người xem làm theo được ngay", "Có ví dụ thực, có nguồn (chỉ áp dụng cho phương án A)", "Không vi phạm bản quyền", "Đáp ứng nhiệm vụ, YCCĐ — Đạt: Có ít nhất hai rủi ro xếp đúng nhóm, hai biện pháp khả thi và một vấn đề đạo đức gắn với quyết định. | Khá: Rủi ro gắn đúng với điểm cụ thể của dự án, biện pháp khớp với từng rủi ro; quyết định nêu điều kiện cụ thể. | Tốt: Phân tích được rủi ro thuộc nhiều nhóm; biện pháp khả thi, có phương án ít dữ liệu hơn; lập luận rõ.", "Kiểm chứng và tư duy phản biện — Đạt: Nêu được một lí do cho quyết định khi có gợi ý. | Khá: Đối chiếu ý kiến của các vai và phát hiện điểm đáng ngờ của dự án (độ chính xác, sự đồng ý). | Tốt: Nêu được giới hạn của thông tin; giữ hoặc điều chỉnh quyết định có căn cứ sau chất vấn và sau tư liệu ở PL8.4.5.", "An toàn, đạo đức, trách nhiệm — Đạt: Không đề xuất thu thêm dữ liệu không cần thiết. | Khá: Chủ động bảo vệ dữ liệu khuôn mặt; giải thích được lựa chọn có trách nhiệm. | Tốt: Phân tích được tác động tới công bằng và quyền lợi của các bên; chỉ rõ người chịu trách nhiệm kiểm tra, sửa sai."], "sample": "Câu hỏi (1) ở mục b). Người thân hoặc bạn trong nhóm có làm theo được ngay sản phẩm của em không? Sản phẩm làm theo được khi dùng động từ hành động (“gọi lại bằng số cũ”, “không đọc mã OTP”), ít chữ, có ví dụ gần gũi; tốt nhất là HS đã thử đọc cho người thân nghe và sửa theo góp ý. Gợi ý phương án A: ba bước Dừng, Hỏi, Kiểm như thẻ Trạm 3; một vụ việc thật lấy từ cảnh báo trên trang chính thức của cơ quan công an, báo chí chính thống, bản tin truyền hình, báo giấy hoặc cảnh báo của nhà trường, ghi tên nguồn và ngày đăng hoặc phát. Gợi ý phương án B (năm điều, ví dụ). (1) Không nhập họ tên, ảnh, số điện thoại của thành viên vào công cụ AI. (2) Kiểm chứng mọi thông tin AI đưa ra với ít nhất một nguồn chính thống trước khi dùng. (3) Không dùng AI tạo lời lẽ, hình ảnh chế giễu hay gây tổn thương người khác. (4) Ghi rõ phần nào có AI hỗ trợ, ghi nguồn ảnh, tư liệu. (5) Cả nhóm cùng chịu trách nhiệm về sản phẩm, có một bạn rà lại trước khi nộp. Mức tốt của sản phẩm: đủ các tiêu chí trên thẻ (phương án A: bốn tiêu chí; phương án B: tiêu chí 1, 2, 4); không chứa dữ liệu cá nhân thật; nếu có dùng AI thì ghi kèm theo mẫu khai báo năm ý (PLC.6). Mẫu câu nhận xét: - “Em xếp đúng ba nhóm rủi ro và nêu được dấu hiệu ‘thúc giục gấp’ cho nhóm giả mạo. Ở nhận định 1, em mới ghi ‘vì sai’. Em thử nghĩ: còn thông tin nào giúp người khác nhận ra em?” - “Việc làm ở Trạm 3 của em cụ thể, làm được ngay. Ô Trạm 1 còn chung chung. Em ghi rõ một loại dữ liệu em sẽ không nhập vào công cụ AI.” - “Em gắn được vấn đề bảo mật thông tin với chỗ lưu ảnh khuôn mặt. Vấn đề thứ hai còn chưa gắn với dự án. Em thử hỏi: nếu máy nhận nhầm thì ai bị thiệt?”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 8 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
