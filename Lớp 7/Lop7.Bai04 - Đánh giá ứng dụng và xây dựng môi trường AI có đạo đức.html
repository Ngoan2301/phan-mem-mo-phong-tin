<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 4. Đánh giá ứng dụng AI và xây dựng môi trường AI có đạo đức – Lớp 7</title>
<style>
:root{--o:#8e44ad;--od:#6a3381;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🧰", "title": "Bài 4. Đánh giá ứng dụng AI và xây dựng môi trường AI có đạo đức – Lớp 7", "ainote": "Các ứng dụng trên thẻ (StudyAceAI, RollCallFace, PhotoFixPro, StoryPalAI) đều là giả định. Cấp quyền, cài hay không cài ứng dụng là quyết định của em cùng cha mẹ; khi báo lỗi chỉ mô tả lỗi, không gửi ảnh có mặt người hay thông tin cá nhân; việc nghiêm trọng như lừa đảo, bắt nạt thì báo thầy cô hoặc cha mẹ.", "takeaways": ["Ứng dụng AI cần được đánh giá trước và trong khi dùng, không mặc nhiên tin dùng.", "Năm tiêu chí xuất phát từ nguyên tắc đạo đức: riêng tư và bảo vệ dữ liệu; công bằng, không thiên vị; minh bạch; chính xác và an toàn; trách nhiệm và kiểm soát của con người.", "Kết luận về ứng dụng chỉ có căn cứ khi chỉ ra được dấu hiệu cụ thể; một ứng dụng có thể đạt tiêu chí này nhưng chưa đạt tiêu chí khác.", "Khi ứng dụng xin quyền truy cập, tự hỏi tính năng chính có thật sự cần quyền đó không; không cần thì từ chối hoặc chỉ cho phép khi đang dùng.", "Môi trường AI có đạo đức được tạo nên từ hành động cụ thể của người dùng: báo cáo lỗi, không cài hay chia sẻ ứng dụng độc hại, yêu cầu sự minh bạch, bảo vệ dữ liệu cá nhân, kiểm chứng kết quả, không dùng AI làm hại người khác."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Ứng dụng chỉnh ảnh xin quá nhiều quyền", "nav": "Ứng dụng xin quyền", "icon": "📸", "badge": "Người dùng thận trọng", "intro": "Tình huống (giả định): Minh tải về một ứng dụng chỉnh ảnh dùng AI, miễn phí. Ứng dụng đòi quyền truy cập toàn bộ ảnh, danh bạ và micro. Ít ngày sau Minh thấy ảnh của mình xuất hiện trong quảng cáo, còn ứng dụng không hề cho biết lấy ảnh để làm gì. Tên Minh là tên giả định. Em trả lời ba câu hỏi: có nên tiếp tục dùng không, vì sao; trước khi cài một ứng dụng AI cần kiểm tra gì.", "app": "📲 Cài đặt ứng dụng (mô phỏng)", "hello": "PhotoFix muốn truy cập: ảnh, danh bạ, micro. [Cho phép] [Từ chối]", "meters": [{"n": "An toàn dữ liệu cá nhân", "b": 40, "c": 0}, {"n": "Hiểu rõ ứng dụng", "b": 30, "c": 1}, {"n": "Nguy cơ bị lợi dụng", "b": 60, "c": 2}], "chars": [{"n": "Minh lúc cài ứng dụng", "color": "#4aa3ff", "task": "Ứng dụng chỉ chỉnh một tấm ảnh nhưng xin quyền ảnh, danh bạ, micro. Minh nên làm gì?", "opts": [{"t": "Bấm “Cho phép” hết cho nhanh", "chat": null, "ch": [-30, -10, 35], "v": "bad", "fb": "Quyền không cần cho chức năng chỉnh ảnh (danh bạ, micro) là dấu hiệu cần thận trọng. Dữ liệu đã chia sẻ khó thu hồi."}, {"t": "Tự hỏi chức năng chính có cần quyền đó không; từ chối quyền không cần, hỏi cha mẹ nếu chưa chắc", "chat": null, "ch": [30, 20, -30], "v": "good", "fb": "Đúng quy tắc: không cần thì từ chối hoặc chỉ cho phép khi đang dùng; xem lại, thu hồi quyền trong Cài đặt; hỏi người lớn khi chưa chắc."}]}, {"n": "Câu hỏi (1): ảnh Minh xuất hiện trong quảng cáo", "color": "#ff6b9d", "task": "Em có nên tiếp tục dùng ứng dụng này không? Vì sao?", "opts": [{"t": "Tiếp tục dùng vì ứng dụng miễn phí và chỉnh ảnh đẹp", "chat": null, "ch": [-30, -15, 30], "v": "bad", "fb": "Ứng dụng lấy dữ liệu quá mức cần thiết và không giải thích mục đích nên không nên tin dùng."}, {"t": "Không nên tiếp tục dùng hoặc cần xem lại, vì ứng dụng lấy dữ liệu quá mức cần thiết và không giải thích mục đích", "chat": null, "ch": [25, 35, -30], "v": "good", "fb": "Câu trả lời mong đợi: không nên tiếp tục dùng hoặc cần xem lại, vì ứng dụng lấy dữ liệu quá mức cần thiết và không giải thích mục đích."}]}, {"n": "Câu hỏi (2): trước khi cài một ứng dụng AI", "color": "#3fbf8f", "task": "Trước khi cài một ứng dụng AI, em muốn kiểm tra những điều gì?", "opts": [{"t": "Chỉ xem ứng dụng có đẹp và miễn phí không", "chat": null, "ch": [-20, -10, 25], "v": "bad", "fb": "Chưa kiểm tra quyền, dữ liệu, người tạo ra, độ tin cậy hay nơi báo lỗi."}, {"t": "Ứng dụng xin quyền gì và có cần thiết không; dữ liệu được dùng vào việc gì; ai tạo ra ứng dụng; kết quả có đáng tin không; có nơi báo lỗi hay không", "chat": null, "ch": [25, 35, -25], "v": "good", "fb": "Câu trả lời mong đợi gồm ít nhất hai trong các điều trên. Nhóm các ý: quyền truy cập, dữ liệu dùng vào việc gì vào nhóm “dữ liệu cá nhân”; kết quả có đáng tin vào nhóm “độ tin cậy”; ai tạo ra, có nơi báo lỗi vào nhóm “trách nhiệm”. Đây là dẫn vào bảng năm tiêu chí ở HĐ 2.1. Ý kiến của cặp chỉ dùng để chẩn đoán."}]}]}, {"type": "match", "tag": "HĐ2.1 • Năm tiêu chí", "title": "Năm tiêu chí đánh giá ứng dụng AI", "nav": "Năm tiêu chí", "icon": "📏", "badge": "Người đánh giá", "intro": "Ghép mỗi tiêu chí (kèm nguyên tắc đạo đức) với câu hỏi kiểm tra tương ứng. Em ghi tên năm tiêu chí kèm một câu hỏi kiểm tra cho mỗi tiêu chí vào vở.", "pairs": [["1. Riêng tư và bảo vệ dữ liệu (nguyên tắc: Tôn trọng quyền riêng tư)", "Ứng dụng xin những thông tin và quyền truy cập nào, có cần thiết cho chức năng không; dữ liệu được lưu, dùng, chia sẻ ra sao?"], ["2. Công bằng, không thiên vị (nguyên tắc: Công bằng)", "Kết quả từ ứng dụng có phân biệt đối xử hoặc đưa ra nhận định sai với một nhóm người hoặc đối tượng không?"], ["3. Minh bạch (nguyên tắc: Minh bạch, giải thích được)", "Ứng dụng có nói rõ nó dùng AI, lấy dữ liệu gì, hoạt động thế nào và có thể sai ở đâu không?"], ["4. Chính xác và an toàn (nguyên tắc: An toàn, không gây hại)", "Kết quả có đáng tin, kiểm chứng được không; nội dung có phù hợp lứa tuổi, không độc hại, không lừa đảo không?"], ["5. Trách nhiệm và kiểm soát của con người (nguyên tắc: Con người chịu trách nhiệm)", "Ai tạo ra và chịu trách nhiệm; người dùng có quyền lựa chọn, tắt, xoá dữ liệu, báo lỗi, khiếu nại không?"]], "why": "Mỗi tiêu chí xuất phát từ một nguyên tắc đạo đức. Bảng là học liệu để đối chiếu; khi đánh giá, em phải dẫn dấu hiệu cụ thể trên thẻ ứng dụng."}, {"type": "flag", "tag": "HĐ2.1 • Đối chiếu thẻ ứng dụng", "title": "Đọc Thẻ A, B, C: dấu hiệu chưa đạt", "nav": "Thẻ ứng dụng A, B, C", "icon": "🕵️", "badge": "Dấu hiệu cụ thể", "intro": "Mỗi dòng là một chi tiết nguyên văn trên thẻ ứng dụng giả định (không mô tả ứng dụng có thật). Gắn cờ chi tiết cho thấy ứng dụng <b>chưa đạt</b> một tiêu chí; chi tiết tốt hoặc chưa đủ để kết luận thì để nguyên. Chỉ nêu cảm nhận (“ứng dụng có vẻ không an toàn”) là chưa có dấu hiệu: em phải dẫn một chi tiết có trên thẻ.", "cols": ["Thẻ", "Chi tiết trên thẻ", "Tiêu chí liên quan"], "flagWhat": "chưa đạt một tiêu chí đánh giá", "rows": [{"c": ["A. StudyAceAI (trợ lí giải bài tập)", "Giải mọi bài tập trong vài giây và trình bày rất tự tin.", "Hiệu quả"], "bad": false}, {"c": ["A. StudyAceAI", "Một số đáp án sai nhưng không có cảnh báo hay nguồn tham khảo.", "Chính xác, an toàn và minh bạch"], "bad": true, "why": "Chính xác và an toàn: một số đáp án sai. Minh bạch: không có nguồn tham khảo, không cảnh báo giới hạn. Cần ghi rõ giới hạn và nguồn."}, {"c": ["A. StudyAceAI", "Muốn dùng phải nhập họ tên, trường, lớp.", "Riêng tư"], "bad": true, "why": "Bắt nhập họ tên, trường, lớp là không cần thiết để giải bài. Cần chỉ yêu cầu thông tin tối thiểu."}, {"c": ["A. StudyAceAI", "Không có nút báo lỗi.", "Trách nhiệm và kiểm soát của con người"], "bad": true, "why": "Thiếu kiểm soát của con người. Cần thêm nút báo lỗi."}, {"c": ["A. StudyAceAI", "Dành cho mọi lứa tuổi.", "Chính xác và an toàn"], "bad": true, "why": "Thẻ ghi “Dành cho mọi lứa tuổi” nhưng không cảnh báo đáp án có thể sai."}, {"c": ["B. RollCallFace (điểm danh bằng khuôn mặt)", "Nhận ra khuôn mặt chỉ trong một giây.", "Hiệu quả"], "bad": false}, {"c": ["B. RollCallFace", "Nhà phát triển cho biết ứng dụng nhận sai nhiều hơn với học sinh đeo kính hoặc có tóc mái che trán vì dữ liệu huấn luyện có ít ảnh của các bạn này.", "Công bằng"], "bad": true, "why": "Chưa công bằng với nhóm đeo kính, có tóc mái che trán. Điểm tốt: nhà phát triển công bố hạn chế của ứng dụng. Cần bổ sung dữ liệu đa dạng."}, {"c": ["B. RollCallFace", "Ảnh khuôn mặt được lưu vô thời hạn trên máy chủ của công ty, chưa thông báo cho phụ huynh.", "Riêng tư"], "bad": true, "why": "Cần đặt thời hạn lưu và xin đồng ý của phụ huynh."}, {"c": ["B. RollCallFace", "Học sinh bị ghi vắng nhầm không biết khiếu nại ở đâu.", "Trách nhiệm và kiểm soát của con người"], "bad": true, "why": "Không có kênh khiếu nại. Cần có cách khiếu nại khi ghi nhầm."}, {"c": ["C. PhotoFixPro (chỉnh ảnh bằng AI)", "Chỉnh ảnh đẹp, miễn phí.", "Hiệu quả"], "bad": false}, {"c": ["C. PhotoFixPro", "Đòi quyền truy cập toàn bộ ảnh, danh bạ, vị trí GPS, micro dù chỉ chỉnh một ảnh.", "Riêng tư"], "bad": true, "why": "Xin quyền quá mức. Cần chỉ xin quyền cần thiết."}, {"c": ["C. PhotoFixPro", "Điều khoản nói dữ liệu có thể chia sẻ cho đối tác quảng cáo nhưng viết rất dài, khó hiểu.", "Minh bạch"], "bad": true, "why": "Điều khoản dài, khó hiểu. Cần viết ngắn, dễ hiểu."}, {"c": ["C. PhotoFixPro", "Có nút báo cáo nội dung không phù hợp.", "Trách nhiệm và kiểm soát của con người"], "bad": false}, {"c": ["C. PhotoFixPro", "Thỉnh thoảng hiện quảng cáo không phù hợp lứa tuổi.", "Chính xác và an toàn"], "bad": true, "why": "Cần lọc quảng cáo theo tuổi."}], "after": "Kết luận mong đợi của nhóm: ứng dụng chưa phù hợp, chưa an toàn để dùng hoặc chỉ nên dùng khi đã được điều chỉnh. Lí do là các tiêu chí chưa đạt, mỗi tiêu chí dẫn được một dấu hiệu trên thẻ. Kết luận “nên dùng” chỉ được chấp nhận khi chỉ ra được dấu hiệu cho thấy các điểm chưa đạt không ảnh hưởng tới người dùng. Một ứng dụng có thể đạt tiêu chí này nhưng chưa đạt tiêu chí khác: Thẻ C có nút báo cáo nội dung (điểm tốt về trách nhiệm) nhưng xin quyền quá mức (chưa đạt về riêng tư); Thẻ B công bố hạn chế của mình nhưng chưa công bằng với một nhóm học sinh. Điều cần điều chỉnh: Thẻ A chỉ yêu cầu thông tin tối thiểu, ghi rõ giới hạn và nguồn, thêm nút báo lỗi; Thẻ B bổ sung dữ liệu đa dạng, đặt thời hạn lưu và xin đồng ý của phụ huynh, có cách khiếu nại; Thẻ C chỉ xin quyền cần thiết, viết điều khoản ngắn dễ hiểu, lọc quảng cáo theo tuổi. So sánh: Thẻ A và Thẻ C cùng đòi dữ liệu vượt nhu cầu nhưng Thẻ C có nút báo cáo còn Thẻ A không có nút báo lỗi. Câu hỏi cuối tiết 1: khi ứng dụng chưa đạt tiêu chí thì người dùng có thể làm gì? (trả lời ở HĐ 2.2)."}, {"type": "quiz", "tag": "HĐ2.1 • Phản biện và kết luận", "title": "Dấu hiệu, kết luận và quyền truy cập", "nav": "Phản biện kết luận", "icon": "🧐", "badge": "Người phản biện", "intro": "Trả lời các câu hỏi phản biện sau khi đối chiếu thẻ ứng dụng, và nhớ quy tắc khi ứng dụng xin quyền truy cập (ảnh, danh bạ, vị trí GPS, micro).", "qs": [{"q": "Dấu hiệu nào trong thẻ cho thấy ứng dụng đạt hoặc chưa đạt tiêu chí này?", "opts": ["“Ứng dụng có vẻ không an toàn”", "Một chi tiết có trên thẻ, ví dụ “lưu vô thời hạn” (Thẻ B, riêng tư) hoặc “viết rất dài, khó hiểu” (Thẻ C, minh bạch)", "“Em không thích ứng dụng này”"], "a": 1, "why": "HS phải dẫn một chi tiết có trên thẻ. Câu trả lời chỉ nêu cảm nhận (“ứng dụng có vẻ không an toàn”) là chưa có dấu hiệu."}, {"q": "Một ứng dụng có thể đạt tiêu chí này nhưng chưa đạt tiêu chí khác không?", "opts": ["Không, đạt một tiêu chí là đạt tất cả", "Có, ví dụ Thẻ C có nút báo cáo nội dung (điểm tốt về trách nhiệm) nhưng xin quyền quá mức (chưa đạt về riêng tư)", "Chỉ ứng dụng miễn phí mới như vậy"], "a": 1, "why": "Có. Thẻ B công bố hạn chế của mình nhưng chưa công bằng với một nhóm học sinh."}, {"q": "Nhóm trình bày chưa chỉ lại được chi tiết trên thẻ khi GV hỏi “Dấu hiệu nào cho thấy ứng dụng chưa đạt tiêu chí đó?”. GV nên làm gì?", "opts": ["Đề nghị nhóm đọc lại thẻ thay vì sửa kết luận ngay", "Sửa kết luận cho nhóm", "Bỏ qua câu hỏi"], "a": 0, "why": "Nhóm trình bày phải chỉ lại được chi tiết trên thẻ; chưa chỉ được thì GV đề nghị nhóm đọc lại thẻ thay vì sửa kết luận ngay."}, {"q": "Quy tắc khi ứng dụng xin quyền truy cập (ảnh, danh bạ, vị trí GPS, micro) là gì? (chọn nhiều đáp án)", "opts": ["Tự hỏi tính năng chính của ứng dụng có thật sự cần quyền này không", "Không cần thì từ chối hoặc chỉ cho phép khi đang dùng", "Xem lại, thu hồi quyền trong phần Cài đặt; hỏi người lớn khi chưa chắc", "Cho phép hết để ứng dụng chạy mượt"], "a": [0, 1, 2], "why": "Đây là quy tắc GV nêu ở B4. Cho phép hết là dấu hiệu chưa cân nhắc."}, {"q": "Bảng kiểm ba ý cho phiếu nhóm gồm những ý nào? (chọn nhiều đáp án)", "opts": ["Nêu được tiêu chí (ít nhất ba tiêu chí trong bảng năm tiêu chí)", "Chỉ ra được dấu hiệu trong thẻ cho mỗi tiêu chí đã chọn", "Kết luận có căn cứ, nhất quán với các dấu hiệu đã nêu", "Kết luận dài ít nhất mười dòng"], "a": [0, 1, 2], "why": "Mô tả mức Khá: phân biệt được điều thẻ đã nói rõ và điều thẻ chưa nói; kết luận nhất quán với dấu hiệu. Mức Tốt: nêu được giới hạn của thông tin trên thẻ (là điều nhà phát triển công bố, cần kiểm chứng); cân nhắc cả điểm tốt và điểm chưa tốt; giữ hoặc điều chỉnh kết luận có căn cứ sau phản biện."}]}, {"type": "sort", "tag": "HĐ2.2 • Hành động của người dùng", "title": "Làm gì để môi trường AI có đạo đức?", "nav": "Hành động người dùng", "icon": "🤝", "badge": "Người dùng có trách nhiệm", "intro": "Bộ thẻ tình huống T1–T4 (giả định). Với mỗi thẻ, kéo vào nhóm hành động phù hợp nhất; ghi ai làm, làm thế nào và tác dụng. Hành động phải cụ thể: nêu rõ ai làm, làm gì, ở đâu hoặc bằng cách nào (không dừng ở “cần cẩn thận hơn”).", "cats": ["Báo cáo lỗi, nội dung không phù hợp", "Không cài, không chia sẻ ứng dụng độc hại", "Yêu cầu sự minh bạch", "Không tạo, không chuyển tiếp; bảo vệ bạn bị ảnh hưởng", "Bảo vệ dữ liệu, kiểm chứng, hỏi người lớn"], "cards": [{"t": "T1. Một trợ lí AI trả lời sai về một sự kiện lịch sử và đưa ra nội dung không phù hợp lứa tuổi.", "g": [0], "why": "Hành động: báo cáo lỗi và nội dung không phù hợp; không chia sẻ câu trả lời sai. Ai làm, như thế nào: HS dùng nút báo cáo hoặc nhờ thầy cô, phụ huynh gửi phản hồi, chỉ mô tả lỗi, không gửi thông tin cá nhân. Tác dụng: giúp nhà phát triển sửa lỗi và hạn chế sai lệch lan rộng."}, {"t": "T2. Bạn gửi đường dẫn tải ứng dụng chỉnh ảnh miễn phí từ trang lạ; nhiều người cho biết bị mất tài khoản sau khi cài.", "g": [1], "why": "Hành động: không cài, không chia sẻ ứng dụng độc hại hoặc không rõ nguồn gốc. Ai làm, như thế nào: HS chỉ tải từ cửa hàng ứng dụng chính thức (App Store, Google Play…), nhắc bạn dừng chia sẻ, báo thầy cô hoặc phụ huynh. Tác dụng: tránh mất tài khoản, lộ dữ liệu và ngăn ứng dụng độc hại lan truyền."}, {"t": "T3. Một ứng dụng học tiếng Anh thu âm giọng nói của em nhưng không nói rõ dùng việc gì và lưu bao lâu.", "g": [2], "why": "Hành động: yêu cầu sự minh bạch. Ai làm, như thế nào: HS đọc điều khoản cùng người lớn, gửi câu hỏi tới nhà phát triển, tạm dừng dùng chức năng thu âm cho đến khi có trả lời. Tác dụng: giúp em biết giọng nói được dùng làm gì, lưu bao lâu; nhà phát triển biết người dùng cần được giải thích; bảo vệ quyền riêng tư."}, {"t": "T4. Một bạn dùng AI ghép mặt bạn khác vào ảnh hài hước để trêu rồi gửi vào nhóm lớp.", "g": [3], "why": "Hành động: không tạo, không chuyển tiếp; bảo vệ bạn bị ảnh hưởng. Ai làm, như thế nào: HS nhắc bạn xoá ảnh, báo giáo viên, hỗ trợ bạn bị trêu. Tác dụng: không để AI bị dùng để làm tổn hại người khác. Hành động mong đợi bắt đầu bằng không chuyển tiếp ảnh và báo thầy cô; HS không tự xử lí bạn trêu, không trả đũa."}, {"t": "Của nhóm (ví dụ): Ghi rõ khi dùng AI hỗ trợ làm bài; kiểm chứng kết quả AI trước khi dùng.", "g": [4], "why": "Cách làm: HS ghi chú trong bài và đối chiếu với sách hoặc nguồn tin cậy. Tác dụng: trung thực và giảm tin vào thông tin sai."}, {"t": "Chỉ cấp quyền cần thiết, không nhập thông tin không cần.", "g": [4], "why": "Bảo vệ dữ liệu cá nhân là một trong các hành động của người dùng khi ứng dụng chưa đạt tiêu chí."}, {"t": "Hỏi người lớn trước khi quyết định cài một ứng dụng hoặc cấp quyền.", "g": [4], "why": "Hỏi người lớn trước khi quyết định; GV ưu tiên hành động HS lớp 7 làm được, như không chuyển tiếp ảnh trêu bạn, hỏi người lớn trước khi cài ứng dụng."}], "pass": 0.7}, {"type": "decide", "tag": "HĐ3 • Luyện tập", "title": "Máy quét đánh giá ứng dụng kể chuyện StoryPalAI", "nav": "Đánh giá ứng dụng", "icon": "📖", "badge": "Nhà đánh giá", "intro": "Thẻ D. StoryPalAI (kể chuyện cho trẻ em), giả định: tạo truyện ngắn theo chủ đề em chọn và ghi rõ đây là truyện do AI tạo, có thể có sai sót. Có chức năng thu âm giọng em đọc lại truyện để luyện đọc. Có bộ lọc nội dung theo tuổi và nút báo cáo. Dùng được không cần tài khoản, nhưng muốn lưu truyện phải đăng kí bằng số điện thoại của phụ huynh. Điều khoản có bản rút gọn dễ đọc nhưng không nói giọng đọc của trẻ được lưu bao lâu. Phần lớn nhân vật nhà khoa học trong truyện là nam. Thẻ D có cả điểm tốt và điểm chưa tốt nên em phải cân nhắc cả hai mặt. Trả lời ba câu hỏi rồi thử máy quét với các thẻ A, B, C, D.", "questions": ["Ứng dụng có xin dữ liệu hoặc quyền vượt nhu cầu, hoặc không nói rõ dữ liệu dùng vào việc gì, lưu bao lâu?", "Ứng dụng có dấu hiệu sai, nội dung không phù hợp lứa tuổi hoặc nguy hại mà không cảnh báo, không lọc?", "Người dùng có cách kiểm soát (báo lỗi, khiếu nại, tắt, xoá dữ liệu) không?"], "verdicts": ["Nên dùng", "Dùng có điều kiện", "Không nên dùng"], "rules": [{"when": [1, 1, null], "v": 2}, {"when": [null, 1, 0], "v": 2}, {"when": [1, 0, 0], "v": 2}, {"when": [1, 0, 1], "v": 1}, {"when": [0, 1, 1], "v": 1}, {"when": [0, 0, 1], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "Thẻ A. StudyAceAI (trợ lí giải bài tập): giải mọi bài tập trong vài giây và trình bày rất tự tin. Một số đáp án sai nhưng không có cảnh báo hay nguồn tham khảo. Muốn dùng phải nhập họ tên, trường, lớp. Không có nút báo lỗi. Dành cho mọi lứa tuổi.", "v": 2, "why": "Chưa đạt riêng tư, chính xác và an toàn, minh bạch, trách nhiệm; không nêu điểm tốt. Chưa phù hợp, chưa an toàn để dùng hoặc chỉ nên dùng khi được điều chỉnh."}, {"t": "Thẻ B. RollCallFace (điểm danh bằng khuôn mặt): nhận sai nhiều hơn với học sinh đeo kính hoặc có tóc mái che trán vì dữ liệu huấn luyện ít ảnh; ảnh khuôn mặt lưu vô thời hạn, chưa thông báo cho phụ huynh; học sinh bị ghi vắng nhầm không biết khiếu nại ở đâu.", "v": [2, 1], "why": "Chưa công bằng, chưa riêng tư, thiếu kiểm soát của con người; điểm tốt: nhà phát triển công bố hạn chế của ứng dụng. Cần điều chỉnh trước khi dùng."}, {"t": "Thẻ C. PhotoFixPro (chỉnh ảnh bằng AI): chỉnh ảnh đẹp, miễn phí; đòi quyền truy cập toàn bộ ảnh, danh bạ, vị trí GPS, micro dù chỉ chỉnh một ảnh; điều khoản viết rất dài, khó hiểu; có nút báo cáo nội dung không phù hợp; thỉnh thoảng hiện quảng cáo không phù hợp lứa tuổi.", "v": [2, 1], "why": "Xin quyền quá mức, điều khoản khó hiểu, quảng cáo không phù hợp lứa tuổi; điểm tốt: có nút báo cáo. Chưa phù hợp, chỉ nên dùng khi đã điều chỉnh."}, {"t": "Thẻ D. StoryPalAI: ghi rõ truyện do AI tạo, có thể có sai sót; có bộ lọc nội dung theo tuổi và nút báo cáo; dùng được không cần tài khoản; nhưng thu âm giọng đọc không nói lưu bao lâu, muốn lưu truyện phải đăng kí bằng số điện thoại của phụ huynh, phần lớn nhân vật nhà khoa học là nam.", "v": [1, 2], "why": "Câu 2, kết luận gợi ý: dùng có điều kiện. Điểm tốt: ghi rõ truyện do AI tạo, có bộ lọc theo tuổi, có nút báo cáo, dùng được không cần tài khoản. Điểm cần lưu ý là riêng tư (giọng đọc, số điện thoại phụ huynh) và công bằng (nhân vật nhà khoa học phần lớn là nam). Điều kiện có thể là: dùng không cần tài khoản, không dùng chức năng thu âm cho tới khi biết giọng đọc được lưu bao lâu, có phụ huynh cùng xem điều khoản. Cùng một thẻ hai nhóm có thể kết luận khác nhau vì mỗi nhóm cân nhắc mức quan trọng của từng điểm khác nhau, ví dụ nhóm coi việc không nói thời gian lưu giọng đọc là nghiêm trọng thì chọn “không nên dùng”. Kết luận nào cũng cần dấu hiệu và lí do; kết luận chỉ dựa vào một chi tiết là kết luận vội."}]}, {"type": "flag", "tag": "HĐ3 • Luyện tập", "title": "Phiếu số 3: dấu hiệu trên Thẻ D theo từng tiêu chí", "nav": "Dấu hiệu Thẻ D", "icon": "📋", "badge": "Người kiểm chứng", "intro": "Nhóm chọn ít nhất ba tiêu chí, ghi dấu hiệu quan sát được trong Thẻ D và nhận xét Đạt hoặc Chưa đạt. Gắn cờ những dấu hiệu cho thấy Thẻ D chưa đạt hoặc chỉ đạt một phần. Thông tin trên thẻ là điều nhà phát triển công bố, vẫn cần kiểm chứng.", "cols": ["Tiêu chí", "Dấu hiệu trên Thẻ D", "Nhận xét gợi ý"], "flagWhat": "chưa đạt hoặc đạt một phần", "rows": [{"c": ["Riêng tư và bảo vệ dữ liệu", "Có chức năng thu âm giọng đọc nhưng không nói giọng đọc được lưu bao lâu; muốn lưu truyện phải đăng kí bằng số điện thoại của phụ huynh.", "Chưa đạt, cần lưu ý"], "bad": true, "why": "Chưa đạt, cần lưu ý."}, {"c": ["Công bằng, không thiên vị", "Phần lớn nhân vật nhà khoa học trong truyện là nam.", "Chưa đạt"], "bad": true, "why": "Chưa đạt."}, {"c": ["Minh bạch", "Ghi rõ truyện do AI tạo, có thể có sai sót; điều khoản có bản rút gọn dễ đọc.", "Đạt một phần"], "bad": false}, {"c": ["Minh bạch", "Không nói thời gian lưu giọng đọc.", "Đạt một phần"], "bad": true, "why": "Phiếu chỉ có hai ô Đạt, Chưa đạt: chấp nhận cả hai nếu nhóm nêu đúng dấu hiệu, ví dụ “Đạt vì ghi rõ truyện do AI tạo” hoặc “Chưa đạt vì không nói giọng đọc được lưu bao lâu”."}, {"c": ["Chính xác và an toàn", "Có bộ lọc nội dung theo tuổi; có ghi truyện có thể có sai sót.", "Đạt (vẫn cần kiểm chứng bộ lọc có hiệu quả hay không)"], "bad": false}, {"c": ["Trách nhiệm và kiểm soát của con người", "Có nút báo cáo.", "Đạt một phần"], "bad": false}, {"c": ["Trách nhiệm và kiểm soát của con người", "Thẻ không nói ai tạo ra và chịu trách nhiệm, không nói quyền xoá dữ liệu.", "Đạt một phần"], "bad": true, "why": "Chấp nhận “Đạt vì có nút báo cáo” hoặc “Chưa đạt vì thẻ không nói ai chịu trách nhiệm và quyền xoá dữ liệu” nếu nhóm nêu đúng dấu hiệu."}, {"c": ["Điểm tốt khác", "Dùng được không cần tài khoản.", "Điểm tốt"], "bad": false}], "after": "Câu 3, hành động gợi ý: đọc điều khoản cùng phụ huynh; dùng không cần tài khoản, không dùng chức năng thu âm giọng đọc. Gửi phản hồi về nhân vật thiên lệch qua nút báo cáo; đề nghị nhà phát triển nêu rõ thời gian lưu giọng đọc. Điều nhà phát triển nên sửa: nêu rõ giọng đọc được lưu bao lâu và cách xoá; cho phép lưu truyện mà không cần số điện thoại; để nhân vật nhà khoa học trong truyện có cả nam và nữ."}, {"type": "build", "tag": "HĐ4 • Vận dụng (Phần A)", "title": "Phiếu số 4, Phần A: em tự đánh giá Thẻ D", "nav":  nút báo cáo và bộ lọc theo tuổi nhưng không nói giọng đọc lưu bao lâu.” Mẫu nhận xét: “Em đã chọn đúng ba tiêu chí và tìm được dấu hiệu trên Thẻ D cho từng tiêu chí. Lí do kết luận của em mới nêu điểm chưa tốt. Lần sau, em thêm một điểm tốt của ứng dụng để kết luận cân đối hơn.”"}, {"type": "build", "tag": "HĐ4 • Vận dụng (Phần B)", "title": "Phiếu số 4, Phần B: thẻ cam kết của em", "nav": "Thẻ cam kết", "icon": "🌱", "badge": "Cam kết xanh", "intro": "Viết ba hành động em sẽ làm để xây dựng môi trường AI có đạo đức, theo mẫu: <b>Khi …, em sẽ … để …</b>. Hành động phải cụ thể, làm được ở lớp 7. Không ghi họ tên thật của người khác, ảnh hay thông tin gia đình. Phiếu số 5 (ở nhà, không bắt buộc): cùng người lớn đánh giá một ứng dụng hoặc thiết bị AI trong gia đình bằng ít nhất ba tiêu chí; không cài thêm ứng dụng mới, không ghi tên tài khoản, địa chỉ hay ảnh của gia đình; kết luận dùng tiếp hay không là quyết định của gia đình; thấy ứng dụng đáng ngờ thì báo người lớn hoặc thầy cô.", "fields": [{"id": "h1", "label": "1. Khi …, em sẽ … để …", "hint": "Nói rõ khi nào, làm gì, để làm gì", "ph": "VD: Khi thấy trợ lí AI trả lời sai hoặc có nội dung không phù hợp, em sẽ bấm nút báo cáo hoặc nhờ thầy cô gửi phản hồi để nhà phát triển sửa lỗi."}, {"id": "h2", "label": "2. Khi …, em sẽ … để …", "hint": "Chọn nhóm hành động khác hành động 1", "ph": "VD: Khi bạn gửi đường dẫn tải ứng dụng từ trang lạ, em sẽ không cài, không chia sẻ tiếp và báo thầy cô để tránh mất tài khoản."}, {"id": "h3", "label": "3. Khi …, em sẽ … để …", "hint": "Có thể là yêu cầu minh bạch hoặc bảo vệ dữ liệu", "ph": "VD: Khi một ứng dụng thu âm giọng em mà không nói rõ để làm gì, em sẽ tạm dừng chức năng đó và đọc điều khoản cùng bố mẹ để bảo vệ quyền riêng tư của mình."}, {"id": "cl", "label": "Cam kết thêm cho lớp hoặc gia đình (nếu em muốn)", "hint": "Tuỳ chọn", "ph": "VD: Đề xuất quy ước chung của lớp khi dùng ứng dụng AI.", "long": false}, {"id": "pl5", "label": "Phiếu số 5 (tuỳ chọn): ứng dụng hoặc thiết bị AI ở gia đình em chọn và tiêu chí đã dùng", "hint": "Không ghi tên tài khoản, địa chỉ, ảnh", "ph": "VD: Trợ lí giọng nói; tiêu chí minh bạch, riêng tư, kiểm soát.", "long": false}, {"id": "muc", "label": "Mức dùng AI cho phiếu này", "opts": ["Không dùng AI", "GV trình diễn", "Em dùng công cụ", "Nhóm dùng công cụ", "Công cụ tạo một phần sản phẩm"]}, {"id": "conf", "label": "Mức tự tin của em sau bài học", "opts": ["Cần học thêm", "Khá tự tin", "Rất tự tin"]}], "checks": ["Mức đạt: ba hành động, mỗi hành động có đủ ba vế “Khi …” (khi nào), “em sẽ …” (làm gì, làm được ở lứa tuổi lớp 7), “để …” (tác dụng).", "Chưa thấy minh chứng: hành động chung chung, không quan sát được (“em sẽ dùng AI thật tốt”, “em sẽ cẩn thận hơn”); hành động vượt khả năng HS lớp 7 (“em sẽ bắt nhà phát triển sửa ứng dụng”); thiếu vế “để …”.", "Mức Khá: hành động cụ thể, tác dụng nêu ở vế “để …” gắn đúng với hành động.", "Mức Tốt: hành động khả thi với HS lớp 7, thuộc các nhóm khác nhau (báo lỗi, tránh ứng dụng độc hại, yêu cầu minh bạch, bảo vệ dữ liệu); có thêm cam kết cho lớp hoặc gia đình. Bạn nhận xét bằng một câu: “Hành động của bạn đã nói rõ khi nào, làm gì; bạn làm được vì chỉ cần báo thầy cô.” hoặc “Bạn chưa nói rõ khi nào sẽ làm.”", "Dòng mức tự tin không dùng để đánh giá; chọn “Cần học thêm” được GV hỗ trợ đầu tiết sau.", "Bảng kiểm Phiếu số 2: hành động cụ thể (ai làm, làm gì, ở đâu hoặc bằng cách nào); phù hợp với tình huống trên thẻ (ít nhất ba tình huống có hành động phù hợp); giải thích được tác dụng của hành động. Phiếu số 5: GV nhận xét theo dấu hiệu em ghi, không theo kết luận Đạt hay Chưa đạt, không dùng để xếp loại."], "sample": "Khi thấy ảnh ghép trêu bạn trong nhóm lớp, em sẽ không chuyển tiếp và báo cô giáo để bảo vệ bạn. Khi một ứng dụng thu âm giọng em mà không nói rõ để làm gì, em sẽ tạm dừng chức năng đó và đọc điều khoản cùng bố mẹ để bảo vệ quyền riêng tư của mình."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại
