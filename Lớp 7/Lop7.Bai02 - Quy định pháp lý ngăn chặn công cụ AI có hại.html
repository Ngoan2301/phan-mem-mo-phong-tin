<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}

.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}

.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}

main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}

.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}

select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}

.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}

.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}

 {"n": "Nguy cơ ông bà bị hại", "b": 20, "c": 2}, {"n": "Niềm tin của người dùng", "b": 50, "c": 1}], "chars": [{"n": "Công ty chọn phương án", "color": "#4aa3ff", "task": "Đoạn 1 (kết quả sau 6 tuần, giả sử): Các công ty chọn phương án 2 đã có mặt trên điện thoại của hầu hết các gia đình vì bán trước; các công ty chọn phương án 1 chưa bán được. Em chọn phương án nào?", "opts": [{"t": "Phương án 1: thử kĩ, sửa lỗi rồi mới bán", "chat": null, "ch": [-25, -10, 25], "v": "good", "fb": "Các công ty chọn phương án 1 làm đúng mà thua. Em thấy thế nào? Các cặp có thể thấy bất công, thiệt thòi, nản; lần sau có thể cũng bỏ bớt việc thử để kịp bán. Đó là ý cần có luật chơi chung."}, {"t": "Phương án 2: bán ngay tuần này", "chat": null, "ch": [40, 30, -15], "v": "mid", "fb": "Công ty thắng ở tuần 6 vì bán trước. Nhưng sang tuần thứ bảy, công ty ra bản mới có AI tự đọc ảnh đơn thuốc viết tay để đặt lịch uống thuốc. Công ty chưa thử AI với chữ viết tay của bác sĩ. AI đọc nhầm liều thuốc, có ông bà uống thuốc sai liều. Ở đất nước X chưa có quy định nào buộc công ty phải thử trước khi bán."}]}, {"n": "Tuần thứ bảy: ai bị hại?", "color": "#ff6b9d", "task": "Đoạn 2: Sang tuần thứ bảy, một công ty chọn phương án 2 ra bản mới có AI tự đọc ảnh đơn thuốc viết tay để đặt lịch uống thuốc. Công ty chưa thử AI với chữ viết tay của bác sĩ. AI đọc nhầm liều thuốc, có ông bà uống thuốc sai liều. Chuyện gì có thể xảy ra tiếp? Ai bị hại? Công ty nên làm gì?", "opts": [{"t": "Vẫn bán tiếp, vì không có luật nào bắt dừng", "chat": null, "ch": [20, 45, -35], "v": "bad", "fb": "Dự đoán chấp nhận được: ông bà uống sai liều, bị mệt, phải đi viện; con cháu lo lắng, mất tiền; công ty vẫn bán tiếp; các công ty khác cũng thêm AI mà không thử. Một tháng sau: nhiều ông bà khác cũng uống sai liều vì ứng dụng vẫn được tải về. Không ai buộc công ty dừng bán, sửa lỗi; các công ty khác thấy bán nhanh có lợi nên cũng thêm AI mà không thử. Dự đoán đạt khi nói rõ ai bị hại."}, {"t": "Tự dừng bán, báo người dùng và sửa lỗi dù không bị bắt buộc", "chat": null, "ch": [-20, -35, 25], "v": "good", "fb": "Việc làm đúng, nhưng không thể trông chờ mọi công ty tự giác. Quy định pháp lí biến điều này thành bắt buộc, có người kiểm tra và xử lí khi vi phạm."}, {"t": "Nói do “AI tự đọc”, công ty không chịu trách nhiệm", "chat": null, "ch": [10, 35, -40], "v": "bad", "fb": "Người làm ra và bán công cụ phải chịu trách nhiệm. Câu “AI tự làm” không giúp ông bà hết thiệt, cũng không ngăn được cái hại lặp lại."}]}], "after": "Hình ảnh khi chốt: giống một trận bóng không có trọng tài, đội phạm lỗi có thể thắng, đội chơi đúng thì thiệt. Công cụ AI cũng cần luật chơi chung để bên làm cẩn thận không bị thua và người dùng không bị hại."}, {"type": "match", "tag": "HĐ2 • Thẻ tình huống", "title": "Thẻ tình huống và việc làm có hại", "nav": "Thẻ tình huống", "icon": "🧩", "badge": "Thám tử thiết kế", "intro": "Tình huống giả định: Ở đất nước X, chưa có quy định nào buộc bên làm công cụ AI phải cẩn thận trước khi bán và chịu trách nhiệm khi gây hại. Mỗi nhóm nhận một thẻ, gạch chân việc bên làm ra công cụ đã làm hoặc bỏ qua, rồi điền ô ② (việc làm có hại ở khâu thiết kế, sản xuất). Hãy ghép mỗi thẻ với ô ② của nó.", "pairs": [["Thẻ 1. Phần mềm chấm bài: Công ty A bán phần mềm AI chấm bài viết tay cho nhiều trường, quảng cáo “chính xác 99%”. Phần mềm chủ yếu học từ chữ viết không dấu; công ty chưa thử với chữ viết tay có dấu. Nhiều bài làm đúng bị chấm thiếu điểm. Công ty trả lời: “Phần mềm tự chấm, chúng tôi không biết.”", "Không thử với chữ viết tay tiếng Việt có dấu; quảng cáo “99%” không có căn cứ (dấu hiệu: không thử trước khi bán)"], ["Thẻ 2. Ứng dụng chấm phát âm: Nhóm B làm ứng dụng AI chấm phát âm tiếng Anh, cho ứng dụng học chủ yếu từ giọng của người ở một vài vùng. Khi thử nghiệm, nhóm thấy ứng dụng hay chấm thấp các bạn nói giọng vùng miền khác. Nhóm giữ kín lỗi này, không ghi trong hướng dẫn sử dụng mà vẫn bán cho nhiều trường.", "Biết lỗi với giọng vùng miền mà không công bố, không sửa (dấu hiệu: biết lỗi mà giấu)"], ["Thẻ 3. Công cụ tạo ảnh đại diện: Nền tảng C cho người dùng đăng ảnh. Nền tảng lấy ảnh người dùng đã đăng để huấn luyện công cụ AI tạo ảnh đại diện mà không hỏi ý kiến ai. Có ảnh do công cụ tạo ra trông giống hệt một bạn học sinh có thật.", "Dùng ảnh người dùng để huấn luyện công cụ mà không xin phép (dấu hiệu: lấy dữ liệu, ảnh không hỏi ý kiến)"], ["Thẻ 4. Ứng dụng trò chuyện cho trẻ em: Công ty D làm ứng dụng trò chuyện AI dành cho trẻ em nhưng không lắp bộ lọc nội dung. Nhân vật AI hay hỏi trẻ kể chuyện riêng của gia đình và rủ trẻ nạp tiền để “mở khoá bạn thân đặc biệt”.", "Không lắp bộ lọc; thiết kế nhân vật AI để moi chuyện riêng và dụ nạp tiền (dấu hiệu: nhắm vào điểm yếu của trẻ em)"], ["Thẻ 5. Ứng dụng tạo tin giả: Nhóm E làm ra ứng dụng AI chuyên viết tin giả về trường học và tạo ảnh trông như chụp thật ở trường, rồi bán cho người muốn bôi nhọ trường khác. Một bản tin giả “Trường Y cho 60% học sinh thi trượt” kèm một ảnh như thế bị chia sẻ khắp mạng.", "Làm ra công cụ với mục đích viết tin giả và tạo ảnh giả mạo trông như thật để bôi nhọ (dấu hiệu: làm ra công cụ để tạo tin giả, ảnh giả mạo)"]], "why": "Năm dấu hiệu dự kiến, GV gom từ chữ của HS ở B4: Không thử trước khi bán (Thẻ 1); Biết lỗi mà giấu (Thẻ 2); Lấy dữ liệu, ảnh không hỏi ý kiến (Thẻ 3); Nhắm vào điểm yếu của trẻ em (Thẻ 4); Làm ra công cụ để tạo tin giả, ảnh giả mạo (Thẻ 5). Ghép đôi đọc chéo: Đôi 1: Nhóm 1 và nhóm 2 đổi phiếu cho nhau (Thẻ 1, Thẻ 2); Đôi 2: Nhóm 3 và nhóm 4 (Thẻ 3, Thẻ 4); Đôi 3: Nhóm 5 và nhóm 6 (Thẻ 5, Thẻ 1); Đôi 4: Nhóm 7 và nhóm 8 (Thẻ 2, Thẻ 3); Đôi 5: Nhóm 9 và nhóm 10 (Thẻ 4, Thẻ 5). Hai nhóm trong mỗi đôi luôn cầm hai thẻ khác nhau."}, {"type": "story", "tag": "HĐ2 • Chuỗi bốn ô", "title": "Phiếu số 1: chuỗi bốn ô cho từng thẻ", "nav": "Chuỗi bốn ô", "icon": "⛓️", "badge": "Người nối chuỗi", "intro": "Phiếu học tập số 1. Nhiệm vụ: Em cùng nhóm đọc thẻ, gạch chân việc bên làm ra công cụ đã làm hoặc bỏ qua, rồi điền ô ② trước, sau đó ô ①, ③, ④. ③ Hậu quả theo thời gian: Hôm đó: một người bị hại gì? 1 tháng sau: những ai nữa bị hại, vì không có quy định buộc công ty dừng? 1 năm sau: cả trường, cả vùng, cả xã hội ra sao, vì không có quy định buộc sửa, đền? ④ Nếu có quy định buộc bên làm công cụ phải …, điều gì sẽ khác? Gợi ý: Ai bị hại? Học sinh, bạn bè, trẻ nhỏ, người cao tuổi, cha mẹ, thầy cô, nhà trường, người ở vùng khác, cả xã hội. Mẫu câu “… bị … vì …”. Ví dụ: Ông bà uống thuốc sai liều vì công ty chưa thử AI với chữ viết tay của bác sĩ. Duyệt từng thẻ.", "app": "📇 Phiếu chuỗi bốn ô (mô phỏng)", "hello": "Câu hỏi gợi ý: Trước khi bán, bên làm ra công cụ đã bỏ qua việc gì? Đã giấu điều gì? Đã lấy gì của ai mà không hỏi?", "meters": [{"n": "Hậu quả được nêu rõ (ai bị hại, bị hại gì)", "b": 30, "c": 0}, {"n": "Cái hại lan rộng", "b": 40, "c": 2}, {"n": "Người bị hại có nơi phản ánh", "b": 20, "c": 1}], "chars": [{"n": "Thẻ 1", "color": "#4aa3ff", "task": "Thẻ 1 (phần mềm chấm bài, “chính xác 99%”). Điền chuỗi bốn ô: Vì chưa có quy định, bên làm công cụ có thể tiếp tục làm gì? Hậu quả sau 1 tháng, 1 năm?", "opts": [{"t": "① Vì chưa có quy định, bên làm có thể tiếp tục: Cứ bán thêm cho nhiều trường, không sửa, không phải trả lời ai", "chat": null, "ch": [10, 25, -10], "v": "mid", "fb": "① Cứ bán thêm cho nhiều trường, không sửa, không phải trả lời ai. Đây mới là bước đầu; hãy nối tiếp với hậu quả theo thời gian (③) và điều sẽ khác nếu có quy định (④)."}, {"t": "③ Hậu quả cụ thể: nêu rõ ai bị hại, bị hại gì, lan rộng hoặc kéo dài vì không có quy định buộc dừng, sửa, đền", "chat": null, "ch": [30, -20, 20], "v": "good", "fb": "③ Hôm đó, 1 tháng sau, 1 năm sau: Bạn làm đúng bị chấm thiếu điểm, buồn, mất cơ hội được khen. Không có quy định buộc sửa nên học kì sau vẫn chấm sai; trường thứ hai, thứ ba tiếp tục mua vì tin con số 99%; HS không có nơi đề nghị chấm lại; cha mẹ mất niềm tin vào kết quả học tập. ④ Nếu có quy định thì khác gì: Phải thử trước khi bán, nói rõ chỗ còn sai; có nơi đề nghị chấm lại; bán rồi mà sai thì phải sửa. Con số 99% đo trên những bài nào? Ai đã thử? Loại chữ viết nào chưa được thử? Con số là lời quảng cáo trong tình huống giả định; con số cao không cho biết phần mềm chấm đúng với mọi bài hay công bằng với mọi HS."}, {"t": "Chỉ ghi “AI sai”, “có hại”", "chat": null, "ch": [-25, 20, -20], "v": "bad", "fb": "Phiếu chỉ ghi “AI sai”, “có hại” là chưa đạt: phải nêu được hậu quả cụ thể (ai bị hại, bị hại gì) có thể xảy ra, lan rộng hoặc kéo dài khi không có quy định, ví dụ “vì không có quy định buộc công ty dừng nên …”."}]}, {"n": "Thẻ 2", "color": "#ff9f43", "task": "Thẻ 2 (ứng dụng chấm phát âm). Vì chưa có quy định, bên làm công cụ có thể tiếp tục làm gì? Hậu quả sau 1 tháng, 1 năm?", "opts": [{"t": "① Vì chưa có quy định, bên làm có thể tiếp tục: Giấu lỗi, bán thêm cho nhiều trường", "chat": null, "ch": [10, 25, -10], "v": "mid", "fb": "① Giấu lỗi, bán thêm cho nhiều trường. Đây mới là bước đầu; hãy nối tiếp với hậu quả theo thời gian (③) và điều sẽ khác nếu có quy định (④)."}, {"t": "③ Hậu quả cụ thể: nêu rõ ai bị hại, bị hại gì, lan rộng hoặc kéo dài vì không có quy định buộc dừng, sửa, đền", "chat": null, "ch": [30, -20, 20], "v": "good", "fb": "③ Hôm đó, 1 tháng sau, 1 năm sau: Bạn nói giọng vùng miền bị chấm thấp, nghĩ mình kém. Không có quy định buộc công bố lỗi nên nhóm B bán thêm; cả lớp cùng giọng bị chấm thấp, thầy cô dựa vào điểm của ứng dụng để xếp nhóm; HS cả một vùng bị chấm thấp nhiều năm, ngại nói tiếng Anh. ④ Nếu có quy định thì khác gì: Phải công bố điểm yếu, sửa trước khi bán; thầy cô biết để không dựa vào điểm của ứng dụng."}, {"t": "Chỉ ghi “AI sai”, “có hại”", "chat": null, "ch": [-25, 20, -20], "v": "bad", "fb": "Phiếu chỉ ghi “AI sai”, “có hại” là chưa đạt: phải nêu được hậu quả cụ thể (ai bị hại, bị hại gì) có thể xảy ra, lan rộng hoặc kéo dài khi không có quy định, ví dụ “vì không có quy định buộc công ty dừng nên …”."}]}, {"n": "Thẻ 3", "color": "#2ecc71", "task": "Thẻ 3 (công cụ tạo ảnh đại diện). Vì chưa có quy định, bên làm công cụ có thể tiếp tục làm gì? Hậu quả sau 1 tháng, 1 năm?", "opts": [{"t": "① Vì chưa có quy định, bên làm có thể tiếp tục: Tiếp tục lấy ảnh để huấn luyện mà không hỏi", "chat": null, "ch": [10, 25, -10], "v": "mid", "fb": "① Tiếp tục lấy ảnh để huấn luyện mà không hỏi. Đây mới là bước đầu; hãy nối tiếp với hậu quả theo thời gian (③) và điều sẽ khác nếu có quy định (④)."}, {"t": "③ Hậu quả cụ thể: nêu rõ ai bị hại, bị hại gì, lan rộng hoặc kéo dài vì không có quy định buộc dừng, sửa, đền", "chat": null, "ch": [30, -20, 20], "v": "good", "fb": "③ Hôm đó, 1 tháng sau, 1 năm sau: Bạn có ảnh giống mình bị trêu chọc, bị nhầm. Không có quy định buộc gỡ nên ảnh giống bạn cứ được tạo tiếp, bạn không đòi gỡ được; mọi người ngại đăng ảnh; ảnh giống người thật có thể bị kẻ xấu dùng để lừa. ④ Nếu có quy định thì khác gì: Phải hỏi ý kiến trước khi dùng ảnh; người có ảnh được từ chối, được yêu cầu gỡ."}, {"t": "Chỉ ghi “AI sai”, “có hại”", "chat": null, "ch": [-25, 20, -20], "v": "bad", "fb": "Phiếu chỉ ghi “AI sai”, “có hại” là chưa đạt: phải nêu được hậu quả cụ thể (ai bị hại, bị hại gì) có thể xảy ra, lan rộng hoặc kéo dài khi không có quy định, ví dụ “vì không có quy định buộc công ty dừng nên …”."}]}, {"n": "Thẻ 4", "color": "#9b59b6", "task": "Thẻ 4 (ứng dụng trò chuyện cho trẻ em). Vì chưa có quy định, bên làm công cụ có thể tiếp tục làm gì? Hậu quả sau 1 tháng, 1 năm?", "opts": [{"t": "① Vì chưa có quy định, bên làm có thể tiếp tục: Tiếp tục bán, càng nhiều trẻ nạp tiền càng lãi", "chat": null, "ch": [10, 25, -10], "v": "mid", "fb": "① Tiếp tục bán, càng nhiều trẻ nạp tiền càng lãi. Đây mới là bước đầu; hãy nối tiếp với hậu quả theo thời gian (③) và điều sẽ khác nếu có quy định (④)."}, {"t": "③ Hậu quả cụ thể: nêu rõ ai bị hại, bị hại gì, lan rộng hoặc kéo dài vì không có quy định buộc dừng, sửa, đền", "chat": null, "ch": [30, -20, 20], "v": "good", "fb": "③ Hôm đó, 1 tháng sau, 1 năm sau: Một bạn nhỏ kể chuyện gia đình, lấy tiền của cha mẹ để nạp. Không có quy định cấm dụ dỗ trẻ em nên ứng dụng khác bắt chước cách dụ nạp tiền vì thấy có lãi; nhiều gia đình bị lộ thông tin, kẻ xấu có thể dùng để lừa đảo. ④ Nếu có quy định thì khác gì: Cấm thiết kế công cụ dụ dỗ trẻ em; buộc có bộ lọc, có cách để cha mẹ kiểm soát."}, {"t": "Chỉ ghi “AI sai”, “có hại”", "chat": null, "ch": [-25, 20, -20], "v": "bad", "fb": "Phiếu chỉ ghi “AI sai”, “có hại” là chưa đạt: phải nêu được hậu quả cụ thể (ai bị hại, bị hại gì) có thể xảy ra, lan rộng hoặc kéo dài khi không có quy định, ví dụ “vì không có quy định buộc công ty dừng nên …”."}]}, {"n": "Thẻ 5", "color": "#e74c3c", "task": "Thẻ 5 (ứng dụng tạo tin giả). Vì chưa có quy định, bên làm công cụ có thể tiếp tục làm gì? Hậu quả sau 1 tháng, 1 năm?", "opts": [{"t": "① Vì chưa có quy định, bên làm có thể tiếp tục: Tiếp tục làm và bán công cụ tạo tin giả", "chat": null, "ch": [10, 25, -10], "v": "mid", "fb": "① Tiếp tục làm và bán công cụ tạo tin giả. Đây mới là bước đầu; hãy nối tiếp với hậu quả theo thời gian (③) và điều sẽ khác nếu có quy định (④)."}, {"t": "③ Hậu quả cụ thể: nêu rõ ai bị hại, bị hại gì, lan rộng hoặc kéo dài vì không có quy định buộc dừng, sửa, đền", "chat": null, "ch": [30, -20, 20], "v": "good", "fb": "③ Hôm đó, 1 tháng sau, 1 năm sau: HS, thầy cô trường Y bị nghi ngờ, bị chê bai. Không có quy định buộc dừng nên ứng dụng tiếp tục bán, trường khác cũng bị bôi nhọ; cha mẹ hoảng; mọi người không biết tin nào thật. ④ Nếu có quy định thì khác gì: Cấm làm ra công cụ nhằm tạo tin giả, nội dung giả mạo gây hại; bên làm phải dừng và bị xử lí."}, {"t": "Chỉ ghi “AI sai”, “có hại”", "chat": null, "ch": [-25, 20, -20], "v": "bad", "fb": "Phiếu chỉ ghi “AI sai”, “có hại” là chưa đạt: phải nêu được hậu quả cụ thể (ai bị hại, bị hại gì) có thể xảy ra, lan rộng hoặc kéo dài khi không có quy định, ví dụ “vì không có quy định buộc công ty dừng nên …”."}]}], "after": "Câu hỏi gợi mở ở B2: với nhóm bỏ trống ô “1 tháng sau”, “1 năm sau”: Nếu không có quy định buộc công ty dừng thì một tháng sau ai nữa bị hại? Với nhóm bỏ trống ô ④: Nếu đất nước X có quy định buộc công ty phải … thì ở thẻ của em, chuyện gì sẽ không xảy ra nữa? Gợi ý cho nhóm làm nhanh ở ô “1 năm sau”: mọi người quen coi chuyện công cụ chấm sai, lộ thông tin là bình thường; người bị hại không biết kêu ai."}, {"type": "lab", "tag": "HĐ2 • Hậu quả lan rộng", "title": "Hậu quả theo thời gian: có quy định hay không?", "nav": "Hậu quả theo thời gian", "icon": "⏳", "badge": "Nhìn xa thấy rộng", "intro": "Lấy Thẻ 1 (phần mềm chấm bài viết tay chấm thiếu điểm bài đúng). Kéo thanh trượt thời gian (hôm đó → 1 tháng → 1 năm) và mức quy định để xem cái hại lan rộng thế nào khi không có quy định buộc dừng, sửa, đền. Đây là mô hình minh hoạ, không phải số liệu thật.", "sliders": [{"id": "t", "n": "Thời gian kể từ hôm đó", "min": 0, "max": 12, "val": 0, "unit": " tháng"}, {"id": "r", "n": "Mức quy định buộc thử trước khi bán, sửa lỗi, đền bù", "min": 0, "max": 100, "val": 0, "unit": "%"}], "outputs": [{"n": "Số trường và học sinh bị ảnh hưởng", "base": 5, "w": {"t": 6, "r": -0.8}, "c": 2}, {"n": "Người bị hại có nơi đề nghị chấm lại", "base": 5, "w": {"t": 0, "r": 0.9}, "c": 1}, {"n": "Mức lỗi được sửa", "base": 0, "w": {"t": -1, "r": 0.9}, "c": 0}], "insights": [{"id": "t", "op": ">=", "val": 6, "txt": "Không có quy định buộc sửa nên học kì sau vẫn chấm sai; trường thứ hai, thứ ba tiếp tục mua vì tin con số 99%; học sinh không có nơi đề nghị chấm lại."}, {"id": "t", "op": ">=", "val": 11, "txt": "Một năm sau: mọi người quen coi chuyện công cụ chấm sai là bình thường; người bị hại không biết kêu ai."}, {"id": "r", "op": ">=", "val": 70, "txt": "Có quy định: phải thử trước khi bán, nói rõ chỗ còn sai, có nơi đề nghị chấm lại, bán rồi mà sai thì phải sửa. Cái hại ngừng lan rộng."}, {"id": "t", "op": ">=", "val": 3, "txt": "Câu hỏi gợi mở với nhóm Thẻ 1: Con số 99% đo trên những bài nào? Ai đã thử? Loại chữ viết nào chưa được thử? Con số cao không cho biết phần mềm chấm đúng với mọi bài hay công bằng với mọi HS."}]}, {"type": "flag", "tag": "HĐ2 • Đọc chéo", "title": "Nhóm bạn nhận xét: hậu quả nói rõ ai bị hại?", "nav": "Đọc chéo", "icon": "🔄", "badge": "Người phản biện", "intro": "Hai nhóm trong một đôi đổi phiếu và bổ sung hậu quả bằng bút khác màu. Nhóm bạn khoanh “có” khi hậu quả vừa bổ sung nói rõ ai bị hại, bị hại gì; khoanh “chưa” khi chỉ ghi “bị ảnh hưởng”, “có hại”. Hãy gắn cờ những dòng <b>chưa</b> nói rõ ai bị hại, bị hại gì.", "cols": ["Thẻ", "Hậu quả nhóm bạn bổ sung"], "flagWhat": "chưa nói rõ ai bị hại, bị hại gì", "rows": [{"c": ["Thẻ 1", "Bạn làm đúng bị chấm thiếu điểm, buồn, mất cơ hội được khen"], "bad": false}, {"c": ["Thẻ 1", "Bị ảnh hưởng"], "bad": true, "why": "Chỉ ghi “bị ảnh hưởng”: chưa nói rõ ai bị hại, bị hại gì."}, {"c": ["Thẻ 2", "Bạn nói giọng vùng miền bị chấm thấp, nghĩ mình kém"], "bad": false}, {"c": ["Thẻ 2", "Có hại"], "bad": true, "why": "Chỉ ghi “có hại”: chưa nói rõ ai bị hại, bị hại gì. Phải nêu hậu quả cụ thể."}, {"c": ["Thẻ 3", "Bạn có ảnh giống mình bị trêu chọc, bị nhầm"], "bad": false}, {"c": ["Thẻ 3", "AI sai"], "bad": true, "why": "Chỉ ghi “AI sai” là chưa đạt: không có ai bị hại, bị hại gì."}, {"c": ["Thẻ 4", "Một bạn nhỏ kể chuyện gia đình, lấy tiền của cha mẹ để nạp"], "bad": false}, {"c": ["Thẻ 5", "HS, thầy cô trường Y bị nghi ngờ, bị chê bai"], "bad": false}], "after": "Câu hỏi (3) ở mục b): Bằng chứng nào trên thẻ khiến em tin hậu quả nhóm bạn vừa bổ sung có thể xảy ra? Điều gì có thể làm hậu quả đó không xảy ra? Bằng chứng là chi tiết trên thẻ (việc làm ở ô ②) dẫn tới hậu quả. Hậu quả có thể không xảy ra nếu bên làm công cụ sửa lỗi hoặc có quy định buộc dừng, sửa, đền. Có khi thẻ thiếu dữ kiện (ví dụ chưa biết bao nhiêu trường đã mua) nên chưa chắc chắn được. Chấp nhận câu trả lời “thẻ chưa đủ thông tin để chắc chắn”. Nhận xét không quy đổi thành điểm. Câu hỏi (2): Nếu em gặp một ảnh như ở Thẻ 5 hoặc một ứng dụng như ở Thẻ 4 thì em làm gì? Với ảnh, không chia sẻ tiếp; với ứng dụng, không kể chuyện riêng, không nạp tiền theo lời dụ; trong cả hai trường hợp đều báo thầy cô, cha mẹ. Ví dụ cảnh giác (giả định): ở đất nước X, một ứng dụng AI chỉ cần vài tấm ảnh, vài giây ghi âm là làm được cuộc gọi video giả mặt, giả giọng bất kì ai. Kẻ xấu dùng nó giả làm cháu, gọi xin bà chuyển tiền gấp. Chưa có quy định ngăn việc bán công cụ như vậy thì nhiều gia đình có thể bị lừa. Đây là thủ đoạn cần cảnh giác."}, {"type": "sort", "tag": "HĐ3 • Đóng vai nhóm soạn quy định", "title": "Bảng nguyên tắc ba cột của lớp", "nav": "Bảng nguyên tắc", "icon": "📝", "badge": "Nhà soạn quy định", "intro": "Mỗi nhóm viết một thẻ nguyên tắc: “Bên làm ra công cụ AI (không được / phải) … Vì nếu không có thì … Áp dụng lúc (khoanh một): Trước khi bán / Trong khi bán, đang dùng / Sau khi có người bị hại.” Kéo mỗi nguyên tắc dự kiến vào cột hợp lí. Thẻ dán sai cột là khi thời điểm khoanh không khớp nội dung, ví dụ nguyên tắc “phải thử trước khi bán” mà dán ở cột “Sau khi có người bị hại”.", "cats": ["Trước khi bán", "Trong khi bán, đang dùng", "Sau khi có người bị hại"], "cards": [{"t": "Thẻ 1: Phải thử với chữ viết tay tiếng Việt có dấu trước khi bán; không quảng cáo con số không có căn cứ", "g": [0], "why": "Hậu quả không còn xảy ra: Nhiều trường cùng mua phần mềm chấm sai; học kì sau vẫn chấm sai. Ví dụ: Bên làm công cụ không được bán công cụ chấm bài khi chưa thử với chữ viết tay tiếng Việt có dấu. Vì nếu không có thì nhiều trường cùng mua phần mềm chấm sai."}, {"t": "Thẻ 2: Phải công bố điểm yếu, sửa trước khi bán", "g": [0], "why": "Hậu quả không còn xảy ra: Thầy cô dựa vào điểm của ứng dụng để xếp nhóm; HS cả một vùng bị chấm thấp nhiều năm."}, {"t": "Thẻ 2: Phải ghi rõ trong hướng dẫn sử dụng chỗ ứng dụng có thể chấm sai", "g": [1], "why": "Hậu quả không còn xảy ra: Thầy cô tin điểm sai. Ví dụ: Bên làm công cụ phải ghi rõ ứng dụng có thể chấm sai giọng vùng miền. Vì nếu không có thì thầy cô tin điểm sai, HS bị chấm thấp nhiều năm."}, {"t": "Thẻ 3: Phải hỏi ý kiến trước khi dùng ảnh để huấn luyện", "g": [0], "why": "Hậu quả không còn xảy ra: Ảnh giống bạn cứ được tạo tiếp."}, {"t": "Thẻ 3: Người có ảnh được yêu cầu gỡ; bên làm công cụ phải gỡ", "g": [2], "why": "Hậu quả không còn xảy ra: Bạn không đòi gỡ được."}, {"t": "Thẻ 4: Không được thiết kế công cụ dụ dỗ trẻ em; phải lắp bộ lọc trước khi bán", "g": [0], "why": "Hậu quả không còn xảy ra: Ứng dụng khác bắt chước cách dụ nạp tiền; nhiều gia đình bị lộ thông tin."}, {"t": "Thẻ 4: Phải có cách để cha mẹ kiểm soát khi trẻ đang dùng", "g": [1], "why": "Hậu quả không còn xảy ra: Bạn nhỏ lấy tiền của cha mẹ để nạp mà không ai biết."}, {"t": "Thẻ 4: Không được thiết kế nhân vật AI hỏi trẻ chuyện riêng của gia đình; chỉ được lưu thông tin mà tính năng cần", "g": [0], "why": "Hậu quả không còn xảy ra: Nhiều gia đình bị lộ thông tin."}, {"t": "Thẻ 5: Không được làm ra công cụ nhằm tạo tin giả, nội dung giả mạo gây hại", "g": [0], "why": "Hậu quả không còn xảy ra: Trường khác cũng bị bôi nhọ. Nếu HS phản biện “kẻ xấu vẫn làm lén”, GV ghi nhận: quy định không xoá hết cái hại, nhưng có người kiểm tra và có xử lí khi vi phạm."}, {"t": "Thẻ 5: Bên làm phải dừng và bị xử lí khi đã gây hại", "g": [2], "why": "Hậu quả không còn xảy ra: Ứng dụng tiếp tục bán."}, {"t": "Bên làm công cụ phải có nơi nhận phản ánh, phải xem lại, sửa lỗi và đền bù cho người bị hại", "g": [2], "why": "Vì nếu không có thì người bị hại chịu thiệt một mình."}], "pass": 0.7, "after": "Câu hỏi (2) ở mục b): Cột nào giúp ngăn cái hại trước khi nó xảy ra? Vì sao cần quy định ngay từ khâu thiết kế, sản xuất? Cột “Trước khi bán”. Quy định ở khâu thiết kế, sản xuất chặn cái hại từ gốc, trước khi có người bị hại. Cột “Trong khi bán, đang dùng” và cột “Sau khi có người bị hại” cần thiết nhưng là khi đã có người dùng hoặc đã có người bị hại. Khi nhóm đề xuất quá nặng (“cấm hết AI”): Nguyên tắc này có thực hiện được không? Công cụ càng có thể gây hại lớn thì càng phải kiểm tra chặt, không cấm mọi công cụ."}, {"type": "build", "tag": "HĐ3 • Thẻ nguyên tắc", "title": "Thẻ nguyên tắc và chạy thử luật", "nav": "Thẻ nguyên tắc", "icon": "🗂️", "badge": "Người chạy thử luật", "intro": "Viết thẻ nguyên tắc của nhóm. Sau đó chạy thử luật: nghe các nguyên tắc vừa đọc, chọn một nguyên tắc chặn được việc làm ở ô ② của nhóm em. Gạch một hậu quả ở ô ③ sẽ không xảy ra nữa nếu đất nước X có nguyên tắc đó. Ghi số nhóm đã viết thẻ nguyên tắc đó vào dòng “Chạy thử luật”.", "fields": [{"id": "a", "label": "Viết cho thẻ tình huống số", "opts": ["Thẻ 1", "Thẻ 2", "Thẻ 3", "Thẻ 4", "Thẻ 5"]}, {"id": "b", "label": "Nguyên tắc: Bên làm ra công cụ AI (không được / phải) …", "hint": "Chủ ngữ là bên làm ra, bán, cung cấp công cụ", "ph": "VD: không được bán công cụ chấm bài khi chưa thử với chữ viết tay tiếng Việt có dấu"}, {"id": "c", "label": "Vì nếu không có thì …", "hint": "Lấy ý từ hậu quả ở ô ③", "ph": "VD: nhiều trường cùng mua phần mềm chấm sai"}, {"id": "d", "label": "Áp dụng lúc (khoanh một)", "opts": ["Trước khi bán", "Trong khi bán, đang dùng", "Sau khi có người bị hại"]}, {"id": "e", "label": "Chạy thử luật: thẻ nguyên tắc của nhóm số … chặn được việc làm ở ô ②; hậu quả ở ô ③ không còn xảy ra là …", "hint": "Nếu không tìm được nguyên tắc nào trên bảng: “Lớp còn thiếu nguyên tắc: …”", "ph": "VD: Nhóm số 3 ... Lớp còn thiếu nguyên tắc: ..."}], "checks": ["Chủ ngữ là bên làm ra, bán, cung cấp công cụ; có câu “Vì nếu không có thì …” lấy ý từ hậu quả; thời điểm khoanh khớp nội dung nguyên tắc", "Dòng “Chạy thử luật” đạt khi nguyên tắc chọn ra cấm hoặc buộc đúng việc làm ở ô ② và hậu quả gạch đi xuất phát từ việc làm đó; “Lớp còn thiếu nguyên tắc: …” là câu trả lời hợp lệ", "Khá (kiểm chứng): nhóm tự đối chiếu, gạch đúng hậu quả không còn xảy ra và nói được vì sao", "Tốt (kiểm chứng): nhóm phát hiện được chỗ lớp còn thiếu nguyên tắc hoặc giới hạn của nguyên tắc (ví dụ “kẻ xấu vẫn làm lén”)", "Khá (an toàn, đạo đức, trách nhiệm): thẻ bảo vệ người có thể bị hại nhiều hơn khi công cụ làm không cẩn thận (trẻ nhỏ, người cao tuổi, người có giọng nói mà ứng dụng chưa được thử); dòng “Vì nếu không có thì…” nói rõ người đó bị hại gì vì bên làm ra công cụ không làm khác", "Tốt: nguyên tắc vừa bảo vệ người dễ bị hại hơn vừa làm được (ví dụ buộc thử, buộc lắp bộ lọc, buộc ghi rõ thay cho “cấm hết AI”)"], "sample": "Ba ví dụ nguyên tắc theo ba cột. Trước khi bán: Bên làm công cụ không được bán công cụ chấm bài khi chưa thử với chữ viết tay tiếng Việt có dấu. Vì nếu không có thì nhiều trường cùng mua phần mềm chấm sai. Trong khi bán, đang dùng: Bên làm công cụ phải ghi rõ ứng dụng có thể chấm sai giọng vùng miền. Vì nếu không có thì thầy cô tin điểm sai, HS bị chấm thấp nhiều năm. Sau khi có người bị hại: Bên làm công cụ phải có nơi nhận phản ánh, phải xem lại, sửa lỗi và đền bù cho người bị hại. Vì nếu không có thì người bị hại chịu thiệt một mình."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu cuối giờ (phiên bản A, B)", "nav": "Phiếu cuối giờ", "icon": "✍️", "badge": "Người nhìn xa", "intro": "Phiếu học tập số 2, tự làm trước khi nghe ba ý của luật. Tình huống giả định: Ở đất nước X, chưa có quy định nào buộc bên làm công cụ AI phải cẩn thận trước khi bán và chịu trách nhiệm khi gây hại.<br><b>Phiên bản A.</b> Công ty G làm ứng dụng gia sư AI cho học sinh. Công ty cho nhân vật AI xưng là “cô giáo thật”, không ghi ở đâu rằng đây là AI. Nhiều bạn tin tuyệt đối mọi lời “cô” nói, kể cả khi “cô” giảng sai; có bạn còn kể chuyện buồn ở nhà cho “cô” nghe.<br><b>Phiên bản B.</b> Công ty H bán đồng hồ thông minh có trợ lí AI cho trẻ em. Đồng hồ ghi âm giọng nói của trẻ để trợ lí AI trả lời câu hỏi và để công ty huấn luyện thêm trợ lí. Để làm nhanh và rẻ, công ty lưu mọi bản ghi âm cùng vị trí của trẻ ở một chỗ không đặt mật khẩu, ai có đường link cũng mở được.<br>Chọn một phiên bản và trả lời (1)–(3); (4) nêu một hậu quả theo thẻ tình huống của nhóm em.", "fields": [{"id": "a", "label": "Em làm phiên bản", "opts": ["A (gia sư AI xưng là cô giáo thật)", "B (đồng hồ thông minh lưu ghi âm, vị trí của trẻ)"]}, {"id": "b", "label": "(1) Công ty đã làm gì sai?", "hint": "Chỉ đúng việc làm sai của công ty", "ph": "VD: ..."}, {"id": "c", "label": "(2) Một hậu quả: ai bị hại, bị hại gì?", "hint": "Nói rõ ai bị hại, bị hại gì", "ph": "VD: ..."}, {"id": "d", "label": "(3) Vì chưa có quy định buộc công ty phải làm khác, hậu quả này có thể lan ra nhiều người hoặc kéo dài thế nào?", "hint": "Mẫu: vì không có quy định buộc công ty …", "ph": "VD: ..."}, {"id": "e", "label": "(4) Thẻ tình huống của nhóm em là thẻ số …. Nêu một hậu quả (ai bị hại, bị hại gì) có thể lan rộng hoặc kéo dài vì chưa có quy định.", "hint": "Theo cột “③ 1 tháng sau, 1 năm sau” của thẻ đó", "ph": "VD: ..."}, {"id": "f", "label": "Em đã nêu được hậu quả có thể xảy ra, lan rộng hoặc kéo dài khi chưa có quy định (ai bị hại, bị hại gì)", "opts": ["Có", "Chưa"]}], "checks": ["Phiếu đạt khi ở cả hai tình huống HS nêu được hậu quả cụ thể (ai bị hại, bị hại gì) có thể xảy ra, lan rộng hoặc kéo dài khi không có quy định (câu 2, 3, 4); câu 1 là bước dẫn, không dùng để kết luận đạt", "Chưa đạt khi chỉ ghi “AI sai”, “có hại” mà không nói ai bị hại, bị hại gì", "Khá: tự nêu được hậu quả ở cả hai tình huống mà không cần gợi ý; hậu quả nêu được ở cấp cộng đồng (nhiều người, nhiều trường)", "Tốt: hậu quả nối thành chuỗi theo thời gian; phân biệt được cái hại do công cụ sai gây ra với cái hại lan rộng, kéo dài vì không có quy định buộc dừng, sửa, đền", "Câu 1: HS chỉ đúng việc làm sai của công ty, không đổ lỗi cho người bị hại; câu 2 chỉ ra người dễ bị hại hơn (trẻ nhỏ, người cao tuổi…); câu 1 hoặc câu 3 nói được bên làm ra công cụ lẽ ra phải làm gì"], "sample": "Đáp án phiên bản A. (1) Thiết kế nhân vật AI giả làm người thật, giấu việc đây là AI. (2) Một bạn tin “cô” nên học theo lời giảng sai, kể chuyện riêng của gia đình mà không biết mình đang nói với máy. (3) Không có quy định buộc ghi rõ “đây là AI” nên nhiều ứng dụng khác bắt chước; nhiều HS học sai mà không biết hỏi lại ai; chuyện riêng của nhiều gia đình nằm trong máy của t mình đang tương tác với AI, trừ trường hợp pháp luật có quy định khác. Ý (3): Tổ chức, cá nhân dùng AI trong công việc, kinh doanh, dịch vụ mà tạo ra âm thanh, hình ảnh, video giả giọng nói, ngoại hình người thật hoặc tái hiện sự kiện có thật thì phải gắn nhãn dễ nhận biết. Các tình huống trong bài là giả định ở đất nước X; Việt Nam đã có luật này.", "qs": [{"q": "Lớp mình đã nghĩ giống các nhà làm luật ở điểm nào? Chọn tất cả đáp án đúng.", "opts": ["Nguyên tắc cấm thiết kế công cụ dụ dỗ trẻ em (Thẻ 4) giống ý (1)", "Nửa lớp vừa làm phiếu A gặp ý (2): công cụ AI tương tác trực tiếp với con người phải cho người dùng biết mình đang tương tác với AI", "Mọi công cụ AI đều bị cấm", "Ý (3) là gắn nhãn âm thanh, hình ảnh, video giả người thật hoặc tái hiện sự kiện có thật"], "a": [0, 1, 3], "why": "Nhiều điều lớp mình đề xuất đã có trong Luật Trí tuệ nhân tạo. Nếu lớp đề xuất cấm công cụ tạo tin giả ở Thẻ 5, đó là hướng ngăn từ gốc; ảnh ở Thẻ 5 có thuộc phạm vi ý (3) hay không còn tuỳ điều kiện của luật, GV không kết luận."}, {"q": "Công ty G làm gia sư AI cho học sinh, cho nhân vật AI xưng là “cô giáo thật”, không ghi đây là AI. Việc làm nào của công ty là có hại?", "opts": ["Làm gia sư cho học sinh", "Giấu việc nhân vật là AI, khiến học sinh nhầm với người thật", "Dùng AI để giảng bài"], "a": 1, "why": "Sai ở chỗ thiết kế nhân vật giả làm người thật, giấu việc đây là AI. Hậu quả: học sinh học theo lời giảng sai, kể chuyện riêng của gia đình mà không biết mình đang nói với máy. Vì chưa có quy định nên nhiều ứng dụng khác có thể bắt chước."}, {"q": "Công ty H bán đồng hồ thông minh cho trẻ, lưu ghi âm giọng nói và vị trí nhưng ai có đường link cũng mở được. Hậu quả nào có thể lan rộng, kéo dài vì chưa có quy định buộc bảo vệ dữ liệu?", "opts": ["Dữ liệu của nhiều trẻ cứ nằm mở; kẻ xấu biết trẻ ở đâu hoặc dùng AI giả giọng trẻ để lừa cha mẹ", "Đồng hồ chạy chậm hơn một chút", "Trẻ không còn thích dùng đồng hồ"], "a": 0, "why": "Hậu quả cần nói rõ ai bị hại, bị hại gì: giọng nói và nơi ở của trẻ bị người lạ biết. Quy định buộc bảo vệ dữ liệu (đặt mật khẩu, chỉ lưu điều cần thiết, báo và sửa ngay khi bị lộ) sẽ ngăn điều này."}, {"q": "Vì sao quy định ngay từ khâu thiết kế, sản xuất (trước khi bán) quan trọng nhất?", "opts": ["Vì chặn cái hại từ gốc, trước khi có người bị hại", "Vì chỉ cần xử phạt sau là đủ", "Vì công ty nào cũng tự giác thử kĩ"], "a": 0, "why": "Cột “Trước khi bán” ngăn cái hại từ gốc. Các cột sau cần thiết nhưng là khi đã có người dùng hoặc người bị hại."}, {"q": "Em nhận được một ảnh trông như chụp thật bạn học bị bôi nhọ, nghi là ảnh giả do AI tạo. Em nên làm gì?", "opts": ["Chia sẻ để cảnh báo mọi người", "Không chia sẻ tiếp, báo thầy cô hoặc cha mẹ", "Bình luận chê bạn trong ảnh"], "a": 1, "why": "Không chia sẻ tiếp để tin giả không lan rộng và báo người lớn. Con người xác thực thông tin và quyết định cách xử lí."}]}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const good=()=>{beep(660);setTimeout(()=>beep(880),90)},bad=()=>beep(180,.25,'sawtooth');

function confetti(){const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,s:5+Math.random()*7,c:['#ff8a2b','#2ecc71','#4aa3ff','#f6c744','#ef5350'][Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<140)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
