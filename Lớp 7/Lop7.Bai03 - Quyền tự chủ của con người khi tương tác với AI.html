<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 3. Quyền tự chủ của con người khi tương tác với AI – Lớp 7</title>
<style>
:root{--o:#27ae60;--od:#1d8248;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🎛️", "title": "Bài 3. Quyền tự chủ của con người khi tương tác với AI – Lớp 7", "ainote": "Người dùng quyết định có cho phần mềm tự động hoá một thao tác hay không; các việc ghi điểm, xếp nhóm, xoá vĩnh viễn, khoá tài khoản, chia sẻ dữ liệu cá nhân thuộc về con người. Không ghi mật khẩu, tên tài khoản, thông tin cá nhân thật vào thẻ; tình huống đều là giả định.", "takeaways": ["Ba mức tự chủ: Mức 1 AI tự động thực hiện (người dùng được thông báo, xem lại, hoàn tác được); Mức 2 AI chỉ đề xuất, con người đồng ý thì mới thực hiện; Mức 3 con người trực tiếp quyết định.", "Ba tiêu chí cân nhắc: T1 hậu quả nếu AI làm sai; T2 xem lại, hoàn tác được không; T3 có liên quan quyền lợi, dữ liệu cá nhân, sự công bằng với người khác không.", "AI được tự động thực hiện khi hậu quả nếu sai nhỏ, hoàn tác được, người dùng xem lại hoặc tắt được và không ảnh hưởng quyền lợi của người khác.", "Tỉ lệ đúng cao (ví dụ 95%) không thay được việc con người xem xét hoàn cảnh và chịu trách nhiệm: với 200 hồ sơ, 5% là khoảng 10 bạn có thể bị đánh giá sai.", "Quyết định quan trọng cần có bước con người quyết định, công bố kèm lí do và có cách để người bị ảnh hưởng đề nghị xem xét lại."], "modules": [{"type": "decide", "tag": "HĐ1 • Mở đầu", "title": "Máy quét “AI tự làm hay con người quyết định?”", "nav": "AI tự làm hay tự quyết", "icon": "🚦", "badge": "Đèn tín hiệu", "intro": "<b>Để AI tự làm hay tự quyết định?</b> Tình huống A (giả định): Trình soạn thảo văn bản tự động gạch chân và sửa các từ em gõ sai chính tả khi em soạn báo cáo môn Tin học. Tình huống B (giả định): Phần mềm dọn dẹp máy tính dùng AI thông báo đã chọn 40 tệp không dùng trong 3 tháng và sẽ tự xoá vĩnh viễn sau 10 giây. Trong số đó có thư mục sản phẩm dự án Tin học em chưa nộp. Câu hỏi: Em muốn để AI tự làm tình huống nào và muốn tự quyết định tình huống nào? Ghi lí do trong một câu. Dưới đây là máy quét ba câu hỏi (T1, T2, T3) rồi các tình huống.", "questions": ["T1: Nếu AI làm sai, hậu quả có lớn không?", "T2: Em có thể xem lại và hoàn tác (lấy lại) được không?", "T3: Việc này có liên quan đến quyền lợi, dữ liệu cá nhân hoặc sự công bằng với người khác không?"], "verdicts": ["Mức 1: AI tự động thực hiện", "Mức 2: AI đề xuất, em đồng ý mới làm", "Mức 3: con người trực tiếp quyết định"], "rules": [{"when": [null, 0, 1], "v": 2}, {"when": [1, 0, null], "v": 1}, {"when": [null, null, 1], "v": 1}, {"when": [1, null, null], "v": 1}, {"when": [0, 1, 0], "v": 0}, {"when": [null, null, null], "v": 1}], "cases": [{"t": "A. Trình soạn thảo văn bản tự động gạch chân và sửa các từ em gõ sai chính tả khi em soạn báo cáo môn Tin học.", "v": 0, "why": "Mức 1. Nhiều HS chọn để AI tự làm vì sửa lỗi nhỏ, nhanh, em đọc lại được và lấy lại từ gốc được. Hậu quả nhỏ (T1), hoàn tác được (T2), chỉ liên quan văn bản của chính em (T3); em vẫn nên đọc lại các tên riêng và thuật ngữ."}, {"t": "B. Phần mềm dọn dẹp máy tính dùng AI thông báo đã chọn 40 tệp không dùng trong 3 tháng và sẽ tự xoá vĩnh viễn sau 10 giây. Trong số đó có thư mục sản phẩm dự án Tin học em chưa nộp.", "v": [1, 2], "why": "Nhiều HS chọn tự quyết định vì xoá vĩnh viễn không lấy lại được và ảnh hưởng đến bài sẽ nộp. Có thể có HS ủng hộ để AI xoá vì tiết kiệm công sức; hãy đối chiếu ở HĐ 3. Lí do dựa vào hậu quả, khả năng lấy lại là dấu hiệu lập luận tốt. Lí do chỉ dựa vào tốc độ (“cho nhanh”) là chỗ hỏi thêm: “Nếu AI làm sai thì em có lấy lại được không?”"}, {"t": "C. Ứng dụng thư điện tử tự chuyển thư rác vào mục thư rác.", "v": 0, "why": "Lọc nhầm thì hậu quả nhỏ, mở mục thư rác là lấy lại được: Mức 1."}, {"t": "D. Ứng dụng xem video tự tạo phụ đề cho lời nói trong video.", "v": 0, "why": "Ví dụ thao tác tự động khác: phụ đề tắt được, em vẫn nghe tiếng gốc: Mức 1."}], "after": "Câu hỏi (1): Em muốn để AI tự làm tình huống nào, tự quyết định tình huống nào? Vì sao? Đáp án mở. Câu hỏi (2) của bài: Dựa vào đâu để biết việc nào AI được tự động thực hiện, việc nào con người phải trực tiếp quyết định? Đây là vấn đề của bài, câu trả lời đầy đủ là kết luận của HĐ 2: dựa vào hậu quả nếu AI làm sai, khả năng xem lại, hoàn tác và mức liên quan đến quyền lợi, dữ liệu cá nhân, sự công bằng với người khác."}, {"type": "sort", "tag": "HĐ2 • Ba mức tự chủ và ba tiêu chí", "title": "Xếp mức tự chủ cho các tình huống", "nav": "Xếp mức tự chủ", "icon": "🗂️", "badge": "Nhà phân mức", "intro": "<b>Ba mức tự chủ:</b> Mức 1: AI tự động thực hiện, người dùng được thông báo, xem lại và hoàn tác được; Mức 2: AI chỉ đề xuất hoặc cảnh báo, người dùng xem xét và đồng ý thì việc mới được thực hiện; Mức 3: con người trực tiếp quyết định và chịu trách nhiệm, AI chỉ cung cấp thông tin khi được yêu cầu. <b>Ba tiêu chí:</b> T1: hậu quả lớn hay nhỏ nếu AI làm sai; T2: người dùng có xem lại và hoàn tác được hay không; T3: việc đó có liên quan đến quyền lợi, dữ liệu cá nhân hoặc sự công bằng với người khác hay không. Nhiệm vụ: chọn một mức cho mỗi tình huống (giả định); ghi lí do bằng ít nhất hai trong ba tiêu chí. Riêng tình huống 5, xếp mức cho từng hành động (a) và (b).", "cats": ["Mức 1: AI tự động thực hiện", "Mức 2: AI chỉ đề xuất, em đồng ý mới làm", "Mức 3: con người trực tiếp quyết định"], "cards": [{"t": "1. Trình soạn thảo văn bản tự động gạch chân và sửa các từ gõ sai chính tả ngay khi em gõ. Em có thể nhấn Ctrl+Z để lấy lại từ ban đầu hoặc tắt tính năng này trong phần cài đặt.", "g": [0], "why": "Mức 1. Hậu quả nhỏ (T1), hoàn tác bằng Ctrl+Z hoặc tắt được (T2), chỉ liên quan văn bản của chính em (T3); em vẫn nên đọc lại các tên riêng và thuật ngữ."}, {"t": "2. Phần mềm diệt virus dùng AI phát hiện một tệp có dấu hiệu lạ và tự động chuyển tệp vào khu cách ly. Người dùng có thể mở khu cách ly để khôi phục tệp nếu thấy bị nhầm.", "g": [0], "why": "Mức 1. Cần xử lí kịp thời; tệp chỉ bị chuyển vào khu cách ly, nếu nhầm thì hậu quả nhỏ (T1), khôi phục được từ khu cách ly (T2). Nếu phần mềm xoá luôn tệp thì phải chuyển lên Mức 2 vì không còn hoàn tác."}, {"t": "3. Phần mềm dọn dẹp máy tính dùng AI đề nghị xoá vĩnh viễn 40 tệp không dùng trong 3 tháng, trong đó có thư mục sản phẩm dự án Tin học em chưa nộp.", "g": [1, 2], "why": "Mức 2. AI chỉ lập danh sách đề xuất, người dùng mở xem từng nhóm tệp rồi mới đồng ý; xoá vĩnh viễn khó hoàn tác (T2) và có thể mất bài chưa nộp (T1). Chấp nhận Mức 3 nếu nhóm lập luận được bằng tiêu chí."}, {"t": "4. Ứng dụng học trực tuyến dùng AI chấm bài tự luận môn Tin học, gợi ý điểm số và xếp từng bạn vào nhóm cần hỗ trợ thêm.", "g": [1, 2], "why": "Mức 2. AI gợi ý điểm, giáo viên xem lại rồi mới ghi sổ; bài có cách giải khác thường dễ bị chấm sai (T1), việc xếp nhóm ảnh hưởng đến cách đối xử với từng bạn (T3). Chấp nhận Mức 3 nếu nhóm lập luận được bằng tiêu chí."}, {"t": "5a. Hệ thống mạng của nhà trường dùng AI phát hiện một tài khoản đăng nhập bất thường lúc 2 giờ sáng. Hệ thống (a) yêu cầu nhập thêm mã xác thực.", "g": [0], "why": "(a) Mức 1. Yêu cầu nhập mã xác thực: hậu quả nhỏ (T1) và hoàn tác được (T2). Yêu cầu nhập thêm mã xác thực chỉ làm chậm một lần đăng nhập; nếu hệ thống nhầm thì bạn nhập mã là xong."}, {"t": "5b. Hệ thống mạng của nhà trường dùng AI phát hiện một tài khoản đăng nhập bất thường lúc 2 giờ sáng. Hệ thống (b) khoá vĩnh viễn tài khoản của bạn học sinh đó.", "g": [2], "why": "(b) Mức 3. Khoá vĩnh viễn: quản trị viên xem lại nhật kí và trao đổi với bạn học sinh trước khi quyết định. Đăng nhập lúc 2 giờ sáng chưa chắc là hành vi xấu (T1); việc khoá ảnh hưởng quyền sử dụng máy tính của bạn (T3). Khoá vĩnh viễn làm bạn mất quyền sử dụng tài khoản, khó lấy lại và có thể oan."}, {"t": "6. Trợ lí ảo trong ứng dụng nhắn tin đề xuất tự động chia sẻ số điện thoại và vị trí của em cho một trò chơi mới cài để nhận quà tân thủ.", "g": [2], "why": "Mức 3. Dữ liệu cá nhân đã gửi đi thì không thu hồi được (T2), liên quan quyền riêng tư và an toàn của em (T3). Em không đồng ý chia sẻ để nhận quà; nếu phân vân thì hỏi cha mẹ hoặc người lớn tin cậy trước."}, {"t": "7 (tình huống thứ bảy của nhóm xong sớm). Ứng dụng nhắn tin tự dịch tin nhắn tiếng Anh sang tiếng Việt và vẫn hiện tin nhắn gốc.", "g": [0], "why": "Mức 1: hiểu sai thì đọc lại tin gốc được (T1, T2). Chấp nhận mọi tình huống về quản lí tệp, mạng hoặc ứng dụng nhắn tin nếu mức xếp có lí do theo ít nhất hai tiêu chí."}], "pass": 0.7, "after": "Mức tự chủ được xếp cho từng việc, không xếp cho cả một hệ thống. Chấp nhận mức khác đáp án nếu lí do hợp lí và dùng đúng tiêu chí, nhất là tình huống 3, 4. Mức 2 và Mức 3: quyết định cuối cùng đều là của con người."}, {"type": "quiz", "tag": "HĐ2 • Ba mức tự chủ và ba tiêu chí", "title": "Kết luận của nhóm và bảng kiểm", "nav": "Kết luận của nhóm", "icon": "✅", "badge": "Nhà phân mức", "intro": "Trả lời các câu hỏi của HĐ2 và kết luận của nhóm (hai đến ba câu): Cách nhận biết việc nào AI được tự động thực hiện, việc nào con người phải trực tiếp quyết định (Mức 2 hoặc Mức 3).", "qs": [{"q": "Nếu AI làm sai thì hậu quả lớn hay nhỏ, có lấy lại được không, có ảnh hưởng đến người khác không? Câu hỏi này đưa nhóm quay lại tiêu chí nào?", "opts": ["T1, T2, T3", "Chỉ tốc độ xử lí", "Chỉ độ chính xác của AI"], "a": 0, "why": "Câu hỏi dùng để đưa nhóm quay lại T1 (hậu quả), T2 (xem lại, hoàn tác) và T3 (quyền lợi, dữ liệu cá nhân, sự công bằng với người khác)."}, {"q": "Ở tình huống 5, vì sao hai hành động của cùng một hệ thống lại ở hai mức khác nhau?", "opts": ["Vì hậu quả và khả năng hoàn tác của hai hành động khác nhau", "Vì hệ thống có hai phần mềm", "Vì cả hai hành động đều nhẹ như nhau"], "a": 0, "why": "Yêu cầu nhập thêm mã xác thực chỉ làm chậm một lần đăng nhập; nếu hệ thống nhầm thì bạn nhập mã là xong. Khoá vĩnh viễn làm bạn mất quyền sử dụng tài khoản, khó lấy lại và có thể oan vì đăng nhập lúc 2 giờ sáng chưa chắc là hành vi xấu. Mức tự chủ được xếp cho từng việc, không xếp cho cả một hệ thống."}, {"q": "Kết luận nào nêu đủ điều kiện của cả hai vế (khi AI được tự động thực hiện; khi con người phải trực tiếp quyết định, tức Mức 2 hoặc Mức 3)? Chọn tất cả đáp án đúng.", "opts": ["AI được tự động thực hiện (Mức 1) khi hậu quả nếu sai nhỏ, người dùng xem lại và hoàn tác được, và không ảnh hưởng quyền lợi của người khác", "Con người phải quyết định (Mức 2 hoặc Mức 3) khi hậu quả nếu sai lớn, khó hoàn tác hoặc liên quan quyền lợi, dữ liệu cá nhân, sự công bằng với người khác", "Chỉ cần AI đúng trên 90% là cho tự động", "Luôn cho AI tự quyết định cho nhanh"], "a": [0, 1], "why": "Dựa vào hậu quả nếu AI làm sai, khả năng xem lại, hoàn tác và mức liên quan đến quyền lợi, dữ liệu cá nhân, sự công bằng với người khác. Ở Mức 2 và Mức 3, quyết định cuối cùng đều là của con người."}, {"q": "Bảng kiểm bốn yêu cầu cho phiếu nhóm gồm những gì? Chọn tất cả đáp án đúng.", "opts": ["Xếp mức hợp lí ít nhất 4 trong 6 tình huống", "Mỗi lí do dùng ít nhất hai tiêu chí", "Tách được hai hành động ở tình huống 5", "Kết luận nêu đủ điều kiện của cả hai vế (khi AI được tự động thực hiện; khi con người phải trực tiếp quyết định, tức Mức 2 hoặc Mức 3)", "Xếp đúng cả 6 tình huống theo đáp án duy nhất"], "a": [0, 1, 2, 3], "why": "Bảng kiểm dùng để phản hồi phiếu nhóm, không quy đổi thành mức. Về hợp tác và trình bày: Khá: phối hợp, nghe ý kiến bạn và trình bày rõ lí do chọn mức; Tốt: phân công hiệu quả, tiếp thu phản biện và nêu rõ phần nào AI tự làm, phần nào con người quyết định."}]}, {"type": "lab", "tag": "HĐ3 • Luyện tập", "title": "“Đúng 95%” có nghĩa là không ai bị sai?", "nav": "Đúng 95% có đủ?", "icon": "📊", "badge": "Phản biện số liệu", "intro": "Tình huống giả định: Câu lạc bộ Tin học của trường có 200 bạn đăng kí, cần chọn 5 bạn dự thi Tin học trẻ. Câu lạc bộ dùng hệ thống AI tính điểm từ kết quả bài trắc nghiệm và tổng số giờ đăng nhập luyện tập trên website của câu lạc bộ, rồi tự động công bố danh sách. Hệ thống đánh giá đúng khoảng 95% hồ sơ. Bạn An lập trình Scratch rất tốt nhưng nhà không có máy tính, chỉ luyện ở trường nên số giờ đăng nhập thấp và không có tên trong danh sách. Bạn Bình cho rằng hệ thống đúng tới 95% nên cứ để AI tự quyết định cho nhanh. Hệ thống đúng với khoảng 95% hồ sơ thì có nghĩa là không bạn nào bị đánh giá sai không? Kéo các thanh trượt để phản biện (mô hình minh hoạ).", "sliders": [{"id": "n", "n": "Số hồ sơ", "min": 20, "max": 500, "val": 200, "unit": " hồ sơ"}, {"id": "acc", "n": "Độ chính xác của hệ thống", "min": 80, "max": 100, "val": 95, "unit": "%"}, {"id": "login", "n": "Tỉ trọng số giờ đăng nhập trong điểm", "min": 0, "max": 100, "val": 50, "unit": "%"}, {"id": "human", "n": "Mức giáo viên xem lại và quyết định danh sách", "min": 0, "max": 100, "val": 0, "unit": "%"}], "outputs": [{"n": "Số bạn có thể bị đánh giá sai", "base": 10, "w": {"n": 0.05, "acc": -2}, "c": 2}, {"n": "Mức bất lợi cho bạn thiếu thiết bị ở nhà", "base": 50, "w": {"login": 0.8, "human": -0.3}, "c": 1}, {"n": "Sai sót được phát hiện và sửa", "base": 0, "w": {"human": 0.9}, "c": 0}], "insights": [{"id": "acc", "op": ">=", "val": 95, "txt": "Không. Với 200 hồ sơ, 5% là khoảng 10 hồ sơ có thể bị đánh giá sai; mỗi hồ sơ là một bạn học sinh thật như bạn An."}, {"id": "login", "op": ">=", "val": 50, "txt": "Số giờ đăng nhập phụ thuộc nhiều vào việc nhà có máy tính hay không nên không đo đúng năng lực; dữ liệu đầu vào này khiến hệ thống bất lợi cho bạn thiếu thiết bị. Dữ liệu công bằng hơn là điểm bài thực hành làm tại trường, sản phẩm Scratch nộp cho câu lạc bộ."}, {"id": "human", "op": ">=", "val": 70, "txt": "Giáo viên phụ trách xem lại và quyết định danh sách chính thức; bước AI chỉ xếp hạng sơ bộ không phải bước quyết định. AI không hiểu hoàn cảnh của bạn An và không chịu trách nhiệm trước bạn, trong khi người ra quyết định phải giải thích được lí do."}, {"id": "human", "op": "<=", "val": 10, "txt": "Nếu quen giao hết cho AI thì con người mất dần thói quen kiểm tra và khó phát hiện sai."}]}, {"type": "order", "tag": "HĐ3 • Luyện tập", "title": "Quy trình ba bước giữ quyền quyết định", "nav": "Quy trình 3 bước", "icon": "🧭", "badge": "Người quyết định", "intro": "Đề xuất quy trình ba bước để câu lạc bộ vừa dùng AI vừa giữ quyền quyết định cho con người. Ghi rõ bước nào AI làm, bước nào con người quyết định và bạn bị ảnh hưởng có quyền gì. (Nếu chưa vững, em có thể trả lời ngắn theo ba ý: AI làm gì; ai quyết định; bạn bị ảnh hưởng được làm gì.) Sắp xếp các bước theo thứ tự.", "items": ["Bước 1: AI xếp hạng sơ bộ và nêu rõ dữ liệu đã dùng; câu lạc bộ bổ sung điểm bài thực hành tại trường thay cho số giờ đăng nhập.", "Bước 2: giáo viên phụ trách xem lại danh sách, đối chiếu bài thực hành và trao đổi với những bạn có điểm sát ngưỡng.", "Bước 3: giáo viên quyết định danh sách chính thức, công bố kèm lí do và cho phép học sinh đề nghị xem xét lại; lưu lại lí do để kiểm tra về sau."], "why": "Câu hỏi (2): Quy trình của em giữ quyền quyết định của con người ở bước nào? Câu trả lời mong đợi chỉ ra được bước GV phụ trách xem lại và quyết định danh sách chính thức; bước AI chỉ xếp hạng sơ bộ không phải bước quyết định. Mức đạt câu 3: quy trình có ít nhất một bước do con người quyết định và một cách để bạn bị ảnh hưởng đề nghị xem xét lại. Chưa thấy minh chứng: quy trình vẫn để AI tự công bố danh sách hoặc không nêu quyền của bạn bị ảnh hưởng. Với cách trả lời theo ba ý: đạt khi ý “ai quyết định” là con người và có ý nêu quyền của bạn bị ảnh hưởng. Một rủi ro của quy trình mới là người xem lại cũng có thể nhầm hoặc chủ quan, nên cần công bố lí do và có cách đề nghị xem xét lại. Mức Khá: giải thích được người ra quyết định phải chịu trách nhiệm còn AI thì không. Mức Tốt: quy trình nêu rõ người bị ảnh hưởng được biết lí do quyết định; lí do được lưu lại để kiểm tra về sau."}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Phiếu số 2, phần A: phản biện bạn Bình", "nav": "Phản biện ý kiến Bình", "icon": "🗣️", "badge": "Người phản biện", "intro": "Phiếu học tập số 2, phần A. Em tự làm trước. 1. Xếp mức tự chủ phù hợp cho việc công bố danh sách và giải thích bằng ít nhất hai trong ba tiêu chí T1, T2, T3. 2. Phản biện ý kiến của bạn Bình: nêu ít nhất hai lí do cần bảo vệ quyền tự chủ của con người khi dùng AI để đưa ra quyết định quan trọng, trong đó có một lí do dùng phép tính với 200 hồ sơ. Gợi ý: nghĩ về con số, dữ liệu đầu vào và người chịu trách nhiệm.", "fields": [{"id": "a", "label": "1. Mức tự chủ cho việc công bố danh sách", "opts": ["Mức 1", "Mức 2", "Mức 3"]}, {"id": "b", "label": "1. Giải thích bằng ít nhất hai trong ba tiêu chí T1, T2, T3", "hint": "Hậu quả, hoàn tác, quyền lợi", "ph": "VD: ..."}, {"id": "c", "label": "2. Lí do 1 (dùng phép tính với 200 hồ sơ)", "hint": "Con số", "ph": "VD: ..."}, {"id": "d", "label": "2. Lí do 2 (dữ liệu đầu vào hoặc người chịu trách nhiệm)", "hint": "Dữ liệu đầu vào, người chịu trách nhiệm", "ph": "VD: ..."}], "checks": ["Câu 1: mức xếp hợp lí cho việc công bố danh sách (Mức 2 hoặc Mức 3), lí do dùng ít nhất hai tiêu chí; chưa thấy minh chứng: chọn Mức 1 hoặc chỉ ghi mức, không có lí do", "Câu 2: nêu đủ hai lí do có căn cứ từ tình huống, trong đó có phép tính 5% của 200 hồ sơ là 10 hồ sơ; chưa thấy minh chứng: chỉ nêu ý chung (“AI có thể sai”) mà không dẫn con số, dữ liệu đầu vào hay người chịu trách nhiệm", "Khá (kiểm chứng): không dừng ở phép tính: chỉ ra hệ quả cụ thể với người bị ảnh hưởng (mỗi hồ sơ sai là một bạn thật như An)", "Tốt (kiểm chứng): chỉ ra thêm nguyên nhân từ dữ liệu đầu vào, đề xuất cách kiểm chứng và điều chỉnh quy trình"], "sample": "Câu 1 (7.A3.1): Mức 2 cho việc xếp hạng sơ bộ và Mức 3 cho việc chọn, công bố danh sách do giáo viên phụ trách. Chọn người dự thi ảnh hưởng đến cơ hội của học sinh (T3), danh sách đã công bố thì rất khó sửa (T1, T2). Không chấp nhận Mức 1 cho việc công bố danh sách. Câu 2 (7.A3.2): Lí do 1: hệ thống đúng 95% nghĩa là với 200 hồ sơ vẫn có thể sai khoảng 10 hồ sơ, mỗi hồ sơ là một bạn học sinh thật như bạn An. Lí do 2: số giờ đăng nhập phụ thuộc nhiều vào việc nhà có máy tính hay không nên không đo đúng năng lực; dữ liệu đầu vào này khiến hệ thống bất lợi cho bạn thiếu thiết bị. Lí do 3: AI không hiểu hoàn cảnh của bạn An và không chịu trách nhiệm trước bạn, trong khi người ra quyết định phải giải thích được lí do. Lí do 4: nếu quen giao hết cho AI thì con người mất dần thói quen kiểm tra và khó phát hiện sai."}, {"type": "match", "tag": "HĐ4 • Vận dụng", "title": "Ví dụ tính năng AI và mức tự chủ", "nav": "Ví dụ trên phiếu", "icon": "🔗", "badge": "Người chọn mức", "intro": "Phần B của Phiếu học tập số 2 gợi ý một số ứng dụng có tính năng gợi ý hay tự động của AI. Ghép mỗi ứng dụng với mức tự chủ và lí do theo T1, T2, T3.", "pairs": [["Thư điện tử tự lọc thư rác", "Để bộ lọc tự chuyển thư rác vào mục thư rác: nếu lọc nhầm thì hậu quả nhỏ (T1), mở mục thư rác là lấy lại được (T2)."], ["Ứng dụng nhắn tin gợi ý trả lời nhanh", "Chỉ cho AI đề xuất, em đọc lại rồi mới gửi, vì thư đã gửi khó thu hồi (T2) và câu trả lời ảnh hưởng tới người nhận (T3)."], ["Ứng dụng quản lí ảnh tự nhận ra ảnh mờ, ảnh gần giống nhau và đề nghị xoá", "Mức 2, em xem lại trước khi xoá, vì ảnh xoá nhầm có thể không lấy lại được (T1, T2)."], ["Trình soạn thảo gợi ý viết tiếp câu", "Mức 2, em chọn có dùng gợi ý hay không, vì gợi ý có thể sai hoặc không đúng ý em (T1) và bài đã nộp thì khó sửa lại (T2)."]], "why": "Gợi ý cho HS khá về tính năng có thể gây bất lợi cho một nhóm người hoặc làm lộ dữ liệu. Bộ lọc có thể lọc nhầm thư của những người viết theo cách khác thường. Gợi ý trả lời nhanh cần đọc nội dung thư, nên em không để ứng dụng đọc thư có thông tin riêng của người khác khi chưa cần."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Thẻ khuyến nghị quyền tự chủ", "nav": "Thẻ khuyến nghị", "icon": "🪪", "badge": "Chủ nhân quyết định", "intro": "Em chọn một phần mềm, ứng dụng có tính năng gợi ý hay tự động của AI mà em hoặc gia đình thường dùng. Ví dụ có thể chọn: thư điện tử tự lọc thư rác, gợi ý trả lời nhanh; ứng dụng nhắn tin gợi ý trả lời nhanh; ứng dụng quản lí ảnh tự nhận ra ảnh mờ, ảnh gần giống nhau và đề nghị xoá; trình soạn thảo gợi ý viết tiếp câu. Em không ghi mật khẩu, tên tài khoản hay thông tin cá nhân thật. Dòng 1–3 em làm trên lớp; dòng 4, 5 chưa xong thì em viết tiếp vào vở ở nhà.", "fields": [{"id": "app", "label": "1. Phần mềm hoặc ứng dụng em chọn", "hint": "Chỉ nêu loại ứng dụng", "ph": "VD: ứng dụng thư điện tử của gia đình", "long": false}, {"id": "auto", "label": "2. Một tính năng em để AI tự động và lí do (dùng T1, T2, T3)", "hint": "Dùng ít nhất hai tiêu chí", "ph": "VD: bộ lọc thư rác: nhầm thì hậu quả nhỏ (T1), mở mục thư rác là lấy lại được (T2)"}, {"id": "own", "label": "3. Một tính năng em tự quyết hoặc chỉ cho AI đề xuất, lí do cần giữ quyền quyết định", "hint": "Dùng ít nhất hai tiêu chí", "ph": "VD: gợi ý trả lời nhanh: em đọc lại rồi mới gửi, vì thư đã gửi khó thu hồi (T2), ảnh hưởng người nhận (T3)"}, {"id": "lvl", "label": "Tính năng ở dòng 3 thuộc mức", "opts": ["Mức 2: AI chỉ đề xuất", "Mức 3: em trực tiếp quyết định"]}, {"id": "chk", "label": "4. Cách em kiểm tra, hoàn tác hoặc tắt tính năng đó", "hint": "Có thể viết tiếp ở nhà", "ph": "VD: thỉnh thoảng mở mục thư rác; tắt gợi ý trả lời trong phần cài đặt"}, {"id": "rm", "label": "5. Một câu nhắc bản thân trước khi cho AI làm thay", "hint": "Ngắn gọn", "ph": "VD: Sai thì sao? Lấy lại được không? Có ảnh hưởng ai khác không?"}], "checks": ["Mỗi lí do trên thẻ dùng ít nhất hai tiêu chí T1, T2, T3: lí do có nói tới hậu quả nếu sai, khả năng lấy lại và ảnh hưởng tới người khác", "Dòng 2, 3 chọn mức hợp lí cho hai tính năng; dòng 3 chấp nhận việc ở Mức 2 hoặc Mức 3", "Thẻ không chứa thông tin cá nhân thật; dòng 4, 5 chỉ để phản hồi, chưa hoàn thiện ở nhà không bị coi là chưa đạt", "Khá: mức xếp hợp lí; lí do gắn tiêu chí với chi tiết cụ thể của tình huống, của tính năng em chọn. Tốt: tách được các việc khác nhau trong cùng một tình huống, xếp mức riêng cho từng việc; dùng cả ba tiêu chí có chọn lọc; nêu được ví dụ mới"], "sample": "Ví dụ thẻ đạt yêu cầu. 1. Ứng dụng thư điện tử của gia đình. 2. Để bộ lọc tự chuyển thư rác vào mục thư rác: nếu lọc nhầm thì hậu quả nhỏ (T1), mở mục thư rác là lấy lại được (T2). 3. Gợi ý trả lời nhanh: chỉ cho AI đề xuất, em đọc lại rồi mới gửi, vì thư đã gửi khó thu hồi (T2) và câu trả lời ảnh hưởng tới người nhận (T3). 4. Thỉnh thoảng mở mục thư rác xem có thư bị lọc nhầm không; không cần thì tắt gợi ý trả lời nhanh trong phần cài đặt. 5. Trước khi để phần mềm làm thay, mình hỏi: sai thì sao, lấy lại được không, có ảnh hưởng đến ai khác không? Mẫu nhận xét: “Em đã tính đúng 5% của 200 hồ sơ là 10 hồ sơ. Lí do thứ hai của em còn chung. Em đọc lại tình huống và tìm chi tiết về số giờ đăng nhập của bạn An.” “Quy trình của em có bước GV quyết định danh sách. Em chưa nêu bạn bị ảnh hưởng được làm gì. Em thử thêm: nếu thấy mình bị đánh giá sai, bạn An có thể đề nghị ai xem xét lại?” “Thẻ của em chọn mức hợp lí cho bộ lọc thư rác. Lí do ở dòng 3 mới dùng một tiêu chí. Em thử hỏi: thư đã gửi đi có lấy lại được không?”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
