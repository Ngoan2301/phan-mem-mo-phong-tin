<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 8. Lập kế hoạch dự án sáng tạo có sử dụng AI – Lớp 7</title>
<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🗂️", "title": "Bài 8. Lập kế hoạch dự án sáng tạo có sử dụng AI – Lớp 7", "ainote": "Người quyết định cuối cùng là con người (cô chủ nhiệm, nhóm), không phải AI; bước có AI luôn có người kiểm tra kết quả và GV thao tác công cụ trong danh mục nhà trường đã rà soát. Dự án chỉ lập trên giấy, chỉ ghi loại dữ liệu và nơi lấy, không ghi tên, ảnh của bạn.", "takeaways": ["Kế hoạch dự án có ba phần: A thiết kế, B kế hoạch thực hiện, C tự kiểm tra và góp ý.", "Sáu câu hỏi của kế hoạch làm được: (A) làm ra cái gì, (B) cho ai, (C) AI chỉ làm một việc nào, (D) ai làm và khi nào, (E) đo thế nào là thành công, (F) rủi ro gì và ai kiểm soát.", "Giao cho AI một việc lặp lại, có ví dụ mẫu rõ; việc cân nhắc hoàn cảnh, cảm xúc hoặc ảnh hưởng tới người khác do con người làm và quyết định.", "Bước nào cũng có một người phụ trách và mốc xong, không ghi “cả nhóm”; bước có AI có người kiểm tra; dùng dữ liệu của người khác thì bước xin phép đứng trước.", "Tiêu chí thành công phải đo được; kết quả AI phải được người đối chiếu trước khi dùng. Biện pháp rủi ro làm được khi có tên người làm, gắn với bước và có thời điểm."], "modules": [{"type": "flag", "tag": "HĐ1 • Mở đầu", "title": "Phiếu 1: Hai bản kế hoạch, bản nào làm được?", "icon": "⚖️", "nav": "Bản X hay Bản Y?", "badge": "Người soi kế hoạch", "intro": "Hai bản kế hoạch giả định cho cùng một ý tưởng (tên Lan, Minh, Hà, Nam là tên giả định). Sáu câu hỏi: (A) Làm ra cái gì? (B) Cho ai? (C) AI chỉ làm một việc nào? (D) Ai làm, khi nào? (E) Đo thế nào là thành công? (F) Rủi ro gì, ai kiểm soát? Ở Bản X: khoanh chỗ trả lời sai hoặc thiếu, ghi chữ cái câu hỏi bên cạnh chỗ khoanh. Ở Bản Y: đánh dấu ✓ vào chữ cái của câu đã được trả lời: A B C D E F. Câu hỏi then chốt: (1) Bản nào làm được? (2) Bằng chứng nào trong Bản Y khiến em tin bản này làm được? Điều gì có thể làm kết luận thay đổi?", "cols": ["Bản", "Câu trong kế hoạch"], "flagWhat": "chỗ sai hoặc thiếu (Bản X) – Bản Y không gắn cờ", "rows": [{"c": ["Bản X", "Dự án: Hộp thư hỏi đáp AI hiện đại."], "bad": true, "why": "(A) “Hộp thư hỏi đáp AI” chưa rõ dạng sản phẩm: hộp giấy hay phần mềm, đặt ở đâu."}, {"c": ["Bản X", "Nhóm sẽ dùng AI để giải đáp nhanh chóng, chính xác mọi thắc mắc của học sinh toàn trường."], "bad": true, "why": "(B) “Toàn trường” quá rộng; (C) “Giải đáp mọi thắc mắc” là nhiều việc."}, {"c": ["Bản X", "Nhóm thu câu hỏi của tất cả các lớp, kèm họ tên và lớp để AI trả lời riêng từng bạn."], "bad": true, "why": "(F) Thu họ tên, lớp là thu dữ liệu cá nhân không cần thiết, có nguy cơ lộ, mà kế hoạch không nêu rủi ro nào. Đây là lỗi an toàn."}, {"c": ["Bản X", "AI sẽ tự trả lời và tự quyết định câu nào cần báo thầy cô."], "bad": true, "why": "(C) “Tự quyết định câu nào báo thầy cô” là để AI quyết định thay người. Gợi ý cho cặp xong sớm: “AI sẽ tự trả lời” và “tự quyết định câu nào cần báo thầy cô”."}, {"c": ["Bản X", "Cả nhóm cùng làm trong 4 tuần."], "bad": true, "why": "(D) “Cả nhóm cùng làm” nghĩa là không ai chịu trách nhiệm bước nào."}, {"c": ["Bản X", "Dự án thành công khi mọi người thấy tiện."], "bad": true, "why": "(E) “Mọi người thấy tiện” không đo được."}, {"c": ["Bản Y", "Hộp câu hỏi không ghi tên cho lớp 7A. AI xếp mỗi câu hỏi vào một trong ba nhóm (học tập, nội quy, hoạt động), dựa trên 30 câu mẫu lớp đã xếp."], "bad": false}, {"c": ["Bản Y", "Vì mỗi tuần hộp nhận khoảng 30–40 câu, lặp lại suốt năm học, xếp trước giúp cô đọc theo nhóm nhanh hơn. Cô chủ nhiệm đọc và trả lời mọi câu; câu không thuộc ba nhóm thì cô để riêng."], "bad": false}, {"c": ["Bản Y", "Tuần 1 Lan xin phép cô; tuần 2 Minh thu 30 câu mẫu, cả lớp xếp vào ba nhóm; tuần 3 cô chủ nhiệm cho AI xếp thử 10 câu, Hà ghi kết quả; tuần 4 Nam báo cáo."], "bad": false}, {"c": ["Bản Y", "Thành công: ít nhất 8 trong 10 câu xếp đúng, cô chủ nhiệm xác nhận."], "bad": false}, {"c": ["Bản Y", "Rủi ro: câu hỏi có thể nhắc tên bạn khác; AI có thể xếp sai. Cô chủ nhiệm mở hộp, xoá tên người được nhắc tới rồi mới đưa câu cho nhóm."], "bad": false}], "after": "Câu hỏi (1): Bản nào làm được? Bản Y. Bản X dài và nghe hiện đại nhưng người khác đọc xong không làm theo được; Bản X thiếu hoặc sai ở cả sáu câu A–F. Bản Y trả lời đủ sáu câu: (A) hộp câu hỏi không ghi tên và việc xếp câu hỏi vào ba nhóm; (B) lớp 7A; (C) AI chỉ xếp nhóm câu hỏi, có lí do (mỗi tuần khoảng 30–40 câu, lặp lại suốt năm học, xếp trước để cô đọc theo nhóm nhanh hơn); cô chủ nhiệm đọc mọi câu, trả lời và để riêng câu không thuộc nhóm nào; (D) Lan, Minh, Hà, Nam, mỗi người một tuần; tuần 3 cô chủ nhiệm cho AI xếp thử, Hà ghi kết quả; (E) ít nhất 8 trong 10 câu xếp đúng, cô chủ nhiệm xác nhận; (F) cô chủ nhiệm xoá tên trước khi đưa câu cho nhóm, đọc mọi câu và xử lí câu không thuộc nhóm nào. Câu hỏi (2): bằng chứng là những chỗ ghi cụ thể: tên người, tuần, số câu, người xác nhận. Kết luận có thể đổi khi cô chủ nhiệm không đồng ý đặt hộp câu hỏi: bước xin phép hỏng, nhóm phải sửa kế hoạch (đổi người xin phép hoặc đổi cách thu câu hỏi); kế hoạch làm được vẫn phụ thuộc vào người được xin phép. Kiến thức chốt: kế hoạch gồm Phần A, thiết kế (trả lời các câu A, B, C, E, F); Phần B, kế hoạch thực hiện (trả lời câu D); Phần C, tự kiểm tra và góp ý."}, {"type": "match", "tag": "HĐ2.1 • Từ ý tưởng tới thiết kế", "title": "Bộ phiếu ý tưởng dự phòng A–F: thu hẹp Mục 4", "icon": "🎯", "nav": "Phiếu ý tưởng A–F", "badge": "Người giao việc cho AI", "intro": "Nhóm lấy ý tưởng từ phiếu của Bài 7 lớp 7 (nếu còn) hoặc Bộ phiếu ý tưởng dự phòng A–F, viết đầu phiếu và Phần A Mục 1–4 của Phiếu 2; nhóm nêu điểm thay đổi riêng (người dùng, nơi dùng hoặc sản phẩm) vào đầu Phiếu 2. Mục 3 chỉ ghi loại dữ liệu, nơi lấy, không ghi tên, ảnh của bạn. Ghép mỗi phiếu (ý tưởng, ai gặp vấn đề, gợi ý dữ liệu) với lời “Cẩn thận ở Mục 4”. Câu hỏi then chốt: (1) AI chỉ làm một việc nào, cho ai, dựa trên dữ liệu gì? Vì sao nên để AI làm việc này? (2) Sản phẩm có điểm mới gì so với cách đang làm?", "pairs": [["Phiếu A. Ý tưởng: Trả lời thắc mắc thường gặp về lịch học và nội quy (chatbot; chỉ lập kế hoạch). Ai gặp vấn đề: HS mới vào trường, HS mới chuyển trường hay hỏi lại cùng một câu về lịch học, nội quy. Gợi ý dữ liệu: sổ nội quy của trường; lịch học của lớp; câu hỏi HS hay hỏi do lớp tự ghi (không ghi tên), lớp xếp sẵn vào ba chủ đề làm ví dụ mẫu.", "Dễ thành “trợ lí AI tư vấn mọi thứ”. Hãy thu hẹp: AI xếp mỗi câu HS hỏi vào một trong ba chủ đề thường gặp (lịch học, nội quy, đồng phục) để chỉ tới câu trả lời GV đã duyệt; câu khác chủ đề chuyển cho GV."], ["Phiếu B. Ý tưởng: Xếp câu hỏi ôn tập HS gửi vào đúng môn (Toán, Ngữ văn, Tiếng Anh) để GV bộ môn trả lời theo nhóm trước các bài kiểm tra. Ai gặp vấn đề: HS ôn tập có câu hỏi mà không biết hỏi ai; GV bộ môn nhận câu hỏi lẫn lộn nhiều môn. Gợi ý dữ liệu: câu hỏi ôn tập HS hay hỏi do lớp tự ghi (không ghi tên); lớp xếp sẵn 30 câu vào ba môn làm ví dụ mẫu.", "Dễ thành “AI giải bài, trả lời mọi câu ôn tập”. AI chỉ xếp câu hỏi vào môn, không tự trả lời; GV bộ môn trả lời; câu không thuộc ba môn chuyển cho GV chủ nhiệm."], ["Phiếu C. Ý tưởng: Bớt món ăn thừa ở căng tin bán trú: AI xếp phiếu nhận xét món ăn của HS thành “thích / bình thường / không thích” để cô cấp dưỡng điều chỉnh. Ai gặp vấn đề: cô cấp dưỡng, HS bán trú; nhiều món bị bỏ thừa. Gợi ý dữ liệu: phiếu nhận xét món ăn HS viết sau bữa trưa (không ghi tên).", "Dễ thành “AI tự lên thực đơn”. Cô cấp dưỡng mới là người quyết định thực đơn."], ["Phiếu D. Ý tưởng: Nhận dạng rác tái chế bằng ảnh cho hoạt động thu gom của trường (chỉ lập kế hoạch). Ai gặp vấn đề: tổ trực nhật, đội thu gom phế liệu của trường; rác ở căng tin bị bỏ chung một túi. Gợi ý dữ liệu: ảnh chụp chai nhựa, lon, giấy ở căng tin; lớp tự chụp và gán nhãn.", "Dễ thành “AI tự phân loại mọi loại rác của cả xã”. Hãy thu hẹp vào ba loại rác ở căng tin trường."], ["Phiếu E. Ý tưởng: Nhận xét bản nháp dàn ý trình bày ý tưởng của HS làm dự án môn học (không viết hộ). Ai gặp vấn đề: HS lúng túng khi trình bày ý tưởng dự án trước lớp. Gợi ý dữ liệu: dàn ý bốn phần GV đã cho; vài dàn ý mẫu của lớp (được phép dùng), lớp đánh dấu phần có, phần thiếu.", "Dễ thành “AI viết hộ bài trình bày”. AI chỉ nhận xét bản nháp của HS còn thiếu phần nào trong bốn phần GV đã cho; HS tự sửa."], ["Phiếu F. Ý tưởng: Nhận dạng 5 loại cây trong vườn trường qua ảnh lá để làm bảng tên cây. Ai gặp vấn đề: HS và khách đến thăm không biết tên các cây trong vườn trường; bảng tên cây cũ đã mất. Gợi ý dữ liệu: ảnh lá của 5 loại cây trong vườn trường; lớp tự chụp và gán nhãn, chỉ chụp lá, không chụp người.", "Dễ thành “AI nhận mọi loài cây”. Hãy thu hẹp vào 5 loại cây có trong vườn trường."]], "why": "Mục 1–3 mong đợi ghi gọn, mỗi mục tối đa hai dòng: vấn đề và người gặp cụ thể; sản phẩm nêu dạng, người dùng thử, phạm vi; dữ liệu nêu loại và nơi lấy, không ghi tên, ảnh của bạn trong lớp. Mục 4 đúng khi chỉ có một động từ chính cho AI, có người dùng, có nguồn dữ liệu. Ví dụ đúng (phiếu D): “AI nhận ảnh rác ở căng tin là chai nhựa, lon hay giấy cho tổ trực nhật, dựa trên 60 ảnh mẫu lớp đã chụp và gán nhãn.” Ví dụ cần sửa: “AI trả lời và tư vấn mọi thắc mắc của học sinh” (nhiều việc, không có dữ liệu). Dòng lí do mong đợi nêu căn cứ cụ thể: số lượng nhiều, lặp lại hằng tuần, có sẵn ví dụ mẫu. Nhóm chỉ ghi “cho nhanh”, “cho hiện đại” thì hỏi thêm “Vì sao để AI làm việc này hợp lí hơn?”. Dòng “Điểm mới” đúng khi so được với cách làm hiện nay, ví dụ: “Hiện nay tổ trực nhật nhặt rác chung một túi; sản phẩm giúp chia ngay ba loại để bán phế liệu.” Việc AI không được làm (nhóm xong sớm): phiếu A, AI không tự soạn câu trả lời, câu khác chủ đề chuyển cho GV; phiếu B, AI không tự trả lời câu hỏi ôn tập, GV bộ môn trả lời; phiếu C, AI không lên thực đơn; phiếu E, AI không viết hộ dàn ý hay bài trình bày. Gợi ý: việc lặp lại nhiều lần, có ví dụ mẫu, có người kiểm tra kết quả; với việc xếp loại, nhận dạng mà không có ví dụ mẫu thì AI không có gì để học theo, nhóm thêm bước thu ví dụ mẫu hoặc chưa giao việc đó cho AI. Kiến thức chốt: giao cho AI một việc lặp lại; việc cần cân nhắc hoàn cảnh, cảm xúc hoặc ảnh hưởng tới người khác do con người làm, con người quyết định."}, {"type": "match", "tag": "HĐ2.2 • Ai làm gì, khi nào, cần gì", "title": "Bảng Phần B mẫu: hộp câu hỏi lớp 7A", "icon": "📅", "nav": "Phần B mẫu", "badge": "Người lập kế hoạch", "intro": "Bảng Phần B mẫu: hộp câu hỏi không ghi tên cho lớp 7A (dự án giả định, bốn tuần; chỉ lập trên giấy, không thu dữ liệu thật). Ghép mỗi bước với: ai phụ trách, ai kiểm tra; cần gì; khâu nào có AI, ai kiểm tra kết quả; xong khi nào. Câu hỏi then chốt: (1) Mỗi HS phụ trách hoặc kiểm tra bước nào?", "pairs": [["Bước 1. Xin phép cô chủ nhiệm đặt hộp câu hỏi không ghi tên", "Phụ trách: Lan. Cần: hộp giấy, thư xin phép. Khâu AI: không có AI. Xong: tuần 1."], ["Bước 2. Thu 30 câu mẫu, cả lớp xếp vào ba nhóm", "Phụ trách: Minh. Cần: thẻ giấy; câu hỏi cô chủ nhiệm đã xoá tên. Khâu AI: không có AI, con người xếp. Xong: tuần 2."], ["Bước 3. Cô chủ nhiệm cho AI xếp thử 10 câu hỏi mới", "Phụ trách: Hà (ghi kết quả); kiểm tra: Minh. Cần: công cụ trong danh mục nhà trường đã rà soát, GV thao tác; 10 câu cô chủ nhiệm đã xoá tên. Có AI: Minh tự xếp 10 câu theo cách lớp đã thống nhất rồi so với AI, cô chủ nhiệm xác nhận; khi dùng thật, cô chủ nhiệm đọc mọi câu, câu không thuộc ba nhóm cô để riêng. Xong: tuần 3."], ["Bước 4. So kết quả với tiêu chí ở Mục 5, báo cáo lớp", "Phụ trách: Nam. Cần: bảng kết quả. Khâu AI: không có AI. Xong: tuần 4."]], "why": "GV chỉ ra bốn điểm: bước nào cũng có một người phụ trách; bước xin phép đứng trước bước thu dữ liệu; bước có AI có người kiểm tra kết quả; cô chủ nhiệm đọc mọi câu và giữ riêng câu không thuộc nhóm nào. Phần B mong đợi: ai làm bước nào, khi nào xong (không ghi “cả nhóm”). Cột “Cần gì” ghi đủ thứ cần chuẩn bị. Công cụ dự kiến chỉ ghi loại công cụ kèm chữ “trong danh mục nhà trường đã rà soát”, không ghi tên dịch vụ đòi tài khoản cá nhân. Mọi thành viên có tên ở ít nhất một bước, là người phụ trách hoặc người kiểm tra; số người phụ trách thường ít hơn số HS, nên HS chưa có bước nhận làm người kiểm tra một bước; nhóm cũng có thể thêm bước. Bằng chứng khiến nhóm tin mỗi bước xong đúng mốc: bước nào cũng có tên người, thứ cần chuẩn bị đã ghi rõ, các mốc không dồn vào một tuần. Mốc có thể đổi khi chưa xin phép được, người phụ trách vắng, dữ liệu thu chậm; tiết 2 sẽ tua nhanh các sự cố này."}, {"type": "decide", "tag": "HĐ2.2 • Kiểm chéo nhóm bạn", "title": "Kiểm chéo: góp ý đúng một bước", "icon": "🔍", "nav": "Kiểm chéo", "badge": "Người kiểm chéo", "intro": "Kiểm chéo nhóm bạn: góp ý chỉ đúng một bước bằng số và nói vì sao, không khen chê chung chung. Câu hỏi then chốt: (2) Kiểm chéo: (a) Bước nào chưa có người làm? (b) Bước nào quá sức trong bốn tuần? (c) Khâu có AI đã có người kiểm tra kết quả chưa? Với mỗi góp ý, trả lời ba câu rồi chọn loại góp ý.", "questions": ["Bước này còn ghi “cả nhóm” hoặc chưa có một người chịu trách nhiệm?", "Khối lượng việc của bước có quá sức trong bốn tuần không?", "Bước này có AI nhưng chưa ghi ai đối chiếu kết quả?"], "verdicts": ["(a) Bước chưa có người làm", "(b) Bước quá sức trong bốn tuần", "(c) Khâu có AI chưa có người kiểm tra"], "rules": [{"when": [1, null, null], "v": 0}, {"when": [null, 1, null], "v": 1}, {"when": [null, null, 1], "v": 2}], "cases": [{"t": "Góp ý: “Bước 3 ghi ‘cả nhóm’, chưa có một người chịu trách nhiệm.”", "v": 0, "why": "(a) Ví dụ góp ý đúng: bước nào cũng cần một người phụ trách và mốc xong, không ghi “cả nhóm”."}, {"t": "Góp ý: “Bước 2 chụp 500 ảnh trong một tuần là quá sức.”", "v": 1, "why": "(b) Ví dụ góp ý đúng: chỉ đúng một bước bằng số và nói vì sao."}, {"t": "Góp ý: “Bước 3 có AI nhưng chưa ghi ai đối chiếu kết quả.”", "v": 2, "why": "(c) Ví dụ góp ý đúng: bước có AI phải có người kiểm tra kết quả."}]}, {"type": "sort", "tag": "HĐ2.3 • Tua nhanh bốn tuần", "title": "Danh sách sự cố “Tua nhanh bốn tuần”", "icon": "⏩", "nav": "Tua nhanh bốn tuần", "badge": "Người xử lí sự cố", "intro": "Nhóm số N nhận sự cố số N. Sự cố này làm hỏng bước nào trong kế hoạch của nhóm em? Kế hoạch đã có cách xử lí chưa? Kéo mỗi sự cố vào bước thường bị hỏng. Dòng tua nhanh mong đợi chỉ đúng một bước bằng số và nêu một việc làm được có người làm. Ba chỗ lớp vừa chỉ ra là ba chỗ cần kiểm trước: chưa xin phép được nên không có dữ liệu; AI làm sai mà không ai kiểm tra; một bước quá sức hoặc không ai làm.", "cats": ["Bước xin phép, thu dữ liệu", "Bước của bạn phụ trách (nhân sự)", "Bước có AI (chạy thử, công cụ)", "Bước dùng thử với người dùng"], "cards": [{"t": "Sự cố 1: Người cần xin phép chưa đồng ý.", "g": [0], "why": "Bước xin phép, kéo theo bước thu dữ liệu. Cách xử lí mẫu: xin phép sớm từ tuần 1; chưa được đồng ý thì không thu, đổi sang dữ liệu nhóm tự tạo; người phụ trách bước 1 báo GV."}, {"t": "Sự cố 2: Bạn phụ trách một bước bị ốm cả tuần.", "g": [1], "why": "Bước của bạn bị ốm. Cách xử lí mẫu: bạn cùng bước (nếu có) hoặc người điều phối làm thay; lùi mốc, ghi lại trên Phần B. Ví dụ dòng tua nhanh: “Nếu bạn phụ trách bước 2 ốm thì bước 2 hỏng; bạn cùng bước hoặc người điều phối làm thay, lùi mốc sang đầu tuần 3.”"}, {"t": "Sự cố 3: Cho AI chạy thử, có những kết quả AI làm sai.", "g": [2], "why": "Bước thử có AI (kết quả AI sai). Cách xử lí mẫu: người kiểm tra đối chiếu từng kết quả; thêm dữ liệu mẫu (câu, ảnh), thử lại; chưa đủ tiêu chí ở Mục 5 thì không dùng. Liên quan loại rủi ro 1, 3."}, {"t": "Sự cố 4: Ảnh hoặc câu hỏi thu về có lẫn mặt, tên của bạn khác.", "g": [0], "why": "Bước thu dữ liệu. Cách xử lí mẫu: chỉ thu câu hỏi không tên, chỉ chụp đồ vật, không chụp người; GV xoá tên, bỏ ảnh có mặt người trước khi nhóm dùng. Liên quan loại rủi ro 2."}, {"t": "Sự cố 5: Người dùng thử tin ngay kết quả AI, không hỏi lại ai.", "g": [3], "why": "Bước dùng thử với người dùng. Cách xử lí mẫu: ghi rõ trên sản phẩm phần nào do AI làm, ai kiểm tra lại; người dùng hỏi lại GV khi cần. Liên quan loại rủi ro 4, 5."}, {"t": "Sự cố 6: Dữ liệu mẫu có rất ít ảnh hoặc câu của một loại; gặp loại đó AI hay nhận sai.", "g": [0, 2], "why": "Bước thu dữ liệu và bước thử. Cách xử lí mẫu: thu thêm dữ liệu cho loại còn ít; ghi rõ AI chỉ dùng cho các loại đã thử đủ; nêu ai chịu thiệt khi AI hay sai ở loại đó. Liên quan loại rủi ro 3, Mục 5."}, {"t": "Sự cố 7: Gặp câu hỏi hoặc ảnh không thuộc nhóm nào đã định, AI vẫn xếp vào một nhóm.", "g": [2, 3], "why": "Bước có AI và bước dùng thử. Cách xử lí mẫu: thêm nhóm “không thuộc nhóm nào” để người xử lí; người kiểm tra đọc mọi kết quả, câu hỏi hay ảnh nhạy cảm chuyển cho GV. Liên quan loại rủi ro 1, 4."}, {"t": "Sự cố 8: Công cụ dự kiến chưa có trong danh mục nhà trường đã rà soát.", "g": [2], "why": "Bước có AI. Cách xử lí mẫu: không dùng công cụ ngoài danh mục; nhờ GV chọn công cụ trong danh mục nhà trường đã rà soát. Đây là việc cần tránh, không phải một loại rủi ro."}], "pass": 0.7}, {"type": "lab", "tag": "HĐ2.3 • Soi kết quả AI và đo thành công", "title": "Soi kết quả AI xếp thử 10 câu hỏi (giả lập)", "icon": "🧮", "nav": "Soi kết quả AI", "badge": "Người kiểm chứng", "intro": "Bảng giả lập để luyện kiểm chứng, không phải kết quả thử của một công cụ cụ thể. Dự án hộp câu hỏi lớp 7A, tuần 3: AI xếp mỗi câu vào nhóm học tập, nội quy hoặc hoạt động. Tiêu chí: ít nhất 8 trong 10 câu xếp đúng. AI xếp: 1 Bài kiểm tra Toán tuần sau gồm những phần nào? → Học tập; 2 Có được mang điện thoại vào lớp không? → Hoạt động; 3 Khi nào lớp đi tham quan? → Hoạt động; 4 Đi học muộn 5 phút có bị ghi tên không? → Nội quy; 5 Em chưa hiểu cách đổi đơn vị đo, hỏi ai? → Học tập; 6 Lớp có tập văn nghệ cho ngày 20 tháng 11 không? → Học tập; 7 Có phải mặc đồng phục vào thứ Bảy không? → Nội quy; 8 Câu lạc bộ cờ vua sinh hoạt hôm nào? → Nội quy; 9 Làm bài tập về nhà môn Ngữ văn ở vở nào? → Học tập; 10 Có được ăn quà trong giờ học không? → Học tập. Đáp án: AI xếp đúng 6 trong 10 câu (câu 1, 3, 4, 5, 7, 9); sai 4 câu: câu 2 và câu 10 thuộc nhóm nội quy; câu 6 và câu 8 thuộc nhóm hoạt động. Kéo thanh trượt để xem tỉ lệ đúng và quyết định có dùng kết quả hay không. Câu hỏi then chốt: (2) AI xếp đúng mấy câu; so với tiêu chí thì đủ chưa; ai phải phát hiện chỗ sai?", "sliders": [{"id": "ok", "n": "Số câu AI xếp đúng (trong 10 câu thử)", "min": 0, "max": 10, "val": 6, "unit": " câu"}, {"id": "chk", "n": "Có người đối chiếu kết quả (Minh đối chiếu, cô chủ nhiệm xác nhận)", "min": 0, "max": 100, "val": 100, "unit": "%"}, {"id": "n", "n": "Số câu thử", "min": 5, "max": 30, "val": 10, "unit": " câu"}], "outputs": [{"n": "Tỉ lệ AI xếp đúng (%)", "base": 60, "w": {"ok": 10}, "c": 0}, {"n": "Số câu sai bị người kiểm tra phát hiện (% trong số câu sai)", "base": 100, "w": {"chk": 1}, "c": 1}, {"n": "Mức tin cậy để kết luận về AI (%)", "base": 20, "w": {"n": 2, "ok": 3}, "c": 2}], "insights": [{"id": "ok", "op": "<=", "val": 7, "txt": "6 trong 10 thấp hơn mức 8 trong 10 nên chưa đủ tiêu chí thành công. Chưa đủ tiêu chí thì chưa dùng."}, {"id": "ok", "op": ">=", "val": 8, "txt": "Đủ tiêu chí 8 trong 10, nhưng dù con số cao, cô chủ nhiệm vẫn là người quyết định có dùng hay không."}, {"id": "chk", "op": "<=", "val": 10, "txt": "Không có người đối chiếu thì 4 câu sai sẽ không ai biết. Người phát hiện là người kiểm tra ở bước 3 của Bảng Phần B mẫu."}, {"id": "n", "op": "<=", "val": 10, "txt": "Con số “6 trong 10” chỉ đếm số câu xếp đúng trong 10 câu đã thử; nó không cho biết AI có đúng với loại câu ít gặp, câu viết tắt, câu không thuộc nhóm nào hay không. Chỉ với 10 câu thì chưa kết luận được AI hay sai loại câu nào."}]}, {"type": "sort", "tag": "HĐ2.4 • Rủi ro và người kiểm soát", "title": "Rủi ro nổi bật của sáu phiếu ý tưởng", "icon": "⚠️", "nav": "Năm loại rủi ro", "badge": "Người dự báo rủi ro", "intro": "Nhóm viết Mục 6 theo năm loại rủi ro rồi tự kiểm kế hoạch bằng năm câu Phần C. Loại rủi ro: (1) AI cho kết quả sai; (2) lộ dữ liệu cá nhân, xâm phạm riêng tư; (3) thiên lệch: AI sai lệch có tính hệ thống, có thể dẫn tới kết quả thiếu công bằng; (4) người dùng tin nhầm hoặc dùng sai; (5) không nói rõ chỗ nào có dùng AI. Kéo mỗi rủi ro vào loại chính của nó. Câu hỏi then chốt: (1) Với mỗi rủi ro: ai bị ảnh hưởng, biện pháp cụ thể là gì, ai kiểm soát? Biện pháp “cẩn thận hơn” cần sửa; biện pháp làm được khi có tên người làm, gắn với bước, có thời điểm.", "cats": ["Loại 1: AI cho kết quả sai", "Loại 2: lộ dữ liệu cá nhân", "Loại 3: thiên lệch, sai lệch hệ thống", "Loại 4: người dùng tin nhầm, dùng sai"], "cards": [{"t": "Phiếu A: AI xếp nhầm chủ đề, HS đọc câu trả lời không đúng câu mình hỏi, hiểu sai nội quy và bị nhắc nhở oan.", "g": [0, 3], "why": "Loại 1, loại 4. Câu trả lời do GV duyệt trước; câu AI không xếp được chuyển cho GV. Ví dụ biện pháp làm được: “GV đọc các câu AI vừa xếp vào chủ đề nội quy mỗi ngày trước khi HS xem câu trả lời, chuyển câu xếp nhầm sang đúng chủ đề”."}, {"t": "Phiếu B: AI xếp nhầm môn, câu hỏi tới sai GV, HS chờ mà không có câu trả lời; câu hỏi ghi kèm họ tên làm lộ HS đang gặp khó ở môn nào.", "g": [0, 1], "why": "Loại 1, loại 2. GV bộ môn chuyển lại câu xếp nhầm; câu AI không xếp được chuyển cho GV chủ nhiệm."}, {"t": "Phiếu C: AI xếp sai nhận xét viết tắt, viết theo cách nói quen dùng ở địa phương mà dữ liệu mẫu có ít: ý kiến của HS viết theo cách đó bị hiểu sai; phiếu ghi tên bạn chê món.", "g": [2, 1], "why": "Loại 3 (sai lệch có tính hệ thống), loại 2. GV không nhận xét cách viết của vùng nào là sai."}, {"t": "Phiếu D: Ảnh chụp có người, lộ dữ liệu cá nhân; ảnh mẫu chủ yếu là chai, lon còn nguyên và giấy khô nên chai bị bóp méo, lon bẹp, giấy ướt AI hay nhận sai, đội thu gom mất phần rác bán được vì bị xếp nhầm.", "g": [1, 2], "why": "Loại 2, loại 3 (sai lệch có tính hệ thống). Biện pháp: “Chỉ chụp rác, không chụp người”; “Ghi trên bảng kết quả: phần xếp loại rác do AI làm, tổ trực nhật kiểm tra lại”."}, {"t": "Phiếu E: AI báo thiếu nhầm, HS sửa theo mà không tự đọc lại dàn ý, mất cơ hội tự rèn luyện.", "g": [0, 3], "why": "Loại 1, loại 4. Dùng AI nhận xét bản nháp tự viết không mặc nhiên là gian lận."}, {"t": "Phiếu F: AI nhận nhầm tên cây, bảng tên ghi sai mà người xem tin ngay; ảnh mẫu chủ yếu là lá xanh chụp lúc trời sáng nên lá ú  hơn làm thủ công?”) khoanh “Không”. Nhóm nên làm gì? (chọn nhiều đáp án)", "opts": ["Nếu việc ở Mục 4 làm thủ công đơn giản hơn (ví dụ nhắc hạn nộp bài thì một bảng lịch là đủ): giữ phần đó thủ công, chuyển AI sang một khâu khác thật sự cần AI (số lượng nhiều, lặp lại hằng tuần), sửa lại Mục 4 và cột khâu có AI của Phần B", "Nếu việc hợp để giao cho AI nhưng lí do chỉ ghi “cho nhanh”, “cho hiện đại”: ghi thêm căn cứ cụ thể (số lượng, mức lặp lại, có ví dụ mẫu)", "Bỏ hẳn AI khỏi kế hoạch", "Xoá câu 5 khỏi phiếu"], "a": [0, 1], "why": "Khoanh “Không” thì nhóm sửa, không bỏ hẳn AI khỏi kế hoạch. Kế hoạch sau khi sửa vẫn có một khâu dùng AI."}, {"q": "Dòng “Nhóm đã sửa gì” mong đợi điều gì?", "opts": ["Nêu một chỗ cụ thể (mục nào, bước nào) và vì sao sửa", "Xoá sạch bản cũ bằng bút tẩy", "Ghi “đã sửa hết”"], "a": 0, "why": "Mọi nhóm có lượt trình bày và lượt hỏi; dấu vết sửa (gạch, ghi lại bằng bút khác màu) là minh chứng, không phải lỗi. Kiến thức chốt: kế hoạch tốt là kế hoạch đã được hỏi, được thử và được sửa có ghi lại."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu 3: Phiếu cuối giờ", "icon": "✅", "nav": "Phiếu cuối giờ", "badge": "Thành viên có trách nhiệm", "intro": "Em tự viết phiếu này về kế hoạch của nhóm em (không ghi thông tin cá nhân nào ngoài họ tên, lớp, nhóm; không ghi chuyện riêng). Nhóm đối chiếu kế hoạch đã sửa với sáu câu A–F. Câu hỏi then chốt: (1) Kế hoạch nhóm em bây giờ trả lời được mấy câu trong sáu câu A–F? (2) Chỗ nào trên phiếu là bằng chứng em đã làm phần việc của mình?", "fields": [{"id": "o1", "label": "1. Nhóm em làm ra sản phẩm gì, cho ai dùng? Nó khác cách mọi người đang làm ở điểm nào?", "hint": "Sản phẩm (dạng gì), người dùng cụ thể, một điểm khác", "ph": "Hộp câu hỏi không ghi tên cho lớp 7A; khác cách cũ ở chỗ cô đọc theo nhóm."}, {"id": "o2", "label": "2. Trong dự án, AI chỉ làm một việc nào, ở bước nào của Phần B? Ai kiểm tra kết quả của AI, kiểm tra bằng cách nào?", "hint": "Một việc của AI, số bước, tên hoặc vai người kiểm tra", "ph": "AI chỉ xếp câu hỏi vào ba nhóm ở bước 3; Minh đối chiếu, cô chủ nhiệm xác nhận."}, {"id": "o3", "label": "3. Bước em phụ trách hoặc kiểm tra là gì? Bạn nào phụ trách hoặc kiểm tra bước đó cùng em (nếu có)? Em cần chuẩn bị gì, xong khi nào?", "hint": "Bước có tên em và mốc xong", "ph": "Bước 2, xong tuần 2; cần thẻ giấy."}, {"id": "gp", "label": "Em đã góp phần sửa", "opts": ["Mục 1–4", "Phần B", "Mục 5–6"]}, {"id": "tm", "label": "Em tự thấy phần mình làm ở mức", "opts": ["Đạt", "Khá", "Tốt"]}, {"id": "ly", "label": "vì sao (dòng tự đánh giá)", "hint": "một câu", "ph": "vì em ghi đúng bước có tên em.", "long": false}], "checks": ["Đạt: ô 1 nêu sản phẩm (dạng gì), người dùng cụ thể và một điểm khác so với cách đang làm; ô 2 nêu một việc của AI và người kiểm tra kết quả của AI; ô 3 ghi đúng bước có tên mình trong Phần B và mốc xong (không ghi “cả nhóm”).", "Khá: tự viết được ba ô không cần gợi ý, khớp phiếu nhóm; ô 2 ghi đúng bước có AI (số thứ tự bước); ô 3 ghi thêm thứ cần chuẩn bị và bạn cùng bước (nếu có).", "Tốt: ô 1 so sánh cụ thể với cách đang làm; ô 2 nêu rõ cách kiểm tra kết quả của AI (đối chiếu với cách người làm, ai xác nhận); ô 3 nêu thứ cần chuẩn bị gắn với bước trước đó (ví dụ chờ xin phép xong).", "An toàn, đạo đức: mỗi rủi ro ở Mục 6 có biện pháp làm được và người kiểm soát, bước xin phép đứng trước bước thu dữ liệu (Khá); nêu được ai có thể bị ảnh hưởng khi AI sai lệch có tính hệ thống hoặc gặp dữ liệu ngoài nhóm đã định (Tốt).", "Hợp tác: thực hiện đúng vai, trả lời đúng câu hỏi của nhóm bạn (Khá); giải thích được vì sao nhóm nhận hoặc không nhận một góp ý, trình bày rõ phần nào AI làm, ai kiểm tra (Tốt)."], "sample": "Em ghi đúng bước 2 có tên em và mốc tuần 2, khớp Phần B của nhóm. Em đã đạt; để lên mức Khá, em ghi thêm thứ cần chuẩn bị cho bước đó. Lần sau, em thử hỏi: nếu em vắng thì ai làm thay? (Mẫu nhận xét.) Nếu bạn cùng bước vắng mặt thì phần việc của em: bạn cùng bước (nếu có) hoặc người điều phối làm thay theo Phần B; nhóm ghi lại mốc mới. Chưa thấy minh chứng: ghi “cả nhóm”; bước không khớp Phần B; không có mốc xong; người dùng chung chung (“mọi người”, “cả trường”); AI làm nhiều việc; không có người kiểm tra."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 7 • Môn đảm nhiệm: Công nghệ • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

function confetti(){const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,s:5+Math.random()*7,c:['#ff8a2b','#2ecc71','#4aa3ff','#f6c744','#ef5350'][Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<140)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
