 const b=E('button','btn','Hoàn thành & chấm tự đánh giá');b.onclick=()=>{const filled=md.fields.filter(f=>(s.f[f.id]||'').trim().length>=4).length,chk=Object.values(s.c).filter(Boolean).length;if(!s.rs){s.rs=1;award(i,Math.round(6*(filled/md.fields.length*.6+(md.checks?chk/md.checks.length:1)*.4)))}good();ST.done[i]=1;go(i)};c.appendChild(b);
 const dl=E('button','btn w','⬇ Lưu thành ảnh PNG');dl.onclick=()=>{const cv=document.createElement('canvas');cv.width=1000;cv.height=720;const x=cv.getContext('2d');x.fillStyle='#fffdf3';x.fillRect(0,0,1000,720);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--o');x.lineWidth=10;x.strokeRect(8,8,984,704);x.fillStyle='#1f2d3d';x.font='bold 30px Arial';x.fillText(md.title.slice(0,50),36,64);let y=110;const w=(t,y0,fs)=>{x.font=fs;const ws=String(t).split(' ');let l='';let yy=y0;for(const a of ws){if(x.measureText(l+a).width>920){x.fillText(l,36,yy);yy+=28;l=''}l+=a+' '}x.fillText(l,36,yy);return yy+34};md.fields.forEach(f=>{x.fillStyle='#d35400';y=w(f.label,y,'bold 20px Arial');x.fillStyle='#1f2d3d';y=w(s.f[f.id]||'……',y,'20px Arial')});const a=document.createElement('a');a.href=cv.toDataURL();a.download='san-pham-cua-em.png';a.click()};c.appendChild(dl);

/* ---- sim ---- */
R.sim=(m,md,i)=>{const s=ST.m[i];s.ms=s.ms||{};s.st=s.st||{};const c=head(md),mis=md.missions||[];if(md.story)c.appendChild(E('div','sbub',`<span class="se2">${esc(md.story.e||'🧒')}</span><span>${md.story.t}</span>`));if(md.steps&&md.steps.length)c.appendChild(E('div','coach',md.steps.map((t,k)=>`<div class="cs"><i>${k+1}</i><span>${esc(t)}</span></div>`).join('')));if(md.hint){const hb=E('button','btn w hintb','💡 Gợi ý');const hx=E('div','fb info');hx.style.display='none';hx.innerHTML=esc(md.hint);hb.onclick=()=>{hx.style.display=hx.style.display=='none'?'':'none'};c.append(hb,hx)}const list=E('div','mis');c.appendChild(list);const host=E('div','simh');c.appendChild(host);const out=E('div');c.appendChild(out);
 const paint=()=>{list.innerHTML='<b>🎯 Nhiệm vụ của em:</b>'+mis.map((x,k)=>`<div class="mi ${s.ms[k]?'ok':''}">${s.ms[k]?'✅':'⬜'} ${esc(x.t)}</div>`).join('')};
 const fin=()=>{out.innerHTML='';if(md.after)out.appendChild(E('div','takeb','<b>🌟 Điều em rút ra:</b> '+md.after));finish(out,i)};
 paint();let live=0;const set=met=>{if(!live)return;let ch=0;mis.forEach((x,k)=>{if(!s.ms[k]&&met[x.m]!=null&&cmp(x.op,met[x.m],x.v)){s.ms[k]=1;award(i,3);ch=1}});if(ch){good();paint();if(mis.every((x,k)=>s.ms[k])&&!s.fin){s.fin=1;confetti();fin()}}};
 try{SIM[md.scene].mount(host,md.p||{},set,s.st)}catch(e){host.innerHTML='<i>Lỗi cảnh mô phỏng: '+esc(e.message)+'</i>'}
 live=1;if(s.fin)fin();m.appendChild(c)};

function result(m){const c=E('div','card');const mx=maxPts()||1,pc=Math.min(100,Math.round(ST.pts/mx*100));
 c.innerHTML=`<h2>🏁 Kết quả của em</h2><p class="lead">Tổng điểm: <b>${ST.pts}</b> / ${mx} (${pc}%)</p><div class="bar" style="height:18px"><i style="width:${pc}%"></i></div><div style="text-align:center;margin:14px 0">`+MODS.map((x,k)=>`<span class="badge ${ST.done[k]?'on':''}">${x.icon||'⭐'}<small>${esc(x.badge||x.nav||x.title).slice(0,28)}</small></span>`).join('')+`</div>
 <table><tr><th>Hoạt động</th><th>Điểm</th></tr>`+MODS.map((x,k)=>`<tr><td>${esc(x.title)}</td><td>${ST.got[k]}/${mp(x)}</td></tr>`).join('')+`</table>
 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}
$('#ttl').textContent=SPEC.title;$('#sub').textContent=SPEC.sub||'';$('#ico').textContent=SPEC.icon||'🧭';
go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
