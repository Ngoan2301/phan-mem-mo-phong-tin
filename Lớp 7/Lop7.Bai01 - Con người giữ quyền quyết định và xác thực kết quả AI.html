<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 1. Con người giữ quyền quyết định và xác thực kết quả AI – Lớp 7</title>
<style>
:root{--o:#e67e22;--od:#ac5e19;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🧑‍⚖️", "title": "Bài 1. Con người giữ quyền quyết định và xác thực kết quả AI – Lớp 7", "ainote": "Hồ sơ, tình huống đều là giả định, không dùng tên hay điểm của học sinh thật. Quyết định chọn người, cho điểm, xử lí bạn luôn thuộc về con người; kết quả AI phải được kiểm chứng trước khi dùng. Thẻ không ghi địa chỉ, số điện thoại, tên tài khoản.", "takeaways": ["Kiến thức chốt: khung AI gợi ý, Con người kiểm tra, Con người quyết định; ba cột lí do Công bằng, An toàn, Quyền lợi con người.", "AI chỉ đưa ra gợi ý dựa trên dữ liệu; con người kiểm tra, quyết định và chịu trách nhiệm.", "Ba lí do con người giữ quyền quyết định: bảo đảm công bằng, bảo đảm an toàn, bảo vệ quyền lợi con người.", "Câu trả lời trôi chảy chưa chắc đã đúng: phải đối chiếu nguồn tin cậy, hỏi người có trách nhiệm hoặc tính lại, rồi ghi nhật kí kiểm chứng.", "Để AI quyết định cuối cùng có thể gây sai không được sửa, người bị thiệt không được giải thích, không rõ ai chịu trách nhiệm, sai lặp lại hàng loạt."], "modules": [{"type": "flag", "tag": "HĐ1 • Mở đầu", "title": "Có nên để AI chọn thành viên câu lạc bộ?", "nav": "AI chọn thành viên", "icon": "🤖", "badge": "Thám tử hồ sơ", "intro": "Câu lạc bộ Robot của trường có ba suất, sáu bạn đăng kí. Nhà trường thử dùng một ứng dụng AI để chấm hồ sơ (hồ sơ giả định). Cách ứng dụng chấm: ứng dụng AI học từ hồ sơ các bạn được chọn những năm trước rồi tự đặt mức điểm cho từng tiêu chí. Năm nay, ứng dụng tính ra: <b>Điểm AI = 7 × điểm Tin học + 1,2 × số giờ dùng máy tính ở nhà mỗi tuần</b>. Ứng dụng đề xuất ba bạn có Điểm AI cao nhất. Câu hỏi (1): Có nên để ứng dụng tự chọn ba bạn mà không cần ai xem lại? Vì sao? Hãy gắn cờ dòng em thấy cần con người xem xét lại.", "cols": ["Bạn (giả định)", "Điểm Tin học", "Giờ dùng máy ở nhà/tuần", "Điểm AI", "AI đề xuất"], "flagWhat": "cần con người xem xét lại, không nên để máy quyết định một mình", "rows": [{"c": ["An", "9,5", "20", "90,5", "Chọn"], "bad": false}, {"c": ["Hà", "8,8", "16", "80,8", "Chọn"], "bad": false}, {"c": ["Bình", "8,0", "18", "77,6", "Chọn"], "bad": false}, {"c": ["Dũng", "8,5", "15", "77,5", "Không"], "bad": true, "why": "Dũng chỉ kém Bình 0,1 điểm nhưng bị loại. Với chênh lệch sát nút như vậy, con người nên xem thêm thông tin (hoàn cảnh, sản phẩm, thái độ) thay vì để một con số quyết định."}, {"c": ["Chi", "9,0", "2", "65,4", "Không"], "bad": true, "why": "Chi có điểm Tin học cao thứ hai nhưng bị xếp gần cuối chỉ vì dùng máy ở nhà ít. Ứng dụng không biết nhà bạn không có máy tính. Đây là điểm thiếu công bằng mà chỉ con người mới xem xét được."}, {"c": ["Giang", "7,0", "10", "61,0", "Không"], "bad": false}], "after": "Câu hỏi (1). Có nên để ứng dụng tự chọn ba bạn mà không cần ai xem lại? Vì sao? Mọi lựa chọn có lí do đều được chấp nhận; câu trả lời chỉ dùng để chẩn đoán. Dự đoán thường gặp: “Không nên, vì ứng dụng không biết bạn nào nhà không có máy tính.”; “Nên, vì máy chấm theo số liệu, không thiên vị.” Đây là ngộ nhận, hãy ghi vào góc bảng “Lí do ban đầu” để đối chiếu ở HĐ3. Câu hỏi (2) của bài: Khi dùng AI, quyết định nào con người phải giữ và vì sao phải kiểm tra kết quả của AI? Câu trả lời mong đợi cuối bài: con người giữ quyết định ảnh hưởng tới người khác (chọn ai, cho điểm, xử lí ai) để bảo đảm công bằng, an toàn, quyền lợi con người. Phải kiểm tra kết quả của AI vì AI gợi ý từ dữ liệu nên có thể sai, thiếu thông tin về hoàn cảnh."}, {"type": "sort", "tag": "HĐ2.1 • Ai giữ quyền quyết định?", "title": "Ba tình huống, ba lí do", "nav": "Ai quyết định?", "icon": "⚖️", "badge": "Người giữ quyết định", "intro": "Ba tình huống (giả định). <b>Tình huống A. Tuyển chọn:</b> Ứng dụng chấm hồ sơ câu lạc bộ Robot. Bạn Chi có điểm Tin học 9,0 nhưng nhà không có máy tính nên chỉ dùng máy hai giờ mỗi tuần, bị ứng dụng xếp gần cuối. <b>Tình huống B. Sức khoẻ:</b> Bạn Nam ngã xe, chụp ảnh vết thương ở chân gửi một ứng dụng AI. Ứng dụng trả lời: “Vết xước nhẹ, không cần đi khám.” Hai giờ sau, chân sưng to và đau tăng. Lưu ý: AI không chẩn đoán thay bác sĩ; khi bị thương, em hãy báo người lớn, nhân viên y tế. <b>Tình huống C. Camera trong lớp:</b> Một công ty đề xuất lắp camera AI trong lớp để “đo mức tập trung” của từng HS, gửi điểm cho phụ huynh mỗi ngày, dùng điểm này để xếp chỗ ngồi. HS chưa được hỏi ý kiến.<br>Với mỗi tình huống: (1) AI làm việc gì? (2) Nếu để AI quyết định luôn, điều gì có thể sai? (3) Ai nên là người quyết định? (4) Lí do chính thuộc nhóm nào: công bằng, an toàn hay quyền lợi con người? Mỗi câu trả lời ghi kèm một chi tiết trong tình huống làm dẫn chứng. Thiếu thông tin thì có thể kết luận “chưa đủ thông tin” và ghi cần biết thêm gì. Hãy kéo mỗi thẻ vào lí do chính.", "cats": ["Bảo đảm công bằng", "Bảo đảm an toàn", "Bảo vệ quyền lợi con người"], "cards": [{"t": "A: AI xếp hạng hồ sơ. Nếu để AI quyết định: bạn không có máy ở nhà bị loại dù giỏi.", "g": [0], "why": "Công bằng: con người xem xét được hoàn cảnh mà dữ liệu không thể hiện. Chi tiết: Chi được 9,0 điểm Tin học nhưng chỉ dùng máy hai giờ mỗi tuần vì nhà không có máy. Ban chủ nhiệm câu lạc bộ nên quyết định."}, {"t": "A: Chi có điểm Tin học 9,0 nhưng chỉ dùng máy hai giờ mỗi tuần vì nhà không có máy tính, bị xếp gần cuối", "g": [0], "why": "Công bằng: con người xem xét được hoàn cảnh mà dữ liệu không thể hiện."}, {"t": "A: Ứng dụng học từ hồ sơ những năm trước rồi tự đặt mức điểm cho từng tiêu chí", "g": [0], "why": "Tiêu chí do máy tự đặt từ dữ liệu cũ có thể lặp lại thiên lệch; con người cần xem tiêu chí có công bằng không."}, {"t": "B: AI nhận định ảnh vết thương: “Vết xước nhẹ, không cần đi khám.”", "g": [1], "why": "An toàn: AI chỉ hỗ trợ (chẳng hạn nhắc đi khám), không dùng để chẩn đoán. Nam cùng người lớn đưa đi khám; bác sĩ, nhân viên y tế chẩn đoán và quyết định."}, {"t": "B: Hai giờ sau chân Nam sưng to, đau tăng", "g": [1], "why": "An toàn. Chi tiết: hai giờ sau chân sưng to, đau tăng."}, {"t": "B: Nếu tin ngay câu trả lời của AI thì bỏ lỡ chấn thương cần xử lí", "g": [1], "why": "An toàn: tin ngay thì bỏ lỡ chấn thương cần xử lí."}, {"t": "C: Camera AI theo dõi, chấm “mức tập trung” của từng học sinh", "g": [2], "why": "Quyền lợi con người: quyền riêng tư, phẩm giá. Nhà trường, phụ huynh, HS cùng bàn bạc; có thể quyết định không dùng."}, {"t": "C: Học sinh bị theo dõi liên tục, bị xếp chỗ theo con số máy tính ra", "g": [2, 0], "why": "Quyền lợi con người: quyền riêng tư, phẩm giá; xếp chỗ theo con số máy tính ra còn có thể không công bằng."}, {"t": "C: Điểm “tập trung” được gửi cho phụ huynh mỗi ngày", "g": [2], "why": "Quyền lợi con người. Chi tiết: HS chưa được hỏi ý kiến; điểm gửi phụ huynh mỗi ngày."}, {"t": "C: Học sinh chưa được hỏi ý kiến, chưa được biết camera ghi gì, dùng làm gì, chưa được phản hồi", "g": [2], "why": "Người bị ghi hình phải được biết camera ghi gì, dùng làm gì và được phản hồi, được không đồng ý. Trong tình huống, HS chưa được hỏi ý kiến nên chưa được biết, chưa được phản hồi."}], "pass": 0.7, "after": "Kiến thức chốt: khung <b>AI gợi ý → Con người kiểm tra → Con người quyết định</b>; ba cột lí do Công bằng, An toàn, Quyền lợi con người. Chấp nhận kết luận “chưa đủ thông tin” nếu ghi rõ còn thiếu gì, chẳng hạn tình huống C chưa biết camera lưu hình ảnh ở đâu, bao lâu, ai được xem. Câu hỏi gợi mở: “Ai bị thiệt nếu máy sai?” A là Chi; B là Nam; C là các bạn HS bị chấm sai, bị xếp chỗ. “Chi tiết nào cho thấy vậy?”: chỉ vào chi tiết cụ thể trong tình huống, không trả lời chung chung “vì máy có thể sai”."}, {"type": "story", "tag": "HĐ2.2 • Xác thực kết quả AI", "title": "Bản tin lớp: tin ngay hay kiểm chứng?", "nav": "Xác thực kết quả AI", "icon": "🔎", "badge": "Nhật kí kiểm chứng", "intro": "Ba câu hỏi gửi trợ lí AI (mô phỏng) để đưa vào bản tin lớp. Trước khi nghe câu trả lời, hãy dự đoán trợ lí AI dễ trả lời sai câu nào và vì sao. Sau đó đối chiếu từng câu trả lời với nguồn; mỗi kết luận phải ghi nguồn đối chiếu. Câu lệnh mẫu GV nhập: “Hãy trả lời ngắn gọn bằng tiếng Việt, phù hợp với học sinh lớp 7. Nếu không chắc chắn, hãy nói rõ là không chắc. Câu hỏi: …” (không nhập thông tin cá nhân). Câu trả lời thật của trợ lí AI có thể khác, cách kiểm chứng như nhau. Câu trả lời dưới đây là giả định, có lỗi cài sẵn.", "app": "💬 Trợ lí AI (mô phỏng)", "hello": "Mình sẽ trả lời ngắn gọn. Mình có thể nhầm, bạn nhớ kiểm tra lại nhé!", "meters": [{"n": "Độ tin cậy của bản tin", "b": 50, "c": 0}, {"n": "Nguy cơ thông tin sai", "b": 30, "c": 2}, {"n": "Niềm tin của bạn bè", "b": 50, "c": 1}], "chars": [{"n": "Câu 1: Bạch Đằng", "color": "#4aa3ff", "task": "Hỏi: “Ngô Quyền đánh tan quân Nam Hán trên sông Bạch Đằng vào năm nào?” AI trả lời: “Năm 938.” Em xử lí thế nào?", "opts": [{"t": "Đối chiếu với sách Lịch sử và Địa lí 6 rồi ghi nhật kí", "chat": ["Ngô Quyền đánh tan quân Nam Hán trên sông Bạch Đằng năm nào?", "Năm 938."], "ch": [15, -10, 10], "v": "good", "fb": "Câu 1: Năm 938. Câu trả lời thường đúng vì là kiến thức phổ biến; vẫn đối chiếu với sách giáo khoa Lịch sử và Địa lí 6 hoặc thông tin GV cung cấp. Kết luận: Đúng."}, {"t": "Đăng luôn vì đây là kiến thức quen thuộc", "chat": ["Ngô Quyền đánh tan quân Nam Hán trên sông Bạch Đằng năm nào?", "Năm 938."], "ch": [0, 10, 0], "v": "mid", "fb": "Lần này kết quả đúng nhưng em chưa có bằng chứng. Thói quen không kiểm tra sẽ gây hại ở những câu AI trả lời sai."}]}, {"n": "Câu 2: Trường mình", "color": "#ff9f43", "task": "Hỏi: “Trường THCS Hoa Sen năm nay có bao nhiêu lớp 7? Trường thành lập năm nào?” AI trả lời: “Trường có 8 lớp 7, thành lập năm 1995.” Em xử lí thế nào?", "opts": [{"t": "Đăng nguyên văn vào bản tin vì AI nói rất chắc chắn", "chat": ["Trường THCS Hoa Sen năm nay có bao nhiêu lớp 7? Trường thành lập năm nào?", "Trường có 8 lớp 7, thành lập năm 1995."], "ch": [-25, 40, -20], "v": "bad", "fb": "AI không có thông tin chính xác về trường của lớp nên có thể trả lời tự tin nhưng sai. Người đọc sẽ tin nhầm thông tin sai về trường. Câu 2: bản tin đưa thông tin sai về trường; người đọc tin nhầm."}, {"t": "Kiểm tra thông báo chính thức của nhà trường hoặc hỏi thầy cô; chưa có nguồn thì ghi “Chưa đủ thông tin”", "chat": ["Trường THCS Hoa Sen năm nay có bao nhiêu lớp 7? Trường thành lập năm nào?", "Trường có 8 lớp 7, thành lập năm 1995."], "ch": [25, -20, 15], "v": "good", "fb": "Câu 2: Trợ lí AI không có thông tin chính xác về trường của lớp nên có thể trả lời tự tin nhưng sai. Câu trả lời “8 lớp 7, thành lập năm 1995” là giả định. Trợ lí AI cũng có thể trả lời là không biết; đó là hành vi đúng. Kiểm chứng bằng thông báo, trang thông tin chính thức của nhà trường hoặc hỏi GV. Kết luận theo thông tin chính thức; chưa có nguồn thì kết luận “Chưa đủ thông tin”. Lưu ý: câu “chưa đủ thông tin” không được đăng như thông tin chắc chắn."}]}, {"n": "Câu 3: Quỹ lớp", "color": "#2ecc71", "task": "Hỏi: lớp 36 bạn, mỗi bạn góp 15 000 đồng; đã chi ba lần, mỗi lần 120 000 đồng. Quỹ còn bao nhiêu? AI trả lời: “Quỹ lớp còn 200 000 đồng.” Em xử lí thế nào?", "opts": [{"t": "Tin kết quả vì phép tính chỉ có cộng, trừ, nhân", "chat": ["Lớp 36 bạn, mỗi bạn góp 15 000 đồng, chi ba lần mỗi lần 120 000 đồng. Quỹ còn bao nhiêu?", "Quỹ lớp còn 200 000 đồng."], "ch": [-25, 45, -30], "v": "bad", "fb": "Kết quả sai: 36 × 15 000 = 540 000; 3 × 120 000 = 360 000; còn 540 000 − 360 000 = 180 000 đồng. Cả lớp tin quỹ còn 200 000 đồng, khi chi tiêu thì thiếu tiền, có thể nghi ngờ thủ quỹ."}, {"t": "Tự tính lại hoặc dùng máy tính cầm tay", "chat": ["Lớp 36 bạn, mỗi bạn góp 15 000 đồng, chi ba lần mỗi lần 120 000 đồng. Quỹ còn bao nhiêu?", "Quỹ lớp còn 200 000 đồng."], "ch": [30, -30, 20], "v": "good", "fb": "Câu 3: 36 × 15 000 = 540 000; 3 × 120 000 = 360 000; quỹ còn 540 000 − 360 000 = 180 000 đồng. Câu trả lời “còn 200 000 đồng” là sai (trừ nhầm). Kiểm chứng bằng tự tính lại hoặc máy tính cầm tay. Kết luận: Sai."}]}, {"n": "Câu hỏi then chốt", "color": "#9b59b6", "task": "Nhóm ghi kết luận cho từng câu. Câu hỏi then chốt: “Bằng chứng nào khiến em tin?” Em chọn câu trả lời nào?", "opts": [{"t": "“Vì trợ lí AI nói chắc chắn.”", "chat": null, "ch": [-20, 35, -20], "v": "bad", "fb": "Câu trả lời “vì trợ lí AI nói chắc chắn” hoặc “vì nghe hợp lí” là chưa có bằng chứng."}, {"t": "“Vì nghe hợp lí.”", "chat": null, "ch": [-15, 30, -15], "v": "bad", "fb": "Câu trả lời “vì nghe hợp lí” là chưa có bằng chứng."}, {"t": "Nêu nguồn cụ thể: trang sách giáo khoa, thông báo của nhà trường, phép tính đã làm lại", "chat": null, "ch": [30, -25, 20], "v": "good", "fb": "Câu trả lời mong đợi nêu được nguồn cụ thể: trang sách giáo khoa, thông báo của nhà trường, phép tính đã làm lại. Bản tin lớp (giả định) có dùng kết quả của trợ lí AI thì cần dòng khai báo theo mẫu năm ý: công cụ là trợ lí AI do GV trình diễn; mục đích là tính quỹ lớp; phần được hỗ trợ là phép tính; cách kiểm chứng là tự tính lại, ghi nhật kí; phần tự làm là viết bản tin. Trong bài này HS không dùng AI để tạo sản phẩm nên không phải khai báo; dòng trên chỉ là ví dụ về bản tin."}]}], "after": "Gợi ý nhận xét nhật kí: ghi nguồn và kết luận cho từng câu; chuỗi hậu quả chỉ ra bước xác thực bị bỏ qua và người bị ảnh hưởng; biết kết luận “chưa đủ thông tin” khi thiếu nguồn. Có nhóm cho rằng câu 3 (phép tính) khó sai nhất, câu 2 khó kiểm tra nhất: mọi dự đoán có lí do đều được chấp nhận; điều quan trọng là ghi trung thực kết quả đối chiếu, kể cả khi dự đoán sai."}, {"type": "match", "tag": "HĐ2.2 • Chuỗi hậu quả", "title": "Chuỗi hậu quả của một câu trả lời sai", "nav": "Chuỗi hậu quả", "icon": "⛓️", "badge": "Người chặn chuỗi sai", "intro": "Nếu lớp trưởng chép nguyên câu trả lời câu 2, câu 3 vào bản tin lớp mà không kiểm tra thì điều gì xảy ra, với ai? Ghép mỗi ô của chuỗi năm ô với nội dung ví dụ (cho câu 3). Lưu ý: câu trả lời nào được đưa vào bản tin lớp phải kèm dòng nhật kí “nguồn, người kiểm tra, kết luận”.", "pairs": [["AI trả lời sai", "Trợ lí AI tính quỹ còn 200 000 đồng."], ["Không ai kiểm tra", "Lớp trưởng không tính lại."], ["Dùng kết quả", "Đăng bản tin “quỹ còn 200 000 đồng”."], ["Hậu quả với ai", "Cả lớp tin nhầm, tranh cãi, nghi ngờ thủ quỹ."], ["Nên kiểm tra ở đâu", "Tự tính lại trước khi đăng; ghi dòng nhật kí."]], "why": "Câu hỏi chuỗi hậu quả. Câu 3: cả lớp tin quỹ còn 200 000 đồng, khi chi tiêu thì thiếu tiền, có thể nghi ngờ thủ quỹ. Câu 2: bản tin đưa thông tin sai về trường; người đọc tin nhầm. Mức Khá, Tốt (kiểm chứng và tư duy phản biện): Khá: ghi nguồn và kết luận cho từng câu; chuỗi hậu quả có người bị ảnh hưởng. Tốt: chỉ ra được bước xác thực bị bỏ qua dẫn tới hậu quả; biết kết luận “chưa đủ thông tin” khi thiếu nguồn."}, {"type": "lab", "tag": "HĐ2.3 • Khi AI quyết định cuối cùng", "title": "Phần mềm tự cho 0 điểm", "nav": "AI quyết định cuối", "icon": "🎚️", "badge": "Người xem xét lại", "intro": "Tình huống (giả định): Một phần mềm luyện tập trực tuyến có tính năng AI theo dõi màn hình, tự động cho 0 điểm nếu HS rời màn hình quá 10 giây, coi là “gian lận”, không ai xem lại. Sau một buổi luyện tập, 12 bạn bị 0 điểm, trong đó: ba bạn bị mất mạng; hai bạn có máy tự tắt; một bạn đứng dậy đóng cửa sổ vì mưa hắt; sáu bạn mở trang khác để tra đáp án. Quy trình X: phần mềm phát hiện → tự cho 0 điểm → gửi kết quả cho phụ huynh. Quy trình Y: phần mềm phát hiện → đánh dấu “cần xem lại” → GV hỏi HS, xem lịch sử kết nối → GV quyết định → nếu HS hoặc phụ huynh không đồng ý thì đề nghị xem xét lại; người xem lại là người không tham gia quyết định trước đó (chẳng hạn GV chủ nhiệm, tổ trưởng chuyên môn), căn cứ lời giải trình và lịch sử kết nối, trả lời cho HS, phụ huynh. Kéo thanh trượt để so sánh hai quy trình.", "sliders": [{"id": "auto", "n": "Mức AI tự quyết định cuối cùng", "min": 0, "max": 100, "val": 100, "unit": "%"}, {"id": "rev", "n": "Mức con người xem xét (hỏi HS, xem lịch sử kết nối)", "min": 0, "max": 100, "val": 0, "unit": "%"}], "outputs": [{"n": "Tỉ lệ bạn bị 0 điểm oan trong số bị đánh dấu", "base": 50, "w": {"auto": 0.2, "rev": -0.4}, "c": 2}, {"n": "Sai sót được phát hiện và sửa", "base": 5, "w": {"rev": 0.85, "auto": -0.05}, "c": 0}, {"n": "Rõ ai chịu trách nhiệm, bạn biết đề nghị xem lại với ai", "base": 5, "w": {"rev": 0.7, "auto": -0.2}, "c": 1}], "insights": [{"id": "auto", "op": ">=", "val": 90, "txt": "Câu 1: 6 trong 12 bạn bị xử lí oan (ba bạn mất mạng, hai bạn máy tự tắt, một bạn đóng cửa sổ vì mưa hắt). Câu 2: các bạn bị điểm sai, bị nghi oan là gian lận; phụ huynh nhận thông tin sai; các bạn mất niềm tin; sai lặp lại ở mọi buổi vì không ai phát hiện."}, {"id": "rev", "op": "<=", "val": 10, "txt": "Câu 3: với quy trình X không rõ ai chịu trách nhiệm, HS không biết đề nghị xem lại với ai; đây chính là tác hại khi giao quyết định cuối cùng cho AI. Phần mềm không chịu trách nhiệm được; người quyết định dùng phần mềm theo cách tự cho điểm và GV phụ trách phải chịu trách nhiệm, vì vậy GV cần giữ quyết định cuối cùng như ở quy trình Y."}, {"id": "rev", "op": ">=", "val": 70, "txt": "Câu 4: phần mềm vẫn giúp phát hiện nhanh, nhưng GV xem lại nên chỉ sáu bạn thật sự tra đáp án bị nhắc nhở; sáu bạn còn lại được giữ điểm và được giải thích. Với quy trình Y, người xem xét lại (không phải người đã quyết định) dựa vào lời giải trình, lịch sử kết nối và trả lời cho HS, phụ huynh."}, {"id": "auto", "op": "<=", "val": 30, "txt": "AI phát hiện, gợi ý; con người xem xét, quyết định và xem xét lại. Gợi ý cho nhóm xong sớm (thêm một bước kiểm tra cho quy trình Y): chẳng hạn phần mềm hiện thông báo cho HS biết khi bị đánh dấu để HS ghi lí do ngay."}]}, {"type": "order", "tag": "HĐ2.3 • Sơ đồ nguyên nhân, hậu quả", "title": "Sơ đồ của quy trình X", "nav": "Sơ đồ quy trình X", "icon": "🧩", "badge": "Người vẽ sơ đồ", "intro": "Sắp xếp sáu ô của sơ đồ nguyên nhân, hậu quả của quy trình X theo thứ tự (1) → (6). Đây là minh chứng cá nhân (Phiếu học tập số 5, câu 1): nêu hai tác hại, với mỗi tác hại ghi vì sao xảy ra và ai bị ảnh hưởng.", "items": ["(1) Phần mềm tự quyết định: Phần mềm tự cho 0 điểm khi HS rời màn hình quá 10 giây.", "(2) Nguyên nhân bị đánh dấu: Mất mạng, máy tự tắt, đóng cửa sổ vì mưa hắt, tra đáp án.", "(3) Kết quả: 12 bạn bị 0 điểm.", "(4) Tác hại với ai: Sáu bạn bị nghi oan là gian lận; phụ huynh nhận thông tin sai.", "(5) Ai chịu trách nhiệm, đề nghị xem lại với ai: Không rõ ai chịu trách nhiệm; không có chỗ đề nghị xem lại.", "(6) Điểm con người xem xét và xem xét lại: GV hỏi HS, xem lịch sử kết nối trước khi quyết định; người xem xét lại không phải người đã quyết định."], "why": "Đáp án câu 1 Phiếu học tập số 5 (mức đạt: nêu được hai tác hại; mỗi tác hại có nguyên nhân gắn với cách phần mềm tự quyết định và người bị ảnh hưởng cụ thể). Tác hại: Bị điểm 0 oan, bị nghi là gian lận. Vì sao: Phần mềm chỉ dựa vào việc rời màn hình, không biết lí do (mất mạng, máy tắt, mưa hắt) và không ai xem lại. Ai: Sáu bạn không gian lận. Tác hại: Phụ huynh nhận thông tin sai. Vì sao: Kết quả gửi thẳng cho phụ huynh, không qua GV. Ai: Phụ huynh và các bạn bị 0 điểm oan. Tác hại: Sai lặp lại ở mọi buổi. Vì sao: Không ai phát hiện, không ai sửa cách phần mềm cho điểm. Ai: Mọi HS dùng phần mềm. Tác hại: Không biết đề nghị xem lại với ai. Vì sao: Quy trình không có người chịu trách nhiệm, không có bước xem xét lại. Ai: Các bạn bị 0 điểm oan. Chưa thấy minh chứng: chỉ nêu “phần mềm sai”, “các bạn buồn” mà không có nguyên nhân hoặc thiếu người bị ảnh hưởng. Câu hỏi (1) ở mục b): Ai chịu trách nhiệm khi phần mềm cho 0 điểm oan? Câu hỏi (2): Người xem xét lại cần là ai và dựa vào bằng chứng gì? Người không tham gia quyết định trước đó (chẳng hạn GV chủ nhiệm, tổ trưởng chuyên môn); dựa vào lời giải trình của HS và lịch sử kết nối; trả lời cho HS, phụ huynh. Mức Khá: hai tác hại khác nhau, không lặp ý; nguyên nhân của mỗi tác hại nối được với việc không có bước con người xem xét (phần mềm không biết lí do mất mạng, máy tắt và không ai xem lại). Mức Tốt: chỉ ra được chuỗi từ cách phần mềm tự quyết định tới tác hại; nêu được bước con người xem xét lại sẽ ngăn tác hại đó thế nào."}, {"type": "story", "tag": "HĐ3 • Luyện tập", "title": "Hội đồng câu lạc bộ ra quyết định", "nav": "Hội đồng CLB", "icon": "🏛️", "badge": "Hội đồng công tâm", "intro": "Em là thành viên hội đồng câu lạc bộ Robot. Hội đồng xem lại danh sách ứng dụng AI đề xuất (An, Hà, Bình) cùng thông tin bổ sung (giả định) rồi ra quyết định. Thông tin bổ sung: Chi: nhà không có máy tính, thường ở lại phòng máy của trường; Giang: nghỉ ốm ba tuần nên điểm Tin học kì này thấp, nhưng robot tự làm của bạn đạt giải cuộc thi của trường; An: đã tham gia hai câu lạc bộ khác, ít thời gian. Chấp nhận quyết định khác nhau, kể cả “chưa đủ thông tin, cần hỏi thêm” nếu ghi rõ còn thiếu gì, hỏi ai.", "app": "📋 Biên bản hội đồng (mô phỏng)", "hello": "Hồ sơ đã có Điểm AI. Hội đồng cần bổ sung dữ liệu còn thiếu rồi mới quyết định.", "meters": [{"n": "Công bằng với các bạn", "b": 40, "c": 0}, {"n": "Quyết định có căn cứ", "b": 40, "c": 1}, {"n": "Rủi ro bỏ sót người phù hợp", "b": 50, "c": 2}], "chars": [{"n": "Chi", "color": "#ff6b9d", "task": "Chi: nhà không có máy tính, thường ở lại phòng máy của trường; điểm Tin học 9,0. Hội đồng làm gì?", "opts": [{"t": "Giữ nguyên danh sách AI vì Điểm AI của Chi thấp", "chat": null, "ch": [-30, -20, 35], "v": "bad", "fb": "Điểm AI thấp chỉ vì Chi ít dùng máy ở nhà, không vì Chi kém. Giữ nguyên danh sách thì Chi, Giang bị loại vì hoàn cảnh, không phải vì năng lực."}, {"t": "Bỏ yếu tố “giờ dùng máy ở nhà”, xem lại hồ sơ của Chi cùng cả sáu bạn", "chat": null, "ch": [35, 30, -30], "v": "good", "fb": "Đúng. Dữ liệu AI đã dùng: điểm Tin học và giờ dùng máy ở nhà. Tiêu chí giờ dùng máy ở nhà chưa công bằng vì đo điều kiện gia đình, không đo năng lực. Chi không có máy ở nhà nhưng hay ở lại phòng máy. Hội đồng xét hoàn cảnh, không chê bai gia đình các bạn. Chi tiết: công thức cộng 1,2 điểm cho mỗi giờ dùng máy ở nhà; Chi 9,0 điểm Tin học nhưng chỉ hai giờ dùng máy mỗi tuần."}]}, {"n": "Giang", "color": "#4aa3ff", "task": "Giang nghỉ ốm ba tuần nên điểm Tin học kì này thấp, nhưng robot tự làm của bạn đạt giải cuộc thi của trường. Hội đồng làm gì?", "opts": [{"t": "Chỉ dựa vào điểm Tin học kì này", "chat": null, "ch": [-25, -20, 30], "v": "bad", "fb": "Điểm thấp có lí do chính đáng. Bỏ qua robot đạt giải là bỏ qua bằng chứng năng lực quan trọng."}, {"t": "Ghi nhận lí do nghỉ ốm và sản phẩm đạt giải, đưa vào cân nhắc", "chat": null, "ch": [30, 30, -25], "v": "good", "fb": "Đúng. Giang nghỉ ốm nên điểm thấp nhưng có robot đạt giải. Con người xem xét được hoàn cảnh và thành tích mà dữ liệu của AI chưa có."}, {"t": "Chưa đủ thông tin: hỏi thêm thầy cô phụ trách về robot và kết quả học tập", "chat": null, "ch": [20, 25, -10], "v": "good", "fb": "“Chưa đủ thông tin” cũng là kết luận có trách nhiệm: cần hỏi Giang về thời gian tham gia, hỏi An có muốn rút không. Chấp nhận vì nêu rõ còn thiếu gì, hỏi ai."}]}, {"n": "An", "color": "#2ecc71", "task": "An đã tham gia hai câu lạc bộ khác, ít thời gian. Hội đồng và bạn không được chọn có quyền phản hồi thế nào?", "opts": [{"t": "Hỏi An còn đủ thời gian không; thông báo lí do cho các bạn không được chọn và cho phép phản hồi, xem xét lại", "chat": null, "ch": [30, 30, -20], "v": "good", "fb": "Đúng. Ban chủ nhiệm công bố tiêu chí, dữ liệu đã dùng và nhận phản hồi trong ba ngày; An chưa được chọn vì đã tham gia hai câu lạc bộ khác, ít thời gian; hội đồng báo lí do cho An, An có thể phản hồi trong ba ngày. Ban chủ nhiệm câu lạc bộ chịu trách nhiệm; một thầy cô không tham gia chấm xem xét lại các phản hồi."}, {"t": "Chọn An vì Điểm AI cao nhất, không cần hỏi thêm", "chat": null, "ch": [-20, -25, 25], "v": "bad", "fb": "An có thể không đủ thời gian tham gia; dữ liệu của AI không biết điều này."}, {"t": "Công bố danh sách, không giải thích lí do", "chat": null, "ch": [-25, -15, 20], "v": "mid", "fb": "Quyết định đúng người nhưng bạn không được chọn không biết lí do, không có quyền phản hồi, dễ thấy bất công."}]}, {"n": "Quyết định cuối", "color": "#e67e22", "task": "Dòng 3 biên bản: ai bị thiệt nếu giữ nguyên danh sách AI đề xuất? Hội đồng ra quyết định cuối thế nào?", "opts": [{"t": "Chọn Chi (điểm Tin 9,0, bỏ tiêu chí giờ dùng máy ở nhà), Giang (có sản phẩm robot đạt giải), Hà (điểm Tin 8,8); báo lí do cho An", "chat": null, "ch": [35, 35, -30], "v": "good", "fb": "Quyết định và lí do: chọn Chi (điểm Tin 9,0, bỏ tiêu chí giờ dùng máy ở nhà), Giang (có sản phẩm robot đạt giải), Hà (điểm Tin 8,8). An chưa được chọn vì đã tham gia hai câu lạc bộ khác, ít thời gian. Mọi quyết định khác có lí do đều được chấp nhận."}, {"t": "Chưa đủ thông tin: cần hỏi Giang về thời gian tham gia, hỏi An có muốn rút không", "chat": null, "ch": [20, 25, -10], "v": "good", "fb": "Chấp nhận vì nêu rõ còn thiếu gì, hỏi ai. Điều gì có thể làm kết luận thay đổi? Chẳng hạn: Giang không có thời gian tham gia; An xin rút khỏi một câu lạc bộ khác; Chi không muốn tham gia; câu lạc bộ có thêm suất."}, {"t": "Để danh sách AI đề xuất thành quyết định cuối cùng", "chat": null, "ch": [-35, -30, 35], "v": "bad", "fb": "Nếu để danh sách AI đề xuất thành quyết định cuối cùng thì Chi, Giang bị loại vì tiêu chí chưa công bằng và dữ liệu thiếu; không ai giải thích cho các bạn; không rõ ai chịu trách nhiệm, các bạn không biết phản hồi ở đâu."}]}], "after": "Gợi ý cho nhóm xong sớm (bộ tiêu chí mới cho năm sau): điểm Tin học; sản phẩm hoặc bài thử làm tại phòng máy của trường; thời gian có thể tham gia; bỏ giờ dùng máy ở nhà."}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Biên bản hội đồng câu lạc bộ", "nav": "Biên bản hội đồng", "icon": "📝", "badge": "Thư kí hội đồng", "intro": "Hoàn thành Phiếu học tập số 4: biên bản hội đồng câu lạc bộ Robot (dùng hồ sơ ở HĐ1 và thông tin bổ sung). Sau đó làm Phiếu học tập số 5, câu 2: đầu tiết 1 em đã dự đoán có nên để ứng dụng tự chọn ba bạn vào câu lạc bộ Robot không; bây giờ ý kiến của em là gì? Vì sao con người cần giữ quyền quyết định trong việc này?", "fields": [{"id": "a", "label": "1. Dữ liệu AI đã dùng (tiêu chí nào)? Có công bằng không?", "hint": "Nêu tiêu chí và nhận xét công bằng", "ph": "VD: Điểm Tin học và giờ dùng máy ở nhà..."}, {"id": "b", "label": "2. Dữ liệu còn thiếu: hoàn cảnh nào AI không biết?", "hint": "Từng bạn", "
