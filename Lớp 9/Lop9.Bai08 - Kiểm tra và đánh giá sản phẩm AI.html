<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 8. Kiểm tra và đánh giá sản phẩm AI – Lớp 9</title>
<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>

<script>
const SPEC={"icon": "♻️", "title": "Bài 8. Kiểm tra và đánh giá sản phẩm AI – Lớp 9", "ainote": "Thẻ là dữ liệu giả lập. HS đánh dấu đúng, sai theo loại rác thật, không sửa để máy có vẻ tốt hơn. Trong phần mô tả dữ liệu thử, chỉ ghi loại ảnh, loại câu hỏi; không dùng ảnh, tên thật của mình và của bạn, nhất là với tình huống điểm danh bằng khuôn mặt. Ca 1 là tình huống nhạy cảm: nói về màu da bằng ngôn ngữ trung tính, không quy kết cho nhóm người nào. Người quyết định có dùng sản phẩm là con người.", "takeaways": ["Mức tự tin do hệ thống ước tính chưa phải bằng chứng máy đúng; con người đối chiếu với thực tế, đặt tiêu chí và quyết định có dùng sản phẩm hay không.", "Kiểm tra mô hình nhận dạng phải dùng dữ liệu mới chưa dùng khi huấn luyện; máy đúng trên dữ liệu đã học chưa cho biết máy dùng được ngoài thực tế. Dữ liệu mới không có nghĩa máy chắc chắn sai.", "Theo Hình 1: thu thập dữ liệu mới chưa dùng khi huấn luyện; thử; ghi đúng, sai hoặc phù hợp, chưa phù hợp; đưa ra nhận xét có căn cứ. Với chatbot, đặt nhiều câu hỏi khác nhau về cùng một nội dung, ghi câu trả lời phù hợp hay chưa phù hợp.", "Máy đúng 3 trên 3 thẻ đã học nhưng chỉ 1 trên 3 thẻ mới, nên chưa dùng được với rác mới. Tiêu chí đánh giá cần gồm cả những trường hợp dễ nhầm, ít gặp; kiểm tra càng đủ loại trường hợp thì nhận xét càng có căn cứ, nhưng vẫn không bảo đảm máy đúng trong mọi trường hợp.", "Trước khi tin hay dùng một sản phẩm AI, cần thử bằng dữ liệu mới hoặc nhiều câu hỏi khác nhau, đếm số lần đúng, sai và để con người đối chiếu, quyết định. Mức tự tin 98% do hệ thống ước tính, không thay cho việc kiểm tra."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Con số 98% có đáng tin?", "nav": "98% có đáng tin?", "icon": "♻️", "badge": "Người hoài nghi có căn cứ", "intro": "Trong một buổi học về phân loại rác, lớp được giới thiệu một máy phân loại rác dùng AI (giả định). Máy tự gắn nhãn cho từng loại rác, kèm mức độ tự tin. Với một vỏ hộp sữa giấy tráng nhôm, máy gắn nhãn “Rác hữu cơ ợc với rác mới. Máy hay nhầm vật không phải rác hữu cơ (hộp sữa giấy, túi nilon) thành rác hữu cơ. Đếm chung 4 trên 6 che mất việc máy đúng hết với rác đã học nhưng sai nhiều với rác mới; phải đếm riêng hai nhóm thẻ."}, {"id": "hard", "op": ">=", "val": 50, "txt": "Thử với những loại rác dễ nhầm (hộp sữa giấy nhiều lớp, túi nilon màu tối) và loại ít gặp; đếm riêng số lần đúng theo từng loại rác để biết máy yếu ở loại nào. Thử thêm ảnh chụp thiếu sáng, chụp xa, rác bị bẩn, bẹp, méo và ghi riêng kết quả của từng điều kiện. Vẫn không bảo đảm máy đúng trong mọi trường hợp."}, {"id": "conf", "op": ">=", "val": 90, "txt": "Mức tự tin cao do máy ước tính không làm bằng chứng tăng lên: con người đối chiếu đầu ra với loại rác thật, không dựa vào mức tự tin máy hiển thị."}]}, {"type": "quiz", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Nhận xét và tiêu chí đánh giá", "nav": "Tiêu chí đánh giá", "icon": "🧪", "badge": "Người đặt tiêu chí", "intro": "Đọc kết quả kiểm tra rồi rút ra tiêu chí đánh giá (phần 3). Nhận xét phải dẫn số lần đúng, sai đã đếm; ví dụ mẫu tiêu chí: Kiểm tra với ảnh rác chưa dùng khi huấn luyện, đếm số lần máy đoán đúng, sai.", "qs": [{"q": "Con số đếm trên nhóm thẻ nào cho biết máy có dùng được ngoài thực tế hay không?", "opts": ["Thẻ đã dùng khi huấn luyện (3 trên 3)", "Thẻ chưa dùng khi huấn luyện (1 trên 3)", "Số đếm chung của cả sáu thẻ (4 trên 6)"], "a": 1, "why": "Con số đếm trên thẻ chưa dùng khi huấn luyện (1 trên 3). Máy đúng hết với rác đã học nhưng chỉ đúng 1 trên 3 với rác mới, nên chưa dùng được với rác mới."}, {"q": "“Đếm chung 4 trên 6 thì có thấy máy yếu ở đâu không?”", "opts": ["Có, thấy ngay máy yếu ở rác mới", "Không thấy: đếm chung che mất chỗ yếu, phải đếm riêng hai nhóm thẻ", "Không cần đếm vì máy tự tin 98%"], "a": 1, "why": "Không thấy. Đếm chung che mất việc máy đúng hết với rác đã học nhưng sai nhiều với rác mới; phải đếm riêng hai nhóm thẻ."}, {"q": "Chọn các tiêu chí đánh giá hợp lí (chọn nhiều đáp án).", "opts": ["Thử với những loại rác dễ nhầm (hộp sữa giấy nhiều lớp, túi nilon màu tối) và loại ít gặp", "Đếm riêng số lần đúng theo từng loại rác để biết máy yếu ở loại nào", "Con người đối chiếu đầu ra với loại rác thật, không dựa vào mức tự tin máy hiển thị", "Chép lại ví dụ mẫu: kiểm tra với ảnh chưa dùng khi huấn luyện, đếm đúng, sai"], "a": [0, 1, 2], "why": "Ba tiêu chí này đều là việc kiểm tra cụ thể; chấp nhận hai tiêu chí bất kì có lí do; tiêu chí chép lại ví dụ mẫu trên phiếu không tính."}, {"q": "Với một chatbot, em kiểm tra bằng cách nào và ghi kết quả ra sao?", "opts": ["Hỏi một câu rồi tin kết quả", "Đặt nhiều câu hỏi khác nhau về cùng một nội dung, đối chiếu từng câu trả lời với tư liệu tin cậy, ghi phù hợp hay chưa phù hợp rồi đếm", "Chỉ xem chatbot tự tin đến mức nào"], "a": 1, "why": "Minh hoạ bằng hàng “Chatbot lịch sử”: cùng hỏi về một sự kiện của địa phương theo ba cách; chatbot trả lời khác nhau hoặc sai ngày tháng thì ghi “chưa phù hợp”."}, {"q": "Tại sao cần dữ liệu mới để kiểm tra sản phẩm AI? (Hình 2)", "opts": ["Vì máy đã học dữ liệu cũ, đúng trên dữ liệu cũ chưa cho biết máy làm được với dữ liệu mới gặp ngoài thực tế", "Để máy chạy nhanh hơn", "Để máy có mức tự tin cao hơn"], "a": 0, "why": "Máy đã học dữ liệu cũ nên đúng trên dữ liệu cũ chưa cho biết máy làm được với dữ liệu mới gặp ngoài thực tế."}, {"q": "Quy trình Hình 1 đúng là gì?", "opts": ["Thu thập dữ liệu mới chưa dùng khi huấn luyện; thử; ghi đúng, sai hoặc phù hợp, chưa phù hợp; đưa ra nhận xét có căn cứ", "Hỏi máy có tự tin không; tin; kết luận", "Chọn ảnh máy đã học; thử; kết luận máy tốt"], "a": 0, "why": "Con người kiểm soát và quyết định cuối cùng. Phần “đề xuất cải tiến” ở bước 4 là việc tự chọn; bước 4 là “Đưa ra nhận xét có căn cứ”."}]}, {"type": "match", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Bảng Đầu vào, Xử lí, Đầu ra", "nav": "Điểm cần kiểm tra", "icon": "🔗", "badge": "Người ghép bảng", "intro": "Ghép tình huống (dữ liệu hệ thống nhận, đầu ra của hệ thống AI) với điểm con người cần kiểm tra.", "pairs": [["Phân loại rác: hình ảnh vỏ hộp sữa giấy; đầu ra: Rác hữu cơ", "Đối chiếu với loại rác thật"], ["Nhận diện khuôn mặt: hình ảnh HS trong lớp; đầu ra: không nhận diện được khi ánh sáng yếu", "Điều kiện ánh sáng; máy có nhận đúng với mọi HS không"], ["Chatbot lịch sử: câu hỏi về sự kiện lịch sử địa phương; đầu ra: trả lời không chính xác", "Đối chiếu với tư liệu lịch sử địa phương tin cậy"], ["Mức tự tin 98% do máy hiển thị", "Do hệ thống ước tính, chưa phải bằng chứng máy đúng; con người đối chiếu và quyết định"]], "why": "Bảng Đầu vào, Xử lí, Đầu ra: hàng “Chatbot lịch sử” dùng để minh hoạ cách kiểm tra chatbot."}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Bằng chứng và loại lỗi của hai ca", "nav": "Bằng chứng & loại lỗi", "icon": "🔎", "badge": "Người tìm bằng chứng", "intro": "Ca 1. Một sản phẩm AI nhận diện khuôn mặt để điểm danh trong lớp học. Khi thử ở nơi ánh sáng yếu, sản phẩm không nhận diện được một số HS có nước da tối màu. Ca 2. Một chatbot hỗ trợ học tập trả lời câu hỏi về lịch sử. Khi được hỏi về các sự kiện lịch sử địa phương, chatbot trả lời không chính xác hoặc không có thông tin. Hai ca đều là giả định. Chi tiết nào trong mô tả là bằng chứng sản phẩm chưa đạt? Xếp mỗi chi tiết vào loại lỗi có thể gặp. Lỗi thuật toán, quy tắc xử lí: mô tả của cả hai ca chưa có bằng chứng; nhóm đánh dấu ô này phải nêu được bằng chứng.", "cats": ["Lỗi đầu vào", "Lỗi dữ liệu huấn luyện", "Lỗi thuật toán, quy tắc xử lí"], "cards": [{"t": "Ca 1: “khi thử ở nơi ánh sáng yếu” (ảnh chụp thiếu sáng)", "g": [0, 1], "why": "Lỗi đầu vào (ảnh chụp thiếu sáng) hoặc lỗi dữ liệu huấn luyện (thiếu ảnh chụp ở nơi ánh sáng yếu); chấp nhận cả hai nếu nhóm nêu được bằng chứng. Kiểm tra thêm: thử với nhiều ảnh mới ở các điều kiện ánh sáng khác nhau (sáng, tối, ngược sáng), đếm số lần nhận đúng theo từng điều kiện."}, {"t": "Ca 1: “không nhận diện được một số HS có nước da tối màu”", "g": [1, 0], "why": "Lỗi dữ liệu huấn luyện (thiếu ảnh người có màu da khác nhau). Thử thêm ảnh của nhiều người có màu da khác nhau để biết máy yếu do ánh sáng, do dữ liệu hay cả hai. Khắc phục (tự chọn): bổ sung dữ liệu huấn luyện với các điều kiện ánh sáng và màu da khác nhau; tăng ánh sáng nơi điểm danh; người phụ trách kiểm tra lại các trường hợp máy không nhận ra."}, {"t": "Ca 2: “trả lời không chính xác hoặc không có thông tin” khi hỏi về lịch sử địa phương", "g": [1], "why": "Lỗi dữ liệu huấn luyện (thiếu thông tin lịch sử địa phương). Kiểm tra thêm: hỏi cùng một sự kiện theo ba cách khác nhau và hỏi thêm nhiều sự kiện địa phương; đối chiếu từng câu trả lời với tư liệu lịch sử địa phương tin cậy; ghi phù hợp, chưa phù hợp rồi đếm. Khắc phục (tự chọn): bổ sung tư liệu lịch sử địa phương tin cậy cho chatbot; nhắc người dùng đối chiếu với tư liệu tin cậy."}, {"t": "Ca 2: nhóm nghi câu hỏi chưa rõ nên hỏi lại rõ hơn theo nhiều cách, nhưng chatbot vẫn trả lời sai", "g": [1], "why": "Với Ca 2, nhóm nghi lỗi đầu vào (câu hỏi chưa rõ) thì cách kiểm tra thêm là hỏi lại rõ hơn theo nhiều cách; câu trả lời vẫn sai thì không phải lỗi đầu vào. Nếu chatbot trả lời mỗi lần một khác hoặc đều sai, đó là bằng chứng chatbot chưa có thông tin đáng tin về nội dung này."}], "pass": 0.7}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Phiếu học tập số 2 – Bằng chứng và cách kiểm tra thêm", "nav": "Phiếu số 2", "icon": "📒", "badge": "Người kiểm tra thêm", "intro": "Với mỗi ca, khoanh chi tiết cho thấy sản phẩm chưa đạt, đánh dấu loại lỗi có thể gặp, ghi bằng chứng và cách kiểm tra thêm để biết chắc sản phẩm yếu ở đâu (thử bằng gì, ghi kết quả thế nào). Cột “Cách khắc phục” và câu hỏi mở rộng là phần tự chọn, không dùng để đánh giá. Cần thử thêm những gì để biết chắc sản phẩm yếu ở đâu? Gợi ý nếu gặp khó (làm Ca 2 trước): “Hỏi cùng một nội dung theo ba cách khác nhau thì sao?”", "fields": [{"id": "a", "label": "Ca 1 (nhận diện khuôn mặt): loại lỗi có thể gặp và bằng chứng lấy từ mô tả", "ph": "Trích chi tiết trong mô tả"}, {"id": "b", "label": "Ca 1: cách kiểm tra thêm để chắc chắn (thử bằng gì, ghi kết quả thế nào)", "ph": "Ảnh mới ở nhiều điều kiện..."}, {"id": "c", "label": "Ca 2 (chatbot lịch sử): loại lỗi có thể gặp và bằng chứng lấy từ mô tả", "ph": "Trích chi tiết trong mô tả"}, {"id": "d", "label": "Ca 2: cách kiểm tra thêm để chắc chắn (thử bằng gì, ghi kết quả thế nào)", "ph": "Nhiều câu hỏi khác nhau..."}, {"id": "e", "label": "Cách khắc phục (tự chọn) và câu hỏi mở rộng: làm thế nào để cải thiện khả năng của sản phẩm AI trong các trường hợp đặc biệt?", "ph": "Nếu AI phân loại sai, các em sẽ làm gì để cải thiện?"}], "checks": ["Mỗi ca có ít nhất một bằng chứng lấy từ mô tả (không phải suy đoán).", "Mỗi ca có một cách kiểm tra thêm nói rõ thử bằng gì, ghi kết quả thế nào (không chỉ ghi “kiểm tra lại”).", "Kết quả thử cho thấy chỗ yếu; con người mới quyết định có đưa sản phẩm vào dùng hay không.", "Mức Khá (Kiểm chứng): chỉ ra bằng chứng cụ thể cho thấy đầu ra đúng hay sai. Mức Tốt: nêu được điều gì làm kết luận thay đổi (thử thêm loại dữ liệu nào).", "Mức Khá (Hợp tác): làm đúng vai trong nhóm; sửa bài của mình bằng bút khác màu. Mức Tốt: điều phối thảo luận, phản biện lịch sự có căn cứ."], "sample": "Ca 1: Chi tiết bằng chứng: “khi thử ở nơi ánh sáng yếu”; “không nhận diện được một số HS có nước da tối màu”. Cách kiểm tra thêm: thử với nhiều ảnh mới ở các điều kiện ánh sáng khác nhau (sáng, tối, ngược sáng), của nhiều người có màu da khác nhau; đếm số lần nhận đúng theo từng điều kiện để biết máy yếu do ánh sáng, do dữ liệu hay cả hai. Ca 2: Bằng chứng: “trả lời không chính xác hoặc không có thông tin” khi hỏi về lịch sử địa phương. Cách kiểm tra thêm: hỏi cùng một sự kiện theo ba cách khác nhau và hỏi thêm nhiều sự kiện địa phương; đối chiếu từng câu trả lời với tư liệu lịch sử địa phương tin cậy; ghi phù hợp, chưa phù hợp rồi đếm. Câu hỏi mở rộng (tự chọn): bổ sung dữ liệu huấn luyện đa dạng hơn, nhất là các trường hợp ít gặp, dễ nhầm; sau khi bổ sung phải thử lại bằng cùng bộ dữ liệu kiểm tra để so sánh. Đây là nội dung mở rộng của chủ đề, không thuộc YCCĐ 9.D2.1."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu học tập số 3 – Kiểm tra một sản phẩm AI gần gũi", "nav": "Phiếu số 3", "icon": "📋", "badge": "Người lập kế hoạch kiểm tra", "intro": "Lưu ý an toàn: ngoài dòng họ tên, em chỉ mô tả loại ảnh, loại câu hỏi cần thử; không ghi tên, không dán ảnh thật của mình, của bạn, không ghi thông tin riêng. Mục 4: một máy phân loại rác (giả định) được thử với 10 ảnh rác mới chưa dùng khi huấn luyện: máy đoán đúng bảy ảnh, sai ba ảnh; cả ba ảnh sai đều là túi nilon. Em nhận xét gì về máy này? Em dựa vào số liệu nào? Câu hỏi then chốt: Sau bài học, có nên tin ngay kết quả 98% ở HĐ 1 không? Cần kiểm tra gì trước?", "fields": [{"id": "a", "label": "1. Chọn một tình huống gần gũi", "opts": ["Gợi ý A: Máy dùng AI để phân loại rác trong trường học", "Gợi ý B: Chatbot hỗ trợ học tập trả lời câu hỏi về lịch sử", "Gợi ý C: Máy dùng AI nhận diện khuôn mặt để điểm danh trong lớp học (chỉ mô tả loại ảnh cần thử)"]}, {"id": "b", "label": "2. Tiêu chí kiểm tra; dữ liệu mới (hoặc các câu hỏi khác nhau) dùng để thử; cách ghi kết quả (đếm số lần đúng, sai hoặc phù hợp, chưa phù hợp)", "ph": "Tiêu chí là một việc kiểm tra cụ thể..."}, {"id": "c", "label": "3. Vì sao không dùng những ảnh (câu hỏi) máy đã được học để kiểm tra?", "ph": "Máy đã học những ảnh đó nên..."}, {"id": "d", "label": "4. Nhận xét về máy đúng 7 trên 10 ảnh mới, sai 3 ảnh đều là túi nilon; em dựa vào số liệu nào?", "ph": "Dẫn số liệu"}, {"id": "e", "label": "5. Khâu con người phải kiểm tra: nếu con người không kiểm tra khâu …… thì có nguy cơ …… Cách em kiểm tra lại: ……", "ph": "Nêu khâu, nguy cơ, cách kiểm tra lại"}], "checks": ["Mục 2: tiêu chí là một việc kiểm tra cụ thể; dữ liệu thử là dữ liệu mới chưa dùng khi huấn luyện, có cả trường hợp dễ nhầm (với chatbot là nhiều câu hỏi khác nhau về cùng nội dung); cách ghi là đánh dấu đúng, sai (phù hợp, chưa phù hợp) cho từng lần thử rồi đếm.", "Mục 3: nêu rõ máy đã học những ảnh (câu hỏi) đó nên đoán đúng không cho biết máy làm được với dữ liệu mới ngoài đời; không chỉ ghi “để chính xác hơn”.", "Mục 4: nhận xét dẫn số liệu (đúng 7 trên 10, ba lần sai đều là túi nilon); không chỉ ghi “máy khá tốt”.", "Mục 5: nêu một khâu cụ thể con người phải kiểm tra, nguy cơ nếu bỏ qua và cách kiểm tra lại; dữ liệu thử chỉ mô tả bằng loại ảnh, loại câu hỏi, không dùng tên, ảnh thật.", "Mức Khá: tiêu chí, dữ liệu thử và cách ghi khớp với sản phẩm đã chọn; giải thích rõ vì sao phải dùng dữ liệu mới; nhận xét dẫn đúng số liệu; nêu được khâu con người phải đối chiếu và nguy cơ nếu bỏ qua. Mức Tốt: dữ liệu thử có chủ đích cả trường hợp dễ nhầm, ít gặp; nhận xét chỉ ra máy yếu ở loại nào, nêu việc cần thử thêm, không coi kết quả kiểm tra là bảo đảm máy đúng mọi trường hợp; nêu được tác động khi sản phẩm sai với một nhóm người hoặc làm lộ dữ liệu cá nhân; cách kiểm tra lại khả thi, có người chịu trách nhiệm cụ thể."], "sample": "Mục 1: Gợi ý A, máy dùng AI để phân loại rác trong trường học. Mục 2: Tiêu chí: máy xếp đúng loại rác, cả với rác máy chưa học. Dữ liệu mới: 10 ảnh rác chưa dùng khi huấn luyện, có hộp sữa giấy, túi nilon màu tối, vỏ trái cây. Cách ghi: mỗi ảnh ghi loại rác thật, máy đoán, đúng hay sai; cuối cùng đếm số lần đúng, sai. Mục 3: Máy đã học những ảnh đó rồi nên đoán đúng là dễ; em cần biết máy làm được với rác mới ngoài đời. Mục 4: Máy đúng 7 trên 10 ảnh nhưng sai cả ba ảnh túi nilon, nên chưa tin được máy với túi nilon. Cần thử thêm nhiều ảnh túi nilon; trong lúc đó người phụ trách kiểm tra lại các túi nilon. Mục 5: Nếu con người không kiểm tra khâu phân loại rác mới thì có nguy cơ rác bị xếp sai loại và gây ô nhiễm. Cách em kiểm tra lại: thử thêm 10 ảnh rác mới chưa dùng khi huấn luyện, đếm số lần đúng, sai; người phụ trách đối chiếu trước khi đổ rác. Gợi ý B (chatbot lịch sử): tiêu chí là câu trả lời chính xác, phù hợp với lứa tuổi; câu hỏi thử là cùng một sự kiện lịch sử địa phương hỏi theo ba cách và năm sự kiện khác nhau; đối chiếu với sách, tư liệu lịch sử địa phương, ghi phù hợp hoặc chưa phù hợp rồi đếm. Gợi ý C (điểm danh bằng khuôn mặt): tiêu chí là máy nhận đúng mọi HS ở mọi điều kiện ánh sáng; dữ liệu thử mô tả bằng lời (ảnh chụp ở nơi sáng, nơi tối, ngược sáng, đeo kính, đội mũ), không dùng ảnh thật của bạn; đếm số lần nhận đúng, sai theo từng điều kiện. Trả lời câu hỏi then chốt: Không nên. Cần thử máy bằng dữ liệu mới chưa dùng khi huấn luyện, đếm số lần đúng, sai và để con người đối chiếu với loại rác thật. Bảng góp ý mẫu của bạn cùng bàn: “Mục 2 đã rõ. Bạn nên ghi cụ thể hơn loại rác nào là rác máy chưa học.” “Mục 5 cần bổ sung: bạn ghi rõ ai kiểm tra lại và kiểm tra lúc nào.” Mẫu nhận xét của GV: “Em đã chọn đúng dữ liệu mới để thử và biết đếm số lần đúng, sai. Nhận xét ở mục 4 còn chung. Em thử ghi rõ máy sai với loại rác nào và dựa vào con số nào.” — “Em giải thích rõ vì sao phải thử bằng ảnh máy chưa học. Dữ liệu thử chưa có trường hợp dễ nhầm. Lần sau em thêm một, hai loại rác máy dễ nhầm nhất.” — “Em nêu được máy yếu với túi nilon và việc cần thử thêm. Em có thể ghi rõ ai kiểm tra lại. Em thử nghĩ: kết quả thử thêm thế nào thì em mới tin máy?”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 9 • Môn đảm nhiệm: Toán • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

function confetti(){const c=$('#confetti');c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d');const P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*4,s:5+Math.random()*7,c:['#ff8a2b','#2ecc71','#4aa3ff','#f6c744','#ef5350'][Math.random()*5|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<140)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
