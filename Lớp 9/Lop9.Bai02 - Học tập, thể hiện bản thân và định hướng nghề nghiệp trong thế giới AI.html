<style>
:root{--o:#2980b9;--od:#1e608a;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}

.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}

.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}

.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}

select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🧭", "title": "Bài 2. Học tập, thể hiện bản thân và định hướng nghề nghiệp trong thế giới AI – Lớp 9", "ainote": "Tin tuyển dụng, nhân vật và thẻ nghề đều là giả định; em tự quyết định năng lực, mục tiêu và phần giao cho AI. Ở nhà chỉ dùng công cụ nhà trường đã rà soát, có người lớn đồng ý và giám sát; không có điều kiện thì làm theo dòng “Nếu không dùng AI…”. Không nêu tên bạn, thông tin gia đình; kể nghề người thân không nêu tên, nơi làm, thu nhập. Khi ốm hay bị thương, em báo người lớn và đi khám; không tự dùng AI để đoán bệnh. Dùng AI cho bài làm thì khai báo.", "takeaways": ["Sáng tạo, cảm xúc con người giúp làm những việc AI không thể làm; hợp tác, giao tiếp giúp làm việc hiệu quả với người và AI; học cách học, tư duy phản biện giúp tự học suốt đời, đánh giá thông tin AI đưa ra. AI tạo sinh có thể sai cả khi tra cứu nguồn, nên đối chiếu sách giáo khoa.", "Mục tiêu rõ ràng có đủ bốn phần (TÔI SẼ…, BẰNG CÁCH…, TRƯỚC NGÀY…, BIẾT MÌNH ĐẠT VÌ…), dấu hiệu biết mình đạt đo được; AI chỉ là một cách làm, không dùng AI vẫn đạt được mục tiêu.", "Ở sáu nghề trên thẻ, công cụ dùng AI làm thay một số khâu, người giữ việc quyết định, kiểm tra và xử lí khi máy sai. Số người làm của một nghề có thể đổi; các con số dự báo (170, 92, 78 triệu) chỉ là ước tính. Kĩ năng suy ra từ thay đổi nghề; có ít nhất một kĩ năng để làm việc cùng AI (kiểm tra kết quả, ra lệnh rõ, xử lí máy sai).", "AI hỗ trợ một khâu; ý tưởng, cảm xúc, lựa chọn cuối cùng và trách nhiệm với sản phẩm là của em. Dùng AI để gợi ý, góp ý, kiểm tra không mặc nhiên là gian lận; cần xét mục đích, mức dựa vào AI, có ghi rõ không, ai chịu trách nhiệm."], "modules": [{"type": "sort", "tag": "HĐ1 • Mở đầu", "title": "Tin tuyển dụng năm 2035", "nav": "Tuyển dụng 2035", "icon": "📰", "badge": "Người chọn yêu cầu", "intro": "<b>TUYỂN DỤNG NĂM 2035.</b> Một cửa hàng ở quê em cần tuyển nhân viên làm việc cùng các công cụ AI. Tin tuyển dụng chỉ được ghi ba yêu cầu. (Tình huống giả định; năm 2035 là lúc HS lớp 9 hôm nay khoảng 23 tuổi.) Cặp đôi chọn ba trong chín thẻ rồi ghi dòng “Lúc đầu em chọn thẻ số: …, …, … vì …”. Câu hỏi: (1) Em chọn ba thẻ nào, vì sao? (2) Câu hỏi lớn của bài: Khi AI làm được nhiều việc thay người, phần nào là của riêng em? Em cần chuẩn bị gì cho việc học, cho nghề sau này? (3) Bằng chứng nào khiến em tin ba thẻ ấy quan trọng? Điều gì có thể làm em đổi lựa chọn? Ở đây không có lựa chọn đúng sai; hãy kéo từng thẻ vào nhóm em thấy hợp, rồi xem ý chốt.", "cats": ["Năng lực con người cần rèn luyện trong thế giới có AI", "Máy tính, điện thoại đã hỗ trợ tốt việc này"], "cards": [{"t": "Thẻ 1. Tự học được cái mới khi công cụ thay đổi", "g": [0], "why": "Thẻ 1–6 là sáu năng lực con người cần rèn luyện trong thế giới có AI: cần hơn vì công cụ đổi nhanh."}, {"t": "Thẻ 2. Kiểm tra lại thông tin AI đưa ra trước khi dùng", "g": [0], "why": "Cần hơn khi có AI vì AI có thể sai."}, {"t": "Thẻ 3. Nghĩ ra ý tưởng, cách làm riêng", "g": [0], "why": "Sáng tạo: ý riêng phải do người nghĩ."}, {"t": "Thẻ 4. Thấu hiểu cảm xúc của khách", "g": [0], "why": "Cần hơn khi có AI vì AI không có cảm xúc thật."}, {"t": "Thẻ 5. Làm việc nhóm, chia việc với đồng nghiệp", "g": [0], "why": "Làm việc với AI cũng cần chia việc."}, {"t": "Thẻ 6. Nói rõ mình cần gì với người và với máy", "g": [0], "why": "Làm việc với AI cần viết câu lệnh (prompt) rõ ràng."}, {"t": "Thẻ 7. Tính nhẩm thật nhanh các số lớn", "g": [1], "why": "Thẻ 7–9 không vô ích, nhưng máy tính, điện thoại đã hỗ trợ tốt những việc này nên đó không phải điều làm người lao động khác máy."}, {"t": "Thẻ 8. Nhớ thuộc lòng thật nhiều số điện thoại", "g": [1], "why": "Máy tính, điện thoại đã hỗ trợ tốt việc này."}, {"t": "Thẻ 9. Gõ phím thật nhanh", "g": [1], "why": "Máy đã hỗ trợ tốt; không phải điều làm người lao động khác máy."}], "pass": 0.7}, {"type": "match", "tag": "HĐ2.1 • Thẻ năng lực", "title": "Sáu thẻ năng lực: cần hơn khi có AI", "nav": "Sáu thẻ năng lực", "icon": "🧠", "badge": "Người viết thẻ", "intro": "Mỗi nhóm viết một thẻ năng lực theo khuôn: “Cần hơn khi có AI vì: …”, “Ví dụ: …” (thẻ Hợp tác, Giao tiếp có thêm “Với người”, “Với AI”). Thẻ đạt khi câu “Cần hơn khi có AI vì…” có nhắc tới AI (ghi “vì nó tốt” là chưa đạt) và có ví dụ cụ thể ở trường hoặc ở nhà. Hãy ghép mỗi năng lực với lí do và ví dụ phù hợp. Câu hỏi: vì sao khi có AI, năng lực ghi trên thẻ lại càng cần?", "pairs": [["THẺ NĂNG LỰC: HỌC CÁCH HỌC (rèn luyện khả năng tự học, học suốt đời)", "Cần hơn khi có AI vì: công cụ, kể cả AI, thay đổi rất nhanh, không ai dạy mãi được mọi công cụ mới. Ví dụ: tự xem hướng dẫn để dùng một phần mềm mới cho bài thuyết trình."], ["THẺ NĂNG LỰC: TƯ DUY PHẢN BIỆN (biết phân tích, đánh giá thông tin do AI cung cấp)", "Cần hơn khi có AI vì: AI có thể đưa ra thông tin nghe hợp lí nhưng sai. Ví dụ: trước khi chép bản tóm tắt vào vở, em so với sách giáo khoa."], ["THẺ NĂNG LỰC: SÁNG TẠO (giữ vững tính sáng tạo, làm những việc AI không thể làm)", "Cần hơn khi có AI vì: AI tạo nội dung dựa trên dữ liệu đã học nên gợi ý dễ giống cái đã có; ý riêng phải do người nghĩ. Ví dụ: tự vẽ bìa báo tường của lớp theo ý cả lớp, chỉ tham khảo gợi ý."], ["THẺ NĂNG LỰC: CẢM XÚC CON NGƯỜI (giữ vững cảm xúc con người, làm những việc AI không thể làm)", "Cần hơn khi có AI vì: AI không có cảm xúc thật, không thay được sự quan tâm, động viên của người. Ví dụ: hỏi thăm, động viên một bạn đang buồn vì điểm kém."], ["THẺ NĂNG LỰC: HỢP TÁC (làm việc hiệu quả với con người và AI)", "Cần hơn khi có AI vì: nhóm càng phải thống nhất việc gì nhờ AI, việc gì người làm, ai kiểm tra lại. Với người: chia việc làm báo tường, mỗi bạn một phần. Với AI: một bạn nhờ AI gợi ý ý tưởng, cả nhóm cùng chọn và kiểm tra."], ["THẺ NĂNG LỰC: GIAO TIẾP (làm việc hiệu quả với con người và AI)", "Cần hơn khi có AI vì: muốn AI giúp đúng việc thì phải nói rõ mình cần gì; với người vẫn cần lắng nghe, giải thích. Với người: trình bày ý kiến của nhóm trước lớp. Với AI: viết câu lệnh nêu rõ đề, độ dài, người đọc."]], "why": "Kiến thức chốt: sáng tạo, cảm xúc con người giúp làm những việc AI không thể làm; hợp tác, giao tiếp giúp làm việc hiệu quả với người và AI; học cách học, tư duy phản biện giúp tự học suốt đời, đánh giá thông tin AI đưa ra. Mức Khá (9.A3.1): lí do khi có AI gắn với việc cụ thể của bản thân. Mức Tốt: nêu được AI làm việc ấy khác đi thế nào và cho thấy năng lực ấy giúp làm việc AI không làm được hay giúp làm việc tốt cùng AI."}, {"type": "story", "tag": "HĐ2.1 • Sáu tình huống, sáu năng lực", "title": "Sáu tình huống, sáu năng lực", "nav": "Sáu tình huống", "icon": "🧩", "badge": "Người chọn năng lực", "intro": "SÁU TÌNH HUỐNG (tình huống giả định; các câu trả lời, gợi ý của AI là mô phỏng). Với mỗi tình huống, chọn việc em sẽ làm (kèm năng lực cần dùng) rồi xem hậu quả. Câu hỏi: bằng chứng nào cho thấy câu tóm tắt ở tình huống 1 sai? Điều gì có thể làm em đổi năng lực đã chọn cho một tình huống? (Ví dụ ở tình huống 4, nếu bài AI viết còn sai kiến thức thì cần thêm tư duy phản biện.) Tình huống có thể gọi tên hai năng lực: chấp nhận khi việc em sẽ làm hợp lí với năng lực đã gọi tên. Mức tự chấm ● thường làm được, ◐ đôi khi, ○ chưa làm được là nhận định của em, không có đáp án đúng sai.<br><b>A (tiếp). Năng lực mạnh nhất, yếu nhất của em</b> (Năng lực | Minh chứng (việc em đã làm) | Vì sao năng lực này quan trọng khi có AI?). Minh chứng là việc cụ thể em đã làm, lấy từ bất kì môn học, việc nhà, đời sống, không bắt buộc liên quan AI. Ví dụ: năng lực mạnh nhất là Học cách học; minh chứng: tự xem hướng dẫn để dùng một phần mềm mới cho bài thuyết trình. Quan trọng khi có AI vì công cụ, kể cả AI, thay đổi rất nhanh, không ai dạy mãi được mọi công cụ mới.", "app": "💬 Trợ lí AI (mô phỏng)", "hello": "Xin chào! Mình là trợ lí AI mô phỏng. Gợi ý của mình có thể sai, hãy kiểm tra lại nhé.", "meters": [{"n": "Độ tin cậy của sản phẩm", "b": 50, "c": 0}, {"n": "Năng lực của em", "b": 50, "c": 1}, {"n": "Phần của riêng em", "b": 50, "c": 2}], "chars": [{"n": "1. Nhiệt độ sôi", "color": "#ff9f43", "task": "Tình huống 1. AI tóm tắt bài Khoa học tự nhiên: “Ở áp suất thường, nước tinh khiết sôi ở 90 °C.” Em sẽ làm gì?", "opts": [{"t": "Chép luôn vào vở vì câu nghe rất trôi chảy", "chat": ["Tóm tắt giúp em bài Khoa học tự nhiên.", "Ở áp suất thường, nước tinh khiết sôi ở 90 °C. (mô phỏng, cố ý ghi sai)"], "ch": [-35, -20, 10], "v": "bad", "fb": "Công cụ AI tạo sinh không tự biết câu trả lời đúng hay sai nên câu nghe trôi chảy vẫn có thể sai. Bằng chứng là sách giáo khoa, lời thầy cô, không phải cảm giác “nghe có vẻ đúng”."}, {"t": "Thấy chỗ sai: ở áp suất thường, nước tinh khiết sôi ở 100 °C; đối chiếu sách giáo khoa trước khi dùng (tư duy phản biện)", "chat": null, "ch": [25, 25, 15], "v": "good", "fb": "Năng lực cần dùng: tư duy phản biện. AI có thể đưa ra thông tin nghe hợp lí nhưng sai nên phải đối chiếu sách giáo khoa."}, {"t": "Bỏ không dùng AI nữa", "chat": null, "ch": [0, 5, 0], "v": "mid", "fb": "Chưa đúng trọng tâm: vẫn có thể dùng AI để tóm tắt, miễn là kiểm tra lại bằng sách giáo khoa."}]}, {"n": "2. Công cụ vẽ sơ đồ", "color": "#4aa3ff", "task": "Tình huống 2. Nhà trường vừa cho dùng một công cụ AI vẽ sơ đồ. Cô giao cho lớp tìm hiểu cách dùng công cụ này nhưng chưa ai trong lớp biết dùng. Em sẽ làm gì?", "opts": [{"t": "Chờ cô hoặc bạn nào đó dạy từng bước", "chat": null, "ch": [-20, -25, 0], "v": "bad", "fb": "Kiến thức, công cụ (kể cả AI) thay đổi nhanh, không ai dạy mãi được mọi công cụ mới nên phải tự học suốt đời."}, {"t": "Tự tìm hướng dẫn, tự thử, hỏi người biết; không chờ ai dạy (học cách học)", "chat": null, "ch": [20, 30, 10], "v": "good", "fb": "Năng lực cần dùng: học cách học. Tự tìm hướng dẫn, tự thử, hỏi người biết."}, {"t": "Nhờ bạn làm giúp cả bài", "chat": null, "ch": [-15, -20, -10], "v": "bad", "fb": "Nhờ làm giúp không rèn được khả năng tự học."}]}, {"n": "3. Bài thuyết trình nhóm", "color": "#2ecc71", "task": "Tình huống 3. Nhóm làm bài thuyết trình: một bạn muốn để AI viết hết, ba bạn muốn chia việc. Em sẽ làm gì?", "opts": [{"t": "Để AI viết hết cho nhanh", "chat": null, "ch": [-25, -15, -25], "v": "bad", "fb": "Không ai kiểm tra phần AI làm, nhóm không cùng chịu trách nhiệm về bài."}, {"t": "Thống nhất việc gì nhờ AI, việc gì người làm, ai kiểm tra lại phần AI làm; cả nhóm cùng chịu trách nhiệm về bài (hợp tác)", "chat": null, "ch": [20, 20, 30], "v": "good", "fb": "Năng lực cần dùng: hợp tác. Khi có AI, nhóm càng phải thống nhất việc gì nhờ AI, việc gì người làm, ai kiểm tra lại."}, {"t": "Chỉ chia việc, không dùng AI chút nào", "chat": null, "ch": [5, 5, 10], "v": "mid", "fb": "Chia việc là tốt (hợp tác với người), nhưng hợp tác còn gồm cả làm việc hiệu quả với AI."}]}, {"n": "4. Câu lệnh “viết giúp bài hay”", "color": "#e056fd", "task": "Tình huống 4. Em gõ cho AI “viết giúp bài hay”, nhận về một bài dài, sai đề. Em sẽ làm gì?", "opts": [{"t": "Nộp luôn bài AI viết", "chat": ["viết giúp bài hay", "(một bài dài, sai đề)"], "ch": [-30, -30, -20], "v": "bad", "fb": "Bài sai đề: cần đọc kết quả rồi hỏi lại cho đúng ý."}, {"t": "Viết câu lệnh nêu rõ đề, độ dài, người đọc; đọc kết quả rồi hỏi lại cho đúng ý (giao tiếp)", "chat": null, "ch": [25, 20, 20], "v": "good", "fb": "Năng lực cần dùng: giao tiếp. Muốn AI giúp đúng việc thì phải nói rõ mình cần gì. Chấp nhận gọi thêm “tư duy phản biện” vì bài sai đề, nếu cột “Em sẽ làm gì” hợp lí."}, {"t": "Gõ lại đúng câu cũ nhiều lần", "chat": null, "ch": [-10, -10, 0], "v": "bad", "fb": "Câu lệnh mơ hồ thì kết quả vẫn mơ hồ."}]}, {"n": "5. Bài văn về ông", "color": "#ee5a6f", "task": "Tình huống 5. Em viết bài văn kể về ông. AI gợi ý một đoạn rất trôi chảy về “người ông hiền hậu” nhưng không có chi tiết nào về ông của em. Em sẽ làm gì?", "opts": [{"t": "Dùng nguyên đoạn AI viết", "chat": null, "ch": [-25, -30, -25], "v": "bad", "fb": "AI không có cảm xúc thật nên không viết thay được phần kỉ niệm, tình cảm thật với ông."}, {"t": "Giữ kỉ niệm, tình cảm thật với ông là của em; tự viết phần này (cảm xúc con người)", "chat": null, "ch": [20, 25, 30], "v": "good", "fb": "Năng lực cần dùng: cảm xúc con người. Kỉ niệm, tình cảm thật với ông là của em; AI không có cảm xúc thật nên không viết thay được phần này."}, {"t": "Nhờ AI viết thêm cho dài", "chat": null, "ch": [-15, -20, -15], "v": "bad", "fb": "Thêm nội dung chung chung không thay được cảm xúc thật."}]}, {"n": "6. Tên đội bóng", "color": "#16a085", "task": "Tình huống 6. Lớp cần đặt tên đội bóng. AI đưa 10 cái tên, cái nào cũng giống tên các đội khác. Em sẽ làm gì?", "opts": [{"t": "Chọn đại một trong 10 cái tên", "chat": null, "ch": [-20, -15, -15], "v": "bad", "fb": "AI tạo nội dung dựa trên dữ liệu đã học nên dễ ra cái giống cái đã có."}, {"t": "Dùng gợi ý làm điểm xuất phát, tự nghĩ, chọn, sửa thành cái tên riêng (sáng tạo)", "chat": null, "ch": [25, 25, 25], "v": "good", "fb": "Năng lực cần dùng: sáng tạo. AI tạo nội dung dựa trên dữ liệu đã học nên dễ ra cái giống cái đã có."}, {"t": "Không cần tên, bỏ việc đặt tên", "chat": null, "ch": [-20, -20, -20], "v": "bad", "fb": "Bỏ cuộc không giải quyết được vấn đề."}]}]}, {"type": "sort", "tag": "HĐ2.2 • Bảng mục tiêu mẫu", "title": "Phân loại mục tiêu: câu nào là mục tiêu, thuộc hướng nào?", "nav": "Phân loại mục tiêu", "icon": "🎯", "badge": "Người đặt mục tiêu", "intro": "Công thức mục tiêu: TÔI SẼ…, BẰNG CÁCH…, TRƯỚC NGÀY…, BIẾT MÌNH ĐẠT VÌ…. Hướng 1: tìm kiếm, tóm tắt thông tin; Hướng 2: rèn kĩ năng viết, tư duy logic; Hướng 3: giao tiếp, ngôn ngữ mới; Hướng 4: kĩ năng mềm AI không làm thay được. Câu hỏi: với câu “Em muốn giỏi tiếng Anh hơn”, tám tuần nữa sao biết đã đạt? (Câu này chưa đo được, tới hạn không biết đã đạt hay chưa, vì thiếu cách làm, hạn, dấu hiệu biết mình đạt; câu sửa mẫu là Mẫu 4.) Kéo từng câu vào hướng đúng, hoặc vào “Chưa phải mục tiêu”. Ở nhà chỉ dùng công cụ AI nhà trường đã rà soát, có người lớn đồng ý và giám sát; không có điều kiện thì làm theo cột “Không dùng AI”.", "cats": ["Hướng 1: tìm kiếm, tóm tắt thông tin", "Hướng 2: rèn kĩ năng viết, tư duy logic", "Hướng 3: giao tiếp, ngôn ngữ mới", "Hướng 4: kĩ năng mềm AI không làm thay được", "Chưa phải mục tiêu"], "cards": [{"t": "Mẫu 3. Tôi sẽ tự giải được bài toán có lời văn; bằng cách tự giải trước, chỉ hỏi AI gợi ý bước tiếp theo khi bí quá 15 phút, không xem lời giải đầy đủ; trước ngày …/…/…; biết mình đạt vì tự giải đúng ít nhất sáu trong tám bài toán có lời văn ở vở bài tập, vở ghi rõ bài nào đã hỏi gợi ý. (Không dùng AI: hỏi gợi ý bạn, xem ví dụ trong sách.)", "g": [1], "why": "Hướng 2: rèn tư duy logic."}, {"t": "“Tôi sẽ cố gắng học tốt hơn”", "g": [4], "why": "Chưa phải mục tiêu (thiếu cách làm, hạn, dấu hiệu biết mình đạt)."}, {"t": "Mẫu 1. Tôi sẽ tóm tắt mỗi bài Lịch sử thành năm ý; bằng cách tự tóm tắt trước, sau đó so với bản tóm tắt AI đưa ra và đối chiếu sách giáo khoa để tìm ý sai, ý thiếu; trước ngày …/…/…; biết mình đạt vì vở có ít nhất tám bản tóm tắt, mỗi bản ghi ít nhất một chỗ đã kiểm tra lại. (Không dùng AI: so bản tóm tắt với bạn cùng bàn và phần ghi nhớ cuối bài.)", "g": [0], "why": "Hướng 1: tốt hơn khi có bước đối chiếu kết quả AI với nguồn khác."}, {"t": "Mẫu 5. Tôi sẽ lắng nghe tốt hơn khi làm nhóm; bằng cách nhắc lại ý của bạn trước khi nói ý mình trong mọi buổi làm nhóm; trước ngày …/…/…; biết mình đạt vì tới hạn các bạn trong nhóm xác nhận tôi không còn ngắt lời bạn. (Mục tiêu này không dùng AI.)", "g": [3], "why": "Hướng 4: kĩ năng mềm AI không làm thay được; tốt hơn khi là một kĩ năng mềm cụ thể (lắng nghe, thuyết trình, làm việc nhóm, giữ lời hứa, quản lí thời gian…) có dấu hiệu đạt quan sát được."}, {"t": "Mẫu 2. Tôi sẽ viết mở bài nghị luận mạch lạc hơn; bằng cách mỗi tuần tự viết một mở bài rồi nhờ AI chỉ ra câu lủng củng, tự sửa và giữ cả bản trước, bản sau; trước ngày …/…/…; biết mình đạt vì có tám cặp bản trước và sau, cô giáo nhận xét bài trên lớp có tiến bộ. (Không dùng AI: nhờ bạn góp ý theo bảng kiểm của cô.)", "g": [1], "why": "Hướng 2: tốt hơn khi ghi rõ phần tự làm trước, AI chỉ góp ý hoặc gợi ý."}, {"t": "Mẫu 4. Tôi sẽ nói tiếng Anh về chủ đề trường học tự tin hơn; bằng cách mỗi tuần ba buổi, mỗi buổi 10 phút luyện hội thoại với công cụ AI luyện nói; trước ngày …/…/…; biết mình đạt vì nói được một phút liền mạch trước nhóm mà không nhìn giấy. (Không dùng AI: luyện hội thoại với bạn cùng nhóm theo chủ đề trong sách.)", "g": [2], "why": "Hướng 3: tốt hơn khi dòng “Nếu không dùng AI…” nêu cách luyện với bạn hoặc người thân."}], "pass": 0.7}, {"type": "build", "tag": "HĐ2.2 • Viết mục tiêu của em", "title": "Phiếu học tập số 1, phần B: Hai mục tiêu học tập", "nav": "Mục tiêu của em", "icon": "✍️", "badge": "Người lập kế hoạch", "intro": "Phần B. Hai mục tiêu học tập. Hạn: khoảng tám tuần sau buổi học. Mục tiêu 1 là kĩ năng mềm; Mục tiêu 2 chọn hướng 1 / 2 / 3. Viết bằng lời của em rồi nhờ bạn kiểm tra ba câu: ① Đo được, tới hạn biết đạt hay chưa? ② Có hạn cụ thể? ③ Có phải kĩ năng AI không làm thay được (Mục tiêu 1) hoặc có gắn với việc học khi có AI (Mục tiêu 2)? Bạn chỉ góp ý, chủ phiếu quyết định. Một mục tiêu đạt khi đủ bốn phần, đo được (có số lần, số bài hoặc sản phẩm), có hạn cụ thể, là của chính em. HS không có điều kiện dùng AI vẫn đặt được mục tiêu đạt yêu cầu nhờ dòng “Nếu không dùng AI…”.", "fields": [{"id": "h", "label": "Mục tiêu 2, hướng (khoanh 1 / 2 / 3)", "opts": ["Hướng 1: tìm kiếm, tóm tắt thông tin", "Hướng 2: rèn kĩ năng viết, tư duy logic", "Hướng 3: giao tiếp, ngôn ngữ mới"]}, {"id": "ts", "label": "TÔI SẼ: ……", "hint": "Một việc cụ thể", "ph": "Tôi sẽ ...", "long": false}, {"id": "bc", "label": "BẰNG CÁCH: ……", "hint": "Cách làm; AI chỉ là một cách làm", "ph": "Bằng cách ..."}, {"id": "td", "label": "TRƯỚC NGÀY: ……", "hint": "Hạn cụ thể (khoảng tám tuần sau buổi học)", "ph": "Trước ngày ...", "long": false}, {"id": "dd", "label": "BIẾT MÌNH ĐẠT VÌ: ……", "hint": "Dấu hiệu đo được (vở, sản phẩm, bạn xác nhận)", "ph": "Biết mình đạt vì ..."}, {"id": "kd", "label": "Nếu không dùng AI, em làm bằng cách: ……", "hint": "Cách luyện với bạn hoặc người thân", "ph": "Nếu không dùng AI, em ..."}], "checks": ["① Đo được, tới hạn biết đạt hay chưa?", "② Có hạn cụ thể?", "③ Có gắn với việc học khi có AI (hoặc là kĩ năng mềm AI không làm thay được)?", "Bạn góp ý: có một góp ý hoặc ghi “đạt cả 3”. Mức Khá (9.A3.2): mục tiêu tự viết, không chép mẫu; dấu hiệu đạt đo được rõ; cách làm hợp với hoàn cảnh của mình. Mức Tốt: mục tiêu nhắm vào điều mình còn yếu (ví dụ năng lực yếu nhất ở phần A); bản sau khi sửa tiếp thu đúng góp ý của bạn.", "Hướng 1 tốt hơn khi có bước đối chiếu kết quả AI với nguồn khác; Hướng 2 tốt hơn khi ghi rõ phần tự làm trước, AI chỉ góp ý hoặc gợi ý; Hướng 3 tốt hơn khi dòng “Nếu không dùng AI…” nêu cách luyện với bạn hoặc người thân."], "sample": "Tôi sẽ nói tiếng Anh về chủ đề trường học tự tin hơn; bằng cách mỗi tuần ba buổi, mỗi buổi 10 phút luyện hội thoại với công cụ AI luyện nói; trước ngày …/…/…; biết mình đạt vì nói được một phút liền mạch trước nhóm mà không nhìn giấy. Nếu không dùng AI: luyện hội thoại với bạn cùng nhóm theo chủ đề trong sách."}, {"type": "flag", "tag": "HĐ2.3 • Một nghề đổi thay", "title": "Sáu thẻ nghề: khi máy làm sai, người làm gì?", "nav": "Một nghề đổi thay", "icon": "🛠️", "badge": "Người đọc nghề", "intro": "Phiếu học tập số 2 “Một nghề đổi thay” có bốn cột: (1) Trước đây người làm việc này thế nào? (2) Nay hoặc tới đây có AI, việc gì thay đổi? (3) Việc gì vẫn cần người: quyết định, kiểm tra, giao tiếp, chịu trách nhiệm? (4) Hai kĩ năng nghề này cần trang bị (ít nhất một kĩ năng để làm việc cùng AI), vì… Mỗi kĩ năng ở cột 4 có chữ “vì” nối với cột 2 hoặc cột 3. Dưới đây là chi tiết sáu thẻ nghề (tình huống giả định, ví dụ minh hoạ). Hãy gắn cờ những dòng kể chỗ máy làm sai và người xử lí (việc vẫn cần người), rồi đọc cột 2, 3, 4. Câu hỏi của khách ở trạm: ① Việc gì trong nghề này đã thay đổi? ② Nếu máy làm sai trong việc này thì ai phải phát hiện, ai quyết định và chịu trách nhiệm? Câu hỏi: thẻ là tình huống giả định, bằng chứng nào khiến em tin nghề này đang thay đổi như vậy? Em cần hỏi người làm nghề thật điều gì? Khi kể nghề người thân, không nêu tên, nơi làm, thu nhập.", "cols": ["Thẻ nghề", "Chi tiết trên thẻ"], "flagWhat": "chỗ máy làm sai và người xử lí (việc vẫn cần người)", "rows": [{"c": ["THẺ NGHỀ 1. NÔNG NGHIỆP", "Chú Tư trồng cây ăn quả, vườn nhà chú có hơn trăm cây. Trước đây, thấy lá cây có đốm, chú nhìn kĩ, hỏi hàng xóm hoặc cán bộ khuyến nông rồi đoán bệnh, có khi đoán sai thì cây hỏng cả vụ. Nay chú chụp ảnh lá bằng một ứng dụng có AI nhận dạng ảnh trên điện thoại, ứng dụng gợi ý tên bệnh có thể gặp và cách xử lí thường dùng."], "bad": false}, {"c": ["THẺ NGHỀ 1. NÔNG NGHIỆP", "Có lần ảnh chụp lúc trời tối, ứng dụng gợi ý sai bệnh. Chú ra vườn xem lại từng cây, hỏi cán bộ khuyến nông rồi mới quyết định cách chữa."], "bad": true, "why": "Cột 2: chụp ảnh lá, ứng dụng có AI gợi ý tên bệnh và cách xử lí. Cột 3: chú Tư ra vườn xem lại, hỏi cán bộ khuyến nông, quyết định cách chữa. Cột 4: chụp ảnh rõ, đủ sáng, vì ảnh tối làm ứng dụng gợi ý sai; đối chiếu gợi ý của ứng dụng với quan sát thực tế và ý kiến chuyên môn, vì chữa sai thì cây hỏng cả vụ. Bổ sung: đọc kĩ hướng dẫn an toàn khi dùng thuốc chữa bệnh cây."}, {"c": ["THẺ NGHỀ 2. BÁN HÀNG ONLINE", "Chị Lan bán bánh tráng của gia đình qua mạng. Trước đây chị tự viết lời giới thiệu, tự trả lời từng tin nhắn hỏi giá, nhiều hôm tới khuya. Nay chị nhờ công cụ AI viết nháp lời giới thiệu, cài tính năng AI trả lời tự động cho câu hỏi lặp lại như giá, phí giao hàng."], "bad": false}, {"c": ["THẺ NGHỀ 2. BÁN HÀNG ONLINE", "Có lần lời giới thiệu AI viết ghi “không chất bảo quản” trong khi chị chưa xác minh điều đó; chị phải sửa lại cho đúng sự thật. Khi khách phàn nàn bánh bị vỡ, chị tự gọi điện xin lỗi và quyết định đổi hàng."], "bad": true, "why": "Cột 2: AI viết nháp lời giới thiệu, trả lời tự động câu hỏi lặp lại. Cột 3: chị Lan kiểm tra lời giới thiệu có đúng sự thật, sửa lại; gọi điện xin lỗi khách, quyết định đổi hàng. Cột 4: kiểm tra nội dung AI viết có đúng sự thật về sản phẩm, vì khách tin vào lời giới thiệu; xử lí phàn nàn của khách, vì máy chỉ trả lời tự động câu hỏi lặp lại. Bổ sung: viết câu lệnh rõ cho công cụ; giữ kín số điện thoại, địa chỉ khách."}, {"c": ["THẺ NGHỀ 3. VĂN PHÒNG", "Cô Mai làm nhân viên văn phòng ở một công ti nhỏ đã nhiều năm. Trước đây cô gõ tay từng hoá đơn vào bảng tính, mỗi tháng mất nhiều ngày. Nay phần mềm có AI đọc ảnh hoá đơn và tự điền số vào bảng; việc gõ tay ít đi nhiều, cô có thêm thời gian kiểm tra và làm báo cáo."], "bad": false}, {"c": ["THẺ NGHỀ 3. VĂN PHÒNG", "Có lần phần mềm đọc nhầm số trên một hoá đơn mờ, tổng tiền cả tháng bị lệch. Cô đối chiếu từng dòng với hoá đơn giấy, tìm ra chỗ sai, sửa lại rồi báo cho kế toán trưởng biết."], "bad": true, "why": "Cột 2: phần mềm có AI đọc ảnh hoá đơn và tự điền số; gõ tay ít đi. Cột 3: cô Mai đối chiếu số liệu với hoá đơn giấy, tìm chỗ sai, sửa, báo kế toán trưởng. Cột 4: kiểm tra, đối chiếu số liệu máy điền, vì máy có thể đọc nhầm số trên hoá đơn mờ; phân tích số liệu, làm báo cáo từ bảng tính, vì phần mềm làm thay việc gõ tay nên cô có thêm thời gian kiểm tra và làm báo cáo. Bổ sung: bảo mật dữ liệu của công ti."}, {"c": ["THẺ NGHỀ 4. MAY MẶC", "Chị Hoa làm thợ máy ở một xưởng may. Trước đây, công nhân soi từng chiếc áo bằng mắt để tìm đường may lỗi; máy hỏng thì cả chuyền dừng. Nay xưởng lắp camera có AI chụp từng sản phẩm và đánh dấu chiếc nghi lỗi; một hệ thống có AI khác theo dõi tiếng ồn, độ rung để báo trước máy nào có thể sắp hỏng."], "bad": false}, {"c": ["THẺ NGHỀ 4. MAY MẶC", "Có lần camera đánh dấu lỗi cả loạt áo chỉ vì vải có hoa văn lạ. Anh tổ trưởng xem lại từng chiếc, thấy áo không lỗi nên cho đi tiếp. Khi hệ thống báo một máy sắp hỏng, chị Hoa tắt máy kiểm tra rồi mới quyết định thay linh kiện."], "bad": true, "why": "Cột 2: camera có AI đánh dấu sản phẩm nghi lỗi; hệ thống báo trước máy có thể sắp hỏng. Cột 3: anh tổ trưởng xem lại áo bị đánh dấu, quyết định cho đi tiếp; chị Hoa tắt máy kiểm tra, quyết định thay linh kiện. Cột 4: kiểm tra lại sản phẩm bị máy đánh dấu lỗi, nhận ra khi máy đánh dấu nhầm, vì máy có thể nhầm hoa văn với lỗi; đọc cảnh báo của hệ thống để kiểm tra, bảo trì máy đúng lúc, vì hệ thống báo trước máy sắp hỏng. Bổ sung: tuân thủ an toàn khi sửa máy."}, {"c": ["THẺ NGHỀ 5. DU LỊCH", "Chị Thảo làm hướng dẫn viên du lịch ở một phố cổ. Trước đây, chị tự soạn lịch trình và mang sổ tay từ vựng để nói chuyện với khách nước ngoài. Nay chị dùng ứng dụng dịch có AI để hỏi khách cần gì và nhờ công cụ AI gợi ý lịch trình theo thời tiết."], "bad": false}, {"c": ["THẺ NGHỀ 5. DU LỊCH", "Có lần ứng dụng dịch câu “món này có đậu phộng” thành một câu khác nghĩa, suýt làm một vị khách bị dị ứng ăn phải. Chị Thảo hỏi lại khách, nhờ người phục vụ kiểm tra món. Khi trời đổ mưa lớn, chị tự đổi lịch trình và kể cho khách nghe chuyện về phố cổ."], "bad": true, "why": "Cột 2: dùng ứng dụng dịch có AI; công cụ AI gợi ý lịch trình theo thời tiết. Cột 3: chị Thảo hỏi lại khách khi bản dịch đáng ngờ, nhờ kiểm tra món, tự đổi lịch trình khi trời mưa, kể chuyện cho khách. Cột 4: kiểm tra lại bản dịch, lịch trình máy gợi ý trước khi dùng với khách, vì dịch sai có thể làm khách gặp nguy hiểm; xử lí tình huống bất ngờ, kể chuyện, giao tiếp với khách, vì khi trời đổ mưa lớn chị phải tự đổi lịch trình và giữ khách vui bằng câu chuyện về phố cổ. Bổ sung: chăm sóc khách."}, {"c": ["THẺ NGHỀ 6. Y TẾ", "Bác sĩ Phương làm việc ở một bệnh viện huyện. Trước đây, bác sĩ tự xem từng phim X-quang phổi, mỗi ngày rất nhiều phim. Nay bệnh viện dùng phần mềm có AI hỗ trợ đọc ảnh: phần mềm đánh dấu chỗ nghi bất thường và gợi ý khả năng bệnh."], "bad": false}, {"c": ["THẺ NGHỀ 6. Y TẾ", "Có lần phần mềm đánh dấu một vết mờ là nghi bệnh, nhưng bác sĩ hỏi kĩ, khám trực tiếp và so với phim cũ thì thấy đó chỉ là vết sẹo cũ. Bác sĩ Phương xem xét, kết luận, giải thích cho người bệnh và chịu trách nhiệm về kết luận đó. Anh điều dưỡng chăm sóc, động viên người bệnh trong những ngày nằm viện. Lưu ý: phần mềm chỉ gợi ý cho bác sĩ. Khi ốm hay bị thương, em báo người lớn và đi khám; không tự dùng AI để đoán bệnh."], "bad": true, "why": "Cột 2: phần mềm có AI đánh dấu chỗ nghi bất thường, gợi ý khả năng bệnh. Cột 3: bác sĩ Phương khám trực tiếp, so phim cũ, xem xét, kết luận, giải thích, chịu trách nhiệm; điều dưỡng chăm sóc, động viên. Cột 4: xem xét gợi ý của máy cùng kết quả khám trực tiếp trước khi kết luận, vì máy có thể đánh dấu nhầm; giải thích, động viên người bệnh, vì người bệnh cần người lắng nghe. Bổ sung: giữ bí mật thông tin người bệnh."}], "after": "Ở sáu nghề trên thẻ, công cụ dùng AI làm thay một số khâu, người giữ việc quyết định, kiểm tra và xử lí khi máy sai. Ý mở rộng: nhiều nghề sẽ đổi cách làm; một số việc ít đi (ví dụ nhập liệu, giao dịch ở quầy), một số việc mới xuất hiện. Các thẻ nghề minh hoạ máy có AI ở vườn cây, xưởng may lẫn văn phòng (Thẻ nghề 1, 4, 3). AI tạo sinh còn làm được một số việc trí óc như viết nháp, dịch, tóm tắt. Thẻ chỉ là ví dụ minh hoạ, chưa đủ làm bằng chứng; bằng chứng cần thêm là lời người làm nghề thật, tin từ nguồn đáng tin. Câu nên hỏi thêm người làm nghề: nơi làm việc của họ đã dùng công cụ ấy chưa, máy sai thường gặp là gì, họ đã phải học thêm gì. Câu GV đọc: “Diễn đàn Kinh tế thế giới khảo sát hơn 1 000 nhà tuyển dụng, đại diện cho hơn 14 triệu lao động ở 55 nền kinh tế, trong đó có Việt Nam. Kết hợp câu trả lời của họ với số liệu việc làm toàn cầu của Tổ chức Lao động quốc tế, Báo cáo Tương lai việc làm 2025 (tháng 01/2025) ước tính từ năm 2025 đến năm 2030 có khoảng 170 triệu việc làm mới và khoảng 92 triệu việc làm bị thay thế, tức tăng thêm khoảng 78 triệu. Đây là ước tính dựa trên kì vọng của các nhà tuyển dụng, không phải điều chắc chắn. Con số gộp nhiều xu hướng (công nghệ, kinh tế, dân số…), không riêng AI.” Con số 170, 92 và 78 triệu do ai ước tính, dựa vào đâu? Con số không cho biết nghề cụ thể ở quê em sẽ ra sao; gộp nhiều xu hướng, không riêng do AI; khảo sát chỉ hỏi nhà tuyển dụng, không hỏi người lao động hay HS. Ước tính có thể đổi khi kinh tế, công nghệ, chính sách thay đổi; vì vậy luôn gọi là ước tính. Mức Khá (hợp tác, trạm hoặc chuyền bảng): phối hợp và phản hồi phù hợp khi bạn phản biện; trả lời rõ cả hai câu hỏi của khách, chỉ ra được chi tiết trên thẻ. Mức Tốt: phân công hiệu quả, tiếp thu câu hỏi của khách để sửa bảng; trình bày thuyết phục mối nối từ thay đổi tới kĩ năng."}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Phiếu học tập số 1, phần C: Nghề em quan tâm", "nav": "Nghề em quan tâm", "icon": "💼", "badge": "Người chọn nghề", "intro": "Phần C. Nghề em quan tâm: tên nghề (thẻ nghề, nghề địa phương, người thân; chưa biết mình muốn làm nghề gì thì chọn nghề nhóm vừa làm hoặc nghề của người thân, đó không phải lỗi); một thay đổi AI có thể mang lại (trước đây, nay hoặc tới đây); hai kĩ năng gắn với nghề này, ít nhất một kĩ năng để làm việc cùng AI (kiểm tra kết quả, ra lệnh rõ, xử lí máy sai), mỗi kĩ năng nêu lí do “vì …” nối với thay đổi ở trên; một nghề khác nghề ở trên, em tìm hiểu trong bài, cũng thay đổi. Kĩ năng chung chung (“chăm chỉ”, “giỏi máy tính”) không có chữ “vì” nối với thay đổi thì chưa đạt. Nghề em quan tâm là thông tin riêng, em không phải đọc trước lớp nếu không muốn. Tuỳ chọn, không bắt buộc, hỏi người lớn trong nhà: 1. Mấy năm qua, công việc của người được hỏi thay đổi gì vì máy tính, điện thoại hay AI? 2. Việc nào máy vẫn chưa làm được? 3. Người được hỏi đã phải học thêm gì?", "fields": [{"id": "n", "label": "Tên nghề", "hint": "Nghề em quan tâm", "ph": "Nghề: ...", "long": false}, {"id": "tđ", "label": "Một thay đổi AI có thể mang lại: Trước đây …… Nay hoặc tới đây ……", "hint": "Cụ thể, đúng với nghề", "ph": "Trước đây ... Nay hoặc tới đây ..."}, {"id": "k1", "label": "Kĩ năng 1 vì …", "hint": "Có chữ “vì” nối với thay đổi", "ph": "1. ... vì ..."}, {"id": "k2", "label": "Kĩ năng 2 vì …", "hint": "Ít nhất một kĩ năng để làm việc cùng AI", "ph": "2. ... vì ..."}, {"id": "kh", "label": "Một nghề khác nghề ở trên (thẻ nghề của nhóm em hoặc nhóm bạn), cũng thay đổi: Nghề …… Thay đổi ……", "hint": "Một cụm từ là đủ", "ph": "Nghề: ... Thay đổi: ..."}], "checks": ["Dòng 1–3 cho thấy thay đổi và hai kĩ năng của nghề em quan tâm", "Mỗi kĩ năng có chữ “vì” nối với thay đổi, không chép nguyên Phiếu học tập số 2 của nhóm", "Dòng “Một nghề khác” nêu một nghề khác nghề ở dòng 1 và một thay đổi khớp với thẻ nghề", "Mức Khá (9.A3.4): kĩ năng tự suy ra từ thay đổi, không chép Phiếu học tập số 2 của nhóm. Mức Tốt: lập luận chặt từ thay đổi tới kĩ năng; nêu thêm được thay đổi hoặc kĩ năng không có trong Phiếu học tập số 2 của nhóm.", "Trao đổi: bằng chứng là thẻ nghề, lời người thân, tin từ nguồn đáng tin; thay đổi có thể không xảy ra nếu công cụ quá đắt, nơi làm việc không có mạng, quy định không cho phép, người dùng chưa tin công cụ."], "sample": "Nghề: sửa xe máy. Thay đổi: trước đây thợ nghe tiếng máy, hỏi khách rồi tháo từng bộ phận để tìm chỗ hỏng. Tới đây thợ có thể dùng ứng dụng có AI gợi ý chỗ hỏng có thể gặp từ tiếng máy và lời kể của khách. Kĩ năng 1: kiểm tra lại gợi ý của ứng dụng bằng cách xem, thử trực tiếp trên xe, vì ứng dụng có thể đoán sai mà sửa nhầm thì khách tốn tiền, xe vẫn hỏng. Kĩ năng 2: hỏi khách và ghi đủ dấu hiệu hỏng (tiếng kêu, lúc nào xảy ra) để đưa vào ứng dụng, vì ứng dụng chỉ gợi ý tốt khi nhận đủ thông tin. Nghề khác: văn phòng. Thay đổi: phần mềm có AI đọc ảnh hoá đơn, tự điền số vào bảng, gõ tay ít đi."}, {"type": "quiz", "tag": "HĐ4 • Vận dụng", "title": "Ba ví dụ mẫu: AI giúp bạn ấy thể hiện mình", "nav": "Ba ví dụ mẫu", "icon": "🎨", "badge": "Người tách phần AI", "intro": "<b>VÍ DỤ 1. VẼ TRUYỆN TRANH.</b> Bạn ấy thích… Hà thích vẽ truyện tranh về chú mèo nhà mình. AI gợi ý (mô phỏng): “Truyện bốn khung: khung 1 mèo nhìn con cá trên bàn; khung 2 mèo rón rén leo lên; khung 3 bà bước vào; khung 4 mèo giả vờ ngủ.” Phần của riêng bạn ấy: Hà chọn gợi ý, đổi khung 4 thành chuyện thật của nhà mình, tự vẽ nhân vật, tự đặt lời thoại. Hà đi tiếp sở thích bằng cách mỗi tuần vẽ một truyện, dùng AI để tìm thêm cách bố cục khung.<br><b>VÍ DỤ 2. VIDEO MÓN ĂN QUÊ.</b> Tuấn muốn làm video giới thiệu cách gói bánh chưng của bà. AI gợi ý (mô phỏng): Dàn ý lời dẫn ba phần: nguyên vật liệu, cách làm, kỉ niệm. Trong phần cách làm có câu: “Gói xong, luộc khoảng 30 phút là bánh chín.” Ai thấy chỗ nào cần hỏi lại? Phần của riêng bạn ấy: Tuấn hỏi bà thì biết bà luộc bánh nhiều giờ liền, từ chiều tới gần sáng. Tuấn sửa lời dẫn theo cách bà làm, tự quay, tự kể kỉ niệm với bà. Tuấn đi tiếp sở thích bằng cách làm thêm video về các món khác của bà.<br><b>VÍ DỤ 3. VIẾT LỜI BÀI HÁT.</b> Linh thích viết lời bài hát. AI gợi ý (mô phỏng): “Một số từ hợp vần với ‘mưa’: trưa, xưa, đưa, thưa, vừa.” Phần của riêng bạn ấy: Câu chuyện, cảm xúc, việc chọn từ phù hợp và giọng hát là của Linh. Linh đi tiếp sở thích bằng cách mỗi tháng viết một bài, chỉ nhờ AI gợi ý thêm từ khi bí vần.", "qs": [{"q": "Ở ví dụ 2, chỗ nào trong gợi ý của AI cần hỏi lại?", "opts": ["Câu “Gói xong, luộc khoảng 30 phút là bánh chín.”", "Dàn ý ba phần: nguyên vật liệu, cách làm, kỉ niệm", "Cả dàn ý đều sai", "Không có chỗ nào cần hỏi lại"], "a": 0, "why": "Chỗ cần hỏi lại là câu “luộc khoảng 30 phút là bánh chín”. Theo cách bà làm, bánh luộc nhiều giờ liền, nên gợi ý của AI không khớp cách làm thật. AI có thể đưa công thức, thông tin nghe hợp lí nhưng sai; người làm sản phẩm phải đối chiếu với người biết việc, sách, thực tế, vì sản phẩm mang tên mình."}, {"q": "Bằng chứng nào cho thấy gợi ý của AI đúng, sai?", "opts": ["Câu AI viết trôi chảy", "Đối chiếu với người biết việc, sách, thực tế (như Tuấn hỏi bà)", "Nhiều bạn cùng dùng công cụ ấy", "Công cụ ấy rất mới"], "a": 1, "why": "Bằng chứng là đối chiếu với người biết việc, sách, thực tế (như Tuấn hỏi bà), không phải vì câu AI viết trôi chảy. Có thể đổi phần giao cho AI khi thấy AI hay sai ở khâu ấy; cũng có thể đổi khi khâu ấy là phần em cần tự rèn."}, {"q": "Ở ví dụ 1 và ví dụ 3, đâu là phần của riêng bạn ấy? (chọn nhiều đáp án)", "opts": ["Hà đổi khung 4 thành chuyện thật của nhà mình, tự vẽ nhân vật,
