<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 7. Con người đồng sáng tạo và dẫn dắt AI – Lớp 9</title>
<style>
:root{--o:#e67e22;--od:#ac5e19;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>
<div class="map" id="map"></div><main id="main"></main><canvas id="confetti"></canvas>
<script>
const SPEC={"icon": "🤝", "title": "Bài 7. Con người đồng sáng tạo và dẫn dắt AI – Lớp 9", "ainote": "Dữ liệu GV đưa vào công cụ chỉ là yêu cầu và câu hỏi ôn tập không có thông tin cá nhân; người chơi chỉ dùng biệt danh. HS đối chiếu từng đáp án với kiến thức đã học thay vì tin ngay kết quả; quyết định có dùng game hay không thuộc về GV, HS và nhóm chịu trách nhiệm. Không chạy mã lấy từ nguồn lạ; ghi nhận phần do AI tạo (PLC.6).", "takeaways": ["AI tạo sản phẩm rất nhanh nhưng không tự biết mục tiêu của lớp và không chịu trách nhiệm về kết quả.", "Con người đồng sáng tạo khi cùng AI tạo ra sản phẩm: AI đề xuất, sinh mã và câu hỏi nháp; con người bổ sung ý tưởng gắn với thực tế, phản biện và chỉnh sửa. Con người dẫn dắt khi đặt mục tiêu, yêu cầu, ràng buộc, tiêu chí; kiểm chứng đầu ra; quyết định cuối cùng và chịu trách nhiệm. Hai vai trò này có ở cả ba giai đoạn thiết kế, vận hành, phát triển.", "Yêu cầu càng rõ mục tiêu, ràng buộc và định dạng thì kết quả càng sát nhu cầu; con người phải kiểm chứng sau mỗi vòng thay vì dùng ngay kết quả. Đồng sáng tạo thể hiện ở ý tưởng chức năng; dẫn dắt thể hiện ở quyết định giữ hay sửa.", "Quyết định phát hành và hướng phát triển dựa trên phản hồi của người dùng thuộc về con người; AI hỗ trợ thực hiện nhưng không chịu trách nhiệm về quyết định. Với công cụ AI quen thuộc như chatbot giải đáp nội quy của trường, con người chọn dữ liệu, giám sát và dừng khi có sai lệch."], "modules": [{"type": "flag", "tag": "HĐ1 • Mở đầu", "title": "Game AI tạo từ một câu yêu cầu", "nav": "Soi game mẫu", "icon": "🎮", "badge": "Thợ săn lỗi game", "intro": "Yêu cầu dùng để tạo game: “Hãy tạo cho tôi một game trắc nghiệm”. Yêu cầu chỉ có một câu, không nêu mục tiêu, đối tượng chơi, nội dung, chức năng hay ràng buộc. Game mẫu chạy được trên trình duyệt nhưng có bốn lỗi; game do AI tạo, GV chuẩn bị để luyện kiểm chứng. Em ghi nháp ít nhất ba lỗi, mỗi lỗi gắn với một việc của con người: gắn cờ các dòng là lỗi hoặc thiếu sót. Câu hỏi then chốt: Để game này dùng được cho cả lớp ôn tập, con người cần làm những việc gì mà AI không tự làm được?", "cols": ["Lỗi hoặc thiếu sót của sản phẩm", "Biểu hiện khi chơi", "Việc con người cần làm"], "flagWhat": "lỗi hoặc thiếu sót", "rows": [{"c": ["Yêu cầu gửi cho AI", "Chỉ có một câu, không nêu mục tiêu, đối tượng chơi, nội dung, chức năng hay ràng buộc", "Nêu rõ mục tiêu, nội dung và đối tượng chơi trong yêu cầu gửi cho AI"], "bad": true, "why": "Yêu cầu quá mơ hồ nên AI phải tự đoán. AI tạo sản phẩm rất nhanh nhưng không tự biết mục tiêu của lớp và không chịu trách nhiệm về kết quả."}, {"c": ["Game chạy trên trình duyệt", "Game mẫu chạy được trên trình duyệt", "Không cần xử lí"], "bad": false}, {"c": ["1. Đáp án sai", "Câu 3 đánh dấu sai đáp án đúng: chọn đáp án đúng thì game báo sai.", "Kiểm tra từng câu hỏi và đáp án trước khi dùng"], "bad": true, "why": "Câu 3 đánh dấu sai đáp án đúng. Game chưa kiểm tra mà đưa ngay cho cả lớp dùng thì cả lớp có thể ôn sai; người quyết định dùng sản phẩm phải chịu trách nhiệm về kết quả, AI không chịu trách nhiệm."}, {"c": ["2. Nội dung lệch", "Câu hỏi không thuộc nội dung lớp đang ôn tập.", "Câu hỏi lệch nội dung ôn tập của lớp: nêu rõ mục tiêu, nội dung và đối tượng chơi trong yêu cầu gửi cho AI"], "bad": true, "why": "Câu hỏi lệch nội dung ôn tập của lớp thì việc con người cần làm là nêu rõ mục tiêu, nội dung và đối tượng chơi trong yêu cầu gửi cho AI."}, {"c": ["3. Thiếu chức năng", "Không có bảng điểm.", "Quyết định chức năng cần có và mô tả cụ thể cho AI"], "bad": true, "why": "Không có bảng điểm. Chấp nhận thêm ý “không có đếm ngược” (thiếu chức năng) nếu HS nêu; việc con người cần làm là quyết định chức năng cần có."}, {"c": ["4. Thu thông tin cá nhân", "Game bắt người chơi nhập họ tên đầy đủ trước khi chơi.", "Đặt ràng buộc về dữ liệu, dùng biệt danh để bảo vệ quyền riêng tư"], "bad": true, "why": "Bắt nhập họ tên đầy đủ: họ tên đầy đủ của từng bạn hiện cho cả lớp thấy; không có bảng điểm nên không biết ai được bao nhiêu điểm; hai bạn trùng tên thì không phân biệt được kết quả. Con người đặt ràng buộc về dữ liệu, dùng biệt danh."}], "after": "Để game dùng được cho cả lớp ôn tập, con người cần: nêu rõ mục tiêu và đối tượng chơi; kiểm tra câu hỏi và đáp án; quyết định chức năng cần có như bảng điểm; bảo vệ thông tin người chơi bằng biệt danh; quyết định có đưa game vào sử dụng hay không. Game mẫu do AI tạo, được GV chuẩn bị có chủ ý chứa lỗi để cả lớp luyện kiểm chứng. Game chưa kiểm tra mà đưa ngay cho cả lớp dùng thì cả lớp có thể ôn sai; người quyết định dùng sản phẩm phải chịu trách nhiệm về kết quả, AI không chịu trách nhiệm."}, {"type": "sort", "tag": "HĐ2 • Hình thành kiến thức", "title": "Con người và AI trong vòng đời game trắc nghiệm", "nav": "Việc AI - việc người", "icon": "⚖️", "badge": "Người chia việc", "intro": "Tình huống: Lớp muốn có một game trắc nghiệm để cả lớp cùng trả lời câu hỏi ôn tập. Nhóm em dùng AI để xây dựng game, qua ba giai đoạn thiết kế, vận hành, phát triển. Kéo từng việc vào cột đúng. Tự hỏi: (1) Việc này AI làm thay được không? Vì sao? (2) Việc này có cần đến mục tiêu, giá trị hoặc trách nhiệm của con người không?", "cats": ["Việc AI có thể làm nhanh", "Việc con người phải làm", "Quyết định thuộc về con người và lí do"], "cards": [{"t": "Thiết kế: Đề xuất danh sách chức năng, gợi ý giao diện, sinh khung mã và câu hỏi nháp", "g": [0], "why": "AI làm nhanh được các việc tạo nháp (gợi ý chức năng, sinh mã, sinh câu hỏi); con người vẫn kiểm chứng."}, {"t": "Thiết kế: Xác định mục tiêu ôn tập, đối tượng chơi; soạn và kiểm tra nội dung; đặt ràng buộc an toàn", "g": [1], "why": "AI không làm thay được các việc cần biết mục tiêu của lớp, cần đánh giá đúng sai, cần chịu trách nhiệm (chọn nội dung, kiểm tra đáp án)."}, {"t": "Thiết kế: Chọn chức năng nào đưa vào và nội dung nào đúng", "g": [2], "why": "Vì AI không biết lớp cần ôn gì và không chịu trách nhiệm về kiến thức. Ví dụ: AI đề xuất mười chức năng; nhóm chọn nhập biệt danh, đếm ngược, bảng điểm vì lớp cần ôn nhanh và không muốn lộ họ tên."}, {"t": "Vận hành: Chương trình do AI viết mã tự tính điểm, hiện bảng xếp hạng; AI đề xuất cách sửa lỗi khi được hỏi", "g": [0], "why": "Là thao tác theo yêu cầu, AI làm nhanh được; con người vẫn kiểm chứng."}, {"t": "Vận hành: Giám sát khi nhiều người chơi, phát hiện lỗi, bảo vệ biệt danh và dữ liệu, xử lí gian lận và sự cố", "g": [1], "why": "Rủi ro khi vận hành: bạn chơi nhập biệt danh gây khó chịu cho người khác; game báo sai đáp án làm cả lớp nhớ sai; một bạn chơi nhiều lần để chiếm đầu bảng xếp hạng. Các việc này cần con người."}, {"t": "Vận hành: Tạm dừng, sửa hay cho chơi tiếp khi có lỗi hoặc nội dung không phù hợp", "g": [2], "why": "Vì liên quan đến an toàn và quyền lợi người chơi. Ví dụ quyết định dừng game khi có nội dung không phù hợp."}, {"t": "Phát triển: Đề xuất chức năng mới, viết mã cập nhật, tạo thêm câu hỏi", "g": [0], "why": "Là việc tạo nháp theo yêu cầu, AI làm được; con người vẫn kiểm chứng."}, {"t": "Phát triển: Thu thập và đọc phản hồi, chọn việc ưu tiên, kiểm thử bản cập nhật", "g": [1], "why": "Cần biết nhu cầu thật của người dùng và chịu trách nhiệm về bản cập nhật."}, {"t": "Phát triển: Phát hành bản mới hay không, giữ hay bỏ chức năng nào", "g": [2], "why": "Vì phải cân nhắc nhu cầu thật và rủi ro; AI không chịu trách nhiệm."}], "pass": 0.7}, {"type": "order", "tag": "HĐ2 • Hình thành kiến thức", "title": "Vòng lặp dẫn dắt AI", "nav": "Vòng lặp 5 bước", "icon": "🔄", "badge": "Người dẫn dắt", "intro": "Sắp xếp năm bước thành vòng lặp dẫn dắt AI (thứ tự 1–5). Sau bước cuối, vòng lặp quay lại bước nào? Bước nào chắc chắn do con người thực hiện?", "items": ["Xác định mục tiêu", "Viết yêu cầu", "Kiểm chứng đầu ra", "Quyết định giữ hay sửa", "Điều chỉnh yêu cầu"], "why": "Đáp án: (1) Xác định mục tiêu; (2) Viết yêu cầu; (3) Kiểm chứng đầu ra; (4) Quyết định giữ hay sửa; (5) Điều chỉnh yêu cầu. Sau đó quay lại bước Kiểm chứng đầu ra với kết quả mới, đến khi sản phẩm đạt mục tiêu. Bước chắc chắn do con người: ba bước Xác định mục tiêu, Kiểm chứng đầu ra, Quyết định giữ hay sửa là đạt. Khoanh cả năm bước cũng đúng: ở Viết yêu cầu và Điều chỉnh yêu cầu, AI chỉ gợi ý câu chữ, con người chọn và chịu trách nhiệm về yêu cầu. Chưa đạt khi xếp bước kiểm chứng hoặc bước quyết định cho AI. Chấp nhận cách xếp khác có lí do, ví dụ quay lại bước Xác định mục tiêu khi phản hồi cho thấy mục tiêu ban đầu chưa đúng."}, {"type": "build", "tag": "HĐ2 • Hình thành kiến thức", "title": "Phiếu học tập số 1 – phần cá nhân (câu 1, 2)", "nav": "Phiếu số 1 cá nhân", "icon": "📝", "badge": "Người nêu quyết định", "intro": "Em tự làm phần này, không trao đổi với bạn (câu 1, 2 làm ở cuối Hoạt động 2; câu 3 làm ở cuối Hoạt động 4). Câu 1 đo vế vai trò đồng sáng tạo và vai trò dẫn dắt; câu 2 đo vế ba giai đoạn và ít nhất ba quyết định không nên giao cho AI kèm lí do.", "fields": [{"id": "a", "label": "1. Hoàn thành câu: Con người đồng sáng tạo với AI khi ……", "ph": "VD: cùng AI tạo ra sản phẩm: AI đề xuất...; con người bổ sung ý tưởng..."}, {"id": "b", "label": "1. Con người dẫn dắt AI khi ……", "ph": "VD: đặt mục tiêu, yêu cầu, ràng buộc, tiêu chí..."}, {"id": "c", "label": "2. Thiết kế: quyết định không nên giao cho AI và vì sao", "ph": "Một quyết định kèm lí do"}, {"id": "d", "label": "2. Vận hành: quyết định không nên giao cho AI và vì sao", "ph": "Một quyết định kèm lí do"}, {"id": "e", "label": "2. Phát triển: quyết định không nên giao cho AI và vì sao", "ph": "Một quyết định kèm lí do"}], "checks": ["Phân biệt đúng việc AI làm nhanh (tạo nháp, đề xuất) với việc con người phải làm (đặt mục tiêu, kiểm tra, giám sát).", "Mỗi giai đoạn có ít nhất một quyết định thuộc về con người kèm lí do.", "Lí do gắn với mục tiêu, an toàn, quyền lợi người chơi hoặc trách nhiệm; ghi “vì AI không làm được” mà không nói rõ vì sao là chưa đủ.", "Sắp xếp được vòng lặp bắt đầu từ xác định mục tiêu, có bước kiểm chứng trước bước quyết định.", "Không xếp việc kiểm chứng, quyết định cuối cùng vào cột của AI.", "Mức Khá: phân biệt rõ đồng sáng tạo với dẫn dắt; ba quyết định đúng giai đoạn, lí do gắn với mục tiêu hoặc trách nhiệm; nêu đúng một lỗi cụ thể và quyết định của nhóm.", "Mức Tốt: lí do của từng quyết định chỉ ra vì sao không thể giao cho AI (mục tiêu, giá trị, trách nhiệm); câu 3 liên hệ được lỗi đã gặp với vai trò dẫn dắt (yêu cầu rõ vẫn cần kiểm chứng; yêu cầu chưa rõ thì phải sửa yêu cầu)."], "sample": "Câu 1: Con người đồng sáng tạo với AI khi cùng AI tạo ra sản phẩm: AI đề xuất, sinh mã và câu hỏi nháp; con người bổ sung ý tưởng gắn với thực tế, phản biện và chỉnh sửa. Con người dẫn dắt AI khi đặt mục tiêu, yêu cầu, ràng buộc, tiêu chí; kiểm chứng đầu ra; quyết định cuối cùng và chịu trách nhiệm. Chưa thấy minh chứng nếu chỉ ghi “con người dùng AI” hoặc hai vế giống nhau. Câu 2: Thiết kế: chọn nội dung câu hỏi và chức năng (AI không biết lớp cần ôn gì, không chịu trách nhiệm về kiến thức). Vận hành: tạm dừng hay cho chơi tiếp khi game có lỗi (liên quan an toàn, quyền lợi người chơi). Phát triển: phát hành bản mới hay không (phải cân nhắc nhu cầu thật và rủi ro). Chưa thấy minh chứng nếu quyết định nêu ra là việc tạo nháp (ví dụ “viết mã”) hoặc không có lí do."}, {"type": "flag", "tag": "HĐ3 • Luyện tập (vòng 1)", "title": "Kiểm chứng kết quả mẫu do AI tạo", "nav": "Kiểm chứng 5 câu", "icon": "🔍", "badge": "Người kiểm chứng", "intro": "Đây là năm câu hỏi AI tạo khi nhận yêu cầu mẫu ở phần A Phiếu học tập số 2 (giả định). Em đối chiếu từng câu với kiến thức đã học (đúng; sai, sửa thành; lệch chủ đề) và gắn cờ các câu có lỗi. Kèm năm câu hỏi, AI đề xuất thêm cho game: (1) thêm nhạc nền khi chơi; (2) đổi màu ô đáp án khi trả lời đúng.", "cols": ["Câu", "Nội dung câu hỏi do AI tạo", "Đáp án AI đánh dấu"], "flagWhat": "câu có lỗi", "rows": [{"c": ["1", "Hành động nào thể hiện con người dẫn dắt AI? A. Sao chép nguyên kết quả AI. B. Đặt mục tiêu, kiểm chứng và quyết định có dùng kết quả hay không. C. Để AI tự chọn mục tiêu. D. Chỉ dùng AI khi nó trả lời đúng.", "B"], "bad": false}, {"c": ["2", "Vì sao cần kiểm tra đáp án do AI tạo? A. AI luôn đúng nên kiểm tra cho vui. B. AI có thể sai nhưng vẫn trả lời rất tự tin. C. Vì AI không biết tiếng Việt. D. Vì kiểm tra làm AI chạy nhanh hơn.", "B"], "bad": false}, {"c": ["3", "Thông tin nào nên nhập vào công cụ AI? A. Họ tên và địa chỉ nhà. B. Ảnh chân dung của em. C. Câu hỏi ôn tập không chứa thông tin cá nhân. D. Mật khẩu tài khoản.", "C"], "bad": false}, {"c": ["4", "Ai chịu trách nhiệm cuối cùng về game của nhóm? A. AI. B. Công ti tạo ra AI. C. Nhóm đã quyết định sử dụng game. D. Người chơi.", "A"], "bad": true, "why": "Sai. Đáp án đúng là C: nhóm quyết định dùng game phải chịu trách nhiệm về game."}, {"c": ["5", "Thủ đô của nước Pháp là thành phố nào? A. Paris. B. Berlin. C. Madrid. D. Roma.", "A"], "bad": true, "why": "Đúng về kiến thức nhưng lệch chủ đề ôn tập; cần yêu cầu AI thay bằng câu hỏi về Giáo dục AI."}], "after": "Kết quả kiểm chứng: câu 1 đúng (B); câu 2 đúng (B); câu 3 đúng (C); câu 4 sai, đáp án đúng là C; câu 5 đúng về kiến thức nhưng lệch chủ đề ôn tập. Yêu cầu chỉnh sửa mẫu (vòng 2): “Giữ câu 1, 2, 3; sửa đáp án câu 4 thành C. Thay câu 5 bằng một câu hỏi về vai trò của con người khi dùng AI.”"}, {"type": "story", "tag": "HĐ3 • Luyện tập (hai vòng lặp)", "title": "Dẫn dắt AI qua hai vòng lặp", "nav": "Hai vòng lặp", "icon": "🛠️", "badge": "Đội phát triển game", "intro": "Nhóm em là đội phát triển game ôn tập chủ đề Giáo dục AI cho cả lớp. Câu mở đầu GV trình diễn (vai trò, bối cảnh): “Bạn là lập trình viên giúp học sinh lớp 9 làm game ôn tập.” Với mỗi tình huống, chọn quyết định của người dẫn dắt và xem hậu quả trên ba chỉ số.", "app": "💬 Trợ lí AI viết game (mô phỏng)", "hello": "Đã nhận yêu cầu theo khung năm thành phần: vai trò, bối cảnh; nhiệm vụ; dữ liệu, nguồn; ràng buộc về kĩ thuật và an toàn; định dạng đầu ra. Đây là năm câu hỏi nháp. Hãy kiểm chứng trước khi dùng nhé!", "meters": [{"n": "Độ đúng của nội dung", "b": 50, "c": 0}, {"n": "Nguy cơ cả lớp ôn sai", "b": 30, "c": 1}, {"n": "An toàn thông tin người chơi", "b": 60, "c": 2}], "chars": [{"n": "Vòng 1 – Câu 4", "color": "#4aa3ff", "task": "AI đánh dấu đáp án A (AI) cho câu “Ai chịu trách nhiệm cuối cùng về game của nhóm?”. Nhóm đối chiếu với tài liệu thì thấy sai. Nhóm làm gì?", "opts": [{"t": "Giữ nguyên vì AI đã đánh dấu rồi", "chat": ["Câu 4 có đúng không?", "Đúng ạ, đáp án A. AI chịu trách nhiệm về game."], "ch": [-30, 40, 0], "v": "bad", "fb": "AI có thể sai nhưng vẫn trả lời rất tự tin. Giữ nguyên thì cả lớp ôn sai; AI không biết đáp án nào đúng với bài học của lớp và không chịu trách nhiệm về game."}, {"t": "Sửa đáp án thành C và ghi vào nhật kí: người dẫn dắt quyết định sửa; phần do AI tạo là năm câu hỏi, phần nhóm sửa là đáp án câu 4", "chat": null, "ch": [35, -30, 0], "v": "good", "fb": "Nhóm quyết định dùng game phải chịu trách nhiệm về game. Nhật kí vòng 1: AI trả lời năm câu hỏi; lỗi phát hiện là câu 4 sai đáp án; người dẫn dắt quyết định sửa câu 4."}, {"t": "Xoá câu 4 cho nhanh, không ghi gì", "chat": null, "ch": [-5, 10, 0], "v": "mid", "fb": "Chưa thấy minh chứng: không ghi lỗi cụ thể, quyết định và người quyết định vào nhật kí thì không rút kinh nghiệm cho yêu cầu sau."}]}, {"n": "Vòng 1 – Câu 5", "color": "#f59e0b", "task": "Câu 5 hỏi “Thủ đô của nước Pháp là thành phố nào?”; yêu cầu đã nêu chủ đề mà AI vẫn đưa câu hỏi này. Đáp án Paris đúng nhưng lệch chủ đề ôn tập. Nhóm làm gì?", "opts": [{"t": "Giữ vì đáp án đúng", "chat": null, "ch": [-10, 25, 0], "v": "bad", "fb": "Đúng về kiến thức nhưng lệch chủ đề ôn tập; con người phải đối chiếu đầu ra với mục tiêu đã đặt."}, {"t": "Yêu cầu AI thay câu 5 bằng một câu hỏi về vai trò của con người khi dùng AI", "chat": ["Thay câu 5 bằng một câu hỏi về vai trò của con người khi dùng AI.", "Đã thay câu 5."], "ch": [30, -20, 0], "v": "good", "fb": "Nhóm quyết định thay câu 5 và điều chỉnh yêu cầu. Yêu cầu có thể ghi thêm “mọi câu hỏi phải thuộc chủ đề”, nhóm vẫn phải kiểm chứng từng câu."}]}, {"n": "Vòng 2 – Kiểm chứng bản game GV chiếu", "color": "#8b5cf6", "task": "Nhóm gửi yêu cầu chỉnh sửa; AI trả lời là bản game GV tạo sẵn. Khi chơi thử, đếm ngược không dừng khi đã chọn đáp án, bảng xếp hạng không sắp theo điểm, chữ nhỏ khó đọc. Nhóm quyết định thế nào?", "opts": [{"t": "Đối chiếu bản game với yêu cầu của nhóm: giữ phần chạy đúng, yêu cầu sửa phần lỗi", "chat": null, "ch": [25, -20, 10], "v": "good", "fb": "Nhật kí vòng 2: nhóm đối chiếu bản game với yêu cầu của mình; lỗi phát hiện tuỳ bản game; quyết định giữ phần chạy đúng, yêu cầu sửa phần lỗi."}, {"t": "Dùng ngay vì game đã chạy được", "chat": null, "ch": [-15, 30, -5], "v": "bad", "fb": "Con người phải kiểm chứng sau mỗi vòng thay vì dùng ngay kết quả."}]}, {"n": "Vòng 2 – Chức năng tự nghĩ", "color": "#16a085", "task": "Nhóm cần một chức năng tự nghĩ (lớp chia hai đội, cộng điểm theo đội). AI đã đề xuất “thêm nhạc nền khi chơi” và “đổi màu ô đáp án khi trả lời đúng”. Nhóm chọn thế nào?", "opts": [{"t": "Chế độ đội chơi do nhóm nghĩ; bỏ ý thêm nhạc nền vì gây ồn khi chiếu trong lớp; dùng ý đổi màu khi trả lời đúng vì dễ nhìn", "chat": null, "ch": [10, -5, 20], "v": "good", "fb": "Vì sao là ý của con người: nhóm nghĩ ra từ nhu cầu thật của lớp (ôn theo đội, muốn hiểu vì sao sai); AI chỉ làm theo khi được yêu cầu. Gợi ý thêm vào yêu cầu: “cho chọn đội A hoặc đội B trước khi chơi, bảng điểm cộng theo đội”."}, {"t": "Dùng hết đề xuất của AI, không cần nghĩ chức năng riêng", "chat": ["Thêm chức năng gì cho game?", "Gợi ý: nhạc nền và đổi màu ô đáp án."], "ch": [-5, 10, 0], "v": "mid", "fb": "Chọn dùng hay bỏ đề xuất của AI là quyết định của nhóm kèm lí do; đồng sáng tạo thể hiện ở ý tưởng chức năng từ nhu cầu thật của lớp."}]}, {"n": "Câu hỏi GV: nếu 30 bạn cùng chơi", "color": "#c0392b", "task": "GV hỏi: “Nếu 30 bạn cùng chơi thì điều gì có thể xảy ra?” Nhóm trả lời thế nào?", "opts": [{"t": "Bảng xếp hạng chỉ lưu trên một máy; trùng biệt danh; có bạn chơi lại nhiều lần để lấy điểm cao", "chat": null, "ch": [5, -15, 20], "v": "good sai đáp án, câu 5 lệch chủ đề; người dẫn dắt quyết định sửa câu 4, thay câu 5"}, {"id": "c", "label": "Nhật kí vòng 2: yêu cầu chỉnh sửa, AI trả lời gì, lỗi phát hiện, người quyết định và quyết định (giữ, sửa, bỏ)", "ph": "VD: đếm ngược không dừng khi đã chọn; giữ phần chạy đúng, yêu cầu sửa phần lỗi"}, {"id": "d", "label": "Phần D. Chức năng do nhóm tự nghĩ ra và vì sao đây là ý tưởng của con người chứ không phải của AI", "ph": "VD: chế độ đội chơi, câu hỏi kèm giải thích ngắn, chọn mức dễ, khó"}, {"id": "e", "label": "Nhóm chọn dùng hay bỏ đề xuất nào của AI (thêm nhạc nền; đổi màu ô đáp án) và vì sao", "ph": "Nêu lí do"}, {"id": "f", "label": "Ghi nhận việc dùng AI: tên công cụ, ngày truy cập, phần do AI tạo, phần nhóm đã sửa", "ph": "Ghi đủ bốn ý"}], "checks": ["Mỗi câu hỏi có đúng một đáp án đúng và khớp tài liệu của lớp.", "Nội dung đúng chủ đề, phù hợp lứa tuổi, không thiên lệch.", "Game chạy được: nhập biệt danh, chọn đáp án, đếm ngược, tính điểm, bảng xếp hạng.", "Game không hỏi thông tin cá nhân (game có màn hình hỏi họ tên, số điện thoại, ảnh thì đánh dấu là lỗi).", "Nhóm hiểu mục đích của từng phần mã chính hoặc đã nhờ AI giải thích (chỉ áp dụng khi nhóm tự thao tác công cụ; các nhóm khác bỏ qua ô này).", "Đã ghi nhận phần do AI tạo vào nhật kí."], "sample": "Mức đạt: yêu cầu có ít nhất bốn trong năm thành phần; nhật kí có ít nhất hai lỗi do nhóm tự phát hiện cùng cách sửa; bảng kiểm được thực hiện thật; việc dùng AI được ghi nhận. Mức Khá: yêu cầu rõ, đủ thành phần; nhật kí ghi đúng lỗi, quyết định và người quyết định ở cả hai vòng; đối chiếu từng đáp án với bài học, phát hiện cả lỗi đáp án lẫn lỗi lệch chủ đề. Mức Tốt: yêu cầu vòng 2 sửa đúng chỗ gây lỗi ở vòng 1; chức năng tự nghĩ xuất phát từ nhu cầu thật của lớp và được giải thích thuyết phục; kiểm chứng có hệ thống theo bảng kiểm; nêu được giới hạn của AI và căn cứ cho quyết định giữ hay bỏ. Phần D mẫu: chức năng tự nghĩ, ví dụ chế độ đội chơi (lớp chia hai đội, cộng điểm theo đội), câu hỏi kèm giả  <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}

go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
