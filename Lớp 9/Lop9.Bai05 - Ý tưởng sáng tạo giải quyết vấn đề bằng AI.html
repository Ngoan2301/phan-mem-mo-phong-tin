<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 5. Ý tưởng sáng tạo giải quyết vấn đề bằng AI – Lớp 9</title>
<style>
:root{--o:#c0392b;--od:#902a20;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "💡", "title": "Bài 5. Ý tưởng sáng tạo giải quyết vấn đề bằng AI – Lớp 9", "ainote": "Trong ý 2, AI chỉ gợi ý con số, cô phụ trách quyết định đặt bao nhiêu bình. Tình huống và số liệu là giả định, không có dữ liệu cá nhân; không ghi tên, ảnh, số điện thoại của người thật vào khung. Ý tưởng cần dữ liệu về người thì hỏi câu (3): dữ liệu của ai, có được dùng không; người trên thẻ quyết định cuối cùng, AI chỉ nhận ra, dự đoán hay gợi ý. Mỗi dải góp ý là “Góp ý mẫu do GV soạn để luyện tập”, không phải góp ý của công cụ AI; nhóm tự quyết định giữ, sửa hay bỏ và chịu trách nhiệm về quyết định đó. Giấy nhớ chỉ ghi ý kiến về ý tưởng, không chế giễu, không nêu tên người thật.", "takeaways": ["Có AI chưa chắc đã mới. Muốn biết ý tưởng có mới không, cần xét người dùng đang làm thế nào, ý tưởng cho họ thêm được điều gì mà cách đó chưa có, ý tưởng khác ý của các nhóm trong lớp ở đâu.", "Ba phép N, D, L mỗi phép chỉ đổi một yếu tố và giữ việc AI làm; phép G ghép thêm một thứ đã có. Phương án tốt qua được bộ bốn câu hỏi; nhóm được giữ ý đầu tiên nếu nêu được nó hơn các phương án khác.", "Góp ý từ bạn bè, người lớn hay công cụ AI đều phải kiểm tra rồi mới giữ, sửa hay bỏ; lời khen không phải bằng chứng; điều không kiểm tra được trong lớp thì ghi “chưa chắc”. Ở ô ④, ghi điểm mới so với cách người dùng đang làm và so với các nhóm trong lớp, không ghi “chưa ai làm”. Nhóm quyết định và chịu trách nhiệm về quyết định đó.", "Ý tưởng tốt là ý tưởng mới so với cách người dùng đang làm và được chọn từ nhiều phương án. Ý tưởng đó cho AI làm đúng một việc hợp với dữ liệu, có người quyết định và có cách xử lí rủi ro."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Ba ý, một câu hỏi: Hết nước giữa buổi", "nav": "Hết nước giữa buổi", "icon": "💧", "badge": "Người chọn ý", "intro": "<b>Tình huống “Hết nước giữa buổi” (giả định, số liệu giả lập).</b> Trường có 24 lớp, mỗi lớp đặt một bình nước lọc 20 lít ở cuối lớp. Mỗi sáng, cô phụ trách thiết bị gọi cửa hàng giao nước theo số bình rỗng mà bác bảo vệ đếm được chiều hôm trước; ngày thường cả trường dùng khoảng 24 bình. Hôm có ngày hội thể thao ngoài trời, cô vẫn đặt 24 bình như mọi ngày, nhưng cả trường cần tới 32 bình: thiếu 8 bình; nhiều lớp hết nước từ giữa buổi.<br>Ba ý cho cùng vấn đề:<br>- Ý 1: Làm một ứng dụng trên điện thoại để lớp trưởng báo số bình rỗng thay cho việc bác bảo vệ đi đếm;<br>- Ý 2: Dùng AI ước lượng số bình cần cho ngày mai từ số bình đã dùng các ngày trước, lịch hoạt động ngoài trời (giờ thể dục, ngày hội, buổi lao động) và dự báo nhiệt độ; cô phụ trách xem con số gợi ý rồi tự quyết định đặt bao nhiêu bình;<br>- Ý 3: Làm một phần mềm hội thoại tự động (chatbot) có AI trả lời HS câu hỏi “Hôm nay lớp mình có tiết thể dục không?”.<br>Chọn một ý và nêu một lí do.", "app": "💬 Trợ lí ý tưởng (mô phỏng)", "hello": "Xin chào! Cô phụ trách thiết bị đang cần giải quyết vấn đề thiếu nước. Em chọn ý nào? (Mô phỏng, số liệu giả định.)", "meters": [{"n": "Giải đúng vấn đề thiếu nước", "b": 30, "c": 0}, {"n": "Mới so với cách đang làm", "b": 30, "c": 1}, {"n": "Có người quyết định", "b": 50, "c": 2}], "chars": [{"n": "Câu hỏi (1): Ý nào vừa giải đúng vấn đề, vừa mới?", "color": "#4aa3ff", "task": "Ý nào vừa giải đúng vấn đề thiếu nước, vừa mới so với cách nhà trường đang làm?", "opts": [{"t": "Ý 1: ứng dụng để lớp trưởng báo số bình rỗng", "chat": null, "ch": [-10, -25, 0], "v": "bad", "fb": "Ý 1 là công cụ số, không có tính năng AI; vẫn chỉ biết số bình sau khi nước đã dùng hết nên không làm được gì mà cách cũ không làm được."}, {"t": "Ý 2: AI ước lượng số bình cho ngày mai, cô phụ trách quyết định", "chat": ["Ước lượng số bình cần cho ngày mai từ số bình đã dùng các ngày trước, lịch hoạt động ngoài trời và dự báo nhiệt độ", "Gợi ý: 32 bình cho ngày hội thể thao. Cô phụ trách xem rồi quyết định đặt bao nhiêu bình."], "ch": [35, 40, 20], "v": "good", "fb": "Lựa chọn hợp lí là ý 2: mới vì dự tính được trước những ngày khác thường, khi số bình của hôm trước không còn đúng. AI làm đúng một việc (ước lượng số bình); người quyết định cuối cùng là cô phụ trách."}, {"t": "Ý 3: chatbot có AI trả lời “Hôm nay lớp mình có tiết thể dục không?”", "chat": null, "ch": [-25, -15, 0], "v": "bad", "fb": "Ý 3 có AI nhưng không giải vấn đề thiếu nước; thời khoá biểu đã dán ở lớp nên HS cũng không có thêm điều gì mới."}]}, {"n": "Câu hỏi (2): Đổi người xem con số", "color": "#ff9f43", "task": "Nếu người xem con số của ý 2 là chủ cửa hàng giao nước thay cho cô phụ trách, ý 2 còn có ích không?", "opts": [{"t": "Vẫn có ích: cửa hàng biết trước số bình để chuẩn bị đủ bình sạch và xếp chuyến giao", "chat": null, "ch": [25, 25, 10], "v": "good", "fb": "Vẫn có ích. Việc AI làm và dữ liệu giữ nguyên, chỉ đổi người dùng. Đây là phép đổi người dùng (N) dùng ở HĐ 2."}, {"t": "Hết ích vì con số chỉ dành cho cô phụ trách", "chat": null, "ch": [-10, -20, 0], "v": "bad", "fb": "Cửa hàng giao nước biết trước số bình sẽ chuẩn bị đủ bình sạch và xếp chuyến giao; chỉ đổi người dùng, việc AI làm và dữ liệu giữ nguyên."}]}, {"n": "HS hỏi: “Ngày hội thì cô tự đặt thêm bình, cần gì AI?”", "color": "#e17055", "task": "Em trả lời thế nào cho câu hỏi này?", "opts": [{"t": "Nếu chỉ một yếu tố (ngày hội) thì một quy tắc đơn giản là đủ; AI có ích khi nhiều yếu tố cùng tác động (nhiệt độ, nhiều loại hoạt động ngoài trời, mùa) mà người khó tự tính", "chat": null, "ch": [20, 30, 10], "v": "good", "fb": "Đây cũng là ý của câu (2) trong bộ bốn câu hỏi ở HĐ 2: AI làm đúng một việc mà không có AI thì khó làm."}, {"t": "AI luôn tốt hơn người nên cứ dùng AI", "chat": null, "ch": [-15, -10, -25], "v": "bad", "fb": "Có AI chưa chắc đã mới; nếu chỉ một yếu tố thì một quy tắc đơn giản là đủ, không cần AI."}]}, {"n": "Bạn chọn ý 1 vì “dễ làm”", "color": "#00b894", "task": "Một HS chọn ý 1 vì “dễ làm”. GV nên hỏi gì?", "opts": [{"t": "Ý đó cho cô phụ trách thêm được điều gì mà cách đếm bình rỗng chưa có?", "chat": null, "ch": [15, 30, 10], "v": "good", "fb": "GV ghi nhận, rồi hỏi ý đó cho cô phụ trách thêm được điều gì mà cách đếm bình rỗng chưa có. “Dễ làm” là tiêu chí khác với “mới”."}, {"t": "Bỏ qua, vì dễ làm là đủ", "chat": null, "ch": [-10, -25, 0], "v": "mid", "fb": "“Dễ làm” là tiêu chí khác với “mới”; cần xét người dùng đang làm thế nào và ý tưởng cho họ thêm được gì."}]}]}, {"type": "lab", "tag": "HĐ1 • Mở đầu", "title": "Phòng thí nghiệm: số bình nước cần cho ngày mai", "nav": "Số bình nước", "icon": "🧪", "badge": "Nhà thực nghiệm", "intro": "Số liệu giả lập: ngày thường cả trường dùng khoảng 24 bình; hôm ngày hội thể thao ngoài trời cả trường cần 32 bình. Cô phụ trách đặt theo số bình rỗng hôm trước (24 bình). Kéo “mức hoạt động ngoài trời” từ ngày thường tới ngày hội để thấy số bình thiếu; kéo “đặt dư” để xem cách xử lí rủi ro: AI gợi ý thiếu khi có hoạt động không ghi trong lịch, cô đặt dư một, hai bình.", "sliders": [{"id": "hd", "n": "Mức hoạt động ngoài trời (0 = ngày thường, 100 = ngày hội thể thao)", "min": 0, "max": 100, "val": 0, "unit": ""}, {"id": "du", "n": "Số bình cô đặt dư thêm", "min": 0, "max": 4, "val": 0, "unit": " bình"}], "outputs": [{"n": "Số bình cả trường cần", "base": 24, "w": {"hd": 0.08}, "c": 0}, {"n": "Số bình cô đặt (theo bình rỗng hôm trước + đặt dư)", "base": 24, "w": {"du": 1}, "c": 1}, {"n": "Số bình còn thiếu, lớp hết nước từ giữa buổi", "base": 0, "w": {"hd": 0.08, "du": -1}, "c": 2}], "insights": [{"id": "hd", "op": ">=", "val": 100, "txt": "Hôm có ngày hội thể thao, cô vẫn đặt 24 bình như mọi ngày, nhưng cả trường cần tới 32 bình: thiếu 8 bình; nhiều lớp hết nước từ giữa buổi. Số bình rỗng của hôm trước không còn đúng, ý 2 dự tính được trước những ngày khác thường."}, {"id": "hd", "op": "<=", "val": 0, "txt": "Ngày thường cả trường dùng khoảng 24 bình, đặt theo số bình rỗng hôm trước là đủ; chưa cần AI."}, {"id": "du", "op": ">=", "val": 2, "txt": "AI gợi ý thiếu khi có hoạt động không ghi trong lịch; cô đặt dư một, hai bình và dặn lớp nào sắp hết nước thì báo bác bảo vệ để cô gọi giao thêm. Cô phụ trách vẫn là người quyết định."}]}, {"type": "match", "tag": "HĐ2 • Hình thành kiến thức", "title": "Bảng bốn phép tạo phương án (ví dụ bình nước uống)", "nav": "Bốn phép N, D, L, G", "icon": "🔀", "badge": "Người tạo phương án", "intro": "<b>Ý đầu tiên (ví dụ bình nước uống):</b> người dùng: cô phụ trách thiết bị; dữ liệu: số bình nước đã dùng các ngày trước; lúc dùng: chiều hôm trước; việc AI làm: ước lượng số bình cần cho ngày mai.<br>Ghép mỗi phép (kèm câu gợi hỏi) với ví dụ mẫu. N, D, L: mỗi phép chỉ đổi đúng một yếu tố, việc AI làm giữ nguyên. G: giữ nguyên bốn yếu tố, ghép thêm một thứ đã có. Dòng N, L, G áp lên phương án D vì ý đầu tiên chỉ dựa vào số bình các hôm trước nên chưa cần AI.", "pairs": [["N: Đổi người dùng. Nếu người dùng là …… thì sao?", "Áp lên phương án D: giữ dữ liệu, lúc dùng, việc ước lượng; người dùng là chủ cửa hàng giao nước: chuẩn bị đủ bình sạch, xếp chuyến giao theo số ước lượng."], ["D: Đổi dữ liệu. Nếu AI dựa vào …… thì sao?", "Thêm lịch hoạt động ngoài trời, dự báo nhiệt độ: AI ước lượng sát hơn vào ngày khác thường."], ["L: Đổi lúc dùng. Nếu dùng vào lúc …… thì sao?", "Áp lên phương án D: giữ người dùng, dữ liệu, việc ước lượng số bình cần cho một ngày; chỉ đổi lúc dùng sang 6 giờ sáng cùng ngày: cô đặt sát hơn vì tính được cả hoạt động ngoài trời mới thêm vào lịch sáng hôm đó."], ["G: Ghép với cái đã có. Nếu ghép với …… đã có thì sao?", "Áp lên phương án D: giữ nguyên bốn yếu tố, ghép với tờ ghi số bình bác bảo vệ đếm mỗi chiều: bác ghi thêm con số AI gợi ý cạnh số bình rỗng, cô xem cả hai số rồi đặt."]], "why": "Phép D đổi dữ liệu (thêm lịch hoạt động ngoài trời, dự báo nhiệt độ), giữ người dùng (cô phụ trách), lúc dùng (chiều hôm trước) và việc AI làm (ước lượng số bình). Phương án của phép D chính là ý 2 ở HĐ 1. Ý đầu tiên của ví dụ chỉ dựa vào một loại dữ liệu nên còn yếu ở câu (2) (lấy số bình các hôm trước là đủ); chính phép D thêm lịch, nhiệt độ mới làm việc ước lượng cần đến AI. HS kết hợp hai phép thì ghi cả hai kí hiệu."}, {"type": "sort", "tag": "HĐ2 • Hình thành kiến thức", "title": "Bộ thẻ vấn đề và phương án mẫu theo phép", "nav": "Bộ thẻ vấn đề", "icon": "🗂️", "badge": "Nhà phân loại phương án", "intro": "Bộ thẻ vấn đề (tình huống giả định): mỗi thẻ có ba dòng Ai gặp khó, Chuyện gì xảy ra, Họ đang xoay xở thế nào, kèm phương án mẫu của một nhóm. Xếp mỗi thẻ vào phép đã dùng để tạo phương án mẫu: N đổi người dùng, L đổi lúc dùng, G ghép với cái đã có. (Phép D đổi dữ liệu chính là ý 2 ở HĐ 1 nên các phương án mẫu ở đây dùng N, L, G.) Thẻ trắng: dùng khi nhóm muốn giải một vấn đề khác; nhóm chép đủ ba dòng, có thể chép một vấn đề đã xác định ở Bài 7 lớp 8 nếu lớp đã học; GV kiểm tra thẻ đủ ba dòng, có một người gặp khó cụ thể và cách họ đang xoay xở; ý đầu tiên được soi bằng câu (1), (2), (3) và hai ý đầu của câu (4) như các thẻ khác. Với người gặp khó trên thẻ, AI làm đúng một việc gì, dựa vào dữ liệu nào? Phương án tốt qua được câu (1), (2), (3) và hai ý đầu của câu (4); ý “khác ý các nhóm trong lớp” chưa xét ở hoạt động này. Nhóm được chọn lại ý đầu tiên nếu nêu được nó hơn các phương án khác.", "cats": ["N: Đổi người dùng", "L: Đổi lúc dùng", "G: Ghép với cái đã có"], "cards": [{"t": "THẺ VẤN ĐỀ SỐ 1. ĐỒ THẤT LẠC. Ai gặp khó: HS toàn trường và bác bảo vệ. Chuyện gì xảy ra: Mỗi tuần có nhiều áo khoác, bình nước, ô, thẻ gửi xe bị bỏ quên ở sân, lớp, nhà xe; phòng bảo vệ để thành một đống, ít bạn tìm lại được đồ của mình. Họ đang xoay xở thế nào: Bác bảo vệ ghi vào sổ tay; bạn mất đồ phải xuống phòng bảo vệ lục tìm trong giờ ra chơi. Tình huống giả định. — Phương án mẫu của nhóm: giữ nguyên bốn yếu tố, ghép với sổ tay bác đang ghi: mỗi món trong sổ ghi thêm số ảnh, món AI gợi ý được tra ngay trong sổ.", "g": [2], "why": "Ý đầu tiên gợi ý: Người dùng: bác bảo vệ. Dữ liệu: ảnh các đồ đã nhận (chỉ chụp đồ vật) và lời mô tả đồ bị mất HS ghi vào phiếu báo mất. Lúc dùng: khi có HS báo mất đồ. Việc AI làm: gợi ý vài món trong ảnh giống nhất với lời mô tả để bác lấy ra cho HS nhận. Phép mẫu G. Ghi chú cho GV: Ý “AI nhận ra loại đồ để xếp theo loại” không cần AI (bác nhìn là biết); AI có ích khi phải so một lời mô tả với rất nhiều đồ đã nhận. GV hỏi “Việc này có cần AI không?”. Ảnh chỉ chụp đồ vật, không chụp người; bác trả đồ khi HS nhận đúng đồ của mình."}, {"t": "THẺ VẤN ĐỀ SỐ 2. RAU CỦA BÀ. Ai gặp khó: Bà của bạn Hạnh (nhân vật giả định) trồng rau, chuối ở xã, mỗi sáng mang ra chợ bán; người mua ở chợ. Chuyện gì xảy ra: Có hôm bà hái nhiều quá, mang về héo phải bỏ; có hôm bán hết từ sớm, khách đến sau không còn. Họ đang xoay xở thế nào: Bà đoán theo kinh nghiệm; khách quen hay nhắn tin đặt rau từ tối hôm trước, tin nhiều nên bà hay đếm sót. Tình huống giả định. — Phương án mẫu của nhóm: giữ nguyên bốn yếu tố, ghép với kinh nghiệm của bà: AI tách số bó khách quen đã đặt, bà cộng thêm số bó bà đoán sẽ bán cho khách đến chợ.", "g": [2], "why": "Ý đầu tiên gợi ý: Người dùng: bà. Dữ liệu: tin nhắn đặt rau của khách quen, viết tự do (có tin viết tắt, không dấu, nhiều loại rau trong một tin). Lúc dùng: tối hôm trước. Việc AI làm: đọc hiểu từng tin nhắn, tách ra số bó mỗi loại rau khách đặt. Phép mẫu G. Ghi chú cho GV: Việc cần AI là đọc hiểu tin nhắn viết tự do; phần cộng số bó là việc đơn giản, làm tay được. Nếu ý đầu tiên của nhóm chỉ là AI cộng số bó (tin nhắn đã ghi rõ số) thì nhóm kết luận “chỉ cộng thì không cần AI” là đúng câu (2); GV gợi ý nhóm chuyển việc AI làm sang đọc hiểu tin nhắn viết tự do. Cũng có thể chuyển sang dự đoán số bó bán cho khách đến chợ từ số bó bán được các phiên trước, thời tiết, ngày phiên chợ. Tin nhắn của khách là dữ liệu riêng: chỉ dùng tin đặt hàng gửi cho bà, không chia sẻ ra ngoài."}, {"t": "THẺ VẤN ĐỀ SỐ 3. HÒM THƯ GÓP Ý CỦA TRƯỜNG. Ai gặp khó: Thầy cô phụ trách công tác HS và Ban chỉ huy Liên đội. Chuyện gì xảy ra: Hòm thư góp ý mỗi tháng có rất nhiều phiếu viết tay; nhiều ý giống nhau, thầy cô không kịp đọc hết nên nhiều góp ý không được trả lời. Họ đang xoay xở thế nào: Thầy cô đọc lướt một phần, chọn vài ý đọc ở buổi chào cờ. Tình huống giả định. — Phương án mẫu của nhóm: giữ phiếu góp ý, lúc cuối tháng và việc xếp nhóm; chỉ đổi người dùng thành Ban chỉ huy Liên đội, đọc các nhóm góp ý để chọn việc làm trong tháng sau.", "g": [0], "why": "Ý đầu tiên gợi ý: Người dùng: thầy cô phụ trách. Dữ liệu: ảnh chụp các phiếu góp ý viết tay (phiếu có ghi tên thì đã che tên trước khi chụp). Lúc dùng: cuối mỗi tháng. Việc AI làm: xếp các góp ý viết tay trên ảnh có cùng ý vào một nhóm chủ đề (để xếp được, AI đọc chữ trên ảnh). Phép mẫu N. Ghi chú cho GV: Thầy cô vẫn đọc và quyết định; phiếu có ghi tên thì che tên trước khi chụp. Nhóm ghi “gõ lại thành chữ” thì GV hỏi: ai gõ, có nhanh hơn đọc không? AI có thể đọc sai chữ viết tay khó đọc: thầy cô xem lại phiếu gốc của nhóm chủ đề định trả lời."}, {"t": "THẺ VẤN ĐỀ SỐ 4. QUẠT, ĐÈN QUÊN TẮT. Ai gặp khó: Tổ trực nhật các lớp và bác bảo vệ. Chuyện gì xảy ra: Chiều nào cũng có vài lớp về rồi mà quạt, đèn vẫn bật; có hôm quạt chạy tới sáng hôm sau. Họ đang xoay xở thế nào: Tổ trực nhật được nhắc tắt điện trước khi về nhưng hay quên; bác bảo vệ đi kiểm tra từng phòng, mở từng cửa để tắt. Tình huống giả định. — Phương án mẫu của nhóm: giữ bác bảo vệ, số điện từng tầng và việc nhận ra điện dùng cao bất thường; chỉ đổi lúc dùng sang 21 giờ, trước khi bác khoá cổng ban đêm, so với các tối trước cùng giờ để kiểm tra lần cuối các tầng có lớp học buổi tối.", "g": [1], "why": "Ý đầu tiên gợi ý: Người dùng: bác bảo vệ. Dữ liệu: số điện dùng theo giờ của từng tầng trong các tuần trước và hôm nay (giả định trường có công tơ điện từng tầng). Lúc dùng: sau giờ tan học buổi chiều. Việc AI làm: nhận ra tầng nào đang dùng điện cao bất thường so với các ngày trước cùng giờ, dấu hiệu còn quạt, đèn bật. Phép mẫu L. Ghi chú cho GV: AI có ích ở đây vì mức điện bình thường đổi theo ngày, giờ, thời tiết, lớp học thêm; AI so với nhiều ngày trước cùng giờ. Ý đầu tiên dựa trên giả định có công tơ từng tầng, ít trường có; GV dùng ý này như ví dụ giả định. Nhóm kết luận “dùng hẹn giờ, công tắc tổng hoặc phân công kiểm tra là đủ, không cần AI” là lập luận đạt câu (2); nhóm được chọn thẻ còn lại. Ý “AI nhận ra phòng sáng đèn từ ảnh chụp cửa sổ” không cần AI (đứng ở sân nhìn cũng thấy) và ảnh không cho biết quạt còn chạy; GV hỏi “Việc này có cần AI không?”. Bác vẫn đến tận tầng để kiểm tra và tắt."}, {"t": "THẺ VẤN ĐỀ SỐ 5. SÂN CẦU LÔNG CÂU LẠC BỘ. Ai gặp khó: HS câu lạc bộ cầu lông của trường. Chuyện gì xảy ra: Nhà thể chất chỉ có hai sân; nhiều nhóm đến nơi mới biết sân đã kín, đứng chờ một lúc rồi về. Họ đang xoay xở thế nào: Hỏi nhau qua tin nhắn xem ai đang chơi; ghi tên nhóm vào sổ đăng kí sân đặt ở cửa nhà thể chất. Tình huống giả định. — Phương án mẫu của nhóm: giữ nguyên bốn yếu tố, ghép với tờ lịch dán ở cửa nhà thể chất: giờ AI dự đoán trống ghi bằng bút chì lên tờ lịch đó.", "g": [2], "why": "Ý đầu tiên gợi ý: Người dùng: HS câu lạc bộ. Dữ liệu: sổ đăng kí sân các tuần trước. Lúc dùng: tối hôm trước. Việc AI làm: dự đoán giờ nào sân thường trống. Phép mẫu G. Ghi chú cho GV: Sổ đăng kí chỉ ghi tên nhóm, không cần tên từng người. Câu (2) dễ trượt: nếu chỉ cần đếm sổ là biết giờ nào trống thì không cần AI; AI có ích khi giờ trống đổi theo nhiều yếu tố (tuần thi, thời tiết, lịch câu lạc bộ khác). GV hỏi “Việc này có cần AI không?”."}, {"t": "THẺ VẤN ĐỀ SỐ 6. THÔNG BÁO CHO MỘT BẠN KHIẾM THỊ Ở TRƯỜNG. Ai gặp khó: Một bạn khiếm thị học ở trường (nhân vật giả định) và các bạn cùng lớp. Chuyện gì xảy ra: Thông báo của trường, của Liên đội chỉ in giấy dán ở bảng tin; bạn không tự đọc được bản in, có lần lỡ hạn đăng kí một hoạt động mình thích. Họ đang xoay xở thế nào: Nhờ bạn cùng lớp đọc giúp; khi các bạn bận thì phải chờ. Tình huống giả định. — Phương án mẫu của nhóm: giữ người dùng, ảnh chụp thông báo và việc đọc chữ thành giọng nói; chỉ đổi lúc dùng sang giờ ra chơi đầu tiên mỗi sáng thứ Hai, khi bạn đứng trước bảng tin để nghe các thông báo mới dán.", "g": [1], "why": "Ý đầu tiên gợi ý: Người dùng: bạn khiếm thị. Dữ liệu: ảnh chụp tờ thông báo. Lúc dùng: khi có thông báo mới. Việc AI làm: đọc chữ trong ảnh thành giọng nói. Phép mẫu L. Ghi chú cho GV: Bạn bè đọc thành tiếng giúp cũng là giải pháp tốt; AI giúp bạn tự đọc khi không có ai bên cạnh. Không hướng câu chuyện vào một HS thật. Lớp có HS khiếm thị hoặc khuyết tật khác thì GV cân nhắc thay thẻ 6 bằng thẻ trắng."}, {"t": "THẺ VẤN ĐỀ SỐ 7. XE BUÝT ĐƯA ĐÓN ĐẾN TRỄ. Ai gặp khó: HS đi xe buýt đưa đón và phụ huynh các em. Chuyện gì xảy ra: Buổi sáng có hôm xe đến trạm sớm, có hôm muộn mười lăm, hai mươi phút; HS đứng chờ không biết còn bao lâu, có bạn bỏ về nhờ bố mẹ chở. Họ đang xoay xở thế nào: Gọi điện hỏi bạn đã lên xe ở trạm trước; phụ huynh nhắn hỏi nhau trong nhóm tin nhắn của tuyến xe. Tình huống giả định. — Phương án mẫu của nhóm: giữ nguyên bốn yếu tố, ghép với nhóm tin nhắn của phụ huynh tuyến xe đã có: giờ dự đoán gửi vào nhóm đó.", "g": [2], "why": "Ý đầu tiên gợi ý: Người dùng: HS ở trạm. Dữ liệu: giờ xe đến trạm các ngày trước. Lúc dùng: buổi sáng. Việc AI làm: dự đoán giờ xe đến trạm. Phép mẫu G. Ghi chú cho GV: Câu (2) dễ trượt: nếu chỉ dựa vào giờ xe đến các ngày trước thì lấy trung bình là đủ, không cần AI; AI có ích khi giờ xe đổi theo nhiều yếu tố (thời tiết, ngày phiên chợ, đoạn đường đang sửa). GV hỏi “Việc này có cần AI không?”; nhóm thêm thời tiết, lịch vào dữ liệu (phép D) thì ghi nhận. Không cần vị trí của từng HS."}, {"t": "THẺ VẤN ĐỀ SỐ 8. ÔNG BÀ NHẬN TIN NHẮN LỪA ĐẢO. Ai gặp khó: Ông bà ở nhà khi con cháu đi học, đi làm. Chuyện gì xảy ra: Tin nhắn, cuộc gọi lạ báo trúng thưởng hoặc báo người nhà gặp chuyện rồi đòi chuyển tiền ngày càng giống thật; người ở lứa tuổi nào cũng có thể nhầm. Ông bà hay nhận những tin như vậy khi ở nhà một mình. Họ đang xoay xở thế nào: Thấy nghi ngờ thì gọi hỏi con cháu; nhiều khi không gọi được ngay. Tình huống giả định. — Phương án mẫu của nhóm: giữ tin nhắn ông bà nhận, lúc tin đến và việc nhận ra dấu hiệu lừa đảo; chỉ đổi người dùng thành con cháu ở xa, nhận cảnh báo khi ông bà nhận tin đáng ngờ.", "g": [0], "why": "Ý đầu tiên gợi ý: Người dùng: ông bà. Dữ liệu: nội dung tin nhắn nhận được. Lúc dùng: khi tin nhắn đến. Việc AI làm: nhận ra tin có dấu hiệu lừa đảo, nhắc ông bà gọi con cháu. Phép mẫu N. Ghi chú cho GV: Không dạy lại cách nhận diện tin giả, chỉ bàn ý tưởng AI. Tin nhắn của ông bà là dữ liệu riêng: hỏi câu (3) “của ai, ai đồng ý?”. Với phép N, ông bà phải đồng ý trước; cảnh báo chỉ báo “có tin đáng ngờ”, không chuyển nội dung tin cho con cháu."}, {"t": "THẺ VẤN ĐỀ SỐ 9. Ổ GÀ TRÊN ĐƯỜNG LÀNG. Ai gặp khó: Người đi xe đạp, xe máy trong thôn (trong đó có HS đạp xe đi học) và cô trưởng thôn. Chuyện gì xảy ra: Đường làng có nhiều ổ gà mới; trời tối hoặc sau cơn mưa khó nhìn thấy, đã có người vấp ngã. Họ đang xoay xở thế nào: Ai thấy ổ gà thì báo miệng cho cô trưởng thôn; đường dài nên cô không nhớ hết chỗ, nhiều ổ gà lâu mới được lấp. Tình huống giả định. — Phương án mẫu của nhóm: giữ ảnh mặt đường, lúc cuối tuần và việc AI nhận ra ổ gà; chỉ đổi người dùng thành HS đạp xe đi học: sơ đồ có đánh dấu ổ gà dán ở nhà văn hoá thôn để các em biết đoạn nào cần đi chậm.", "g": [0], "why": "Ý đầu tiên gợi ý: Người dùng: cô trưởng thôn. Dữ liệu: ảnh mặt đường do người lớn chụp khi đi bộ dọc đường làng (không có người, không có biển số xe). Lúc dùng: cuối tuần. Việc AI làm: nhận ra chỗ nào trong ảnh có ổ gà và đánh dấu trên sơ đồ đường làng. Phép mẫu N. Ghi chú cho GV: AI có thể nhầm vũng nước, bóng cây với ổ gà: cô trưởng thôn ra xem tận nơi trước khi gọi người sửa. Ảnh có người hoặc biển số xe thì bỏ. GV hỏi thêm: “Bằng chứng nào khiến nhóm tin?”: cô trưởng thôn hiện chỉ nhớ các chỗ được báo miệng, còn ảnh chụp cả đường cho thấy cả chỗ chưa ai báo. “Điều gì có thể làm nhóm đổi lựa chọn?”: AI nhầm nhiều vũng nước, bóng cây với ổ gà hoặc ảnh không chụp đủ đường."}, {"t": "THẺ VẤN ĐỀ SỐ 10. CHÓ MÈO ĐI LẠC. Ai gặp khó: Hàng xóm trong thôn, xóm. Chuyện gì xảy ra: Vật nuôi đi lạc; người nhặt được không biết con vật của nhà ai, chủ thì đi tìm khắp nơi. Họ đang xoay xở thế nào: Chủ và người nhặt được nhắn, đăng ảnh trong nhóm tin nhắn của xóm; tin trôi nhanh, nhiều người không xem kịp. Tình huống giả định. — Phương án mẫu của nhóm: giữ nguyên bốn yếu tố, ghép với nhóm tin nhắn của xóm đã có: ảnh khớp nhất gửi vào nhóm để chủ xác nhận.", "g": [2], "why": "Ý đầu tiên gợi ý: Người dùng: người nhặt được. Dữ liệu: ảnh vật nuôi chủ đã đăng. Lúc dùng: khi nhặt được. Việc AI làm: so ảnh con vật nhặt được với ảnh đã đăng. Phép mẫu G. Ghi chú cho GV: Ảnh chỉ có con vật, không có người, không ghi địa chỉ nhà."}], "pass": 0.7}, {"type": "decide", "tag": "HĐ2 • Hình thành kiến thức", "title": "Lọc ý tưởng bằng bộ bốn câu hỏi", "nav": "Bộ bốn câu hỏi", "icon": "🚦", "badge": "Người lọc phương án", "intro": "<b>Bộ bốn câu hỏi</b> (dùng khi lọc phương án và khi góp ý): (1) Đúng người, đúng vấn đề trên thẻ chưa? (2) AI làm đúng một việc gì mà không có AI thì khó làm? Dựa vào dữ liệu nào? (3) Dữ liệu của ai, có được dùng không? Nếu AI sai thì ai quyết định, ai chịu hậu quả? (4) Người dùng đang làm thế nào? Ý tưởng cho họ thêm được điều gì mà cách đó chưa có? Ý tưởng khác ý của các nhóm trong lớp ở đâu? Luôn tự hỏi: Bằng chứng nào khiến em tin? Điều gì có thể làm kết luận thay đổi? Câu (4) xét ý tưởng có mới không: mới so với cách người dùng đang làm và so với ý của các nhóm trong lớp, không phải “chưa ai làm”. Quét từng ý tưởng qua các câu hỏi rồi chọn kết luận.", "questions": ["(1) Đúng người, đúng vấn đề trên thẻ chưa?", "(2) AI làm đúng một việc mà không có AI thì khó làm?", "(3) Dữ liệu được phép dùng; có người quyết định cuối cùng?", "(4) Cho người dùng thêm được điều cách đang làm chưa có?"], "verdicts": ["Giữ ý tưởng", "Cần sửa", "Bỏ hoặc không cần AI"], "rules": [{"when": [0, null, null, null], "v": 2}, {"when": [null, 0, null, null], "v": 2}, {"when": [null, null, 0, null], "v": 1}, {"when": [null, null, null, 0], "v": 1}, {"when": [null, null, null, null], "v": 0}], "cases": [{"t": "Thẻ 1 (đồ thất lạc): ý “AI nhận ra loại đồ để xếp theo loại”.", "v": 2, "why": "Không cần AI (bác nhìn là biết); AI có ích khi phải so một lời mô tả với rất nhiều đồ đã nhận. GV hỏi “Việc này có cần AI không?”."}, {"t": "Thẻ 2 (rau của bà): ý “AI cộng số bó” khi tin nhắn đã ghi rõ số.", "v": 1, "why": "Nhóm kết luận “chỉ cộng thì không cần AI” là đúng câu (2); GV gợi ý nhóm chuyển việc AI làm sang đọc hiểu tin nhắn viết tự do, hoặc dự đoán số bó bán cho khách đến chợ từ số bó bán được các phiên trước, thời tiết, ngày phiên chợ."}, {"t": "Thẻ 3 (hòm thư góp ý): ý “gõ lại thành chữ” các phiếu viết tay.", "v": 1, "why": "GV hỏi: ai gõ, có nhanh hơn đọc không? Phương án tốt là AI xếp các góp ý có cùng ý vào một nhóm chủ đề; thầy cô vẫn đọc và quyết định, xem lại phiếu gốc."}, {"t": "Thẻ 4 (quạt, đèn quên tắt): ý “AI nhận ra phòng sáng đèn từ ảnh chụp cửa sổ”.", "v": 2, "why": "Không cần AI (đứng ở sân nhìn cũng thấy) và ảnh không cho biết quạt còn chạy; GV hỏi “Việc này có cần AI không?”. Bác vẫn đến tận tầng để kiểm tra và tắt."}, {"t": "Thẻ 4: nhóm kết luận “dùng hẹn giờ, công tắc tổng hoặc phân công kiểm tra là đủ, không cần AI”.", "v": 2, "why": "Đây là lập luận đạt câu (2); nhóm được chọn thẻ còn lại."}, {"t": "Thẻ 5 (sân cầu lông): AI dự đoán giờ trống, nhưng chỉ cần đếm sổ đăng kí là biết giờ nào trống.", "v": 2, "why": "Nếu chỉ cần đếm sổ là biết giờ nào trống thì không cần AI; AI có ích khi giờ trống đổi theo nhiều yếu tố (tuần thi, thời tiết, lịch câu lạc bộ khác)."}, {"t": "Thẻ 7 (xe buýt trễ): AI dự đoán giờ xe chỉ dựa vào giờ xe đến các ngày trước.", "v": 1, "why": "Chỉ dựa vào giờ xe các ngày trước thì lấy trung bình là đủ, không cần AI; nhóm thêm thời tiết, lịch vào dữ liệu (phép D) thì ghi nhận."}, {"t": "Thẻ 9 (ổ gà): AI nhận ra ổ gà trong ảnh mặt đường không có người, không có biển số xe; cô trưởng thôn ra xem tận nơi trước khi gọi người sửa.", "v": 0, "why": "Đủ cả bốn câu: đúng người, AI làm đúng một việc, dữ liệu được phép dùng và cô trưởng thôn quyết định, cho cô sơ đồ cả những chỗ chưa ai báo."}, {"t": "Thẻ 9: chụp cả người đi đường để biết chỗ nào nhiều người qua lại.", "v": 1, "why": "Ảnh có người là dữ liệu cá nhân và việc nhận ra ổ gà không cần người trong ảnh; ảnh có người hoặc biển số xe thì bỏ."}]}, {"type": "order", "tag": "HĐ2 • Hình thành kiến thức", "title": "Đường đi của ý tưởng", "nav": "Đường đi ý tưởng", "icon": "🛤️", "badge": "Người dẫn đường", "intro": "Sắp xếp các bước của dải Đường đi của ý tưởng (ô A, B, C) và Khung ý tưởng theo đúng thứ tự trong tiết học.", "items": ["Nhóm lật thẻ, chọn một vấn đề và viết ý đầu tiên vào ô A với đủ bốn yếu tố: người dùng, dữ liệu, lúc dùng, việc AI làm", "Mỗi HS viết một phương án lên giấy nhớ theo Bảng bốn phép tạo phương án, có kí hiệu phép (N, D, L hoặc G) và tên viết tắt", "Nhóm lọc phương án bằng bộ bốn câu hỏi và ghi phương án chọn vào ô B (hơn phương án khác ở chỗ nào)", "Nhóm điền sáu ô ① đến ⑥ của Khung ý tưởng cho phương án ở ô B", "Nhóm lật dải góp ý mẫu, kiểm tra từng góp ý rồi ghi vào phiếu kiểm tra góp ý (đúng, sai hay chưa chắc; giữ, sửa hay bỏ)", "Đọc khung nhóm bạn, để lại giấy nhớ góp ý theo câu (4), ghi dòng đối chiếu; nhận lại khung, sửa và ghi ô C; mỗi HS viết Phiếu học tập số 2"], "why": "Nhóm bí ở ô A: AI có thể nhận ra, dự đoán hay gợi ý điều gì giúp người trên thẻ, dựa vào dữ liệu nào? Ba phép N, D, L mỗi phép chỉ đổi một yếu tố và giữ việc AI làm; phép G ghép thêm một thứ đã có. Nhóm quyết định và chịu trách nhiệm về quyết định đó."}, {"type": "build", "tag": "HĐ3 • Luyện tập", "title": "Khung ý tưởng sáu ô (ví dụ bình nước uống)", "nav": "Khung ý tưởng", "icon": "🧩", "badge": "Nhà thiết kế ý tưởng", "intro": "Điền sáu ô cho phương án ở ô B. Ô ④ lấy cách người dùng đang làm từ dòng thứ ba của thẻ. Không ghi tên, ảnh, số điện thoại của người thật. Câu hỏi then chốt: Dữ liệu ở ô ③ có đủ để AI làm việc ở ô ② không? Việc đó giúp người trên thẻ thế nào? Nhóm nêu được dữ liệu cần có của nhiều lần, nhiều hoàn cảnh để AI nhận ra, dự đoán hay gợi ý được. Với ví dụ bình nước: số bình rỗng bác bảo vệ đếm mỗi chiều chỉ cho biết số của hôm trước; muốn ước lượng thì cần số bình đã dùng của nhiều ngày, nhiều mùa, kể cả các ngày hội trước. Nhóm nhanh trả lời thêm ở ô ③: dữ liệu này có thể thiếu nhóm người nào?", "fields": [{"id": "o1", "label": "① Ý tưởng một câu", "ph": "AI gợi ý số bình nước cần đặt cho ngày mai để các lớp không hết nước giữa buổi."}, {"id": "o2", "label": "② AI làm đúng một việc gì? Ai quyết định cuối cùng?", "ph": "AI ước lượng số bình; cô phụ trách quyết định đặt bao nhiêu; bác bảo vệ vẫn đếm bình rỗng hằng chiều."}, {"id": "o3", "label": "③ Dữ liệu nào, lấy ở đâu, có đủ không? Của ai, có được dùng không? (Dữ liệu này có thể thiếu nhóm người nào?)", "ph": "Số bình đã dùng từng ngày (sổ đặt nước của trường, nhà trường quản lí), lịch thể dục, lịch hoạt động ngoài trời, dự báo nhiệt độ (thông tin công bố chung); không có tên HS. Sổ đặt nước và lịch của trường cần nhà trường đồng ý cho dùng."}, {"id": "o4", "label": "④ Mới ở đâu: người dùng đang làm thế nào, ý tưởng làm được gì mà cách đó chưa làm được? Khác ý các nhóm trong lớp ở đâu?", "ph": "Hiện nay cô chỉ đặt theo số bình rỗng của hôm trước; ý tưởng dự tính được trước những ngày khác thường (ngày hội, trời nắng nóng)."}, {"id": "o5", "label": "⑤ Lợi ích dự kiến và một cách thử", "ph": "HS không bị thiếu nước giữa buổi; thử hai tuần, so số bình AI gợi ý với số bình thực dùng."}, {"id": "o6", "label": "⑥ Một rủi ro và cách xử lí", "ph": "AI gợi ý thiếu khi có hoạt động không ghi trong lịch; cô đặt dư một, hai bình và dặn lớp nào sắp hết nước thì báo bác bảo vệ để cô gọi giao thêm."}], "checks": ["Dữ liệu ở ô ③ đủ cho việc AI làm ở ô ②; nêu được lợi ích cho đúng người trên thẻ.", "Ô ④ ghi điểm mới so với cách người dùng đang làm và so với các nhóm trong lớp, không ghi “chưa ai làm”.", "Ô ③, ô ⑥: với dữ liệu về người, nêu được cần ai đồng ý; một rủi ro khi AI sai và cách con người kiểm tra lại.", "Mức Tốt: chỉ ra điều kiện để dùng một loại dữ liệu có rủi ro (ai đồng ý, dữ liệu tối thiểu nào, ai được xem) và cách dùng ít dữ liệu cá nhân nhất."], "sample": "Đáp án mẫu sáu ô cho ví dụ bình nước uống như các gợi ý trong từng ô: ô ③ nêu số bình đã dùng của nhiều ngày, lịch hoạt động ngoài trời, dự báo nhiệt độ; ô ⑥ cô đặt dư một, hai bình. Nhóm chỉ ra được người dùng không có mặt trong dữ liệu, ví dụ HS khối khác, bạn khuyết tật, bác bảo vệ, phụ huynh."}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Kiểm tra năm góp ý mẫu", "nav": "Kiểm tra góp ý", "icon": "🧐", "badge": "Người kiểm tra góp ý", "intro": "Mỗi dải có nhãn “Góp ý mẫu do GV soạn để luyện tập” (không phải góp ý của công cụ AI). Kiểm tra từng góp ý bằng thẻ vấn đề, bài đã học hoặc so với các nhóm khác; điều chỉ người dùng thật mới biết thì ghi “chưa chắc, cần hỏi người dùng”. Góp ý này đúng, sai hay chưa chắc? Kiểm tra bằng gì? Rồi quyết định giữ, sửa hay bỏ. Câu hỏi: Bằng chứng nào khiến nhóm tin? Nhóm chỉ ra được chỗ đã kiểm tra (dòng nào của thẻ, so với nhóm nào) và điều còn chưa biết.", "cats": ["Đúng", "Sai", "Chưa chắc"], "cards": [{"t": "GÓP Ý SỐ 1. Góp ý mẫu do GV soạn để luyện tập: “Ý tưởng hay quá, làm ngay đi!”", "g": [2], "why": "Chưa chắc: lời khen không phải bằng chứng; “làm ngay” bỏ qua bước thử. Không nên tin ngay. Hỏi lại: ý tưởng làm được gì mà cách người dùng đang làm (trên thẻ) không làm được? Không thêm gì vào khung từ góp ý này."}, {"t": "GÓP Ý SỐ 2. Góp ý mẫu do GV soạn để luyện tập: “Chắc chắn chưa ai làm ý tưởng này.”", "g": [2], "why": "Chưa chắc: trong lớp không có cách kiểm tra toàn bộ những gì đã có ngoài đời. Chỉ kiểm tra được so với cách người dùng đang làm và các nhóm trong lớp; ô ④ ghi “mới so với cách đang làm trên thẻ và so với các nhóm trong lớp”, không ghi “chưa ai làm”."}, {"t": "GÓP Ý SỐ 3. Góp ý mẫu do GV soạn để luyện tập: “Nên thử trước với một nhóm nhỏ người dùng trong hai tuần rồi mới mở rộng.”", "g": [0], "why": "Đúng, hữu ích. Giữ: ghi vào ô ⑤ phần “một cách thử”. Nhóm vẫn là người quyết định thử với ai, thử bao lâu. Kết luận có thể đổi nếu thử với nhóm nhỏ thấy ý tưởng không giúp được ai."}, {"t": "GÓP Ý SỐ 4. Góp ý mẫu do GV soạn để luyện tập: “Nên thu thập thật nhiều thông tin riêng của từng người dùng (họ tên, ảnh, số điện thoại, nơi ở) để AI gợi ý chính xác hơn.”", "g": [1], "why": "Sai ở dạng hiện tại: “thật nhiều thông tin riêng” trái với cách dùng dữ liệu tối thiểu; họ tên, ảnh, số điện thoại, nơi ở là thông tin xác định hoặc giúp xác định một người cụ thể. Chỉ chấp nhận khi trả lời được: ai đồng ý; dùng dữ liệu tối thiểu nào (việc của AI có thật cần thông tin đó không); ai được xem; có cách làm không cần dữ liệu cá nhân không. Thường sửa: chỉ giữ thông tin thật cần cho việc AI làm; bỏ thông tin xác định danh tính hoặc dùng số liệu gộp không gắn với từng người."}, {"t": "GÓP Ý SỐ 5. Góp ý mẫu do GV soạn để luyện tập: “Chỉ cần hỏi ý kiến lớp mình là đủ biết mọi người cần gì.”", "g": [1], "why": "Sai: bỏ sót những nhóm người dùng khác. Hỏi: ai đang vắng mặt (HS khối khác, bạn khuyết tật, bác bảo vệ, phụ huynh…)? Ghi bổ sung vào ô ③ “có thể thiếu nhóm người nào”."}], "pass": 0.8}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Góp ý khung nhóm bạn, sửa và Phiếu cuối giờ", "nav": "Góp ý và phiếu cuối giờ", "icon": "📝", "badge": "Nhà phản biện", "intro": "Đọc Phiếu học tập số 1 của nhóm bạn, để lại ít nhất một giấy nhớ góp ý theo câu (4), ghi dòng đối chiếu; nhận lại khung của nhóm mình, sửa và ghi ô C. Sau đó mỗi HS tự viết Phiếu học tập số 2 bằng lời của mình, không trao đổi với bạn (ví dụ dưới đây theo thẻ 9). Giấy nhớ chỉ ghi ý kiến về ý tưởng, không nêu tên người thật. Câu hỏi: Khung của nhóm bạn đã trả lời được câu (4) của bộ bốn câu hỏi chưa? Ý tưởng ấy khác hay giống ý nhóm mình ở việc AI làm, ở dữ liệu? Theo góp ý nhận được, nhóm sửa điểm nào, góp ý nào không theo và vì sao?", "fields": [{"id": "g4", "label": "Giấy nhớ góp ý cho câu (4) (và có thể thêm câu (3))", "hint": "Ví dụ: khung thẻ 9 do nhóm 1 đọc", "ph": "Cô trưởng thôn có thêm được gì ngoài việc nghe báo miệng? Ô ④ đã ghi chưa? / Có nên chụp cả người đi đường để biết chỗ nào nhiều người qua lại không?"}, {"id": "dc", "label": "Dòng đối chiếu (nhóm bạn ghi): Nhóm …… đã đọc. Ý nhóm bạn khác / giống ý nhóm mình ở: việc AI làm / dữ liệu", "ph": "Nhóm 1 đã đọc. Ý nhóm bạn khác ý nhóm mình ở: dữ liệu. Cụ thể: nhóm bạn dùng ảnh mặt đường, nhóm mình dùng tin nhắn đặt rau. Đại diện nhóm kí: ……"}, {"id": "oc", "label": "Ô C: Sau góp ý, đã sửa …… theo góp ý ……; góp ý không theo: vì sao", "ph": "Sau góp ý, đã sửa ô ④ theo giấy nhớ câu (4) của nhóm 1: ghi thêm cô có sơ đồ cả những chỗ chưa ai báo. Không theo góp ý chụp cả người đi đường, vì ảnh có người là dữ liệu cá nhân và việc nhận ra ổ gà không cần người trong ảnh."}, {"id": "p1", "label": "Phiếu 2, câu 1: Ý tưởng em đề xuất là ……, giúp người trên thẻ …… AI làm đúng một việc là …… dựa vào dữ liệu ……; người quyết định cuối cùng là ……", "ph": "Ý tưởng em đề xuất là AI xem ảnh mặt đường người lớn chụp khi đi bộ dọc đường làng mỗi cuối tuần, nhận ra chỗ có ổ gà và đánh dấu lên sơ đồ, giúp cô trưởng thôn biết đủ các chỗ cần lấp. AI làm đúng một việc là nhận ra ổ gà trong ảnh, dựa vào ảnh mặt đường không có người, không có biển số xe; người quyết định cuối cùng là cô trưởng thôn."}, {"id": "p2", "label": "Phiếu 2, câu 2: Người trên thẻ đang làm thế nào? Ý tưởng làm được điều gì mà cách đó chưa làm được?", "ph": "Hiện mọi người báo miệng, cô không nhớ hết; ý tưởng cho cô sơ đồ đủ các chỗ mỗi tuần, kể cả chỗ chưa ai báo."}, {"id": "p3", "label": "Phiếu 2, câu 3: Phương án em viết trên giấy nhớ là …… (phép N, D, L hoặc G). Nhóm có chọn phương án đó không? Vì sao?", "ph": "Phương án em viết là cho HS đạp xe đi học xem sơ đồ dán ở nhà văn hoá thôn (phép N); nhóm không chọn, vì người lo việc lấp ổ gà là cô trưởng thôn."}], "checks": ["Câu 1 nêu đủ vế đề xuất ý tưởng, AI làm việc gì, dựa vào dữ liệu nào, giúp người gặp khó điều gì; viết bằng lời của em, không chép nguyên ô B.", "Câu 2 nêu cách người trên thẻ đang làm và điểm mới; câu 3 có phép N, D, L hoặc G và lí do chọn hay không chọn.", "Mức Khá: câu 1 giải thích được vì sao dữ liệu đã nêu đủ cho việc AI làm; câu 3 nêu lí do dựa vào ít nhất một câu của bộ bốn câu hỏi; nêu được kiểm tra bằng gì cho từng góp ý.", "Mức Tốt: nêu được vì sao việc đó cần AI (nhiều dữ liệu, nhiều yếu tố cùng tác động); câu 2 so được điểm mới với cả cách người dùng đang làm lẫn ý của một nhóm khác trong lớp; giải thích vì sao giữ, sửa hay bỏ từng góp ý."], "sample": "Ví dụ chưa tới mức Đạt: “Dùng AI để sửa ổ gà cho thôn.” Phiếu không nêu AI làm việc gì, dựa vào dữ liệu nào, không nêu cách thôn đang làm. Phiếu đạt: nêu đủ các vế như ví dụ thẻ 9. Kết luận có thể thay đổi nếu thử hai tuần thấy sơ đồ của AI sót hoặc nhầm nhiều chỗ. HS viết chậm ghi câu 3 dạng ngắn (kí hiệu phép và “chọn” hoặc “không chọn”). Mẫu nhận xét: “Em đã nêu rõ AI nhận ra ổ gà trong ảnh mặt đường và cô trưởng thôn là người quyết định. Câu 2 của em còn chung. Lần sau, em đọc lại dòng thứ ba của thẻ và nêu cô đang làm thế nào trước khi nói ý tưởng thêm được gì.”"}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 9 • Môn đảm nhiệm: Công nghệ • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const ZCOL=['#2ecc71','#f6c744','#ef5350','#4aa3ff','#9b59b6'];
const ZI=['🟢','🟡','🔴','🔵','🟣'];
let ST,step=0,MUTE=false;const MODS=SPEC.modules;
function fresh(){ST={pts:0,done:MODS.map(()=>0),got:MODS.map(()=>0),m:MODS.map(()=>({}))}}
fresh();
function maxPts(){return MODS.reduce((a,m,i)=>a+(mp(m)),0)}
function mp(m){switch(m.type){case'story':return m.chars.length*5;case'sort':return m.cards.length*3;case'quiz':return m.qs.length*4;case'order':return 10;case'decide':return m.cases.length*5;case'flag':return 10;case'lab':return 6;case'match':return m.pairs.length*2;case'build':return 6;default:return 0}}
function award(i,p){ST.got[i]+=p;ST.pts+=p;$('#score').textContent='⭐ '+ST.pts}
let AC;function beep(f,d=.12,t='sine'){if(MUTE)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

 md.fields.forEach(f=>{cm.appendChild(E('label','f',esc(f.label)+(f.hint?` <small class="h">(${esc(f.hint)})</small>`:'')));let el;if(f.opts){el=E('select');el.innerHTML='<option value="">– Chọn –</option>'+f.opts.map(o=>`<option ${s.f[f.id]===o?'selected':''}>${esc(o)}</option>`).join('');el.onchange=()=>s.f[f.id]=el.value}else{el=E(f.long===false?'input':'textarea');if(f.long===false)el.type='text';el.value=s.f[f.id]||'';el.placeholder=f.ph||'';el.oninput=()=>s.f[f.id]=el.value}cm.appendChild(el)});c.appendChild(cm);
 if(md.checks){c.appendChild(E('h3',null,'Tự kiểm tra bằng bảng kiểm'));md.checks.forEach((t,k)=>{const d=E('label','chk',`<input type="checkbox" ${s.c[k]?'checked':''}> <span>${esc(t)}</span>`);d.querySelector('input').onchange=e=>s.c[k]=e.target.checked;c.appendChild(d)})}
 const b=E('button','btn','Hoàn thành & chấm tự đánh giá');b.onclick=()=>{const filled=md.fields.filter(f=>(s.f[f.id]||'').trim().length>=4).length,chk=Object.values(s.c).filter(Boolean).length;if(!s.rs){s.rs=1;award(i,Math.round(6*(filled/md.fields.length*.6+(md.checks?chk/md.checks.length:1)*.4)))}good();ST.done[i]=1;go(i)};c.appendChild(b);
 const dl=E('button','btn w','⬇ Lưu thành ảnh PNG');dl.onclick=()=>{const cv=document.createElement('canvas');cv.width=1000;cv.height=720;const x=cv.getContext('2d');x.fillStyle='#fffdf3';x.fillRect(0,0,1000,720);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--o');x.lineWidth=10;x.strokeRect(8,8,984,704);x.fillStyle='#1f2d3d';x.font='bold 30px Arial';x.fillText(md.title.slice(0,50),36,64);let y=110;const w=(t,y0,fs)=>{x.font=fs;const ws=String(t).split(' ');let l='';let yy=y0;for(const a of ws){if(x.measureText(l+a).width>920){x.fillText(l,36,yy);yy+=28;l=''}l+=a+' '}x.fillText(l,36,yy);return yy+34};md.fields.forEach(f=>{x.fillStyle='#d35400';y=w(f.label,y,'bold 20px Arial');x.fillStyle='#1f2d3d';y=w(s.f[f.id]||'……',y,'20px Arial')});const a=document.createElement('a');a.href=cv.toDataURL();a.download='san-pham-cua-em.png';a.click()};c.appendChild(dl);
 if(ST.done[i]){c.appendChild(E('div','fb ok','✅ Đã lưu bài làm. '+(md.sample?'<br><b>Gợi ý mẫu:</b> '+esc(md.sample):'')));finish(c,i)}m.appendChild(c)};
/* ---- result ---- */
function result(m){const c=E('div','card');const mx=maxPts()||1,pc=Math.min(100,Math.round(ST.pts/mx*100));
 c.innerHTML=`<h2>🏁 Kết quả của em</h2><p class="lead">Tổng điểm: <b>${ST.pts}</b> / ${mx} (${pc}%)</p><div class="bar" style="height:18px"><i style="width:${pc}%"></i></div><div style="text-align:center;margin:14px 0">`+MODS.map((x,k)=>`<span class="badge ${ST.done[k]?'on':''}">${x.icon||'⭐'}<small>${esc(x.badge||x.nav||x.title).slice(0,28)}</small></span>`).join('')+`</div>
 <table><tr><th>Hoạt động</th><th>Điểm</th></tr>`+MODS.map((x,k)=>`<tr><td>${esc(x.title)}</td><td>${ST.got[k]}/${mp(x)}</td></tr>`).join('')+`</table>
 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}
$('#ttl').textContent=SPEC.title;$('#sub').textContent=SPEC.sub||'';$('#ico').textContent=SPEC.icon||'🧭';
go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
</script></body></html>
