<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 3. Người dùng có trách nhiệm và ứng phó nội dung giả mạo do AI – Lớp 9</title>
<style>
:root{--o:#27ae60;--od:#1d8248;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🛡️", "title": "Bài 3. Người dùng có trách nhiệm và ứng phó nội dung giả mạo do AI – Lớp 9", "ainote": "Mọi tin nhắn, ảnh, giọng nói và nhân vật (Minh, Lan) đều là giả định; không dùng tin nhắn, ảnh, giọng nói thật của HS hay người quen. Kết luận “có dấu hiệu giả mạo” là nhận định của con người, cần xác minh thêm. Không tạo, không phát tán nội dung giả mạo, kể cả để trêu đùa; Ca 1 không chia sẻ lại ảnh chế giễu; Ca 2 không chuyển tiền, không đọc mã OTP. Quyết định cuối cùng do con người, có người lớn cùng xử lí. Không ghi thông tin cá nhân thật; dùng AI cho sản phẩm học tập phải khai báo.", "takeaways": ["Nội dung giả mạo do AI tạo ra thường lộ ở dấu hiệu nội dung: yêu cầu bất thường (chuyển tiền, cung cấp thông tin cá nhân, mã OTP), thúc ép làm gấp, nguồn không rõ. Nội dung có thể kèm chi tiết hình ảnh lạ, giọng nói thiếu tự nhiên. Dấu hiệu nhận biết bằng mắt, bằng tai ngày càng khó phát hiện, vì vậy xác minh nguồn qua kênh khác vẫn là cách đáng tin cậy nhất.", "Khi gặp nội dung nghi giả mạo, làm theo năm bước. Dừng tương tác; kiểm chứng qua kênh khác (gọi lại số quen của người thân, hỏi thầy cô, xem trang chính thức); lưu bằng chứng (người gửi, thời gian, nội dung chính); báo cáo, cảnh báo (cha mẹ, thầy cô, chức năng báo cáo của nền tảng); không phát tán (bằng chứng chỉ chuyển cho người có trách nhiệm xử lí; chuyển tiếp chỉ làm nội dung lan rộng thêm).", "Kiểm chứng và ứng phó là trách nhiệm của mỗi người dùng; cảnh báo đúng kênh giúp người khác không bị lừa tiếp. Mỗi người gặp nội dung giả mạo đều có việc để làm, lớp và nhà trường có kênh để nhận phản hồi.", "Người dùng kiểm tra trước khi tin, dùng hoặc chia sẻ. Người dùng chịu trách nhiệm về sản phẩm cuối cùng mình đưa ra, kể cả phần có AI hỗ trợ; khai báo trung thực khi dùng AI làm sản phẩm học tập."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Tin nhắn này có đáng tin?", "nav": "Tin nhắn đáng tin?", "icon": "📨", "badge": "Người cân nhắc", "intro": "<b>Kịch bản mở đầu.</b> “Một buổi tối, Minh nhận được một tin nhắn từ một số lạ thông báo rằng cậu đã trúng thưởng một chiếc điện thoại mới. Tin nhắn yêu cầu Minh cung cấp thông tin cá nhân để nhận thưởng. Cùng lúc đó, Lan, bạn của Minh, nhận được một tin nhắn giọng nói từ người tự xưng là giáo viên của lớp, yêu cầu chuyển tiền gấp để mua tài liệu ôn thi cho lớp. Minh và Lan đều thấy nghi ngờ và không biết nên làm gì.” (Minh, Lan là tên giả định.) Ba phương án: 1. Tin ngay và chia sẻ; 2. Kiểm tra nguồn trước khi tin; 3. Bỏ qua vì không tin tưởng. Câu hỏi: vì sao em chọn phương án đó? Câu hỏi được để ngỏ tới cuối bài. Vấn đề học tập: trước một tin nhắn đáng ngờ, người dùng cần dựa vào dấu hiệu nào và làm gì để vừa an toàn cho mình vừa có trách nhiệm với người khác. (Tình huống thay thế theo địa phương, giả định: vùng nông thôn, miền núi: tin nhắn mạo danh một tổ chức từ thiện yêu cầu quyên góp; đô thị: thư điện tử giả mạo một ngân hàng yêu cầu cập nhật thông tin tài khoản; không nêu tên tổ chức, ngân hàng có thật.)", "app": "📱 Tin nhắn (mô phỏng)", "hello": "Bạn đã trúng thưởng một chiếc điện thoại mới! Hãy cung cấp thông tin cá nhân để nhận thưởng. (tin nhắn giả định từ số lạ)", "meters": [{"n": "An toàn của em", "b": 50, "c": 0}, {"n": "An toàn của người khác", "b": 50, "c": 1}, {"n": "Niềm tin vào thông tin", "b": 50, "c": 2}], "chars": [{"n": "Minh: tin trúng thưởng", "color": "#4aa3ff", "task": "nhận tin nhắn từ số lạ báo trúng thưởng điện thoại, yêu cầu cung cấp thông tin cá nhân. Minh nên chọn phương án nào?", "opts": [{"t": "1. Tin ngay và chia sẻ", "chat": ["Mình trúng thưởng rồi! Mình gửi thông tin cá nhân nhé.", "(người lạ nhận thông tin cá nhân của Minh)"], "ch": [-40, -35, -30], "v": "bad", "fb": "Phương án 1 có thể làm mất tiền, lộ thông tin cá nhân và làm tin giả lan rộng."}, {"t": "2. Kiểm tra nguồn trước khi tin", "chat": null, "ch": [30, 25, 30], "v": "good", "fb": "Phương án 2 là lựa chọn an toàn nhất vì giúp xác thực thông tin trước khi hành động. Minh không nhớ đã tham gia cuộc thi nào, tin đến từ số lạ, đòi thông tin cá nhân."}, {"t": "3. Bỏ qua vì không tin tưởng", "chat": null, "ch": [20, -15, 0], "v": "mid", "fb": "Phương án 3 an toàn cho bản thân nhưng chưa đủ khi tin có thể lừa thêm người khác: cần kiểm chứng và báo người lớn."}]}, {"n": "Lan: tin nhắn giọng nói", "color": "#ff9f43", "task": "nhận tin nhắn giọng nói từ người tự xưng là giáo viên của lớp, yêu cầu chuyển tiền gấp để mua tài liệu ôn thi. Lan nên chọn phương án nào?", "opts": [{"t": "1. Tin ngay và chia sẻ", "chat": null, "ch": [-40, -35, -30], "v": "bad", "fb": "Phương án 1 có thể làm mất tiền và làm tin giả lan rộng. Người gửi tự xưng là giáo viên nhưng gửi qua tin nhắn giọng nói, đòi chuyển tiền gấp, không theo cách nhà trường thường thông báo."}, {"t": "2. Kiểm tra nguồn trước khi tin", "chat": null, "ch": [30, 25, 30], "v": "good", "fb": "Phương án 2 an toàn nhất: hỏi trực tiếp giáo viên ở trường hoặc nhờ cha mẹ gọi số của giáo viên mà gia đình đã biết. GV chưa nhận xét đúng sai ở HĐ 1; câu trả lời đầy đủ được chốt ở HĐ 4."}, {"t": "3. Bỏ qua vì không tin tưởng", "chat": null, "ch": [20, -15, 0], "v": "mid", "fb": "An toàn cho bản thân nhưng chưa đủ khi tin có thể lừa thêm người khác: cần kiểm chứng và báo người lớn."}]}]}, {"type": "flag", "tag": "HĐ2.1 • Dấu hiệu nội dung giả mạo", "title": "Hồ sơ nhóm: ba thẻ tình huống", "nav": "Dấu hiệu giả mạo", "icon": "🔍", "badge": "Thám tử giả mạo", "intro": "<b>HỒ SƠ NHÓM: CÂU CHUYỆN CỦA MINH VÀ LAN (GIẢ ĐỊNH).</b> Minh (tên giả định) là học sinh lớp 9. Minh nhận được một tin nhắn từ một người lạ thông báo rằng cậu đã trúng thưởng một chiếc điện thoại mới. Tin nhắn yêu cầu Minh cung cấp thông tin cá nhân để nhận thưởng. Minh thấy nghi ngờ vì không nhớ đã tham gia cuộc thi nào. Cùng lúc đó, Lan, bạn của Minh, nhận được một tin nhắn giọng nói từ người tự xưng là giáo viên của lớp, yêu cầu chuyển tiền gấp để mua tài liệu ôn thi cho lớp. Thẻ 1: Ảnh ghép với ánh sáng không đồng đều; bàn tay trong ảnh có số ngón bất thường, ngón tay dính vào đồ vật đang cầm. Thẻ 2: Đoạn âm thanh mạo danh giáo viên, giọng nói không rõ ràng và có phần thúc giục khẩn cấp. Thẻ 3: Bản tin trích dẫn nguồn không tồn tại, không có thông tin xác thực.<br>Nhiệm vụ A (Phiếu học tập số 1): ghi dấu hiệu đáng ngờ của từng thẻ, mỗi dấu hiệu kèm một chi tiết làm bằng chứng. Câu hỏi: chỉ dựa vào một chi tiết hình ảnh hay giọng nói, có kết luận chắc chắn được nội dung là giả mạo không? Vì sao? Hãy gắn cờ những chi tiết là dấu hiệu nội dung (yêu cầu bất thường, thúc ép làm gấp, nguồn không rõ, mạo danh) đáng tin hơn để nghi ngờ; chi tiết hình ảnh, giọng nói đứng một mình thì chưa đủ kết luận. Kết luận “có dấu hiệu giả mạo” là nhận định của con người, cần xác minh thêm.", "cols": ["Thẻ", "Chi tiết trên thẻ làm bằng chứng"], "flagWhat": "dấu hiệu nội dung (yêu cầu bất thường, thúc ép, mạo danh, nguồn không rõ)", "rows": [{"c": ["Thẻ 1", "Ảnh ghép với ánh sáng không đồng đều"], "bad": false}, {"c": ["Thẻ 1", "Bàn tay trong ảnh có số ngón bất thường, ngón tay dính vào đồ vật đang cầm"], "bad": false}, {"c": ["Thẻ 2", "Đoạn âm thanh mạo danh giáo viên, giọng nói không rõ ràng"], "bad": false}, {"c": ["Thẻ 2", "Có phần thúc giục khẩn cấp"], "bad": true, "why": "Dấu hiệu nội dung: thúc ép làm gấp. Cách kiểm chứng: gọi lại số điện thoại của giáo viên mà gia đình đã biết hoặc hỏi trực tiếp ở trường; không dùng số trong tin nhắn."}, {"c": ["Thẻ 2", "Nhân danh giáo viên (người gửi tự xưng là giáo viên của lớp)"], "bad": true, "why": "Dấu hiệu nội dung: mạo danh người quen."}, {"c": ["Thẻ 3", "Bản tin trích dẫn nguồn không tồn tại"], "bad": true, "why": "Dấu hiệu nội dung: nguồn không rõ. Cách kiểm chứng: tìm trang chính thức của cơ quan được nêu tên; đối chiếu với báo chí chính thống."}, {"c": ["Thẻ 3", "Không có thông tin xác thực"], "bad": true, "why": "Nguồn không rõ: không có thông tin xác thực."}, {"c": ["Câu chuyện của Minh", "Tin nhắn yêu cầu Minh cung cấp thông tin cá nhân để nhận thưởng; Minh không nhớ đã tham gia cuộc thi nào"], "bad": true, "why": "Dấu hiệu nội dung: yêu cầu bất thường (cung cấp thông tin cá nhân), nguồn không rõ."}, {"c": ["Câu chuyện của Lan", "Yêu cầu chuyển tiền gấp để mua tài liệu ôn thi cho lớp"], "bad": true, "why": "Dấu hiệu nội dung: yêu cầu bất thường (chuyển tiền), thúc ép làm gấp."}, {"c": ["Ví dụ mẫu (tin nhắn khác, không thuộc ba thẻ)", "Tin nhắn ghi “phải chuyển tiền trong 10 phút”"], "bad": true, "why": "Dấu hiệu mẫu: thúc ép làm gấp."}], "after": "Đáp án Nhiệm vụ A. Thẻ 1: chi tiết hình ảnh lạ (ánh sáng không đồng đều; bàn tay sai số ngón, ngón dính vào đồ vật); cách kiểm chứng: tìm ai đăng ảnh đầu tiên; hỏi người trong ảnh hoặc thầy cô. Thẻ 2: giọng nói thiếu tự nhiên; thúc ép làm gấp; mạo danh người quen; cách kiểm chứng: gọi lại số điện thoại của giáo viên mà gia đình đã biết hoặc hỏi trực tiếp ở trường; không dùng số trong tin nhắn. Thẻ 3: nguồn không rõ (trích dẫn nguồn không tồn tại; không có thông tin xác thực); cách kiểm chứng: tìm trang chính thức của cơ quan được nêu tên; đối chiếu với báo chí chính thống. Chỉ dựa vào một chi tiết hình ảnh hay giọng nói thì không kết luận chắc chắn được: ảnh thật có thể bị mờ, lệch sáng; giọng thật qua điện thoại có thể ngắt quãng. Ngược lại, nội dung giả mạo do AI tạo ra ngày càng giống thật, dấu hiệu nhận biết bằng mắt, bằng tai ngày càng khó phát hiện. Vì vậy cần chú ý dấu hiệu nội dung (yêu cầu bất thường, thúc ép làm gấp, nguồn không rõ) và xác minh nguồn qua kênh khác. Câu gợi mở: “Điều gì trong hình ảnh, âm thanh khiến các em nghi ngờ?”; “Có cách nào để kiểm tra tính xác thực của thông tin này không?” Thẻ ghi sẵn chữ “ảnh ghép”, “mạo danh”; hãy hỏi lại “Chi tiết nào trên thẻ cho thấy điều đó?” để chỉ ra bằng chứng, không chép lại kết luận."}, {"type": "order", "tag": "HĐ2.2 • Quy trình kiểm chứng và ứng phó", "title": "Năm bước kiểm chứng và ứng phó", "nav": "Quy trình năm bước", "icon": "🧭", "badge": "Người ứng phó", "intro": "Nhiệm vụ B, Phiếu học tập số 1: năm bước đang in không theo thứ tự (Báo cáo, cảnh báo; Dừng tương tác; Không phát tán; Lưu bằng chứng; Kiểm chứng). Hãy sắp xếp theo thứ tự đúng cho tình huống của Minh hoặc Lan. Chấp nhận nhóm đặt “Lưu bằng chứng” trước “Kiểm chứng” nếu giải thích được (giữ lại tin trước khi người gửi xoá). Bước đầu tiên phải là dừng tương tác.", "items": ["1. Dừng tương tác: không bấm đường liên kết, không trả lời, không gửi thông tin cá nhân, không chuyển tiền", "2. Kiểm chứng qua kênh khác: hỏi cha mẹ; xem trang chính thức; hỏi trực tiếp giáo viên hoặc gọi số mà gia đình đã biết", "3. Lưu bằng chứng: ghi lại số gửi, thời gian, nội dung chính", "4. Báo cáo, cảnh báo: báo cha mẹ, GV chủ nhiệm; dùng chức năng báo cáo của ứng dụng nhắn tin", "5. Không phát tán: không chuyển tiếp tin, không chuyển tiếp đoạn ghi âm"], "why": "“Không phát tán” là việc phải giữ suốt quá trình; nhóm đặt ở bước khác mà nêu được ý này vẫn chấp nhận. Vì sao lưu bằng chứng mà không chuyển tiếp? Lưu bằng chứng để người có trách nhiệm (cha mẹ, thầy cô, nền tảng) xử lí; chuyển tiếp chỉ làm nội dung lan rộng thêm và có thể làm người khác bị lừa. Bằng chứng nào khiến em tin tin nhắn này là giả mạo? Tin của Minh: Minh không tham gia cuộc thi nào, tin đến từ số lạ, đòi thông tin cá nhân. Tin của Lan: người gửi tự xưng là giáo viên nhưng gửi qua tin nhắn giọng nói, đòi chuyển tiền gấp, không theo cách nhà trường thường thông báo. Điều gì có thể làm kết luận thay đổi? Kết quả kiểm chứng qua kênh độc lập: giáo viên xác nhận trực tiếp có thông báo; trang chính thức của công ty công bố chương trình và tên người trúng thưởng. Kể cả khi đó, HS vẫn không gửi thông tin cá nhân, không chuyển tiền qua kênh của tin nhắn lạ mà để cha mẹ xử lí. Hình 2 (quy trình kiểm chứng và ứng phó, sơ đồ minh hoạ) có bốn bước và một ô “Điểm kiểm soát của con người”: Bước 1 Dừng tương tác và kiểm tra nguồn ứng với Dừng tương tác; Kiểm chứng. Bước 2 Lưu bằng chứng và báo cáo ứng với Lưu bằng chứng; Báo cáo, cảnh báo. Bước 3 Không phát tán thông tin chưa kiểm chứng ứng với Không phát tán (không chuyển tiếp nội dung nghi giả mạo, kể cả khi đã kiểm chứng và xác định là giả mạo; bằng chứng chỉ chuyển cho người có trách nhiệm). Bước 4 Đề xuất giải pháp an toàn là phần mở rộng: việc của cá nhân, cộng đồng để người khác không bị lừa tiếp. Ô “Điểm kiểm soát của con người”: quyết định cuối cùng do con người đưa ra, có người lớn cùng xử lí."}, {"type": "match", "tag": "HĐ2.2 • Việc cụ thể từng bước", "title": "Việc cụ thể của từng bước cho Minh và Lan", "nav": "Việc cụ thể từng bước", "icon": "🧩", "badge": "Người lập quy trình", "intro": "Ghép mỗi bước với việc cụ thể trong hai tình huống: tin trúng thưởng của Minh và tin nhắn giọng nói Lan nhận được. Người nhận báo cáo, cảnh báo trong tình huống này: cha mẹ, GV chủ nhiệm, ứng dụng nhắn tin (chức năng báo cáo).", "pairs": [["Dừng tương tác", "Minh: không bấm đường liên kết, không trả lời, không gửi thông tin cá nhân. Lan: không trả lời, không chuyển tiền."], ["Kiểm chứng", "Minh: hỏi cha mẹ; xem trang chính thức của công ty được nêu tên có chương trình đó không. Lan: hỏi trực tiếp giáo viên ở trường hoặc nhờ cha mẹ gọi số của giáo viên mà gia đình đã biết."], ["Lưu bằng chứng", "Ghi lại số gửi, thời gian, nội dung chính (của tin nhắn)."], ["Báo cáo, cảnh báo", "Minh: báo cha mẹ, GV chủ nhiệm; dùng chức năng báo cáo của ứng dụng nhắn tin. Lan: báo cha mẹ, GV chủ nhiệm để nhà trường cảnh báo các gia đình khác."], ["Không phát tán", "Minh: không chuyển tiếp tin cho bạn bè. Lan: không chuyển tiếp đoạn ghi âm."]], "why": "Kiến thức chốt: khi gặp nội dung nghi giả mạo, làm theo năm bước. Dừng tương tác; kiểm chứng qua kênh khác (gọi lại số quen của người thân, hỏi thầy cô, xem trang chính thức); lưu bằng chứng (người gửi, thời gian, nội dung chính); báo cáo, cảnh báo (cha mẹ, thầy cô, chức năng báo cáo của nền tảng); không phát tán (bằng chứng chỉ chuyển cho người có trách nhiệm xử lí). Không tạo, không phát tán nội dung giả mạo, kể cả để trêu đùa."}, {"type": "decide", "tag": "HĐ3 • Luyện tập", "title": "Máy quét dấu hiệu: nội dung này đáng ngờ tới đâu?", "nav": "Máy quét dấu hiệu", "icon": "🚦", "badge": "Người rà soát", "intro": "<b>PHIẾU HỌC TẬP SỐ 2. XỬ LÍ HAI CA NGHI GIẢ MẠO.</b> Ca 1 (giả định): Minh thấy trong nhóm chat của lớp một bức ảnh chế giễu một bạn cùng lớp, đang được nhiều người chuyển tiếp. Ánh sáng trên khuôn mặt bạn trong ảnh khác hẳn phần còn lại của bức ảnh. Không ai biết ai là người đăng ảnh đầu tiên. Minh cần xác định bức ảnh có phải do AI tạo ra hoặc chỉnh sửa không và nếu có thì cần làm gì để bảo vệ bạn mình. Ca 2 (giả định): Lan nhận một cuộc gọi từ một số lạ. Giọng người gọi nghe giống giọng một người thân của Lan nhưng ngắt quãng. Người gọi nói đang gặp chuyện gấp, yêu cầu Lan chuyển tiền ngay và dặn không được nói với ai. Lan cần xác định cuộc gọi có phải giả mạo không và nếu có thì cần làm gì để bảo vệ bản thân. Hãy trả lời ba câu hỏi để máy quét sáng đèn, rồi chọn kết luận cho từng tình huống. Quyết định cuối cùng do con người, có người lớn cùng xử lí.", "questions": ["Có yêu cầu bất thường (chuyển tiền, cung cấp thông tin cá nhân, mã OTP, đăng nhập qua đường liên kết lạ)?", "Có thúc ép làm gấp, dặn giữ bí mật hoặc nhằm chế giễu một người?", "Nguồn có xác thực được qua kênh độc lập (trang chính thức, gọi lại số quen)?"], "verdicts": ["Chưa thấy dấu hiệu rõ, vẫn kiểm chứng trước khi dùng", "Có dấu hiệu nghi ngờ: dừng chia sẻ, kiểm chứng, báo người lớn", "Nghi giả mạo, lừa đảo: dừng, lưu bằng chứng, báo cáo, không phát tán"], "rules": [{"when": [1, 1, null], "v": 2}, {"when": [1, null, 0], "v": 2}, {"when": [null, 1, 0], "v": 2}, {"when": [1, null, null], "v": 1}, {"when": [null, 1, null], "v": 1}, {"when": [null, null, 0], "v": 1}, {"when": [null, null, null], "v": 0}], "cases": [{"t": "Ca 2: số lạ gọi, giọng nghe giống người thân nhưng ngắt quãng, nói đang gặp chuyện gấp, yêu cầu chuyển tiền ngay và dặn không được nói với ai", "v": 2, "why": "Dấu hiệu: số lạ; thúc ép chuyển tiền gấp; dặn giữ bí mật; giọng thiếu tự nhiên. Kiểm chứng: gọi lại số quen của người thân hoặc hỏi cha mẹ. Ứng phó: dừng cuộc gọi, không chuyển tiền, không đọc mã OTP; ghi lại số gọi, thời gian; báo cha mẹ; không lan truyền nội dung cuộc gọi."}, {"t": "Ca 1: ảnh chế giễu một bạn cùng lớp, đang được nhiều người chuyển tiếp trong nhóm chat; ánh sáng trên khuôn mặt bạn khác hẳn phần còn lại của ảnh; không ai biết ai đăng đầu tiên", "v": 1, "why": "Dấu hiệu: chi tiết hình ảnh lạ; nguồn không rõ; nội dung nhằm chế giễu một người. Kiểm chứng: hỏi riêng bạn trong ảnh, báo thầy cô để xác minh. Ứng phó: không chia sẻ lại, không bình luận ảnh; báo thầy cô, cha mẹ; dùng chức năng báo cáo của nền tảng; động viên bạn bị chế giễu."}, {"t": "Ví dụ mẫu (tình huống khác, không thuộc hai ca): tin nhắn ghi “bấm vào đây, đăng nhập để nhận quà”, đường liên kết không phải trang chính thức", "v": 2, "why": "Dấu hiệu: đường liên kết lạ đòi đăng nhập. Kiểm chứng: hỏi thầy cô hoặc xem trang chính thức của đơn vị được nêu tên. Ứng phó: không bấm đường liên kết; ghi lại số gửi, thời gian; báo cha mẹ; không chuyển tiếp tin."}, {"t": "Minh nhận tin từ người lạ báo trúng thưởng điện thoại, yêu cầu cung cấp thông tin cá nhân để nhận thưởng, trong khi không nhớ đã tham gia cuộc thi nào", "v": 2, "why": "Yêu cầu bất thường (thông tin cá nhân) từ nguồn không rõ: dừng tương tác, hỏi cha mẹ, xem trang chính thức, ghi lại số gửi, báo cáo."}, {"t": "Thẻ 3: bản tin trích dẫn nguồn không tồn tại, không có thông tin xác thực", "v": 1, "why": "Nguồn không rõ. Kiểm chứng: tìm trang chính thức của cơ quan được nêu tên; đối chiếu với báo chí chính thống."}]}, {"type": "sort", "tag": "HĐ3 • Luyện tập", "title": "Hai ca nghi giả mạo: dấu hiệu, kiểm chứng, ứng phó", "nav": "Hai ca nghi giả mạo", "icon": "🗂️", "badge": "Người xử lí ca", "intro": "Phiếu học tập số 2 có bảng ba cột: Dấu hiệu nghi ngờ | Bằng chứng, cách kiểm chứng | Biện pháp ứng phó. Hãy kéo từng mảnh thông tin vào đúng ca (Ca 1: ảnh chế giễu bạn cùng lớp; Ca 2: cuộc gọi giả giọng người thân) hoặc “Cả hai ca”. Ca 1 không chia sẻ lại ảnh chế giễu, kể cả để hỏi ý kiến; Ca 2 không chuyển tiền, không đọc mã OTP. Nếu em từng gặp chuyện thật bị chế giễu, bị lừa, hãy nói riêng với thầy cô sau giờ.", "cats": ["Ca 1: ảnh chế giễu một bạn cùng lớp", "Ca 2: cuộc gọi giả giọng người thân", "Cả hai ca"], "cards": [{"t": "Ca 1. Ánh sáng trên khuôn mặt bạn trong ảnh khác hẳn phần còn lại của bức ảnh", "g": [0], "why": "Dấu hiệu Ca 1: chi tiết hình ảnh lạ."}, {"t": "Ca 1. Không ai biết ai là người đăng ảnh đầu tiên", "g": [0], "why": "Dấu hiệu Ca 1: nguồn không rõ."}, {"t": "Ca 1. Không chia sẻ lại, không bình luận ảnh; động viên bạn bị chế giễu", "g": [0], "why": "Biện pháp ứng phó Ca 1. Nếu em là bạn trong ảnh, em mong các bạn khác không chia sẻ và quan tâm mình. Bạn bị chế giễu cần được hỗ trợ; khi cần tư vấn, hỗ trợ, HS và gia đình có thể gọi Tổng đài quốc gia bảo vệ trẻ em 111."}, {"t": "Ca 1. Hỏi riêng bạn trong ảnh, báo thầy cô để xác minh", "g": [0], "why": "Cách kiểm chứng Ca 1."}, {"t": "Ca 2. Giọng nghe giống người thân nhưng ngắt quãng; gọi từ số lạ", "g": [1], "why": "Dấu hiệu Ca 2: số lạ, giọng thiếu tự nhiên."}, {"t": "Ca 2. Yêu cầu chuyển tiền ngay và dặn không được nói với ai", "g": [1], "why": "Dấu hiệu Ca 2: thúc ép chuyển tiền gấp; dặn giữ bí mật."}, {"t": "Ca 2. Gọi lại số quen của người thân hoặc hỏi cha mẹ để kiểm chứng", "g": [1], "why": "Cách kiểm chứng Ca 2: em có thể hỏi lại người thân, cha mẹ qua số quen."}, {"t": "Ca 2. Dừng cuộc gọi, không chuyển tiền, không đọc mã OTP; ghi lại số gọi, thời gian", "g": [1], "why": "Biện pháp ứng phó Ca 2."}, {"t": "Báo cha mẹ, thầy cô; không chuyển tiếp, không lan truyền nội dung", "g": [2], "why": "Việc chung của cả hai ca: báo người lớn, không phát tán."}, {"t": "Dùng chức năng báo cáo của nền tảng để nội dung được xem xét, gỡ bỏ", "g": [2], "why": "Cảnh báo đúng kênh giúp người khác không bị lừa tiếp."}], "pass": 0.7}, {"type": "quiz", "tag": "HĐ3 & HĐ4 • Cảnh báo cộng đồng", "title": "Cảnh báo cộng đồng và trách nhiệm người dùng", "nav": "Cảnh báo cộng đồng", "icon": "📣", "badge": "Người cảnh báo", "intro": "Câu hỏi mở rộng: nếu phát hiện nội dung giả mạo, em sẽ làm gì để cảnh báo cộng đồng? Em ghi rõ người hoặc kênh nhận cảnh báo. Câu 5 Phiếu học tập số 3: cá nhân và cộng đồng (lớp, nhà trường, nền tảng mạng, cơ quan chức năng) khi gặp nội dung giả mạo.", "qs": [{"q": "Để cảnh báo cộng đồng khi phát hiện nội dung giả mạo, em nên làm gì? (chọn nhiều đáp án)", "opts": ["Báo GV chủ nhiệm hoặc người lớn để có biện pháp xử lí", "Nhắn trong nhóm lớp nhắc các bạn không tin, không chuyển tiếp thông tin chưa được xác thực, không gửi kèm lại ảnh hay đoạn ghi âm", "Dùng chức năng báo cáo của nền tảng để nội dung được xem xét, gỡ bỏ", "Đăng lại ảnh lên nhóm để mọi người cho ý kiến"], "a": [0, 1, 2], "why": "Với Ca 1, bạn bị chế giễu cần được hỗ trợ; khi cần tư vấn, hỗ trợ, HS và gia đình có thể gọi Tổng đài quốc gia bảo vệ trẻ em 111. Không chia sẻ lại ảnh, kể cả để hỏi ý kiến."}, {"q": "Tin cảnh báo nào phù hợp để nhắn trong nhóm lớp?", "opts": ["“Các bạn ơi, có ảnh chế giễu một bạn lớp mình đang bị chuyển tiếp. Mình đã báo cô chủ nhiệm. Các bạn đừng chia sẻ hay bình luận thêm nhé.”", "“Xem ảnh này đi, buồn cười lắm!” (kèm lại ảnh)", "“Chuyển tiếp cho mọi người cùng biết nhé.”", "Không nhắn gì vì không liên quan"], "a": 0, "why": "Đó là tin cảnh báo mẫu: báo người lớn, nhắc không chia sẻ, không bình luận, không gửi kèm lại ảnh."}, {"q": "Em có thể hỏi lại ai, qua kênh nào để biết cuộc gọi là thật hay giả?", "opts": ["Gọi lại số quen của người thân hoặc hỏi cha mẹ", "Gọi lại chính số vừa gọi tới", "Hỏi người gọi “có đúng là bạn không?”", "Chuyển một ít tiền thử"], "a": 0, "why": "Kênh kiểm chứng phải không phụ thuộc vào người gửi tin. Chưa thấy minh chứng nếu kênh kiểm chứng là chính số đã gửi tin hoặc việc đầu tiên là làm theo yêu cầu. Câu gợi: “Chi tiết nào trong ca khiến em nghi ngờ?”"}, {"q": "Với tình huống ở HĐ 1, phương án nào vừa an toàn cho mình vừa có trách nhiệm với người khác?", "opts": ["Phương án 1: tin ngay và chia sẻ", "Phương án 2, kèm thêm việc báo cha mẹ, thầy cô và không chuyển tiếp tin", "Phương án 3: bỏ qua vì không tin tưởng", "Chỉ cần xoá tin nhắn"], "a": 1, "why": "Phương án 3 an toàn cho mình nhưng bỏ qua thì người khác vẫn có thể bị lừa; người dùng có trách nhiệm kiểm chứng, báo cáo và cảnh báo đúng kênh."}, {"q": "Điều gì có thể làm kết luận “tin nhắn này là giả mạo” thay đổi?", "opts": ["Kết quả kiểm chứng qua kênh độc lập: giáo viên xác nhận trực tiếp có thông báo; trang chính thức của công ty công bố chương trình và tên người trúng thưởng", "Nhiều bạn cùng chuyển tiếp tin", "Tin nhắn ghi rất khẩn cấp", "Người gửi nói đó là thật"], "a": 0, "why": "Kể cả khi đó, HS vẫn không gửi thông tin cá nhân, không chuyển tiền qua kênh của tin nhắn lạ mà để cha mẹ xử lí."}, {"q": "Góp ý đồng đẳng nào là cụ thể, giúp bài bạn rõ hơn?", "opts": ["“Bạn nêu kênh kiểm chứng nhưng chưa nói vì sao kênh đó đáng tin.”", "“Bài tốt.”", "“Hay lắm.”", "“Không có gì để góp ý.”"], "a": 0, "why": "Góp ý cụ thể chỉ ra chỗ cần thêm. HS không ghi góp ý chung chung như “Bài tốt”. Bảng góp ý: 1. Kiểm soát và trách nhiệm rõ ràng; 2. Rủi ro và cách kiểm chứng an toàn."}]}, {"type": "match", "tag": "HĐ4 • Khai báo việc sử dụng AI", "title": "Khai báo năm ý khi dùng AI", "nav": "Khai báo năm ý", "icon": "📝", "badge": "Người khai báo", "intro": "Câu 6 Phiếu học tập số 3. a) Với chính phiếu này, em đánh dấu một ô: Em tự làm, không dùng AI; hoặc Có dùng AI hỗ trợ (công cụ, mục đích, phạm vi AI hỗ trợ, phần em tự làm, cách em kiểm chứng và chỉnh sửa). b) Giả sử khi làm phiếu này, em nhờ một công cụ AI hỏi đáp được nhà trường cho phép gợi ý ba câu hỏi kiểm chứng. Em giữ hai câu, tự viết phần cách xử lí và đối chiếu với trang của cơ quan chức năng. Em hãy điền năm dòng khai báo. (Câu 6b khai báo cho một tình huống giả định; trong giờ HS không dùng công cụ AI.)", "pairs": [["1. Công cụ đã dùng", "Công cụ AI hỏi đáp được nhà trường cho phép"], ["2. Mục đích dùng", "Gợi ý câu hỏi kiểm chứng"], ["3. Phạm vi AI hỗ trợ", "Gợi ý ba câu hỏi kiểm chứng"], ["4. Phần việc em trực tiếp thực hiện", "Chọn giữ hai câu hỏi, viết phần cách xử lí"], ["5. Cách em kiểm chứng và chỉnh sửa", "Đối chiếu với trang của cơ quan chức năng, bỏ một câu hỏi không dùng"]], "why": "Câu 6a: em tự làm, không dùng AI (trong giờ HS không dùng công cụ AI). Chưa thấy minh chứng nếu thiếu dòng phần tự làm hoặc dòng cách kiểm chứng. Mức Khá: khai báo năm ý đúng với tình huống ở câu 6b, tách rõ phần AI hỗ trợ với phần tự làm. Mức Tốt: giải thích được vì sao khai báo giúp người khác đánh giá đúng sản phẩm; chỉ ra giới hạn của công cụ (đầu ra của AI là bản nháp cần kiểm tra). HS tìm hiểu thêm ở nhà có dùng công cụ AI thì phải có người lớn hướng dẫn và khai báo theo mẫu."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phiếu học tập số 3: Em là người dùng có trách nhiệm", "nav": "Em là người dùng", "icon": "✍️", "badge": "Người dùng có trách nhiệm", "intro": "Lưu ý an toàn: em dùng tình huống giả định; không ghi họ tên thật của người khác, số điện thoại hay thông tin riêng của bản thân và gia đình. Em tự làm phiếu, sau đó mới đổi phiếu với bạn cùng bàn để góp ý (bảng góp ý đồng đẳng), rồi tự sửa bằng bút khác màu.", "fields": [{"id": "c1", "label": "1. Chọn một tình huống gần gũi", "opts": ["Gợi ý A: Nhận được tin nhắn mạo danh giáo viên thông báo nghỉ học", "Gợi ý B: Tin nhắn giọng nói mượn tiền từ người thân", "Gợi ý C: Thông báo trúng thưởng từ một công ty lạ", "Tình huống em tự ghi (giả định)"]}, {"id": "c2", "label": "2. Dấu hiệu khiến em nghi ngờ: hai dấu hiệu, mỗi dấu hiệu kèm một chi tiết làm bằng chứng", "hint": "Dấu hiệu 1 + bằng chứng; dấu hiệu 2 + bằng chứng", "ph": "Dấu hiệu 1: ... Bằng chứng: ... Dấu hiệu 2: ... Bằng chứng: ..."}, {"id": "c3", "label": "3. Kiểm chứng và ứng phó: Nếu con người không kiểm tra khâu …… thì có nguy cơ ……; nguồn hoặc kênh em dùng để kiểm chứng, vì sao phù hợp; các việc em sẽ làm theo thứ tự", "hint": "Kênh kiểm chứng độc lập với người gửi", "ph": "Nếu không kiểm tra khâu ... thì có nguy cơ ... Kênh kiểm chứng: ... vì ... Các việc theo thứ tự: ..."}, {"id": "c4", "label": "4. Vai trò kiểm soát và trách nhiệm của người dùng: kiểm soát thông tin; trách nhiệm khi chia sẻ; khi dùng AI hỗ trợ làm sản phẩm học tập em kiểm tra gì trước khi nộp, ai chịu trách nhiệm về kết quả cuối cùng, vì sao cần khai báo", "hint": "Nêu rõ người chịu trách nhiệm về kết quả cuối cùng", "ph": "Kiểm soát thông tin: ... Trách nhiệm khi chia sẻ: ... Khi dùng AI hỗ trợ: ..."}, {"id": "c5", "label": "5. Cá nhân và cộng đồng khi gặp nội dung giả mạo: việc em làm; việc cộng đồng (lớp, nhà trường, nền tảng mạng, cơ quan chức năng) làm; một giải pháp em đề xuất cho lớp để dùng AI an toàn, công bằng, hợp lí", "hint": "Có việc của cộng đồng và một giải pháp", "ph": "Việc em làm: ... Việc cộng đồng làm: ... Giải pháp cho lớp: ..."}, {"id": "c6", "label": "6. Khai báo việc sử dụng AI: (a) tự làm, không dùng AI hoặc có dùng AI hỗ trợ; (b) năm dòng khai báo cho tình huống giả định", "hint": "Công cụ; mục đích; phạm vi; phần em tự làm; cách kiểm chứng và chỉnh sửa", "ph": "a) ... b) 1. Công cụ ... 2. Mục đích ... 3. Phạm vi ... 4. Phần em tự làm ... 5. Cách kiểm chứng và chỉnh sửa ..."}], "checks": ["1. Kiểm soát và trách nhiệm rõ ràng (bảng góp ý đồng đẳng: đã rõ / cần bổ sung)", "2. Rủi ro và cách kiểm chứng an toàn (đã rõ / cần bổ sung)", "Chưa thấy minh chứng nếu: chỉ nêu dấu hiệu mà không có chi tiết hoặc chỉ nêu một dấu hiệu; kênh kiểm chứng là chính số đã gửi tin hoặc việc đầu tiên là làm theo yêu cầu; không nêu người chịu trách nhiệm về kết quả cuối cùng; chỉ nêu việc của cá nhân mà không có việc của cộng đồng hoặc không có giải pháp.", "Mức Khá (9.B2.1, 9.B2.2): giải thích rõ mối liên hệ giữa kiểm soát thông tin và trách nhiệm của người dùng; khai báo năm ý đúng, tách rõ phần AI hỗ trợ với phần tự làm; việc của cá nhân, của cộng đồng cụ thể, đúng người, đúng kênh. Mức Tốt: tự liên hệ sang tình huống mới, chỉ ra giới hạn của công cụ; giải thích được vì sao khai báo giúp người khác đánh giá đúng sản phẩm; giải pháp cho lớp làm được ngay, có người phụ trách và cách phản hồi.", "Mức Khá (9.B2.3): dấu hiệu và bằng chứng gắn đúng với tình huống; kênh kiểm chứng độc lập với nguồn tin nghi ngờ; các bước ứng phó đúng thứ tự. Mức Tốt: phân biệt dấu hiệu nội dung với dấu hiệu hình ảnh, giọng nói; nêu được điều gì có thể làm kết luận thay đổi; giải thích vì sao kênh kiểm chứng đáng tin.", "An toàn, đạo đức: không ghi thông tin cá nhân thật; nêu rõ không chuyển tiền, không đọc mã OTP, không chuyển tiếp nội dung nghi giả mạo. Mức Tốt: lồng quy tắc bảo vệ thông tin cá nhân vào giải pháp cho lớp; quan tâm tới người bị hại (bạn bị chế giễu, người bị mạo danh).", "Hợp tác và trình bày: mức Khá làm đúng vai được giao; góp ý đồng đẳng cụ thể; tự sửa bài bằng bút khác màu sau phản hồi. Mức Tốt: điều phối thảo luận nhóm rõ ràng; phản biện lịch sự, có căn cứ; hỗ trợ bạn cùng tiến bộ."], "sample": "Câu 1: Gợi ý B, tin nhắn giọng nói mượn tiền từ người thân. Câu 2: Dấu hiệu 1 là yêu cầu bất thường, thúc ép làm gấp, bằng chứng là tin nhắn đòi chuyển tiền ngay vào một tài khoản lạ. Dấu hiệu 2 là giọng nói thiếu tự nhiên, bằng chứng là giọng nghe giống nhưng ngắt quãng, cách xưng hô khác ngày thường. Câu 3: Nếu con người không kiểm tra khâu xác thực nguồn gốc thông tin thì có nguy cơ bị lừa đảo hoặc phát tán thông tin sai lệch. Kênh kiểm chứng là gọi lại số điện thoại quen của người thân hoặc hỏi bố mẹ, vì kênh này không phụ thuộc vào người gửi tin. Các việc theo thứ tự là không trả lời, không chuyển tiền; gọi lại số quen để kiểm chứng; ghi lại số gửi, thời gian; báo bố mẹ, dùng chức năng báo cáo; không chuyển tiếp đoạn ghi âm. Câu 4: Kiểm soát thông tin là kiểm tra nguồn gốc tin nhắn trước khi tin hay làm theo. Trách nhiệm khi chia sẻ là chỉ chia sẻ thông tin đã được xác thực; nếu chia sẻ tin sai thì em chịu trách nhiệm về việc mình làm. Khi dùng AI hỗ trợ, em kiểm tra từng ý AI gợi ý với nguồn đáng tin cậy, giữ, sửa hay bỏ trước khi nộp; em chịu trách nhiệm về kết quả cuối cùng, kể cả phần có AI hỗ trợ. Cần khai báo để thầy cô, bạn bè biết phần nào AI hỗ trợ, phần nào em tự làm. Câu 5: Em báo GV chủ nhiệm và bố mẹ, nhắc bạn không chuyển tiếp. Về phía cộng đồng, nhà trường thông báo cảnh báo chung cho HS và gia đình; nền tảng mạng xem xét báo cáo, khoá tài khoản giả mạo. Giải pháp cho lớp là thống nhất “gặp tin lạ thì hỏi lại qua kênh khác trước khi tin” và có một bạn phụ trách báo GV chủ nhiệm khi có tin giả lan trong nhóm lớp. Câu 6a: Em tự làm, không dùng AI. Câu 6b: Công cụ là công cụ AI hỏi đáp được nhà trường cho phép; mục đích là gợi ý câu hỏi kiểm chứng; phạm vi AI hỗ trợ là gợi ý ba câu hỏi kiểm chứng; phần em tự làm là chọn giữ hai câu hỏi, viết phần cách xử lí; cách kiểm chứng và chỉnh sửa là đối chiếu với trang của cơ quan chức năng, bỏ một câu hỏi không dùng."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 9 • Môn đảm nhiệm: Giáo dục công dân • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};
