<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 6. Cải thiện dữ liệu để nâng cao chất lượng sản phẩm AI – Lớp 9</title>
<style>
:root{--o:#16a085;--od:#107863;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>
<header><div style="font-size:30px" id="ico">🧭</div><div><h1 id="ttl"></h1><small id="sub"></small></div>
<div class="hud"><span class="pill" id="score">⭐ 0</span><button class="ibtn" id="snd" title="Âm thanh">🔊</button></div></header>
<div class="map" id="map"></div><main id="main"></main><canvas id="confetti"></canvas>
<script>
const SPEC={"icon": "🧹", "title": "Bài 6. Cải thiện dữ liệu để nâng cao chất lượng sản phẩm AI – Lớp 9", "ainote": "Tin nhắn, báo cáo lỗi và các con số trong bài là dữ liệu giả lập do GV tạo, địa chỉ lạ dùng tên miền mẫu; không chứa mật khẩu hay thông tin người dùng thật. Con số 97% chưa đủ làm bằng chứng mô hình tốt; quyết định tin hay không tin kết quả của mô hình thuộc về con người. Máy hỗ trợ phát hiện và tự loại được dòng trùng hoàn toàn; việc sửa giá trị, gán lại nhãn, loại dòng không trùng hoàn toàn do người làm dữ liệu quyết định và ghi lí do cạnh dòng. Dấu hiệu sai lệch cần để ý là quy trình tự động sửa, xoá hoặc gán lại nhãn cho những dòng cần người quyết định.", "takeaways": ["Bốn cách cải thiện bộ dữ liệu gồm bổ sung dữ liệu còn thiếu, loại bỏ dữ liệu trùng lặp, sửa dữ liệu sai, gán nhãn lại cho đúng. Mỗi cách chỉ có tác dụng khi xác định đúng lỗi.", "Thứ tự gợi ý (có thể điều chỉnh theo dữ liệu, vì có dòng chỉ lộ ra là trùng sau khi sửa lỗi nhập): loại trùng, sửa giá trị sai, gán lại nhãn rồi bổ sung dữ liệu; phần mới bổ sung cũng phải kiểm tra lại. Sau khi làm sạch, điểm trên dữ liệu kiểm thử có thể giảm nhưng phản ánh đúng hơn chất lượng thật của mô hình.", "Máy tự loại được dòng trùng hoàn toàn; việc sửa giá trị, gán lại nhãn, loại dòng không trùng hoàn toàn do con người quyết định và ghi lí do. So khớp từng chữ chỉ tìm được dòng trùng hoàn toàn; dòng gần trùng phải đọc hiểu nghĩa. Giá trị thiếu hoặc sai phải đối chiếu nhật kí gốc, không điền theo phỏng đoán.", "Quy trình kiểm tra: máy hỗ trợ phát hiện dòng trùng hoàn toàn, giá trị bất thường, nhãn mâu thuẫn; con người quyết định sửa và gán lại nhãn. Quy trình cần chạy lại sau mỗi lần bổ sung dữ liệu mới."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Mô hình đạt 97% vẫn sai", "nav": "97% vẫn sai", "icon": "🎯", "badge": "Người chẩn đoán", "intro": "<b>Tình huống (giả định).</b> Câu lạc bộ Tin học xây dựng mô hình phân loại tin nhắn rác cho nhóm trò chuyện của trường. Mô hình được huấn luyện từ 1 000 tin nhắn đã gán nhãn (600 tin thường, 400 tin rác, trong đó chỉ có năm tin giả mạo yêu cầu nhập mật khẩu). Mô hình đạt độ chính xác 97% trên dữ liệu kiểm thử. Khi dùng thật, mô hình chặn nhầm thông báo lịch thi và để lọt tin yêu cầu nhập mật khẩu ở trang giả mạo. Nhóm giữ nguyên thuật toán và các tham số.<br>Câu hỏi 1. Vì sao mô hình đạt độ chính xác 97% nhưng vẫn sai khi dùng thật?<br>Câu hỏi 2. Nếu không đổi thuật toán, nhóm có thể kiểm tra và thay đổi điều gì? Em viết ít nhất hai dự đoán về vấn đề của bộ dữ liệu.", "app": "🤖 Bộ lọc tin nhắn rác (mô phỏng)", "hello": "Mô hình báo: độ chính xác 97% trên dữ liệu kiểm thử. (Tình huống và số liệu là giả lập.)", "meters": [{"n": "Hiểu nguyên nhân thuộc về dữ liệu", "b": 20, "c": 0}, {"n": "Tin cậy đúng mức vào con số", "b": 60, "c": 1}, {"n": "Khả năng cải thiện mô hình", "b": 20, "c": 2}], "chars": [{"n": "Câu hỏi 1: Vì sao 97% vẫn sai khi dùng thật?", "color": "#4aa3ff", "task": "Mô hình đạt 97% nhưng chặn nhầm thông báo lịch thi và để lọt tin yêu cầu nhập mật khẩu. Nguyên nhân em dự đoán?", "opts": [{"t": "Điểm 97% chỉ đo trên dữ liệu kiểm thử; nguyên nhân có thể nằm ở dữ liệu: tin lặp lại giữa huấn luyện và kiểm thử, nhãn gán nhầm, giá trị ghi sai, thiếu tin giả mạo mật khẩu", "chat": null, "ch": [40, -30, 25], "v": "good", "fb": "Điểm 97% chưa chắc phản ánh hiệu quả khi dùng thật. Yêu cầu tối thiểu: nêu được một nguyên nhân thuộc về dữ liệu."}, {"t": "Thuật toán chưa đủ tốt nên cần đổi thuật toán", "chat": null, "ch": [-25, 10, -20], "v": "bad", "fb": "Chỉ nêu nguyên nhân về thuật toán thì chưa đạt yêu cầu này; nhóm giữ nguyên thuật toán và tham số, nên hãy xét dữ liệu."}, {"t": "97% là rất cao nên mô hình tốt, lỗi chỉ là ngẫu nhiên", "chat": null, "ch": [-20, 35, -15], "v": "bad", "fb": "Con số 97% chưa đủ làm bằng chứng mô hình tốt; quyết định tin hay không tin kết quả của mô hình thuộc về con người."}]}, {"n": "Câu hỏi 2: Không đổi thuật toán, kiểm tra gì?", "color": "#ff9f43", "task": "Nếu không đổi thuật toán, nhóm có thể kiểm tra và thay đổi điều gì?", "opts": [{"t": "Bổ sung tin giả mạo mật khẩu đã kiểm tra nhãn; loại tin trùng lặp; sửa giá trị ghi sai; gán lại nhãn bị nhầm; kiểm tra để dữ liệu kiểm thử không chứa tin đã có trong dữ liệu huấn luyện", "chat": null, "ch": [35, -15, 40], "v": "good", "fb": "Không đổi thuật toán, nhóm vẫn có thể kiểm tra và cải thiện dữ liệu. Chấp nhận mọi dự đoán có lí do gắn với dữ liệu. GV chưa gọi tên loại lỗi ở hoạt động này."}, {"t": "Không làm gì được nếu không đổi thuật toán", "chat": null, "ch": [-30, 10, -35], "v": "bad", "fb": "Kết quả của sản phẩm AI phụ thuộc vào chất lượng bộ dữ liệu; có nhiều việc làm được với dữ liệu."}]}, {"n": "Mô hình đã học từ những tin nào, còn thiếu tin nào?", "color": "#e17055", "task": "Câu hỏi then chốt (1): Mô hình đã học từ những tin nào và còn thiếu những tin nào?", "opts": [{"t": "Học từ 600 tin thường và 400 tin rác, nhưng chỉ có năm tin giả mạo yêu cầu nhập mật khẩu; có thể cũng ít tin thường kèm đường dẫn như thông báo lịch thi", "chat": null, "ch": [35, -10, 25], "v": "good", "fb": "Kiểu tin giả mạo mật khẩu gần như thiếu nên mô hình để lọt; có thể bộ dữ liệu cũng có ít tin thường kèm đường dẫn như thông báo lịch thi, nên mô hình chặn nhầm loại tin này."}, {"t": "Mô hình đã học đủ mọi kiểu tin", "chat": null, "ch": [-25, 20, -20], "v": "bad", "fb": "Trong 1 000 tin chỉ có năm tin giả mạo yêu cầu nhập mật khẩu; kiểu tin này gần như thiếu."}]}, {"n": "Gợi ý cho HS khá: vì sao 97% chưa đủ?", "color": "#00b894", "task": "Vì sao 97% chưa đủ để tin mô hình?", "opts": [{"t": "Tin giả mạo mật khẩu chỉ chiếm khoảng năm trong 1 000 tin nên sai hết vẫn mất rất ít điểm; con số chung che mất lỗi ở kiểu tin hiếm; tin trùng giữa huấn luyện và kiểm thử làm điểm càng cao hơn thực tế", "chat": null, "ch": [30, -30, 20], "v": "good", "fb": "Nếu dữ liệu kiểm thử có tỉ lệ giống dữ liệu huấn luyện thì mô hình sai hết những tin này vẫn mất rất ít điểm. Nếu dữ liệu kiểm thử còn chứa tin trùng với dữ liệu huấn luyện thì điểm càng cao hơn thực tế."}, {"t": "Vì 97% chưa đạt 100%", "chat": null, "ch": [-10, 10, -10], "v": "mid", "fb": "Vấn đề không ở chỗ chưa đủ 100% mà ở chỗ con số chung che mất lỗi ở kiểu tin hiếm."}]}]}, {"type": "lab", "tag": "HĐ1 • Mở đầu", "title": "Vì sao con số chung che mất lỗi?", "nav": "Con số chung che lỗi", "icon": "🧪", "badge": "Nhà thực nghiệm", "intro": "Bộ dữ liệu giả lập: 1 000 tin (600 tin thường, 400 tin rác), trong đó chỉ có năm tin giả mạo yêu cầu nhập mật khẩu. Kéo thanh trượt để xem: nếu tin giả mạo chỉ chiếm khoảng năm trong 1 000 tin thì mô hình sai hết những tin này vẫn mất rất ít điểm; tin trùng giữa dữ liệu huấn luyện và kiểm thử làm điểm cao hơn thực tế; khi số tin rác áp đảo, mô hình dễ chặn nhầm tin thường có đường dẫn. (Mô hình minh hoạ định tính, không phải số đo thật.)", "sliders": [{"id": "n", "n": "Số tin giả mạo mật khẩu trong 1 000 tin", "min": 5, "max": 200, "val": 5, "unit": " tin"}, {"id": "dup", "n": "Tỉ lệ tin kiểm thử trùng với dữ liệu huấn luyện", "min": 0, "max": 50, "val": 0, "unit": "%"}, {"id": "rac", "n": "Số tin rác bổ sung thêm (không kèm tin thường)", "min": 0, "max": 600, "val": 0, "unit": " tin"}], "outputs": [{"n": "Điểm bị mất nếu mô hình sai hết tin giả mạo (điểm %)", "base": 0.5, "w": {"n": 0.1}, "c": 2}, {"n": "Mức điểm kiểm thử cao hơn thực tế (minh hoạ)", "base": 0, "w": {"dup": 0.4}, "c": 1}, {"n": "Nguy cơ chặn nhầm tin thường có đường dẫn (minh hoạ)", "base": 10, "w": {"rac": 0.1}, "c": 0}], "insights": [{"id": "n", "op": "<=", "val": 6, "txt": "Tin giả mạo mật khẩu chỉ chiếm khoảng năm trong 1 000 tin. Mô hình sai hết những tin này vẫn mất rất ít điểm, nên con số chung che mất lỗi ở kiểu tin hiếm."}, {"id": "dup", "op": ">=", "val": 20, "txt": "Nếu dữ liệu kiểm thử còn chứa tin trùng với dữ liệu huấn luyện thì điểm càng cao hơn thực tế. Sau khi làm sạch, điểm trên dữ liệu kiểm thử có thể giảm nhưng phản ánh đúng hơn chất lượng thật của mô hình."}, {"id": "rac", "op": ">=", "val": 300, "txt": "Khi số tin rác áp đảo số tin thường, bộ dữ liệu mất cân đối. Mô hình dễ gán nhãn rác cho cả tin thường có hình thức giống, như tin có đường dẫn hay nhắc tới tài khoản. Cần bổ sung vừa đủ, kèm cả tin thường có liên kết như thông báo của nhà trường."}]}, {"type": "flag", "tag": "HĐ2 • Hình thành kiến thức", "title": "Hồ sơ cải thiện: bảng 10 tin nhắn", "nav": "Bảng 10 tin nhắn", "icon": "🖍️", "badge": "Người tô màu", "intro": "Phiếu học tập số 1, phần A. Bảng dưới là 10 tin nhắn (giả lập) trích từ bộ dữ liệu của câu lạc bộ. Tô màu mỗi dòng có vấn đề theo loại: thiếu (xanh lá, kí hiệu T); trùng lặp (xanh dương, L); sai (cam, S); nhãn sai (đỏ, N). Mỗi kết luận phải dẫn được căn cứ từ nội dung dòng. Chú thích: cột “Số liên kết” là số đường dẫn có trong tin nhắn; nhãn “spam” là tin rác. Đọc nội dung từng dòng thay vì đoán theo hình thức.", "cols": ["Dòng", "Nội dung tin nhắn", "Số liên kết (link)", "Nhãn"], "flagWhat": "có vấn đề (thiếu, trùng lặp, sai hoặc nhãn sai)", "rows": [{"c": ["1", "Trúng thưởng 500k, bấm link nhận ngay", "1", "spam"], "bad": true, "why": "Dòng 1 và 2: Trùng lặp (xanh dương). Hai dòng giống hệt nhau về nội dung, số liên kết, nhãn. Cách cải thiện: giữ một dòng, loại dòng còn lại. Mẫu lặp lại có thể khiến mô hình coi mẫu đó quan trọng hơn các mẫu khác; nếu một bản nằm ở dữ liệu kiểm thử thì điểm kiểm thử cao hơn thực tế. Tin này không nên xuất hiện hai lần trong dữ liệu huấn luyện; giữ một bản là đủ."}, {"c": ["2", "Trúng thưởng 500k, bấm link nhận ngay", "1", "spam"], "bad": true, "why": "Trùng lặp với dòng 1: hai dòng giống hệt nhau về nội dung, số liên kết, nhãn. Giữ một dòng, loại dòng còn lại; bản lặp làm mô hình học lệch về mẫu đó và có thể làm điểm kiểm thử cao hơn thực tế."}, {"c": ["3", "Mai nộp bài Python trước 20h nhé", "0", "thường"], "bad": false}, {"c": ["4", "Nhập mật khẩu tại tr4ng-hoc.example để tránh bị khoá tài khoản", "1", "thường"], "bad": true, "why": "Nhãn sai (đỏ): tin yêu cầu nhập mật khẩu ở địa chỉ lạ nhưng mang nhãn “thường”. Gán lại thành “spam”; người làm dữ liệu quyết định và ghi lí do. Nếu bỏ qua, mô hình học rằng kiểu tin này là bình thường nên để lọt tin lừa đảo."}, {"c": ["5", "Họp CLB Tin học 7h sáng thứ Bảy tại phòng máy", "0", "thường"], "bad": false}, {"c": ["6", "(nội dung trống)", "0", "spam"], "bad": true, "why": "Thiếu (xanh lá): nội dung trống, chỉ còn nhãn. Tìm lại nội dung từ nguồn gốc để bổ sung; không truy được thì loại khỏi bộ huấn luyện, không đoán nội dung. Nếu bỏ qua, mô hình học từ một mẫu không có nội dung; nhãn gắn với một dòng trống không giúp phân biệt tin rác."}, {"c": ["7", "Nạp thẻ ngay để nhận quà, không nhận là tiếc", "-3", "spam"], "bad": true, "why": "Sai (cam): số liên kết là -3, mà số liên kết không thể âm. Đối chiếu tin nhắn gốc, đếm lại số đường dẫn: nội dung tin không nhắc tới đường dẫn nào nên sửa thành 0. Đặc điểm “số liên kết” bị ghi sai làm lệch quá trình học."}, {"c": ["8", "Thông báo lịch thi học kì, xem tại cổng thông tin của trường", "1", "thường"], "bad": false}, {"c": ["9", "Chốt hạn nộp dự án Scratch vào thứ Sáu", "0", "thường"], "bad": false}, {"c": ["10", "Cho mình xin file bài tập mạng máy tính với", "0", "thường"], "bad": false}], "after": "Bảng có năm dòng có vấn đề (dòng 1, 2, 4, 6, 7). Dòng 8 trông đáng ngờ vì có liên kết nhưng không có lỗi: là thông báo thật của nhà trường, nhãn “thường” đúng, không sửa, không gán lại nhãn; sửa nhầm dữ liệu đúng cũng làm chất lượng mô hình giảm. Dòng 6 thiếu nội dung, buộc nhóm chọn giữa tìm lại dữ liệu và loại bỏ. Cả bộ: chỉ có năm tin giả mạo yêu cầu nhập mật khẩu trong 1 000 tin (thiếu mẫu, xanh lá): bổ sung thêm mẫu tin kiểu này đã kiểm tra nhãn, nếu không mô hình không có đủ ví dụ nên bỏ sót kiểu tin này. Hai cách xử lí trông như ngược nhau nhưng đều đúng: số liên kết ở dòng 7 sửa được vì đếm lại được trên chính tin nhắn gốc; dòng 6 mất cả nội dung nên không có gì để đối chiếu, không tìm lại được thì loại."}, {"type": "match", "tag": "HĐ2 • Hình thành kiến thức", "title": "Bảng chẩn đoán: loại vấn đề, căn cứ, cách cải thiện", "nav": "Bảng chẩn đoán", "icon": "🩺", "badge": "Người chẩn đoán dữ liệu", "intro": "Bảng chẩn đoán (dòng “Cả bộ” ghi nhận xét về toàn bộ 1 000 tin của bộ dữ liệu gốc). Ghép mỗi dòng (kèm căn cứ nhận biết) với loại vấn đề, cách cải thiện và hậu quả nếu bỏ qua. Mỗi cách cải thiện chỉ có tác dụng khi xác định đúng lỗi.", "pairs": [["Dòng 1 và 2: hai dòng giống hệt nhau về nội dung, số liên kết, nhãn.", "Trùng lặp (xanh dương). Giữ một dòng, loại dòng còn lại. Mẫu lặp lại có thể khiến mô hình coi mẫu đó quan trọng hơn các mẫu khác; nếu một bản nằm ở dữ liệu kiểm thử thì điểm kiểm thử cao hơn thực tế."], ["Dòng 4: tin yêu cầu nhập mật khẩu ở địa chỉ lạ nhưng mang nhãn “thường”.", "Nhãn sai (đỏ). Gán lại thành “spam”; người làm dữ liệu quyết định và ghi lí do. Mô hình học rằng kiểu tin này là bình thường nên để lọt tin lừa đảo."], ["Dòng 6: nội dung trống, chỉ còn nhãn.", "Thiếu (xanh lá). Tìm lại nội dung từ nguồn gốc để bổ sung; không truy được thì loại khỏi bộ huấn luyện, không đoán nội dung. Mô hình học từ một mẫu không có nội dung."], ["Dòng 7: số liên kết là -3, mà số liên kết không thể âm.", "Sai (cam). Đối chiếu tin nhắn gốc, đếm lại số đường dẫn: nội dung tin không nhắc tới đường dẫn nào nên sửa thành 0. Đặc điểm “số liên kết” bị ghi sai làm lệch quá trình học."], ["Dòng 8: có liên kết nhưng là thông báo thật của nhà trường, nhãn “thường” đúng.", "Không có vấn đề. Không sửa, không gán lại nhãn. Sửa nhầm dữ liệu đúng cũng làm chất lượng mô hình giảm."], ["Cả bộ: chỉ có năm tin giả mạo yêu cầu nhập mật khẩu trong 1 000 tin.", "Thiếu mẫu (xanh lá). Bổ sung thêm mẫu tin kiểu này đã kiểm tra nhãn. Mô hình không có đủ ví dụ nên bỏ sót kiểu tin này."]], "why": "GV nói rõ chữ “thiếu” có hai nghĩa: ô trống trong một dòng (dòng 6) và thiếu mẫu của một kiểu tin trong cả bộ (dòng “Cả bộ”). Cách “bổ sung dữ liệu còn thiếu” chủ yếu ứng với nghĩa thứ hai. Mức phản hồi phần A: xác định đúng ít nhất 4 trong 5 dòng có vấn đề, không sửa nhầm dòng 8, nêu được cách cải thiện. Khá khi nêu đúng hậu quả của từng lỗi đối với mô hình. Tốt khi nhận ra cả bộ dữ liệu còn thiếu mẫu và lập luận được thứ tự thực hiện."}, {"type": "order", "tag": "HĐ2 • Hình thành kiến thức", "title": "Thứ tự thực hiện các cách cải thiện", "nav": "Thứ tự cải thiện", "icon": "🔢", "badge": "Người lập quy trình", "intro": "Em cùng nhóm sắp xếp các cách cải thiện đã chọn theo thứ tự nên làm và giải thích vì sao bước bổ sung dữ liệu đặt ở vị trí đó. Câu hỏi then chốt (2): Vì sao bước bổ sung dữ liệu nên làm sau cùng?", "items": ["Loại bỏ dữ liệu trùng lặp", "Sửa dữ liệu sai (giá trị ghi sai, đối chiếu nguồn gốc)", "Gán nhãn lại cho đúng", "Bổ sung dữ liệu còn thiếu", "Kiểm tra lại cả phần mới bổ sung bằng các bước trên"], "why": "Thứ tự gợi ý: loại trùng, sửa giá trị sai, gán lại nhãn rồi bổ sung dữ liệu. Bổ sung để sau cùng vì tin mới có thể trùng tin cũ hoặc mang nhãn sai, nên phần mới thêm cũng phải được kiểm tra lại. Dữ liệu mới cũng có thể trùng, sai giá trị hoặc mang nhãn sai; làm sạch bộ cũ trước rồi bổ sung, sau đó kiểm tra lại cả phần mới. Chấp nhận thứ tự sửa giá trị sai trước rồi mới loại trùng nếu nhóm nêu được lí do (có dòng chỉ lộ ra là trùng sau khi sửa lỗi nhập); bước bổ sung luôn để sau cùng. Máy tự loại được dòng trùng hoàn toàn, việc sửa giá trị, gán lại nhãn, loại dòng không trùng hoàn toàn do con người quyết định và ghi lí do."}, {"type": "match", "tag": "HĐ2 • Hình thành kiến thức", "title": "Phiếu học tập số 2, phần A: Bốn cách cải thiện bộ dữ liệu", "nav": "Bốn cách cải thiện", "icon": "🧰", "badge": "Người cải thiện dữ liệu", "intro": "Phần A, câu 1: với mỗi cách cải thiện, ghép một dấu hiệu nhận biết trong bộ dữ liệu và điều xảy ra với sản phẩm AI nếu bỏ qua. Câu 2: Vì sao máy không nên tự quyết định thay con người khi sửa dữ liệu sai và khi gán nhãn lại cho đúng? (ví dụ trả lời ở cặp cuối). Em tự làm phần này, không trao đổi với bạn.", "pairs": [["Bổ sung dữ liệu còn thiếu", "Dấu hiệu: một kiểu tin có rất ít mẫu (chỉ năm tin giả mạo mật khẩu trong 1 000 tin). Nếu bỏ qua: bỏ sót kiểu tin đó, ví dụ để lọt tin giả mạo yêu cầu nhập mật khẩu."], ["Loại bỏ dữ liệu trùng lặp", "Dấu hiệu: hai dòng giống hệt nhau (dòng 1 và dòng 2). Nếu bỏ qua: coi mẫu lặp quan trọng hơn các mẫu khác; được đánh giá cao hơn thực tế nếu mẫu trùng có cả ở dữ liệu kiểm thử."], ["Sửa dữ liệu sai", "Dấu hiệu: giá trị vô lí, như số liên kết âm (dòng 7). Nếu bỏ qua: học từ đặc điểm bị ghi sai nên kết quả lệch."], ["Gán nhãn lại cho đúng", "Dấu hiệu: nhãn không khớp nội dung, như tin đòi mật khẩu ở địa chỉ lạ mang nhãn “thường” (dòng 4). Nếu bỏ qua: học sai rằng tin lừa đảo là bình thường nên để lọt; hoặc chặn nhầm tin thường bị gán nhãn rác."], ["Câu 2: Vì sao máy không nên tự quyết định?", "Với việc gán lại nhãn, khi nhãn mâu thuẫn hay nghi sai, máy chỉ phát hiện được chỗ khác thường, không biết nhãn nào đúng. Với việc sửa dữ liệu sai, giá trị đúng phải đối chiếu nguồn gốc, máy không tự biết. Ở cả hai việc, người hiểu nội dung mới quyết định được, chịu trách nhiệm và ghi lí do để người khác kiểm tra lại."]], "why": "Đã đáp ứng: câu 1 có đủ bốn hàng, mỗi hàng một dấu hiệu và một tác động hợp lí (ví dụ từ bộ tin nhắn đã làm hoặc tự nêu); ở hàng “Bổ sung dữ liệu còn thiếu”, nêu dòng trống nội dung (dòng 6) cũng chấp nhận nếu kèm việc tìm lại nội dung từ nguồn gốc; câu 2 nêu được lí do cả việc sửa dữ liệu sai lẫn việc gán lại nhãn cần con người quyết định. Chưa thấy minh chứng: dấu hiệu nhầm sang cách khác (ví dụ nêu “nhãn sai” ở hàng “Loại bỏ dữ liệu trùng lặp”), tác động chỉ ghi chung “AI sai” ở nhiều hàng; câu 2 chỉ ghi “máy hay sai” mà không gắn với dữ liệu. Mức Khá: mỗi cách có dấu hiệu cụ thể, đúng loại và tác động gắn với kết quả cụ thể (bỏ sót, chặn nhầm). Mức Tốt: dấu hiệu và tác động tự nêu được ngoài bảng tin nhắn hoặc giải thích được cơ chế (mẫu trùng làm điểm kiểm thử cao hơn thực tế); câu 2 nêu cả trách nhiệm của người quyết định và việc ghi lí do để người khác kiểm tra lại."}, {"type": "flag", "tag": "HĐ3 • Luyện tập", "title": "Làm sạch bộ báo cáo lỗi phần mềm", "nav": "Báo cáo lỗi phần mềm", "icon": "🐞", "badge": "Người làm sạch dữ liệu", "intro": "Tình huống (giả định): bảng dưới là tám báo cáo lỗi phần mềm (dữ liệu giả lập) dùng để huấn luyện mô hình gợi ý mức ưu tiên sửa lỗi (Thấp, Trung bình, Cao). Nhóm không được đoán giá trị khi chưa có căn cứ. Nhiệm vụ 1: gắn cờ các dòng cần xử lí và đọc cách xử lí kèm lí do; với dòng cần gán lại nhãn, ghi ai quyết định ở cột Lí do.", "cols": ["Dòng", "Mô tả lỗi", "Số lần gặp", "Hệ điều hành", "Mức ưu tiên"], "flagWhat": "cần xử lí (gần trùng, thiếu, sai, nhãn sai, trùng)", "rows": [{"c": ["1", "Ứng dụng đóng đột ngột khi bấm Đăng nhập", "48", "Android", "Thấp"], "bad": true, "why": "Dòng 1 và 2: gần trùng, cùng mô tả ứng dụng thoát khi đăng nhập nhưng mang nhãn mâu thuẫn (Thấp và Cao). Gộp thành một bản ghi; đề xuất mức Cao; người có chuyên môn xác nhận nhãn. Lí do: lỗi chặn người dùng đăng nhập và gặp nhiều lần (48 và 51 lượt). Người có chuyên môn quyết định nhãn đúng."}, {"c": ["2", "App tự thoát lúc đăng nhập", "51", "Android", "Cao"], "bad": true, "why": "Cặp gần trùng với dòng 1, nhãn mâu thuẫn (Thấp và Cao): so khớp từng chữ không phát hiện được, phải đọc hiểu nghĩa. Người có chuyên môn quyết định nhãn đúng trước khi gộp."}, {"c": ["3", "Nút Gửi lệch 2 pixel so với thiết kế", "3", "iOS", "Thấp"], "bad": false}, {"c": ["4", "Mất toàn bộ bài đã lưu sau khi cập nhật", "12", "(trống)", "Cao"], "bad": true, "why": "Thiếu hệ điều hành. Đối chiếu nhật kí gốc để bổ sung; không có thì đánh dấu thiếu. Lí do: không điền theo phỏng đoán. Dòng 4 được giữ vì chỉ thiếu một cột, phần còn lại vẫn dùng được."}, {"c": ["5", "Chữ trong mục Cài đặt bị lỗi phông chữ", "-7", "Android", "Thấp"], "bad": true, "why": "Giá trị sai: số lần gặp bằng -7. Đối chiếu nhật kí gốc để sửa; không tự đổi thành 7. Không truy được nguồn thì người làm dữ liệu cân nhắc loại dòng, ghi lí do. Số lần gặp không thể âm; giá trị đúng chỉ có trong nhật kí."}, {"c": ["6", "Mật khẩu hiển thị dạng văn bản thô trong nhật kí lỗi", "5", "iOS", "Thấp"], "bad": true, "why": "Nhãn sai: lỗi lộ mật khẩu trong nhật kí đang mang mức Thấp. Đề xuất gán lại mức Cao; người có chuyên môn xác nhận. Lí do: lỗi lộ mật khẩu là lỗi bảo mật, cần ưu tiên sửa."}, {"c": ["7", "Màn hình trắng sau khi mở ảnh lớn", "20", "Android", "Trung bình"], "bad": true, "why": "Dòng 7 và 8: trùng hoàn toàn. Giữ một dòng. Lí do: hai dòng giống nhau ở mọi cột."}, {"c": ["8", "Màn hình trắng sau khi mở ảnh lớn", "20", "Android", "Trung bình"], "bad": true, "why": "Trùng hoàn toàn với dòng 7: giữ một dòng, loại dòng còn lại."}], "after": "Dòng 3: không có vấn đề, giữ nguyên; lỗi nhỏ về giao diện, số lần gặp thấp, mức Thấp là hợp lí. Dòng 4 được giữ, còn dòng 6 ở phần A bị loại khi không tìm lại được: dòng 4 chỉ thiếu một cột, dòng 6 mất cả nội dung. Số liên kết ở phần A đếm lại được trên tin nhắn gốc, còn số lần gặp ở dòng 5 chỉ có trong nhật kí nên không tự sửa. Hai chỗ dễ sai cần phản hồi: không nhận ra cặp gần trùng 1–2; tự điền “7” ở dòng 5 hoặc tự điền hệ điều hành ở dòng 4. Mức phản hồi cho nhóm: xử lí hợp lí ít nhất 6 trong 8 dòng kèm lí do."}, {"type": "quiz", "tag": "HĐ3 • Luyện tập", "title": "Nhiệm vụ 2, 3 và tự đánh giá của nhóm", "nav": "Hỏi đáp về báo cáo lỗi", "icon": "❓", "badge": "Người phản biện", "intro": "Sau khi xử lí tám báo cáo lỗi, trả lời Nhiệm vụ 2, Nhiệm vụ 3 (trao đổi miệng ở B3) và câu hỏi then chốt (1): Hai dòng nào nói về cùng một lỗi?", "qs": [{"q": "Câu hỏi then chốt (1): Hai dòng nào nói về cùng một lỗi?", "opts": ["Dòng 1 và dòng 2 (cùng lỗi thoát ứng dụng khi đăng nhập trên Android); dòng 7 và dòng 8 cũng cùng một lỗi nhưng trùng hoàn toàn", "Chỉ dòng 3 và dòng 4", "Dòng 5 và dòng 6"], "a": 0, "why": "Dòng 1 và dòng 2 cùng lỗi thoát ứng dụng khi đăng nhập trên Android. Dòng 7 và dòng 8 cũng cùng một lỗi nhưng trùng hoàn toàn."}, {"q": "Nhiệm vụ 2. Chọn hai nguyên nhân khiến mô hình huấn luyện từ bảng này có thể gợi ý mức Thấp cho lỗi lộ mật khẩu.", "opts": ["Nhãn sai ở dòng 6", "Bộ dữ liệu có rất ít mẫu lỗi bảo mật mức Cao", "Thuật toán quá chậm", "Số lần gặp của dòng 3 quá thấp"], "a": [0, 1], "why": "Hai nguyên nhân: nhãn sai ở dòng 6; bộ dữ liệu có rất ít mẫu lỗi bảo mật mức Cao. Cách khắc phục: gán lại nhãn dòng 6 (người có chuyên môn xác nhận); bổ sung các báo cáo lỗi bảo mật đã được kiểm tra nhãn."}, {"q": "Nhiệm vụ 3. Vì sao dòng 1 và dòng 2 không bị phát hiện nếu chỉ so khớp từng chữ? Nên xử lí hai dòng này thế nào và ai quyết định?", "opts": ["So khớp từng chữ chỉ phát hiện được dòng 7 và dòng 8. Dòng 1 và 2 khác cách diễn đạt nên phải đọc hiểu nghĩa mới thấy cùng một lỗi; hai dòng mang nhãn mâu thuẫn nên người có chuyên môn quyết định nhãn đúng trước khi gộp", "Máy tự gộp rồi chọn mức Thấp", "Bỏ cả hai dòng, không cần ai quyết định"], "a": 0, "why": "So khớp từng chữ chỉ tìm được dòng trùng hoàn toàn; dòng gần trùng phải đọc hiểu nghĩa. Nhãn mâu thuẫn do người có chuyên môn quyết định."}, {"q": "Gợi ý cho nhóm khá: rủi ro khi gộp dòng 1 và dòng 2 là gì và giảm bằng cách nào?", "opts": ["Hai báo cáo có thể là hai lỗi khác nhau dù mô tả giống (ví dụ khác phiên bản ứng dụng), gộp nhầm thì mất thông tin. Giảm rủi ro: người có chuyên môn đọc lại cả hai báo cáo, đối chiếu nhật kí gốc trước khi gộp, ghi lại dòng nào đã gộp và lí do", "Không có rủi ro vì hai dòng giống nhau", "Rủi ro là máy chạy chậm"], "a": 0, "why": "Mức Tốt: nêu được rủi ro khi gộp dòng và cách giảm rủi ro."}, {"q": "Ba ô tự đánh giá của nhóm: ô nào đạt khi dòng 4, dòng 5 không bị điền giá trị đoán?", "opts": ["Ô 2: Không điền giá trị theo phỏng đoán", "Ô 1: Mỗi cách xử lí đều có lí do", "Ô 3: Đã ghi người quyết định cho các dòng cần gán lại nhãn"], "a": 0, "why": "Ô 1 đạt khi mọi dòng trong bảng xử lí có lí do. Ô 2 đạt khi dòng 4, dòng 5 không bị điền giá trị đoán; ô 3 đạt khi cột Lí do của dòng 1 và 2, dòng 6 ghi người có chuyên môn quyết định. Mức Khá: nhận ra dòng 1 và dòng 2 là cặp gần trùng mang nhãn mâu thuẫn; không sửa dòng 3."}]}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Quy trình kiểm tra dữ liệu trước khi huấn luyện", "nav": "Quy trình kiểm tra", "icon": "🛠️", "badge": "Kiến trúc sư quy trình", "intro": "Phần B Phiếu học tập số 2. Tình huống (giả định): một tệp CSV (tệp bảng dữ liệu, mỗi dòng một báo cáo) gồm 500 báo cáo lỗi có các cột mô_tả, số_lần_gặp, mức_ưu_tiên, cần được kiểm tra trước khi dùng để huấn luyện. Với mỗi bước cần kiểm tra, em mô tả cách làm bằng cách liệt kê các bước hoặc vẽ sơ đồ khối, ghi máy được tự xử lí hay phải chuyển cho người quyết định và giải thích vì sao. Câu hỏi then chốt (1): Ở bước này máy biết chắc kết quả đúng hay chỉ phát hiện được chỗ nghi ngờ? Quy trình chỉ thử trên dữ liệu giả lập. Khung gợi ý: Với mỗi dòng trong tệp: nếu …… thì đánh dấu loại bỏ; nếu số_lần_gặp …… thì đưa vào danh sách ……. Gom các dòng theo mô_tả; nếu một nhóm có …… thì …….", "fields": [{"id": "b1", "label": "1. Tìm các dòng trùng hoàn toàn: các bước; máy tự xử lí hay chuyển cho người? Vì sao?", "ph": "Duyệt từng dòng, nếu dòng đã xuất hiện trước đó thì đánh dấu loại bỏ. Máy tự xử lí được vì trùng hoàn toàn là điều kiện xác định rõ ràng; máy biết chắc (hai dòng giống hệt)."}, {"id": "b2", "label": "2. Tìm giá trị số_lần_gặp trống hoặc nhỏ hơn 0: các bước; máy hay người? Vì sao?", "ph": "Nếu số_lần_gặp trống hoặc nhỏ hơn 0 thì đưa dòng vào danh sách cần kiểm tra. Máy chỉ phát hiện được, còn giá trị đúng phải do người đối chiếu nguồn."}, {"id": "b3", "label": "3. Tìm các mô tả giống nhau nhưng khác mức ưu tiên: các bước; máy hay người? Vì sao?", "ph": "Gom các dòng theo mô_tả, nếu một nhóm có nhiều hơn một mức_ưu_tiên thì đưa vào danh sách cần người quyết định. Máy phát hiện mâu thuẫn nhưng không biết nhãn nào đúng."}, {"id": "tl", "label": "Thử lại bằng tay trên tám dòng báo cáo lỗi: bước nào phát hiện được dòng nào?", "ph": "Bước 1 phát hiện dòng 7, 8; bước 2 phát hiện dòng 5; bước 3 không phát hiện dòng nào vì dòng 1 và dòng 2 khác chữ. Dòng 4 (thiếu hệ điều hành) không bị phát hiện vì tệp không có cột này; dòng 6 (nhãn sai) cũng không bị phát hiện."}, {"id": "kt", "label": "Phát hiện dòng gần trùng không giống từng chữ (gợi ý cho HS khá)", "ph": "Đưa mô tả về cùng dạng (viết thường, bỏ dấu câu), so các từ khoá chung (như “đăng nhập”) và coi các cụm cùng nghĩa (“đóng đột ngột”, “tự thoát”) là giống nhau, đưa cặp có nhiều từ giống nhau vào danh sách để người đọc lại. Máy không tự gộp."}], "checks": ["Có đủ ba bước, phân biệt đúng việc máy tự xử lí (dòng trùng hoàn toàn) với việc cần người quyết định (giá trị sai, nhãn mâu thuẫn).", "Mức Khá: thử lần lượt từng bước trên tám dòng báo cáo lỗi cho kết quả đúng.", "Mức Tốt: đề xuất được cách phát hiện các dòng gần trùng không giống từng chữ.", "Quy trình cần chạy lại sau mỗi lần bổ sung dữ liệu mới; không để quy trình tự động sửa, xoá hoặc gán lại nhãn cho dòng cần người quyết định."], "sample": "Bước 1: máy biết chắc (hai dòng giống hệt). Bước 2, bước 3: máy chỉ phát hiện chỗ nghi ngờ, người quyết định giá trị và nhãn đúng. Kết quả cho thấy quy trình máy chỉ hỗ trợ; dòng gần trùng và nhãn sai đơn lẻ vẫn cần người đọc. Mẫu nhận xét: “Em đã tách đúng ba bước kiểm tra. Bước 2 em để máy tự sửa giá trị âm thành dương. Em thử hỏi: máy có biết giá trị đúng trong nhật kí không?” Phần chưa xong làm ở nhà, không là điều kiện đạt."}], "sub": "Phần mềm mô phỏng • Giáo dục AI lớp 9 • Môn đảm nhiệm: Toán • Chạy ngoại tuyến, không dùng AI thật, không thu thập dữ liệu"};

 md.fields.forEach(f=>{cm.appendChild(E('label','f',esc(f.label)+(f.hint?` <small class="h">(${esc(f.hint)})</small>`:'')));let el;if(f.opts){el=E('select');el.innerHTML='<option value="">– Chọn –</option>'+f.opts.map(o=>`<option ${s.f[f.id]===o?'selected':''}>${esc(o)}</option>`).join('');el.onchange=()=>s.f[f.id]=el.value}else{el=E(f.long===false?'input':'textarea');if(f.long===false)el.type='text';el.value=s.f[f.id]||'';el.placeholder=f.ph||'';el.oninput=()=>s.f[f.id]=el.value}cm.appendChild(el)});c.appendChild(cm);
 if(md.checks){c.appendChild(E('h3',null,'Tự kiểm tra bằng bảng kiểm'));md.checks.forEach((t,k)=>{const d=E('label','chk',`<input type="checkbox" ${s.c[k]?'checked':''}> <span>${esc(t)}</span>`);d.querySelector('input').onchange=e=>s.c[k]=e.target.checked;c.appendChild(d)})}
 const b=E('button','btn','Hoàn thành & chấm tự đánh giá');b.onclick=()=>{const filled=md.fields.filter(f=>(s.f[f.id]||'').trim().length>=4).length,chk=Object.values(s.c).filter(Boolean).length;if(!s.rs){s.rs=1;award(i,Math.round(6*(filled/md.fields.length*.6+(md.checks?chk/md.checks.length:1)*.4)))}good();ST.done[i]=1;go(i)};c.appendChild(b);
 const dl=E('button','btn w','⬇ Lưu thành ảnh PNG');dl.onclick=()=>{const cv=document.createElement('canvas');cv.width=1000;cv.height=720;const x=cv.getContext('2d');x.fillStyle='#fffdf3';x.fillRect(0,0,1000,720);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--o');x.lineWidth=10;x.strokeRect(8,8,984,704);x.fillStyle='#1f2d3d';x.font='bold 30px Arial';x.fillText(md.title.slice(0,50),36,64);let y=110;const w=(t,y0,fs)=>{x.font=fs;const ws=String(t).split(' ');let l='';let yy=y0;for(const a of ws){if(x.measureText(l+a).width>920){x.fillText(l,36,yy);yy+=28;l=''}l+=a+' '}x.fillText(l,36,yy);return yy+34};md.fields.forEach(f=>{x.fillStyle='#d35400';y=w(f.label,y,'bold 20px Arial');x.fillStyle='#1f2d3d';y=w(s.f[f.id]||'……',y,'20px Arial')});const a=document.createElement('a');a.href=cv.toDataURL();a.download='san-pham-cua-em.png';a.click()};c.appendChild(dl);
 if(ST.done[i]){c.appendChild(E('div','fb ok','✅ Đã lưu bài làm. '+(md.sample?'<br><b>Gợi ý mẫu:</b> '+esc(md.sample):'')));finish(c,i)}m.appendChild(c)};
/* ---- result ---- */
function result(m){const c=E('div','card');const mx=maxPts()||1,pc=Math.min(100,Math.round(ST.pts/mx*100));
 c.innerHTML=`<h2>🏁 Kết quả của em</h2><p class="lead">Tổng điểm: <b>${ST.pts}</b> / ${mx} (${pc}%)</p><div class="bar" style="height:18px"><i style="width:${pc}%"></i></div><div style="text-align:center;margin:14px 0">`+MODS.map((x,k)=>`<span class="badge ${ST.done[k]?'on':''}">${x.icon||'⭐'}<small>${esc(x.badge||x.nav||x.title).slice(0,28)}</small></span>`).join('')+`</div>
 <table><tr><th>Hoạt động</th><th>Điểm</th></tr>`+MODS.map((x,k)=>`<tr><td>${esc(x.title)}</td><td>${ST.got[k]}/${mp(x)}</td></tr>`).join('')+`</table>
 <div class="fb info"><b>Ghi nhớ:</b><ul style="margin:6px 0 0 18px;padding:0">`+(SPEC.takeaways||[]).map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`;
 const b=E('button','btn','↺ Chơi lại');b.style.marginTop='14px';b.onclick=()=>{fresh();$('#score').textContent='⭐ 0';go(0)};const p=E('button','btn w','🖨 In kết quả');p.onclick=()=>print();c.append(b,p);m.appendChild(c);if(pc>=70)confetti()}
$('#ttl').textContent=SPEC.title;$('#sub').textContent=SPEC.sub||'';$('#ico').textContent=SPEC.icon||'🧭';
go(Math.max(0,Math.min(MODS.length,parseInt((location.hash||'').slice(1))||0)));
if(SPEC.selftest||(location.hash||'').indexOf('qa')>0){const errs=[];window.addEventListener('error',e=>errs.push(e.message));(async function(){const w=ms=>new Promise(r=>setTimeout(r,ms));const chk=()=>{const L=[...document.querySelectorAll('#main .fb,#main .msg')];for(let q=1;q<L.length;q++){if(L[q].outerHTML===L[q-1].outerHTML&&L[q].parentNode===L[q-1].parentNode){errs.push('DUP '+(L[q].textContent||'').slice(0,40));break}}if(document.querySelectorAll('#main .btn.g').length>1)errs.push('DUP BTN');if(document.querySelectorAll('#main .card').length>1)errs.push('DUP CARD')};
 for(let i=0;i<=MODS.length;i++){go(i);for(let n=0;n<45;n++){const els=[...document.querySelectorAll('#main .choice,#main .btn,#main .tcard,#main .zone,#main tbody tr,#main .yn button,#main .it,#main .ord button,#main .pool,#main select,#main input')];if(!els.length)break;const e=els[Math.random()*els.length|0];try{if(e.tagName=='SELECT'){e.selectedIndex=Math.min(1,e.options.length-1);e.dispatchEvent(new Event('change'))}else if(e.type=='range'){e.value=Math.random()*100;e.dispatchEvent(new Event('input'))}else if(e.type=='checkbox'){e.checked=!e.checked;e.dispatchEvent(new Event('change'))}else if(e.tagName=='INPUT'||e.tagName=='TEXTAREA'){e.value='thử nghiệm nội dung';e.dispatchEvent(new Event('input'))}else e.click()}catch(x){errs.push(String(x))}await w(4);chk()}await w(1100);chk()}
 await w(1200);const r=errs.length?'ERR '+errs.slice(0,2).join(' | '):'OK';if(SPEC.selftest)$('#sub').textContent='SELFTEST: '+r;try{parent.postMessage({qa:location.pathname.split('/').pop(),r},'*')}catch(x){}go(0)})()}
</script></body></html>
