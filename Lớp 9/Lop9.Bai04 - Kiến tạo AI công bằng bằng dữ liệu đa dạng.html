<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài 4. Kiến tạo AI công bằng bằng dữ liệu đa dạng – Lớp 9</title>
<style>
:root{--o:#8e44ad;--od:#6a3381;--g:#2ecc71;--y:#f6c744;--r:#ef5350;--ink:#1f2d3d;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--o) 18%,#fff),transparent 42%),radial-gradient(circle at 100% 18%,#dff3ff,transparent 40%),var(--bg);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--o),var(--od));color:#fff;box-shadow:0 3px 10px #0002}
header h1{margin:0;font-size:20px;line-height:1.2}header small{opacity:.92;display:block;margin-top:2px}
.hud{margin-left:auto;display:flex;gap:10px;align-items:center}.pill{background:#fff3;border-radius:20px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ibtn{background:#fff3;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}
.map{display:flex;padding:12px 20px;max-width:1040px;margin:0 auto;align-items:flex-start;overflow-x:auto}
.node{flex:1;min-width:84px;text-align:center;font-size:11.5px;cursor:pointer;position:relative;padding:0 2px}
.node i{display:flex;width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid #cbd5e1;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#94a3b8;transition:.3s;position:relative;z-index:1}
.node.on i{background:var(--o);border-color:var(--od);color:#fff;transform:scale(1.15)}.node.done i{background:var(--g);border-color:#1e9e55;color:#fff}
.node:not(:last-child)::after{content:"";position:absolute;top:18px;left:calc(50% + 24px);width:calc(100% - 48px);height:4px;background:#d9e2ec}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 6px 18px #0001;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;color:var(--od)}h3{color:var(--od)}p.lead{margin:0 0 12px;color:#52606d}
.ban{position:relative;overflow:hidden;border-radius:16px;margin:-4px -4px 14px;padding:14px 18px;min-height:84px;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--o) 22%,#fff),color-mix(in srgb,var(--o) 6%,#fff) 60%,#eaf4ff);border:2px solid color-mix(in srgb,var(--o) 30%,#fff)}
.ban .big{flex:none;width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--o) 35%,#fff),0 0 0 5px #fff8;animation:bob 3s ease-in-out infinite}
.ban .tt{flex:1;min-width:0;font-weight:700;color:var(--od);font-size:13px;opacity:.85;line-height:1.3}
.ban .fl{position:absolute;font-size:26px;opacity:.9;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0002)}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
.ei{display:inline-block;margin-right:5px;font-size:1.15em}
.tag{display:inline-block;background:color-mix(in srgb,var(--o) 15%,#fff);color:var(--od);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-bottom:6px}
.btn{background:var(--o);color:#fff;border:0;padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--od);transition:.1s;margin:4px 6px 4px 0}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.g{background:var(--g);box-shadow:0 3px 0 #1e9e55}.btn.w{background:#fff;color:var(--od);border:2px solid var(--o);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.stage{grid-template-columns:1fr}}
.phone{background:#1f2d3d;border-radius:26px;padding:12px;max-width:380px;margin:auto;width:100%}
.screen{background:#eef2f7;border-radius:16px;min-height:300px;padding:10px;display:flex;flex-direction:column;gap:8px}
.appbar{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.msg{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;animation:pop .3s}.me{align-self:flex-end;background:#cfe8ff}.ai{align-self:flex-start;background:#fff;border:1px solid #dbe3ee}.ai::before{content:"🤖 "}
.typing{align-self:flex-start;color:#7b8794;font-size:13px}
.char{text-align:center}.char svg{width:120px;height:120px}.bubble{background:#fff8e1;border:2px solid var(--y);border-radius:14px;padding:10px;font-size:14px;margin:8px 0}
.choices{display:grid;gap:8px;margin:10px 0}.choice{background:#fff;border:2px solid #d9e2ec;border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;cursor:pointer;transition:.15s;font:inherit}.choice:hover:not(:disabled){border-color:var(--o);transform:translateX(3px)}.choice.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.choice:disabled{opacity:.55;cursor:default}.choice.ok{border-color:var(--g);background:#e9fbf0}.choice.no{border-color:var(--r);background:#fdeceb}
.meter{margin:6px 0;font-size:13px}.bar{height:14px;background:#e8edf3;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .8s;border-radius:8px;background:var(--g)}
.mc0 i{background:var(--g)}.mc1 i{background:var(--r)}.mc2 i{background:#4aa3ff}.mc3 i{background:var(--y)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;animation:pop .3s}.fb.ok{background:#e3f9ec;border:2px solid var(--g)}.fb.no{background:#fdeceb;border:2px solid var(--r)}.fb.info{background:#e8f3ff;border:2px solid #8cc4ff}
.light{display:flex;gap:8px;justify-content:center;background:#2b3a4a;border-radius:30px;padding:10px;width:max-content;margin:6px auto}.light b{width:34px;height:34px;border-radius:50%;background:#46566a;transition:.3s}.light b.on.g{background:var(--g);box-shadow:0 0 16px var(--g)}.light b.on.y{background:var(--y);box-shadow:0 0 16px var(--y)}.light b.on.r{background:var(--r);box-shadow:0 0 16px var(--r)}
.qrow{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:#f6f8fb;font-size:14px}.qrow span{flex:1}
.yn button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;margin-left:4px;background:#e1e8f0}.yn button.on{background:var(--o);color:#fff}
.board{display:grid;gap:12px}.zone{min-height:170px;border-radius:16px;padding:10px;border:3px dashed var(--zc,var(--o));background:color-mix(in srgb,var(--zc,var(--o)) 8%,#fff);transition:.2s}.zone h4{margin:0 0 8px;text-align:center;color:var(--ink)}.zone.over{transform:scale(1.02);box-shadow:0 0 0 4px #0002}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:10px;background:#eef2f7;border-radius:14px;margin-bottom:12px}
.tcard{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;font-size:13.5px;cursor:grab;box-shadow:0 2px 0 #cbd5e1;user-select:none}.pool .tcard{flex:1 1 230px}.zone .tcard{margin-bottom:6px}.tcard.sel{border-color:var(--o);box-shadow:0 0 0 3px #0003}.tcard.ok{border-color:var(--g);background:#f1fff6}.tcard.no{border-color:var(--r);background:#fff3f2;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
select,textarea,input[type=text]{width:100%;font:inherit;padding:8px;border:2px solid #d9e2ec;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:64px}
label.f{display:block;margin:10px 0 2px;font-weight:700;font-size:14px}small.h{color:#6b7a8a;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border:1px solid #d5dde8;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fa}tr.pick{background:#fff3cd;cursor:pointer}tr.sel{background:#ffe8a3}tr.ok td{background:#e3f9ec}tr.no td{background:#fdeceb}tbody tr{cursor:pointer}
.slrow{margin:12px 0}.slrow input[type=range]{width:100%}.slrow b{color:var(--od)}
.ord{display:flex;gap:8px;align-items:center;background:#f6f8fb;border:2px solid #d9e2ec;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}.ord.ok{border-color:var(--g);background:#e9fbf0}.ord.no{border-color:var(--r);background:#fdeceb}.ord span{flex:1}.ord button{border:0;background:#e1e8f0;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:700}.ord em{font-style:normal;font-weight:800;color:var(--od);width:24px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .it{padding:10px;border:2px solid #d9e2ec;border-radius:12px;background:#fff;cursor:pointer;font-size:14px}.mt .it.sel{border-color:var(--o);background:color-mix(in srgb,var(--o) 10%,#fff)}.mt .it.done{border-color:var(--g);background:#e9fbf0;cursor:default}.mt .it.bad{border-color:var(--r);animation:shake .4s}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:4px}
.cmt{background:linear-gradient(135deg,#fffdf3,color-mix(in srgb,var(--o) 18%,#fff));border:3px solid var(--o);border-radius:18px;padding:16px;margin:12px 0}
.badge{display:inline-block;width:104px;vertical-align:top;font-size:32px;margin:4px;text-align:center;filter:grayscale(1);opacity:.4;transition:.5s;text-align:center}.badge small{display:block;font-size:11px;font-weight:700;max-width:90px}.badge.on{filter:none;opacity:1;transform:scale(1.1)}
.note{background:#fff0ef;border-left:5px solid var(--r);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.cond{display:inline-block;background:#eef3fa;border-radius:8px;padding:2px 8px;margin:2px;font-size:12.5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media print{header,.map,.btn,#confetti{display:none}.card{box-shadow:none}}
</style></head><body>

<script>
const SPEC={"icon": "🎙️", "title": "Bài 4. Kiến tạo AI công bằng bằng dữ liệu đa dạng – Lớp 9", "ainote": "Trợ lí thư viện, số liệu và kế hoạch thu thập là giả định, chỉ lập trên giấy: không thử trợ lí bằng giọng HS, không ghi âm giọng bạn, không chê cách nói hay tuổi tác của ai, không lấy giọng nói của người khác trên mạng khi chưa được phép. Chọn dữ liệu và rà soát kế hoạch là trách nhiệm của người làm AI; người tham gia phải được xin đồng ý, được rút lại, biết thời hạn lưu trữ và được ẩn danh.", "takeaways": ["Phiên bản 1 học chủ yếu từ giọng Bắc, giọng HS nên nhận sai nhiều với giọng Trung, giọng Nam và người từ 60 tuổi. Phiên bản 2 có đủ mẫu nên các nhóm được phục vụ gần như nhau. Dữ liệu là một nguyên nhân quan trọng, không phải do người nói “nói sai”; cần xem kết quả theo từng nhóm.", "AI dùng cho nhiều người phải phục vụ tốt mọi nhóm người dùng. Dữ liệu thiếu một nhóm làm nhóm đó bị nhận sai nhiều hơn, bị thiệt dù không ai cố ý phân biệt; con số trung bình cao có thể che giấu nhóm bị phục vụ kém. Khác biệt về giọng nói, tuổi tác là bình thường, cần được tôn trọng.", "Dữ liệu “dễ lấy nhất” thường bỏ sót nhóm cần được phục vụ; kế hoạch thu thập phải được rà soát trước khi thực hiện bằng ba câu hỏi: Ai được đại diện? Ai bị bỏ sót? Dữ liệu đã đa dạng, gần với người dùng thật chưa?", "Dữ liệu công bằng cần đủ các nhóm người dùng, đa dạng người nói và hoàn cảnh ghi âm; người tham gia được xin đồng ý, được rút lại, biết thời hạn lưu trữ, được ẩn danh. Công bằng không có nghĩa là chia đều; dữ liệu đa dạng hơn và kiểm thử theo từng nhóm giúp AI công bằng hơn."], "modules": [{"type": "story", "tag": "HĐ1 • Mở đầu", "title": "Vì sao trợ lí thư viện nhận sai câu lệnh?", "nav": "Trợ lí nhận sai", "icon": "📚", "badge": "Người đặt câu hỏi", "intro": "<b>Thẻ tình huống (giả định).</b> Câu lạc bộ Tin học Trường THCS Hoà Bình làm trợ lí giọng nói cho thư viện: người dùng nói tên sách, màn hình hiện vị trí giá sách. Người dùng thư viện đến từ nhiều vùng miền, nhiều lứa tuổi.<br>Lượt 1. Minh (giọng miền Bắc) nói: “Tìm sách Lão Hạc”. Màn hình hiện: “Lão Hạc, giá B3”.<br>Lượt 2. Quyên (giọng miền Trung) nói cùng câu đó. Màn hình hiện: “Không nhận được câu lệnh, vui lòng nói lại”. Quyên nói lại ba lần vẫn không được.<br>Lượt 3. Bà Lan (72 tuổi) nói: “Tìm Truyện Kiều”. Màn hình hiện: “Truyện kiếm hiệp”.<br><b>Vì sao cùng một trợ lí mà có người dùng được, có người không? Lỗi ở người nói hay ở đâu?</b> Với mỗi nhân vật, em chọn dự đoán và một lí do rồi xem hậu quả. GV chấp nhận mọi dự đoán có lí do ở bước này.", "app": "🎙️ Trợ lí thư viện (mô phỏng)", "hello": "Xin chào! Hãy nói tên sách bạn cần tìm. (Đây là mô phỏng: không thử trợ lí bằng giọng của bạn trong lớp.)", "meters": [{"n": "Công bằng với người dùng", "b": 40, "c": 0}, {"n": "Hiểu đúng nguyên nhân", "b": 30, "c": 1}, {"n": "Tôn trọng người nói", "b": 50, "c": 2}], "chars": [{"n": "Minh (giọng miền Bắc)", "color": "#4aa3ff", "task": "nói “Tìm sách Lão Hạc” và được “Lão Hạc, giá B3”. Vậy trợ lí chạy tốt hay chỉ tốt với một số người?", "opts": [{"t": "Trợ lí chạy tốt vì nó nhận đúng câu của Minh", "chat": ["Tìm sách Lão Hạc", "Lão Hạc, giá B3"], "ch": [-15, -20, 0], "v": "bad", "fb": "Một lần đúng chưa đủ kết luận. Cùng câu lệnh đó Quyên bị từ chối ba lần; cần xem kết quả với từng nhóm người dùng."}, {"t": "Chưa kết luận: so sánh với Quyên và bà Lan rồi hỏi trợ lí đã học từ giọng của những ai", "chat": null, "ch": [20, 30, 15], "v": "good", "fb": "Câu trả lời sẽ tìm ra ở bước sau: lỗi không ở người nói; một nguyên nhân quan trọng là cách làm trợ lí, chẳng hạn trợ lí học chủ yếu từ giọng của một số người."}]}, {"n": "Quyên (giọng miền Trung)", "color": "#ff9f43", "task": "nói cùng câu đó, nói lại ba lần vẫn không được. Em dự đoán nguyên nhân là gì?", "opts": [{"t": "Vì Quyên nói giọng khác, nên nói cho “chuẩn” hơn", "chat": ["Tìm sách Lão Hạc", "Không nhận được câu lệnh, vui lòng nói lại"], "ch": [-30, -25, -40], "v": "bad", "fb": "Đây là dự đoán “do người nói”, một ngộ nhận cần xử lí ở HĐ 2.1: lỗi không ở người nói; giọng vùng miền, tuổi tác là bình thường và cần được tôn trọng."}, {"t": "Vì lúc làm trợ lí, nhóm chỉ thu giọng một số bạn", "chat": null, "ch": [30, 35, 25], "v": "good", "fb": "Đây là dự đoán “do cách làm trợ lí”. GV ghi lên góc bảng theo hai nhóm “do người nói” và “do cách làm trợ lí”; cần kiểm tra bằng số liệu để biết làm thế nào cho AI công bằng."}, {"t": "Chỉ là lỗi ngẫu nhiên của một lần nói", "chat": null, "ch": [-5, -10, 0], "v": "mid", "fb": "Quyên nói lại ba lần vẫn không được và còn có người khác bị nhận sai, nên cần đo theo nhóm chứ không bỏ qua."}]}, {"n": "Bà Lan (72 tuổi)", "color": "#e17055", "task": "nói “Tìm Truyện Kiều” nhưng màn hình hiện “Truyện kiếm hiệp”. Vì sao có người dùng được, có người không?", "opts": [{"t": "Bà Lan lớn tuổi nên nói không rõ", "chat": ["Tìm Truyện Kiều", "Truyện kiếm hiệp"], "ch": [-25, -20, -35], "v": "bad", "fb": "Lí do thuộc nhóm “do người nói” là ngộ nhận. Tuổi tác là bình thường, không phải lỗi của người nói."}, {"t": "Có nhiều lí do có thể khiến trợ lí nhận sai; cần kiểm tra bằng số liệu theo từng nhóm", "chat": null, "ch": [25, 35, 15], "v": "good", "fb": "Vấn đề học tập: có nhiều lí do có thể khiến trợ lí nhận sai; cần kiểm tra bằng số liệu để biết làm thế nào cho AI công bằng."}]}]}, {"type": "flag", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Đọc hai bộ dữ liệu huấn luyện", "nav": "Hai bộ dữ liệu", "icon": "🔎", "badge": "Người đọc số liệu", "intro": "Hai bộ dữ liệu huấn luyện (giả định). Mỗi bộ có 1 200 đoạn ghi âm câu lệnh; ba nhóm vùng giọng cộng lại 1 200 đoạn, ba nhóm tuổi cộng lại 1 200 đoạn. Tỉ lệ ghi theo gợi ý của GV (1 080 : 1 200 = 0,9, tức 90%). Hãy gắn cờ các nhóm mà bộ A lệch xa tỉ lệ người dùng thật hoặc bỏ sót.", "cols": ["Nhóm", "Bộ A: số đoạn (tỉ lệ)", "Bộ B: số đoạn (tỉ lệ)", "Người dùng thật"], "flagWhat": "bộ A lệch xa người dùng thật hoặc bỏ sót nhóm này", "rows": [{"c": ["Giọng Bắc", "1 080 (90%)", "480 (40%)", "45%"], "bad": true, "why": "Bộ A lệch xa tỉ lệ người dùng thật: giọng Bắc chiếm 90% so với 45%."}, {"c": ["Giọng Trung", "72 (6%)", "360 (30%)", "25%"], "bad": true, "why": "Bộ A chỉ có 72 đoạn giọng Trung, thiếu so với 25% người dùng thật."}, {"c": ["Giọng Nam", "48 (4%)", "360 (30%)", "30%"], "bad": true, "why": "Bộ A chỉ có 48 đoạn giọng Nam, thiếu so với 30% người dùng thật."}, {"c": ["HS 11–15 tuổi", "1 020 (85%)", "720 (60%)", "70%"], "bad": true, "why": "Bộ A có 85% giọng HS, cao hơn người dùng thật (70%) nên mô hình học được nhiều ví dụ của nhóm này."}, {"c": ["Người lớn dưới 60 tuổi (GV, nhân viên, phụ huynh)", "180 (15%)", "300 (25%)", "20%"], "bad": false}, {"c": ["Từ 60 tuổi", "0 (0%)", "180 (15%)", "10%"], "bad": true, "why": "Bộ A bỏ sót hoàn toàn nhóm từ 60 tuổi (0 đoạn). Bộ B có đủ mẫu cho mọi nhóm."}], "after": "Bộ A lệch xa tỉ lệ người dùng thật; nhóm từ 60 tuổi bị bỏ sót hoàn toàn. Bộ B có đủ mẫu cho mọi nhóm. Câu hỏi GV hỏi ngẫu nhiên một thành viên: nhóm bị bỏ sót hoàn toàn trong bộ A là người từ 60 tuổi (0 đoạn)."}, {"type": "lab", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Thử nghiệm mô phỏng hai phiên bản trợ lí", "nav": "Thí nghiệm dữ liệu", "icon": "🧪", "badge": "Nhà thực nghiệm", "intro": "Phiên bản 1 của trợ lí học từ bộ A, phiên bản 2 học từ bộ B. Mỗi nhóm được thử 100 câu lệnh; số trong bảng là số câu nhận đúng trên 100, cũng là tỉ lệ phần trăm (giả định).<br>Phiên bản 1 | Phiên bản 2: Giọng Bắc 95 | 93; Giọng Trung 68 | 89; Giọng Nam 74 | 90; HS 11–15 tuổi 90 | 91; Người lớn dưới 60 tuổi 84 | 90; Từ 60 tuổi 52 | 85.<br>Chênh lệch giữa nhóm cao nhất và nhóm thấp nhất theo vùng giọng: 27 điểm | 4 điểm. Chênh lệch giữa nhóm cao nhất và nhóm thấp nhất theo tuổi: 38 điểm | 6 điểm.<br>Kéo thanh trượt từ bộ A (Bắc 90%, từ 60 tuổi 0%) sang bộ B (Bắc 40%, từ 60 tuổi 15%) để xem kết quả thay đổi.", "sliders": [{"id": "bac", "n": "Tỉ lệ giọng Bắc trong dữ liệu huấn luyện", "min": 30, "max": 95, "val": 90, "unit": "%"}, {"id": "tuoi", "n": "Tỉ lệ người từ 60 tuổi trong dữ liệu huấn luyện", "min": 0, "max": 20, "val": 0, "unit": "%"}], "outputs": [{"n": "Nhận đúng giọng Bắc (/100)", "base": 95, "w": {"bac": 0.04}, "c": 0}, {"n": "Nhận đúng giọng Trung (/100)", "base": 68, "w": {"bac": -0.42}, "c": 1}, {"n": "Nhận đúng người từ 60 tuổi (/100)", "base": 52, "w": {"tuoi": 2.2}, "c": 2}], "insights": [{"id": "bac", "op": ">=", "val": 85, "txt": "Phiên bản 1 nhận đúng nhiều nhất giọng Bắc (95) và HS 11–15 tuổi (90); ít nhất là giọng Trung (68) và người từ 60 tuổi (52). Bộ A có 90% giọng Bắc, 85% giọng HS nên mô hình học được nhiều ví dụ của các nhóm này."}, {"id": "bac", "op": "<=", "val": 45, "txt": "Phiên bản 2: bộ B có đủ mẫu cho mọi nhóm nên các nhóm được phục vụ gần như nhau; giọng Trung tăng từ 68 lên 89. Giọng Bắc giảm nhẹ từ 95 xuống 93 vì bộ B có ít đoạn giọng Bắc hơn bộ A (480 so với 1 080); mức giảm 2 điểm có thể chấp nhận được vì đổi lại mọi nhóm được phục vụ gần như nhau."}, {"id": "tuoi", "op": "<=", "val": 0, "txt": "Nhóm từ 60 tuổi có 0 đoạn và chỉ được nhận đúng 52 câu trên 100. Nhóm có ít hoặc không có mẫu bị nhận sai nhiều."}, {"id": "tuoi", "op": ">=", "val": 14, "txt": "Khi bộ B bổ sung dữ liệu, người từ 60 tuổi tăng từ 52 lên 85: bằng chứng mạnh nhất là so sánh hai phiên bản. Giọng Nam có ít đoạn hơn giọng Trung mà vẫn được nhận đúng nhiều hơn, cho thấy số mẫu là một nguyên nhân quan trọng, không phải nguyên nhân duy nhất."}]}, {"type": "match", "tag": "HĐ2.1 • Hình thành kiến thức", "title": "Phiếu học tập số 1, phần A: Dự đoán và đối chiếu", "nav": "Phần A: đối chiếu", "icon": "🔗", "badge": "Người đối chiếu", "intro": "Phần A. Dự đoán và đối chiếu: nhóm đọc hai bộ dữ liệu, ghi dự đoán rồi đối chiếu với kết quả mô phỏng. Ghép mỗi câu hỏi với kết quả mô phỏng và giải thích mong đợi. Nhóm ghi “sai so với dự đoán” vẫn đạt yêu cầu nếu ghi đúng kết quả và nêu được vì sao khác dự đoán.", "pairs": [["Phiên bản 1: nhận đúng nhiều nhất", "Giọng Bắc (95); theo tuổi là HS 11–15 tuổi (90). Bộ A có 90% giọng Bắc, 85% giọng HS nên mô hình học được nhiều ví dụ của các nhóm này."], ["Phiên bản 1: nhận đúng ít nhất", "Giọng Trung (68); theo tuổi là người từ 60 tuổi (52). Bộ A chỉ có 72 đoạn giọng Trung, 48 đoạn giọng Nam và không có đoạn nào của người từ 60 tuổi."], ["Phiên bản 2 thay đổi ra sao?", "Mọi nhóm từ 85 đến 93; chênh lệch còn 4 điểm theo vùng giọng, 6 điểm theo tuổi. Bộ B có đủ mẫu cho mọi nhóm nên các nhóm được phục vụ gần như nhau; giọng Bắc giảm nhẹ từ 95 xuống 93."], ["Bằng chứng nào khiến em tin?", "Dẫn số đoạn trong bộ A và số câu nhận đúng của cùng một nhóm, ví dụ người từ 60 tuổi có 0 đoạn và chỉ được nhận đúng 52 câu trên 100; mạnh nhất là so sánh hai phiên bản: giọng Trung tăng từ 68 lên 89, người từ 60 tuổi tăng từ 52 lên 85."]], "why": "Phiên bản 1 học chủ yếu từ giọng Bắc, giọng HS; nhóm có ít hoặc không có mẫu bị nhận sai nhiều. Lỗi không ở người nói. Dữ liệu là một nguyên nhân quan trọng; cần xem kết quả theo từng nhóm."}, {"type": "order", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Phiếu học tập số 1, phần B câu 1: chuỗi năm ô", "nav": "Chuỗi hậu quả", "icon": "⛓️", "badge": "Người lập luận", "intro": "Phần B. Vai trò của dữ liệu đa dạng đối với công bằng. Sắp xếp chuỗi năm ô (Ô 1 đến Ô 5) theo đúng thứ tự.", "items": ["Dữ liệu thiếu nhóm giọng Trung, giọng Nam, người lớn tuổi", "Mô hình có ít mẫu của các nhóm này", "Kết quả với nhóm đó là bị nhận sai nhiều", "Người dùng bị phục vụ kém hơn người khác: phải nói lại nhiều lần, tìm sai sách, ngại dùng, dần không dùng thư viện", "Không công bằng, dù không ai cố ý phân biệt"], "why": "Dữ liệu thiếu nhóm → mô hình có ít mẫu → kết quả với nhóm đó là bị nhận sai nhiều → người dùng bị phục vụ kém hơn người khác → không công bằng, dù không ai cố ý phân biệt. Hướng dẫn nhận xét: chuỗi hậu quả hợp lí."}, {"type": "quiz", "tag": "HĐ2.2 • Hình thành kiến thức", "title": "Vì sao AI cần công bằng và tôn trọng đa dạng?", "nav": "Vì sao cần công bằng", "icon": "💡", "badge": "Nhà lập luận", "intro": "Dựa vào kết quả thử nghiệm mô phỏng (phiên bản 1: Bắc 95, Trung 68, Nam 74, HS 11–15 tuổi 90, người lớn dưới 60 tuổi 84, từ 60 tuổi 52) để trả lời Phiếu học tập số 1 phần B và Phiếu học tập số 2 câu 1, 2.", "qs": [{"q": "Phiếu học tập số 2, câu 1: chọn một nhóm người dùng bị phiên bản 1 nhận sai nhiều. Nhóm đó có bao nhiêu đoạn ghi âm trong bộ A, được nhận đúng bao nhiêu câu trên 100?", "opts": ["Giọng Trung: 72 đoạn, nhận đúng 68; giọng Nam: 48 đoạn, nhận đúng 74; người từ 60 tuổi: 0 đoạn, nhận đúng 52", "Giọng Bắc: 1 080 đoạn, nhận đúng 95", "Người từ 60 tuổi: 180 đoạn, nhận đúng 85"], "a": 0, "why": "HS chọn một trong ba nhóm và dẫn đúng hai con số. Vì sao: mô hình có ít hoặc không có ví dụ giọng của nhóm đó nên nhận sai nhiều. Chưa thấy minh chứng nếu HS chỉ nói “người đó nói không rõ” hoặc không dẫn số liệu."}, {"q": "Đội làm trợ lí báo cáo: “Tính theo tỉ lệ giọng trong dữ liệu huấn luyện, phiên bản 1 nhận đúng khoảng 92,5%.” Độ chính xác trung bình cao như vậy có che giấu kết quả kém ở nhóm nhỏ không?", "opts": ["Không, vì 92,5% rất cao nên mọi nhóm đều tốt", "Có. Con số 92,5% được tính theo dữ liệu lệch (90% giọng Bắc) nên che giấu nhóm giọng Trung chỉ được nhận đúng 68 câu trên 100 và nhóm từ 60 tuổi 52 câu trên 100", "Có, vì người nói giọng Trung nói không rõ"], "a": 1, "why": "Phép tính không bắt buộc: theo tỉ lệ dữ liệu huấn luyện, 0,90 × 95 + 0,06 × 68 + 0,04 × 74 ≈ 92,5%; theo người dùng thật, 0,45 × 95 + 0,25 × 68 + 0,30 × 74 ≈ 82%. Phiên bản 2 theo người dùng thật: 0,45 × 93 + 0,25 × 89 + 0,30 × 90 ≈ 91%, không nhóm nào dưới 85. Phép tính khoảng 82% không dùng để kết luận mức đạt."}, {"q": "Chọn các ý mô tả đúng hậu quả khi dữ liệu thiếu một nhóm.", "opts": ["Mô hình có ít mẫu của nhóm đó nên kết quả với nhóm đó là bị nhận sai nhiều", "Người dùng phải nói lại nhiều lần, tìm sai sách, ngại dùng, dần không dùng thư viện: không công bằng, dù không ai cố ý phân biệt", "Do người nói “nói sai”, chỉ cần nói to hơn là hết lỗi", "Không ảnh hưởng chất lượng sản phẩm"], "a": [0, 1], "why": "Dữ liệu thiếu một nhóm làm nhóm đó bị nhận sai nhiều hơn, bị thiệt dù không ai cố ý phân biệt. Khác biệt về giọng nói, tuổi tác là bình thường, cần được tôn trọng."}, {"q": "Phiếu học tập số 2, câu 2: vì sao cần huấn luyện AI theo hướng không phân biệt đối xử, tôn trọng sự đa dạng? Chọn đáp án có một lí do về quyền lợi và một lí do về chất lượng sản phẩm.", "opts": ["Quyền lợi: mọi người dùng thư viện có quyền được phục vụ như nhau; giọng vùng miền, tuổi tác là bình thường, không phải lỗi của người nói. Chất lượng: AI dùng cho nhiều người thì phải hoạt động tốt với tất cả; nếu không sẽ mất lòng tin và gây thiệt hại lặp lại với cùng một nhóm", "Chỉ viết “để công bằng”", "Người dùng nhóm ít người nên tự đổi cách nói"], "a": 0, "why": "Chưa thấy minh chứng nếu HS chỉ viết “để công bằng” mà không nói ai được lợi gì; chưa thấy minh chứng nếu lí do đổ lỗi cho người dùng."}, {"q": "Câu hỏi then chốt: Điều gì có thể làm kết luận thay đổi?", "opts": ["Kết quả ở đây là mô phỏng. Khi thử thật, nếu đã bổ sung dữ liệu mà một nhóm vẫn bị nhận sai nhiều thì cần xem lại cả cách thiết kế, cách gắn nhãn, nơi sử dụng (nơi ồn); nếu mỗi nhóm chỉ được thử vài câu thì kết quả chưa đủ chắc chắn", "Không điều gì, kết luận luôn đúng", "Chỉ khi người dùng đổi giọng"], "a": 0, "why": "Dữ liệu là một nguyên nhân quan trọng bên cạnh cách thiết kế, gắn nhãn, sử dụng; luôn nêu bằng chứng và điều có thể làm kết luận thay đổi."}, {"q": "Ví dụ khác (gợi ý cho nhóm khá): ứng dụng nhận dạng ảnh chỉ học từ ảnh đủ sáng. Điều gì xảy ra?", "opts": ["Người chụp ở nơi thiếu sáng bị nhận kém", "Mọi người đều được nhận đúng", "Chỉ người chụp ở nơi đủ sáng bị nhận kém"], "a": 0, "why": "Tương tự, ứng dụng gợi ý cỡ áo chỉ học từ số đo HS lớp 6, phần lớn là HS nam, thì HS nữ và HS lớp 7 đến lớp 9 dễ bị gợi ý sai cỡ. GV có thể nêu ba cách nhìn về công bằng khi kết luận; HS không cần dùng các thuật ngữ này."}]}, {"type": "flag", "tag": "HĐ3 • Luyện tập", "title": "Rà soát kế hoạch thu thập dữ liệu", "nav": "Rà soát kế hoạch", "icon": "📝", "badge": "Người rà soát", "intro": "Kế hoạch nháp thu dữ liệu cho phiên bản mới (giả định): ghi âm 20 thành viên câu lạc bộ, đều là HS lớp 8, lớp 9. Dùng ba câu hỏi rà soát: Ai được đại diện? Ai bị bỏ sót? Dữ liệu đã đa dạng, gần với người dùng thật chưa? Gắn cờ các mục chưa công bằng hoặc chưa tôn trọng người tham gia hoặc người dùng; các dòng cuối là mẫu phiếu đồng ý (gợi ý) để đối chiếu.", "cols": ["Mục", "Nội dung"], "flagWhat": "có vấn đề về công bằng hoặc chưa tôn trọng người tham gia", "rows": [{"c": ["(a) Người nói", "Ghi âm 20 thành viên câu lạc bộ, đều là HS lớp 8, lớp 9: 17 bạn giọng Bắc, 2 bạn giọng Trung, 1 bạn giọng Nam; 15 bạn nam, 5 bạn nữ. Mỗi bạn đọc 60 câu lệnh, tổng 1 200 đoạn."], "bad": true, "why": "Giọng Bắc và HS được đại diện quá mức; giọng Trung, giọng Nam thiếu; người lớn và người từ 60 tuổi bị bỏ sót hoàn toàn. Chỉ có 20 người nói, mỗi người 60 câu: ít người, kém đa dạng; lệch về giới. Gợi ý tính: 17 × 60 = 1 020; 2 × 60 = 120; 1 × 60 = 60."}, {"c": ["(b) Hoàn cảnh", "Ghi âm trong phòng máy yên tĩnh sau giờ học."], "bad": true, "why": "Chỉ ghi nơi yên tĩnh trong khi thư viện có tiếng ồn, nên bỏ sót hoàn cảnh sử dụng thật."}, {"c": ["(c) Bổ sung giọng Nam", "Nếu thiếu giọng Nam, tải video trên mạng xã hội về cắt lấy tiếng."], "bad": true, "why": "Lấy giọng người khác trên mạng khi chưa được phép là chưa tôn trọng người tham gia hoặc người dùng."}, {"c": ["(d) Lưu tệp", "Lưu tệp theo họ tên và lớp của người nói."], "bad": true, "why": "Làm lộ danh tính người nói."}, {"c": ["(e) Làm sạch dữ liệu", "Bỏ bớt mẫu “giọng khó nghe” cho dữ liệu sạch."], "bad": true, "why": "Gọi giọng vùng miền là “khó nghe” rồi loại bỏ, làm dữ liệu càng thiếu đa dạng. Kế hoạch chưa có bước xin đồng ý (kể cả cha mẹ HS), quyền rút lại, thời hạn lưu trữ."}, {"c": ["Mẫu phiếu đồng ý: Mục đích", "Làm trợ lí tìm sách cho thư viện trường."], "bad": false}, {"c": ["Mẫu phiếu đồng ý: Việc người tham gia làm", "Đọc 10 câu lệnh tên sách, không nói tên mình."], "bad": false}, {"c": ["Mẫu phiếu đồng ý: Bảo quản", "Bản ghi được đặt mã số, chỉ lưu trên máy của nhà trường và chỉ dùng cho mục đích trên."], "bad": false}, {"c": ["Mẫu phiếu đồng ý: Thời hạn lưu trữ", "Đến khi kết thúc dự án (ghi rõ ngày), sau đó xoá."], "bad": false}, {"c": ["Mẫu phiếu đồng ý: Quyền rút lại", "Người tham gia có thể rút lại sự đồng ý bất cứ lúc nào, không cần nêu lí do; bản ghi của người rút lại được xoá. Chữ kí người tham gia (và cha mẹ, nếu dưới 18 tuổi)."], "bad": false}], "after": "Mục chưa tôn trọng người tham gia hoặc người dùng: mục (c) lấy giọng người khác trên mạng khi chưa được phép; mục (d) làm lộ danh tính người nói; mục (e) gọi giọng vùng miền là “khó nghe” rồi loại bỏ. Gợi ý xếp theo mức nghiêm trọng: mục (c), (d) xếp trước vì xâm phạm quyền của người khác và làm lộ danh tính; việc bỏ sót hoàn toàn người lớn, người từ 60 tuổi xếp tiếp vì làm các nhóm này bị phục vụ kém nhất. Dữ liệu “dễ lấy nhất” thường bỏ sót nhóm cần được phục vụ; kế hoạch thu thập phải được rà soát trước khi thực hiện. Chọn dữ liệu và rà soát kế hoạch là trách nhiệm của người làm AI."}, {"type": "match", "tag": "HĐ3 • Luyện tập", "title": "Phiếu học tập số 1, phần C: bảng rà soát", "nav": "Phần C: bảng rà soát", "icon": "📊", "badge": "Người đối chiếu số liệu", "intro": "Phần C. Rà soát kế hoạch thu thập dữ liệu. Ghép mỗi nhóm người dùng (kèm tỉ lệ người dùng thật) với số đoạn và tỉ lệ trong kế hoạch nháp cùng nhận xét. Cột thứ ba ghi ước lượng “nhiều”, “ít”, “không có” là đạt; tính phần trăm là việc không bắt buộc.", "pairs": [["Giọng Bắc (người dùng thật 45%)", "1 020 đoạn, 85%: Đại diện quá mức"], ["Giọng Trung (25%)", "120 đoạn, 10%: Thiếu"], ["Giọng Nam (30%)", "60 đoạn, 5%: Thiếu nhiều nhất, ít hơn 6 lần so với cần"], ["HS 11–15 tuổi (70%)", "1 200 đoạn, 100%: Đại diện quá mức"], ["Người lớn dưới 60 tuổi (20%)", "Không có: Bị bỏ sót hoàn toàn"], ["Từ 60 tuổi (10%)", "Không có: Bị bỏ sót hoàn toàn"], ["Nam và nữ (khoảng 50% mỗi giới)", "Nam 75%, nữ 25%: Lệch về giới"]], "why": "Giọng Bắc và HS được đại diện quá mức; giọng Trung, giọng Nam thiếu; người lớn và người từ 60 tuổi bị bỏ sót hoàn toàn. Dữ liệu chưa đa dạng: ít người nói, lệch giới, chỉ ghi âm nơi yên tĩnh, chưa gần với người dùng thật. Hoàn cảnh ghi âm: chỉ ghi nơi yên tĩnh trong khi thư viện có tiếng ồn. Chỉ có 20 người nói, mỗi người 60 câu: ít người, kém đa dạng."}, {"type": "build", "tag": "HĐ4 • Vận dụng", "title": "Phương án thu thập dữ liệu đã điều chỉnh", "nav": "Phương án mới", "icon": "🛠️", "badge": "Kiến trúc sư dữ liệu", "intro": "Phần D. Điều chỉnh kế hoạch nháp thành phương án mới cho trợ lí thư viện, dựa vào bảng đã sửa ở phần C; phương án cần đủ các nhóm người dùng và có xin đồng ý. Đây là nhiệm vụ mở, chấp nhận phương án khác nếu có lí do; chỉ lập trên giấy, không ghi âm giọng HS. Tham khảo mẫu phiếu đồng ý. Nhóm khá làm thêm thẻ phân hoá. Gợi ý chung: tỉ lệ nên gần tỉ lệ người dùng thật, nhưng nhóm ít người hoặc đang có kết quả thấp (như nhóm từ 60 tuổi trong mô phỏng) cần đủ số mẫu.", "fields": [{"id": "g", "label": "Theo vùng giọng và theo tuổi; tìm người tham gia ở đâu?", "hint": "Nhóm cần bổ sung và nơi tìm người", "ph": "Bắc 40% (480 đoạn), Trung 30% (360), Nam 30% (360); HS 11–15 tuổi 60% (720), người lớn dưới 60 tuổi 25% (300), từ 60 tuổi 15% (180)"}, {"id": "n", "label": "Giới, số người nói và nguồn người tham gia", "hint": "Số người nói, số câu mỗi người", "ph": "Nam 50%, nữ 50% (600 và 600). Ít nhất 120 người nói khác nhau, mỗi người không quá 10 câu. HS các khối 6 đến 9 tự nguyện qua GV chủ nhiệm; GV, nhân viên; phụ huynh; ông bà đưa đón HS; câu lạc bộ đọc sách của phường"}, {"id": "h", "label": "Hoàn cảnh ghi âm", "hint": "Giống nơi dùng thật", "ph": "50% ghi trong phòng yên tĩnh, 50% ghi tại thư viện có tiếng ồn nền (tiếng lật sách, bước chân, quạt); chỉ người đã đồng ý nói vào máy"}, {"id": "d", "label": "Xin đồng ý, quyền rút lại, thời hạn lưu trữ, ẩn danh và bảo quản", "hint": "Ai đồng ý, ghi những gì", "ph": "Phiếu đồng ý ghi
